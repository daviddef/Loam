clear to solid is this and nothing else.","supported":true,"src":"https://en.wikipedia.org/wiki/Denaturation_(biochemistry)"},{"in":["glucose","phosphorus"],"out":"atp","why":"A sugar, a base and three phosphates. Snapping the last phosphate off releases the energy for almost everything you do, and you recycle your own body weight of it daily.","supported":true,"src":"https://en.wikipedia.org/wiki/Adenosine_triphosphate"},{"in":["atp","nitrogen"],"out":"nucleotide","why":"Sugar, phosphate and a nitrogen-rich base. ATP is itself one of these — the cell uses the same part for energy and for information.","supported":true,"src":"https://en.wikipedia.org/wiki/Nucleotide"},{"in":["nucleotide","nucleotide"],"out":"dna","why":"Phosphate bridges the sugars into a backbone and the bases pair across the middle. Two metres of it is folded into every cell you have.","supported":true,"src":"https://en.wikipedia.org/wiki/DNA"},{"in":["protein","olive_oil"],"out":"membrane","why":"Fat tails will not tolerate water, so they turn inward and form a double sheet on their own. Proteins sit in it as doors and pumps.","supported":true,"src":"https://en.wikipedia.org/wiki/Cell_membrane"},{"in":["membrane","dna"],"out":"cell","why":"An inside, a set of instructions, and machinery to read them. Everything you have ever eaten was made of these.","supported":true,"src":"https://en.wikipedia.org/wiki/Cell_(biology)"},{"in":["cell","cell"],"out":"tissue","why":"Cells that stick to each other and specialise. Sticking together at all was the hard part — it took life about three billion years.","supported":true,"src":"https://en.wikipedia.org/wiki/Tissue_(biology)"},{"in":["tissue","protein"],"out":"muscle","why":"Two proteins, actin and myosin, ratcheting past one another. Every movement you have ever made is that, repeated.","supported":true,"src":"https://en.wikipedia.org/wiki/Muscle"},{"in":["muscle"],"verb":"cut","out":"meat","why":"Meat is muscle, rested. Everything above this line — the cell, the protein, the amino acid, the carbon — was already in it.","supported":true,"src":"https://en.wikipedia.org/wiki/Meat"},{"in":["protein","bone"],"out":"collagen","why":"Three chains wound into a rope, and about a third of all the protein in you. It is what holds a body together rather than what makes it move.","supported":true,"src":"https://en.wikipedia.org/wiki/Collagen"},{"in":["collagen"],"verb":"heat","out":"gelatin","why":"Long slow heat unwinds the triple helix into loose strands that grab water as they cool. This is why a good stock sets in the fridge.","supported":true,"src":"https://en.wikipedia.org/wiki/Gelatin"},{"in":["gelatin","broth"],"out":"aspic","why":"Extra gelatin makes the set reliable rather than hopeful — useful when the bones were lean.","supported":true,"src":"https://en.wikipedia.org/wiki/Aspic"},{"in":["protein","atp"],"out":"enzyme","why":"A pocket shaped to hold one molecule and strain it toward breaking. Nearly every step in this whole game is an enzyme doing its job.","supported":true,"src":"https://en.wikipedia.org/wiki/Enzyme"},{"in":["enzyme","grain"],"out":"malt","why":"Malting is just letting the grain make its own enzymes. Add them directly and you skip the germination entirely — which is what industrial brewing does.","supported":true,"src":"https://en.wikipedia.org/wiki/Malting"},{"in":["protein","vinegar"],"out":"curd","why":"Acid unfolds casein as surely as heat does, and the unfolded chains tangle and drop out of the liquid.","supported":true,"src":"https://en.wikipedia.org/wiki/Curdling"},{"in":["nucleotide","phosphorus"],"out":"dna","supported":true,"why":"Phosphate is the bridge: it links the sugar of one nucleotide to the sugar of the next, and that backbone is what makes DNA a chain rather than a pile.","src":"https://en.wikipedia.org/wiki/Phosphodiester_bond"},{"in":["dna"],"verb":"cut","out":"nucleotide","supported":true,"why":"Enzymes cut DNA back into its links. Restriction enzymes do it at specific sequences, which is the whole basis of genetic engineering.","src":"https://en.wikipedia.org/wiki/Restriction_enzyme"},{"in":["protein","butter"],"out":"membrane","supported":true,"why":"Any lipid will form a bilayer. The tails are what refuse water, and it happens on its own the moment they are wet.","src":"https://en.wikipedia.org/wiki/Lipid_bilayer"},{"in":["tissue"],"verb":"cut","out":"cell","supported":true,"why":"Dissociating tissue back into single cells is routine lab work — enzymes digest the matrix holding them together.","src":"https://en.wikipedia.org/wiki/Cell_culture"},{"in":["cell","protein"],"out":"tissue","supported":true,"why":"Cells alone are a suspension. What makes tissue is the protein scaffold between them holding everyone in place.","src":"https://en.wikipedia.org/wiki/Extracellular_matrix"},{"in":["tissue","atp"],"out":"muscle","supported":true,"why":"Muscle without ATP cannot let go. Rigor mortis is exactly that — the filaments locked because the energy to release them has run out.","src":"https://en.wikipedia.org/wiki/Rigor_mortis"},{"in":["tissue","bone"],"out":"collagen","supported":true,"why":"Skin, tendon, cartilage and bone are all collagen with different things packed around it.","src":"https://en.wikipedia.org/wiki/Collagen"},{"in":["collagen","water"],"out":"gelatin","supported":true,"why":"Hot water hydrolyses the triple helix apart. Cold water will not do it, which is why stock has to simmer.","src":"https://en.wikipedia.org/wiki/Gelatin"},{"in":["yeast","protein"],"out":"enzyme","supported":true,"why":"Yeast is a chemical factory that leaks. Brewers and bakers have exploited its enzymes for millennia without knowing they existed.","src":"https://en.wikipedia.org/wiki/Enzyme"},{"in":["starch","protein"],"out":"dough","supported":true,"why":"Dough is starch held in a protein net. Take the protein away and you have a paste that will not rise.","src":"https://en.wikipedia.org/wiki/Dough"},{"in":["bone"],"verb":"crush","out":"carbon","supported":true,"why":"Bone char is carbon with the calcium left in. Sugar refineries used it for centuries to whiten syrup.","src":"https://en.wikipedia.org/wiki/Bone_char"},{"in":["meadow","sun"],"out":"oxygen","supported":true,"why":"A hectare of growing plants releases several tonnes of oxygen a year, all of it split out of water.","src":"https://en.wikipedia.org/wiki/Photosynthesis"},{"in":["steam","carbon"],"out":"hydrogen","supported":true,"why":"The same water gas reaction, run on pure carbon rather than charcoal. Most industrial hydrogen still comes from steam and a fossil carbon source.","src":"https://en.wikipedia.org/wiki/Steam_reforming"},{"in":["legume"],"verb":"wait","out":"nitrogen","supported":true,"why":"When the legume dies the fixed nitrogen is released into the soil. Red clover can leave 50 to 200 pounds an acre behind.","src":"https://en.wikipedia.org/wiki/Nitrogen_fixation"},{"in":["egg"],"verb":"ferment","out":"sulfur","supported":true,"why":"The smell of a rotten egg is hydrogen sulfide — bacteria stripping the sulfur out of the egg's own cysteine.","src":"https://en.wikipedia.org/wiki/Hydrogen_sulfide"},{"in":["ash","bone"],"out":"phosphorus","supported":true,"why":"Bone ash is calcium phosphate. Ground and treated with acid it became the first artificial fertiliser.","src":"https://en.wikipedia.org/wiki/Bone_ash"},{"in":["plant","root"],"out":"legume","supported":true,"why":"Legumes are just plants that struck a bargain: sugar down to the bacteria, fixed nitrogen back up.","src":"https://en.wikipedia.org/wiki/Legume"},{"in":["fish"],"verb":"cut","out":"bone","supported":true,"why":"Fish bones are thin and give up their collagen in twenty minutes. Any longer and the stock turns bitter.","src":"https://en.wikipedia.org/wiki/Stock_(food)"},{"in":["yeast","glucose"],"out":"carbon_dioxide","supported":true,"why":"Yeast eats sugar and breathes out carbon dioxide. Every risen loaf and every bubble in beer is this gas trying to escape.","src":"https://en.wikipedia.org/wiki/Fermentation"},{"in":["starch","enzyme"],"out":"glucose","supported":true,"why":"Amylase cuts starch back into sugar. It is in your saliva — chew bread long enough and it turns sweet in your mouth.","src":"https://en.wikipedia.org/wiki/Amylase"},{"in":["potato"],"verb":"crush","out":"starch","supported":true,"why":"Grate a potato into water and the starch settles out as a white sludge. Wash and dry it and you have pure starch.","src":"https://en.wikipedia.org/wiki/Starch"},{"in":["protein","water"],"out":"amino_acid","supported":true,"why":"Digestion is hydrolysis: enzymes put a water molecule back into every peptide bond and take the chain apart link by link.","src":"https://en.wikipedia.org/wiki/Hydrolysis"},{"in":["keratin"],"verb":"crush","out":"cysteine","supported":true,"why":"Industrial cysteine is still extracted from hair and feathers, because keratin is unusually rich in it.","src":"https://en.wikipedia.org/wiki/Cysteine"},{"in":["polypeptide"],"verb":"cut","out":"dipeptide","supported":true,"why":"Proteases cut chains at specific points. Your stomach is doing this to everything you have eaten today.","src":"https://en.wikipedia.org/wiki/Protease"},{"in":["dipeptide","dipeptide"],"out":"polypeptide","supported":true,"why":"Chains join to chains. Length is what turns a peptide into a protein, and the line between them is a matter of convention.","src":"https://en.wikipedia.org/wiki/Peptide","releases":"water"},{"in":["polypeptide","disulfide"],"out":"protein","supported":true,"why":"Cross-links lock a fold in place. Proteins that have to survive outside a cell — like keratin and insulin — are full of them.","src":"https://en.wikipedia.org/wiki/Protein"},{"in":["cysteine","oxygen"],"out":"disulfide","supported":true,"why":"Two cysteines oxidise and bond, losing two hydrogens. It happens on contact with air, which is why cut hair smells the way it does when burnt.","src":"https://en.wikipedia.org/wiki/Disulfide"},{"in":["protein","sulfur"],"out":"keratin","supported":true,"why":"The more sulfur cross-links, the harder the keratin. Hair is soft, hoof is hard, and the difference is density of disulfide bonds.","src":"https://en.wikipedia.org/wiki/Keratin"},{"in":["protein","salt"],"out":"denatured_protein","supported":true,"why":"Salt unfolds protein as surely as heat does. Curing, brining and salting fish are all denaturation without a fire.","src":"https://en.wikipedia.org/wiki/Denaturation_(biochemistry)"},{"in":["glucose","oxygen"],"out":"atp","supported":true,"why":"Respiration: burn one glucose with oxygen and you get about 30 ATP. Fermentation without oxygen gets two, which is why you breathe.","src":"https://en.wikipedia.org/wiki/Cellular_respiration"},{"in":["yoghurt","kimchi_paste"],"out":"garlic_yoghurt","supported":true,"why":"Any raw allium works. The yoghurt's acid and fat blunt the harshness without cooking it away.","src":"https://en.wikipedia.org/wiki/Tzatziki"},{"in":["boiled_egg","herb_oil"],"out":"egg_mayo","supported":true,"why":"Herb oil emulsifies as readily as plain oil and brings its own seasoning with it.","src":"https://en.wikipedia.org/wiki/Egg_salad"},{"in":["polypeptide","water"],"out":"alpha_helix","why":"Folding is not the chain pulling itself together — it is water pushing. Greasy side chains are driven inward, and the backbone settles into a spring held by hydrogen bonds between residue n and residue n+4, 3.6 residues to a turn.","supported":true,"src":"https://en.wikipedia.org/wiki/Protein_folding"},{"in":["polypeptide","polypeptide"],"out":"beta_sheet","why":"Two stretched chains lie alongside each other and hydrogen-bond across the gap, pleating like a folded fan. Spider dragline silk is mostly this, which is why it out-pulls steel of the same weight.","supported":true,"src":"https://en.wikipedia.org/wiki/Beta_sheet"},{"in":["alpha_helix","beta_sheet"],"out":"protein","why":"Helices and sheets are the second level; packing them against each other is the third. Anfinsen showed the packing is decided by the sequence alone — unfold a protein, remove the poison, and it folds straight back.","supported":true,"src":"https://en.wikipedia.org/wiki/Protein_tertiary_structure"},{"in":["nucleotide","protein"],"out":"ribosome","why":"Two thirds RNA by mass, and the RNA is not scaffolding: the bond-forming site has no protein within 18 angstroms of it. The ribosome is a ribozyme.","supported":true,"src":"https://en.wikipedia.org/wiki/Ribosome"},{"in":["dna","enzyme"],"out":"messenger_rna","why":"RNA polymerase opens the double helix and copies one strand, swapping thymine for uracil. It does not need a primer to start, which is the main thing separating it from the machinery that copies DNA.","supported":true,"src":"https://en.wikipedia.org/wiki/Transcription_(biology)"},{"in":["messenger_rna","ribosome"],"out":"polypeptide","why":"Translation: the ribosome reads three bases at a time and adds one amino acid per codon, about 20 a second in a bacterium. This is the step that turns a sequence into a substance.","supported":true,"src":"https://en.wikipedia.org/wiki/Translation_(biology)"},{"in":["keratin"],"verb":"cut","out":"alpha_helix","why":"Keratin is helices wound around each other into a rope, then roped again. Cut the rope apart and you are back to the single coil it was built from — which is why hair stretches, and why it springs back.","supported":true,"src":"https://en.wikipedia.org/wiki/Keratin"},{"in":["denatured_protein"],"verb":"wait","out":"beta_sheet","why":"An unfolded chain left alone does not stay loose. Stretches of it line up with its neighbours into sheets and stack — the same fold, whatever protein it started as. That stack is amyloid.","supported":true,"src":"https://en.wikipedia.org/wiki/Amyloid"},{"in":["cell"],"verb":"cut","out":"ribosome","why":"This is how they were found. Break the cell open, spin the soup hard enough, and the ribosomes come down as a pellet — Palade saw them in 1955 and they were called Palade granules first.","supported":true,"src":"https://en.wikipedia.org/wiki/Cell_fractionation"},{"in":["dna","nucleotide"],"out":"messenger_rna","why":"The template gives the order; the loose nucleotides are the letters. RNA polymerase runs along the open strand at about 40 bases a second, pairing each one and leaving the DNA to zip back up behind it.","supported":true,"src":"https://en.wikipedia.org/wiki/RNA_polymerase"}],"verbs":[{"id":"wait","name":"Wait","emoji":"⏳","unlockedBy":null,"blurb":"Growth, weathering, ageing, decay. Some changes only need time."},{"id":"crush","name":"Crush","emoji":"🪨","unlockedBy":null,"blurb":"Grinding, pressing, milling, churning. Force applied without heat."},{"id":"chill","name":"Chill","emoji":"❄️","unlockedBy":null,"blurb":"Cold is not a technology, it is a night. Available from the start."},{"id":"heat","name":"Heat","emoji":"🔥","unlockedBy":"fire","blurb":"The first tool that makes new molecules rather than smaller pieces."},{"id":"cut","name":"Cut","emoji":"🔪","unlockedBy":"flint","blurb":"Separating one thing into parts. Needs an edge."},{"id":"ferment","name":"Ferment","emoji":"🫧","unlockedBy":"yeast","blurb":"Letting microbes do the work. Controlled, delicious rot."}],"bedrock":{"$comment":"The substrate below the game. NEVER craftable, never on the shelf — it only appears at the bottom of a provenance tree, so the chain ends in real chemistry instead of stopping at a rock. Composition, not provenance: the craft tree says where a thing came from, this says what it is made of.","atoms":[{"id":"el_hydrogen","symbol":"H","number":1,"name":"Hydrogen","srcTitle":"Hydrogen","fact":"The first element, made in the first minutes of the universe. Everything else came later.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Hydrogen","kind":"atom","category":"nonmetal"},{"id":"el_helium","symbol":"He","number":2,"name":"Helium","srcTitle":"Helium","fact":"The ash of the Sun. Four hydrogen nuclei, fused, with a little mass left over as light.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Helium","kind":"atom","category":"noble"},{"id":"el_lithium","symbol":"Li","number":3,"name":"Lithium","srcTitle":"Lithium","src":"https://en.wikipedia.org/wiki/Lithium","kind":"atom","category":"alkali"},{"id":"el_beryllium","symbol":"Be","number":4,"name":"Beryllium","srcTitle":"Beryllium","src":"https://en.wikipedia.org/wiki/Beryllium","kind":"atom","category":"alkaline"},{"id":"el_boron","symbol":"B","number":5,"name":"Boron","srcTitle":"Boron","src":"https://en.wikipedia.org/wiki/Boron","kind":"atom","category":"metalloid"},{"id":"el_carbon","symbol":"C","number":6,"name":"Carbon","srcTitle":"Carbon","fact":"Four bonds, in every direction, endlessly. Every molecule life is built from hangs off carbon.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Carbon","kind":"atom","category":"nonmetal"},{"id":"el_nitrogen","symbol":"N","number":7,"name":"Nitrogen","srcTitle":"Nitrogen","fact":"Four fifths of the air, and almost impossible for life to reach until something fixes it.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Nitrogen","kind":"atom","category":"nonmetal"},{"id":"el_oxygen","symbol":"O","number":8,"name":"Oxygen","srcTitle":"Oxygen","fact":"Most of your body's mass. Forged inside stars and scattered when they died.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Oxygen","kind":"atom","category":"nonmetal"},{"id":"el_fluorine","symbol":"F","number":9,"name":"Fluorine","srcTitle":"Fluorine","src":"https://en.wikipedia.org/wiki/Fluorine","kind":"atom","category":"halogen"},{"id":"el_neon","symbol":"Ne","number":10,"name":"Neon","srcTitle":"Neon","src":"https://en.wikipedia.org/wiki/Neon","kind":"atom","category":"noble"},{"id":"el_sodium","symbol":"Na","number":11,"name":"Sodium","srcTitle":"Sodium","fact":"Half of salt, and the reason a nerve can fire.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Sodium","kind":"atom","category":"alkali"},{"id":"el_magnesium","symbol":"Mg","number":12,"name":"Magnesium","srcTitle":"Magnesium","fact":"One atom sits at the centre of every chlorophyll molecule. Green is magnesium.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Magnesium","kind":"atom","category":"alkaline"},{"id":"el_aluminium","symbol":"Al","number":13,"name":"Aluminium","srcTitle":"Aluminium","fact":"The commonest metal in the crust, and locked so tightly into rock it was a precious metal until 1886.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Aluminium","kind":"atom","category":"post"},{"id":"el_silicon","symbol":"Si","number":14,"name":"Silicon","srcTitle":"Silicon","fact":"After oxygen, the commonest element in the crust. Every rock, every grain of sand.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Silicon","kind":"atom","category":"metalloid"},{"id":"el_phosphorus","symbol":"P","number":15,"name":"Phosphorus","srcTitle":"Phosphorus","fact":"Carries the energy and holds the DNA backbone together. The scarcest of the six.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Phosphorus","kind":"atom","category":"nonmetal"},{"id":"el_sulfur","symbol":"S","number":16,"name":"Sulfur","srcTitle":"Sulfur","fact":"Two amino acids carry it. It is also why onion and garlic fight back.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Sulfur","kind":"atom","category":"nonmetal"},{"id":"el_chlorine","symbol":"Cl","number":17,"name":"Chlorine","srcTitle":"Chlorine","fact":"The other half of salt. Lethal as a gas, essential as an ion.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Chlorine","kind":"atom","category":"halogen"},{"id":"el_argon","symbol":"Ar","number":18,"name":"Argon","srcTitle":"Argon","src":"https://en.wikipedia.org/wiki/Argon","kind":"atom","category":"noble"},{"id":"el_potassium","symbol":"K","number":19,"name":"Potassium","srcTitle":"Potassium","fact":"Leached out of ash as potash. Plants cannot grow without it.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Potassium","kind":"atom","category":"alkal ery living thing on Earth, all the same handedness. No exception has ever been found.","src":"https://en.wikipedia.org/wiki/Amino_acid","kind":"compound","tier":"monomer","variants":["bed_glycine","bed_alanine","bed_serine","bed_cysteine","bed_threonine","bed_valine","bed_leucine","bed_isoleucine","bed_proline","bed_phenylalanine","bed_tyrosine","bed_tryptophan","bed_aspartate","bed_glutamate","bed_asparagine","bed_glutamine","bed_lysine","bed_arginine","bed_histidine","bed_methionine"]},{"id":"bed_protein","name":"Protein","srcTitle":"Protein","of":["bed_tertiary_fold"],"fact":"A chain folded into one specific shape. The shape is the function — and it is decided entirely by the order of the links.","src":"https://en.wikipedia.org/wiki/Protein","kind":"compound","note":"Built from the twenty amino acids. Each bond formed releases one water molecule, which is why a residue in a chain is lighter than the free acid it came from.","tier":"structure","via":"folding"},{"id":"bed_fatty_acid","name":"Fatty Acid","srcTitle":"Fatty acid","of":["el_carbon","el_hydrogen","el_oxygen"],"fact":"A long carbon tail that will not mix with water. That refusal is what makes a cell membrane possible.","src":"https://en.wikipedia.org/wiki/Fatty_acid","kind":"compound","tier":"monomer"},{"id":"bed_lipid","name":"Fat","srcTitle":"Lipid","of":["bed_fatty_acid","bed_glycerol"],"fact":"Twice the energy per gram of sugar, which is why seeds and animals both store it.","src":"https://en.wikipedia.org/wiki/Lipid","kind":"compound","tier":"polymer","via":"ester"},{"id":"bed_nucleotide","name":"Nucleotide","srcTitle":"Nucleotide","of":["el_carbon","el_hydrogen","el_oxygen","el_nitrogen","el_phosphorus"],"fact":"Sugar, phosphate and a base. Four of them spell out everything alive.","src":"https://en.wikipedia.org/wiki/Nucleotide","kind":"compound","tier":"monomer"},{"id":"bed_dna","name":"DNA","srcTitle":"DNA","of":["bed_nucleotide"],"fact":"The instructions for building the thing you are holding, written in four letters.","src":"https://en.wikipedia.org/wiki/DNA","kind":"compound","tier":"polymer","via":"phosphodiester"},{"id":"bed_chlorophyll","name":"Chlorophyll","srcTitle":"Chlorophyll","of":["el_carbon","el_hydrogen","el_oxygen","el_nitrogen","el_magnesium"],"fact":"Catches the photon and hands its energy to chemistry. One magnesium atom sits at the centre.","src":"https://en.wikipedia.org/wiki/Chlorophyll","kind":"compound","formula":"C55H72MgN4O5","tier":"molecule"},{"id":"bed_photon","name":"Sunlight","srcTitle":"Photon","of":[],"fact":"Eight minutes and nineteen seconds old when it reaches the leaf. Not matter at all — the only thing here that is pure energy.","src":"https://en.wikipedia.org/wiki/Photon","kind":"particle","tier":"particle"},{"id":"bed_fusion","name":"Hydrogen Fusion","srcTitle":"Proton–proton chain","of":["el_hydrogen","el_helium","bed_photon"],"fact":"Four hydrogen nuclei become one helium, and the missing mass leaves as light. That light is the entire energy budget of this game.","src":"https://en.wikipedia.org/wiki/Proton%E2%80%93proton_chain","kind":"compound","tier":"particle"},{"id":"bed_glycerol","kind":"compound","tier":"molecule","name":"Glycerol","formula":"C3H8O3","of":["el_carbon","el_hydrogen","el_oxygen"],"srcTitle":"Glycerol","fact":"A three-carbon spine with three hooks. Hang a fatty acid on each and you have a fat.","src":"https://en.wikipedia.org/wiki/Glycerol"},{"id":"bed_polypeptide","kind":"compound","tier":"polymer","name":"Polypeptide Chain","of":["bed_amino_acid"],"via":"peptide","srcTitle":"Peptide","fact":"Amino acids in a line, in a specific order. The order is written in DNA and read by a ribosome.","src":"https://en.wikipedia.org/wiki/Peptide"},{"id":"bed_secondary_structure","kind":"compound","tier":"structure","name":"Helix & Sheet","of":["bed_polypeptide"],"via":"hydrogen","srcTitle":"Protein secondary structure","fact":"The chain coils into helices and pleats into sheets, held only by hydrogen bonds along the backbone.","src":"https://en.wikipedia.org/wiki/Protein_secondary_structure"},{"id":"bed_tertiary_fold","kind":"compound","tier":"structure","name":"Fold","of":["bed_secondary_structure"],"via":"folding","srcTitle":"Protein tertiary structure","fact":"Helices and sheets pack into one compact shape, usually within a second of being made.","src":"https://en.wikipedia.org/wiki/Protein_tertiary_structure"},{"id":"bed_enzyme","kind":"compound","tier":"assembly","name":"Enzyme","of":["bed_protein"],"srcTitle":"Enzyme","fact":"A protein with a pocket shaped to hold one particular molecule. Nearly every step in this game is one of these doing its job.","src":"https://en.wikipedia.org/wiki/Enzyme"},{"id":"bed_membrane","kind":"compound","tier":"assembly","name":"Membrane","of":["bed_lipid","bed_protein"],"srcTitle":"Cell membrane","fact":"Two layers of fat, tails inward, because the tails will not tolerate water. Life needs an inside, and this is how it gets one.","src":"https://en.wikipedia.org/wiki/Cell_membrane"},{"id":"bed_cell","kind":"compound","tier":"cell","name":"Cell","of":["bed_membrane","bed_dna","bed_protein","bed_water_molecule"],"srcTitle":"Cell (biology)","fact":"The smallest thing that is unambiguously alive. Everything you have eaten was made of these.","src":"https://en.wikipedia.org/wiki/Cell_(biology)"},{"id":"bed_muscle_tissue","kind":"compound","tier":"tissue","name":"Muscle","of":["bed_cell","bed_protein"],"srcTitle":"Muscle tissue","fact":"Cells packed with protein filaments that ratchet past each other. Meat is this, rested.","src":"https://en.wikipedia.org/wiki/Muscle"}],"composition":{"stone":["bed_silica","bed_feldspar","bed_mica"],"water":["bed_water_molecule"],"seed":["bed_starch","bed_protein","bed_lipid","bed_dna"],"sun":["bed_fusion"],"egg":["bed_protein","bed_lipid","bed_calcium_carbonate","bed_water_molecule"],"milk":["bed_water_molecule","bed_lipid","bed_protein","bed_glucose"],"meat":["bed_muscle_tissue"],"flour":["bed_starch","bed_protein"],"honey":["bed_glucose","bed_water_molecule"],"salt":["bed_halite"],"glass":["bed_silica"],"clay":["bed_feldspar","bed_water_molecule"],"wood":["bed_cellulose"],"leaf":["bed_chlorophyll","bed_cellulose","bed_cell","bed_water_molecule"],"cheese":["bed_protein","bed_lipid","bed_calcium_carbonate","bed_water_molecule"],"yeast":["bed_cell"]},"$comment_atoms":"The full periodic table is present as a reference set. Only those marked inPlay carry authored text and appear in a provenance tree today; the rest are here so later domains (metallurgy, medicine) have somewhere to attach, and so the table reads as complete to a curious player.","$comment_visual":"kind drives shape (atom=periodic tile, compound=hexagon, particle=glow) and category drives colour. Categories are assigned by atomic number and checked for gaps and overlaps at build time.","aminos":[{"id":"bed_glycine","kind":"amino","name":"Glycine","code3":"Gly","code1":"G","residue":"C2H3NO","formula":"C2H5NO2","of":["el_carbon","el_hydrogen","el_nitrogen","el_oxygen"],"srcTitle":"Glycine","fact":"The smallest, and the only one with no handedness.","src":"https://en.wikipedia.org/wiki/Glycine"},{"id":"bed_alanine","kind":"amino","name":"Alanine","code3":"Ala","code1":"A","residue":"C3H5NO","formula":"C3H7NO2","of":["el_carbon","el_hydrogen","el_nitrogen","el_oxygen"],"srcTitle":"Alanine","fact":"The simplest with a side chain: a single carbon.","src":"https://en.wikipedia.org/wiki/Alanine"},{"id":"bed_serine","kind":"amino","name":"Serine","code3":"Ser","code1":"S","residue":"C3H5NO2","formula":"C3H7NO3","of":["el_carbon","el_hydrogen","el_nitrogen","el_oxygen"],"srcTitle":"Serine","fact":"Its spare hydroxyl is where cells attach switches.","src":"https://en.wikipedia.org/wiki/Serine"},{"id":"bed_cysteine","kind":"amino","name":"Cysteine","code3":"Cys","code1":"C","residue":"C3H5NOS","formula":"C3H7NO2S","of":["el_carbon","el_hydrogen","el_nitrogen","el_oxygen","el_sulfur"],"srcTitle":"Cysteine","fact":"Two of these bond to each other and staple a protein shut.","src":"https://en.wikipedia.org/wiki/Cysteine"},{"id":"bed_threonine","kind":"amino","name":"Threonine","code3":"Thr","code1":"T","residue":"C4H7NO2","formula":"C4H9NO3","of":["el_carbon","el_hydrogen","el_nitrogen","el_oxygen"],"srcTitle":"Threonine","fact":"Essential — you must eat it, you cannot build it.","src":"https://en.wikipedia.org/wiki/Threonine"},{"id":"bed_valine","kind":"amino","name":"Valine","code3":"Val","code1":"V","residue":"C5H9NO","formula":"C5H11NO2","of":["el_carbon","el_hydrogen","el_nitrogen","el_oxygen"],"srcTitle":"Valine","fact":"A single swap for glutamate here causes sickle-cell anaemia.","src":"https://en.wikipedia.org/wiki/Valine"},{"id":"bed_leucine","kind":"amino","name":"Leucine","code3":"Leu","code1":"L","residue":"C6H11NO","formula":"C6H13NO2","of":["el_carbon","el_hydrogen","el_nitrogen","el_oxygen"],"srcTitle":"Leucine","fact":"The commonest amino acid in most proteins.","src":"https://en.wikipedia.org/wiki/Leucine"},{"id":"bed_isoleucine","kind":"amino","name":"Isoleucine","code3":"Ile","code1":"I","residue":"C6H11NO","formula":"C6H13NO2","of":["el_carbon","el_hydrogen","el_nitrogen","el_oxygen"],"srcTitle":"Isoleucine","fact":"Same formula as leucine, different shape entirely.","src":"https://en.wikipedia.org/wiki/Isoleucine"},{"id":"bed_proline","kind":"amino","name":"Proline","code3":"Pro","code1":"P","residue":"C5H7NO","formula":"C5H9NO2","of":["el_carbon","el_hydrogen","el_nitrogen","el_oxygen"],"srcTitle":"Proline","fact":"Its ring kinks the chain — it is the corner piece.","src":"https://en.wikipedia.org/wiki/Proline"},{"id":"bed_phenylalanine","kind":"amino","name":"Phenylalanine","code3":"Phe","code1":"F","residue":"C9H9NO","formula":"C9H11NO2","of":["el_carbon","el_hydrogen","el_nitrogen","el_oxygen"],"srcTitle":"Phenylalanine","fact":"The one people with PKU cannot process.","src":"https://en.wikipedia.org/wiki/Phenylalanine"},{"id":"bed_tyrosine","kind":"amino","name":"Tyrosine","code3":"Tyr","code1":"Y","residue":"C9H9NO2","formula":"C9H11NO3","of":["el_carbon","el_hydrogen","el_nitrogen","el_oxygen"],"srcTitle":"Tyrosine","fact":"Raw material for adrenaline, dopamine and melanin.","src":"https://en.wikipedia.org/wiki/Tyrosine"},{"id":"bed_tryptophan","kind":"amino","name":"Tryptophan","code3":"Trp","code1":"W","residue":"C11H10N2O","formula":"C11H12N2O2","of":["el_carbon","el_hydrogen","el_nitrogen","el_oxygen"],"srcTitle":"Tryptophan","fact":"The largest, and the precursor of serotonin.","src":"https://en.wikipedia.org/wiki/Tryptophan"},{"id":"bed_aspartate","kind":"amino","name":"Aspartate","code3":"Asp","code1":"D","residue":"C4H5NO3","formula":"C4H7NO4","of":["el_carbon","el_hydrogen","el_nitrogen","el_oxygen"],"srcTitle":"Aspartate","fact":"Half of aspartame.","src":"https://en.wikipedia.org/wiki/Aspartic_acid"},{"id":"bed_glutamate","kind":"amino","name":"Glutamate","code3":"Glu","code1":"E","residue":"C5H7NO3","formula":"C5H9NO4","of":["el_carbon","el_hydrogen","el_nitrogen","el_oxygen"],"srcTitle":"Glutamate","fact":"Tastes savoury on its own — this is umami.","src":"https://en.wikipedia.org/wiki/Glutamic_acid"},{"id":"bed_asparagine","kind":"amino","name":"Asparagine","code3":"Asn","code1":"N","residue":"C4H6N2O2","formula":"C4H8N2O3","of":["el_carbon","el_hydrogen","el_nitrogen","el_oxygen"],"srcTitle":"Asparagine","fact":"First isolated from asparagus, in 1806.","src":"https://en.wikipedia.org/wiki/Asparagine"},{"id":"bed_glutamine","kind":"amino","name":"Glutamine","code3":"Gln","code1":"Q","residue":"C5H8N2O2","formula":"C5H10N2O3","of":["el_carbon","el_hydrogen","el_nitrogen","el_oxygen"],"srcTitle":"Glutamine","fact":"The most abundant free amino acid in your blood.","src":"https://en.wikipedia.org/wiki/Glutamine"},{"id":"bed_lysine","kind":"amino","name":"Lysine","code3":"Lys","code1":"K","residue":"C6H12N2O","formula":"C6H14N2O2","of":["el_carbon","el_hydrogen","el_nitrogen","el_oxygen"],"srcTitle": b together."}],"linkages":[{"id":"peptide","name":"Peptide bond","srcTitle":"Peptide bond","fact":"A carboxyl meets an amine, and one water molecule leaves. That is why a residue in a chain weighs less than the free acid.","src":"https://en.wikipedia.org/wiki/Peptide_bond"},{"id":"glycosidic","name":"Glycosidic bond","srcTitle":"Glycosidic bond","fact":"Sugar to sugar, also losing water. Whether it points up or down decides starch from cellulose.","src":"https://en.wikipedia.org/wiki/Glycosidic_bond"},{"id":"phosphodiester","name":"Phosphodiester bond","srcTitle":"Phosphodiester bond","fact":"Phosphate bridging two sugars. This is the backbone DNA hangs its letters on.","src":"https://en.wikipedia.org/wiki/Phosphodiester_bond"},{"id":"ester","name":"Ester bond","srcTitle":"Ester","fact":"Fatty acid to glycerol. Three of them make a fat.","src":"https://en.wikipedia.org/wiki/Ester"},{"id":"hydrogen","name":"Hydrogen bonding","srcTitle":"Hydrogen bond","fact":"Individually feeble, collectively decisive. It holds the helix, the sheet, and water itself together.","src":"https://en.wikipedia.org/wiki/Hydrogen_bond"},{"id":"folding","name":"Folding","srcTitle":"Protein folding","fact":"The chain collapses into one specific shape, usually in under a second. Get it wrong and you have a prion.","src":"https://en.wikipedia.org/wiki/Protein_folding"}],"cpk":{"H":"#FFFFFF","C":"#3B3B3B","N":"#3050F8","O":"#E33232","S":"#E6C619","P":"#FF8000","Mg":"#8AFF00","Ca":"#3DFF00","Na":"#AB5CF2","Cl":"#1FF01F","Si":"#F0C8A0","K":"#8F40D4","Al":"#BFA6A6","Fe":"#E06633"},"structures":{"bed_water_molecule":{"atoms":[["O",0,0],["H",-0.95,0.6],["H",0.95,0.6]],"bonds":[[0,1,1],[0,2,1]]},"bed_glycine":{"atoms":[["N",-2,0.4],["H",-2.6,-0.3],["H",-2.6,1.1],["C",-0.9,0],["H",-1,-1],["H",-1,1],["C",0.4,0.5],["O",0.5,1.6],["O",1.4,-0.2],["H",2.2,0.2]],"bonds":[[0,1,1],[0,2,1],[0,3,1],[3,4,1],[3,5,1],[3,6,1],[6,7,2],[6,8,1],[8,9,1]]},"bed_alanine":{"atoms":[["N",-2,0.4],["H",-2.6,-0.3],["H",-2.6,1.1] /* ── art renderer ─────────────────────────────────────────────────────────
 * Turns a shape record from data/art.json into inline SVG.
 *
 * No shape carries a colour. Every fill and stroke resolves to a CSS custom
 * property, so a theme is a stylesheet — not a second set of drawings.
 *
 *   lo | bs | hi          the item's own category, set by [data-cat]
 *   ik | gh               ink and ghost, global
 *   ground | discovery    surfaces, global
 *   plant-bs, fire-hi ... another category's colour, for a detail
 *   #RRGGBB               a literal — reserved for CPK atom colours
 */
function artPaint(role) {
  if (typeof role !== 'string') return 'var(--gh)';
  if (role.charCodeAt(0) === 35) return role;              // '#'
  if (role.indexOf('-') > 0) return `var(--c-${role})`;
  return `var(--${role})`;
}

function artShape(s) {
  switch (s[0]) {
    case 'p': return `<path data-f d="${s[1]}" fill="${artPaint(s[2])}"/>`;
    case 's': return `<path data-s d="${s[1]}" fill="none" stroke="${artPaint(s[2])}" ` +
                     `stroke-width="${s[3]}" stroke-linecap="round" stroke-linejoin="round"/>`;
    case 'c': return `<circle data-f cx="${s[1]}" cy="${s[2]}" r="${s[3]}" fill="${artPaint(s[4])}"/>`;
    case 'e': return `<ellipse data-f cx="${s[1]}" cy="${s[2]}" rx="${s[3]}" ry="${s[4]}" fill="${artPaint(s[5])}"/>`;
    case 'g': return `<g transform="rotate(${s[1]} ${s[2]} ${s[3]})">${s[4].map(artShape).join('')}</g>`;
    default:  return '';
  }
}

function artSVG(id, cls) {
  const rec = ART[id];
  if (!rec) return `<svg class="art${cls ? ' ' + cls : ''}" viewBox="0 0 60 60" aria-hidden="true"></svg>`;
  return `<svg class="art${cls ? ' ' + cls : ''}" viewBox="0 0 60 60" data-cat="${rec.c}" aria-hidden="true">` +
         rec.s.map(artShape).join('') + '</svg>';
}

function renderShelf() {

    .filter(([, g]) => g.length)

        .sort((a, b) => (secrets.get(b.id) ?? 0) - (secrets.get(a.id) ?? 0));
      if (!live.length) return '';

      const show = live.slice(0, cap);

        (live.length > 12 ? `<span class="cv" data-readyall>${readyAll ? 'less' : 'all'}</span>` : '') +
        `</h2><div class="shelf">` +

  aside.querySelectorAll('[data-fold]').forEach(h => h.onclick = ev => {

    ? `free play` : `${found.size} / ${elements.length}`;

// ---- the world: chips live in world coordinates; the view pans and zooms ----
const world = document.getElementById('world');
const linkSvg = document.getElementById('links');
const view = { x: 0, y: 0, k: 1 };
const links = [];                                     // {a,b,out} DOM refs

function applyView() {
  world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`;
}
// The board can report zero size in embedded or not-yet-laid-out contexts, and

// the viewport, then to a sane default, so layout is never nonsense.
function boardBox() {
  const b = board.getBoundingClientRect();
  // The fallbacks subtract the sidebar and the tool tray from the viewport.
  // If the viewport itself reads as zero — a tab that has not been sized yet —
  // that subtraction produces a NEGATIVE width, which is truthy, so it was
  // used, and every position derived from it collapsed to the origin. Clamp.
  const w = Math.max(320, b.width  || (window.innerWidth  - 240) || 900);
  const h = Math.max(320, b.height || (window.innerHeight - 120) || 600);
  return { left: b.left, top: b.top, width: w, height: h };
}

// Nothing you have made is ever destroyed by a tap. Tapping folds the branch

  chip.classList.add('leaving');
  sfx.pick();
  setTimeout(() => { chip.remove(); drawLinks(); }, 160);

    setTimeout(() => chip.classList.remove('pulse'), 380);

    linkFrame = 0; clearTimeout(linkFallback); linkFallback = 0; drawLinksNow();
  });
  // Frame callbacks do not fire in a hidden or throttled tab, and a board whose
  // lines never redraw looks broken. Guarantee the redraw either way.

// Each family's colour, for the pulses that travel the lines.
// Read from the stylesheet rather than restated here, so the mote that runs

const FAM_HEX = new Proxy({}, { get: (_, k) =>
  getComputedStyle(document.documentElement).getPropertyValue('--fam-' + String(k)).trim() || '#A3937E' });
let pathSeq = 0;

function drawLinksNow() {
  const parts = [];
  // Pulses are the expensive part, so drop them on a busy board or when the
  // player has asked for quiet. The lines themselves always draw.
  const flowing = prefs.tone === 'playful'
    && !matchMedia('(prefers-reduced-motion: reduce)').matches
    && links.length <= 40;
  for (const l of links) {
    if (!l.out.isConnected || l.out.classList.contains('hidden')) continue;
    const [ox, oy] = chipCentre(l.out);
    for (const src of [l.a, l.b]) {
      if (!src || !src.isConnected || src.classList.contains('hidden')) continue;
      const [sx, sy] = chipCentre(src);
      // A curve, not a spoke: it reads as flow rather than wiring, and two
      // parents converging on one child stop looking like a Y of straight lines.
      const my = (sy + oy) / 2;
      const d = `M ${sx} ${sy} C ${sx} ${my}, ${ox} ${my}, ${ox} ${oy}`;
      const id = `lp${++pathSeq}`;
      parts.push(`<path id="${id}" class="made${l.fresh ? ' fresh' : ''}" d="${d}"/>`);
      if (flowing) {
        // A mote of the ingredient travelling into what it becomes — gold from
        // the sun, blue from water. Offset starts so they never march in step.
        const hex = FAM_HEX[src.dataset.fam] || '#8A7B6B';
        const dur = (2.1 + (pathSeq % 5) * 0.22).toFixed(2);

          `<circle r="3.4" fill="${hex}" class="mote">` +
          `<animateMotion dur="${dur}s" repeatCount="indefinite" begin="-${(pathSeq % 7) * 0.31}s">` +

function zoomBy(f, cx, cy) {
  const b = boardBox();
  const px = cx == null ? b.width / 2 : cx - b.left;
  const py = cy == null ? b.height / 2 : cy - b.top;
  const k2 = Math.max(0.06, Math.min(2.4, view.k * f));
  view.x = px - (px - view.x) * (k2 / view.k);
  view.y = py - (py - view.y) * (k2 / view.k);
  view.k = k2;
  applyView();
}
function fitAll() {
  const chips = [...world.querySelectorAll('.chip.board')];
  if (!chips.length) return;
  const [cw, ch] = cardSize();
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  for (const c of chips) {
    const l = parseFloat(c.style.left) || 0, t = parseFloat(c.style.top) || 0;
    x1 = Math.min(x1, l); y1 = Math.min(y1, t);
    x2 = Math.max(x2, l + cw); y2 = Math.max(y2, t + ch);
  }
  const b = boardBox(), pad = 60;
  // The floor used to be 0.25, which is not far enough out to see a full bench.
  // A button called "fit everything" that shows an empty board is worse than
  // no button.
  view.k = Math.max(0.06, Math.min(1.4, Math.min((b.width - pad) / (x2 - x1 || 1),
                                                 (b.height - pad) / (y2 - y1 || 1))));

  view.y = b.height / 2 - ((y1 + y2) / 2) * view.k;

// Tidy: lay the whole bench out as the diagram it already is — sources at the

function tidy() {
  const chips = [...world.querySelectorAll('.chip.board:not(.hidden)')];
  if (!chips.length) return;
  const parents = new Map(chips.map(c => [c, []]));
  for (const l of links) {
    if (!parents.has(l.out)) continue;
    for (const p of [l.a, l.b]) if (p && parents.has(p)) parents.get(l.out).push(p);
  }
  const depth = new Map();
  const depthOf = (c, seen = new Set()) => {
    if (depth.has(c)) return depth.get(c);
    if (seen.has(c)) return 0;
    seen.add(c);
    const ps = parents.get(c) ?? [];
    const d = ps.length ? Math.max(...ps.map(p => depthOf(p, seen))) + 1 : 0;
    depth.set(c, d);
    return d;
  };
  chips.forEach(c => depthOf(c));
  const rows = new Map();
  for (const c of chips) {
    const d = depth.get(c);
    if (!rows.has(d)) rows.set(d, []);
    rows.get(d).push(c);
  }
  const b = boardBox();
  const [ox, oy] = toWorld(b.left + 40, b.top + 40);
  const rowH = 78;
  let y = oy;
  for (const d of [...rows.keys()].sort((a, z) => a - z)) {
    const row = rows.get(d);
    let x = ox;
    for (const c of row) {
      c.style.left = x + 'px';
      c.style.top = y + 'px';

document.getElementById('zoom').addEventListener('click', ev => {
  const z = ev.target.dataset.z;
  if (z === 'in') zoomBy(1.25);
  else if (z === 'out') zoomBy(0.8);
  else if (z === 'fit') fitAll();
  else if (z === 'tidy') tidy();
});
board.addEventListener('wheel', ev => {
  ev.preventDefault();
  zoomBy(ev.deltaY < 0 ? 1.12 : 0.89, ev.clientX, ev.clientY);
}, { passive: false });

// Pinch. Pointer events give us every finger, so we track them ourselves rather
// than relying on gesture events, which only Safari implements.
const touches = new Map();
let pinch = null;
board.addEventListener('pointerdown', ev => {

  touches.set(ev.pointerId, ev);
  if (touches.size === 2) {
    const [a, b] = [...touches.values()];
    pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) };
    pan = null; drag = null;                          // a second finger cancels a drag
    document.querySelectorAll('.chip.drag').forEach(c => c.classList.remove('drag'));

  if (ev.pointerType !== 'touch' || !touches.has(ev.pointerId)) return;

// Double-tap zooms in, and again to fit — the standard map gesture.
let lastTap = 0;
board.addEventListener('pointerup', ev => {
  if (ev.target.closest('.chip.board, .verb, #zoom, #intro')) return;
  const now = Date.now();
  if (now - lastTap < 320) { view.k > 1.05 ? fitAll() : zoomBy(1.8, ev.clientX, ev.clientY); lastTap = 0; }
  else lastTap = now;
});

// looks for space rather than trusting a random point.
/**
 * Somewhere to put a new card.
 *
 * This used to measure the distance between two top-left corners and accept
 * anything further apart than the card's *width*. That worked while a chip was
 * a wide flat pill. A specimen card is taller than it is wide, so the test
 * passed for cards that visibly overlapped, and every new card landed in the
 * same horizontal band. Test the actual rectangles instead.

/**
 * How big a card is.
 *
 * Do not measure the card you are about to place. A card read back before its
 * stylesheet has applied reports its min-content width — 22px, not 94 — and 22
 * is a plausible-looking number, so it sails past any "is this zero" guard and
 * lays the entire bench out in a single 36px-pitch row. This file has now been
 * bitten three times by trusting a measurement taken too early (boardBox

 * been on screen, once, and keep the answer.
 */
const CARD_FALLBACK = [94, 124];

function cardSize() {
  if (cardSizeCache) return cardSizeCache;
  for (const c of world.querySelectorAll('.chip.board')) {
    if (c.offsetWidth >= 60 && c.offsetHeight >= 80) {
      return (cardSizeCache = [c.offsetWidth, c.offsetHeight]);
    }
  }
  return CARD_FALLBACK;                       // not cached: try again next time
}

function freeSpot(w, h, near) {
  const PAD = 14;
  [w, h] = cardSize();
  // Every card is the same size, so do not ask each one — see cardSize().
  const held = [...world.querySelectorAll('.chip.board')].map(c => ({
    x: parseFloat(c.style.left) || 0, y: parseFloat(c.style.top) || 0, w, h,
  }));
  const clear = (x, y) => held.every(r =>
    x + w + PAD <= r.x || r.x + r.w + PAD <= x ||
    y + h + PAD <= r.y || r.y + r.h + PAD <= y);

  const b = boardBox();
  // Anchor to the bench itself, not to the viewport. Anchoring to the viewport
  // meant that panning between placements — which ensureVisible does — moved
  // the origin each time, and the bench marched off across the world instead
  // of growing as one cluster.
  let origin = near;
  if (!origin) {
    if (held.length) {
      origin = [held.reduce((a, r) => a + r.x + r.w / 2, 0) / held.length,
                held.reduce((a, r) => a + r.y + r.h / 2, 0) / held.length];
    } else {
      origin = toWorld(b.left + b.width / 2, b.top + b.height / 2);
    }
  }
  const [cx, cy] = origin;

  // Spiral outwards from where it should be, in steps the size of a card, so
  // the bench fills like a shelf rather than a heap.
  const stepX = w + PAD, stepY = h + PAD;
  for (let ring = 0; ring < 14; ring++) {
    const spots = [];
    for (let dx = -ring; dx <= ring; dx++) {
      for (let dy = -ring; dy <= ring; dy++) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== ring) continue;   // ring edge only

      }
    }
    // Nearest-first inside the ring keeps results close to their parents.
    spots.sort((a, p) => Math.hypot(a[0] - cx, a[1] - cy) - Math.hypot(p[0] - cx, p[1] - cy));
    for (const [x, y] of spots) if (clear(x, y)) return [x, y];
  }
  // Everything is full. Put it down anyway rather than dropping the discovery.
  return [cx - w / 2 + (Math.random() - .5) * 40, cy - h / 2 + (Math.random() - .5) * 40];
}

const MAX_CHIPS = 140;
function spawn(id, x, y, near) {

    return world.querySelector('.chip.board');

  world.appendChild(el);
  const [cw, ch] = cardSize();
  let anchor = null;
  if (near && near.length) {                          // sit the result near its parents
    const pts = near.filter(n => n && n.isConnected).map(chipCentre);
    if (pts.length) anchor = [pts.reduce((a, p) => a + p[0], 0) / pts.length,
                              pts.reduce((a, p) => a + p[1], 0) / pts.length + ch + 22];
  }
  const [left, top] = x == null ? freeSpot(cw, ch, anchor) : [x - cw / 2, y - ch / 2];
  const bb = boardBox();
  const [minX, minY] = toWorld(bb.left + 8, bb.top + 8);
  const [maxX, maxY] = toWorld(bb.left + bb.width - 8, bb.top + bb.height - 8);

  // A card the player put down stays where they put it, inside the view. A card
  // the game placed is not clamped at all: freeSpot has already found it a
  // clear spot near where it belongs, and the bench is a canvas you pan rather
  // than a screen you fill.
  //
  // Clamping the automatic case was actively harmful. Once the first screenful
  // was used up, every new card was pinned to the same edge, ensureVisible
  // panned to reveal it, which moved the edge, which pinned the next card six
  // pixels along — ninety-four cards in a single row, each overlapping its
  // neighbour, and the fit button showing an empty board.
  if (x == null) {
    el.style.left = left + 'px';
    el.style.top  = top + 'px';
  } else {
    el.style.left = Math.max(minX, Math.min(left, maxX - cw)) + 'px';
    el.style.top  = Math.max(minY, Math.min(top,  maxY - ch)) + 'px';
  }
  setTimeout(() => el.classList.remove('pop'), 340);
  if (x == null) ensureVisible(el);
  drawLinks();
  return el;
}

/**
 * Bring a card into view if it landed off the edge. Pans the smallest distance
 * that works rather than centring on it, so the rest of the bench does not jump
 * out from under the player's hand.
 */
function ensureVisible(el) {
  const b = boardBox(), r = el.getBoundingClientRect();
  const m = 16;
  let dx = 0, dy = 0;
  if (r.left < b.left + m) dx = b.left + m - r.left;
  else if (r.right > b.left + b.width - m) dx = b.left + b.width - m - r.right;
  if (r.top < b.top + m) dy = b.top + m - r.top;
  else if (r.bottom > b.top + b.height - m) dy = b.top + b.height - m - r.bottom;
  if (!dx && !dy) return;
  view.x += dx; view.y += dy;
  applyView();
  drawLinks();
}

// Discoveries must never block the board. The card slides in beside the bench,
// reads in a glance, and retires on its own — the codex is the permanent record,
// so nothing is lost by letting it go.
let cardT, cardPinned = false;
function showCard(r, e) {
  endIntro();                                    // the cue has done its job
  const isFolk = e.shelf === 'folklore';
  const card = document.getElementById('card');

  card.dataset.for = e.id;

    <div class="line">
      <span class="big">${glyph(e.id, 34)}</span>

      <span class="chev">▾</span>

        <button class="ghost" data-trace="${e.id}">Trace it</button>

function dismissCard() { clearTimeout(cardT); cardPinned = false; document.getElementById('card').classList.remove('on'); }

// ---------- the one interaction that matters ----------
let drag = null;
let pan = null;
board.addEventListener('pointerdown', ev => {
  if (ev.target.closest('#zoom, #intro')) return;
  if (touches.size > 1) return;                       // pinching, not dragging
  const chip = ev.target.closest('.chip.board:not(.cooking)');
  if (!chip) {                                       // empty space: pan the world
    pan = { sx: ev.clientX, sy: ev.clientY, vx: view.x, vy: view.y };
    board.classList.add('panning');
    return;
  }
  const [wx, wy] = toWorld(ev.clientX, ev.clientY);
  benchTouched = true;
  endIntro();
  drag = { chip, ox: wx - (parseFloat(chip.style.left) || 0),
                 oy: wy - (parseFloat(chip.style.top) || 0),
           sx: ev.clientX, sy: ev.clientY, moved: false };
  chip.classList.add('drag');
  chip.setPointerCapture(ev.pointerId);
});
board.addEventListener('pointermove', ev => {
  if (pan) {
    view.x = pan.vx + (ev.clientX - pan.sx);
    view.y = pan.vy + (ev.clientY - pan.sy);
    applyView();
    return;
  }
  if (!drag) return;
  // A finger never lands perfectly still, so any movement at all counted as a
  // drag and taps never registered on a phone. Require real travel first.
  if (!drag.moved && Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy) < 8) return;
  drag.moved = true;
  const [wx, wy] = toWorld(ev.clientX, ev.clientY);
  drag.chip.style.left = (wx - drag.ox) + 'px';
  drag.chip.style.top  = (wy - drag.oy) + 'px';
  drawLinks();
  const t = hit(ev.clientX, ev.clientY, drag.chip);
  document.querySelectorAll('.target').forEach(n => n.classList.remove('target'));
  if (t) t.classList.add('target');
});
board.addEventListener('pointerup', ev => {
  if (pan) { pan = null; board.classList.remove('panning'); return; }
  if (!drag) return;
  const { chip, moved } = drag; drag = null;
  chip.classList.remove('drag');
  document.querySelectorAll('.target').forEach(n => n.classList.remove('target'));
  if (!moved) { chipTap(chip); return; }              // tap folds, double tap removes
  const t = hit(ev.clientX, ev.clientY, chip);
  if (!t) return;
  if (t.dataset.verb) applyProcess(chip, t);
  else applyMerge(chip, t);
});

// `exclude` must be passed explicitly: by pointerup the drag state is already
// cleared, and without it a chip hit-tests against itself (stone + stone).
// Hit testing by OVERLAP of the dragged chip, not by pointer position. Merges
// are commutative in the data — dropping A on B and B on A resolve the same
// recipe — so any asymmetry a player feels is this test being too strict.
// Picking the greatest overlap also makes crowded benches predictable.
function hit(x, y, exclude) {
  const d = exclude ? exclude.getBoundingClientRect() : { left: x, right: x, top: y, bottom: y };
  let best = null, bestArea = 0;
  for (const n of [...world.querySelectorAll('.chip.board:not(.hidden)'), ...document.querySelectorAll('.verb:not(.locked)')]) {
    if (n === exclude) continue;
    const r = n.getBoundingClientRect();
    const ox = Math.min(d.right, r.right) - Math.max(d.left, r.left);
    const oy = Math.min(d.bottom, r.bottom) - Math.max(d.top, r.top);
    if (ox > 0 && oy > 0) {
      const area = ox * oy;
      if (area > bestArea) { bestArea = area; best = n; }
    } else if (!best && x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
      best = n; bestArea = 0.1;                      // pointer fallback
    }
  }
  return best;
}

function resolve(r, chips, x, y) {
  if (!r) { sfx.nope(); dudLine(); chips.forEach(c => { c.classList.add('nope'); setTimeout(() => c.classList.remove('nope'), 280); }); return; }
  // Inputs stay put and the result is linked to them, so the canvas accumulates
  // into a diagram of what you built instead of forgetting each step.
  // Parents stay on the bench so the canvas builds into a diagram — but that
  // means the same two chips could be merged again and again, and each repeat
  // spawned another copy. Twenty Seedlings later the board is unusable. A given
  // pair reacts once; ask again and it just shows you what it already made.
  const already = links.find(l =>
    (l.a === chips[0] && l.b === (chips[1] ?? null)) ||
    (l.a === (chips[1] ?? null) && l.b === chips[0]));
  if (already && already.out.isConnected) {
    already.out.classList.remove('hidden');
    already.out.classList.add('pulse');
    setTimeout(() => already.out.classList.remove('pulse'), 400);
    sfx.pick();
    toast(`These two already made ${nameOf(byId[already.out.dataset.id])}`);
    return;
  }

  // The dragged parent is sitting on top of the other one. Ease them apart so
  // the diagram stays readable once the link is drawn.
  if (chips.length === 2) {
    const [p1, p2] = chips.map(chipCentre);
    const dx = p1[0] - p2[0], dy = p1[1] - p2[1];
    const d = Math.hypot(dx, dy) || 1;
    const want = (chips[0].offsetWidth + chips[1].offsetWidth) / 2 + 22;
    if (d < want) {
      const push = (want - d) / 2, ux = (dx / d) * push, uy = (dy / d) * push;
      chips[0].style.left = (parseFloat(chips[0].style.left) || 0) + ux + 'px';
      chips[0].style.top  = (parseFloat(chips[0].style.top) || 0) + uy + 'px';
      chips[1].style.left = (parseFloat(chips[1].style.left) || 0) - ux + 'px';
      chips[1].style.top  = (parseFloat(chips[1].style.top) || 0) - uy + 'px';
    }
  }
  // The moment two things become one should be visible. A single ring at the
  // join, then the new chip pops in — no confetti, nothing to sit through.
  const at = chips.filter(c => c && c.isConnected).map(chipCentre);
  if (at.length) {
    const cx = at.reduce((a, p) => a + p[0], 0) / at.length;
    const cy = at.reduce((a, p) => a + p[1], 0) / at.length;
    const ring = document.createElement('div');
    ring.className = 'ring';
    ring.style.left = cx + 'px'; ring.style.top = cy + 'px';
    world.appendChild(ring);
    setTimeout(() => ring.remove(), 620);
  }
  // A condensation reaction physically expels a water molecule. Showing it
  // leave is both accurate and the clearest way to say why a residue in a
  // chain weighs less than the free acid it came from.
  if (r.releases === 'water' && at.length) {
    const cx = at.reduce((a, p) => a + p[0], 0) / at.length;
    const cy = at.reduce((a, p) => a + p[1], 0) / at.length;
    const drop = document.createElement('div');
    drop.className = 'drop';
    drop.textContent = '💧';
    drop.style.left = cx + 'px'; drop.style.top = cy + 'px';
    world.appendChild(drop);
    setTimeout(() => drop.remove(), 1100);
    toast('A water molecule leaves — that is what condensation means');
  }
  const el = spawn(r.out, null, null, chips);
  links.push({ a: chips[0], b: chips[1] ?? null, out: el, fresh: true });
  el.classList.add('folded');                         // arrives closed
  refreshFolds();
  const isNew = !found.has(r.out);
  if (isNew) {
    const wasLive = liveCount();
    found.add(r.out);
    save(); renderShelf();
    // Players of other games in this genre report the same pair failing and then
    // later working, and read it as the game cheating. Unlocks genuinely do
    // change what is possible — so say so out loud rather than letting them
    // rediscover it by accident.
    if (MILESTONES[found.size]) toast(MILESTONES[found.size]);
    const unlocked = verbs.filter(v => v.unlockedBy === r.out);
    if (unlocked.length) {
      // A tool unlock is the bigger news; don't let the follow-up overwrite it.
      for (const v of unlocked) {
        const n = DATA.recipes.filter(x => x.verb === v.id && found.has(x.in[0]) && !found.has(x.out)).length;
        sfx.unlock();
        toast(`${v.name} unlocked — ${n} thing${n === 1 ? '' : 's'} you hold can be ${v.name.toLowerCase()}ed`);
      }
    } else {
      const gained = liveCount() - wasLive;
      if (gained > 1) toast(`${gained} things on your shelf just became useful again`);
    }
  }
  if (!seen.has(r.out)) {
    seen.add(r.out); save();
    if (ABSURD.includes(r.out) && prefs.tone === 'playful')
      setTimeout(() => toast('This one is completely true, which is the funny part'), 900);
    (byId[r.out].shelf === 'folklore' ? sfx.folklore : sfx.discover)();
    showCard(r, byId[r.out]);
  } else { sfx.pick(); el.classList.add('pop'); }
}

function applyMerge(a, b) {
  resolve(merges.get([a.dataset.id, b.dataset.id].sort().join('+')), [a, b]);
}
// Some processes are not instant in life and should not be here either.
// Waiting and fermenting take real time; you keep playing while they run.
const TAKES_TIME = { wait: 14000, ferment: 20000 };
const cooking = new Set();

function applyProcess(chip, verbEl) {
  const verb = verbEl.dataset.verb;
  const r = procs.get(chip.dataset.id + '|' + verb);
  if (!r) { verbEl.classList.add('nope'); setTimeout(() => verbEl.classList.remove('nope'), 280); return; }
  const ms = TAKES_TIME[verb];
  if (!ms) return resolve(r, [chip]);
  startCooking(chip, r, verb, ms);
}

// Warmth genuinely speeds fermentation and drying, so standing a jar next to the
// fire is a real method — not a purchased skip. Acceleration has to be earned by
// how you arrange the bench.
function heatNearby(chip) {
  const [cx, cy] = chipCentre(chip);
  for (const c of world.querySelectorAll('.chip.board')) {
    if (c === chip) continue;
    if (c.dataset.id !== 'fire' && c.dataset.id !== 'sun') continue;
    const [hx, hy] = chipCentre(c);
    if (Math.hypot(hx - cx, hy - cy) < 190) return c.dataset.id;
  }
  return null;
}

function startCooking(chip, r, verb, ms) {
  const v = verbs.find(x => x.id === verb);
  const job = { chip, r, verb, started: performance.now(), ms, done: 0 };
  cooking.add(job);
  pumpCooking();
  chip.classList.add('cooking');
  chip.dataset.verb = v.id;
  updateWaiting();
  toast(`${nameOf(byId[chip.dataset.id])} is ${verb === 'wait' ? 'resting' : 'fermenting'} — keep playing`);
}

// Driven by a timer, not an animation frame. A progress ring does not need
// sixty updates a second, and frame callbacks are throttled or suspended in a
// background tab — which would leave something resting forever.
let cookTimer = 0;
function pumpCooking() {
  if (cookTimer || !cooking.size) return;
  cookTimer = setInterval(() => tickCooking(performance.now()), 200);
}
function stopCooking() { clearInterval(cookTimer); cookTimer = 0; }
function tickCooking(now) {
  if (!cooking.size) return stopCooking();
  for (const job of [...cooking]) {
    if (!job.chip.isConnected) { cooking.delete(job); continue; }
    const warm = heatNearby(job.chip);
    const rate = warm ? 2.2 : 1;                       // warmth roughly doubles it
    job.done += (now - (job.last ?? now)) * rate;
    job.last = now;
    const p = Math.min(1, job.done / job.ms);
    job.chip.style.setProperty('--p', (p * 100).toFixed(1) + '%');
    if (warm && !job.toldWarm) {
      job.toldWarm = true;
      toast(`Warmth from the ${warm} is speeding it up`);
    }
    if (p >= 1) {
      cooking.delete(job);
      job.chip.classList.remove('cooking');
      sfx.done();
      resolve(job.r, [job.chip]);
      updateWaiting();
    }
  }
  if (!cooking.size) stopCooking();
}

function updateWaiting() {
  const el = document.getElementById('waiting');
  el.textContent = cooking.size ? `${cooking.size} resting` : '';
  el.style.display = cooking.size ? '' : 'none';
}

// ---------- provenance: what is this actually made of? ----------
const startersSet = new Set(STARTERS);
const bestRecipe = new Map();
(function () {
  const unlockOf = Object.fromEntries(verbs.map(v => [v.id, v.unlockedBy]));
  const cost = new Map([...startersSet].map(s => [s, new Set()]));
  for (let pass = 0; pass < 60; pass++) {
    let changed = false;
    DATA.recipes.forEach((r, i) => {
      const parts = [...r.in];
      if (r.verb && unlockOf[r.verb]) parts.push(unlockOf[r.verb]);
      if (!parts.every(x => cost.has(x))) return;
      const set = new Set([i]);
      for (const x of parts) for (const c of cost.get(x)) set.add(c);
      const cur = cost.get(r.out);
      if (!cur || set.size < cur.size) { cost.set(r.out, set); bestRecipe.set(r.out, r); changed = true; }
    });
    if (!changed) break;
  }
})();

const memo = new Map();
function expanded(id) {
  if (startersSet.has(id)) return { steps: 0, leaves: 1 };
  if (memo.has(id)) return memo.get(id);
  memo.set(id, { steps: 0, leaves: 1 });
  const r = bestRecipe.get(id);
  if (!r) return { steps: 0, leaves: 1 };
  let steps = 1, leaves = 0;
  for (const i of r.in) { const s = expanded(i); steps += s.steps; leaves += s.leaves; }
  const out = { steps, leaves }; memo.set(id, out); return out;
}
function distinctOf(id) {
  const seen = new Set(), stack = [id];
  while (stack.length) {
    const x = stack.pop();
    if (seen.has(x)) continue;
    seen.add(x);
    const r = bestRecipe.get(x);
    if (r) stack.push(...r.in);
  }
  return seen;
}
function leafTally(id) {
  const t = new Map();
  (function walk(x) {
    if (startersSet.has(x)) { t.set(x, (t.get(x) ?? 0) + 1); return; }
    const r = bestRecipe.get(x);
    if (r) r.in.forEach(walk);
  })(id);
  return t;
}
// A deep tree (blue cheese runs to ~100 crafts) is unreadable on a phone, so
// anything past AUTO_DEPTH starts folded and opens on tap.
const AUTO_DEPTH = 4;
function subtreeSize(id) { return expanded(id).steps + 1; }
function treeHTML(id, depth, seen = new Set()) {
  // The recipe graph deliberately contains loops — chicken and egg really do
  // make each other. Without a guard this recursed until the tab died.
  if (seen.has(id) || depth > 40) {
    const e2 = byId[id];
    return `<li><div class="prow loop"><span class="pe">${glyph(e2.id, 22)}</span>` +
           `<span class="pn">${nameOf(e2)}</span><span class="pv">already above</span></div></li>`;
  }
  seen = new Set(seen); seen.add(id);
  const r = bestRecipe.get(id), e = byId[id];
  const v = r && r.verb ? verbs.find(x => x.id === r.verb) : null;
  const hidden = r && depth >= AUTO_DEPTH;
  const n = r ? subtreeSize(id) - 1 : 0;
  const row = `<div class="prow${depth === 0 ? ' root' : ''}${r ? ' has' : ''}"${r ? ' data-fold' : ''}>` +
              `${r ? `<span class="tw">${hidden ? '▸' : '▾'}</span>` : '<span class="tw dot">·</span>'}` +
              `<span class="pe">${glyph(e.id, 22)}</span><span class="pn">${e.name}</span>` +
              (hidden && n ? `<span class="more">+${n}</span>` : '') +
              (v ? `<span class="pv">${glyph('verb_' + v.id, 17)} ${v.name}</span>` : '') + `</div>`;
  const kids = r ? `<ul${hidden ? ' class="fold"' : ''}>${r.in.map(i => treeHTML(i, depth + 1)).join('')}</ul>` : '';
  return `<li>${row}${kids}</li>`;
}

// ---- bedrock: what the starters are actually made of ----
const BED = DATA.bedrock;
const atomById = Object.fromEntries(BED.atoms.map(a => [a.id, a]));
const compById = Object.fromEntries(BED.compounds.map(c => [c.id, c]));
function atomsUnder(id, seen = new Set(), out = new Set()) {
  if (atomById[id]) { out.add(id); return out; }
  if (seen.has(id)) return out;
  seen.add(id);
  for (const x of (compById[id]?.of ?? [])) atomsUnder(x, seen, out);
  return out;
}
// ---- ball-and-stick renderer ----
// Structure is authored data, not derived: a formula cannot tell you a shape.
function moleculeSVG(id, size = 190) {
  const st = BED.structures?.[id];
  if (!st) return '';
  const R = { H: 0.30, C: 0.44, N: 0.42, O: 0.40, S: 0.52 };
  const xs = st.atoms.map(a => a[1]), ys = st.atoms.map(a => a[2]);
  const pad = 0.7;
  const minX = Math.min(...xs) - pad, maxX = Math.max(...xs) + pad;
  const minY = Math.min(...ys) - pad, maxY = Math.max(...ys) + pad;
  const w = maxX - minX, h = maxY - minY;
  const k = size / Math.max(w, h);
  const X = x => (x - minX) * k, Y = y => (maxY - y) * k;

  let out = `<svg class="mol" viewBox="0 0 ${w * k} ${h * k}" width="${w * k}" height="${h * k}">`;
  for (const [i, j, order] of st.bonds) {
    const [, x1, y1] = st.atoms[i], [, x2, y2] = st.atoms[j];
    if (order === 2) {
      const dx = Y(y2) - Y(y1), dy = X(x1) - X(x2);
      const L = Math.hypot(dx, dy) || 1, ox = (dx / L) * 3.2, oy = (dy / L) * 3.2;
      out += `<line x1="${X(x1)+ox}" y1="${Y(y1)+oy}" x2="${X(x2)+ox}" y2="${Y(y2)+oy}" class="bond"/>`;
      out += `<line x1="${X(x1)-ox}" y1="${Y(y1)-oy}" x2="${X(x2)-ox}" y2="${Y(y2)-oy}" class="bond"/>`;
    } else {
      out += `<line x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}" class="bond"/>`;
    }
  }
  for (const [el, x, y] of st.atoms) {
    const r = (R[el] ?? 0.4) * k;
    const fill = BED.cpk[el];
    const dark = el === 'C' || el === 'N';
    out += `<circle cx="${X(x)}" cy="${Y(y)}" r="${r}" fill="${fill}" class="ball"/>`;
    out += `<text x="${X(x)}" y="${Y(y)}" class="lbl" fill="${dark ? '#fff' : '#1a1a1a'}" ` +
           `style="font-size:${r * 1.15}px">${el}</text>`;
  }
  return out + '</svg>';
}

function atomTile(a, small) {
  return `<span class="atom ${a.category}" title="${a.name}">` +
         `<span class="sym">${a.symbol}</span><span class="z">${a.number}</span></span>`;
}
function bedTreeHTML(id) {
  const a = atomById[id];
  if (a) return `<li><div class="brow">${atomTile(a)}<span>${a.name}</span>` +
                `<i class="cat">${a.category}</i></div></li>`;
  const c = compById[id];
  if (!c) return '';
  const node = c.kind === 'particle'
    ? `<span class="particle">✦ ${c.name}</span>`
    : `<span class="hex">${c.name}</span>`;
  return `<li><div class="brow">${node}</div>` +
         (c.of.length ? `<ul>${c.of.map(bedTreeHTML).join('')}</ul>` : '') + `</li>`;
}

// ---- periodic table ----
const PT_GAPS = { 2: 10, 5: 10, 13: 10, 31: 10, 57: 0, 72: 0 };  // where a row jumps
function periodicHTML() {
  const inPlay = new Set(BED.atoms.filter(a => a.inPlay).map(a => a.id));
  const cats = [...new Set(BED.atoms.map(a => a.category))];
  let h = `<p class="none" style="text-align:left;padding:0 0 6px">` +

// ---- the index entry: what makes this, and what this makes ----

function gestureHTML(r) {

  const part = (id) => `<span class="g" data-entry="${id}">${glyph(id, 19)} ${byId[id].name}</span>`;

// How much help you have asked for, per element. It escalates only when you

const hintLevel = new Map();
function showHint(id) {
  const e = byId[id];
  const routes = DATA.recipes.filter(r => r.out === id);
  const ul = unlockedVerbs();
  // The route that needs the least from here is the one worth pointing at.
  const score = (r) => r.in.filter(i => !found.has(i)).length + (r.verb && !ul.has(r.verb) ? 1 : 0);
  const best = routes.slice().sort((a, b) => score(a) - score(b))[0];
  const lvl = hintLevel.get(id) ?? 0;
  const missing = best ? best.in.filter(i => !found.has(i)) : [];
  const verbLocked = best?.verb && !ul.has(best.verb);
  const v = best?.verb ? verbs.find(x => x.id === best.verb) : null;

  let body;
  if (!best) body = `<p>Nothing in the world makes this. It is where things start.</p>`;
  else if (lvl === 0) {
    body = `<p>There ${routes.length === 1 ? 'is one way' : `are ${routes.length} ways`} to make it.</p>` +
      (missing.length
        ? `<p>You are missing <b>${missing.length}</b> of the ingredient${missing.length === 1 ? '' : 's'} for the closest one — so something else has to come first.</p>`
        : `<p><b>You already have everything you need.</b> It is two things on your shelf${v ? `, or one thing and a tool` : ''}.</p>`) +
      (verbLocked ? `<p>It also needs the ${glyph('verb_' + v.id, 17)} ${v.name} tool, which opens when you make ${nameOf(byId[v.unlockedBy])}.</p>` : '');
  } else if (lvl === 1) {

      (missing.length ? `<p class="hint2">You still need ${missing.map(i =>

        ${lvl === 0 ? 'Give me a nudge' : 'Just tell me'}</button></div>` : ''}

// Constructing beats studying roughly 2:1 across four meta-analyses, and
// requiring an effortful guess before the reveal cut illusion-of-understanding

// the first time you trace a given thing.
const guessed = new Set();
let provMode = 'cards';
function askFirst(id, then) {
  const x = expanded(id);

  const opts = [...new Set([
    Math.max(2, Math.round(truth * 0.35)),
    truth,
    Math.round(truth * 2.1) + 1,
  ])].sort((a, b) => a - b);
  document.getElementById('sheetBody').innerHTML = `
    <div class="guess">
      <div class="big">${glyph(id, 34)}</div>
      <h3>Before you look</h3>
      <p>How many raw things — stone, water, sun, seed — do you think went into
         one ${byId[id].name.toLowerCase()}?</p>
      <div class="opts">${opts.map(o => `<button data-guess="${o}">${o}</button>`).join('')}</div>
      <button class="skip" data-guess="skip">Just show me</button>
    </div>`;
  openSheet('A guess first');
  document.getElementById('sheetBody').querySelectorAll('[data-guess]').forEach(b => b.onclick = () => {
    const g = b.dataset.guess;
    guessed.add(id);
    if (g !== 'skip') {
      const n = Number(g);
      lastGuess = { n, truth, right: n === truth };
      (n === truth ? sfx.discover : sfx.pick)();
    } else lastGuess = null;
    then();
  });
}
let lastGuess = null;

// The chain, as a run of citation cards. Peer-reviewed finding: node-link
// diagrams fail the consumer persona — Obsidian's graph view is the popular
// proof, and Factorio hit this exact problem and built cards instead. So cards
// are the default and the tree is kept for whoever wants it.
// The thing no other provenance view has: every card carries its source.
function orderedSteps(id) {
  const need = new Set();
  (function walk(x) {
    const r = bestRecipe.get(x);
    if (!r || need.has(r)) return;
    need.add(r);
    r.in.forEach(walk);
  })(id);
  const have = new Set(STARTERS);
  const out = [];
  const left = [...need];
  while (left.length) {
    const k = left.findIndex(r => r.in.every(i => have.has(i)));
    if (k === -1) break;
    const [r] = left.splice(k, 1);
    have.add(r.out); out.push(r);
  }

}
function stepCard(r, i) {
  const v = r.verb ? verbs.find(x => x.id === r.verb) : null;
  const bit = (id) => `<span class="g" data-entry="${id}">${glyph(id, 19)} ${nameOf(byId[id])}</span>`;
  return `<div class="step">
    <div class="stepno">${i + 1}</div>
    <div class="stepbody">
      <div class="stepgest">${bit(r.in[0])}${v ? `<em>${glyph('verb_' + v.id, 17)} ${v.name}</em>` : `<em>+</em>${bit(r.in[1])}`}
        <span class="arw">→</span>${bit(r.out)}</div>
      <p>${r.why}</p>
      ${r.src ? `<a class="src" href="${r.src}" target="_blank" rel="noopener">Check this${r.verified ? ' ✓' : ''}</a>` : ''}
    </div></div>`;

function showProvenance(id, mode) {
  if (!guessed.has(id) && expanded(id).leaves > 3) return askFirst(id, () => showProvenance(id, mode));
  provMode = mode || provMode;

// ---------- codex ----------
// Rebuilding the whole sheet on every keystroke destroys the input and resets
// the caret to position 0, which makes typed text come out reversed. Build the
// chrome once; only the results list is re-rendered.
function codexResults(q) {
  const hits = elements.filter(e => found.has(e.id) &&
    (!q || nameOf(e).toLowerCase().includes(q.toLowerCase())));
  // Searching should also reach things you have not made yet — otherwise there
  // is nowhere to ask "how do I make fire?", which is the whole stuck moment.
  const unmade = q ? elements.filter(e => !found.has(e.id) &&
    nameOf(e).toLowerCase().includes(q.toLowerCase())) : [];
  const unmadeBlock = unmade.length
    ? `<h2 class="locked">Not yet made · ${unmade.length}</h2><div class="shelf">` +
      unmade.slice(0, 24).map(e =>
        `<span class="chip locked" data-hint="${e.id}">${chipHTML(e)}<i class="q">?</i></span>`).join('') +
      `</div>`
    : '';
  if (!hits.length && !unmade.length) return '<p class="none">Nothing found.</p>';
  return FAMILIES.map(f => [f, hits.filter(e => familyOf(e).id === f.id)])
    .filter(([, g]) => g.length)
    .sort((a, b) => (a[0].id === 'myth') - (b[0].id === 'myth'))
    .map(([f, g]) =>
      `<h2 class="fam-${f.id}"><i></i>${f.name} · ${g.length}</h2><div class="shelf">` +
      g.map(e => `<span class="chip fam-${f.id}" data-fam="${f.id}" data-entry="${e.id}">${chipHTML(e)}</span>`).join('') +
      `</div>`).join('') + unmadeBlock;
}

    `<div class="cardrow" style="margin:10px 0 2px">` +

/* ── the ladder ───────────────────────────────────────────────────────────
 * Every item you have found, laid out by order of magnitude, from the sun to
 * a carbon atom. It is the Powers of Ten idea made into a screen, and it is
 * built entirely from data we already ship: no new art, no new claims, just
 * the sizes sorted.
 *
 * It is also the clearest answer to what this game is for. A crafting game
 * shows you a list of things you own. This shows you that a loaf of bread and
 * a ribosome are nineteen orders of magnitude apart, and that you walked the
 * whole way.
 */
const RUNG_LABEL = {
  '-10': 'atoms and bonds',
  '-9':  'small molecules',
  '-8':  'proteins and polymers',
  '-6':  'single cells',
  '-5':  'cells you could see with a lens',
  '-4':  'grains and powders',
  '-3':  'seeds and crumbs',
  '-2':  'things that fit in a hand',
  '-1':  'things you cook with',
  '0':   'things taller than a child',
  '2':   'fields',
  '3':   'rivers',
  '6':   'seas',
  '9':   'the sun',
};

function showLadder() {
  const have = elements.filter(e => found.has(e.id) && SCALE[e.id]);
  const rungs = new Map();
  for (const e of have) {
    const k = SCALE[e.id].e;
    if (!rungs.has(k)) rungs.set(k, []);
    rungs.get(k).push(e);
  }
  const keys = [...rungs.keys()].sort((a, b) => b - a);       // biggest first

  // The gap between rungs is real information: a run of empty decades means
  // there is a whole scale of the world you have not touched yet.
  const top = keys[0], bottom = keys[keys.length - 1];
  const rows = [];
  for (let k = top; k >= bottom; k--) {
    const list = rungs.get(k);
    if (!list) {
      // Collapse a run of empty decades into one line. The gap still shows —
      // it is the most interesting thing on the page — but nineteen rungs of
      // "nothing here yet" would bury the things you do have.
      let run = k;
      while (run - 1 >= bottom && !rungs.has(run - 1)) run--;
      const n = k - run + 1;
      rows.push(`<div class="rung empty"><span class="mag">${magOf(k)}</span><i>` +
        (n === 1 ? 'nothing at this size yet'
                 : `${n} sizes down to ${magOf(run)} with nothing in them yet`) +
        `</i></div>`);
      k = run;
      continue;
    }
    rows.push(
      `<div class="rung"><span class="mag">${magOf(k)}</span>` +
      `<span class="rungname">${RUNG_LABEL[k] || ''} · ${list.length}</span>` +
      `<div class="shelf">${list.map(e =>
        `<span class="chip lad" data-entry="${e.id}">${chipHTML(e)}</span>`).join('')}</div></div>`);
  }

  const span = top - bottom;
  document.getElementById('sheetBody').innerHTML =
    `<p class="ladderlede">You hold things ${span} orders of magnitude apart —
      from ${nameOf(byId[have.find(e => SCALE[e.id].e === top).id])}
      down to ${nameOf(byId[have.find(e => SCALE[e.id].e === bottom).id])}.
      Every step between them is a recipe you can check.</p>` +
    `<div class="ladder">${rows.join('')}</div>`;
  openSheet('The ladder');
}
const SUPS = { '-': '⁻', 0: '⁰', 1: '¹', 2: '²', 3: '³', 4: '⁴', 5: '⁵', 6: '⁶', 7: '⁷', 8: '⁸', 9: '⁹' };
const magOf = k => '10' + String(k).split('').map(c => SUPS[c]).join('') + ' m';

function openSheet(title) {
  document.getElementById('sheetTitle').textContent = title;
  document.getElementById('sheet').classList.add('on');
}
document.getElementById('sheet').addEventListener('click', ev => {
  const fold = ev.target.closest('[data-fold]');
  if (fold) {
    const ul = fold.parentElement.querySelector(':scope > ul');
    if (ul) {
      const now = ul.classList.toggle('fold');
      fold.querySelector('.tw').textContent = now ? '▸' : '▾';
      const more = fold.querySelector('.more');
      if (more) more.style.display = now ? '' : 'none';

  }
  if (ev.target.id === 'sheet' || ev.target.id === 'sheetClose')
    ev.currentTarget.classList.remove('on');
