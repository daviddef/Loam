i/Hafnium","verified":true},{"in":["ore","magnesium"],"out":"zirconium","why":"Zirconium comes from zircon, a silicate that survives weathering so well it accumulates in beach sand. The metal is made the same way titanium is — the Kroll process, reducing the chloride with molten magnesium: ZrCl4 + 2 Mg → Zr + 2 MgCl2.","src":"https://en.wikipedia.org/wiki/Zirconium","verified":true},{"in":["ore","sodium"],"out":"tantalum","why":"Tantalum metal is made by reducing potassium heptafluorotantalate with sodium in a molten salt bath at around 800°C: K2[TaF7] + 5 Na → Ta + 5 NaF + 2 KF. Its ore, coltan, is also the reason tantalum keeps turning up in accounts of the war in the Congo.","src":"https://en.wikipedia.org/wiki/Tantalum","verified":true},{"in":["tantalum","water"],"out":"niobium","why":"Telling niobium from tantalum took until the 1860s, and the trick is water: their two complex fluoride salts dissolve in it to different degrees, so repeated crystallisation slowly pulls them apart. That is still the basis of the separation.","src":"https://en.wikipedia.org/wiki/Niobium","verified":true},{"in":["calcium","yellowcake"],"out":"scandium","why":"Nobody mines scandium. In 2003 the whole world supply came out of three mines digging for other things — uranium and iron in Ukraine, rare earths in China, apatite in Russia. The oxide recovered becomes scandium fluoride, reduced with calcium metal.","src":"https://en.wikipedia.org/wiki/Scandium","verified":true},{"in":["calcium","ore"],"out":"yttrium","why":"Yttrium is never free in nature — it rides along in rare-earth minerals and some uranium ores, and has to be picked out of the mixture by ion exchange. Only a few tonnes of metal are made a year, by reducing yttrium fluoride with a calcium–magnesium alloy.","src":"https://en.wikipedia.org/wiki/Yttrium","verified":true},{"in":["lithium","ore"],"out":"pollucite","why":"Pollucite is a pegmatite mineral, and pegmatites are where lithium lives too — it turns up in the same rock as spodumene, petalite and lepidolite. Find the lithium pegmatite and you have found the caesium.","src":"https://en.wikipedia.org/wiki/Pollucite","verified":true},{"in":["ore","sand"],"out":"monazite","why":"Monazite is dense and refuses to weather away, so rivers and surf sort it out of everything lighter and pile it up as heavy mineral sand — the same density trick that concentrates gold in a pan, on a beach-sized scale.","src":"https://en.wikipedia.org/wiki/Monazite","verified":true},{"in":["lye","monazite"],"out":"rare_earth","why":"Monazite has to be cracked open before it gives anything up. Hot sodium hydroxide at about 140°C does it — the same lye you get from wood ash, concentrated — dissolving the phosphate away and leaving the rare earths behind as hydroxides.","src":"https://en.wikipedia.org/wiki/Monazite","verified":true},{"in":["limestone","sulfur"],"out":"baryte","why":"Baryte is a sulfate, and the classic place to find it is a mineral vein cutting through limestone — the same lead-and-zinc veins miners were already working, with the heavy spar sitting alongside as the stuff nobody wanted.","src":"https://en.wikipedia.org/wiki/Baryte","verified":true},{"in":["brine","sun"],"out":"lithium","why":"Most lithium is not mined at all. Brine is pumped up from under a salt flat into shallow ponds and the sun is left to take the water away — the Salar de Atacama alone was producing about a third of the world's supply by 2015.","src":"https://en.wikipedia.org/wiki/Brine_mining","verified":true},{"in":["calcium","pollucite"],"out":"caesium","why":"Caesium was the first element ever found with a spectroscope, in 1860. Getting the metal out is cruder than that sounds: turn the ore into caesium chloride, heat it to 700–800°C with calcium, and distil the caesium off.","src":"https://en.wikipedia.org/wiki/Caesium","verified":true},{"in":["caesium","pollucite"],"out":"rubidium","why":"Nobody mines rubidium. It comes out as a by-product wherever caesium is being made from pollucite, and the two are so alike that parting them means crystallising the same alum out of solution about thirty times over.","src":"https://en.wikipedia.org/wiki/Rubidium","verified":true},{"in":["fluorite","magnesium"],"out":"beryllium","why":"Most beryllium is made by reducing beryllium fluoride with magnesium. Heat the fluoride to 900°C with magnesium and finely divided beryllium forms; take it to 1,300°C and it comes together as metal.","src":"https://en.wikipedia.org/wiki/Beryllium","verified":true},{"in":["mercury","ore"],"out":"strontium","why":"Humphry Davy got the first strontium in 1808 by electrolysing strontium chloride mixed with mercuric oxide — the metal came out as an amalgam with mercury, which then had to be driven off to leave strontium behind.","src":"https://en.wikipedia.org/wiki/Strontium","verified":true},{"in":["aluminum","baryte"],"out":"barium","why":"Barium won't come out by electrolysis — it dissolves back into the molten salt and the product is filthy. So it is made the way chromium is: burn aluminium for the oxygen at 1,100°C and take what's left.","src":"https://en.wikipedia.org/wiki/Barium","verified":true},{"in":["barium","ore"],"out":"radium","why":"Radium behaves so much like barium that barium is what you use to catch it — then crystallise the two apart over and over, watching the spectroscope for radium's red lines against barium's green. A tonne of ore yields about a seventh of a gram.","src":"https://en.wikipedia.org/wiki/Radium","verified":true},{"in":["monazite","potassium"],"out":"thorium","why":"Berzelius announced thorium in 1829 and could only get an impure sample, by attacking a thorium fluoride salt with potassium metal. Its ore is monazite sand, which averages about 2.5% thorium — the reason those sands are mildly radioactive.","src":"https://en.wikipedia.org/wiki/Thorium","verified":true},{"in":["enriched_uranium","uranium"],"out":"plutonium","why":"This is the only element here that is not dug up. U-235 fissions and throws out neutrons; the U-238 sitting next to it catches one, and becomes neptunium, and then plutonium. The two kinds of uranium do it to each other.","src":"https://en.wikipedia.org/wiki/Plutonium","verified":true},{"in":["bismuth","enriched_uranium"],"out":"polonium","why":"There is about 0.1 mg of polonium in a tonne of uranium ore, so nobody extracts it — they make it. Put bismuth in a reactor's neutron flux and bismuth-209 becomes bismuth-210, which beta-decays into polonium.","src":"https://en.wikipedia.org/wiki/Polonium","verified":true},{"in":["rare_earth"],"verb":"heat","out":"cerium","why":"Roast the mixture and every lanthanide but one turns into the same kind of oxide. Cerium is the exception — it goes all the way to +4, forms CeO2, and that oxide won't dissolve when the others do. Cerium separates itself.","src":"https://en.wikipedia.org/wiki/Cerium","verified":true},{"in":["lithium","rare_earth"],"out":"lanthanum","why":"Turn the mixture into lanthanum chloride and then take the chlorine off it with lithium metal: LaCl3 + 3Li → La + 3LiCl. Lanthanum is about a quarter of all the lanthanide content in monazite, so there is plenty of it to take.","src":"https://en.wikipedia.org/wiki/Lanthanum","verified":true},{"in":["rare_earth","spark"],"out":"neodymium","why":"Neodymium spent 44 years inside an element that didn't exist: 'didymium', the twin, which Auer von Welsbach finally split in two in 1885. The metal itself comes out of molten halide salts by electrolysis.","src":"https://en.wikipedia.org/wiki/Neodymium","verified":true},{"in":["lanthanum","rare_earth"],"out":"samarium","why":"Reduce samarium oxide with lanthanum metal, then simply distil the two apart — samarium boils at 1,794°C and lanthanum not until 3,464°C, so the samarium leaves first and the lanthanum stays in the pot.","src":"https://en.wikipedia.org/wiki/Samarium","verified":true},{"in":["rare_earth","zinc"],"out":"europium","why":"Europium is the one lanthanide with a back door. Reduce it with zinc and Eu(III) drops to Eu(II), which stops behaving like a rare earth and starts behaving like an alkaline earth — so it can be dropped out with barium sulfate while the rest stay put.","src":"https://en.wikipedia.org/wiki/Europium","verified":true},{"in":["calcium","rare_earth"],"out":"gadolinium","why":"Straightforward, for once: heat gadolinium oxide or one of its salts with calcium metal to 1,450°C under argon, and the calcium takes the oxygen. It is named after Johan Gadolin, by way of the mineral gadolinite.","src":"https://en.wikipedia.org/wiki/Gadolinium","verified":true},{"in":["enriched_uranium","rare_earth"],"out":"promethium","why":"Promethium isn't in any ore worth digging. It was found in 1945 at Oak Ridge, in the wreckage of fissioned uranium fuel, by ion-exchange chromatography — the technique that finally made the rare earths separable at all. Named for the Titan who stole fire.","src":"https://en.wikipedia.org/wiki/Promethium","verified":true},{"in":["noble_mix"],"verb":"heat","out":"krypton","verified":true,"why":"Krypton is the more volatile of the two, so warming the mixture drives it off first. The krypton/xenon mixture is separated into krypton and xenon by further distillation.","src":"https://en.wikipedia.org/wiki/Xenon"},{"in":["noble_mix"],"verb":"chill","out":"xenon","verified":true,"why":"Xenon is the heavier and less volatile half, and the rarer one — 87 parts per billion of the atmosphere, about one part in 11.5 million. Cool the mixture and it is what stays behind.","src":"https://en.wikipedia.org/wiki/Xenon"},{"in":["calcium","lead"],"out":"bismuth","verified":true,"why":"Bismuth is not really mined, it is what is left over. Lead refining scrapes it out on purpose — calcium and magnesium go into molten lead at around 380°C and the bismuth leaves with the dross.","src":"https://en.wikipedia.org/wiki/Betterton%E2%80%93Kroll_process"}],"verbs":[{"id":"wait","name":"Wait","emoji":"⏳","unlockedBy":null,"blurb":"Growth, weathering, ageing, decay. Some changes only need time."},{"id":"crush","name":"Crush","emoji":"🪨","unlockedBy":null,"blurb":"Grinding, pressing, milling, churning. Force applied without heat."},{"id":"chill","name":"Chill","emoji":"❄️","unlockedBy":null,"blurb":"Cold is not a technology, it is a night. Available from the start."},{"id":"heat","name":"Heat","emoji":"🔥","unlockedBy":"fire","blurb":"The first tool that makes new molecules rather than smaller pieces."},{"id":"cut","name":"Cut","emoji":"🔪","unlockedBy":"flint","blurb":"Separating one thing into parts. Needs an edge."},{"id":"ferment","name":"Ferment","emoji":"🫧","unlockedBy":"yeast","blurb":"Letting microbes do the work. Controlled, delicious rot."}],"bedrock":{"$comment":"The substrate below the game. NEVER craftable, never on the shelf — it only appears at the bottom of a provenance tree, so the chain ends in real chemistry instead of stopping at a rock. Composition, not provenance: the craft tree says where a thing came from, this says what it is made of.","atoms":[{"id":"el_hydrogen","symbol":"H","number":1,"name":"Hydrogen","srcTitle":"Hydrogen","fact":"The first element, made in the first minutes of the universe. Everything else came later.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Hydrogen","kind":"atom","category":"nonmetal"},{"id":"el_helium","symbol":"He","number":2,"name":"Helium","srcTitle":"Helium","fact":"The ash of the Sun. Four hydrogen nuclei, fused, with a little mass left over as light.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Helium","kind":"atom","category":"noble"},{"id":"el_lithium","symbol":"Li","number":3,"name":"Lithium","srcTitle":"Lithium","src":"https://en.wikipedia.org/wiki/Lithium","kind":"atom","category":"alkali"},{"id":"el_beryllium","symbol":"Be","number":4,"name":"Beryllium","srcTitle":"Beryllium","src":"https://en.wikipedia.org/wiki/Beryllium","kind":"atom","category":"alkaline"},{"id":"el_boron","symbol":"B","number":5,"name":"Boron","srcTitle":"Boron","src":"https://en.wikipedia.org/wiki/Boron","kind":"atom","category":"metalloid"},{"id":"el_carbon","symbol":"C","number":6,"name":"Carbon","srcTitle":"Carbon","fact":"Four bonds, in every direction, endlessly. Every molecule life is built from hangs off carbon.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Carbon","kind":"atom","category":"nonmetal"},{"id":"el_nitrogen","symbol":"N","number":7,"name":"Nitrogen","srcTitle":"Nitrogen","fact":"Four fifths of the air, and almost impossible for life to reach until something fixes it.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Nitrogen","kind":"atom","category":"nonmetal"},{"id":"el_oxygen","symbol":"O","number":8,"name":"Oxygen","srcTitle":"Oxygen","fact":"Most of your body's mass. Forged inside stars and scattered when they died.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Oxygen","kind":"atom","category":"nonmetal"},{"id":"el_fluorine","symbol":"F","number":9,"name":"Fluorine","srcTitle":"Fluorine","src":"https://en.wikipedia.org/wiki/Fluorine","kind":"atom","category":"halogen"},{"id":"el_neon","symbol":"Ne","number":10,"name":"Neon","srcTitle":"Neon","src":"https://en.wikipedia.org/wiki/Neon","kind":"atom","category":"noble"},{"id":"el_sodium","symbol":"Na","number":11,"name":"Sodium","srcTitle":"Sodium","fact":"Half of salt, and the reason a nerve can fire.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Sodium","kind":"atom","category":"alkali"},{"id":"el_magnesium","symbol":"Mg","number":12,"name":"Magnesium","srcTitle":"Magnesium","fact":"One atom sits at the centre of every chlorophyll molecule. Green is magnesium.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Magnesium","kind":"atom","category":"alkaline"},{"id":"el_aluminium","symbol":"Al","number":13,"name":"Aluminium","srcTitle":"Aluminium","fact":"The commonest metal in the crust, and locked so tightly into rock it was a precious metal until 1886.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Aluminium","kind":"atom","category":"post"},{"id":"el_silicon","symbol":"Si","number":14,"name":"Silicon","srcTitle":"Silicon","fact":"After oxygen, the commonest element in the crust. Every rock, every grain of sand.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Silicon","kind":"atom","category":"metalloid"},{"id":"el_phosphorus","symbol":"P","number":15,"name":"Phosphorus","srcTitle":"Phosphorus","fact":"Carries the energy and holds the DNA backbone together. The scarcest of the six.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Phosphorus","kind":"atom","category":"nonmetal"},{"id":"el_sulfur","symbol":"S","number":16,"name":"Sulfur","srcTitle":"Sulfur","fact":"Two amino acids carry it. It is also why onion and garlic fight back.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Sulfur","kind":"atom","category":"nonmetal"},{"id":"el_chlorine","symbol":"Cl","number":17,"name":"Chlorine","srcTitle":"Chlorine","fact":"The other half of salt. Lethal as a gas, essential as an ion.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Chlorine","kind":"atom","category":"halogen"},{"id":"el_argon","symbol":"Ar","number":18,"name":"Argon","srcTitle":"Argon","src":"https://en.wikipedia.org/wiki/Argon","kind":"atom","category":"noble"},{"id":"el_potassium","symbol":"K","number":19,"name":"Potassium","srcTitle":"Potassium","fact":"Leached out of ash as potash. Plants cannot grow without it.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Potassium","kind":"atom","category":"alkali"},{"id":"el_calcium","symbol":"Ca","number":20,"name":"Calcium","srcTitle":"Calcium","fact":"Shell, bone, chalk and limestone are all the same idea.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Calcium","kind":"atom","category":"alkaline"},{"id":"el_scandium","symbol":"Sc","number":21,"name":"Scandium","srcTitle":"Scandium","src":"https://en.wikipedia.org/wiki/Scandium","kind":"atom","category":"transition"},{"id":"el_titanium","symbol":"Ti","number":22,"name":"Titanium","srcTitle":"Titanium","src":"https://en.wikipedia.org/wiki/Titanium","kind":"atom","category":"transition"},{"id":"el_vanadium","symbol":"V","number":23,"name":"Vanadium","srcTitle":"Vanadium","src":"https://en.wikipedia.org/wiki/Vanadium","kind":"atom","category":"transition"},{"id":"el_chromium","symbol":"Cr","number":24,"name":"Chromium","srcTitle":"Chromium","src":"https://en.wikipedia.org/wiki/Chromium","kind":"atom","category":"transition"},{"id":"el_manganese","symbol":"Mn","number":25,"name":"Manganese","srcTitle":"Manganese","src":"https://en.wikipedia.org/wiki/Manganese","kind":"atom","category":"transition"},{"id":"el_iron","symbol":"Fe","number":26,"name":"Iron","srcTitle":"Iron","fact":"The last thing a dying star can make without exploding.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Iron","kind":"atom","category":"transition"},{"id":"el_cobalt","symbol":"Co","number":27,"name":"Cobalt","srcTitle":"Cobalt","src":"https://en.wikipedia.org/wiki/Cobalt","kind":"atom","category":"transition"},{"id":"el_nickel","symbol":"Ni","number":28,"name":"Nickel","srcTitle":"Nickel","src":"https://en.wikipedia.org/wiki/Nickel","kind":"atom","category":"transition"},{"id":"el_copper","symbol":"Cu","number":29,"name":"Copper","srcTitle":"Copper","src":"https://en.wikipedia.org/wiki/Copper","kind":"atom","category":"transition"},{"id":"el_zinc","symbol":"Zn","number":30,"name":"Zinc","srcTitle":"Zinc","src":"https://en.wikipedia.org/wiki/Zinc","kind":"atom","category":"transition"},{"id":"el_gallium","symbol":"Ga","number":31,"name":"Gallium","srcTitle":"Gallium","src":"https://en.wikipedia.org/wiki/Gallium","kind":"atom","category":"post"},{"id":"el_germanium","symbol":"Ge","number":32,"name":"Germanium","srcTitle":"Germanium","src":"https://en.wikipedia.org/wiki/Germanium","kind":"atom","category":"metalloid"},{"id":"el_arsenic","symbol":"As","number":33,"name":"Arsenic","srcTitle":"Arsenic","src":"https://en.wikipedia.org/wiki/Arsenic","kind":"atom","category":"metalloid"},{ ","category":"post"},{"id":"el_livermorium","symbol":"Lv","number":116,"name":"Livermorium","srcTitle":"Livermorium","src":"https://en.wikipedia.org/wiki/Livermorium","kind":"atom","category":"post"},{"id":"el_tennessine","symbol":"Ts","number":117,"name":"Tennessine","srcTitle":"Tennessine","src":"https://en.wikipedia.org/wiki/Tennessine","kind":"atom","category":"halogen"},{"id":"el_oganesson","symbol":"Og","number":118,"name":"Oganesson","srcTitle":"Oganesson","src":"https://en.wikipedia.org/wiki/Oganesson","kind":"atom","category":"noble"}],"compounds":[{"id":"bed_water_molecule","name":"Water","srcTitle":"Properties of water","of":["el_hydrogen","el_oxygen"],"fact":"Two hydrogens at an angle, which is why water is sticky, why ice floats, and why life works.","src":"https://en.wikipedia.org/wiki/Properties_of_water","kind":"compound","formula":"H2O","tier":"molecule"},{"id":"bed_silica","name":"Silica","srcTitle":"Silicon dioxide","of":["el_silicon","el_oxygen"],"fact":"Quartz. It survives weathering better than almost anything, which is why sand is mostly this.","src":"https://en.wikipedia.org/wiki/Silicon_dioxide","kind":"compound","formula":"SiO2","tier":"molecule"},{"id":"bed_feldspar","name":"Feldspar","srcTitle":"Feldspar","of":["el_potassium","el_aluminium","el_silicon","el_oxygen"],"fact":"Around half of granite, and the mineral that weathers down into clay.","src":"https://en.wikipedia.org/wiki/Feldspar","kind":"compound","formula":"KAlSi3O8","tier":"molecule"},{"id":"bed_mica","name":"Mica","srcTitle":"Mica","of":["el_potassium","el_aluminium","el_silicon","el_oxygen","el_hydrogen"],"fact":"Splits into sheets thin enough to see through. The dark flecks in granite.","src":"https://en.wikipedia.org/wiki/Mica","kind":"compound","formula":"KAl3Si3O10(OH)2","tier":"molecule"},{"id":"bed_calcium_carbonate","name":"Calcium Carbonate","srcTitle":"Calcium carbonate","of":["el_calcium","el_carbon","el_oxygen"],"fact":"Chalk, limestone, eggshell and seashell. Life's favourite building material.","src":"https://en.wikipedia.org/wiki/Calcium_carbonate","kind":"compound","formula":"CaCO3","tier":"molecule"},{"id":"bed_halite","name":"Rock Salt","srcTitle":"Halite","of":["el_sodium","el_chlorine"],"fact":"A cube of alternating ions. The only mineral humans eat by the spoonful.","src":"https://en.wikipedia.org/wiki/Halite","kind":"compound","formula":"NaCl","tier":"molecule"},{"id":"bed_glucose","name":"Glucose","srcTitle":"Glucose","of":["el_carbon","el_hydrogen","el_oxygen"],"fact":"What photosynthesis actually makes. Every other food molecule is built from it or burnt into it.","src":"https://en.wikipedia.org/wiki/Glucose","kind":"compound","formula":"C6H12O6","tier":"monomer"},{"id":"bed_starch","name":"Starch","srcTitle":"Starch","of":["bed_glucose"],"fact":"Thousands of glucose units chained up for storage. A seed's packed lunch.","src":"https://en.wikipedia.org/wiki/Starch","kind":"compound","formula":"(C6H10O5)n","tier":"polymer","via":"glycosidic"},{"id":"bed_cellulose","name":"Cellulose","srcTitle":"Cellulose","of":["bed_glucose"],"fact":"The same glucose, bonded the other way round — and that one flip is why we can eat bread but not wood.","src":"https://en.wikipedia.org/wiki/Cellulose","kind":"compound","formula":"(C6H10O5)n","tier":"polymer","via":"glycosidic"},{"id":"bed_amino_acid","name":"Amino Acid","srcTitle":"Amino acid","of":["el_carbon","el_hydrogen","el_oxygen","el_nitrogen","el_sulfur"],"fact":"Twenty of them, in every living thing on Earth, all the same handedness. No exception has ever been found.","src":"https://en.wikipedia.org/wiki/Amino_acid","kind":"compound","tier":"monomer","variants":["bed_glycine","bed_alanine","bed_serine","bed_cysteine","bed_threonine","bed_valine","bed_leucine","bed_isoleucine","bed_proline","bed_phenylalanine","bed_tyrosine","bed_tryptophan","bed_aspartate","bed_glutamate","bed_asparagine","bed_glutamine","bed_lysine","bed_arginine","bed_histidine","bed_methionine"]},{"id":"bed_protein","name":"Protein","srcTitle":"Protein","of":["bed_tertiary_fold"],"fact":"A chain folded into one specific shape. The shape is the function — and it is decided entirely by the order of the links.","src":"https://en.wikipedia.org/wiki/Protein","kind":"compound","note":"Built from the twenty amino acids. Each bond formed releases one water molecule, which is why a residue in a chain is lighter than the free acid it came from.","tier":"structure","via":"folding"},{"id":"bed_fatty_acid","name":"Fatty Acid","srcTitle":"Fatty acid","of":["el_carbon","el_hydrogen","el_oxygen"],"fact":"A long carbon tail that will not mix with water. That refusal is what makes a cell membrane possible.","src":"https://en.wikipedia.org/wiki/Fatty_acid","kind":"compound","tier":"monomer"},{"id":"bed_lipid","name":"Fat","srcTitle":"Lipid","of":["bed_fatty_acid","bed_glycerol"],"fact":"Twice the energy per gram of sugar, which is why seeds and animals both store it.","src":"https://en.wikipedia.org/wiki/Lipid","kind":"compound","tier":"polymer","via":"ester"},{"id":"bed_nucleotide","name":"Nucleotide","srcTitle":"Nucleotide","of":["el_carbon","el_hydrogen","el_oxygen","el_nitrogen","el_phosphorus"],"fact":"Sugar, phosphate and a base. Four of them spell out everything alive.","src":"https://en.wikipedia.org/wiki/Nucleotide","kind":"compound","tier":"monomer"},{"id":"bed_dna","name":"DNA","srcTitle":"DNA","of":["bed_nucleotide"],"fact":"The instructions for building the thing you are holding, written in four letters.","src":"https://en.wikipedia.org/wiki/DNA","kind":"compound","tier":"polymer","via":"phosphodiester"},{"id":"bed_chlorophyll","name":"Chlorophyll","srcTitle":"Chlorophyll","of":["el_carbon","el_hydrogen","el_oxygen","el_nitrogen","el_magnesium"],"fact":"Catches the photon and hands its energy to chemistry. One magnesium atom sits at the centre.","src":"https://en.wikipedia.org/wiki/Chlorophyll","kind":"compound","formula":"C55H72MgN4O5","tier":"molecule"},{"id":"bed_photon","name":"Sunlight","srcTitle":"Photon","of":[],"fact":"Eight minutes and nineteen seconds old when it reaches the leaf. Not matter at all — the only thing here that is pure energy.","src":"https://en.wikipedia.org/wiki/Photon","kind":"particle","tier":"particle"},{"id":"bed_fusion","name":"Hydrogen Fusion","srcTitle":"Proton–proton chain","of":["el_hydrogen","el_helium","bed_photon"],"fact":"Four hydrogen nuclei become one helium, and the missing mass leaves as light. That light is the entire energy budget of this game.","src":"https://en.wikipedia.org/wiki/Proton%E2%80%93proton_chain","kind":"compound","tier":"particle"},{"id":"bed_glycerol","kind":"compound","tier":"molecule","name":"Glycerol","formula":"C3H8O3","of":["el_carbon","el_hydrogen","el_oxygen"],"srcTitle":"Glycerol","fact":"A three-carbon spine with three hooks. Hang a fatty acid on each and you have a fat.","src":"https://en.wikipedia.org/wiki/Glycerol"},{"id":"bed_polypeptide","kind":"compound","tier":"polymer","name":"Polypeptide Chain","of":["bed_amino_acid"],"via":"peptide","srcTitle":"Peptide","fact":"Amino acids in a line, in a specific order. The order is written in DNA and read by a ribosome.","src":"https://en.wikipedia.org/wiki/Peptide"},{"id":"bed_secondary_structure","kind":"compound","tier":"structure","name":"Helix & Sheet","of":["bed_polypeptide"],"via":"hydrogen","srcTitle":"Protein secondary structure","fact":"The chain coils into helices and pleats into sheets, held only by hydrogen bonds along the backbone.","src":"https://en.wikipedia.org/wiki/Protein_secondary_structure"},{"id":"bed_tertiary_fold","kind":"compound","tier":"structure","name":"Fold","of":["bed_secondary_structure"],"via":"folding","srcTitle":"Protein tertiary structure","fact":"Helices and sheets pack into one compact shape, usually within a second of being made.","src":"https://en.wikipedia.org/wiki/Protein_tertiary_structure"},{"id":"bed_enzyme","kind":"compound","tier":"assembly","name":"Enzyme","of":["bed_protein"],"srcTitle":"Enzyme","fact":"A protein with a pocket shaped to hold one particular molecule. Nearly every step in this game is one of these doing its job.","src":"https://en.wikipedia.org/wiki/Enzyme"},{"id":"bed_membrane","kind":"compound","tier":"assembly","name":"Membrane","of":["bed_lipid","bed_protein"],"srcTitle":"Cell membrane","fact":"Two layers of fat, tails inward, because the tails will not tolerate water. Life needs an inside, and this is how it gets one.","src":"https://en.wikipedia.org/wiki/Cell_membrane"},{"id":"bed_cell","kind":"compound","tier":"cell","name":"Cell","of":["bed_membrane","bed_dna","bed_protein","bed_water_molecule"],"srcTitle":"Cell (biology)","fact":"The smallest thing that is unambiguously alive. Everything you have eaten was made of these.","src":"https://en.wikipedia.org/wiki/Cell_(biology)"},{"id":"bed_muscle_tissue","kind":"compound","tier":"tissue","name":"Muscle","of":["bed_cell","bed_protein"],"srcTitle":"Muscle tissue","fact":"Cells packed with protein filaments that ratchet past each other. Meat is this, rested.","src":"https://en.wikipedia.org/wiki/Muscle"}],"composition":{"stone":["bed_silica","bed_feldspar","bed_mica"],"water":["bed_water_molecule"],"seed":["bed_starch","bed_protein","bed_lipid","bed_dna"],"sun":["bed_fusion"],"egg":["bed_protein","bed_lipid","bed_calcium_carbonate","bed_water_molecule"],"milk":["bed_water_molecule","bed_lipid","bed_protein","bed_glucose"],"meat":["bed_muscle_tissue"],"flour":["bed_starch","bed_protein"],"honey":["bed_glucose","bed_water_molecule"],"salt":["bed_halite"],"glass":["bed_silica"],"clay":["bed_feldspar","bed_water_molecule"],"wood":["bed_cellulose"],"leaf":["bed_chlorophyll","bed_cellulose","bed_cell","bed_water_molecule"],"cheese":["bed_protein","bed_lipid","bed_calcium_carbonate","bed_water_molecule"],"yeast":["bed_cell"]},"$comment_atoms":"The full periodic table is present as a reference set. Only those marked inPlay carry authored text and appear in a provenance tree today; the rest are here so later domains (metallurgy, medicine) have somewhere to attach, and so the table reads as complete to a curious player.","$comment_visual":"kind drives shape (atom=periodic tile, compound=hexagon, particle=glow) and category drives colour. Categories are assigned by atomic number and checked for gaps and overlaps at build time.","aminos":[{"id":"bed_glycine","kind":"amino","name":"Glycine","code3":"Gly","code1":"G","residue":"C2H3NO","formula":"C2H5NO2","of":["el_carbon","el_hydrogen","el_nitrogen","el_oxygen"],"srcTitle":"Glycine","fact":"The smallest, and the only one with no handedness.","src":"https://en.wikipedia.org/wiki/Glycine"},{"id":"bed_alanine","kind":"amino","name":"Alanine","code3":"Ala","code1":"A","residue":"C3H5NO","formula":"C3H7NO2","of":["el_carbon","el_hydrogen","el_nitrogen","el_oxygen"],"srcTitle":"Alanine","fact":"The simplest with a side chain: a single carbon.","src":"https://en.wikipedia.org/wiki/Alanine"},{"id":"bed_serine","kind":"amino","name":"Serine","code3":"Ser","code1":"S","residue":"C3H5NO2","formula":"C3H7NO3","of":["el_carbon","el_hydrogen","el_nitrogen","el_oxygen"],"srcTitle":"Serine","fact":"Its spare hydroxyl is where cells attach switches.","src":"https://en.wikipedia.org/wiki/Serine"},{"id":"bed_cysteine","kind":"amino","name":"Cysteine","code3":"Cys","code1":"C","residue":"C3H5NOS","formula":"C3H7NO2S","of":["el_carbon","el_hydrogen","el_nitrogen","el_oxygen","el_sulfur"],"srcTitle":"Cysteine","fact":"Two of these bond to each other and staple a protein shut.","src":"https://en.wikipedia.org/wiki/Cysteine"},{"id":"bed_threonine","kind":"amino","name":"Threonine","code3":"Thr","code1":"T","residue":"C4H7NO2","formula":"C4H9NO3","of":["el_carbon","el_hydrogen","el_nitrogen","el_oxygen"],"srcTitle":"Threonine","fact":"Essential — you must eat it, you cannot build it.","src":"https://en.wikipedia.org/wiki/Threonine"},{"id":"bed_valine","kind":"amino","name":"Valine","code3":"Val","code1":"V","res const CAUTIONS = {"botulism":{"label":"Preserving is not a recipe you can eyeball","note":"Fermenting and curing at home is real food science and it has a real failure mode. Clostridium botulinum grows in exactly the conditions these methods create — low oxygen, low acid, room temperature — and the toxin has no taste or smell. Salt concentration, acidity and temperature are not details; they are the whole safety margin. Follow a tested method from a food-safety authority, not a game.","ids":["brine","pickle","sauerkraut","kimchi","salted_cabbage","salt_fish","cured_meat","bacon","aspic","smoked_fish","sourdough_starter"]},"caustic":{"label":"Lye burns on contact","note":"Sodium hydroxide is strongly caustic. It damages skin and eyes immediately and generates heat when it meets water. Historic soap-making is a good story and a bad first experiment.","ids":["lye","soap"]},"fire":{"label":"Fire and hot fat","note":"Cooking oil reaches temperatures that ignite, and water thrown into it will throw burning oil across a room. Never leave hot fat unattended, and never put water on an oil fire.","ids":["fire","spark","charcoal","candle","fried_fish","battered_fish","chips","fish_and_chips","caramel","caramel_sauce"]},"raw":{"label":"Raw egg and unpasteurised milk","note":"Both can carry salmonella or listeria. The risk is small for most people and much larger if you are pregnant, very young, elderly, or immunocompromised.","ids":["mayonnaise","egg_mayo","milk","cream","curd","blue_cheese"]},"alcohol":{"label":"Alcohol","note":"Fermentation is how alcohol is made, and this part of the game explains that chemistry. It is not a brewing guide, and the drinking age where you live applies to you and not to the game.","ids":["beer","wine","cider","mead","aged_wine","mead_must","wort","malt","vinegar"]},"cherry_kernel":{"label":"The stone, not the fruit","note":"Cherry flesh is entirely safe and this caution is not about eating cherries. The kernels inside the hard pits contain amygdalin, which releases hydrogen cyanide when chewed or swallowed. Do not crack the stones open.","ids":["cherry"]},"mercury_toxicity":{"label":"Mercury is toxic, in the ore and in the metal","note":"Mercury and its compounds are toxic to the nervous system, immune system and kidneys, and both mining cinnabar and refining mercury from it are historic causes of mercury poisoning. This is chemistry to understand, not something to try at home.","ids":["cinnabar","mercury"]},"uranium_toxicity":{"label":"Uranium is a heavy-metal poison first","note":"The main risk of exposure is chemical poisoning by uranium oxide rather than radioactivity — incorporated uranium accumulates in bone, liver, kidney and reproductive tissue. An excess risk of lung cancer has been documented among Navajo uranium miners specifically and linked to their occupation.","ids":["ore","uranium","yellowcake"]},"reactive_metal":{"label":"These metals set fire to water","note":"Sodium forms flammable hydrogen and caustic sodium hydroxide on contact with water, and potassium reacts hard enough to ignite that hydrogen itself. Magnesium burns at around 3,100°C with a brilliant white light carrying strong ultraviolet. This is real chemistry, and none of it is a demonstration to improvise.","ids":["sodium","potassium","magnesium","calcium"]},"lead_toxicity":{"label":"Lead is a neurotoxin","note":"Lead is a neurotoxin that accumulates in soft tissue and bone. It damages the nervous system, interferes with biological enzymes, and can cause neurological problems ranging from behavioural issues to brain damage.","ids":["lead"]},"chlorine_gas":{"label":"Chlorine gas is a poison, and was used as one","note":"Elemental chlorine at high concentration is extremely dangerous and poisonous to most living organisms. It was the first gas deployed as a weapon, at the Second Battle of Ypres on 22 April 1915. This page is about where an industrial chemical comes from, and nothing on it is a method.","ids":["chlorine"]},"fluorine_hazard":{"label":"Fluorine is why chemistry has martyrs","note":"Fluorine in its elemental form is highly toxic, and it reacts with almost every other element. Several nineteenth-century experimenters who tried to isolate it were injured or killed, and are remembered as the fluorine martyrs.","ids":["fluorine","fluorite"]},"arsenic_toxicity":{"label":"Arsenic is a poison, and a drinking-water problem","note":"Arsenic compounds have been known since ancient times to be poisonous. The commonest cause of long-term exposure today is not deliberate — it is contaminated groundwater, and more than 200 million people worldwide are exposed to unsafe levels.","ids":["arsenic"]},"selenium_dose":{"label":"Essential and toxic are the same element, at different doses","note":"Selenium is a required nutrient: the adult recommended intake is 55 micrograms a day and the tolerable upper limit is 400. Exceeding it causes selenosis. That is a narrow window compared with almost anything else on the shelf.","ids":["selenium"]},"heavy_metal_dust":{"label":"Some metals are only dangerous once they are dust","note":"Cadmium is toxic and accumulates in the kidneys. Manganese overexposure causes manganism, a permanent movement disorder. Osmium tetroxide, which forms when osmium powder meets air, damages eyes and lungs at very low concentrations.","ids":["cadmium","manganese","osmium"]},"radioactivity":{"label":"These are radioactive, and that is the point of some of them","note":"Radium, thorium, plutonium and polonium are all radioactive. Radium was painted onto watch dials by women who wet the brushes with their lips, and many of them died of it — the Radium Girls case changed occupational-safety law. Polonium is acutely toxic in microgram amounts.","ids":["radium","thorium","plutonium","polonium","monazite"]}};
const CAUTION_BY_ID = {};
for (const [kind, h] of Object.entries(CAUTIONS))
  for (const id of h.ids) (CAUTION_BY_ID[id] = CAUTION_BY_ID[id] || []).push({ kind, ...h });
function cautionsFor(id) { return CAUTION_BY_ID[id] || []; }
function cautionHTML(id) {
  const cs = cautionsFor(id);
  if (!cs.length) return '';
  return cs.map(c => `<div class="caution"><b>${c.label}</b><p>${c.note}</p></div>`).join('');
}
/* ── art renderer ─────────────────────────────────────────────────────────
 * Turns a shape record from data/art.json into inline SVG.
 *
 * No shape carries a colour. Every fill and stroke resolves to a CSS custom
 * property, so a theme is a stylesheet — not a second set of drawings.
 *
 *   lo | bs | hi          the item's own category, set by [data-cat]
 *   ik | gh               ink and ghost, global
 *   ground | discovery    surfaces, global
 *   plant-bs, fire-hi ... another category's colour, for a detail
 *   #RRGGBB               a literal — reserved for CPK atom colours
 */
function artPaint(role) {
  if (typeof role !== 'string') return 'var(--gh)';
  if (role.charCodeAt(0) === 35) return role;              // '#'
  if (role.indexOf('-') > 0) return `var(--c-${role})`;
  return `var(--${role})`;
}

function artShape(s) {
  switch (s[0]) {
    case 'p': return `<path data-f d="${s[1]}" fill="${artPaint(s[2])}"/>`;
    case 's': return `<path data-s d="${s[1]}" fill="none" stroke="${artPaint(s[2])}" ` +

    else groups.forEach(([f]) => shelfShut.add(f.id));
    shelfAutoFolded = true;
    renderShelf();
  };
  const ra = aside.querySelector('[data-readyall]');
  if (ra) ra.onclick = ev => { ev.stopPropagation(); readyAll = !readyAll; renderShelf(); };
  aside.querySelectorAll('[data-fold]').forEach(h => h.onclick = ev => {
    if (ev.target.closest('input')) return;
    const id = h.dataset.fold;
    shelfShut.has(id) ? shelfShut.delete(id) : shelfShut.add(id);
    renderShelf();
  });
  document.getElementById('live').textContent = liveCount ? `${liveCount} still have something to give` : '';

  // A tool that only says "Locked" teaches nothing. Name it, and say plainly
  // what opens it — the answer is always something you can go and make.
  document.getElementById('tray').innerHTML = verbs.map(v => {
    const open = ul.has(v.id);
    const key = v.unlockedBy ? byId[v.unlockedBy] : null;
    return `<div class="verb${open ? '' : ' locked'}" data-verb="${v.id}"
              ${open ? '' : `data-needs="${v.unlockedBy}"`}
              title="${open ? v.blurb : `Unlocks when you make ${nameOf(key)}`}">
       <span class="e">${glyph('verb_' + v.id, 27)}</span>${v.name}
       ${open ? '' : `<i class="lk">${key ? glyph(key.id, 15) : '·'}</i>`}</div>`;
  }).join('');

  document.getElementById('count').innerHTML = prefs.freePlay
    ? `<span class="sc">Free Play</span>`
    : `<span class="sc">${found.size}</span><span class="lbl">of ${elements.length} found</span>`;
  document.getElementById('count').classList.toggle('free', !!prefs.freePlay);
  const g = byId[GOAL];
  document.getElementById('goal').innerHTML = found.has(GOAL)
    ? `Made <b>${glyph(g.id, 18)} ${nameOf(g)}</b> — now try Feast`
    : `Goal: <b>${glyph(g.id, 18)} ${nameOf(g)}</b><i class="ask">?</i>`;
}

// ---- the world: chips live in world coordinates; the view pans and zooms ----
const world = document.getElementById('world');
const linkSvg = document.getElementById('links');
const view = { x: 0, y: 0, k: 1 };
const links = [];                                     // {a,b,out} DOM refs

function applyView() {
  world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`;
}
// The board can report zero size in embedded or not-yet-laid-out contexts, and
// every position derived from it then collapses into the corner. Fall back to
// the viewport, then to a sane default, so layout is never nonsense.
function boardBox() {
  const b = board.getBoundingClientRect();
  // The fallbacks subtract the sidebar and the tool tray from the viewport.
  // If the viewport itself reads as zero — a tab that has not been sized yet —
  // that subtraction produces a NEGATIVE width, which is truthy, so it was
  // used, and every position derived from it collapsed to the origin. Clamp.
  const w = Math.max(320, b.width  || (window.innerWidth  - 240) || 900);
  const h = Math.max(320, b.height || (window.innerHeight - 120) || 600);
  return { left: b.left, top: b.top, width: w, height: h };
}
function toWorld(sx, sy) {
  const b = boardBox();
  return [(sx - b.left - view.x) / view.k, (sy - b.top - view.y) / view.k];
}
// offsetWidth forces layout. Reading it for every chip on every pointer move
// was the single most expensive thing on the canvas, so measure once per chip
// and keep it — chip size never changes after it is built.
let sizeCache = new WeakMap();
function chipSize(el) {
  let s = sizeCache.get(el);
  if (!s) { s = [el.offsetWidth, el.offsetHeight]; if (s[0]) sizeCache.set(el, s); }
  return s;
}
const chipCentre = (el) => {
  const [w, h] = chipSize(el);
  return [(parseFloat(el.style.left) || 0) + w / 2, (parseFloat(el.style.top) || 0) + h / 2];
};

// Nothing you have made is ever destroyed by a tap. Tapping folds the branch
// below a chip out of sight and puts a count on it; tapping again brings it
// back. To clear the bench, use Tidy — and even that only removes chips, never
// discoveries, which live in the codex permanently.
function childrenOf(chip) {
  return links.filter(l => l.a === chip || l.b === chip).map(l => l.out);
}
function descendantsOf(chip, acc = new Set()) {
  for (const k of childrenOf(chip)) {
    if (acc.has(k)) continue;
    acc.add(k);
    descendantsOf(k, acc);
  }
  return acc;
}
// A new result arrives with its ingredients already folded into it, so the
// bench shows what you have made rather than everything it took. One tap opens
// a thing up to show what went in; tap again to close it. Two taps remove the
// chip — never the discovery, which stays in the codex.
function parentsOf(chip) {
  return links.filter(l => l.out === chip).flatMap(l => [l.a, l.b]).filter(Boolean);
}
function ancestorsOf(chip, acc = new Set()) {
  for (const p of parentsOf(chip)) {
    if (acc.has(p)) continue;
    acc.add(p);
    ancestorsOf(p, acc);
  }
  return acc;
}
// A chip is only hidden if every result it feeds is closed. Shared ingredients
// stay visible for whichever branch still wants them.
function refreshFolds() {
  const hide = new Set();
  for (const c of world.querySelectorAll('.chip.board')) {
    if (!c.classList.contains('folded')) continue;
    for (const a of ancestorsOf(c)) hide.add(a);
  }
  for (const c of world.querySelectorAll('.chip.board')) {
    const anyOpenChild = links.some(l =>
      (l.a === c || l.b === c) && l.out.isConnected && !l.out.classList.contains('folded'));
    c.classList.toggle('hidden', hide.has(c) && !anyOpenChild);
  }
  for (const c of world.querySelectorAll('.chip.board')) {
    const n = c.classList.contains('folded') ? ancestorsOf(c).size : 0;
    c.dataset.fold = n ? `${n}` : '';
  }
  unstack();
  drawLinks();
}

/**
 * Never reveal two cards on the same spot.
 *
 * A card that is folded away is display:none, so nothing stops it sharing a
 * position with another folded card — and nothing notices until the player
 * unfolds the branch and finds one card sitting exactly on top of another.
 * Whatever put them there, the fix belongs here: when a card becomes visible,
 * it gets a clear spot if it does not have one.
 */
function unstack() {
  const [cw, ch] = cardSize();
  const seenAt = [];
  for (const c of world.querySelectorAll('.chip.board:not(.hidden)')) {
    let x = parseFloat(c.style.left) || 0, y = parseFloat(c.style.top) || 0;
    // A genuine rectangle overlap, not just "suspiciously close": the half-card
    // threshold this used to use only ever caught two cards sitting at the
    // exact same spot, which was the one bug it was written for. It missed the
    // much more common case a density change creates — cards spaced correctly
    // for a small footprint (Pill) that now genuinely overlap under a bigger
    // one (Card), by anywhere up to a full card-width.
    const clash = seenAt.some(p => Math.abs(p[0] - x) < cw && Math.abs(p[1] - y) < ch);
    if (clash) {
      const spot = freeSpot(cw, ch, [x + cw / 2, y + ch / 2]);
      if (spot) { x = spot[0]; y = spot[1]; c.style.left = x + 'px'; c.style.top = y + 'px'; }
    }
    seenAt.push([x, y]);
  }
}
let lastChipTap = { el: null, t: 0 };
function chipTap(chip) {
  const now = Date.now();
  if (lastChipTap.el === chip && now - lastChipTap.t < 320) {
    lastChipTap = { el: null, t: 0 };
    if (chip.classList.contains('folded')) toggleBranch(chip);   // undo the fold the first tap did
    removeChip(chip);
    return;
  }
  lastChipTap = { el: chip, t: now };
  toggleBranch(chip);
}

function removeChip(chip, instant) {
  // Orphaned links would draw to nothing, so drop them with it.
  for (let i = links.length - 1; i >= 0; i--) {
    const l = links[i];
    if (l.a === chip || l.b === chip || l.out === chip) links.splice(i, 1);
  }
  // Taking one card off the bench should look like taking a card off a bench.
  // Clearing forty at once should not: forty simultaneous animations read as a
  // glitch, and the caller usually wants the board settled before it measures.
  if (instant) { chip.remove(); return; }
  setTimeout(refreshFolds, 170);
  chip.classList.add('leaving');
  sfx.pick();
  setTimeout(() => { chip.remove(); drawLinks(); }, 160);
}

function toggleBranch(chip) {
  if (!parentsOf(chip).length) {                      // nothing went into it
    chip.classList.add('pulse');
    setTimeout(() => chip.classList.remove('pulse'), 380);
    return;
  }
  chip.classList.toggle('folded');
  refreshFolds();
  sfx.pick();
}

// Connections persist, so the canvas becomes a diagram of what you built
// rather than a scratchpad that forgets.
let linkFrame = 0, linkFallback = 0;
/**
 * Redraw only the lines attached to one card.
 *
 * Rebuilding every path costs about 19ms once the bench is full, and a drag
 * asks for a redraw on every pointer move — which is a dropped frame every
 * frame. Moving one card can only move the lines that touch it, so during a
 * drag we reposition those and leave the rest alone.

function drawLinksFor(chip) {
  const uid = chip && chip.dataset.uid;
  if (!uid) { drawLinks(); return; }
  const paths = linkSvg.querySelectorAll(`path[data-from="${uid}"],path[data-to="${uid}"]`);
  if (!paths.length) return;
  const centres = new Map();
  const centreOf = el => {
    if (!centres.has(el)) centres.set(el, chipCentre(el));
    return centres.get(el);
  };
  const byUid = new Map();
  for (const c of world.querySelectorAll('.chip.board')) byUid.set(c.dataset.uid, c);
  for (const p of paths) {
    const a = byUid.get(p.dataset.from), b = byUid.get(p.dataset.to);
    if (!a || !b) continue;
    const [sx, sy] = centreOf(a), [ox, oy] = centreOf(b);
    const my = (sy + oy) / 2;
    p.setAttribute('d', `M ${sx} ${sy} C ${sx} ${my}, ${ox} ${my}, ${ox} ${oy}`);
  }
}

function drawLinks() {
  if (linkFrame) return;                              // at most one redraw a frame
  linkFrame = requestAnimationFrame(() => {
    linkFrame = 0; clearTimeout(linkFallback); linkFallback = 0; drawLinksNow();
  });
  // Frame callbacks do not fire in a hidden or throttled tab, and a board whose
  // lines never redraw looks broken. Guarantee the redraw either way.
  if (!linkFallback) linkFallback = setTimeout(() => {
    if (linkFrame) { cancelAnimationFrame(linkFrame); linkFrame = 0; }
    linkFallback = 0; drawLinksNow();
  }, 120);
}
// Each family's colour, for the pulses that travel the lines.
// Read from the stylesheet rather than restated here, so the mote that runs
// down a link is exactly the colour of the thing that sent it.
const FAM_HEX = new Proxy({}, { get: (_, k) =>
  getComputedStyle(document.documentElement).getPropertyValue('--fam-' + String(k)).trim() || '#A3937E' });
let pathSeq = 0;

function drawLinksNow() {
  const parts = [];
  // Pulses are the expensive part, so drop them on a busy board or when the
  // player has asked for quiet. The lines themselves always draw.
  const flowing = prefs.tone === 'playful'
    && !matchMedia('(prefers-reduced-motion: reduce)').matches
    && links.length <= 40;
  for (const l of links) {
    if (!l.out.isConnected || l.out.classList.contains('hidden')) continue;
    const [ox, oy] = chipCentre(l.out);
    for (const src of [l.a, l.b]) {
      if (!src || !src.isConnected || src.classList.contains('hidden')) continue;
      const [sx, sy] = chipCentre(src);
      // A curve, not a spoke: it reads as flow rather than wiring, and two
      // parents converging on one child stop looking like a Y of straight lines.
      const my = (sy + oy) / 2;
      const d = `M ${sx} ${sy} C ${sx} ${my}, ${ox} ${my}, ${ox} ${oy}`;
      const id = `lp${++pathSeq}`;
      // The two ends are recorded on the element so a drag can update only the
      // lines it actually moves.
      parts.push(`<path id="${id}" class="made${l.fresh ? ' fresh' : ''}" d="${d}"` +
                 ` data-from="${src.dataset.uid}" data-to="${l.out.dataset.uid}"/>`);
      if (flowing) {
        // A mote of the ingredient travelling into what it becomes — gold from
        // the sun, blue from water. Offset starts so they never march in step.
        const hex = FAM_HEX[src.dataset.fam] || '#8A7B6B';
        const dur = (2.1 + (pathSeq % 5) * 0.22).toFixed(2);
        parts.push(
          `<circle r="3.4" fill="${hex}" class="mote">` +
          `<animateMotion dur="${dur}s" repeatCount="indefinite" begin="-${(pathSeq % 7) * 0.31}s">` +
          `<mpath href="#${id}"/></animateMotion></circle>`);
      }
    }
    l.fresh = false;
  }
  linkSvg.innerHTML = parts.join('');

function zoomBy(f, cx, cy) {
  const b = boardBox();
  const px = cx == null ? b.width / 2 : cx - b.left;
  const py = cy == null ? b.height / 2 : cy - b.top;
  const k2 = Math.max(0.06, Math.min(2.4, view.k * f));
  view.x = px - (px - view.x) * (k2 / view.k);
  view.y = py - (py - view.y) * (k2 / view.k);
  view.k = k2;
  applyView();
}
function fitAll() {
  const chips = [...world.querySelectorAll('.chip.board')];
  if (!chips.length) return;
  const [cw, ch] = cardSize();
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  for (const c of chips) {
    const l = parseFloat(c.style.left) || 0, t = parseFloat(c.style.top) || 0;
    x1 = Math.min(x1, l); y1 = Math.min(y1, t);
    x2 = Math.max(x2, l + cw); y2 = Math.max(y2, t + ch);
  }
  const b = boardBox(), pad = 60;
  // The floor used to be 0.25, which is not far enough out to see a full bench.
  // A button called "fit everything" that shows an empty board is worse than
  // no button.
  view.k = Math.max(0.06, Math.min(1.4, Math.min((b.width - pad) / (x2 - x1 || 1),
                                                 (b.height - pad) / (y2 - y1 || 1))));
  view.x = b.width / 2 - ((x1 + x2) / 2) * view.k;
  view.y = b.height / 2 - ((y1 + y2) / 2) * view.k;
  applyView();
}
// Tidy: lay the whole bench out as the diagram it already is — sources at the
// top, each result on the row below its parents. Nothing is removed; this is
// arrangement, not cleanup.
function tidy() {
  const chips = [...world.querySelectorAll('.chip.board:not(.hidden)')];
  if (!chips.length) return;
  const parents = new Map(chips.map(c => [c, []]));
  for (const l of links) {
    if (!parents.has(l.out)) continue;
    for (const p of [l.a, l.b]) if (p && parents.has(p)) parents.get(l.out).push(p);
  }
  const depth = new Map();
  const depthOf = (c, seen = new Set()) => {
    if (depth.has(c)) return depth.get(c);
    if (seen.has(c)) return 0;
    seen.add(c);
    const ps = parents.get(c) ?? [];
    const d = ps.length ? Math.max(...ps.map(p => depthOf(p, seen))) + 1 : 0;
    depth.set(c, d);
    return d;
  };
  chips.forEach(c => depthOf(c));
  const rows = new Map();
  for (const c of chips) {
    const d = depth.get(c);
    if (!rows.has(d)) rows.set(d, []);
    rows.get(d).push(c);
  }
  const b = boardBox();
  const [ox, oy] = toWorld(b.left + 40, b.top + 40);
  const rowH = 78;
  let y = oy;
  for (const d of [...rows.keys()].sort((a, z) => a - z)) {
    const row = rows.get(d);
    let x = ox;
    for (const c of row) {
      c.style.left = x + 'px';
      c.style.top = y + 'px';
      x += c.offsetWidth + 16;
    }
    y += rowH;
  }

  fitAll();

document.getElementById('zoom').addEventListener('click', ev => {
  // closest(), not ev.target: the Tidy button's clickable area is the SVG
  // inside it, so ev.target was the <svg>/<span> and dataset.z was undefined —
  // the button did nothing at all when clicked on the icon, which is the only
  // part of it there is.
  const btn = ev.target.closest('[data-z]');
  if (!btn) return;
  const z = btn.dataset.z;
  if (z === 'in') zoomBy(1.25);
  else if (z === 'out') zoomBy(0.8);
  else if (z === 'fit') fitAll();
  else if (z === 'tidy') tidy();
});
board.addEventListener('wheel', ev => {
  ev.preventDefault();
  zoomBy(ev.deltaY < 0 ? 1.12 : 0.89, ev.clientX, ev.clientY);
}, { passive: false });

// Pinch. Pointer events give us every finger, so we track them ourselves rather
// than relying on gesture events, which only Safari implements.
const touches = new Map();
let pinch = null;
board.addEventListener('pointerdown', ev => {
  if (ev.pointerType !== 'touch') return;
  touches.set(ev.pointerId, ev);
  if (touches.size === 2) {
    const [a, b] = [...touches.values()];
    pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) };
    pan = null; drag = null;                          // a second finger cancels a drag
    document.querySelectorAll('.chip.drag').forEach(c => c.classList.remove('drag'));
  }
}, true);
board.addEventListener('pointermove', ev => {
  if (ev.pointerType !== 'touch' || !touches.has(ev.pointerId)) return;
  touches.set(ev.pointerId, ev);
  if (touches.size !== 2 || !pinch) return;
  ev.preventDefault();
  const [a, b] = [...touches.values()];
  const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  if (pinch.d > 0) zoomBy(d / pinch.d, (a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2);
  pinch.d = d;
}, true);
// Listen on the window, not the board. A touch that STARTS on the board can
// easily END somewhere else — lift your finger over the header, the verb tray,
// or off the top of the screen and #board never sees the pointerup at all.
// That left the finger in `touches` forever, and a phantom finger is not a
// harmless leak: the next single touch makes touches.size === 2, which arms a
// bogus pinch against a stale coordinate AND trips the `touches.size > 1`
// guard in the drag handler. Symptom is that zoom and drag both die until
// reload, right after tapping one of the zoom buttons.
for (const e of ['pointerup', 'pointercancel']) addEventListener(e, ev => {
  touches.delete(ev.pointerId);
  if (touches.size < 2) pinch = null;
}, true);
// Last-resort sweep: if no finger is actually down, nothing may be left over.
addEventListener('pointerdown', ev => {
  if (ev.pointerType === 'touch') return;
  if (touches.size) { touches.clear(); pinch = null; }
}, true);

// Double-tap zooms in, and again to fit — the standard map gesture.
let lastTap = 0;
board.addEventListener('pointerup', ev => {
  if (ev.target.closest('.chip.board, .verb, #zoom, #intro')) return;
  const now = Date.now();
  if (now - lastTap < 320) { view.k > 1.05 ? fitAll() : zoomBy(1.8, ev.clientX, ev.clientY); lastTap = 0; }
  else lastTap = now;
});

// Chips that land on top of each other cannot be dragged apart, so placement
// looks for space rather than trusting a random point.
/**
 * Somewhere to put a new card.
 *
 * This used to measure the distance between two top-left corners and accept
 * anything further apart than the card's *width*. That worked while a chip was
 * a wide flat pill. A specimen card is taller than it is wide, so the test
 * passed for cards that visibly overlapped, and every new card landed in the
 * same horizontal band. Test the actual rectangles instead.
 */
/**
 * How big a card is.
 *
 * Do not measure the card you are about to place. A card read back before its
 * stylesheet has applied reports its min-content width — 22px, not 94 — and 22
 * is a plausible-looking number, so it sails past any "is this zero" guard and
 * lays the entire bench out in a single 36px-pitch row. This file has now been
 * bitten three times by trusting a measurement taken too early (boardBox
 * returning 0x0, offsetWidth returning 0, and offsetWidth returning 22).
 *
 * A specimen card is a fixed size by design, so measure one that has actually
 * been on screen, once, and keep the answer.
 *
 * The size is no longer ONE fixed size, though — Card, Half card and Pill are
 * three different footprints (94x124, 66x~53, 104x~40), so a single "is this
 * at least 60x80" floor only ever matched Card and silently fed every other
 * density the fallback forever. The drawing inside the chip is the thing that
 * stays a reliable "has the stylesheet actually applied" signal across all
 * three, since .art is comfortably >=20px in every mode and near-zero before
 * the stylesheet loads — so check that instead of the outer box.
 */
const CARD_FALLBACK = [94, 124];
let chipSeq = 0;
let restoredBench = false;
let cardSizeCache = null;
function cardSize() {
  if (cardSizeCache) return cardSizeCache;
  for (const c of world.querySelectorAll('.chip.board')) {
    // getComputedStyle reads the CSS box model BEFORE `transform` is applied.
    // getBoundingClientRect reads the painted box AFTER it — which sounds like
    // a detail, but a card spawns with a scale-up pop animation, and this
    // function is often called in the same synchronous tick as a burst of
    // spawns, before any of their `.pop` classes have been timed out. Reading
    // the painted box during that animation measured cards at 40% of their
    // real size and cached that, which is a second, sneakier version of the
    // exact "measured too early" bug this function already exists to avoid.
    const w = parseFloat(getComputedStyle(c).width);
    const h = parseFloat(getComputedStyle(c).height);

}

function freeSpot(w, h, near) {
  const PAD = 14;
  [w, h] = cardSize();
  // Every card is the same size, so do not ask each one — see cardSize().
  const held = [...world.querySelectorAll('.chip.board')].map(c => ({
    x: parseFloat(c.style.left) || 0, y: parseFloat(c.style.top) || 0, w, h,
  }));
  const clear = (x, y) => held.every(r =>
    x + w + PAD <= r.x || r.x + r.w + PAD <= x ||
    y + h + PAD <= r.y || r.y + r.h + PAD <= y);

  const b = boardBox();
  // Anchor to the bench itself, not to the viewport. Anchoring to the viewport
  // meant that panning between placements — which ensureVisible does — moved
  // the origin each time, and the bench marched off across the world instead
  // of growing as one cluster.
  let origin = near;
  if (!origin) {
    if (held.length) {
      origin = [held.reduce((a, r) => a + r.x + r.w / 2, 0) / held.length,
                held.reduce((a, r) => a + r.y + r.h / 2, 0) / held.length];
    } else {
      origin = toWorld(b.left + b.width / 2, b.top + b.height / 2);

  const stepX = w + PAD, stepY = h + PAD;
  for (let ring = 0; ring < 40; ring++) {

    for (let dx = -ring; dx <= ring; dx++) {

        spots.push([cx + dx * stepX - w / 2, cy + dy * stepY - h / 2]);
