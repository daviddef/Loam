<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Loam — dirt to dinner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='26' fill='%23221C14'/%3E%3Cg stroke='%235C4B38' stroke-width='3' fill='none' stroke-linecap='round'%3E%3Cpath d='M28 34 Q44 54 56 66'/%3E%3Cpath d='M50 26 Q54 48 58 64'/%3E%3Cpath d='M70 26 Q66 48 62 64'/%3E%3Cpath d='M92 34 Q76 54 64 66'/%3E%3C/g%3E%3Ccircle cx='28' cy='34' r='8' fill='%239C8A74'/%3E%3Ccircle cx='50' cy='26' r='8' fill='%234E8CB8'/%3E%3Ccircle cx='70' cy='26' r='8' fill='%23E0A526'/%3E%3Ccircle cx='92' cy='34' r='8' fill='%236B8E4E'/%3E%3Crect x='42' y='66' width='36' height='30' rx='9' fill='%23E2703A'/%3E%3C/svg%3E">
<style>
  :root{
    --cream:#F6EDDD; --ink:#2B2118; --ink-soft:#6B5945;
    --orange:#E2703A; --mustard:#E0A526; --avocado:#6B8E4E; --brick:#A63D2F; --teal:#3E7C7B;
    --card:#FFF9EE; --line:#E0CFB4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    font:15px/1.45 ui-rounded,"SF Pro Rounded",Avenir,system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 18% 12%, #FBE4C4 0%, transparent 46%),
      radial-gradient(circle at 84% 78%, #E8DCC0 0%, transparent 52%),
      var(--cream);
    display:flex;flex-direction:column;user-select:none;
  }
  header{
    display:flex;align-items:center;gap:14px;padding:10px 16px;
    border-bottom:2px solid var(--line);background:rgba(255,249,238,.72);backdrop-filter:blur(8px);flex:none;
  }
  h1{font:700 17px/1 ui-rounded,Avenir,system-ui;margin:0;letter-spacing:-.2px}
  h1 span{color:var(--orange)}
  .mark{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;flex:none}
  .mark svg{width:26px;height:26px;border-radius:7px;flex:none;display:block}
  .goal{
    font-size:12.5px;color:var(--ink-soft);background:#fff;border:1.5px solid var(--line);
    border-radius:99px;padding:5px 12px;
  }
  .goal b{color:var(--brick)}
  .spacer{flex:1}
  .count{font:700 13px ui-rounded,Avenir;color:var(--avocado)}
  button{
    font:600 13px ui-rounded,Avenir,system-ui;color:var(--ink);cursor:pointer;
    background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:6px 13px;
  }
  button:active{transform:translateY(1px)}
  main{flex:1;display:flex;min-height:0}
  #board{flex:1;position:relative;overflow:hidden;touch-action:none}
  /* the canvas: an unbounded world you pan and zoom, not a fixed bench */
  #world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  #links{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
  #links path{fill:none;stroke:var(--line);stroke-width:2.5;stroke-linecap:round}
  #links path.made{stroke:var(--avocado);stroke-width:2.5;opacity:.5}
  @keyframes draw{from{stroke-dashoffset:var(--len,400)}to{stroke-dashoffset:0}}
  #links path.fresh{
    stroke-dasharray:var(--len,400);animation:draw .45s cubic-bezier(.3,.8,.4,1) forwards;
    stroke:var(--orange);stroke-width:3;opacity:.85;
  }
  #zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:5px;z-index:6}
  #zoom button{
    width:32px;height:32px;padding:0;font:700 15px ui-rounded,Avenir;border-radius:10px;
    background:rgba(255,249,238,.92);
  }
  #board{cursor:grab;touch-action:none;overscroll-behavior:contain}
  #board.panning{cursor:grabbing}
  #intro{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;
    width:min(330px,86%);text-align:center;padding:22px 20px 18px;
    background:var(--card);border:2.5px solid var(--ink);border-radius:20px;
    box-shadow:0 10px 0 rgba(43,33,24,.15);
  }
  #intro b{display:block;font:800 19px ui-rounded,Avenir;margin-bottom:9px}
  #intro p{font-size:13.5px;line-height:1.55;color:var(--ink-soft);margin:0 0 9px}
  #intro p.sub{color:var(--ink);font-weight:600}
  #intro button{background:var(--orange);color:#fff;border-color:var(--brick);padding:8px 24px;margin-top:4px}
  #intro.gone{display:none}
  aside{
    width:238px;flex:none;border-left:2px solid var(--line);background:rgba(255,249,238,.72);
    overflow-y:auto;padding:10px;
  }
  aside h2{
    font:700 10.5px/1 ui-rounded,Avenir;letter-spacing:.9px;text-transform:uppercase;
    color:var(--ink-soft);margin:12px 4px 7px;
  }
  aside h2:first-child{margin-top:2px}
  .shelf{display:flex;flex-wrap:wrap;gap:5px}
  .chip{
    display:inline-flex;align-items:center;gap:5px;background:var(--card);
    border:1.5px solid var(--line);border-radius:99px;padding:5px 10px 5px 7px;
    font:600 12.5px ui-rounded,Avenir,system-ui;white-space:nowrap;cursor:grab;
    box-shadow:0 1px 0 rgba(43,33,24,.07);
  }
  .chip .e{font-size:15px;line-height:1}
  .chip.folk{border-color:#D9C3E8;background:#FBF4FF}
  .chip.spent{opacity:.42}
  /* a chip mid-process: a ring fills as it rests, and it cannot be dragged */
  .chip.board.cooking{
    cursor:default;
    background:
      conic-gradient(var(--teal) var(--p,0%), transparent 0) border-box,
      var(--card) padding-box;
    border-color:transparent;padding:9px 15px 9px 11px;
  }
  .chip.board.cooking::after{
    content:attr(data-verb-label);position:absolute;top:-8px;right:-6px;font-size:13px;
    background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:1px 4px;
  }
  .chip.board.cooking .n{display:none}
  .chip.board.hidden{display:none}
  .chip.board.folded{border-style:dashed}
  .chip.board.folded::after{
    content:attr(data-fold);position:absolute;top:-9px;right:-8px;
    font:800 9.5px ui-rounded,Avenir;color:#fff;background:var(--ink-soft);
    border-radius:99px;padding:2px 6px;
  }
  @keyframes ripple{
    from{transform:translate(-50%,-50%) scale(.25);opacity:.75}
    to{transform:translate(-50%,-50%) scale(2.6);opacity:0}
  }
  .ring{
    position:absolute;width:96px;height:96px;border-radius:99px;pointer-events:none;
    border:2.5px solid var(--orange);animation:ripple .6s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes pulse{0%,100%{transform:scale(1)}45%{transform:scale(1.07)}}
  .chip.board.pulse{animation:pulse .38s ease}
  #waiting{color:var(--teal);font-weight:700}
  .chip.live{border-color:var(--avocado);box-shadow:0 0 0 2px rgba(107,142,78,.13)}
  .chip .n{
    font-style:normal;font-size:9.5px;font-weight:800;color:#fff;background:var(--avocado);
    border-radius:99px;min-width:14px;height:14px;line-height:14px;text-align:center;
    margin-left:2px;padding:0 3px;
  }
  .chip.board{
    position:absolute;padding:9px 15px 9px 11px;font-size:14.5px;border-width:2px;
    box-shadow:0 2px 0 rgba(43,33,24,.09), 0 6px 14px -6px rgba(43,33,24,.28);
    z-index:2;transition:box-shadow .16s, transform .16s;
  }
  .chip.board:hover{transform:translateY(-1px);box-shadow:0 3px 0 rgba(43,33,24,.11), 0 10px 18px -8px rgba(43,33,24,.34)}
  .chip.board .e{font-size:20px}
  .chip.drag{cursor:grabbing;z-index:99;transform:scale(1.09) rotate(-2deg);box-shadow:0 10px 22px rgba(43,33,24,.22)}
  .chip.target{
    border-color:var(--orange);background:#FFF0E6;transform:scale(1.07);
    box-shadow:0 0 0 4px rgba(226,112,58,.18), 0 8px 18px -6px rgba(43,33,24,.3);
  }
  @keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.16)}100%{transform:scale(1);opacity:1}}
  .chip.pop{animation:pop .32s cubic-bezier(.3,1.5,.5,1)}
  @keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .chip.nope{animation:nope .26s}
  #tray{
    flex:none;display:flex;gap:9px;justify-content:center;padding:11px;
    border-top:2px solid var(--line);background:rgba(255,249,238,.72);backdrop-filter:blur(8px);
  }
  .verb{
    display:flex;flex-direction:column;align-items:center;gap:2px;width:70px;padding:8px 4px;
    background:var(--card);border:2px dashed var(--line);border-radius:16px;
    font:700 11px ui-rounded,Avenir;color:var(--ink-soft);
  }
  .verb .e{font-size:21px;line-height:1.1}
  .verb.locked{opacity:.3}
  .verb.target{border-color:var(--teal);border-style:solid;background:#E8F4F3;color:var(--teal);transform:scale(1.07)}
  /* discovery card — one discreet line; a click opens it and keeps it */
  #card{
    position:fixed;left:14px;bottom:82px;width:min(300px,calc(100vw - 28px));z-index:150;
    opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .2s;
  }
  #card.on{opacity:1;transform:none;pointer-events:auto}
  .inner{
    position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:13px;
    box-shadow:0 5px 16px rgba(43,33,24,.13);overflow:hidden;cursor:pointer;
    border-left:4px solid var(--fam,var(--orange));
  }
  .line{display:flex;align-items:center;gap:8px;padding:9px 11px}
  .line .big{font-size:19px;line-height:1;flex:none}
  .line b{font:700 14px ui-rounded,Avenir;flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .line .chev{font-size:9px;color:#B9A88C;flex:none;transition:transform .2s}
  #card:not(.mini) .line .chev{transform:rotate(180deg)}
  .dot{width:7px;height:7px;border-radius:99px;flex:none}
  .dot.workshop{background:var(--avocado)} .dot.folklore{background:#9B6BC4}
  .more{
    max-height:0;overflow:hidden;transition:max-height .24s ease;
    padding:0 11px;
  }
  #card:not(.mini) .more{max-height:260px;padding-bottom:10px}
  .why{font-size:12.5px;line-height:1.5;color:var(--ink-soft);margin:0 0 8px}
  .fact{display:none}
  .cfoot{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .inner button.ghost{
    background:#fff;color:var(--ink-soft);border:1.5px solid var(--line);border-radius:99px;
    padding:4px 10px;font:600 11px ui-rounded,Avenir;cursor:pointer;
  }
  @keyframes drain{from{width:100%}to{width:0}}
  .timer{position:absolute;left:0;bottom:0;height:2px;background:var(--fam,var(--orange));
    opacity:.45;animation:drain 6s linear forwards}
  #card:not(.mini) .timer{display:none}
  .cardrow{display:flex;gap:8px;justify-content:center;align-items:center}

  #toast{
    position:fixed;left:50%;bottom:104px;transform:translateX(-50%);z-index:150;
    background:var(--ink);color:var(--cream);font:600 13px ui-rounded,Avenir;
    padding:9px 17px;border-radius:99px;opacity:0;transition:opacity .25s;pointer-events:none;
  }
  #toast.on{opacity:.95}
  .cardrow{display:flex;gap:8px;justify-content:center;align-items:center}
  .inner button.ghost{background:#fff;color:var(--ink-soft);border-color:var(--line);font-size:13px;padding:9px 15px}

  /* sheet: codex + provenance */
  #sheet{
    position:fixed;inset:0;display:none;z-index:180;background:rgba(43,33,24,.42);
    backdrop-filter:blur(3px);padding:22px;
  }
  #sheet.on{display:grid;place-items:center}
  .sheetbox{
    width:min(480px,100%);max-height:82vh;display:flex;flex-direction:column;
    background:var(--card);border:2.5px solid var(--ink);border-radius:20px;overflow:hidden;
    box-shadow:0 14px 0 rgba(43,33,24,.16);animation:pop .3s cubic-bezier(.3,1.5,.5,1);
  }
  .sheethead{
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none;
    padding:13px 15px;border-bottom:2px solid var(--line);background:rgba(246,237,221,.7);
  }
  .sheethead b{font:800 14px ui-rounded,Avenir}
  #sheetBody{overflow-y:auto;padding:12px 13px}
  #sheetBody h2{
    font:700 10.5px/1 ui-rounded,Avenir;letter-spacing:.9px;text-transform:uppercase;
    color:var(--ink-soft);margin:14px 2px 8px;
  }
  .search{
    width:100%;font:600 14px ui-rounded,Avenir;color:var(--ink);
    padding:10px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;
  }
  .search:focus{outline:2px solid var(--orange);outline-offset:-1px}
  .none{color:var(--ink-soft);font-size:13px;text-align:center;padding:18px}
  .phead{
    display:flex;align-items:center;gap:10px;text-align:left;flex-wrap:wrap;
    padding:0 0 9px;border-bottom:1px solid var(--line);margin-bottom:9px;
  }
  .phead .big{font-size:26px;line-height:1;flex:none}
  .phead h3{font:800 16px ui-rounded,Avenir;margin:0;flex:1;min-width:0}
  .pnums{font-size:11.5px;color:var(--ink-soft);width:100%}
  .pnums b{color:var(--brick);font-size:12.5px}
  .pfrom{font-size:11px;color:var(--ink-soft);width:100%;margin-top:2px;font-style:italic}
  /* provenance tree — real connectors, drawn with borders on the list */
  ul.tree,ul.tree ul{list-style:none;margin:0;padding:0;font-size:13px}
  ul.tree ul{margin-left:8px;padding-left:10px;position:relative}
  ul.tree ul::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--line);
  }
  ul.tree li{position:relative}
  ul.tree ul > li::before{
    content:'';position:absolute;left:-10px;top:11px;width:8px;height:1.5px;background:var(--line);
  }
  /* mask the trunk below the final child so the elbow ends cleanly */
  ul.tree ul > li:last-child::after{
    content:'';position:absolute;left:-11px;top:12px;bottom:0;width:2.5px;background:var(--card);
  }
  .prow{
    display:flex;align-items:center;gap:5px;padding:2px 6px;margin:0;
    border-radius:6px;background:none;font-size:12.5px;
  }
  .prow:hover{background:rgba(255,255,255,.6)}
  .prow.root{background:#FFF0E6;font-weight:800;box-shadow:inset 0 0 0 2px var(--orange)}
  .prow.has{cursor:pointer}
  .prow.has:hover{background:#fff}
  .prow .tw{
    font-size:9px;color:var(--ink-soft);width:11px;flex:none;text-align:center;line-height:1;
  }
  .prow .tw.dot{color:#C9B99C}
  .prow .more{
    font:800 9.5px ui-rounded,Avenir;color:#fff;background:#C0A98A;
    border-radius:99px;padding:2px 7px;flex:none;
  }
  ul.tree ul.fold{display:none}
  .prow .pe{font-size:13px}
  .prow .pn{flex:1;min-width:0}
  .prow .pv{
    font-size:10px;font-weight:700;color:var(--teal);background:#E8F4F3;
    padding:2px 7px;border-radius:99px;flex:none;
  }

  /* ---- matter taxonomy ----------------------------------------------
     Shape carries meaning, so the three kinds of thing are never confusable:
       pill     = a thing in the world   (game element)
       hexagon  = a molecule             (compound)
       tile     = an atom                (periodic-table cell)
       halo     = energy, not matter     (particle)
     Colour then carries the sub-category within each kind. ------------- */
  :root{
    --alkali:#E2703A; --alkaline:#E0A526; --transition:#A63D2F; --post:#8A7B6B;
    --metalloid:#6B8E4E; --nonmetal:#3E7C7B; --halogen:#5B7FA6; --noble:#8C6BA6;
    --lanthanide:#B5657F; --actinide:#7A5C8E;
    --fam-earth:#8A7B6B; --fam-water:#4E8CB8; --fam-fire:#E2703A; --fam-plant:#6B8E4E;
    --fam-animal:#A6603D; --fam-microbe:#8C6BA6; --fam-food:#E0A526; --fam-myth:#7C5CA6;
  }
  .atom{
    display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
    width:26px;height:26px;border-radius:6px;color:#fff;flex:none;
    box-shadow:inset 0 -2px 0 rgba(0,0,0,.16);
  }
  .atom .sym{font:800 10px/1 ui-rounded,Avenir;letter-spacing:-.2px}
  .atom .z{font:700 6px/1 ui-rounded,Avenir;opacity:.75;margin-top:1px}
  .atom.alkali{background:var(--alkali)} .atom.alkaline{background:var(--alkaline)}
  .atom.transition{background:var(--transition)} .atom.post{background:var(--post)}
  .atom.metalloid{background:var(--metalloid)} .atom.nonmetal{background:var(--nonmetal)}
  .atom.halogen{background:var(--halogen)} .atom.noble{background:var(--noble)}
  .atom.lanthanide{background:var(--lanthanide)} .atom.actinide{background:var(--actinide)}

  .hex{
    display:inline-flex;align-items:center;justify-content:center;flex:none;
    min-width:74px;padding:9px 13px;background:#EFE6F5;color:#5B3E7A;
    font:700 11.5px ui-rounded,Avenir;text-align:center;line-height:1.15;
    clip-path:polygon(14% 0,86% 0,100% 50%,86% 100%,14% 100%,0 50%);
  }
  .particle{
    display:inline-flex;align-items:center;gap:5px;flex:none;padding:6px 14px;
    border-radius:99px;font:700 11.5px ui-rounded,Avenir;color:#8A6A12;
    background:radial-gradient(circle,#FFF0C4 0%,#FDE39B 70%,rgba(253,227,155,0) 100%);
  }

  /* game-element chips tinted by family */
  .chip[data-fam]{border-color:color-mix(in srgb,var(--fam) 46%,var(--line))}
  .chip[data-fam] .e{filter:saturate(1.05)}
  .chip.board[data-fam]{
    border-color:var(--fam);
    box-shadow:0 3px 0 color-mix(in srgb,var(--fam) 26%,rgba(43,33,24,.1));
  }
  .fam-earth{--fam:var(--fam-earth)}   .fam-water{--fam:var(--fam-water)}
  .fam-fire{--fam:var(--fam-fire)}     .fam-plant{--fam:var(--fam-plant)}
  .fam-animal{--fam:var(--fam-animal)} .fam-microbe{--fam:var(--fam-microbe)}
  .fam-food{--fam:var(--fam-food)}     .fam-myth{--fam:var(--fam-myth)}

  /* guess before the reveal */
  .guess{text-align:center;padding:14px 6px 8px}
  .guess .big{font-size:44px;line-height:1;margin-bottom:8px}
  .guess h3{font:800 18px ui-rounded,Avenir;margin:0 0 8px}
  .guess p{font-size:13.5px;color:var(--ink-soft);margin:0 auto 16px;max-width:34ch;line-height:1.5}
  .opts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
  .opts button{
    font:800 17px ui-rounded,Avenir;min-width:66px;padding:11px 16px;border-radius:13px;
    background:#fff;border:2px solid var(--line);cursor:pointer;
  }
  .opts button:hover{border-color:var(--orange);background:#FFF4EC}
  .guess .skip{
    background:none;border:none;color:var(--ink-soft);font:600 12px ui-rounded,Avenir;
    text-decoration:underline;cursor:pointer;padding:4px;
  }
  .verdict{
    width:100%;margin-top:6px;font:700 12px ui-rounded,Avenir;padding:5px 9px;border-radius:8px;
  }
  .verdict.hit{color:#41652A;background:#E6F0DC}
  .verdict.miss{color:#8A6A12;background:#FDF0CE}
  /* index entry */
  .ent{
    display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:6px 8px;margin-bottom:4px;
    background:#fff;border:1.5px solid var(--line);border-radius:10px;font-size:12.5px;
  }
  .ent .g{
    display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:99px;
    background:var(--card);border:1px solid var(--line);cursor:pointer;font-weight:600;
  }
  .ent .g:hover{border-color:var(--orange)}
  .ent em{font-style:normal;color:var(--ink-soft);font-size:11px;font-weight:700}
  .ent .arw{color:#C6B69C;margin:0 1px}
  .ent .out{background:#FFF3E9;border-color:#F0D6C0}
  .hint2{font-size:11.5px;color:var(--ink-soft);font-style:italic;margin:4px 2px 0}
  /* molecules */
  .molbox{display:flex;justify-content:center;padding:6px 0 10px}
  svg.mol .bond{stroke:#5A4A38;stroke-width:3.4;stroke-linecap:round}
  svg.mol .ball{stroke:#3B2E20;stroke-width:1.6}
  svg.mol .lbl{text-anchor:middle;dominant-baseline:central;font-weight:800;
    font-family:ui-rounded,Avenir,system-ui;pointer-events:none}
  .formula{
    text-align:center;font:800 17px ui-rounded,Avenir;color:var(--ink);margin-bottom:10px;
  }
  .formula sub{font-size:.66em;vertical-align:-.25em}
  .aagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:6px}
  .aa{
    display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;min-width:0;
    background:#fff;border:1.5px solid var(--line);border-radius:11px;overflow:hidden;
  }
  .aa:hover{border-color:var(--metalloid)}
  .aa b{
    font:800 10px ui-rounded,Avenir;color:#fff;background:var(--nonmetal);
    border-radius:5px;min-width:18px;height:18px;line-height:18px;text-align:center;flex:none;
  }
  .aatx{display:flex;flex-direction:column;min-width:0;line-height:1.25}
  .aatx em{
    font:600 11.5px ui-rounded,Avenir;font-style:normal;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .aatx i{
    font-style:normal;font:600 9.5px ui-rounded,Avenir;color:var(--ink-soft);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;

  /* periodic table */
  .ptab{display:grid;grid-template-columns:repeat(18,1fr);gap:2px;margin:8px 0}

  .ptab .atom .sym{font-size:9px}

  .ptab .atom.off{opacity:.24}
  .ptab .gap{grid-column:span var(--n)}
  .legend{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 4px}
  .legend span{
    font:700 9.5px ui-rounded,Avenir;color:#fff;padding:3px 8px;border-radius:99px;
  }

  /* bedrock: the substrate, deliberately quieter than the game above it */
  .bedhead{
    text-align:center;font:700 9px ui-rounded,Avenir;letter-spacing:1.2px;text-transform:uppercase;
    color:#A8977E;margin:14px 0 8px;position:relative;
  }
  .bedhead::before,.bedhead::after{
    content:'';position:absolute;top:50%;width:26%;height:2px;background:var(--line);
  }
  .bedhead::before{left:2%} .bedhead::after{right:2%}
  .bedgroup{margin-bottom:8px;opacity:.72}
  .bedof{font:700 12px ui-rounded,Avenir;color:var(--ink-soft);margin-bottom:4px}
  ul.tree.bed .brow{
    display:flex;align-items:center;gap:5px;padding:1px 5px;margin:0;
    font-size:11.5px;color:var(--ink-soft);background:none;
  }
  .shelfbar{display:flex;gap:5px;align-items:center;margin:0 2px 8px}
  .search.sm{padding:7px 10px;font-size:12.5px;border-radius:9px}
  .shelfbar button{
    width:26px;height:26px;padding:0;border-radius:8px;font-size:14px;line-height:1;flex:none;
  }
  aside h2{
    display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none;
    padding:3px 4px;border-radius:7px;white-space:nowrap;overflow:hidden;
  }
  aside h2.ready{
    color:var(--avocado);cursor:default;letter-spacing:1px;
    border-bottom:1.5px solid color-mix(in srgb,var(--avocado) 35%,transparent);
    padding-bottom:5px;margin-bottom:8px;
  }
  aside h2.ready i{background:var(--avocado)}
  aside h2.ready em{color:var(--avocado)}
  aside h2:hover{background:rgba(255,255,255,.55)}
  aside h2 em{font-style:normal;color:#BCAC93;font-weight:700}
  aside h2 .lv{
    font:800 9px ui-rounded,Avenir;color:#fff;background:var(--avocado);
    border-radius:99px;padding:2px 6px;margin-left:auto;
  }
  aside h2 .cv{font-size:8px;color:#BCAC93;margin-left:auto}
  aside h2 .lv + .cv{margin-left:4px}
  aside h2 i{
    display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:6px;
    background:var(--fam,var(--line));vertical-align:middle;
  }
  ul.tree.bed .brow{gap:8px}
  ul.tree.bed .brow .cat{
    font-style:normal;font:700 8.5px ui-rounded,Avenir;text-transform:uppercase;
    letter-spacing:.6px;color:#B0A08A;margin-left:auto;
  }
  ul.tree.bed .brow b{
    font-size:9.5px;font-weight:800;color:#fff;background:#A8977E;border-radius:5px;
    min-width:19px;height:15px;line-height:15px;text-align:center;
  }
  .bedsum{
    text-align:center;font:800 12.5px ui-rounded,Avenir;color:var(--brick);
    padding:9px;border:1.5px dashed var(--line);border-radius:11px;margin-top:5px;
  }
  .bedsum .syms{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:9px}
  .bedsum .syms i{
    font-style:normal;font:800 11px ui-rounded,Avenir;color:var(--ink);
    background:#fff;border:1.5px solid var(--line);border-radius:6px;padding:3px 7px;
  }

  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
  @media(max-width:720px){
    header{gap:7px;padding:9px 10px;flex-wrap:nowrap;overflow:hidden}
    h1{font-size:15px;flex:none;white-space:nowrap}
    .goal{display:none}
    #live{display:none}
    header button,.count{padding:6px 10px;font-size:12px;white-space:nowrap;flex:none}
    aside{
      position:fixed;top:50px;bottom:62px;right:0;width:min(250px,78vw);z-index:120;
      transform:translateX(100%);transition:transform .22s;background:var(--card);
      border-left:2px solid var(--ink);box-shadow:-8px 0 24px rgba(43,33,24,.14);
    }
    aside.open{transform:none}
    #tray{gap:5px;padding:8px 5px}
    .verb{width:calc((100vw - 46px)/6);min-width:0;font-size:9.5px;padding:6px 2px}
    .verb .e{font-size:18px}
    #card{left:8px;right:8px;bottom:74px;width:auto}
    #sheet{padding:10px}
    .sheetbox{max-height:92vh}
  }
  @media(min-width:721px){ #shelfToggle{display:none} }
</style>

<script>
const DATA = {"elements":[{"id":"stone","name":"Stone","emoji":"🪨","shelf":"workshop","starter":true,"tags":["earth"],"fact":"Rock, unweathered. Everything solid you will build starts here."},{"id":"water","name":"Water","emoji":"💧","shelf":"workshop","starter":true,"tags":["water"],"fact":"The only common substance found on Earth as solid, liquid and gas."},{"id":"sun","name":"Sun","emoji":"☀️","shelf":"workshop","starter":true,"tags":["fire"],"fact":"Every calorie in this game traces back to eight minutes of sunlight."},{"id":"seed","name":"Seed","emoji":"🌰","shelf":"workshop","starter":true,"tags":["plant"],"fact":"A plant embryo with a packed lunch, waiting for water."},{"id":"soil","name":"Soil","emoji":"🟫","shelf":"workshop","tags":["earth"],"fact":"Broken rock plus dead life. It takes a century to build a centimetre."},{"id":"sand","name":"Sand","emoji":"🏜️","shelf":"workshop","tags":["earth"],"fact":"Rock ground to between 0.06 and 2 mm, mostly stubborn quartz."},{"id":"mud","name":"Mud","emoji":"🟤","shelf":"workshop","tags":["earth"],"fact":"Soil with enough water to lose its grip on itself."},{"id":"clay","name":"Clay","emoji":"🟠","shelf":"workshop","tags":["earth"],"fact":"Mineral sheets so fine they slide — the reason clay can be shaped."},{"id":"adobe","name":"Adobe","emoji":"🟧","shelf":"workshop","tags":["earth","build"],"fact":"Mud and straw. Half the world's oldest surviving buildings."},{"id":"brick","name":"Brick","emoji":"🧱","shelf":"workshop","tags":["earth","build"],"fact":"Sun-dried mud, standardised. The first mass-produced object."},{"id":"pot","name":"Pot","emoji":"🏺","shelf":"workshop","tags":["tool"],"fact":"Fired clay. Once you can boil things, your diet changes forever."},{"id":"glass","name":"Glass","emoji":"🔷","shelf":"workshop","tags":["tool"],"fact":"An amorphous solid — no crystal structure. It does not flow, whatever you have heard."},{"id":"sea","name":"Sea","emoji":"🌊","shelf":"workshop","tags":["water"],"fact":"3.5% salt, and the destination of every mineral rivers carry."},{"id":"salt","name":"Salt","emoji":"🧂","shelf":"workshop","tags":["preserve"],"fact":"The only rock humans eat. Wars have been fought over it."},{"id":"brine","name":"Brine","emoji":"🫙","shelf":"workshop","tags":["preserve"],"fact":"Salt water strong enough to dehydrate any microbe that enters it."},{"id":"ice","name":"Ice","emoji":"🧊","shelf":"workshop","tags":["water"],"fact":"Less dense than the water it came from, which is why lakes have fish."},{"id":"steam","name":"Steam","emoji":"♨️","shelf":"workshop","tags":["water","fire"],"fact":"Water carrying five times the energy it needed just to reach boiling."},{"id":"spark","name":"Spark","emoji":"✨","shelf":"workshop","tags":["fire"],"fact":"A fragment of stone, briefly glowing. The start of everything."},{"id":"flint","name":"Flint","emoji":"🗡️","shelf":"workshop","tags":["tool"],"fact":"Breaks in conchoidal curves, so every fracture leaves an edge. Unlocks Cut."},{"id":"fire","name":"Fire","emoji":"🔥","shelf":"workshop","tags":["fire"],"fact":"Carbon meeting oxygen fast enough to glow. Unlocks Heat."},{"id":"wood","name":"Wood","emoji":"🪵","shelf":"workshop","tags":["plant","build"],"fact":"Cellulose in lignin — a natural fibreglass, and a fuel."},{"id":"charcoal","name":"Charcoal","emoji":"⬛","shelf":"workshop","tags":["fire"],"fact":"Wood with everything but the carbon baked out. Burns far hotter."},{"id":"ash","name":"Ash","emoji":"🌫️","shelf":"workshop","tags":["fire","earth"],"fact":"The minerals a tree pulled from the soil, handed back."},{"id":"lye","name":"Lye","emoji":"🧪","shelf":"workshop","tags":["tool"],"fact":"Ash water. Caustic enough to dissolve fat, hair and skin."},{"id":"soap","name":"Soap","emoji":"🧼","shelf":"workshop","tags":["tool"],"fact":"One end of the molecule grips grease, the other grips water."},{"id":"tree","name":"Tree","emoji":"🌳","shelf":"workshop","tags":["plant"],"fact":"A plant that spends a fortune on a trunk to outgrow its neighbours."},{"id":"straw","name":"Straw","emoji":"🎋","shelf":"workshop","tags":["plant"],"fact":"The stalk left after the grain is taken. Tinder, thatch and bedding."},{"id":"sprout","name":"Sprout","emoji":"🌱","shelf":"workshop","tags":["plant"],"fact":"A seed that has committed. There is no going back into the shell."},{"id":"seedling","name":"Seedling","emoji":"🌿","shelf":"workshop","tags":["plant"],"fact":"Roots first, leaves second. Plumbing before solar panels."},{"id":"plant","name":"Plant","emoji":"🪴","shelf":"workshop","tags":["plant"],"fact":"A machine that turns light and air into sugar, and asks for nothing."},{"id":"grass","name":"Grass","emoji":"🍀","shelf":"workshop","tags":["plant"],"fact":"Grows from the base, so grazing cannot kill it. Covers around 40% of the land."},{"id":"flower","name":"Flower","emoji":"🌸","shelf":"workshop","tags":["plant"],"fact":"An advertisement paid for in sugar, aimed at insects."},{"id":"leaf","name":"Leaf","emoji":"🍃","shelf":"workshop","tags":["plant"],"fact":"A solar panel that must open its pores to breathe, and lose water doing it."},{"id":"root","name":"Root","emoji":"🥕","shelf":"workshop","tags":["plant"],"fact":"Trades sugar with underground fungi for minerals it cannot reach."},{"id":"bulb","name":"Bulb","emoji":"🧅","shelf":"workshop","tags":["plant"],"fact":"A whole next-season plant, packed in fat leaves, buried for safety."},{"id":"vine","name":"Vine","emoji":"🌿","shelf":"workshop","tags":["plant"],"fact":"Skips the cost of a trunk by climbing someone else's."},{"id":"herb","name":"Herb","emoji":"🌿","shelf":"workshop","tags":["plant","food"],"fact":"Leaves whose chemical defences we happen to find delicious."},{"id":"tea","name":"Tea","emoji":"🍵","shelf":"workshop","tags":["drink"],"fact":"Green, oolong and black are one plant. Only the oxidation differs."},{"id":"brewed_tea","name":"Brewed Tea","emoji":"🫖","shelf":"workshop","tags":["drink"],"fact":"Second most consumed drink on Earth, after water itself.","terminal":true},{"id":"meadow","name":"Meadow","emoji":"🌼","shelf":"workshop","tags":["plant"],"fact":"Not scenery — the density of bloom that makes a pollinator colony viable."},{"id":"nectar","name":"Nectar","emoji":"🍯","shelf":"workshop","tags":["plant"],"fact":"Roughly 25% sugar, made deliberately and given away on purpose."},{"id":"bee","name":"Bee","emoji":"🐝","shelf":"workshop","tags":["animal"],"fact":"Forages 5 km out and reports good ground back to the hive by dancing."},{"id":"honey","name":"Honey","emoji":"🍯","shelf":"workshop","tags":["sweet"],"fact":"Under 18% water. Nothing can grow in it, so it never spoils."},{"id":"beeswax","name":"Beeswax","emoji":"🕯️","shelf":"workshop","tags":["tool"],"fact":"Costs the hive 8 g of honey for every 1 g secreted."},{"id":"candle","name":"Candle","emoji":"🕯️","shelf":"workshop","tags":["tool"],"fact":"The wick does not burn. It pumps liquid wax up into the flame."},{"id":"fruit","name":"Fruit","emoji":"🍎","shelf":"workshop","tags":["crop"],"fact":"A bribe wrapped around a seed, aimed at anything that travels."},{"id":"yeast","name":"Yeast","emoji":"🫧","shelf":"workshop","tags":["microbe"],"fact":"A single-celled fungus living on fruit skins. Unlocks Ferment."},{"id":"chilli","name":"Chilli","emoji":"🌶️","shelf":"workshop","tags":["crop"],"fact":"Capsaicin repels mammals and does nothing at all to birds."},{"id":"grape","name":"Grape","emoji":"🍇","shelf":"workshop","tags":["crop"],"fact":"Picked near 24% sugar — exactly what yeast needs to reach 13% alcohol."},{"id":"cucumber","name":"Cucumber","emoji":"🥒","shelf":"workshop","tags":["crop"],"fact":"About 95% water, held up entirely by cell wall pressure."},{"id":"tomato","name":"Tomato","emoji":"🍅","shelf":"workshop","tags":["crop"],"fact":"A berry, and unusually full of glutamate — which is why it reads as savoury."},{"id":"apple","name":"Apple","emoji":"🍏","shelf":"workshop","tags":["crop"],"fact":"Seeds never breed true. Every named variety is a clone of one lucky tree."},{"id":"olive","name":"Olive","emoji":"🫒","shelf":"workshop","tags":["crop"],"fact":"Inedibly bitter raw. Every olive you have eaten was cured first."},{"id":"wheat","name":"Wheat","emoji":"🌾","shelf":"workshop","tags":["crop"],"fact":"Bred for 10,000 years above all to stop dropping its own seed."},{"id":"rice","name":"Rice","emoji":"🌾","shelf":"workshop","tags":["crop"],"fact":"Tolerates flooding, so the water itself does the weeding."},{"id":"sugarcane","name":"Sugarcane","emoji":"🎍","shelf":"workshop","tags":["crop"],"fact":"A giant grass that stores sugar in the stalk instead of the seed."},{"id":"potato","name":"Potato","emoji":"🥔","shelf":"workshop","tags":["crop"],"fact":"Not a root — a swollen underground stem. That is why it has eyes."},{"id":"onion","name":"Onion","emoji":"🧅","shelf":"workshop","tags":["crop"],"fact":"Cut it and two chemicals that were kept apart meet, and you cry."},{"id":"garlic","name":"Garlic","emoji":"🧄","shelf":"workshop","tags":["crop"],"fact":"Whole, it barely smells. The smell is a wound response."},{"id":"cabbage","name":"Cabbage","emoji":"🥬","shelf":"workshop","tags":["crop"],"fact":"Same species as kale, broccoli, sprouts and cauliflower. All of them."},{"id":"field","name":"Field","emoji":"🌾","shelf":"workshop","tags":["crop"],"fact":"One plant, no competitors — the most productive and most fragile system in farming."},{"id":"harvest","name":"Harvest","emoji":"🚜","shelf":"workshop","tags":["crop"],"fact":"The narrow window the entire calendar of settled life is built around."},{"id":"grain","name":"Grain","emoji":"🟨","shelf":"workshop","tags":["crop"],"fact":"A seed we eat before it ever gets to be a plant."},{"id":"flour","name":"Flour","emoji":"🥣","shelf":"workshop","tags":["food"],"fact":"Ground grain. Porridge came 30,000 years before anyone baked it."},{"id":"malt","name":"Malt","emoji":"🌾","shelf":"workshop","tags":["ferment"],"fact":"Barley sprouted then killed, its starch already turned to sugar."},{"id":"dough","name":"Dough","emoji":"🫓","shelf":"workshop","tags":["food"],"fact":"Wet, worked flour: an elastic protein net strong enough to hold gas."},{"id":"pasta_dough","name":"Pasta Dough","emoji":"🥟","shelf":"workshop","tags":["food"],"fact":"Egg instead of yeast. The protein sets the shape on cooking."},{"id":"pastry","name":"Pastry","emoji":"🥐","shelf":"workshop","tags":["food"],"fact":"Layers of flour separated by cold butter, waiting for steam."},{"id":"cake_batter","name":"Cake Batter","emoji":"🥣","shelf":"workshop","tags":["food"],"fact":"Sugar steals water from the flour, which is what keeps cake tender."},{"id":"risen_dough","name":"Risen Dough","emoji":"🎈","shelf":"workshop","tags":["ferment"],"fact":"Full of carbon dioxide the yeast exhaled and the gluten refused to let go."},{"id":"sourdough_starter","name":"Sourdough Starter","emoji":"🫙","shelf":"workshop","tags":["ferment"],"fact":"Wild yeast and lactobacilli, kept alive by daily feeding. Livestock, really."},{"id":"flatbread","name":"Flatbread","emoji":"🥙","shelf":"workshop","tags":["dish"],"fact":"The oldest bread. Steam alone puffs it, in under two minutes."},{"id":"bread","name":"Bread","emoji":"🍞","shelf":"workshop","tags":["dish"],"fact":"A foam of carbon dioxide, set solid by heat."},{"id":"sourdough","name":"Sourdough","emoji":"🥖","shelf":"workshop","tags":["dish","ferment"],"fact":"Slower, sourer, and it keeps for days because the acid holds mould off.","terminal":true},{"id":"noodle","name":"Noodle","emoji":"🍜","shelf":"workshop","tags":["food"],"fact":"The oldest found are 4,000-year-old millet noodles from Lajia, China."},{"id":"pasta","name":"Pasta","emoji":"🍝","shelf":"workshop","tags":["dish"],"fact":"Al dente is the few seconds between the starch swelling and the protein firming."},{"id":"cake","name":"Cake","emoji":"🍰","shelf":"workshop","tags":["dish","sweet"],"fact":"Set the scaffold before the air escapes, or it falls.","terminal":true},{"id":"wort","name":"Wort","emoji":"🍯","shelf":"worksh ":"polypeptide","name":"Polypeptide","emoji":"🧬","shelf":"workshop","tags":["microbe"],"fact":"A chain in a specific order, written in DNA and read by a ribosome."},{"id":"protein","name":"Protein","emoji":"🧫","shelf":"workshop","tags":["microbe"],"fact":"A chain folded into one shape. The shape is the function."},{"id":"disulfide","name":"Disulfide Bond","emoji":"⚡","shelf":"workshop","tags":["microbe"],"fact":"Two cysteines, cross-linked. What makes hair hair."},{"id":"keratin","name":"Keratin","emoji":"💅","shelf":"workshop","tags":["animal"],"fact":"Hair, nail, horn and hoof — all the same protein, differently packed."},{"id":"denatured_protein","name":"Denatured Protein","emoji":"🍳","shelf":"workshop","tags":["food"],"fact":"Unfolded, tangled, set. This is what cooking is.","terminal":true},{"id":"atp","name":"ATP","emoji":"🔋","shelf":"workshop","tags":["microbe"],"fact":"The cell spends its own body weight in this every day."},{"id":"nucleotide","name":"Nucleotide","emoji":"🧩","shelf":"workshop","tags":["microbe"],"fact":"Sugar, phosphate and a base. Four of them spell everything alive."},{"id":"dna","name":"DNA","emoji":"🧬","shelf":"workshop","tags":["microbe"],"fact":"The instructions, in four letters, for building the thing holding it."},{"id":"membrane","name":"Membrane","emoji":"🫧","shelf":"workshop","tags":["microbe"],"fact":"Two layers of fat, tails inward. Life needs an inside."},{"id":"cell","name":"Cell","emoji":"🦠","shelf":"workshop","tags":["microbe"],"fact":"The smallest thing that is unambiguously alive."},{"id":"tissue","name":"Tissue","emoji":"🩹","shelf":"workshop","tags":["animal"],"fact":"Cells of one kind, doing one job together."},{"id":"muscle","name":"Muscle","emoji":"💪","shelf":"workshop","tags":["animal"],"fact":"Protein filaments ratcheting past each other."},{"id":"collagen","name":"Collagen","emoji":"🩻","shelf":"workshop","tags":["animal"],"fact":"A third of all the protein in you, wound in triple helices."},{"id":"gelatin","name":"Gelatin","emoji":"🍮","shelf":"workshop","tags":["food"],"fact":"Collagen unwound by heat, and it sets as it cools."},{"id":"enzyme","name":"Enzyme","emoji":"⚗️","shelf":"workshop","tags":["microbe"],"fact":"A protein with a pocket shaped to hold one particular molecule."}],"recipes":[{"in":["stone"],"verb":"wait","out":"soil","why":"Rain, frost and lichen break stone into grains over centuries. Mix in dead plants and you have soil — roughly 45% mineral, 5% once-living.","src":"https://en.wikipedia.org/wiki/Soil_formation","verified":true},{"in":["stone"],"verb":"crush","out":"sand","why":"Sand is only rock ground small: grains between 0.06 and 2 mm. Most of it is quartz, because quartz outlasts everything else.","src":"https://en.wikipedia.org/wiki/Sand","verified":true},{"in":["stone","stone"],"out":"spark","why":"Strike two stones and you shear off fragments hot enough to glow. Cutting tools are far older, but this is how every fire began for a million years.","src":"https://en.wikipedia.org/wiki/Fire_making","verified":true},{"in":["stone","spark"],"out":"flint","why":"Flint breaks in smooth conchoidal curves, so almost every fracture leaves a working edge. Obsidian breaks the same way and finer still — fine enough that surgeons occasionally still use it.","src":"https://en.wikipedia.org/wiki/Flint","verified":true},{"in":["soil","water"],"out":"mud","why":"Water fills the gaps between soil grains and lets them slide. Mud is soil that has lost its grip.","src":"https://en.wikipedia.org/wiki/Mud"},{"in":["mud"],"verb":"wait","out":"clay","why":"The finest particles settle out last: clay, flat sheets of aluminium silicate under 0.002 mm across. Wet, the sheets slip over each other — that is why clay is plastic.","src":"https://en.wikipedia.org/wiki/Clay","verified":true},{"in":["mud","straw"],"out":"adobe","why":"Straw stops drying mud from cracking as it shrinks. The same trick holds plaster and cob walls together.","src":"https://en.wikipedia.org/wiki/Adobe"},{"in":["adobe","sun"],"out":"brick","why":"Sun-dried mud brick built Jericho, Babylon and much of the American Southwest. No fuel required — only weeks of dry weather.","src":"https://en.wikipedia.org/wiki/Mudbrick","verified":true},{"in":["clay"],"verb":"heat","out":"pot","why":"Around 600 °C the water chemically bound inside the clay is driven out, and higher still the particles fuse. Either way it is irreversible: a fired pot will never be mud again.","src":"https://en.wikipedia.org/wiki/Pottery","verified":true},{"in":["sand","ash"],"out":"glass","why":"Silica melts at about 1700 °C, which no early furnace could reach. Wood-ash potash drops that to roughly 1000 °C, and glass becomes possible.","src":"https://en.wikipedia.org/wiki/Forest_glass","verified":true},{"in":["sea","sun"],"out":"salt","why":"Flood a shallow pan, let the sun take the water, sweep up what stays. Seawater is 3.5% salt by weight.","src":"https://en.wikipedia.org/wiki/Salt_evaporation_pond","verified":true},{"in":["water","salt"],"out":"brine","why":"Salt water pulls water out of any cell it touches. That is the whole principle of preserving in brine — the microbes dry out before the food does.","src":"https://en.wikipedia.org/wiki/Brining"},{"in":["water"],"verb":"chill","out":"ice","why":"Water is one of very few substances that expands as it freezes. Ice floats, so lakes freeze from the top and life survives underneath.","src":"https://en.wikipedia.org/wiki/Properties_of_water"},{"in":["water"],"verb":"heat","out":"steam","why":"Turning 1 litre of water to steam takes five times more energy than heating it from freezing to boiling. That hidden energy is why steam scalds.","src":"https://en.wikipedia.org/wiki/Enthalpy_of_vaporization","verified":true},{"in":["spark","straw"],"out":"fire","why":"A spark only needs something dry and thin enough to catch. Control of fire predates our own species — Homo erectus was carrying it into caves well over a million years ago.","src":"https://en.wikipedia.org/wiki/Control_of_fire_by_early_humans","verified":true},{"in":["wood"],"verb":"heat","out":"charcoal","why":"Heat wood without air and the water and tar bake off, leaving almost pure carbon. Charcoal burns far hotter than the wood it came from.","src":"https://en.wikipedia.org/wiki/Charcoal"},{"in":["wood","fire"],"out":"ash","why":"Ash is what will not burn: the minerals the tree drew out of the soil, mostly potassium and calcium salts.","src":"https://en.wikipedia.org/wiki/Wood_ash"},{"in":["ash","water"],"out":"lye","why":"Water leached through wood ash dissolves potassium carbonate. The solution is caustic enough to dissolve fat — and skin.","src":"https://en.wikipedia.org/wiki/Lye"},{"in":["lye","olive_oil"],"out":"soap","why":"Castile soap is olive oil and lye, nothing else. The lye splits the fat into glycerol and soap, and is entirely used up doing it.","src":"https://en.wikipedia.org/wiki/Castile_soap"},{"in":["seedling"],"verb":"wait","out":"tree","why":"A tree is a plant that solved a problem: build a trunk of dead wood and you can hold your leaves above everyone else's.","src":"https://en.wikipedia.org/wiki/Tree"},{"in":["tree"],"verb":"cut","out":"wood","why":"Wood is cellulose fibres set in lignin — nature's fibreglass. Along the grain it rivals steel for strength per kilogram.","src":"https://en.wikipedia.org/wiki/Wood"},{"in":["plant","sun"],"out":"straw","why":"Dried stalks: the part of a crop with no food value left, and the best tinder, thatch and bedding humans ever had for free.","src":"https://en.wikipedia.org/wiki/Straw"},{"in":["seed","water"],"out":"sprout","why":"Water swells the seed until its coat splits. The embryo lives on stored starch until its first leaf reaches light.","src":"https://en.wikipedia.org/wiki/Germination","supported":true},{"in":["sprout","soil"],"out":"seedling","why":"Roots go down before leaves go up. A seedling spends its first days building the plumbing.","src":"https://en.wikipedia.org/wiki/Seedling","supported":true},{"in":["seedling","sun"],"out":"plant","why":"Photosynthesis: light, water and carbon dioxide become sugar. Nearly every calorie you will ever eat was assembled by this reaction.","src":"https://en.wikipedia.org/wiki/Photosynthesis","supported":true},{"in":["plant"],"verb":"wait","out":"flower","why":"A flower is an advertisement. Colour, scent and sugar are all payment offered to an animal for carrying pollen.","src":"https://en.wikipedia.org/wiki/Flower"},{"in":["seed","soil"],"out":"grass","why":"Grasses grow from the base, not the tip. That is why grazing and mowing do not kill them — and why grassland covers something like 40% of the land on Earth.","src":"https://en.wikipedia.org/wiki/Grassland","verified":true},{"in":["plant","soil"],"out":"root","why":"Roots do not simply drink. Most trade sugar with fungi underground for phosphorus they could never reach alone.","src":"https://en.wikipedia.org/wiki/Mycorrhiza","supported":true},{"in":["plant","water"],"out":"leaf","why":"A leaf is a solar panel that must breathe without drying out. Its pores open for carbon dioxide and lose water every time they do.","src":"https://en.wikipedia.org/wiki/Stoma","supported":true},{"in":["plant","tree"],"out":"vine","why":"A vine skips the expense of a trunk by climbing someone else's. Cheap engineering, borrowed height.","src":"https://en.wikipedia.org/wiki/Vine"},{"in":["leaf","leaf"],"out":"cabbage","why":"Cabbage, kale, broccoli, sprouts, kohlrabi and cauliflower are all one species — Brassica oleracea — bred in six different directions.","src":"https://en.wikipedia.org/wiki/Brassica_oleracea"},{"in":["leaf","sun"],"out":"herb","why":"Aromatic oils are a plant's chemical defence, and strong sun makes it build more. That is why Mediterranean herbs taste louder than shade-grown ones.","src":"https://en.wikipedia.org/wiki/Essential_oil"},{"in":["leaf"],"verb":"heat","out":"tea","why":"Green, oolong and black tea are the same leaf from the same plant. The only difference is how long it is allowed to oxidise before heat stops it.","src":"https://en.wikipedia.org/wiki/Tea_processing","verified":true},{"in":["root"],"verb":"wait","out":"bulb","why":"A bulb is a bud wrapped in fat leaf bases — a whole plant packed with next season's food, sitting underground.","src":"https://en.wikipedia.org/wiki/Bulb"},{"in":["root","soil"],"out":"potato","why":"A potato is not a root. It is a swollen underground stem, storing starch for next year's shoots — which is why it has eyes.","src":"https://en.wikipedia.org/wiki/Tuber"},{"in":["bulb","soil"],"out":"onion","why":"Cutting an onion ruptures cells that keep an enzyme and a sulphur compound apart. They meet, react, and drift up as the gas that stings your eyes.","src":"https://en.wikipedia.org/wiki/Onion"},{"in":["bulb","sun"],"out":"garlic","why":"Whole garlic barely smells. Crushing it mixes alliin with an enzyme to make allicin — a defence the plant only builds once it has been damaged.","src":"https://en.wikipedia.org/wiki/Allicin","supported":true},{"in":["flower","flower"],"out":"meadow","why":"A flowering meadow is not scenery, it is infrastructure. Its density of blooms is what makes a pollinator colony viable.","src":"https://en.wikipedia.org/wiki/Meadow"},{"in":["meadow"],"verb":"wait","out":"bee","why":"Bees find meadows on their own. A honeybee colony forages up to 5 km out and reports good ground to the hive by dancing.","src":"https://en.wikipedia.org/wiki/Western_honey_bee","verified":true},{"in":["flower"],"verb":"wait","out":"nectar","why":"Nectar is roughly 25% sugar in water — deliberately made, deliberately given away, and never free.","src":"https://en.wikipedia.org/wiki/Nectar","verified":true},{"in":["flower","bee"],"out":"fruit","why":"The bee moves pollen between flowers; the fertilised ovary swells into fruit. Around a third of everything humans eat depends on this transaction.","src":"https://en.wikipedia.org/wiki/Pollination"},{"in":["nectar","bee"],"out":"honey","why":"A bee reduces nectar from 70% water to under 18% and adds enzymes that split sucrose. At that concentration nothing can grow in it, so honey never spoils.","src":"https://en.wikipedia.org/wiki/Honey","verified":true},{"in":["bee","honey"],"out":"beeswax","why":"A bee eats about 8 g of honey to secrete 1 g of wax from glands on its abdomen. The comb is expensive.","src":"https://en.wikipedia.org/wiki/Beeswax","verified":true},{"in":["beeswax","straw"],"out":"candle","why":"The wick does not burn — it draws liquid wax up by capillary action into the flame, where the wax is the actual fuel.","src":"https://en.wikipedia.org/wiki/Candle_wick"},{"in":["fruit"],"verb":"wait","out":"yeast","why":"Wild yeast lives on fruit skins. That dusty white bloom on a grape is a colony sitting on the sugar, waiting for the skin to split.","src":"https://en.wikipedia.org/wiki/Saccharomyces_cerevisiae"},{"in":["fruit","sun"],"out":"chilli","why":"Capsaicin binds the receptor that detects heat. Birds lack that receptor entirely, so they spread the seeds and mammals learn to stay away.","src":"https://en.wikipedia.org/wiki/Capsaicin"},{"in":["vine","fruit"],"out":"grape","why":"Wine grapes are picked at around 24% sugar — high enough that yeast can drive the alcohol to 13% before it poisons itself.","src":"https://en.wikipedia.org/wiki/Brix","verified":true},{"in":["vine","water"],"out":"cucumber","why":"A cucumber is about 95% water. Almost everything it does is hold that water inside a crisp cell wall.","src":"https://en.wikipedia.org/wiki/Cucumber","verified":true},{"in":["vine","flower"],"out":"tomato","why":"Botanically a berry. It is unusually rich in glutamate, which is why a tomato reads as savoury rather than merely sweet or sour.","src":"https://en.wikipedia.org/wiki/Tomato"},{"in":["tree","fruit"],"out":"apple","why":"Apple seeds do not breed true — plant a pip from a good apple and you get a bad one. Every named variety is a cutting grafted on, a clone of one lucky tree.","src":"https://en.wikipedia.org/wiki/Apple"},{"in":["tree","sun"],"out":"olive","why":"Olive trees fruit on poor, dry, stony ground where little else will. A raw olive is inedibly bitter until cured in brine or lye.","src":"https://en.wikipedia.org/wiki/Olive"},{"in":["grass","seed"],"out":"wheat","why":"Wheat is a grass humans selected for 10,000 years — above all for seed heads that do not shatter, so the grain waits on the stalk to be taken.","src":"https://en.wikipedia.org/wiki/Wheat","verified":true},{"in":["grass","water"],"out":"rice","why":"Rice tolerates standing water. Flooding a paddy drowns the weeds and not the crop — a herbicide made of water.","src":"https://en.wikipedia.org/wiki/Paddy_field"},{"in":["grass","sun"],"out":"sugarcane","why":"Sugarcane is a giant grass that stores its sugar in the stalk instead of the seed, which is why you can taste it by chewing.","src":"https://en.wikipedia.org/wiki/Sugarcane"},{"in":["wheat"],"verb":"cut","out":"grain","why":"Threshing separates the grain from the chaff. For most of history this was the single largest job of the human year.","src":"https://en.wikipedia.org/wiki/Threshing","supported":true},{"in":["wheat","wheat"],"out":"field","why":"A field is a monoculture — one plant, no competitors. It is the most productive and most fragile arrangement in agriculture.","src":"https://en.wikipedia.org/wiki/Monoculture","supported":true},{"in":["field","sickle"],"out":"harvest","why":"Cut too early and the grain is soft; too late and it falls off the stalk. A curved blade is what let one person clear a field inside that window.","src":"https://en.wikipedia.org/wiki/Sickle"},{"in":["grain"],"verb":"crush","out":"flour","why":"Stone querns ground grain into flour for 30,000 years before anyone thought to bake it. Porridge came long before bread.","src":"https://www.smithsonianmag.com/smart-news/flour-was-part-human-diet-32000-years-ago-180956675/","verified":true},{"in":["grain","sprout"],"out":"malt","why":"Let barley germinate, then kill it with heat. Sprouting turns stored starch into sugar the seedling wanted — and the brewer takes instead.","src":"https://en.wikipedia.org/wiki/Malting"},{"in":["flour","water"],"out":"dough","why":"Two wheat proteins, glutenin and gliadin, link into gluten the moment they are wet and worked: an elastic net strong enough to trap gas.","src":"https://en.wikipedia.org/wiki/Gluten"},{"in":["flour","egg"],"out":"pasta_dough","why":"Egg pasta needs no leavening. Egg protein sets the shape on cooking, so the dough can be rolled paper-thin and hold.","src":"https://en.wikipedia.org/wiki/Pasta"},{"in":["dough"],"verb":"heat","out":"flatbread","why":"The oldest bread we have found is a flatbread from Shubayqa in Jordan, charred 14,400 years ago — four thousand years before anyone farmed grain.","src":"https://en.wikipedia.org/wiki/History_of_bread","verified":true},{"in":["risen_dough"],"verb":"heat","out":"bread","why":"The oven kills the yeast, sets the gluten and locks the bubbles in place. Bread is a foam that has been turned to stone.","src":"https://en.wikipedia.org/wiki/Bread"},{"in":["dough"],"verb":"wait","out":"sourdough_starter","why":"Leave flour and water on the counter and wild yeast and lactobacilli move in from the air and the grain. A starter is livestock you feed daily.","src":"https://en.wikipedia.org/wiki/Sourdough"},{"in":["sourdough_starter","dough"],"out":"sourdough","why":"Slower than baker's yeast, and the bacteria alongside it make lactic and acetic acid. That acid is the flavour, and it keeps mould away for days.","src":"https://en.wikipedia.org/wiki/Sourdough"},{"in":["pasta_dough"],"verb":"cut","out":"noodle","why":"The oldest noodles found are 4,000-year-old millet noodles from Lajia in China. Any stiff dough plus an edge reaches the same answer, which is why so many cuisines did.","src":"https://en.wikipedia.org/wiki/Lajia","verified":true},{"in":["noodle"],"verb":"heat","out":"pasta","why":"Boiling gelatinises the starch and firms the egg protein at almost the same moment. Al dente is the few seconds between them.","src":"https://en.wikipedia.org/wiki/Starch_gelatinization"},{"in":["cake_batter"],"verb":"heat","out":"cake","why":"Heat sets the egg and starch into a scaffold before the trapped air can escape. Open the oven early and it collapses.","src":"https://en.wikipedia.org/wiki/Cake"},{"in":["malt","water"],"out":"wort","why":"Hot water wakes the malt's own enzymes, which chop starch into fermentable sugar. The brewer is renting the barley's machinery.","src":"https://en.wikipedia.org/wiki/Mashing"},{"in":["wort","yeast"],"out":"beer","why":"Boiling the wort sterilised it centuries before anyone knew why that mattered. Whether beer or bread came first is still argued — both predate farming.","src":"https://en.wikipedia.org/wiki/History_of_beer","verified":true},{"in":["grape"],"verb":"crush","out":"grape_juice","why":"Crushing does not only free the juice — it brings the wild yeast on the skins into contact with the sugar inside.","src":"https://en.wikipedia.org/wiki/Winemaking","supported":true},{"in":["grape_juice","yeast"],"out":"wine","why":"Yeast eats sugar and excretes alcohol and carbon dioxide. It stops near 15%, the point where the alcohol kills the organism that made it.","src":"https://en.wikipedia.org/wiki/Fermentation_in_winemaking","verified":true},{"in":["wine"],"verb":"ferment","out":"vinegar","why":"A second fermentation, this time by Acetobacter, which oxidises alcohol into acetic acid. Vinegar is French for 'sour wine'.","src":"https://en.wikipedia.org/wiki/Acetic_acid_bacteria"},{"in":["apple"],"verb":"crush","out":"apple_juice","why":"Pressed apple juice browns within minutes: an enzyme meets oxygen at the cut surface, exactly as it does in a bruise.","src":"https://en.wikipedia.org/wiki/Food_browning"},{"in":["apple_juice"],"verb":"ferment","out":"cider","why":"Apples carry enough wild yeast and enough sugar to ferment with nothing added. Left alone in a barrel, juice becomes cider by default.","src":"https://en.wikipedia.org/wiki/Cider"},{"in":["olive"],"verb":"crush","out":"olive_oil","why":"Olive oil is squeezed from fruit flesh, not rendered or extracted. First cold press means exactly that: pressure, no heat, nothing added.","src":"https://en.wikipedia.org/wiki/Olive_oil_extraction"},{"in":["sugarcane"],"verb":"crush","out":"cane_juice","why":"Cane must be crushed within a day of cutting. After that its own enzymes start eating the sugar.","src":"https://en.wikipedia.org/wiki/Sugarcane"},{"in":["cane_juice"],"verb":"heat","out":"sugar","why":"Boil the water off and sucrose crystallises out, leaving the dark syrup behind as molasses. Sugar is one of the purest substances in any kitchen.","src":"https://en.wikipedia.org/wiki/Molasses"},{"in":["sugar"],"verb":"heat","out":"caramel","why":"At 170 °C sucrose breaks apart and reassembles into hundreds of new compounds — nutty, bitter, fruity. Not one of them was in the sugar.","src":"https://en.wikipedia.org/wiki/Caramelization","verified":true},{"in":["honey","water"],"out":"mead_must","why":"Honey is too concentrated to ferment as it is: nothing can live in it. Dilute it and the same sugar becomes food again.","src":"https://en.wikipedia.org/wiki/Water_activity"},{"in":["mead_must","yeast"],"out":"mead","why":"The oldest alcoholic drink ever chemically identified — Jiahu in China, around 7000 BC — was part honey mead, part rice beer, part fruit wine. Honey needs no field and no harvest.","src":"https://en.wikipedia.org/wiki/Jiahu","verified":true},{"in":["cabbage","salt"],"out":"sauerkraut","why":"Salt draws water out of the leaves and holds off spoilage bacteria while lactobacilli — already living on the cabbage — turn its sugar into lactic acid.","src":"https://en.wikipedia.org/wiki/Sauerkraut"},{"in":["cucumber","brine"],"out":"pickle","why":"A brined pickle ferments; a vinegar pickle does not. One is alive and sour by its own work, the other is sour on arrival.","src":"https://en.wikipedia.org/wiki/Pickling"},{"in":["tomato"],"verb":"heat","out":"passata","why":"Cooking bursts the cell walls and frees far more lycopene than a raw tomato ever gives up. Some foods are more nutritious cooked.","src":"https://en.wikipedia.org/wiki/Lycopene"},{"in":["herb","olive_oil"],"out":"herb_oil","why":"The compounds that make herbs smell dissolve in fat, not water. Oil is a solvent that holds flavour where a broth cannot.","src":"https://en.wikipedia.org/wiki/Essential_oil"},{"in":["water","tea"],"out":"brewed_tea","why":"Water near boiling pulls tannins out along with the flavour. Bitter tea is usually water that was too hot, not leaf that was left too long.","src":"https://en.wikipedia.org/wiki/Tea","supported":true},{"in":["grass","grass"],"out":"pasture","why":"Humans cannot digest grass. Grazing animals are the machine that converts the most abundant plant on land into food we can use.","src":"https://en.wikipedia.org/wiki/Grazing","supported":true},{"in":["pasture"],"verb":"wait","out":"aurochs","why":"The wild ancestor of cattle: 1.8 m at the shoulder, bad-tempered, and extinct since 1627. Grassland is what drew them in.","src":"https://en.wikipedia.org/wiki/Aurochs","verified":true},{"in":["aurochs","grain"],"out":"cow","why":"Every cow alive descends from roughly 80 wild aurochs tamed in the Near East about 10,000 years ago. Domestication began with feeding them.","src":"https://en.wikipedia.org/wiki/Cattle","verified":true},{"in":["cow","grass"],"out":"milk","why":"A dairy cow eats around 18 kg of dry matter a day — closer to 90 kg of fresh grass — to give some 28 litres of milk. She only makes it because she has recently calved.","src":"https://en.wikipedia.org/wiki/Dairy_cattle","verified":true},{"in":["pasture","seed"],"out":"chicken","why":"Chickens are domesticated red junglefowl from South-East Asian forest. There are now about three alive for every human on Earth.","src":"https://en.wikipedia.org/wiki/Chicken","verified":true},{"in":["chicken"],"verb":"wait","out":"egg","why":"The shell is about 95% calcium carbonate — the same mineral as chalk — and is drilled through with seven to seventeen thousand pores, so the embryo inside can breathe.","src":"https://en.wikipedia.org/wiki/Eggshell","verified":true},{"in":["sea"],"verb":"wait","out":"fish","why":"Fish were the first vertebrates and remain the most numerous. Every bone in your body is a variation on a design worked out in water.","src":"https://en.wikipedia.org/wiki/Fish","verified":true},{"in":["fish","salt"],"out":"salt_fish","why":"Salt cod fed medieval Europe through winter and crossed oceans without refrigeration. Dried and salted, it keeps for years.","src":"https://en.wikipedia.org/wiki/Dried_and_salted_cod"},{"in":["cow"],"verb":"cut","out":"meat","why":"Muscle is protein fibre bundled in collagen. How tender a cut is depends almost entirely on how hard that muscle worked.","src":"https://en.wikipedia.org/wiki/Meat"},{"in":["meat"],"verb":"heat","out":"roast","why":"Above 140 °C amino acids and sugars react together — the Maillard reaction — building hundreds of aroma compounds that were not there raw.","src":"https://en.wikipedia.org/wiki/Maillard_reaction","verified":true},{"in":["meat"],"verb":"crush","out":"mince","why":"Mincing cuts across the muscle fibres, which is why a burger is tender where the same cut whole would be tough.","src":"https://en.wikipedia.org/wiki/Ground_meat"},{"in":["meat","salt"],"out":"cured_meat","why":"Salt pulls water out of both the meat and any bacteria on it. Curing does not kill microbes so much as leave them nothing to drink.","src":"https://en.wikipedia.org/wiki/Curing_(food_preservation)"},{"in":["cured_meat","fire"],"out":"bacon","why":"Smoke is not just flavour. Phenols and formaldehyde in wood smoke are genuinely antimicrobial — it is a chemical preservative humans found by accident.","src":"https://en.wikipedia.org/wiki/Smoking_(cooking)"},{"in":["meat","water"],"out":"broth","why":"Long slow heat dissolves tough collagen into gelatin. The cheapest, hardest-working cuts make the best broth for exactly that reason.","src":"https://en.wikipedia.org/wiki/Gelatin"},{"in":["broth"],"verb":"chill","out":"aspic","why":"Gelatin from the bones sets as it cools — proof, in a bowl, that the collagen really did dissolve.","src":"https://en.wikipedia.org/wiki/Aspic"},{"in":["broth","onion"],"out":"soup","why":"Onion cooked slowly turns sweet: its long-chain sugars break into short ones and its sulphur compounds mellow. Almost every cuisine starts a soup this way.","src":"https://en.wikipedia.org/wiki/Soup","supported":true},{"in":["milk"],"verb":"wait","out":"cream","why":"Fat globules are lighter than water, so they rise. Cream is simply milk that has been left alone long enough.","src":"https://en.wikipedia.org/wiki/Cream"},{"in":["cream"],"verb":"crush","out":"butter","why":"Churning batters the fat globules until their membranes break and the fat sticks to itself, squeezing the water out as buttermilk.","src":"https://en.wikipedia.org/wiki/Churning_(butter)"},{"in":["butter"],"verb":"heat","out":"ghee","why":"Gently cooking butter drives off the water and browns the milk solids, which are then strained out. What is left is nearly pure fat and keeps for months unrefrigerated.","src":"https://en.wikipedia.org/wiki/Ghee"},{"in":["milk"],"verb":"ferment","out":"yoghurt","why":"Lactobacillus turns lactose into lactic acid; the acid makes the milk proteins unfold and knit into a gel. It also digests the lactose, which is why many who cannot drink milk can eat yoghurt.","src":"https://en.wikipedia.org/wiki/Yogurt"},{"in":["milk","vinegar"],"out":"curd","why":"Acid makes casein proteins clump and drop out of the liquid. This is paneer, ricotta and cottage cheese — the quickest cheese there is.","src":"https://en.wikipedia.org/wiki/Curd"},{"in":["curd","salt"],"out":"cheese","why":"Salt pulls out more whey, seasons the curd and keeps the wrong microbes out. Then the only remaining ingredient is time.","src":"https://en.wikipedia.org/wiki/Cheese","supported":true},{"in":["cheese"],"verb":"wait","out":"aged_cheese","why":"Months of enzymes cutting proteins and fats into smaller, louder molecules. The crunchy crystals in old parmesan are free amino acids.","src":"https://en.wikipedia.org/wiki/Cheese_ripening"},{"in":["bread"],"verb":"wait","out":"mould","why":"Penicillium spores are drifting through every room you have ever been in. They only need damp, still air and something to eat.","src":"https://en.wikipedia.org/wiki/Penicillium","supported":true},{"in":["cheese","mould"],"out":"blue_cheese","why":"The blue is deliberately introduced, then given air through skewered holes. Without oxygen down those channels the mould will not grow.","src":"https://en.wikipedia.org/wiki/Blue_cheese"},{"in":["mould"],"verb":"wait","out":"penicillin","why":"In 1928 Alexander Fleming left a plate of bacteria by an open window. A mould landed on it and cleared a ring in the growth. It took another decade, and Florey and Chain, to turn that into a drug.","src":"https://en.wikipedia.org/wiki/History_of_penicillin","verified":true},{"in":["egg","olive_oil"],"out":"mayonnaise","why":"Egg yolk is rich in lecithin, a molecule with a water-loving end and an oil-loving end. It holds oil suspended in water that would otherwise separate on sight.","src":"https://en.wikipedia.org/wiki/Lecithin"},{"in":["egg"],"verb":"heat","out":"boiled_egg","why":"The white sets at 63 °C, the yolk at 70 °C. Every egg you have ever cooked lives or dies in those seven degrees.","src":"https://en.wikipedia.org/wiki/Boiled_egg","verified":true},{"in":["rice"],"verb":"heat","out":"cooked_rice","why":"Starch grains absorb water and burst open — gelatinisation. Raw starch is nearly indigestible to us; cooked, it is the world's main source of calories.","src":"https://en.wikipedia.org/wiki/Starch_gelatinization"},{"in":["cooked_rice","vinegar"],"out":"sushi_rice","why":"Sushi began as a preservation method: fish packed in fermenting rice, the acid keeping it safe. The vinegar today is a shortcut to that same sourness.","src":"https://en.wikipedia.org/wiki/Sushi"},{"in":["potato"],"verb":"heat","out":"baked_potato","why":"Baking dries the starch grains as they swell, giving a floury interior. Boiling the same potato keeps them wet and waxy.","src":"https://en.wikipedia.org/wiki/Baked_potato"},{"in":["potato","olive_oil"],"out":"chips","why":"Hot oil drives water out of the surface as steam, and the escaping steam keeps the oil out. Chips go greasy only when the oil is too cool to do this.","src":"https://en.wikipedia.org/wiki/French_fries","supported":true},{"in":["tomato","cucumber"],"out":"salad","why":"Salt a salad early and osmosis pulls water from every cell. Dress it at the table, not in the kitchen.","src":"https://en.wikipedia.org/wiki/Salad","supported":true},{"in":["bread","cheese"],"out":"cheese_toastie","why":"Cheese melts between 55 and 80 °C depending on how aged it is. Young cheese flows; very old cheese has lost the moisture to do it and splits into oil instead.","src":"https://en.wikipedia.org/wiki/Cheese","supported":true},{"in":["dough","passata"],"out":"pizza_base","why":"A Neapolitan oven runs at 450 °C and cooks a pizza in 90 seconds — fast enough to char the crust before the topping overcooks.","src":"https://en.wikipedia.org/wiki/Neapolitan_pizza","verified":true},{"in":["pizza_base","cheese"],"out":"pizza","why":"The 1889 story of a pizza in the colours of the Italian flag is probably marketing. Tomato on flatbread is far older and belonged to the poor.","src":"https://en.wikipedia.org/wiki/History_of_pizza","verified":true},{"in":["pastry","apple"],"out":"apple_pie","why":"Apples hold their shape because their cell walls are glued with pectin, and pectin survives baking where most plant structure collapses.","src":"https://en.wikipedia.org/wiki/Pectin","supported":true},{"in":["fish"],"verb":"heat","out":"grilled_fish","why":"Fish flesh sets at around 50 °C, far below meat, because it has almost no connective tissue. It was built to be weightless in water, not to hold itself up.","src":"https://en.wikipedia.org/wiki/Fish_as_food","supported":true},{"in":["pizza","wine"],"out":"dinner","why":"Every ingredient on this table began as stone, water, sun and a seed. That is the whole of agriculture in one meal.","src":"https://en.wikipedia.org/wiki/Agriculture"},{"in":["roast","potato"],"out":"dinner","why":"Meat, a tuber from the Andes and heat. Half the world's staple dinners are some version of exactly this.","src":"https://en.wikipedia.org/wiki/Agriculture"},{"in":["dinner","candle"],"out":"feast","why":"Eating together is not a nutritional requirement. Every known human society does it anyway.","src":"https://en.wikipedia.org/wiki/Communal_meal"},{"in":["stone","fire"],"out":"philosopher_stone","shelf":"folklore","why":"Alchemists hunted this for 1,500 years and never found it. Along the way they invented distillation, the acids, and eventually chemistry itself.","src":"https://en.wikipedia.org/wiki/Philosopher's_stone"},{"in":["stone","soup"],"out":"stone_soup","shelf":"folklore","why":"A traveller sets a stone boiling and says it needs only one small thing more. Each villager adds one small thing. Everyone eats.","src":"https://en.wikipedia.org/wiki/Stone_Soup"},{"in":["dough","honey"],"out":"gingerbread_man","shelf":"folklore","why":"Run, run, as fast as you can. Attributed to Elizabeth I, who had gingerbread figures made in the likeness of visiting dignitaries.","src":"https://en.wikipedia.org/wiki/The_Gingerbread_Man"},{"in":["straw","wheat"],"out":"corn_dolly","shelf":"folklore","why":"The last sheaf of the harvest was woven into a figure to house the corn spirit through the winter, and ploughed back in come spring.","src":"https://en.wikipedia.org/wiki/Corn_dolly"},{"in":["straw","field"],"out":"scarecrow","shelf":"folklore","why":"Crows learn a scarecrow's face in about two days and ignore it thereafter. It works on everything else.","src":"https://en.wikipedia.org/wiki/Scarecrow"},{"in":["fruit","pot"],"out":"cornucopia","shelf":"folklore","why":"The horn of the goat Amalthea, who suckled the infant Zeus. Broken off, it refilled itself forever.","src":"https://en.wikipedia.org/wiki/Cornucopia"},{"in":["honey","wine"],"out":"ambrosia","shelf":"folklore","why":"Food of the Greek gods. Mortals who ate it were said to become immortal, which is a reasonable claim to make about honey.","src":"https://en.wikipedia.org/wiki/Ambrosia"},{"in":["bread","sun"],"out":"manna","shelf":"folklore","why":"Bread that appeared each morning in the desert and rotted by nightfall — except on the sabbath. Nobody has ever agreed what it was.","src":"https://en.wikipedia.org/wiki/Manna"},{"in":["egg","fire"],"out":"golden_egg","shelf":"folklore","why":"The moral is usually read as greed. It is at least as much about not understanding the system you depend on before you cut it open.","src":"https://en.wikipedia.org/wiki/The_Goose_that_Laid_the_Golden_Eggs"},{"in":["flint","wood"],"out":"sickle","why":"Flint flakes set in a curved wooden handle. This one tool is what made harvesting grain at scale physically possible.","src":"https://en.wikipedia.org/wiki/Sickle"},{"in":["harvest","brick"],"out":"granary","why":"Storing grain let a village survive a bad year, and created a surplus worth counting. The earliest writing we have is granary accounting: tallies of barley on clay.","src":"https://en.wikipedia.org/wiki/History_of_writing","verified":true},{"in":["charcoal","fish"],"out":"smoked_fish","why":"Cold smoke dries the surface and coats it in phenols. The fish is preserved before it is ever cooked.","src":"https://en.wikipedia.org/wiki/Smoked_fish"},{"in":["glass","sun"],"out":"greenhouse","why":"Glass mostly stops the warmed air inside from rising away — a greenhouse works by blocking convection. Despite the shared name, that is not the mechanism of the atmospheric greenhouse effect.","src":"https://en.wikipedia.org/wiki/Greenhouse","verified":true},{"in":["greenhouse","seedling"],"out":"early_crop","why":"A few degrees of borrowed warmth moves the harvest weeks earlier — and moves crops hundreds of miles north of where they could otherwise live.","src":"https://en.wikipedia.org/wiki/Greenhouse"},{"in":["steam","wood"],"out":"barrel","why":"Steam softens the lignin in oak enough to bend it without breaking. Every wine barrel and every wooden boat depends on this.","src":"https://en.wikipedia.org/wiki/Barrel","verified":true},{"in":["barrel","wine"],"out":"aged_wine","why":"Oak gives up vanillin and tannin and lets a trace of oxygen through the staves. The barrel is not storage, it is an ingredient.","src":"https://en.wikipedia.org/wiki/Oak_(wine)"},{"in":["soap","water"],"out":"clean_hands","why":"Washing with soap cuts diarrhoeal disease by roughly 30%. It is still one of the cheapest public health measures ever found.","src":"https://pmc.ncbi.nlm.nih.gov/articles/PMC4563982/","verified":true},{"in":["garlic","butter"],"out":"garlic_butter","why":"Allicin dissolves in fat. Butter carries garlic's flavour into places water never could.","src":"https://en.wikipedia.org/wiki/Garlic_butter","supported":true},{"in":["garlic_butter","bread"],"out":"garlic_bread","why":"Bread is porous enough to drink melted fat and hold it. That is the entire recipe.","src":"https://en.wikipedia.org/wiki/Garlic_bread"},{"in":["flatbread","roast"],"out":"wrap","why":"Flatbread as cutlery. Most of the world ate this way long before anyone laid a table.","src":"https://en.wikipedia.org/wiki/Wrap_(food)"},{"in":["beer"],"verb":"ferment","out":"malt_vinegar","why":"Beer goes the same way wine does when Acetobacter finds it. The chip shop is one step from the brewery.","src":"https://en.wikipedia.org/wiki/Vinegar"},{"in":["caramel","cream"],"out":"caramel_sauce","why":"Cream stops the caramelising and stays pourable when cold, because fat and water get in the sugar's way as it tries to recrystallise.","src":"https://en.wikipedia.org/wiki/Caramel"},{"in":["ice_cream","caramel_sauce"],"out":"sundae","why":"Hot sauce on cold ice cream works because your tongue reads the contrast, not the average.","src":"https://en.wikipedia.org/wiki/Sundae"},{"in":["sauerkraut","sausage"],"out":"choucroute","why":"Alsace pairs them because both were autumn preservation, made in the same weeks from the same slaughter and the same cabbage.","src":"https://en.wikipedia.org/wiki/Choucroute_garnie"},{"in":["bacon","egg"],"out":"breakfast","why":"Bacon and eggs became the American breakfast because Edward Bernays, working for a pork packer in 1922, got 4,500 doctors to endorse a heavy morning meal.","src":"https://en.wikipedia.org/wiki/Edward_Bernays","verified":true},{"in":["aged_cheese","apple"],"out":"cheeseboard","why":"Acid and sugar cut through fat that would otherwise coat the palate. The pairing is mechanical, not merely traditional.","src":"https://en.wikipedia.org/wiki/Cheese"},{"in":["mayonnaise","potato"],"out":"potato_salad","why":"Dress potatoes while still warm — the starch is open and drinks the dressing. Cold, it sits on the surface.","src":"https://en.wikipedia.org/wiki/Potato_salad"},{"in":["ghee","cooked_rice"],"out":"pilaf","why":"Coating each grain in fat before the water goes in keeps the starch from gluing them together. Every rice dish that must stay loose does this.","src":"https://en.wikipedia.org/wiki/Pilaf"},{"in":["dough","salt"],"out":"salted_dough","supported":true,"why":"Salt tightens the gluten network and slows the yeast, so the dough rises evenly instead of racing. Bread without it tastes flat and stales fast.","src":"https://en.wikipedia.org/wiki/Bread"},{"in":["salted_dough","yeast"],"out":"risen_dough","supported":true,"why":"Yeast eats the sugars in the flour and breathes out carbon dioxide. The gluten net catches every bubble.","src":"https://en.wikipedia.org/wiki/Leavening_agent"},{"in":["butter","sugar"],"out":"creamed_butter","supported":true,"why":"Beating sugar into butter drags in air, and the sugar crystals tear more bubbles as they go. That trapped air is most of the rise.","src":"https://en.wikipedia.org/wiki/Creaming_(cooking)"},{"in":["creamed_butter","egg"],"out":"cake_mix","supported":true,"why":"Egg yolk emulsifies the fat and water so they stop trying to separate; the white adds protein that will set in the oven.","src":"https://en.wikipedia.org/wiki/Cake"},{"in":["cake_mix","flour"],"out":"cake_batter","supported":true,"why":"Flour goes in last and is barely mixed. Work it and you build gluten, which turns cake into bread.","src":"https://en.wikipedia.org/wiki/Cake"},{"in":["cream","sugar"],"out":"sweet_cream","supported":true,"why":"Sugar does more than sweeten — dissolved in the water it lowers the freezing point, which is why ice cream stays soft enough to scoop.","src":"https://en.wikipedia.org/wiki/Ice_cream"},{"in":["sweet_cream","ice"],"out":"ice_cream","verified":true,"why":"Packed in ice and salt, the cream freezes below 0 °C while being stirred. The stirring keeps the ice crystals microscopic — that is the entire trick.","src":"https://en.wikipedia.org/wiki/Ice_cream"},{"in":["bread"],"verb":"crush","out":"breadcrumb","supported":true,"why":"Stale bread crushed to crumb. In a meatball it holds water that the meat would otherwise squeeze out as it contracts.","src":"https://en.wikipedia.org/wiki/Breadcrumbs"},{"in":["mince","breadcrumb"],"out":"meatball_mix","supported":true,"why":"The crumb swells with moisture and keeps the meat fibres apart, which is the difference between tender and rubbery.","src":"https://en.wikipedia.org/wiki/Meatball"},{"in":["meatball_mix","egg"],"out":"meatball","supported":true,"why":"Egg is the binder. Without it the mix falls apart the moment it hits heat.","src":"https://en.wikipedia.org/wiki/Meatball"},{"in":["meatball","passata"],"out":"meatball_sauce","supported":true,"why":"Finish
