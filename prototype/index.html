nt_meal","why":"Any alumino-silicate will do for the second ingredient — clay, shale or river mud all supply it.","supported":true,"src":"https://en.wikipedia.org/wiki/Portland_cement"},{"in":["cement_meal","fire"],"out":"cement","why":"The first Portland cement was burnt in bottle kilns fired with coal. Continuous rotary kilns came sixty years later.","supported":true,"src":"https://en.wikipedia.org/wiki/Portland_cement"},{"in":["cement","water"],"out":"mortar","why":"Cement sets by hydration, not drying — it will harden perfectly well underwater, which is how bridge piers are built.","supported":true,"src":"https://en.wikipedia.org/wiki/Mortar_(masonry)"},{"in":["cement","stone"],"out":"concrete","why":"The aggregate is most of the volume and most of the strength. The cement is only the glue between stones.","supported":true,"src":"https://en.wikipedia.org/wiki/Concrete"},{"in":["meadow","stone"],"out":"goat","why":"Goats climb. They reach browse on cliffs and walls no other livestock can, which is why islands and mountains kept them.","supported":true,"src":"https://en.wikipedia.org/wiki/Goat"},{"in":["stone","charcoal"],"out":"philosopher_stone","why":"Alchemists heated everything with charcoal and watched for a change of colour. They found phosphorus, antimony and a great deal of chemistry.","supported":true,"src":"https://en.wikipedia.org/wiki/Philosopher's_stone"},{"in":["stone","broth"],"out":"stone_soup","why":"By the time the broth is going, nobody remembers the stone was the point.","supported":true,"src":"https://en.wikipedia.org/wiki/Stone_Soup"},{"in":["dough","sugar"],"out":"gingerbread_man","why":"Honey came first; sugar made gingerbread cheap enough for fairs, and fairings were sold at every one.","supported":true,"src":"https://en.wikipedia.org/wiki/The_Gingerbread_Man"},{"in":["straw","harvest"],"out":"corn_dolly","why":"Made from the last sheaf standing, and kept indoors until the spring sowing.","supported":true,"src":"https://en.wikipedia.org/wiki/Corn_dolly"},{"in":["straw","wood"],"out":"scarecrow","why":"Two sticks and a bundle of straw. The Japanese village of Nagoro has thirty-five people living in it and more than three hundred and fifty scarecrows.","src":"https://en.wikipedia.org/wiki/Scarecrow","verified":true},{"in":["harvest","pot"],"out":"cornucopia","why":"A horn heaped with the harvest, and never emptying. Every abundance myth has one.","supported":true,"src":"https://en.wikipedia.org/wiki/Cornucopia"},{"in":["honey","mead"],"out":"ambrosia","why":"Whatever ambrosia was, the descriptions keep coming back to honey.","supported":true,"src":"https://en.wikipedia.org/wiki/Ambrosia"},{"in":["flour","sun"],"out":"manna","why":"Some think it was tamarisk secretion, some a lichen. It kept for exactly one day, which is the part nobody can explain.","supported":true,"src":"https://en.wikipedia.org/wiki/Manna"},{"in":["egg","sun"],"out":"golden_egg","why":"The goose was killed to find where the gold came from. There was no gold, only a goose.","supported":true,"src":"https://en.wikipedia.org/wiki/The_Goose_that_Laid_the_Golden_Eggs"},{"in":["plant","fruit"],"out":"chilli","supported":true,"why":"Chillies are berries on a small shrub — botanically closer to a tomato than to any spice.","src":"https://en.wikipedia.org/wiki/Capsaicin"},{"in":["sea","river"],"out":"fish","supported":true,"why":"Estuaries are the most productive fish nurseries on Earth: fresh water brings nutrients, salt water brings safety.","src":"https://en.wikipedia.org/wiki/Fish"},{"in":["egg","herb_oil"],"out":"mayonnaise","supported":true,"why":"Any neutral-ish oil emulsifies. Strongly flavoured oil makes a sauce that fights whatever it dresses.","src":"https://en.wikipedia.org/wiki/Lecithin"},{"in":["rubbed_flour","apple"],"out":"apple_pie","supported":true,"why":"Rubbed pastry straight onto the fruit — no blind baking, and the base takes up the juice as it cooks.","src":"https://en.wikipedia.org/wiki/Pectin"},{"in":["wood","water"],"out":"barrel","supported":true,"why":"Long soaking bends oak nearly as well as steam, and coopers used it wherever fuel was dearer than time.","src":"https://en.wikipedia.org/wiki/Barrel"},{"in":["noodle","meatball_sauce"],"out":"spaghetti_meatballs","supported":true,"why":"Fresh noodles finish in the sauce itself, taking up flavour instead of water.","src":"https://en.wikipedia.org/wiki/Spaghetti_and_meatballs"},{"in":["fried_fish","baked_potato"],"out":"fish_and_chips","supported":true,"why":"The baked-potato version predates chips in much of Britain — the fryer came from France later.","src":"https://en.wikipedia.org/wiki/Fish_and_chips"},{"in":["salt_fish","batter"],"out":"battered_fish","why":"Salt cod soaked back to life. Until the nineteenth century salting or drying was the only widely available way to keep a fish at all, which is why the batter was invented for a fish that had already travelled.","src":"https://en.wikipedia.org/wiki/Salted_fish","verified":true},{"in":["cabbage","sea"],"out":"salted_cabbage","supported":true,"why":"Seawater is already about as salty as a lactic ferment wants, which is why coastal kitchens simply used it instead of measuring anything out.","src":"https://en.wikipedia.org/wiki/Kimchi"},{"in":["beer"],"verb":"wait","out":"malt_vinegar","supported":true,"why":"Leave beer open and it sours on its own. Acetobacter is airborne and arrives uninvited.","src":"https://en.wikipedia.org/wiki/Vinegar"},{"in":["charcoal"],"verb":"crush","out":"carbon","why":"Charcoal is wood with everything but the carbon baked out — around 90% of what remains. Grind it and you have very nearly the element.","verified":true,"src":"https://en.wikipedia.org/wiki/Charcoal"},{"in":["leaf","water"],"out":"oxygen_gas","why":"Nearly all the oxygen in the atmosphere came out of split water, not out of carbon dioxide. Photosystem II tears four electrons off two water molecules and lets the oxygen go as waste.","verified":true,"src":"https://en.wikipedia.org/wiki/Photosystem_II"},{"in":["steam","charcoal"],"out":"hydrogen_gas","why":"Steam over red-hot carbon: H₂O + C → H₂ + CO. It absorbs heat as it runs, so the fuel has to be reheated constantly to keep it going.","verified":true,"src":"https://en.wikipedia.org/wiki/Water_gas"},{"in":["seed","root"],"out":"legume","why":"Peas, beans, clover and lentils. Their roots grow nodules and invite bacteria in — a deliberate infection the plant controls.","supported":true,"src":"https://en.wikipedia.org/wiki/Legume"},{"in":["legume","soil"],"out":"nitrogen","why":"Air is four fifths nitrogen and almost nothing can touch it: the triple bond is that strong. Rhizobia in the root nodules carry nitrogenase, and spend 16 ATP to break a single molecule.","verified":true,"src":"https://en.wikipedia.org/wiki/Nitrogen_fixation"},{"in":["meat"],"verb":"cut","out":"bone","why":"Collagen gives bone its spring and calcium phosphate gives it stiffness. Take either away and it fails — one snaps, the other bends.","supported":true,"src":"https://en.wikipedia.org/wiki/Bone"},{"in":["bone"],"verb":"heat","out":"phosphorus","why":"Bone ash is calcium phosphate, and plants cannot take it up in that form. Treat it with sulfuric acid and it becomes single superphosphate, which dissolves — which is the whole of what artificial fertiliser originally meant.","src":"https://en.wikipedia.org/wiki/Phosphorus","verified":true},{"in":["stone","steam"],"out":"sulfur","why":"Volcanic vents breathe out sulfurous gas that cools into bright yellow crusts. Miners cut it straight off the rock in slabs.","supported":true,"src":"https://en.wikipedia.org/wiki/Sulfur"},{"in":["hydrogen_gas","oxygen_gas"],"out":"water","why":"Two volumes of hydrogen to one of oxygen, and the energy released is enough to lift a rocket. The product is water and nothing else.","supported":true,"src":"https://en.wikipedia.org/wiki/Water_(data_page)"},{"in":["carbon","oxygen_gas"],"out":"carbon_dioxide","why":"What every fire and every breath produces, and what every leaf is looking for.","supported":true,"src":"https://en.wikipedia.org/wiki/Carbon_dioxide"},{"in":["leaf","carbon_dioxide"],"out":"glucose","why":"Six carbon dioxide, six water and enough light: one glucose. Nearly every calorie you will ever eat was assembled by this reaction.","verified":true,"src":"https://en.wikipedia.org/wiki/Photosynthesis"},{"in":["glucose","glucose"],"out":"starch","why":"Glucose chained head to tail for storage. Bond it the other way round instead and you get cellulose — the same sugar, and we cannot digest it.","supported":true,"src":"https://en.wikipedia.org/wiki/Starch","releases":"water"},{"in":["glucose","nitrogen"],"out":"amino_acid","why":"Carbon skeletons from sugar, nitrogen from the soil. Nine of the twenty you cannot make at all — valine, isoleucine, leucine, methionine, phenylalanine, tryptophan, threonine, histidine and lysine — which is why they are called essential.","src":"https://en.wikipedia.org/wiki/Essential_amino_acid","verified":true},{"in":["amino_acid","sulfur"],"out":"cysteine","why":"Only two of the twenty carry sulfur, and cysteine is the one that matters structurally — its sulfur can reach out and grab another.","supported":true,"src":"https://en.wikipedia.org/wiki/Cysteine"},{"in":["amino_acid","amino_acid"],"out":"dipeptide","why":"A condensation: the carboxyl of one meets the amino group of the other and a whole water molecule leaves. Left alone in water the bond would take 350 to 600 years to undo.","verified":true,"src":"https://en.wikipedia.org/wiki/Peptide_bond","releases":"water"},{"in":["dipeptide","amino_acid"],"out":"polypeptide","why":"Keep adding and the order becomes information. A ribosome reads it off RNA at roughly twenty amino acids a second.","supported":true,"src":"https://en.wikipedia.org/wiki/Peptide","releases":"water"},{"in":["polypeptide"],"verb":"wait","out":"protein","why":"The chain collapses into one specific shape, usually within a second, and the shape is decided entirely by the order of the links. Get it wrong and you have a prion.","supported":true,"src":"https://en.wikipedia.org/wiki/Protein_folding"},{"in":["cysteine","cysteine"],"out":"disulfide","why":"Two sulfurs bond and staple distant parts of a chain together. Perming hair is breaking these and setting them again in a new position.","supported":true,"src":"https://en.wikipedia.org/wiki/Disulfide"},{"in":["protein","disulfide"],"out":"keratin","why":"Hair, nail, horn, hoof, feather and the outer layer of your skin are the same protein family, cross-linked to different densities.","supported":true,"src":"https://en.wikipedia.org/wiki/Keratin"},{"in":["protein"],"verb":"heat","out":"denatured_protein","why":"Heat shakes a folded protein apart and it tangles with its neighbours instead. That is cooking — an egg white going from clear to solid is this and nothing else.","supported":true,"src":"https://en.wikipedia.org/wiki/Denaturation_(biochemistry)"},{"in":["glucose","phosphorus"],"out":"atp","why":"A sugar, a base and three phosphates. Snapping the last phosphate off releases the energy for almost everything you do, and you recycle your own body weight of it daily.","supported":true,"src":"https://en.wikipedia.org/wiki/Adenosine_triphosphate"},{"in":["atp","nitrogen"],"out":"nucleotide","why":"Sugar, phosphate and a nitrogen-rich base. ATP is itself one of these — the cell uses the same part for energy and for information.","supported":true,"src":"https://en.wikipedia.org/wiki/Nucleotide"},{"in":["nucleotide","nucleotide"],"out":"dna","why":"Phosphate bridges the sugars into a backbone and the bases pair across the middle. Two metres of it is folded into every cell you have.","supported":true,"src":"https://en.wikipedia.org/wiki/DNA"},{"in":["protein","olive_oil"],"out":"membrane","why":"Fat tails will not tolerate water, so they turn inward and form a double sheet on their own. Proteins sit in it as doors and pumps.","supported":true,"src":"https://en.wikipedia.org/wiki/Cell_membrane"},{"in":["membrane","dna"],"out":"cell","why":"An inside, a set of instructions, and machinery to read them. Everything you have ever eaten was made of these.","supported":true,"src":"https://en.wikipedia.org/wiki/Cell_(biology)"},{"in":["cell","cell"],"out":"tissue","why":"Cells that stick to each other and specialise. Sticking together at all was the hard part — it took life about three billion years.","supported":true,"src":"https://en.wikipedia.org/wiki/Tissue_(biology)"},{"in":["tissue","protein"],"out":"muscle","why":"Two proteins, actin and myosin, ratcheting past one another. Every movement you have ever made is that, repeated.","supported":true,"src":"https://en.wikipedia.org/wiki/Muscle"},{"in":["muscle"],"verb":"cut","out":"meat","why":"Meat is muscle, rested. Everything above this line — the cell, the protein, the amino acid, the carbon — was already in it.","supported":true,"src":"https://en.wikipedia.org/wiki/Meat"},{"in":["protein","bone"],"out":"collagen","why":"Three chains wound into a rope, and about a third of all the protein in you. It is what holds a body together rather than what makes it move.","supported":true,"src":"https://en.wikipedia.org/wiki/Collagen"},{"in":["collagen"],"verb":"heat","out":"gelatin","why":"Long slow heat unwinds the triple helix into loose strands that grab water as they cool. This is why a good stock sets in the fridge.","supported":true,"src":"https://en.wikipedia.org/wiki/Gelatin"},{"in":["gelatin","broth"],"out":"aspic","why":"Extra gelatin makes the set reliable rather than hopeful — useful when the bones were lean.","supported":true,"src":"https://en.wikipedia.org/wiki/Aspic"},{"in":["protein","atp"],"out":"enzyme","why":"A pocket shaped to hold one molecule and strain it toward breaking. Nearly every step in this whole game is an enzyme doing its job.","supported":true,"src":"https://en.wikipedia.org/wiki/Enzyme"},{"in":["enzyme","grain"],"out":"malt","why":"Malting is just letting the grain make its own enzymes. Add them directly and you skip the germination entirely — which is what industrial brewing does.","supported":true,"src":"https://en.wikipedia.org/wiki/Malting"},{"in":["protein","vinegar"],"out":"curd","why":"Acid unfolds casein as surely as heat does, and the unfolded chains tangle and drop out of the liquid.","supported":true,"src":"https://en.wikipedia.org/wiki/Curdling"},{"in":["nucleotide","phosphorus"],"out":"dna","supported":true,"why":"Phosphate is the bridge: it links the sugar of one nucleotide to the sugar of the next, and that backbone is what makes DNA a chain rather than a pile.","src":"https://en.wikipedia.org/wiki/Phosphodiester_bond"},{"in":["dna"],"verb":"cut","out":"nucleotide","supported":true,"why":"Enzymes cut DNA back into its links. Restriction enzymes do it at specific sequences, which is the whole basis of genetic engineering.","src":"https://en.wikipedia.org/wiki/Restriction_enzyme"},{"in":["protein","butter"],"out":"membrane","supported":true,"why":"Any lipid will form a bilayer. The tails are what refuse water, and it happens on its own the moment they are wet.","src":"https://en.wikipedia.org/wiki/Lipid_bilayer"},{"in":["tissue"],"verb":"cut","out":"cell","supported":true,"why":"Dissociating tissue back into single cells is routine lab work — enzymes digest the matrix holding them together.","src":"https://en.wikipedia.org/wiki/Cell_culture"},{"in":["cell","protein"],"out":"tissue","supported":true,"why":"Cells alone are a suspension. What makes tissue is the protein scaffold between them holding everyone in place.","src":"https://en.wikipedia.org/wiki/Extracellular_matrix"},{"in":["tissue","atp"],"out":"muscle","supported":true,"why":"Muscle without ATP cannot let go. Rigor mortis is exactly that — the filaments locked because the energy to release them has run out.","src":"https://en.wikipedia.org/wiki/Rigor_mortis"},{"in":["tissue","bone"],"out":"collagen","supported":true,"why":"Skin, tendon, cartilage and bone are all collagen with different things packed around it.","src":"https://en.wikipedia.org/wiki/Collagen"},{"in":["collagen","water"],"out":"gelatin","supported":true,"why":"Hot water hydrolyses the triple helix apart. Cold water will not do it, which is why stock has to simmer.","src":"https://en.wikipedia.org/wiki/Gelatin"},{"in":["yeast","protein"],"out":"enzyme","supported":true,"why":"Yeast is a chemical factory that leaks. Brewers and bakers have exploited its enzymes for millennia without knowing they existed.","src":"https://en.wikipedia.org/wiki/Enzyme"},{"in":["starch","protein"],"out":"dough","supported":true,"why":"Dough is starch held in a protein net. Take the protein away and you have a paste that will not rise.","src":"https://en.wikipedia.org/wiki/Dough"},{"in":["bone"],"verb":"crush","out":"carbon","supported":true,"why":"Bone char is carbon with the calcium left in. Sugar refineries used it for centuries to whiten syrup.","src":"https://en.wikipedia.org/wiki/Bone_char"},{"in":["meadow","sun"],"out":"oxygen_gas","supported":true,"why":"A hectare of growing plants releases several tonnes of oxygen a year, all of it split out of water.","src":"https://en.wikipedia.org/wiki/Photosynthesis"},{"in":["steam","carbon"],"out":"hydrogen_gas","supported":true,"why":"The same water gas reaction, run on pure carbon rather than charcoal. Most industrial hydrogen still comes from steam and a fossil carbon source.","src":"https://en.wikipedia.org/wiki/Steam_reforming"},{"in":["legume"],"verb":"wait","out":"nitrogen","supported":true,"why":"When the legume dies the fixed nitrogen is released into the soil. Red clover can leave 50 to 200 pounds an acre behind.","src":"https://en.wikipedia.org/wiki/Nitrogen_fixation"},{"in":["egg"],"verb":"ferment","out":"sulfur","supported":true,"why":"The smell of a rotten egg is hydrogen sulfide — bacteria stripping the sulfur out of the egg's own cysteine.","src":"https://en.wikipedia.org/wiki/Hydrogen_sulfide"},{"in":["ash","bone"],"out":"phosphorus","why":"Bone ash is calcium phosphate. Lawes patented treating it with sulfuric acid in 1842, which made the phosphate soluble — superphosphate, and the start of the artificial fertiliser industry.","src":"https://en.wikipedia.org/wiki/Bone_ash","verified":true},{"in":["plant","root"],"out":"legume","supported":true,"why":"Legumes are just plants that struck a bargain: sugar down to the bacteria, fixed nitrogen back up.","src":"https://en.wikipedia.org/wiki/Legume"},{"in":["fish"],"verb":"cut","out":"bone","supported":true,"why":"Fish bones are thin and give up their collagen in twenty minutes. Any longer and the stock turns bitter.","src":"https://en.wikipedia.org/wiki/Stock_(food)"},{"in":["yeast","glucose"],"out":"carbon_dioxide","supported":true,"why":"Yeast eats sugar and breathes out carbon dioxide. Every risen loaf and every bubble in beer is this gas trying to escape.","src":"https://en.wikipedia.org/wiki/Fermentation"},{"in":["starch","enzyme"],"out":"glucose","supported":true,"why":"Amylase cuts starch back into sugar. It is in your saliva — chew bread long enough and it turns sweet in your mouth.","src":"https://en.wikipedia.org/wiki/Amylase"},{"in":["potato"],"verb":"crush","out":"starch","supported":true,"why":"Grate a potato into water and the starch settles out as a white sludge. Wash and dry it and you have pure starch.","src":"https://en.wikipedia.org/wiki/Starch"},{"in":["protein","water"],"out":"amino_acid","supported":true,"why":"Digestion is hydrolysis: enzymes put a water molecule back into every peptide bond and take the chain apart link by link.","src":"https://en.wikipedia.org/wiki/Hydrolysis"},{"in":["keratin"],"verb":"crush","out":"cysteine","supported":true,"why":"Industrial cysteine is still extracted from hair and feathers, because keratin is unusually rich in it.","src":"https://en.wikipedia.org/wiki/Cysteine"},{"in":["polypeptide"],"verb":"cut","out":"dipeptide","supported":true,"why":"Proteases cut chains at specific points. Your stomach is doing this to everything you have eaten today.","src":"https://en.wikipedia.org/wiki/Protease"},{"in":["dipeptide","dipeptide"],"out":"polypeptide","supported":true,"why":"Chains join to chains. Length is what turns a peptide into a protein, and the line between them is a matter of convention.","src":"https://en.wikipedia.org/wiki/Peptide","releases":"water"},{"in":["polypeptide","disulfide"],"out":"protein","supported":true,"why":"Cross-links lock a fold in place. Proteins that have to survive outside a cell — like keratin and insulin — are full of them.","src":"https://en.wikipedia.org/wiki/Protein"},{"in":["cysteine","oxygen_gas"],"out":"disulfide","supported":true,"why":"Two cysteines oxidise and bond, losing two hydrogens. It happens on contact with air, which is why cut hair smells the way it does when burnt.","src":"https://en.wikipedia.org/wiki/Disulfide"},{"in":["protein","sulfur"],"out":"keratin","supported":true,"why":"The more sulfur cross-links, the harder the keratin. Hair is soft, hoof is hard, and the difference is density of disulfide bonds.","src":"https://en.wikipedia.org/wiki/Keratin"},{"in":["protein","salt"],"out":"denatured_protein","supported":true,"why":"Salt unfolds protein as surely as heat does. Curing, brining and salting fish are all denaturation without a fire.","src":"https://en.wikipedia.org/wiki/Denaturation_(biochemistry)"},{"in":["glucose","oxygen_gas"],"out":"atp","supported":true,"why":"Respiration: burn one glucose with oxygen and you get about 30 ATP. Fermentation without oxygen gets two, which is why you breathe.","src":"https://en.wikipedia.org/wiki/Cellular_respiration"},{"in":["yoghurt","kimchi_paste"],"out":"garlic_yoghurt","supported":true,"why":"Any raw allium works. The yoghurt's acid and fat blunt the harshness without cooking it away.","src":"https://en.wikipedia.org/wiki/Tzatziki"},{"in":["boiled_egg","herb_oil"],"out":"egg_mayo","supported":true,"why":"Herb oil emulsifies as readily as plain oil and brings its own seasoning with it.","src":"https://en.wikipedia.org/wiki/Egg_salad"},{"in":["polypeptide","water"],"out":"alpha_helix","why":"Folding is not the chain pulling itself together — it is water pushing. Greasy side chains are driven inward, and the backbone settles into a spring held by hydrogen bonds between residue n and residue n+4, 3.6 residues to a turn.","supported":true,"src":"https://en.wikipedia.org/wiki/Protein_folding"},{"in":["polypeptide","polypeptide"],"out":"beta_sheet","why":"Two stretched chains lie alongside each other and hydrogen-bond across the gap, pleating like a folded fan. Spider dragline silk is mostly this, which is why it out-pulls steel of the same weight.","supported":true,"src":"https://en.wikipedia.org/wiki/Beta_sheet"},{"in":["alpha_helix","beta_sheet"],"out":"protein","why":"Helices and sheets are the second level; packing them against each other is the third. Anfinsen's dogma is that for a small globular protein the native structure is set by the amino acid sequence alone — nothing else is needed to specify the shape.","src":"https://en.wikipedia.org/wiki/Anfinsen's_dogma","verified":true},{"in":["nucleotide","protein"],"out":"ribosome","why":"Two thirds RNA by mass, and the RNA is not scaffolding: the catalytic core that joins amino acids is made of RNA, not protein. That is why a ribosome is classed as a ribozyme.","src":"https://en.wikipedia.org/wiki/Ribosome","verified":true},{"in":["dna","enzyme"],"out":"messenger_rna","why":"RNA polymerase opens the double helix and copies one strand, swapping thymine for uracil. It does not need a primer to start, which is the main thing separating it from the machinery that copies DNA.","supported":true,"src":"https://en.wikipedia.org/wiki/Transcription_(biology)"},{"in":["messenger_rna","ribosome"],"out":"polypeptide","why":"Translation: the ribosome reads three bases at a time and adds one amino acid per codon, about 20 a second in a bacterium. This is the step that turns a sequence into a substance.","src":"https://en.wikipedia.org/wiki/Translation_(biology)","verified":true},{"in":["keratin"],"verb":"cut","out":"alpha_helix","why":"Keratin is helices wound around each other into a rope, then roped again. Cut the rope apart and you are back to the single coil it was built from — which is why hair stretches, and why it springs back.","supported":true,"src":"https://en.wikipedia.org/wiki/Keratin"},{"in":["denatured_protein"],"verb":"wait","out":"beta_sheet","why":"An unfolded chain left alone does not stay loose. Stretches of it line up with its neighbours into sheets and stack — the same fold, whatever protein it started as. That stack is amyloid.","supported":true,"src":"https://en.wikipedia.org/wiki/Amyloid"},{"in":["cell"],"verb":"cut","out":"ribosome","why":"This is how they were found. Break the cell open, spin the soup hard enough, and the ribosomes come down as a pellet — George Palade first saw them in 1955, and they were called Palade granules before they had a proper name.","src":"https://en.wikipedia.org/wiki/Ribosome","verified":true},{"in":["dna","nucleotide"],"out":"messenger_rna","why":"The template gives the order; the loose nucleotides are the letters. RNA polymerase runs along the open strand at about 40 bases a second, pairing each one and leaving the DNA to zip back up behind it.","supported":true,"src":"https://en.wikipedia.org/wiki/RNA_polymerase"},{"in":["penicillin"],"verb":"wait","out":"resistance","why":"Use it long enough and the only bacteria left are the ones it did not kill. Fleming predicted this in 1945: the time may come, he said, when penicillin can be bought by anyone in the shops.","supported":true,"src":"https://en.wikipedia.org/wiki/Antimicrobial_resistance"},{"in":["penicillin","soil"],"out":"resistance","why":"Resistance is not something we invented. Soil fungi and bacteria have been chemically fighting each other for a very long time, and the genes that survive that fight are already in the ground.","supported":true,"src":"https://en.wikipedia.org/wiki/Antimicrobial_resistance"},{"in":["hydrogen","hydrogen"],"out":"hydrogen_gas","why":"Two atoms sharing a single pair of electrons is a covalent bond, and it is a lower-energy state than either atom sitting alone — which is why free hydrogen atoms almost never last. H2, the gas.","src":"https://en.wikipedia.org/wiki/Covalent_bond","verified":true},{"in":["oxygen","oxygen"],"out":"oxygen_gas","why":"The same sharing, twice over — two shared pairs, a double bond. O2 is the form oxygen actually takes at ordinary temperature, not the lone atom.","src":"https://en.wikipedia.org/wiki/Covalent_bond","verified":true},{"in":["hydrogen_gas","spark"],"out":"hydrogen","why":"An electric arc splits H2 back into single atoms. What actually welds is what happens next — those atoms recombine on the metal, releasing enough heat to reach 3,400 to 4,000 degrees C.","src":"https://en.wikipedia.org/wiki/Atomic_hydrogen_welding","verified":true},{"in":["oxygen_gas","sun"],"out":"oxygen","why":"Above the stratosphere there is nothing to shield O2 from the sun's ultraviolet, and it gets torn apart faster than it can recombine — atomic oxygen makes up 96% of the oxygen in low Earth orbit.","src":"https://en.wikipedia.org/wiki/Allotropes_of_oxygen","verified":true},{"in":["sun","water"],"out":"steam","why":"The sun drives the evaporation of water from oceans, lakes, and soil — no flame needed, just enough time in the light.","src":"https://en.wikipedia.org/wiki/Evaporation","verified":true},{"in":["ice","sun"],"out":"water","why":"Sunlight is one of the main energy inputs that melts snow and ice — the same shortwave radiation that warms everything else it lands on.","src":"https://en.wikipedia.org/wiki/Snowmelt","verified":true},{"in":["limestone","steam"],"out":"ore","why":"Hot, mineral-laden fluid forcing its way through limestone alters it into skarn — one of the most productive kinds of ore body there is, a real source of tin, tungsten, copper, gold, zinc, lead, nickel and iron ore alike.","src":"https://en.wikipedia.org/wiki/Skarn","verified":true},{"in":["stone","sulfur"],"out":"cinnabar","why":"Cinnabar forms as a vein filling in rock near volcanic activity and hot springs — sulfur meeting mercury underground, cooling in place.","src":"https://en.wikipedia.org/wiki/Cinnabar","verified":true},{"in":["ore"],"verb":"crush","out":"rutile","why":"Ore-dressing sorts the specific mineral you want out of raw rock. For titanium that mineral is rutile — titanium dioxide, and one of only two titanium ores ever worth mining.","src":"https://en.wikipedia.org/wiki/Titanium","supported":true},{"in":["ore","charcoal"],"out":"iron","why":"Charcoal does two jobs in a bloomery: it burns hot enough to reduce the ore, and the carbon monoxide it gives off is what actually strips the oxygen away, leaving a spongy mass of iron called a bloom.","src":"https://en.wikipedia.org/wiki/Bloomery","verified":true},{"in":["ore","fire"],"out":"copper","why":"Copper ore reduces to metal a full 500°C cooler than iron ore does — ordinary fire is hot enough, which is a large part of why copper was the first metal anyone learned to smelt from ore, around 5000 BC.","src":"https://en.wikipedia.org/wiki/Iron","verified":true},{"in":["sand","river"],"out":"gold","why":"Native gold is dense enough that swirling river sand and gravel in water sorts it out on its own — every lighter grain washes away and the gold sinks and stays. That is the whole trick behind a gold pan.","src":"https://en.wikipedia.org/wiki/Gold_panning","verified":true},{"in":["lead"],"verb":"heat","out":"silver","why":"Cupellation: heat lead that carries a little silver in a strong draft of air, and the lead oxidises away as litharge, leaving the silver behind. Slag from doing exactly this has turned up in the Aegean, dating to the 4th millennium BC.","src":"https://en.wikipedia.org/wiki/Cupellation","verified":true},{"in":["ore","wood"],"out":"tin","why":"Tin's ore, cassiterite, is a tin oxide that reduces to metal easily — tin melts at just 232°C, barely above boiling water, so simple fuel is all it ever needed.","src":"https://en.wikipedia.org/wiki/Tin","supported":true},{"in":["ore"],"verb":"heat","out":"lead","why":"Lead's ore, galena, gives up its metal at just 327.5°C — ordinary heat, no charcoal or special furnace required. It was easy enough that prehistoric people in the Near East were already using lead before recorded history began.","src":"https://en.wikipedia.org/wiki/Lead","verified":true,"at":327.5},{"in":["ore","pot"],"out":"zinc","why":"Zinc boils at 907°C, cooler than the temperature that reduces its ore — the oldest confirmed pure zinc anywhere comes from Zawar, Rajasthan, by the 9th century AD, made by distilling zinc vapour off in a sealed vessel and condensing it.","src":"https://en.wikipedia.org/wiki/Zinc","supported":true},{"in":["cinnabar"],"verb":"heat","out":"mercury","why":"Roast cinnabar in air and the mercury boils straight off as vapour, ready to condense back into liquid metal — the only metal that stays liquid at room temperature.","src":"https://en.wikipedia.org/wiki/Mercury_(element)","verified":true},{"in":["ore","spark"],"out":"aluminum","why":"Aluminium is too reactive to smelt like iron or copper — it takes electricity instead. Hall and Héroult worked this out independently in 1886, and that invention made it cheap.","src":"https://en.wikipedia.org/wiki/Hall%E2%80%93H%C3%A9roult_process","verified":true},{"in":["ore","copper"],"out":"nickel","why":"In 1751 Axel Fredrik Cronstedt tried to pull copper out of an ore German miners called 'Kupfernickel' — copper's trickster spirit — at a Swedish cobalt mine, and got a new white metal instead, which he named nickel.","src":"https://en.wikipedia.org/wiki/Nickel","verified":true},{"in":["ore","aluminum"],"out":"chromium","why":"Chromium oxide will not easily give up its oxygen to carbon alone. Mix it with powdered aluminium instead and the aluminium burns for the oxygen so fiercely the reaction runs on its own heat — Cr2O3 + 2Al → Al2O3 + 2Cr — leaving pure chromium metal behind.","src":"https://en.wikipedia.org/wiki/Chromium","verified":true},{"in":["rutile","magnesium"],"out":"titanium","why":"The Kroll process: titanium tetrachloride reduced by liquid magnesium at 800–850°C. Carbon will not do it — heated with carbon, titanium just forms a carbide instead of metal.","src":"https://en.wikipedia.org/wiki/Kroll_process","verified":true},{"in":["gold","river"],"out":"platinum","why":"Platinum is found chemically uncombined, native, in the same alluvial river sands people were already panning for gold — pre-Columbian South Americans mined it from Colombia's Chocó Department, a source still worked today.","src":"https://en.wikipedia.org/wiki/Platinum","verified":true},{"in":["ore","water"],"out":"yellowcake","why":"Yellowcake is powdered uranium concentrate from leach solutions — about half of it made by in-situ leaching, pumping solution straight through the deposit without digging it up.","src":"https://en.wikipedia.org/wiki/Yellowcake","verified":true},{"in":["uranium"],"verb":"wait","out":"helium","why":"Most helium on Earth is not primordial — it is still being made, right now, underground. Uranium decays by throwing off alpha particles, and an alpha particle is just a helium nucleus, trapped in the same rock that made it.","src":"https://en.wikipedia.org/wiki/Helium","verified":true},{"in":["nitrogen","oxygen_gas"],"out":"neon","why":"Neon has never been mined — it is a leftover. Liquefying air to pull out the nitrogen and oxygen everyone actually wants leaves a whisper of neon behind, and that fractional distillation is still how all of it is produced today.","src":"https://en.wikipedia.org/wiki/Neon","verified":true},{"in":["limestone","sea"],"out":"magnesium","why":"Magnesium is the third most abundant element dissolved in seawater. Add calcium hydroxide — lime, from limestone — and the magnesium precipitates out as hydroxide, ready to be reduced.","src":"https://en.wikipedia.org/wiki/Magnesium","verified":true},{"in":["aluminum","limestone"],"out":"calcium","why":"In the US and Canada calcium is produced by reducing lime with aluminium at high temperatures — the same aluminothermic trick that frees chromium.","src":"https://en.wikipedia.org/wiki/Calcium","verified":true},{"in":["salt","spark"],"out":"sodium","why":"Sodium is produced commercially by electrolysis of molten sodium chloride — ordinary salt, melted and split by current, in a process patented in 1924.","src":"https://en.wikipedia.org/wiki/Sodium","verified":true},{"in":["lye","spark"],"out":"potassium","why":"Humphry Davy first isolated potassium in 1807 by electrolysis of molten caustic potash — exactly the lye you get from wood ash, split apart by current.","src":"https://en.wikipedia.org/wiki/Potassium","verified":true},{"in":["potassium","yellowcake"],"out":"uranium","why":"In 1841 Eugène-Melchior Péligot isolated the first sample of uranium metal by heating uranium tetrachloride with potassium — fifty-two years after the element was first found in its ore.","src":"https://en.wikipedia.org/wiki/Uranium","verified":true},{"in":["calcium","rutile"],"out":"titanium","why":"The original 1932 route: William Justin Kroll produced titanium metal by reducing titanium tetrachloride with calcium. It was the first time anyone made the metal outside a laboratory.","src":"https://en.wikipedia.org/wiki/Titanium","verified":true},{"in":["rutile","sodium"],"out":"titanium","why":"Eight years after doing it with calcium, Kroll refined the process with magnesium and with sodium — the version that took his name and still makes most of the world's titanium.","src":"https://en.wikipedia.org/wiki/Titanium","verified":true},{"in":["field","seed"],"out":"flax","why":"Humans first domesticated flax in the Fertile Crescent about 9,000 years ago — though the earliest evidence of using wild flax as a textile is some 30,000 years old.","src":"https://en.wikipedia.org/wiki/Flax","verified":true},{"in":["flax"],"verb":"wait","out":"fibre","why":"Retting: leave the stalks out and let dew collect, and the inner stalk rots away while the outer fibres survive. It takes a month or more and gives the highest quality flax.","src":"https://en.wikipedia.org/wiki/Flax","verified":true},{"in":["fibre"],"verb":"crush","out":"thread","why":"Spinning draws the fibre out, twists it, and winds it on. The oldest known twisted fibre was found in southern France and is thought to be 50,000 to 40,000 BC.","src":"https://en.wikipedia.org/wiki/Spinning_(textiles)","verified":true},{"in":["thread","thread"],"out":"cloth","why":"Two distinct sets of thread interlaced at right angles. The long ones are the warp, the ones crossing them the weft — and how you interlace them is what makes one cloth different from another.","src":"https://en.wikipedia.org/wiki/Weaving","verified":true},{"in":["cloth"],"verb":"cut","out":"clothing","why":"Linen has been made into bed sheets, underclothes and table linen for as long as flax has been woven.","src":"https://en.wikipedia.org/wiki/Flax","verified":true},{"in":["wood"],"verb":"crush","out":"pulp","why":"Paper is created from a pulp dissolved into a slurry. Wood pulp was invented in 1843 and, with the Second Industrial Revolution behind it, made pulpwood paper the dominant kind to this day.","src":"https://en.wikipedia.org/wiki/Paper","verified":true},{"in":["pulp"],"verb":"wait","out":"paper","why":"The slurry is drained and dried into sheets of matted cellulose fibre. The pulp papermaking process is ascribed to Cai Lun, a 2nd-century Han court eunuch.","src":"https://en.wikipedia.org/wiki/Paper","verified":true},{"in":["bee","tree"],"out":"oak_gall","why":"A gall wasp lays a single egg in a developing leaf bud, and the larva's secretions make the oak grow a hard round gall around it. Oak galls have been used to make ink since at least Roman times.","src":"https://en.wikipedia.org/wiki/Oak_apple","verified":true},{"in":["iron","oak_gall"],"out":"ink","why":"Iron salts plus the tannic acid in oak galls. It was the standard ink in Europe for the 1,400 years between the 5th and 19th centuries, and is still sold.","src":"https://en.wikipedia.org/wiki/Iron_gall_ink","verified":true},{"in":["glass","silver"],"out":"mirror","why":"Silver is reduced out of solution onto the back of the glass and stays there as a thin bright layer. Justus von Liebig worked it out in 1835 and improved it in 1856, after which it caught on everywhere.","src":"https://en.wikipedia.org/wiki/Silvering","verified":true},{"in":["spark","uranium"],"out":"enriched_uranium","why":"Natural uranium is 99.27% U-238 and well under 1% of the U-235 that actually fissions. Separating the two is the whole difficulty — weapons grade means 85% or more U-235.","src":"https://en.wikipedia.org/wiki/Enriched_uranium","verified":true},{"in":["enriched_uranium","iron"],"out":"warhead","why":"Critical mass is the minimum fissile material needed to sustain a chain reaction in a given setup. Assemble more than that and, once fission starts, it proceeds at an increasing rate.","src":"https://en.wikipedia.org/wiki/Critical_mass","verified":true},{"in":["ink","paper"],"out":"book","why":"Sheets folded, gathered into quires and sewn through the fold, so both sides of every leaf could be used. Codices drew level with scrolls around 300 AD and had replaced them entirely by the 6th century.","src":"https://en.wikipedia.org/wiki/Codex","verified":true},{"in":["grain","mud"],"out":"pig","why":"Pigs root and dig into the ground to forage — leaves, stems, roots, fruit and flowers, wherever they can find them.","src":"https://en.wikipedia.org/wiki/Pig","verified":true},{"in":["pig"],"out":"meat","why":"Pigs were domesticated independently twice in the Neolithic: around the Tigris in the Near East, and separately in China, starting some 8,000 years ago.","src":"https://en.wikipedia.org/wiki/Pig","verb":"cut","verified":true},{"in":["pig"],"out":"lard","why":"Lard is pig fat rendered until it runs — by steaming it, boiling it, or just dry heat, much the way you would fry bacon.","src":"https://en.wikipedia.org/wiki/Lard","verb":"heat","verified":true},{"in":["grain","pasture"],"out":"sheep","why":"Sheep were domesticated in Mesopotamia between roughly 11,000 and 9,000 BC, and spread from there to the Indus Valley by about 7000 BC. Grassland and a little grain is all it ever took.","src":"https://en.wikipedia.org/wiki/Sheep","verified":true},{"in":["sheep"],"out":"wool","why":"Shearing lifts the whole fleece off in one piece. Hair has little scale and no crimp; wool has both, which is exactly why it felts and spins into yarn.","src":"https://en.wikipedia.org/wiki/Wool","verb":"cut","verified":true},{"in":["pasture","river"],"out":"horse","why":"A horse drinks 38 to 45 litres of water a day on top of grazing. Domestication began on exactly that kind of grassland, in Central Asia, around 4000 BC.","src":"https://en.wikipedia.org/wiki/Horse","supported":true},{"in":["river","seed"],"out":"duck","why":"Mallards are dabbling ducks, feeding in water under a metre deep and picking up seed as they go. They were first domesticated in Southeast Asia at least 4,000 years ago.","src":"https://en.wikipedia.org/wiki/Mallard","verified":true},{"in":["seed","tree"],"out":"turkey","why":"Wild turkeys forage the ground by day and roost well off the ground in trees by night. The south Mexican subspecies was domesticated in Mexico or Mesoamerica.","src":"https://en.wikipedia.org/wiki/Wild_turkey","verified":true},{"in":["meadow","wood"],"out":"wolf","why":"Wolves live in forest, wetland, shrubland, grassland, tundra, pasture, desert and rocky peaks alike, hunting the hooved animals each place has to offer.","src":"https://en.wikipedia.org/wiki/Wolf","verified":true},{"in":["grass","wood"],"out":"deer","why":"Deer are ecotone animals: they live in the transition between forest kept for cover and open prairie or savanna kept for grazing, browsing wherever the two meet.","src":"https://en.wikipedia.org/wiki/Deer","verified":true},{"in":["river","wood"],"out":"bear","why":"Brown bears live mainly in forest, and where a river runs through it during a salmon run they wade in to pin a fish with their claws, or catch it leaping through the air.","src":"https://en.wikipedia.org/wiki/Brown_bear","verified":true},{"in":["pasture","sun"],"out":"kangaroo","why":"Kangaroos occupy the arid and semi-arid centre of Australia. Hopping above 15 km/h holds its energy cost steadier than running does for animals of the same size.","src":"https://en.wikipedia.org/wiki/Kangaroo","verified":true},{"in":["leaf","tree"],"out":"koala","why":"An arboreal marsupial that barely leaves its tree, living on eucalypt leaves. Over 600 species of eucalyptus are on offer; it strongly prefers around 30 of them.","src":"https://en.wikipedia.org/wiki/Koala","verified":true},{"in":["pasture","sand"],"out":"dingo","why":"Descended from domesticated ancestors and feral ever since — the earliest known remains are 3,450 years old. Dingoes range from grassland to true desert, and large kangaroos are their most common prey.","src":"https://en.wikipedia.org/wiki/Dingo","verified":true},{"in":["egg","river"],"out":"platypus","why":"One of only five living monotremes — mammals that lay eggs instead of bearing live young. It digs the streambed with its bill and finds prey by the tiny electric currents their muscles give off.","src":"https://en.wikipedia.org/wiki/Platypus","verified":true},{"in":["pasture","tree"],"out":"elephant","why":"African bush elephants eat woody plants and uproot trees on a scale that alters the land itself, turning woodland into grassland. Each family unit is led by a matriarch.","src":"https://en.wikipedia.org/wiki/African_bush_elephant","verified":true},{"in":["meadow","river"],"out":"lion","why":"Lions prefer grassy plains, savannah and the scrub bordering rivers, hunting the big hooved grazers those places support — wildebeest, zebra, buffalo, giraffe.","src":"https://en.wikipedia.org/wiki/Lion","verified":true},{"in":["pasture","wood"],"out":"zebra","why":"Plains zebras live in treeless grassland and savanna woodland. The best-supported explanation for the stripes is not camouflage or cooling — it is that they stop flies landing.","src":"https://en.wikipedia.org/wiki/Zebra","verified":true},{"in":["meadow","tree"],"out":"giraffe","why":"Giraffes feed up to 4.5 m high, where even a large competitor like a kudu reaches only about 2 m. Its heart must generate roughly double a human's blood pressure to supply the brain.","src":"https://en.wikipedia.org/wiki/Giraffe","verified":true},{"in":["sand","sun"],"out":"camel","why":"First domesticated in the southern Arabian Peninsula around 4000–3000 BC. It tolerates losing more than 30% of its total water content, which is how it thrives in desert.","src":"https://en.wikipedia.org/wiki/Dromedary","verified":true},{"in":["wool"],"verb":"crush","out":"thread","why":"Wool spins where plain hair will not: hair has little scale and no crimp, and barely any ability to bind into yarn. Wool has both, and holds together when it is drawn and twisted.","src":"https://en.wikipedia.org/wiki/Wool","verified":true},{"in":["duck"],"verb":"cut","out":"meat","why":"Mallards were first domesticated in Southeast Asia at least 4,000 years ago, in the Neolithic — and almost every domestic duck breed alive descends from them.","src":"https://en.wikipedia.org/wiki/Mallard","verified":true},{"in":["turkey"],"verb":"cut","out":"meat","why":"The south Mexican wild subspecies was domesticated either in Mexico or by Preclassic peoples in Mesoamerica, and every domestic turkey comes from it.","src":"https://en.wikipedia.org/wiki/Wild_turkey","verified":true},{"in":["flour","lard"],"out":"rubbed_flour","why":"Rubbing fat into plain flour coats the granules so they are less likely to develop gluten — which is exactly what makes the crumbly, short texture. Lard is there for texture; butter, for flavour.","src":"https://en.wikipedia.org/wiki/Shortcrust_pastry","verified":true},{"in":["dna","protein"],"out":"chromatin","why":"DNA does not sit loose. About 146 base pairs at a time wind round a spool of eight histone proteins. That packs it down and controls what can be read.","src":"https://en.wikipedia.org/wiki/Nucleosome","verified":true},{"in":["chromatin"],"out":"chromosome","why":"For most of a cell's life the DNA is loose chromatin. To divide it, the cell winds it down about ten thousand times tighter — and only then, at metaphase, is a chromosome something you can see.","src":"https://en.wikipedia.org/wiki/Chromosome","verb":"crush","verified":true},{"in":["chromatin"],"out":"gene","why":"A gene is not an object, it is a stretch: one length of DNA transcribed to produce RNA. Humans have about 20,000 that end up as protein, and that coding DNA is barely 2% of the genome.","src":"https://en.wikipedia.org/wiki/Gene","verb":"cut","verified":true},{"in":["chromatin","membrane"],"out":"nucleus","why":"Wrap the chromatin in a double membrane and you have a nucleus — nearly the whole genome behind a wall, with transcription on one side and translation on the other. That gap is where regulation lives.","src":"https://en.wikipedia.org/wiki/Cell_nucleus","verified":true},{"in":["protein","protein"],"out":"microtubule","why":"Two globular proteins, alpha and beta tubulin, pair up and stack into a hollow tube 23 to 27 nm across. The cell builds them, tears them down and rebuilds them constantly.","src":"https://en.wikipedia.org/wiki/Microtubule","verified":true},{"in":["membrane","nucleus"],"out":"cell","why":"The nucleus provides a site for transcription segregated from where translation happens, which allows levels of gene regulation no bacterium can manage.","src":"https://en.wikipedia.org/wiki/Cell_nucleus","verified":true},{"in":["enzyme","gene"],"out":"messenger_rna","why":"Transcription copies a gene, not a genome — one stretch of DNA read off into RNA that the ribosome can then translate.","src":"https://en.wikipedia.org/wiki/Gene","verified":true},{"in":["chromosome","microtubule"],"out":"mitosis","why":"The spindle is mostly microtubules and its job is brute mechanical: reach out from opposite ends of the cell, latch onto each chromosome, line them all up, then shorten and pull the copies apart.","src":"https://en.wikipedia.org/wiki/Mitosis","verified":true},{"in":["chromosome"],"out":"meiosis","why":"Replicate the DNA once, then divide twice. Four cells come out, each with one copy of every chromosome instead of two — and on the way the maternal and paternal copies cross over and swap sections.","src":"https://en.wikipedia.org/wiki/Meiosis","verb":"cut","verified":true},{"in":["mitosis"],"out":"cell","why":"Two daughter nuclei, genetically identical, each with chromosomes alike in composition and equal in number to the parent's. Copy, not halve. Most human cells are made this way.","src":"https://en.wikipedia.org/wiki/Mitosis","verb":"wait","verified":true},{"in":["meiosis"],"out":"sperm","why":"Male meiosis splits evenly: one cell in, four sperm out. The spare cytoplasm is stripped off as residual bodies and eaten by the Sertoli cells around them. The testes run this 200 to 300 million times a day.","src":"https://en.wikipedia.org/wiki/Spermatogenesis","verb":"cut","verified":true},{"in":["meiosis"],"out":"ovum","why":"An oocyte enters meiosis before the girl is born, and then stops. In humans that arrest lasts years. It stops a second time at metaphase II, and only ever finishes if a sperm arrives.","src":"https://en.wikipedia.org/wiki/Oogenesis","verb":"wait","verified":true},{"in":["ovum"],"out":"polar_body","why":"Female meiosis divides unequally on purpose. One daughter takes nearly all the cytoplasm and becomes the egg; the polar bodies get their chromosomes and almost no cytoplasm, and frequently die.","src":"https://en.wikipedia.org/wiki/Polar_body","verb":"cut","verified":true},{"in":["ovum","protein"],"out":"egg","why":"A hen's ovum is only the start of an egg. Everything else is added around it on the way down the oviduct — first the white, which is 90% water and 10% protein, then the membranes, then the shell.","src":"https://en.wikipedia.org/wiki/Egg_white","verified":true},{"in":["ovum","sperm"],"out":"zygote","why":"Around 200 sperm out of 200 million reach the ampulla of the fallopian tube. One nucleus fuses with the ovum's, two separate blocks slam shut against every other sperm, and a diploid cell exists that did not before.","src":"https://en.wikipedia.org/wiki/Human_fertilization","verified":true},{"in":["zygote"],"out":"morula","why":"Cleavage is division without growth — the cell count goes up, the total size does not, so every cell is smaller than the last. Four divisions in you have sixteen, packed tightly enough to look like a mulberry.","src":"https://en.wikipedia.org/wiki/Cleavage_(embryo)","verb":"cut","verified":true},{"in":["morula","water"],"out":"blastocyst","why":"The morula seals itself watertight, then its outer cells pump sodium in and water follows by osmosis. The cavity that opens turns a solid ball into a hollow one, 0.1 to 0.2 mm across, of 100 to 200 cells.","src":"https://en.wikipedia.org/wiki/Blastocyst","verified":true},{"in":["blastocyst"],"out":"stem_cell","why":"Embryonic stem cells come from the inner cell mass — the clump inside the hollow ball that becomes the embryo itself. Isolating it destroys the blastocyst, which is where the ethical argument about them starts.","src":"https://en.wikipedia.org/wiki/Embryonic_stem_cell","verb":"cut","verified":true},{"in":["stem_cell"],"out":"tissue","why":"A stem cell can keep dividing without committing to anything, or it can differentiate. Given the right signals it becomes any of the more than 200 cell types in an adult body — all running the same genome.","src":"https://en.wikipedia.org/wiki/Stem_cell","verb":"wait","verified":true},{"in":["blastocyst"],"out":"gastrula","why":"The hollow ball folds in on itself and becomes layered. Ectoderm will be skin and nervous system, endoderm the gut and lungs, mesoderm the heart, bones and muscles. In humans it starts around day fourteen.","src":"https://en.wikipedia.org/wiki/Gastrulation","verb":"wait","verified":true},{"in":["gastrula"],"out":"embryo","why":"Organogenesis runs from about the third week to the eighth, and carries on after that. By the end of it the heart, hands, feet and brain are all present — and all of them only at the beginning of working.","src":"https://en.wikipedia.org/wiki/Human_embryonic_development","verb":"wait","supported":true},{"in":["embryo"],"out":"fetus","why":"At the start of the ninth week the name changes. All the major organs are present — not fully developed, not functional, and some not yet where they will end up. Fetus is simply Latin for offspring.","src":"https://en.wikipedia.org/wiki/Fetus","verb":"wait","verified":true},{"in":["morula"],"out":"blastocyst","why":"Blastocyst formation begins about five days after fertilization, when a fluid-filled cavity opens up inside the morula.","src":"https://en.wikipedia.org/wiki/Blastocyst","verb":"wait","verified":true},{"in":["seed","sun"],"out":"cotton","why":"The fibre is the seed's own wrapping — it grows in a boll around the seeds themselves. The crop wants a long frost-free period and plenty of sunshine, which is why it stays a warm-country plant.","src":"https://en.wikipedia.org/wiki/Cotton","verified":true},{"in":["cotton"],"out":"fibre","why":"Ginning. Teeth on a rotating drum grip the lint and drag it through holes too small for the seeds, which stay behind. By hand it took a labourer about ten hours to clean a single pound of it.","src":"https://en.wikipedia.org/wiki/Cotton_gin","verified":true,"verb":"crush"},{"in":["field","grass"],"out":"maize","why":"A tall stout grass, domesticated once from wild teosinte in southern Mexico about 9,000 years ago — and one that cannot sow itself. Teosinte kernels drop off the cob; maize kernels stay on.","src":"https://en.wikipedia.org/wiki/Maize","verified":true},{"in":["maize"],"out":"popcorn","why":"Water inside the kernel turns to steam and builds to about 930 kPa and 180°C before the hull gives way. The pressure drops all at once and the endosperm expands into an airy foam.","src":"https://en.wikipedia.org/wiki/Popcorn","verified":true,"verb":"heat","at":180},{"in":["grass","salt"],"out":"barley","why":"Barley is more tolerant of soil salinity than other cereals, and relatively tolerant of drought — it crops on ground that beats wheat. It was among the first grains domesticated in the Fertile Crescent, around 9,000 BC.","src":"https://en.wikipedia.org/wiki/Barley","verified":true},{"in":["field","wheat"],"out":"oat","why":"Nobody set out to farm oats. They arrived as a weed in fields of the cereals people meant to grow, and were domesticated second-hand — which is also why they thrive on cool, wet summers other cereals dislike.","src":"https://en.wikipedia.org/wiki/Oat","verified":true},{"in":["field","legume"],"out":"soybean","why":"Domesticated from wild soybean in north-central China between 6,000 and 9,000 years ago. Like other legumes it fixes its own nitrogen using symbiotic Rhizobia bacteria — and the dry seed is 36% protein and 20% oil.","src":"https://en.wikipedia.org/wiki/Soybean","verified":true},{"in":["brine","soybean"],"out":"tofu","why":"The same trick as cheese, on a bean. Salt water curdles soy milk and the curds are pressed into blocks — nigari, the magnesium chloride left once sodium chloride is taken out of seawater, is the classic coagulant.","src":"https://en.wikipedia.org/wiki/Tofu","verified":true},{"in":["flower","legume"],"out":"pea","why":"The pod is a fruit — it develops from the ovary of the pea flower, and the peas are its seeds. One of the oldest domesticated crops there is, with finds from about 10,000 BC in the Near East and Central Asia.","src":"https://en.wikipedia.org/wiki/Pea","verified":true},{"in":["flower","root"],"out":"carrot","why":"A carrot is a taproot loaded with sugar in the plant's first year so it can afford to flower in its second. We eat the savings, before it ever gets to spend them. The orange comes from beta-carotene.","src":"https://en.wikipedia.org/wiki/Carrot","verified":true},{"in":["leaf"],"out":"lettuce","why":"Heat makes lettuce bolt: most varieties grow poorly above 24°C, and a lettuce that runs to flower turns bitter and unsaleable. Keep it cool and it stays a leaf, which is the only form anyone wants it in.","src":"https://en.wikipedia.org/wiki/Lettuce","verified":true,"verb":"chill"},{"in":["field","vine"],"out":"pumpkin","why":"A warm-weather crop that will not start until the soil is at least 15.5°C eight centimetres down, and is usually in the ground by early July. Male and female flowers on the same plant, and bees do the joining.","src":"https://en.wikipedia.org/wiki/Pumpkin","verified":true},{"in":["root","sea"],"out":"beet","why":"Beetroot, sugar beet and chard are all one plant, bred three ways from the sea beet — a wild coastal thing that lives on beaches, saltmarsh drift-lines and sea walls and tolerates high sodium.","src":"https://en.wikipedia.org/wiki/Sea_beet","verified":true},{"in":["fruit","fruit"],"out":"lemon","why":"There is no wild lemon: it is a cross between two other fruits, the citron and the bitter orange. Its juice runs 5–6% citric acid, which is what the sourness is. It reached Europe near southern Italy by the second century AD.","src":"https://en.wikipedia.org/wiki/Lemon","verified":true},{"in":["fruit","root"],"out":"strawberry","why":"The plant barely bothers with seed: it throws out runners, pegs them down until they root, and the new plant is cut free. That is how strawberries were propagated in Europe for centuries before anyone bred them.","src":"https://en.wikipedia.org/wiki/Strawberry","verified":true},{"in":["fruit","leaf"],"out":"banana","why":"The banana plant is the largest herbaceous flowering plant there is — no wood, no trunk, just a pseudostem of rolled-up leaf stalks. The fruit is a berry, and cultivated ones carry no fertile seed.","src":"https://en.wikipedia.org/wiki/Banana","verified":true},{"in":["harvest","tree"],"out":"pear","why":"Summer and autumn pears are climacteric — harvested before they are ripe, still green, and they snap off cleanly when lifted. The ripening happens after the harvest.","src":"https://en.wikipedia.org/wiki/Pear","verified":true},{"in":["tree"],"out":"cherry","why":"Like most temperate-latitude trees, a cherry needs a certain number of chilling hours each year to break dormancy and bloom at all. A mild winter is not a kindness to a cherry tree.","src":"https://en.wikipedia.org/wiki/Cherry","verified":true,"verb":"chill"},{"in":["flower","fruit"],"out":"fig","why":"A fig is a syconium: a hollow fleshy structure lined on the inside with flowers. A single narrow opening at the tip lets the fig wasp Blastophaga psenes crawl in to pollinate them.","src":"https://en.wikipedia.org/wiki/Fig","verified":true},{"in":["fruit","seed"],"out":"coffee","why":"Coffee beans are not beans. They are the seeds of a fruit — the coffee cherry — separated out of the flesh to give green, unroasted beans. The earliest reports of anyone drinking it are among the Sufis of Yemen in the mid-15th century.","src":"https://en.wikipedia.org/wiki/Coffee","verified":true},{"in":["coffee","water"],"out":"brewed_coffee","why":"Roasting is what makes coffee taste of coffee: heat breaks the bean's starches into simple sugars that caramelise and brown. Then grind it, steep it in hot water, and filter the grounds back out.","src":"https://en.wikipedia.org/wiki/Coffee","verified":true},{"in":["fruit","wood"],"out":"cocoa","why":"Unlike most fruiting trees, the cacao pod grows directly from the trunk or a large branch rather than from twigs. Inside are the seeds — 30 to 40 beans to a typical pod.","src":"https://en.wikipedia.org/wiki/Cocoa_bean","verified":true},{"in":["cocoa"],"out":"cocoa_bean","why":"The pods and their pulp are heaped up for several days and left to sweat: the thick pulp liquefies as it ferments. Sweating is what the quality depends on — without it the beans keep a strong, bitter taste.","src":"https://en.wikipedia.org/wiki/Cocoa_bean","verified":true,"verb":"ferment"},{"in":["cocoa_bean"],"out":"chocolate","why":"Roasted, cracked and deshelled into nibs, then ground to a paste. Conching takes the particles under about 20 μm — smaller than the tongue can detect — which is what \"smooth\" actually means. Four hundred beans to the pound.","src":"https://en.wikipedia.org/wiki/Chocolate","verified":true,"verb":"heat"},{"in":["collagen"],"verb":"cut","out":"glycine","why":"Collagen is a quarter to a third of all the protein in a mammal, and about 35% of collagen is glycine — one at almost every third residue. Nothing else in a body is that concentrated a source.","src":"https://en.wikipedia.org/wiki/Collagen","verified":true},{"in":["muscle","nitrogen"],"out":"alanine","why":"The glucose-alanine cycle. Muscle burning amino acids for fuel collects the loose amino groups onto glutamate, hands one to pyruvate to make alanine, and puts that into the blood for the liver to sort out.","src":"https://en.wikipedia.org/wiki/Alanine","verified":true},{"in":["glycine","enzyme"],"out":"serine","why":"Serine hydroxymethyltransferase runs both ways. Normally it cleaves serine into glycine and a spare carbon handed to folate — but with glycine in excess it runs backwards and builds serine instead.","src":"https://en.wikipedia.org/wiki/Serine","verified":true},{"in":["glutamic_acid"],"verb":"wait","out":"proline","why":"Proline is made from glutamate, and it is the only one of the twenty whose nitrogen is a secondary amine — the side chain closes back onto it. Plants pile proline up as a standard response to stress.","src":"https://en.wikipedia.org/wiki/Proline","verified":true},{"in":["phenylalanine","oxygen_gas"],"out":"tyrosine","why":"Phenylalanine hydroxylase is a monooxygenase: it hangs a hydroxyl on the end of phenylalanine's ring and the result is tyrosine. Lacking that one enzyme is what phenylketonuria is.","src":"https://en.wikipedia.org/wiki/Tyrosine","verified":true},{"in":["glutamic_acid","enzyme"],"out":"aspartic_acid","why":"Transamination: aspartate transaminase moves an amino group between glutamate and aspartate, and oxaloacetate is what receives it. That same enzyme is the AST on a liver blood test.","src":"https://en.wikipedia.org/wiki/Aspartic_acid","verified":true},{"in":["amino_acid","nitrogen"],"out":"glutamic_acid","why":"Glutamate is the hub. Transamination of alpha-ketoglutarate makes it, and it then hands its own amino group on to build the others — tissues collect loose nitrogen as glutamate before doing anything else with it.","src":"https://en.wikipedia.org/wiki/Glutamic_acid","verified":true},{"in":["glutamic_acid","nitrogen"],"out":"glutamine","why":"Glutamine synthetase sticks ammonia straight onto glutamate. Free ammonia is toxic and glutamine is not, so this is how nitrogen travels in the blood without doing damage on the way.","src":"https://en.wikipedia.org/wiki/Glutamine","verified":true},{"in":["aspartic_acid","glutamine"],"out":"asparagine","why":"Asparagine synthetase builds it from aspartate, glutamine and ATP: aspartate is the skeleton, glutamine donates the nitrogen for the amide. Heat this with a reducing sugar later and you get acrylamide.","src":"https://en.wikipedia.org/wiki/Asparagine","verified":true},{"in":["glutamic_acid","carbon_dioxide"],"out":"arginine","why":"Glutamate becomes ornithine; ornithine takes on a carbamoyl group built from ammonia and bicarbonate; two steps later, arginine. Arginase then splits it into urea and ornithine and the cycle starts again.","src":"https://en.wikipedia.org/wiki/Arginine","verified":true},{"in":["glucose","enzyme"],"out":"valine","why":"Valine is built from pyruvic acid — sugar, three carbons in — by a run of enzymes that bacteria and plants have and animals do not. That absence is the whole of what essential means.","src":"https://en.wikipedia.org/wiki/Valine","verified":true},{"in":["valine","enzyme"],"out":"leucine","why":"Leucine and valine come off the same line: plants and microbes build leucine from pyruvic acid, and valine synthesis uses the initial part of that same pathway. Animals run neither, so both are essential.","src":"https://en.wikipedia.org/wiki/Leucine","verified":true},{"in":["threonine","methionine"],"out":"isoleucine","why":"In plants isoleucine is assembled from two other amino acids — threonine and methionine. Both of those are essential to you as well, so it is essentials all the way down.","src":"https://en.wikipedia.org/wiki/Isoleucine","verified":true},{"in":["aspartic_acid","phosphorus"],"out":"threonine","why":"Plants and bacteria build it from aspartic acid by way of homoserine, which gets a phosphate hung on it and then knocked off again with the hydroxyl shifted. Animals run none of that, so you have to eat it.","src":"https://en.wikipedia.org/wiki/Threonine","verified":true},{"in":["aspartic_acid","sulfur"],"out":"methionine","why":"The backbone comes from aspartic acid and the sulfur comes from cysteine, along the transsulfuration pathway. Run the trade the other way and methionine's sulfur is what ends up in cysteine.","src":"https://en.wikipedia.org/wiki/Methionine","verified":true},{"in":["legume","enzyme"],"out":"lysine","why":"Lysine is the limiting amino acid in most cereal grains — the essential one present in the smallest quantity — and it is plentiful in pulses. That is the entire nutritional case for eating the two together.","src":"https://en.wikipedia.org/wiki/Lysine","verified":true},{"in":["atp","enzyme"],"out":"histidine","why":"Histidine is the odd one out: the first reaction of its pathway condenses ATP with PRPP, so the molecule the cell spends as currency is also the one it takes apart to build this amino acid's ring.","src":"https://en.wikipedia.org/wiki/Histidine","verified":true},{"in":["glucose"],"verb":"ferment","out":"phenylalanine","why":"Bacteria, fungi, algae and plants build phenylalanine through the shikimate pathway and animals cannot. Industry gets round that by fermenting sugar with E. coli, in bulk, for food uses including aspartame.","src":"https://en.wikipedia.org/wiki/Phenylalanine","verified":true},{"in":["serine","enzyme"],"out":"tryptophan","why":"The last step is tryptophan synthase welding an indole ring onto serine. So the largest of the twenty is one of the smaller ones with a ring bolted on the side.","src":"https://en.wikipedia.org/wiki/Tryptophan","verified":true},{"in":["glycine","proline"],"out":"collagen","verified":true,"why":"The commonest motifs in collagen are glycine-proline-X and glycine-X-hydroxyproline. Glycine sits at almost every third residue and proline fills much of the rest.","src":"https://en.wikipedia.org/wiki/Collagen"},{"in":["alanine","glycine"],"out":"beta_sheet","verified":true,"why":"Silk fibroin is the sequence Gly-Ser-Gly-Ala-Gly-Ala repeated over and over, stacked as antiparallel beta sheets. The high glycine content is what lets the sheets pack that tightly.","src":"https://en.wikipedia.org/wiki/Fibroin"},{"in":["methionine","serine"],"out":"cysteine","verified":true,"why":"In mammals cysteine is assembled out of two other amino acids: methionine supplies the sulfur by way of homocysteine, serine supplies the rest, and cystathionine beta-synthase joins them.","src":"https://en.wikipedia.org/wiki/Cysteine"},{"in":["steam"],"verb":"chill","out":"water","verified":true,"why":"Condensation is the change from gas to liquid, and it is exactly the reverse of vaporisation. Cool a vapour to its saturation limit and it has nowhere to go but back to water.","src":"https://en.wikipedia.org/wiki/Condensation"},{"in":["ice"],"verb":"heat","out":"water","verified":true,"why":"At the melting point the ordering of the molecules in the solid breaks down to a less ordered state, and the solid melts. The temperature stays put while it happens — all the energy goes into the change itself.","src":"https://en.wikipedia.org/wiki/Melting","at":0},{"in":["tempered_clay"],"verb":"heat","at":600,"out":"pot","verified":true,"why":"Earthenware is fired around 600°C — hot enough to turn clay to ceramic for good, and no hotter. Stop here and you have a pot.","src":"https://en.wikipedia.org/wiki/Pottery"},{"in":["limestone"],"verb":"heat","at":900,"out":"quicklime","verified":true,"why":"Limestone calcination runs at 900 to 1,050°C: CaCO3 becomes CaO and the carbon dioxide leaves as gas. What is left is quicklime, and it weighs a great deal less.","src":"https://en.wikipedia.org/wiki/Calcination"},{"in":["quicklime","water"],"out":"mortar","verified":true,"why":"Slaking. Quicklime and water react hard enough to boil the water, and the calcium hydroxide left behind sets slowly in air back into limestone — which is what lime mortar is.","src":"https://en.wikipedia.org/wiki/Calcium_oxide"},{"in":["limestone","ore"],"out":"fluorite","why":"Fluorite is calcium fluoride, and it forms vein deposits in limestone alongside galena and sphalerite — the lead and zinc ores. The name is from fluere, to flow: it was valued as a flux in iron smelting, to thin the slag.","src":"https://en.wikipedia.org/wiki/Fluorite","verified":true},{"in":["sea","plant"],"out":"kelp","why":"Kelp is the sea's answer to a plant and is not a plant at all — a brown alga that grips rock with a holdfast instead of rooting, wants shallow water between 6 and 14°C, and can add half a metre in a day.","src":"https://en.wikipedia.org/wiki/Kelp","verified":true},{"in":["river","sun"],"out":"borax","why":"Borate minerals are water-soluble, so they end up wherever a seasonal lake fills and dries and fills again. Borax was first found in dry lake beds in Tibet, and traded down the Silk Road by the 8th century AD.","src":"https://en.wikipedia.org/wiki/Borax","verified":true},{"in":["brine","spark"],"out":"chlorine","why":"The chloralkali process: run a current through concentrated brine and it splits into three useful things at once — chlorine at one electrode, hydrogen at the other, sodium hydroxide left in the cell. 2NaCl + 2H2O → Cl2 + H2 + 2NaOH.","src":"https://en.wikipedia.org/wiki/Chloralkali_process","verified":true},{"in":["fluorite","spark"],"out":"fluorine","why":"Fluorite is the main source of fluoride and so of fluorine, but getting the element out takes low-temperature electrolysis and nobody managed it until Henri Moissan in 1886. He got the Nobel for it in 1906, two months before he died.","src":"https://en.wikipedia.org/wiki/Fluorine","verified":true},{"in":["brine","chlorine"],"out":"bromine","why":"Bromide sits in seawater at 65 parts per million and in the Dead Sea at 0.4%. Bubble chlorine through the brine and the chlorine takes the electrons — Br− is oxidised to Br2 — and a blast of steam or air carries the bromine off.","src":"https://en.wikipedia.org/wiki/Bromine","verified":true},{"in":["kelp","fire"],"out":"iodine","why":"Kelp was the only commercial source of iodine for a century. Courtois was burning seaweed for saltpetre in 1811, added too much sulfuric acid to the ash, and a cloud of violet vapour came off and settled out as dark crystals.","src":"https://en.wikipedia.org/wiki/Kelp","verified":true},{"in":["sand","carbon"],"out":"silicon","why":"Sand is silicon dioxide. Reduce it carbothermically with coke in an arc furnace — SiO2 + 2 C → Si + 2 CO — and the carbon walks off with the oxygen. Berzelius got there first in 1824, by a different route entirely.","src":"https://en.wikipedia.org/wiki/Silicon","verified":true},{"in":["borax","iron"],"out":"boron","why":"Boron never appears free on Earth. Gay-Lussac and Thénard reduced boric acid with iron at high temperature to get at it — and even that was not really pure boron, which arguably had to wait for Ezekiel Weintraub in 1909.","src":"https://en.wikipedia.org/wiki/Boron","verified":true},{"in":["iron","sulfur"],"out":"arsenic","why":"Arsenopyrite, FeAsS, is the illustrative arsenic mineral — iron, arsenic and sulfur together. Roast it without air and grey arsenic is what you get.","src":"https://en.wikipedia.org/wiki/Arsenic","verified":true},{"in":["copper","spark"],"out":"selenium","why":"Copper is refined by electrolysis, and whatever will not dissolve drops to the bottom of the cell as anode mud. Nearly all the world's selenium is picked out of that mud. Berzelius found it in 1817, in the sludge of a sulfuric acid plant.","src":"https://en.wikipedia.org/wiki/Selenium","verified":true},{"in":["carbon","ore"],"out":"antimony","why":"Roast stibnite to the oxide, then take the oxygen off with carbon: 2 Sb2O3 + 3 C makes 4 Sb and 3 CO2. Lower-grade ore goes through a blast furnace, higher-grade through a reverberatory one.","src":"https://en.wikipedia.org/wiki/Antimony","verified":true},{"in":["ore","silver"],"out":"germanium","why":"Mendeleev left a gap below silicon in 1869 and predicted ekasilicon. In 1886 Clemens Winkler pulled a new element out of argyrodite — a silver ore, Ag8GeS6 — and it fitted the prediction. Germanium made the first transistor in 1948.","src":"https://en.wikipedia.org/wiki/Germanium","verified":true},{"in":["ore","gold"],"out":"tellurium","why":"Tellurium is one of very few elements that bonds to gold in nature — calaverite and sylvanite are gold tellurides. Müller von Reichenstein found it in Transylvanian gold ore in 1782; Klaproth isolated and named it in 1798, for tellus, earth.","src":"https://en.wikipedia.org/wiki/Tellurium","verified":true},{"in":["potassium"],"verb":"wait","out":"argon","why":"Argon-40 is what a potassium-40 atom becomes, and potassium-40 has a half-life of 1.25 billion years. Nearly all the argon in the atmosphere got there that way: decayed out of the crust and let go. It is 0.934% of the air.","src":"https://en.wikipedia.org/wiki/Argon","verified":true},{"in":["oxygen_gas"],"verb":"chill","out":"noble_mix","why":"Krypton and xenon are both taken out of liquid oxygen, and they come off together — what the plant hands you is a mixture, not either gas on its own.","src":"https://en.wikipedia.org/wiki/Xenon","verified":true},{"in":["ore","oxygen_gas"],"out":"pyrolusite","why":"Manganese only settles out as pyrolusite where conditions are oxidising — in hydrothermal veins, and in bogs, where it grows out of the alteration of other manganese minerals. It is the most important manganese ore there is.","src":"https://en.wikipedia.org/wiki/Pyrolusite","verified":true},{"in":["ore","sulfur"],"out":"molybdenite","why":"Molybdenite is a sulfide, and it crystallises out of high-temperature hydrothermal ore deposits — most of the world's supply rides along in porphyry copper bodies rather than in molybdenum mines of its own.","src":"https://en.wikipedia.org/wiki/Molybdenite","verified":true},{"in":["platinum","river"],"out":"osmiridium","why":"Osmiridium turns up in the same platinum-bearing river sands as the platinum itself, in the Urals and in the Americas. It is also how you tell it apart: aqua regia dissolves gold and platinum, and leaves osmiridium sitting there.","src":"https://en.wikipedia.org/wiki/Platinum_group","verified":true},{"in":["pyrolusite","spark"],"out":"manganese","why":"Iron-free manganese metal is not smelted at all. The ore is leached with sulfuric acid and the metal pulled out of that solution by electricity — electrowinning. Smelt it in a blast furnace instead and you get ferromanganese: iron with manganese in it.","src":"https://en.wikipedia.org/wiki/Manganese","verified":true},{"in":["copper","nickel"],"out":"cobalt","why":"Cobalt is almost never the thing being mined. It comes up as a by-product of copper and nickel, which is why its supply rides on whether those two are worth digging — and why the Congolese Copperbelt supplies most of the world's cobalt.","src":"https://en.wikipedia.org/wiki/Cobalt","verified":true},{"in":["ore","hydrogen_gas"],"out":"tungsten","why":"You cannot melt tungsten out of anything — nothing else is that hot. Instead the oxide is heated in hydrogen, which takes the oxygen away as steam and leaves grey tungsten powder: WO3 + 3 H2 → W + 3 H2O.","src":"https://en.wikipedia.org/wiki/Tungsten","verified":true},{"in":["molybdenite","hydrogen_gas"],"out":"molybdenum","why":"Molybdenite is roasted at 700°C to burn the sulfur off as sulfur dioxide, and the trioxide left behind is then reduced in hydrogen: MoO3 + 3 H2 → Mo + 3 H2O. Two steps, because the sulfur has to go first.","src":"https://en.wikipedia.org/wiki/Molybdenum","verified":true},{"in":["iron","ore"],"out":"vanadium","why":"Vanadium mostly is not mined — it is swept up afterwards. Its main source is a vanadium-bearing iron ore, and when that ore is smelted for iron most of the vanadium ends up in the slag, where it is recovered. Ninety per cent of world supply arrives this way.","src":"https://en.wikipedia.org/wiki/Vanadium","verified":true},{"in":["zinc"],"verb":"heat","out":"cadmium","why":"Cadmium sits as a minor component in nearly every zinc ore, and it is never mined for its own sake. Heat the smelted zinc under vacuum and the cadmium — the lower-boiling of the two — distils off first.","src":"https://en.wikipedia.org/wiki/Cadmium","verified":true},{"in":["nickel","platinum"],"out":"palladium","why":"Palladium is not mined on its own. It comes out of nickel–copper deposits alongside platinum, and one Russian nickel company, Norilsk Nickel, accounts for 39% of world production by itself.","src":"https://en.wikipedia.org/wiki/Palladium","verified":true},{"in":["platinum","salt"],"out":"rhodium","why":"Wollaston pulled rhodium out of crude platinum in 1803 and got a rose-coloured sodium salt, sodium hexachlororhodate, which is what the element is named for. Its job now is the third way in a three-way catalytic converter: stripping NOx from exhaust.","src":"https://en.wikipedia.org/wiki/Rhodium","verified":true},{"in":["osmiridium","hydrogen_gas"],"out":"iridium","why":"Iridium comes out of its natural alloy with osmium, and the last step is a reduction: the iridium chloride salt is heated in hydrogen and what is left is metal powder. It is the most corrosion-resistant metal known, and one of the nine rarest in the crust.","src":"https://en.wikipedia.org/wiki/Iridium","verified":true},{"in":["osmiridium"],"verb":"heat","out":"osmium","why":"Heat osmium hard enough in air and it stops being solid: it becomes osmium tetroxide, which sublimes at room temperature. Distil that vapour off, reduce it back, and you have the metal. That compound is also the name — osmē is Greek for smell.","src":"https://en.wikipedia.org/wiki/Osmium_tetroxide","verified":true},{"in":["platinum","sulfur"],"out":"ruthenium","why":"Ruthenium's one natural mineral is laurite, a sulfide, and it turns up wherever the other platinum metals do — the Urals, the Americas, and the nickel ore at Sudbury. Commercially it is a by-product of processing nickel, copper and platinum ore.","src":"https://en.wikipedia.org/wiki/Ruthenium","verified":true},{"in":["molybdenite"],"verb":"heat","out":"rhenium","why":"Rhenium substitutes for molybdenum inside molybdenite, sometimes at a couple of per cent. Roast the ore and the rhenium oxides go up the chimney — which is where it is collected, leached back out of the flue dust. About 80% of supply comes this way.","src":"https://en.wikipedia.org/wiki/Rhenium","verified":true},{"in":["magnesium","zirconium"],"out":"hafnium","why":"All hafnium is a by-product of cleaning zirconium up: fuel cladding needs zirconium with the hafnium out, because hafnium's neutron-capture cross-section is 600 times zirconium's. What comes off is then reduced with magnesium, as the zirconium was.","src":"https://en.wikipedia.org/wik
