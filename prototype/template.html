<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Loam — dirt to dinner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Cutive+Mono&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='26' fill='%23221C14'/%3E%3Cg stroke='%235C4B38' stroke-width='3' fill='none' stroke-linecap='round'%3E%3Cpath d='M28 34 Q44 54 56 66'/%3E%3Cpath d='M50 26 Q54 48 58 64'/%3E%3Cpath d='M70 26 Q66 48 62 64'/%3E%3Cpath d='M92 34 Q76 54 64 66'/%3E%3C/g%3E%3Ccircle cx='28' cy='34' r='8' fill='%239C8A74'/%3E%3Ccircle cx='50' cy='26' r='8' fill='%234E8CB8'/%3E%3Ccircle cx='70' cy='26' r='8' fill='%23E0A526'/%3E%3Ccircle cx='92' cy='34' r='8' fill='%236B8E4E'/%3E%3Crect x='42' y='66' width='36' height='30' rx='9' fill='%23E2703A'/%3E%3C/svg%3E">
<!-- Home-screen support: iOS reads apple-touch-icon specifically (it ignores
     the SVG favicon above for this purpose and shows a plain letter tile
     without one); Android/Chrome reads the manifest. Same brand/icon.svg
     master as the favicon, rendered to real PNGs since apple-touch-icon
     has never reliably accepted SVG. -->
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#221C14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Loam">
<style>
  :root{
    /* Two faces. Neither is on anyone's list of tells, and both were drawn
       for exactly this job: a text serif built for screens, and a real
       typewriter face for labels and numbers. */
    --face-name:"Source Serif 4",Charter,Georgia,"Times New Roman",serif;
    --face-data:"Cutive Mono",ui-monospace,"SF Mono",Menlo,monospace;
__PALETTE_CSS__

    /* The named roles the drawings reach for, whatever their category. */
    --ik:var(--s-ink); --gh:var(--s-rule);
    --ground:var(--s-ground); --discovery:var(--s-discovery);

    /* Interface roles. Every rule in this stylesheet goes through these, so a
       theme is a redefinition of eleven values and nothing else. */
    --cream:var(--s-ground);
    --ink:var(--s-ink);
    --ink-soft:var(--s-inkQuiet);
    --card:var(--s-panel);
    --line:var(--s-rule);
    /* Two warm colours, and the difference between them carries meaning.
       --orange is the interface accent: hover, focus, the current thing.
       --discovery is the only high-chroma colour in the game and appears at
       exactly one moment — when something new exists. If it is used for a
       button, it stops meaning anything. */
    --orange:var(--s-accent);
    --mustard:var(--c-grain-bs);
    --avocado:var(--c-plant-bs);
    --brick:var(--c-fire-bs);
    --teal:var(--c-molecule-bs);
    --raise:0 6px 18px -8px rgba(0,0,0,.75);
    --surface:var(--s-panel);          /* raised chrome: header, sidebar, buttons */
    --on-accent:var(--s-ground);       /* text that sits on a filled accent */
    --shade:0,0,0;                     /* the r,g,b every shadow is mixed from */
  }

__CATEGORY_CSS__

  /* ── themes ───────────────────────────────────────────────────────────
     The geometry is drawn once. A theme decides what a role looks like.  */

  /* Two independent questions, and they used to be one control.
     HOW THE DRAWINGS ARE FILLED is `t-manual` — the same drawings, unfilled,
     ink on paper. WHETHER THE INTERFACE IS LIGHT OR DARK is `lt`. Picking the
     unfilled drawings used to drag the whole interface light with it, and
     there was no way to have one without the other. */
  body.lt{
    --cream:var(--s-paper);
    --discovery:#B4600A;
    --ink:var(--s-paperInk);
    --ink-soft:#7A6A52;
    --card:#EFE0C4;
    --line:#CDBB99;
    --ik:var(--s-paperInk);
    --gh:#A8967A;
    --ground:var(--s-paper);
    --raise:0 2px 0 rgba(var(--shade),.14);
    --surface:#FBF2DE;
    --on-accent:#FFF8EA;
    --shade:43,33,24;
  }
  body.t-manual .art [data-f]{fill:none;stroke:var(--s-paperInk);stroke-width:1.5;
                              stroke-linejoin:round;stroke-linecap:round}
  body.t-manual .art [data-s]{stroke:var(--s-paperInk)}

  /* ── grounds ──────────────────────────────────────────────────────────
     Background only. Any ground works under either theme.               */
  body{background-attachment:fixed}

  body.g-tray,.gsw.g-tray{background:
      radial-gradient(ellipse at 50% -10%, #33220F 0%, transparent 62%),
      var(--s-ground);}

  body.g-paper,.gsw.g-paper{background:
      radial-gradient(ellipse at 50% 0%, #FFF6E6 0%, transparent 60%),
      var(--s-paper);}

  body.g-graph,.gsw.g-graph{background:
      linear-gradient(var(--line) 1px, transparent 1px) 0 0/26px 26px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/26px 26px,
      var(--cream);}

  /* Deep — the molecular tier's ground. Cold, and very slightly starred. */
  body.g-deep,.gsw.g-deep{background:
      radial-gradient(1.4px 1.4px at 18% 22%, rgba(210,228,240,.55) 50%, transparent 51%) 0 0/180px 140px,
      radial-gradient(1.2px 1.2px at 68% 64%, rgba(190,214,232,.42) 50%, transparent 51%) 0 0/210px 170px,
      radial-gradient(1.8px 1.8px at 42% 82%, rgba(230,240,250,.32) 50%, transparent 51%) 0 0/260px 220px,
      radial-gradient(ellipse at 30% 8%, #16243A 0%, transparent 58%),
      radial-gradient(ellipse at 78% 88%, #101C2E 0%, transparent 60%),
      #080D16;}
  body.g-deep{--cream:#080D16;}

  /* Fluid — slow-moving liquid. Motion is the point, so it yields to
     prefers-reduced-motion rather than being decoration that cannot stop. */
  @keyframes drift{
    0%  {background-position:0% 40%, 100% 60%, 50% 50%}
    50% {background-position:60% 55%, 30% 35%, 50% 50%}
    100%{background-position:0% 40%, 100% 60%, 50% 50%}
  }
  body.g-fluid,.gsw.g-fluid{
    background:
      radial-gradient(ellipse 70% 50% at 20% 40%, color-mix(in srgb, var(--c-water-bs) 42%, transparent) 0%, transparent 70%),
      radial-gradient(ellipse 60% 45% at 80% 60%, color-mix(in srgb, var(--c-molecule-lo) 46%, transparent) 0%, transparent 70%),
      var(--s-ground);
    background-size:180% 180%, 200% 200%, 100% 100%;
    animation:drift 44s ease-in-out infinite;
  }
  @media (prefers-reduced-motion:reduce){ body.g-fluid{animation:none} }

  /* Profile — the ground *is* a soil profile, O over A over B over C. */
  body.g-profile,.gsw.g-profile{background:linear-gradient(
      to bottom,
      var(--c-mineral-hi) 0%,  var(--c-mineral-hi) 9%,
      var(--c-mineral-bs) 9%,  var(--c-mineral-bs) 30%,
      var(--c-mineral-lo) 30%, var(--c-mineral-lo) 62%,
      var(--s-ground) 62%,     var(--s-ground) 100%);}
  body.g-profile{--cream:var(--c-mineral-lo);}

  /* Void — nothing at all. For screenshots, and for anyone who wants quiet. */
  body.g-void,.gsw.g-void{background:var(--cream);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* Any element that also carries a class setting its own `display` (.cardrow,
     flex containers, etc.) silently wins over the browser's built-in
     [hidden]{display:none} — author CSS beats the UA stylesheet regardless of
     specificity. Without this, setting .hidden = true in JS changes the DOM
     attribute but the element keeps rendering anyway. Real bug, found live:
     the barcode sheet's camera/photo row stayed visible on a browser without
     BarcodeDetector even though the code correctly left it `hidden`. */
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    font:400 15px/1.5 var(--face-name);
    color:var(--ink);
    /* The default ground, restated here so there is no flash before prefs load. */
    background:radial-gradient(ellipse at 50% -10%, #33220F 0%, transparent 62%), var(--s-ground);
    display:flex;flex-direction:column;user-select:none;
  }
  header{
    display:flex;align-items:center;gap:14px;padding:10px 16px;
    border-bottom:2px solid var(--line);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(8px);flex:none;
  }
  h1{font:700 17px/1 var(--face-name);margin:0;letter-spacing:-.2px}
  h1 span{color:var(--orange)}
  .mark{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;flex:none}
  .mark svg{width:26px;height:26px;border-radius:7px;flex:none;display:block}
  .goal{
    font-size:12.5px;color:var(--ink-soft);background:var(--surface);border:1px solid var(--line);
    border-radius:4px;padding:5px 12px;
  }
  .goal b{color:var(--brick)}
  .goal{cursor:pointer;display:flex;align-items:center;gap:7px}
  /* The goal chip is a rung now, not a destination: what is next, and how far.
     The distance is the honest part — it comes from the graph, not from a
     difficulty setting someone chose. */
  .goal .glab{
    font:700 8.5px/1 var(--face-data);letter-spacing:.9px;text-transform:uppercase;
    color:var(--ink-soft);opacity:.75;
  }
  .goal .gsteps{
    font:700 9.5px/1 var(--face-data);color:var(--ink-soft);
    padding:2px 6px;border-radius:99px;background:rgba(var(--shade),.14);
    font-variant-numeric:tabular-nums;
  }
  #score{cursor:pointer}
  #score .sc{font-variant-numeric:tabular-nums}
  @media(max-width:900px){ #score{display:none} }
  .goal:hover{border-color:var(--orange)}
  .goal .ask{
    font-style:normal;font:800 9px var(--face-name);color:var(--on-accent);background:var(--orange);
    border-radius:99px;min-width:14px;height:14px;line-height:14px;text-align:center;
    display:inline-block;margin-left:5px;
  }
  .spacer{flex:1}
  .count{font:700 13px var(--face-name);color:var(--avocado)}
  .count.free{color:var(--on-accent);background:var(--teal);border-color:var(--teal)}
  /* The score: not a stray fraction lost among header buttons, but a number
     with a name, the way a scoreboard reads. */
  #count{
    display:flex;align-items:baseline;gap:5px;font:800 15px var(--face-name);
    padding:6px 12px;background:color-mix(in srgb,var(--avocado) 12%,var(--surface));
    border-color:color-mix(in srgb,var(--avocado) 40%,var(--line));
  }
  #count .sc{font-size:17px}
  #count .lbl{font:600 10px var(--face-name);letter-spacing:.4px;color:var(--ink-soft);text-transform:uppercase}
  #count.free .lbl{color:var(--on-accent)}
  button{
    font:600 13px var(--face-name);color:var(--ink);cursor:pointer;
    background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:6px 13px;
  }
  button:active{transform:translateY(1px)}
  main{flex:1;display:flex;min-height:0;position:relative}
  #board{flex:1;position:relative;overflow:hidden;touch-action:none}
  /* the canvas: an unbounded world you pan and zoom, not a fixed bench */
  #world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  #links{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
  #links path{fill:none;stroke:var(--line);stroke-width:2.5;stroke-linecap:round}
  #links path.made{stroke:var(--avocado);stroke-width:2.5;opacity:.42}
  #links .mote{opacity:.9;filter:drop-shadow(0 0 3px currentColor)}
  @keyframes draw{from{stroke-dashoffset:var(--len,400)}to{stroke-dashoffset:0}}
  #links path.fresh{
    stroke-dasharray:var(--len,400);animation:draw .45s cubic-bezier(.3,.8,.4,1) forwards;
    stroke:var(--discovery);stroke-width:3;opacity:.85;
  }
  #zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:5px;z-index:6;
        transition:bottom .18s}
  /* Same cluster, same reasoning, mirrored to the left — scanning is
     something you do TO the bench, same standing as zoom/tidy/the table. */
  #scanTools{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:5px;z-index:6;
        transition:bottom .18s}
  /* The dock is opaque and sits on the bottom of the board, so the zoom
     cluster has to climb on top of it rather than hide behind it. */
  body.pt-on #zoom{bottom:calc(var(--pth,370px) + 12px)}
  body.pt-on #scanTools{bottom:calc(var(--pth,370px) + 12px)}
  #zoom button, #scanTools button{
    width:32px;height:32px;padding:0;font:700 15px var(--face-name);border-radius:10px;
    background:color-mix(in srgb,var(--surface) 94%,transparent);
  }
  #zoom button.on{border-color:var(--orange);color:var(--orange)}
  #board{cursor:grab;touch-action:none;overscroll-behavior:contain}
  #board.panning{cursor:grabbing}
  /* The opening cue. Pointer-events none throughout: it can never be in the way,
     which is the entire reason it is not a dialog. */
  #intro{position:absolute;inset:0;z-index:5;pointer-events:none;
         transition:opacity .5s ease;}
  #intro.gone{opacity:0}
  #introArc{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  #introArc path{
    fill:none;stroke:var(--orange);stroke-width:2;stroke-linecap:round;
    stroke-dasharray:5 7;opacity:.85;
    animation:crawl 1.1s linear infinite;
  }
  @keyframes crawl{to{stroke-dashoffset:-24}}
  @media (prefers-reduced-motion:reduce){ #introArc path{animation:none} }
  #introSay{
    position:absolute;transform:translateX(-50%);
    margin:0;padding:7px 14px;white-space:nowrap;
    max-width:calc(100vw - 28px);
    font:400 13px/1.35 var(--face-name);color:var(--ink);
    background:color-mix(in srgb,var(--card) 92%,transparent);
    border:1px solid var(--line);border-radius:3px;
    box-shadow:var(--raise);
  }
  #introSay b{font-weight:600}
  #introSay i{font-style:normal;display:block;margin-top:2px;
              font:400 10px/1.3 var(--face-data);letter-spacing:.06em;
              text-transform:uppercase;color:var(--ink-soft)}
  aside{
    width:var(--asw,238px);flex:none;border-left:2px solid var(--line);background:color-mix(in srgb,var(--surface) 88%,transparent);
    overflow-y:auto;padding:10px;
  }
  /* Straddles the seam so the drag target is exactly where the eye expects
     one — width tracks the same --asw the pane itself uses, so it rides
     along automatically as the pane grows or shrinks, no reflow needed. */
  #asideGrab{
    position:absolute;top:0;bottom:0;right:var(--asw,238px);width:11px;
    transform:translateX(50%);cursor:ew-resize;z-index:5;touch-action:none;
  }
  #asideGrab::after{
    content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:4px;height:44px;border-radius:99px;background:var(--line);
  }
  #asideGrab:hover::after{background:var(--orange)}
  @media(max-width:720px){ #asideGrab{display:none} }
  aside h2{
    font:700 10.5px/1 var(--face-name);letter-spacing:.9px;text-transform:uppercase;
    color:var(--ink-soft);margin:12px 4px 7px;
  }
  aside h2:first-child{margin-top:2px}
  .shelf{display:flex;flex-wrap:wrap;gap:5px}
  /* aside scrolls (overflow-y:auto above), so on touch a drag-out gesture
     that starts on a chip loses the race to the browser's own scroll
     recognizer, which fires pointercancel before shelfDrag ever sees enough
     movement to register — the drag dies silently. Chips are always meant
     to be picked up, never scrolled past, so they opt out of that race. */
  .shelf .chip{touch-action:none}
  /* ── the specimen card ────────────────────────────────────────────────
     Not a pill. A fixed portrait footprint, so a rock and a cake occupy the
     same frame and are told apart by what is *in* it — which is the whole
     argument for leaving emoji behind. Everything under the drawing is
     rendered from data we already hold. */
  .chip{
    display:inline-flex;flex-direction:column;align-items:center;gap:0;
    width:var(--cw,84px);padding:8px 5px 6px;background:var(--card);
    border:1px solid var(--line);border-radius:3px;
    font:500 11px/1.25 var(--face-name);white-space:normal;text-align:center;cursor:grab;
    box-shadow:var(--raise);position:relative;
  }
  .chip .art{width:50px;height:50px;display:block;flex:none}
  .chip .n{
    display:flex;align-items:center;justify-content:center;
    min-height:2.4em;margin-top:4px;letter-spacing:.055em;text-transform:uppercase;
    font:600 9.5px/1.2 var(--face-name);color:var(--ink);
    overflow-wrap:break-word;hyphens:auto;
  }
  /* A long single word (SOURDOUGH STARTER, SPAGHETTI) cannot be broken without
     looking like a mistake, so it gets smaller instead of getting chopped. */
  .chip .n.long{font-size:8.4px;letter-spacing:.02em}
  .chip .n.vlong{font-size:7.4px;letter-spacing:0}
  /* The category rule. Colour is never the only signal — the accession line
     below carries the same information as text. */
  /* The category rule. On the dark tray a mid-value chip disappears into the
     card, so the rule takes the lighter chip from the same hue page; on paper
     it takes the base. Either way it is a Munsell colour, and either way the
     accession line below says the same thing in words. */
  .chip .rl{display:block;width:24px;height:2px;margin:5px auto 3px;border-radius:2px;
            background:var(--fam-rule,var(--fam))}
  .chip .ac{
    display:block;font:400 7.5px/1.2 var(--face-data);letter-spacing:.07em;
    color:var(--ink-soft);font-variant-numeric:tabular-nums;
  }
  .chip.board{--cw:94px}
  .chip.board .art{width:60px;height:60px}
  /* A compo-ghost's glyph — a compound's hexagon, or a leaf atom's real
     periodic-table tile, centred in the same .art slot every other card's
     drawing fills. */
  .chip.board .art.compoatom{display:flex;align-items:center;justify-content:center}
  .chip.board .art.compoatom .atom{width:36px;height:36px}
  .chip.board .art.compoatom .atom .sym{font-size:14px}
  .chip.board .art.compoatom .atom .z{font-size:8px}
  .chip.board .n{font-size:10px}
  .chip.board .ac{font-size:8px}
  /* Shelf chips are scanned, not read: drawing and name only. The shelf is
     always pills, independent of whatever density the canvas is set to —
     "how much room each thing takes" is a canvas question; a scannable list
     of 400-odd names is a different problem with one right answer. Sized to
     its own content rather than a fixed --cw, so short names share a row the
     way tags do, instead of every pill paying for the widest name. */
  aside .chip{
    --cw:auto;width:auto;flex-direction:row;align-items:center;justify-content:flex-start;
    padding:4px 9px 4px 5px;border-radius:99px;gap:6px;
  }
  aside .chip .art{width:18px;height:18px;flex:none}
  aside .chip .n{
    display:flex;align-items:center;min-height:0;margin:0;text-align:left;
    text-transform:none;letter-spacing:0;font-size:10px;white-space:nowrap;
  }
  aside .chip .n.long,aside .chip .n.vlong{font-size:9px}
  aside .chip .rl,aside .chip .ac{display:none}

  /* The "what is this" button. Quiet until you go looking for it, because the
     board is a workbench and not a form — but always in the same place, so
     once you have found it once you never have to hunt again. */
  .chip .info{
    position:absolute;top:3px;right:4px;width:15px;height:15px;
    display:flex;align-items:center;justify-content:center;border-radius:50%;
    font:italic 700 10px/1 var(--face-name);color:var(--ink-soft);
    background:rgba(var(--shade),.16);border:1px solid transparent;
    opacity:0;transition:opacity .14s,color .14s,border-color .14s;
    cursor:help;z-index:4;
  }
  .chip.board:hover .info,.chip.board:focus-within .info{opacity:.55}
  .chip .info:hover{opacity:1;color:var(--orange);border-color:var(--orange)}
  /* No hover on a touch screen, so it simply lives there, faintly. */
  @media (hover:none){ .chip.board .info{opacity:.4} }
  /* A pill has no corner to spare; long-press covers it there. */
  body.d-pill .chip.board .info{display:none}
  aside .chip .info{
    position:static;opacity:.42;margin-left:1px;flex:none;
    width:16px;height:16px;background:none;
  }
  aside .chip:hover .info{opacity:.8}

  /* The sprinkle control — bottom-right on the bench, same quiet-until-
     sought language as .info's top-right, so the two read as a pair rather
     than competing for the same corner. Grey and easy to miss until it's
     armed, at which point it (and the rest of the card, via .sprinkling on
     the parent) takes the same breathing glow. */
  .chip .sprinkle-btn{
    position:absolute;bottom:3px;right:4px;width:15px;height:15px;
    display:flex;align-items:center;justify-content:center;border-radius:50%;
    font:700 11px/1 var(--face-name);color:var(--ink-soft);
    background:rgba(var(--shade),.16);border:1px solid transparent;
    opacity:0;transition:opacity .14s,color .14s,border-color .14s,background .14s;
    cursor:pointer;z-index:4;
  }
  .chip.board:hover .sprinkle-btn,.chip.board:focus-within .sprinkle-btn{opacity:.55}
  .chip .sprinkle-btn:hover{opacity:1;color:var(--orange);border-color:var(--orange)}
  @media (hover:none){ .chip.board .sprinkle-btn{opacity:.4} }
  body.d-pill .chip.board .sprinkle-btn{display:none}
  .chip.sprinkling .sprinkle-btn{opacity:1;color:var(--on-accent);background:var(--orange);border-color:var(--orange)}
  aside .chip .sprinkle-btn{
    position:static;opacity:.42;margin-left:1px;flex:none;
    width:16px;height:16px;background:none;
  }
  aside .chip:hover .sprinkle-btn{opacity:.8}
  aside .chip.sprinkling .sprinkle-btn{opacity:1;color:var(--orange);background:none}

  /* ── the mark on a thing that can hurt you ─────────────────────────────
     Loud enough to be seen without looking for it, quiet enough that a shelf
     of seventy-eight of them is not a wall of alarm. Acute throbs, because
     "this can hurt you fast" is the one worth interrupting for; the rest sit
     still and simply state themselves. It is never advice and never a
     ranking of how bad a thing is — it says which kind of harm, and the
     card behind it says the rest, with a source. */
  .chip .warn{
    position:absolute;top:3px;left:4px;width:14px;height:14px;
    display:flex;align-items:center;justify-content:center;border-radius:4px;
    font:800 10px/1 var(--face-data);z-index:4;cursor:help;
    color:var(--on-accent);
  }
  .chip .warn.sev-acute     {background:var(--brick)}
  .chip .warn.sev-contact   {background:var(--mustard);color:var(--ink)}
  .chip .warn.sev-cumulative{background:color-mix(in srgb,var(--mustard) 72%,var(--ink));color:var(--cream)}
  .chip .warn.sev-conditional{background:color-mix(in srgb,var(--avocado) 78%,var(--ink))}
  @keyframes warnThrob{
    0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--brick) 65%,transparent)}
    55%    {box-shadow:0 0 0 5px color-mix(in srgb,var(--brick) 0%,transparent)}
  }
  .chip.board .warn.sev-acute{animation:warnThrob 2.4s ease-out infinite}
  @media (prefers-reduced-motion:reduce){ .chip.board .warn.sev-acute{animation:none} }
  /* Radioactive: its own colour (teal, unused elsewhere in the hazard tier
     scheme, so it never reads as "worse" or "milder" than brick/mustard —
     just different in kind). It pulses on the board the same way sev-acute
     does and for the same reason (below): the mark itself already says
     "decays"; the board — where you're looking at one or a few things at a
     time — is where a literal pulse reads as that fact instead of noise.
     ("can we pulse these?" — found live.) */
  .chip .warn.radioactive{background:var(--teal);color:var(--on-accent)}
  /* The health-hazard mark is a drawn glyph, not a character, so it needs a
     box to sit in rather than a font size. Purple keeps it distinct from the
     teal radioactive badge and from every severity colour. */
  .chip .warn.carcinogen{background:var(--plum,#6B4E71);color:var(--on-accent);padding:0}
  .chip .warn.carcinogen svg{width:100%;height:100%;display:block}
  .chip .warn.carcinogen svg *{stroke:currentColor!important;fill:none!important}
  .chip .warn.biohazard{background:var(--avocado);color:var(--ink)}
  /* Everything hazardous on a thing's route, collapsed by default — it is
     reference, not an interruption, and most routes have nothing on them. */
  .upstream{margin:14px 0;border:1px solid var(--rule,rgba(0,0,0,.14));border-radius:8px;background:var(--card)}
  .upstream>summary{cursor:pointer;padding:10px 14px;font-weight:600;list-style:none}
  .upstream>summary::-webkit-details-marker{display:none}
  .upstream>summary::before{content:'▸ ';opacity:.55}
  .upstream[open]>summary::before{content:'▾ '}
  .upstream .upnote{margin:0 14px 8px;font-size:12px;opacity:.62}
  .uprow{display:flex;gap:10px;padding:10px 14px;border-top:1px solid var(--rule,rgba(0,0,0,.1))}
  .uprow b{display:block;font-size:14px}
  .uprow p{margin:4px 0 0;font-size:13px;opacity:.8;line-height:1.45}
  .upfrom{font-size:11.5px;opacity:.6}
  .hzm{flex:0 0 22px;height:22px;border-radius:5px;display:grid;place-items:center;font-size:13px}
  .hzm.radioactive{background:var(--teal);color:var(--on-accent)}
  .hzm.carcinogen{background:var(--plum,#6B4E71);color:var(--on-accent);padding:2px}
  .hzm.carcinogen svg{width:100%;height:100%}
  .hzm.carcinogen svg *{stroke:currentColor!important;fill:none!important}
  .hzm.biohazard{background:var(--avocado);color:var(--ink)}
  .hzm.sev-acute{background:var(--brick);color:var(--cream)}
  .hzm.sev-contact{background:var(--mustard);color:var(--ink)}
  .hzm.sev-cumulative{background:color-mix(in srgb,var(--mustard) 72%,var(--ink));color:var(--cream)}
  .hzm.sev-conditional{background:color-mix(in srgb,var(--avocado) 78%,var(--ink));color:var(--cream)}
  @keyframes radioactivePulse{
    0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--teal) 60%,transparent)}
    50%    {box-shadow:0 0 0 4px color-mix(in srgb,var(--teal) 0%,transparent)}
  }
  .chip.board .warn.radioactive{animation:radioactivePulse 1.7s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){ .chip.board .warn.radioactive{animation:none} }
  /* A pill has no corner to spare on the left; the shelf keeps the mark but
     drops the pulse, because a scrolling list of them would be a strobe. */
  body.d-pill .chip.board .warn{display:none}
  aside .chip .warn{position:static;order:-1;flex:none;width:13px;height:13px;animation:none}

  /* The caution panel itself, banded by the same four tiers. */
  .caution.sev-acute{border-left:3px solid var(--brick)}
  .caution.sev-contact{border-left:3px solid var(--mustard)}
  .caution.sev-cumulative{border-left:3px solid color-mix(in srgb,var(--mustard) 72%,var(--ink))}
  .caution.sev-conditional{border-left:3px solid color-mix(in srgb,var(--avocado) 78%,var(--ink))}

  /* ── density: half card ─────────────────────────────────────────────────
     The user's own sketch: the drawing floats free on the tray with no frame
     around it, and only the name sits in a box. :not(.cooking):not(.target)
     guards every rule that touches background/border/padding, because both of
     those states repaint the chip completely on their own and must keep doing
     so regardless of density — a card mid-ferment still needs its ring. */
  body.d-half .chip.board:not(.cooking):not(.target){
    --cw:66px;background:transparent;border:none;box-shadow:none;padding:0;gap:3px;
  }
  body.d-half .chip.board .art{
    width:44px;height:44px;
    filter:drop-shadow(0 3px 7px rgba(var(--shade),.6));
  }
  body.d-half .chip.board .n{
    min-height:0;margin-top:0;padding:3px 7px;background:var(--card);
    border:1px solid var(--line);border-radius:3px;font-size:8.2px;
  }
  body.d-half .chip.board .n.long{font-size:7.3px}
  body.d-half .chip.board .n.vlong{font-size:6.6px}
  body.d-half .chip.board .rl,
  body.d-half .chip.board .ac{display:none}

  /* ── density: pill ────────────────────────────────────────────────────
     The genre's own shape, at last let back in — but the icon is still a
     drawing, never an emoji, and the footprint is a fixed size like every
     other density so the bench-packing math above never has to know which
     mode it is looking at. */
  body.d-pill .chip.board:not(.cooking):not(.target){
    --cw:88px;flex-direction:row;align-items:center;justify-content:flex-start;
    gap:6px;padding:4px 9px 4px 5px;border-radius:99px;
  }
  body.d-pill .chip.board .art{width:21px;height:21px;flex:none}
  body.d-pill .chip.board .n{
    /* Block put the text at the TOP of the reserved two-line box, so a short
       one-line name like "Stone" sat high above the icon's own vertical
       centre instead of level with it. Flex centres whatever text is actually
       there — one line or two — within that same reserved height. Reserving
       only ~one line (not two) is what actually makes this read as a pill
       instead of a card with rounded corners — most names fit on one line
       anyway, and a 2-line name just grows the pill a little rather than
       every pill paying for the tallest possible name. */
    display:flex;align-items:center;justify-content:flex-start;
    min-height:1.25em;margin:0;text-align:left;text-transform:none;
    letter-spacing:0;font-size:9.5px;line-height:1.15;
  }
  body.d-pill .chip.board .n.long{font-size:8.6px}
  body.d-pill .chip.board .n.vlong{font-size:7.8px}
  body.d-pill .chip.board .rl,
  body.d-pill .chip.board .ac{display:none}

  /* An inline drawing, sized in place of the emoji it replaced. */
  .gl{display:inline-block;width:var(--g,20px);height:var(--g,20px);vertical-align:-.22em}
  .gl .art{width:100%;height:100%;display:block}
  /* Folklore is marked by an absence, not a colour: no accession, no source. */
  .chip.folk .ac{opacity:.5}
  .chip.folk{border-style:dashed}
  .chip.spent{opacity:.42}
  /* A chip mid-process: a ring fills as it rests, and it cannot be dragged.
     The border-box/padding-box trick only separates a "ring" from the card's
     interior when the border is actually thick enough to draw one — at the
     base card's 1px border, border-box and padding-box are practically the
     same rectangle, so the conic-gradient (painted on top, per CSS background
     layering) covered the ENTIRE face as a pie-wedge instead of a thin rim.
     box-sizing:border-box means widening the border here costs nothing: the
     outer footprint — and cardSize()'s measurement of it — is unaffected. */
  .chip.board.cooking{
    cursor:default;
    border-width:4px;
    background:
      conic-gradient(var(--teal) var(--p,0%), transparent 0) border-box,
      var(--card) padding-box;
    border-color:transparent;padding:6px 12px 6px 8px;
  }
  .chip.board.cooking::after{
    content:attr(data-verb);position:absolute;top:-7px;right:-6px;
    font:400 8px/1 var(--face-data);letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink);background:var(--card);border:1px solid var(--line);
    border-radius:2px;padding:2px 5px;
  }
  .chip.board.cooking .n{display:none}
  .chip.board.hidden{display:none}
  .chip.board.folded{border-style:dashed}
  .chip.board.folded::after{
    content:attr(data-fold);position:absolute;top:-8px;right:-7px;
    font:800 9.5px var(--face-name);color:var(--on-accent);background:var(--fam,var(--ink-soft));
    border-radius:99px;padding:2px 6px;box-shadow:0 1px 3px rgba(var(--shade),.3);
  }
  .chip.board.folded{border-style:solid}
  .chip.board.folded:not([data-fold=""])::after{content:attr(data-fold)}
  /* Systems thinking: what a removed element takes with it. Grayscale reads as
     "drained of life" in both themes without a literal colour that would only
     work in one of them — .starved is the same treatment, just held back so
     "still standing, weaker" reads differently from "gone". */
  .chip.board.decayed{filter:grayscale(1);opacity:.4;transition:filter .5s ease,opacity .5s ease}
  .chip.board.starved{filter:grayscale(.65);opacity:.72;transition:filter .5s ease,opacity .5s ease}
  .chip.board.decay-root{outline:2px dashed var(--brick);outline-offset:3px}
  .chip.board.decay-root::before{
    content:'🥀';position:absolute;top:-9px;left:-8px;font-size:12px;line-height:1;
    filter:none;opacity:1;background:var(--card);border-radius:99px;padding:1px 4px;
    box-shadow:0 1px 3px rgba(var(--shade),.3);
  }
  #links path.made.link-decayed{stroke:var(--ink-soft);opacity:.14}
  #links path.made.link-starved{stroke:var(--ink-soft);opacity:.28}
  @keyframes ripple{
    from{transform:translate(-50%,-50%) scale(.25);opacity:.75}
    to{transform:translate(-50%,-50%) scale(2.6);opacity:0}
  }
  .ring{
    position:absolute;width:96px;height:96px;border-radius:99px;pointer-events:none;
    border:2.5px solid var(--discovery);animation:ripple .6s cubic-bezier(.2,.7,.3,1) forwards;
  }
  /* A merge's real physical-process category (tools/reactions.mjs, read off
     the recipe's own why text), given its own colour and — for freeze and
     dissolve, the two whose real mechanism reads as a genuinely different
     SHAPE of change, not just a different heat level — its own shape too.
     Melt/boil/burn/corrode/crystallize/ferment share the ripple's timing and
     just recolour it: real, honest, and doesn't ask CSS to fake eight
     distinct physical simulations. */
  .ring-freeze{border-color:var(--c-water-lo);
    clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);border-radius:0}
  .ring-melt{border-color:var(--c-fire-lo)}
  .ring-boil{border-color:var(--c-fire-hi)}
  .ring-burn{border-color:var(--c-fire-bs)}
  .ring-ferment{border-color:var(--c-ferment-bs)}
  .ring-corrode{border-color:var(--c-mineral-lo)}
  .ring-crystallize{border-color:var(--c-mineral-hi)}
  @keyframes dissolveRipple{
    from{transform:translate(-50%,-50%) scale(1.4);opacity:.6}
    to{transform:translate(-50%,-50%) scale(.15);opacity:0}
  }
  .ring-dissolve{border-color:var(--c-water-bs);animation-name:dissolveRipple}
  /* melt/boil: the ring itself stays the plain ripple above; this rising,
     thinning blob layered on top is the "soft upward shimmer" — real vapor
     reads as loss of definition while it climbs, not a clean expanding line. */
  @keyframes riseAndFade{
    0%{transform:translate(-50%,-50%) scale(.6);opacity:.5;filter:blur(1px)}
    100%{transform:translate(-50%,-70px) scale(1.3);opacity:0;filter:blur(4px)}
  }
  .shimmer{
    position:absolute;width:40px;height:40px;border-radius:99px;pointer-events:none;
    animation:riseAndFade .9s ease-out forwards;
  }
  .shimmer-melt{background:radial-gradient(circle,color-mix(in srgb,var(--c-fire-lo) 55%,transparent),transparent 70%)}
  .shimmer-boil{background:radial-gradient(circle,color-mix(in srgb,var(--c-fire-hi) 55%,transparent),transparent 70%)}
  /* corrode: a few small pits spreading outward and staying — oxidation
     doesn't ripple once and vanish, it marks the surface. */
  @keyframes pit{
    0%{transform:translate(-50%,-50%) scale(0);opacity:0}
    30%{opacity:.85}
    100%{transform:translate(-50%,-50%) scale(1);opacity:.55}
  }
  .fleck{
    position:absolute;width:5px;height:5px;border-radius:99px;pointer-events:none;
    background:var(--c-mineral-lo);animation:pit .5s ease-out forwards;
  }
  /* crystallize: wide angular shards, not the fine repeating rays .burst
     uses for a first discovery — a mineral snapping into facets reads as a
     handful of hard-edged planes, not a burst of light. */
  @keyframes facetSnap{
    0%{transform:translate(-50%,-50%) rotate(0deg) scale(.2);opacity:0}
    30%{opacity:.9}
    100%{transform:translate(-50%,-50%) rotate(22deg) scale(1.2);opacity:0}
  }
  .facets{
    position:absolute;width:140px;height:140px;pointer-events:none;z-index:4;
    background:repeating-conic-gradient(from 0deg,
      var(--c-mineral-hi) 0deg 8deg,transparent 8deg 45deg);
    -webkit-mask-image:radial-gradient(closest-side,transparent 25%,#000 45%,#000 60%,transparent 85%);
    mask-image:radial-gradient(closest-side,transparent 25%,#000 45%,#000 60%,transparent 85%);
    animation:facetSnap .55s cubic-bezier(.16,.8,.3,1) forwards;
  }
  /* The moment something exists that did not exist before. The ripple says
     "a reaction happened"; this says "and it was the first one" — so it fires
     only on a genuine first discovery, never on remaking something you have.
     Rays rather than a flash: they radiate from the thing itself, which points
     at what you made instead of lighting up the whole bench. */
  @keyframes burst{
    0%  {transform:translate(-50%,-50%) rotate(-14deg) scale(.3); opacity:0}
    16% {opacity:.9}
    100%{transform:translate(-50%,-50%) rotate(34deg)  scale(1.55);opacity:0}
  }
  .burst{
    position:absolute;width:250px;height:250px;pointer-events:none;z-index:4;
    background:repeating-conic-gradient(from 0deg,
      var(--discovery) 0deg 1.5deg, transparent 1.5deg 15deg);
    -webkit-mask-image:radial-gradient(closest-side,transparent 30%,#000 47%,#000 63%,transparent 90%);
    mask-image:radial-gradient(closest-side,transparent 30%,#000 47%,#000 63%,transparent 90%);
    animation:burst .8s cubic-bezier(.16,.8,.3,1) forwards;
  }
  @keyframes freshGlow{
    0%,100%{box-shadow:var(--raise)}
    35%{box-shadow:var(--raise),0 0 0 3px color-mix(in srgb,var(--discovery) 55%,transparent)}
  }
  .chip.board.justmade{animation:freshGlow .9s ease-out}
  /* An ordinary merge gets one calm ring. A pair genuinely documented as
     violently reactive — sourced the same way every other caution in this
     game is, never invented for effect — gets the whole canvas reacting:
     a flash across the glass, three shockwave rings punching out in
     sequence, the board shaking hard enough to read as an impact, and
     every single chip on the bench thrown off its spot, not just the
     ones nearby. Nothing here moves a chip's REAL saved position — it's
     all a transform on top, the same trick .justmade already uses, so
     tidy()'s layout is never fought, and it all settles back exactly
     where it was. ("the entire background canvas to turn into a mega
     rippling block blast" — found live; the first version was too shy.) */
  @keyframes screenFlash{
    0%{opacity:0}
    10%{opacity:.6}
    45%{opacity:.22}
    100%{opacity:0}
  }
  .flash{
    /* A child of #world, positioned in WORLD coordinates exactly like
       .shock and .debris — not a child of #board anchored to a fixed
       screen position. That distinction is the whole story of a real bug:
       the new output chip's own spawn() can call ensureVisible() and pan
       the view moments after this fires, and a board-anchored flash's
       position was computed ONCE, before that pan — so the glow stayed
       glued to the old screen position while everything world-anchored
       (the rings, the debris, the reacting chips themselves) correctly
       panned along with the content. That is exactly "the blast is not
       starting from the combined elements, it's still dominating the
       bottom left" (found live, twice) — not a coordinate math error
       (which tested correct every time in isolation), a wrong choice of
       what to anchor to. Fixed width/height in world units rather than
       percentage-of-board: it needs to look the same size at a given
       zoom regardless of board size, the same way a card's size doesn't
       change just because the shelf got wider. */
    position:absolute;width:2400px;height:2400px;margin-left:-1200px;margin-top:-1200px;
    pointer-events:none;z-index:7;
    background:radial-gradient(circle at 50% 50%,
      color-mix(in srgb,var(--brick) 75%,transparent) 0%,
      color-mix(in srgb,var(--brick) 25%,transparent) 16%,
      transparent 40%);
    animation:screenFlash 1.7s ease-out forwards;
  }
  @keyframes shockwave{
    from{transform:translate(-50%,-50%) scale(.2);opacity:.95;border-width:6px}
    to{transform:translate(-50%,-50%) scale(9);opacity:0;border-width:1px}
  }
  .shock{
    position:absolute;width:110px;height:110px;border-radius:99px;pointer-events:none;z-index:6;
    border:6px solid var(--brick);animation:shockwave 1.9s cubic-bezier(.1,.8,.2,1) forwards;
  }
  /* Literal debris, not just a glow — small blocks flung out from ground
     zero and tumbling as they go, the way a Minecraft TNT crater throws
     cubes rather than just lighting up. Two faces per block (a lighter
     top, a darker side) is enough to read as a cube at this size without
     needing real 3D. ("the type of explosion i was looking for was more
     TL[; Minecraft]" — found live, with a picture of exactly that. "more
     blocks, slower explosion, more ripple" — found live again, next.) */
  @keyframes debris{
    0%  {transform:translate(-50%,-50%) translate(0,0) rotate(0deg) scale(1);opacity:1}
    100%{transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) rotate(var(--dr)) scale(.4);opacity:0}
  }
  .debris{
    position:absolute;width:var(--ds,10px);height:var(--ds,10px);pointer-events:none;z-index:6;
    background:color-mix(in srgb,var(--brick) 55%,var(--ink-soft));
    border-bottom:3px solid var(--ink); border-right:2px solid var(--ink);
    animation:debris 1.6s cubic-bezier(.1,.7,.25,1) forwards;
  }
  /* `#world`'s own inline style carries the pan/zoom (`applyView()`'s
     `transform:translate(view.x,view.y) scale(view.k)`), and a CSS animation
     of the SAME property replaces that value outright for as long as it runs
     — not composes with it. Animating `transform` here was blanking the
     board's actual pan/zoom for the full 1.7s of every violent reaction,
     which is exactly why the explosion (and everything else on the bench)
     went invisible before reappearing once the shake ended — not a camera
     pan away from the blast, the pan was being discarded outright. ("takes
     me away from the explosion and then brings me back" — found live from a
     screen recording, hydrogen + fluorine.) Fixed by shaking with the
     standalone `translate`/`rotate` properties instead, which compose
     ON TOP of `transform` rather than overriding it. */
  @keyframes boardFlinch{
    0%,100%{translate:0 0; rotate:0deg}
    5% {translate:-18px 11px; rotate:-1.1deg}
    12%{translate:16px -14px; rotate:1.2deg}
    20%{translate:-15px -10px; rotate:-1deg}
    29%{translate:14px 11px; rotate:.9deg}
    39%{translate:-11px -8px; rotate:-.7deg}
    50%{translate:9px 8px; rotate:.6deg}
    61%{translate:-7px 5px; rotate:-.4deg}
    72%{translate:5px -4px; rotate:.3deg}
    83%{translate:-3px 2px; rotate:-.15deg}
    93%{translate:1px -1px; rotate:.05deg}
  }
  #board.flinch #world{animation:boardFlinch 1.7s cubic-bezier(.2,.6,.25,1)}
  @keyframes knocked{
    0%{transform:translate(var(--kx0,0),var(--ky0,0)) rotate(var(--kr0,0))}
    18%{transform:translate(var(--kx,0),var(--ky,0)) rotate(var(--kr,0))}
    100%{transform:translate(0,0) rotate(0)}
  }
  .chip.board.knocked{animation:knocked 1.6s cubic-bezier(.15,.7,.25,1)}
  @media (prefers-reduced-motion:reduce){
    .burst{display:none}
    .chip.board.justmade{animation:none}
    .flash{display:none}
    .shock{display:none}
    #board.flinch #world{animation:none}
    .chip.board.knocked{animation:none}
  }
  @keyframes expel{
    0%{transform:translate(-50%,-50%) scale(.4);opacity:0}
    22%{transform:translate(-50%,-50%) scale(1.15);opacity:1}
    100%{transform:translate(calc(-50% + 46px),calc(-50% - 62px)) scale(.7);opacity:0}
  }
  .drop{
    position:absolute;width:30px;height:30px;pointer-events:none;z-index:5;
    animation:expel 1.05s cubic-bezier(.25,.6,.4,1) forwards;
  }
  .drop .art{width:100%;height:100%;display:block;
             filter:drop-shadow(0 2px 6px rgba(var(--shade),.55))}
  @keyframes pulse{0%,100%{transform:scale(1)}45%{transform:scale(1.07)}}
  .chip.board.pulse{animation:pulse .38s ease}
  #waiting{color:var(--teal);font-weight:700}
  .chip.live{border-color:var(--avocado);box-shadow:0 0 0 2px rgba(107,142,78,.13)}
  /* The armed shelf card for sprinkle mode — a slow breathing glow, not a
     badge or a popup, so it reads at a glance without adding new UI chrome. */
  @keyframes sprinkleBreathe{0%,100%{box-shadow:0 0 0 2px rgba(197,120,60,.18)}
                              50%{box-shadow:0 0 0 4px rgba(197,120,60,.4)}}
  .chip.sprinkling{border-color:var(--orange);animation:sprinkleBreathe 1.6s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){ .chip.sprinkling{animation:none;box-shadow:0 0 0 3px rgba(197,120,60,.35)} }
  /* A grain: the same drawing a real chip uses, none of the rest — no name,
     no icons, no border, no gesture handlers (pointer-events:none, so it
     never competes with panning or dragging a real card underneath it).
     Cheap enough to hold hundreds; see GRAIN_CAP. */
  .grain{
    position:absolute;width:26px;height:26px;pointer-events:none;
    border-radius:50%;overflow:hidden;z-index:2;
  }
  .grain svg{width:100%;height:100%;display:block}
  /* Landing, and reacting — the two moments a grain is ever seen changing,
     both pure CSS so they cost nothing per-grain beyond a class toggle. No
     continuous physics loop (no gravity, no falling arc): grains are cheap
     specifically because nothing about them runs every frame, and hundreds
     of them animating on a timer would undo that. */

  /* ---- matter taxonomy ----------------------------------------------
     Shape carries meaning, so the three kinds of thing are never confusable:
       pill     = a thing in the world   (game element)
       hexagon  = a molecule             (compound)
       tile     = an atom                (periodic-table cell)
       halo     = energy, not matter     (particle)
     Colour then carries the sub-category within each kind. ------------- */
  :root{
    /* Periodic-table groups. Same discipline as everything else: these are
       Munsell chips, not a third hand-picked palette. */
    --alkali:var(--c-fire-bs);       --alkaline:var(--c-grain-bs);
    --transition:var(--c-dish-bs);   --post:var(--c-craft-bs);
    --metalloid:var(--c-plant-bs);   --nonmetal:var(--c-molecule-bs);
    --halogen:var(--c-water-bs);     --noble:var(--c-living-bs);
    --lanthanide:#B5657F; --actinide:#7A5C8E;
    /* The eight shelf families are a grouping, not a second palette. Their
       colours come from the same Munsell chips the drawings use, so the shelf
       heading and the card in it can never disagree about what a thing is. */
    --fam-earth:var(--c-mineral-bs);   --fam-water:var(--c-water-bs);
    --fam-fire:var(--c-fire-bs);       --fam-plant:var(--c-plant-bs);
    --fam-animal:var(--c-living-bs);   --fam-microbe:var(--c-molecule-bs);
    --fam-food:var(--c-grain-bs);      --fam-myth:var(--c-craft-bs);
    /* Metals share the mineral hue page (they come out of rock) and wild
       animals share living (they are animals) — but each needs its own
       token, or the shelf heading for that family renders with --fam unset. */
    --fam-metal:var(--c-mineral-hi);   --fam-wild:var(--c-living-lo);
  }
