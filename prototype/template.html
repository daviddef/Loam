}
// ---- the index entry: what makes this, and what this makes ----
// Little Alchemy's own hints site draws about as much traffic as the game.
// Stuck is the highest-intent moment a player has, so serve it here — but
// only with what they have already found, plus an honest count of the rest.
// A recipe book, not an answer key.
function gestureHTML(r) {
  const v = r.verb ? verbs.find(x => x.id === r.verb) : null;
  const part = (id) => `<span class="g" data-entry="${id}">${glyph(id, 19)} ${byId[id].name}</span>`;
  return v ? `${part(r.in[0])}<em>${glyph('verb_' + v.id, 17)} ${v.name}</em>`
           : `${part(r.in[0])}<em>+</em>${part(r.in[1])}`;
}
// How much help you have asked for, per element. It escalates only when you
// ask again — the answer key is always available, but never volunteered.
const hintLevel = new Map();
function showHint(id) {
  const e = byId[id];
  const routes = DATA.recipes.filter(r => r.out === id);
  const ul = unlockedVerbs();
  // This has to be THE SAME route orderedSteps below walks, or the panel can
  // say "missing 1 ingredient" directly above a path that isn't even for that
  // recipe. It used to pick whichever route needs least from what you hold
  // right now — reasonable on its own, but computed fresh at every node with
  // no memory of the nodes above it, which can and did produce a real cycle
  // (amino_acid's closest route went via protein, whose closest route needed
  // polypeptide, which needed amino_acid back) — bestRecipe can't do that: it
  // is a proper fixed point over the whole graph, cost only ever decreases,
  // and a cycle can never cost less than the nodes it depends on. Deferring
  // to it costs a little precision — it names the fewest-total-crafts route
  // rather than the one nearest your current shelf — for a path that is
  // always real, acyclic, and the same one shown below.
  const best = bestRecipe.get(id) ?? routes.slice()
    .sort((a, b) => (a.in.filter(i => !found.has(i)).length + (a.verb && !ul.has(a.verb) ? 1 : 0)) -
                     (b.in.filter(i => !found.has(i)).length + (b.verb && !ul.has(b.verb) ? 1 : 0)))[0];
  const lvl = hintLevel.get(id) ?? 0;
  const missing = best ? best.in.filter(i => !found.has(i)) : [];
  const verbLocked = best?.verb && !ul.has(best.verb);
  const v = best?.verb ? verbs.find(x => x.id === best.verb) : null;

  let body;
  if (!best) body = `<p>Nothing in the world makes this. It is where things start.</p>`;
  else if (lvl === 0) {
    body = `<p>There ${routes.length === 1 ? 'is one way' : `are ${routes.length} ways`} to make it.</p>` +
      (missing.length
        ? `<p>You are missing <b>${missing.length}</b> of the ingredient${missing.length === 1 ? '' : 's'} for the closest one — so something else has to come first.</p>`
        : `<p><b>You already have everything you need.</b> It is two things on your shelf${v ? `, or one thing and a tool` : ''}.</p>`) +
      (verbLocked ? `<p>It also needs the ${glyph('verb_' + v.id, 17)} ${v.name} tool, which opens when you make ${nameOf(byId[v.unlockedBy])}.</p>` : '');
  } else if (lvl === 1) {
    const shown = missing.length ? missing[0] : best.in[0];
    body = `<p>Try something with <b class="jump" data-hint="${shown}">${glyph(shown, 19)} ${nameOf(byId[shown])}</b>.</p>` +
      (v ? `<p>And the ${glyph('verb_' + v.id, 17)} ${v.name} tool.</p>` : '');
  } else {
    body = `<p class="answer">${best.in.map(i => `${glyph(i, 19)} ${nameOf(byId[i])}`).join(v ? '' : ' &nbsp;+&nbsp; ')}` +
      (v ? ` &nbsp;⟶&nbsp; ${glyph('verb_' + v.id, 17)} ${v.name}` : '') + ` &nbsp;→&nbsp; ${glyph(e.id, 19)} ${nameOf(e)}</p>` +
      (missing.length ? `<p class="hint2">You still need ${missing.map(i =>
        `<b class="jump" data-hint="${i}">${glyph(i, 19)} ${nameOf(byId[i])}</b>`).join(' and ')} first.</p>` : '');
  }

  // "You still need Spark first" is only half an answer if finding Spark means
  // starting the search again. Show the whole run of missing things, in order,
  // each one tappable for its own hint.
  const todo = orderedSteps(id).filter(r => !found.has(r.out));
  const pathHTML = todo.length > 1 ? `
    <h2>What is still missing · ${todo.length}</h2>
    <div class="path">` + todo.map((r, i) => `
      <div class="pstep${r.out === id ? ' last' : ''}" data-hint="${r.out}">
        <span class="pn2">${i + 1}</span>
        <span class="g">${glyph(r.out, 19)} ${nameOf(byId[r.out])}</span>
        ${r.out === id ? '<i>your goal</i>' : '<i>tap for a hint</i>'}
      </div>`).join('') + `</div>` : '';

  document.getElementById('sheetBody').innerHTML = `
    <div class="phead"><span class="big">${glyph(e.id, 34)}</span><h3>${nameOf(e)}</h3>
      <div class="pnums">Not made yet</div></div>
    <div class="hintbox">${body}</div>
    ${best && lvl < 2 ? `<div class="cardrow"><button class="ghost" data-more="${id}">
        ${lvl === 0 ? 'Give me a nudge' : 'Just tell me'}</button></div>` : ''}
    ${pathHTML}
    ${found.has(id) ? '' : `<div class="cardrow" style="margin-top:10px">
       <button class="ghost" data-entry-any="${id}">See its full entry</button></div>`}
    <p class="hint2">Ingredients are never used up — take as many from the shelf as you like.</p>`;
  openSheet(`How to make ${nameOf(e)}`);
}

// One unified sheet for "what is this thing", not two separate screens
// reached by an extra tap. Quick view, the story and the tree are three
// tabs on the SAME sheet now — quick view stays the default landing tab
// ("i asked firstly for you to default to the 'quick view' tab. start
// there"), but the other two are one tap away instead of behind a
// "Where it came from" button first. ("If I then tap 'where it came
// from' I then see 3 options. Can I see these options on the first
// screen... as tabs?" — found live.) The tab bar and the guess-quiz gate
// only apply to something actually owned — an unmade element has no
// derivation to show yet, so it still gets the plain locked-entry view.
function showEntry(id, mode) {
  const owned = found.has(id);
  if (owned && mode && mode !== 'quick' && !guessed.has(id) && !onCanvas(id) && expanded(id).leaves > 3)
    return askFirst(id, () => showEntry(id, mode));
  entryMode = owned ? (mode || entryMode || 'quick') : 'quick';
  const e = byId[id], f = familyOf(e);
  // The bench-add rides the same row as the tabs, pushed to the far end,
  // rather than getting a whole centred .cardrow to itself below — a lone
  // 24px icon centred in a full-width flex row was reading as a wasted
  // line. ("Make sure consistent and well placed so it doesn't waste
  // entire lines" — found live.)
  // Decay only makes sense for something that already has a real chip on the
  // bench to visibly wither — the whole point is watching the chain react,
  // not a hypothetical. It reuses the same icon-button language as the
  // bench-add, just at the far end past it.
  const decayBtn = onCanvas(id)
    ? `<button class="addroute decay" data-decay="${id}" title="Decay this — see what it breaks">🥀</button>` : '';
  const favOn = favourites.has(id);
  const favBtn = `<button class="addroute fav${favOn ? ' on' : ''}" data-fav="${id}" title="${favOn ? 'Remove from' : 'Add to'} Favourites">${favOn ? '★' : '☆'}</button>`;
  const tabs = owned ? `<div class="modes">
       <button class="${entryMode === 'quick' ? 'on' : ''}" data-mode="quick" data-for="${id}">Quick view</button>
       <button class="${entryMode === 'cards' ? 'on' : ''}" data-mode="cards" data-for="${id}">The story</button>
       <button class="addroute" style="margin-left:auto" data-put="${id}" title="Put on the bench">+</button>
       ${favBtn}
       ${decayBtn}
     </div>` : '';
  document.getElementById('sheetBody').innerHTML =
    (entryMode === 'quick' ? quickViewHTML(id) : provenanceHTML(id)).replace('__TABS__', tabs);
  openSheet(entryMode === 'quick' ? e.name : 'Where it came from');
  lastGuess = null;
}
// Quick view's own body: the short Made-From/Makes card, plus a folded
// preview of the real ancestry (the same treeHTML the full "Tree" tab
// uses, already self-limiting past AUTO_DEPTH) so the shape of the chain
// is visible without switching tabs. ("could we add the mini hierarchy to
// the quick view?" — found live.)
function quickViewHTML(id) {
  const e = byId[id], f = familyOf(e);
  const routesIn  = DATA.recipes.filter(r => r.out === id);
  const owned     = found.has(id);
  const knownIn   = owned ? routesIn.filter(r => r.in.every(i => found.has(i))) : [];
  const usedIn    = DATA.recipes.filter(r => r.in.includes(id));
  const knownOut  = owned ? usedIn.filter(r => found.has(r.out)) : [];
  const hiddenIn  = routesIn.length - knownIn.length;
  const hiddenOut = usedIn.length - knownOut.length;
  // Every real route in the "Made From" list used to be read-only — the
  // card would list two, sometimes six, genuine ways to make a thing (Meat
  // alone has goat/chicken/muscle/fish/duck/turkey) but only ever offered
  // ONE of them onto the canvas, picked for you by bestRecipe, with no way
  // to say which. "when i click meat, why does duck come up? could have
  // been lamb, beef, duck, chicken, etc" and "made of and made from? i
  // should be able to add either path to the chart!" — found live, asked
  // repeatedly. Each 'in' row now carries its own index into `knownIn` so
  // placeRoute() can place THAT specific route, not whichever one a single
  // heuristic favours.
  const rows = (list, cls) => list.map((r, i) =>
    `<div class="ent ${cls}">${gestureHTML(r)}<span class="arw">→</span>` +
    `<span class="g out" data-entry="${r.out}">${glyph(r.out, 19)} ${byId[r.out].name}</span>` +
    (cls === 'in' ? `<button class="addroute" data-put-route="${id}::${i}" title="Add this path to the chart">+</button>` : '') +
    `</div>`).join('');

  return `
    <div class="phead fam-${f.id}">
      <span class="big">${glyph(e.id, 34)}</span><h3>${e.name}</h3>
      <div class="pnums">${f.name}${e.terminal ? ' · nothing is made from this' : ''}</div>
      <div class="pfrom">${e.fact}</div>
    </div>
    ${(() => { const bid = bedrockIdFor(id); const svg = bid ? moleculeSVG(bid) : ''; return svg ? `<div class="molbox">${svg}</div>` : ''; })()}
    ${e.discovered ? `<p class="pfrom">🕐 <b>${e.discovered.year}</b> · ${e.discovered.note}</p>${nearestInTimeHTML(id)}` : ''}
    ${cautionHTML(id)}
    ${upstreamHazardHTML(id)}
    __TABS__
    ${(!owned || hiddenIn > 0) ? `<div class="cardrow" style="margin:10px 0 10px">
      ${!owned ? `<button class="ghost" data-hint="${id}">How do I make it?</button>` : ''}
      ${hiddenIn > 0 ? `<button class="ghost" data-hint="${id}">Other ways to make it</button>` : ''}
    </div>` : ''}
    <h2>Made from${knownIn.length ? ` · ${knownIn.length}` : ''}</h2>
    ${knownIn.length ? rows(knownIn, 'in')
      : `<p class="none">${owned
            ? 'You have this one, but you have not yet held everything that makes it.'
            : 'You have not made this yet.'}</p>`}
    ${hiddenIn > 0 ? `<p class="hint2">${hiddenIn} other way${hiddenIn === 1 ? '' : 's'} to make it ${hiddenIn === 1 ? 'exists' : 'exist'}.</p>` : ''}
    ${owned && bestRecipe.get(id) ? `<h2>Ancestry</h2>
      <p class="hint2">One real route back — several of these steps have other real parents too (Bone's own Meat, for instance, is just as truly Goat, Chicken, Fish, or Turkey).</p>
      <ul class="tree">${treeHTML(id, 0, new Set(), 1)}</ul>` : ''}
    ${factsHTML(id)}
    ${BED.composition[id] ? bedrockHTML(new Map([[id, 1]]), 'What it is made of') : ''}
    ${taxonPathHTML(id)}
    <h2>Makes${usedIn.length ? ` · ${knownOut.length} of ${usedIn.length}` : ''}</h2>
    ${knownOut.length ? rows(knownOut, 'out') : ''}
    ${hiddenOut > 0 ? `<div class="shelf" style="margin-top:${knownOut.length ? '8px' : '0'}">` +
      usedIn.filter(r => !found.has(r.out)).map(r =>
        `<span class="chip locked" data-hint="${r.out}">${chipHTML(byId[r.out])}<i class="q">?</i></span>`).join('') +
      `</div>` : ''}
    ${!usedIn.length ? '<p class="none">Nothing is made from this.</p>' : ''}`;
}

/**
 * The one answer to "what is this thing".
 *
 * Which page that is depends on whether you have it: a thing on your shelf has
 * an entry — what makes it, what it makes, what it is made of underneath. A
 * thing you have only heard of has a route instead. Every ⓘ, every long press
 * and every "Read about it" comes through here so the answer is the same
 * wherever the question is asked from.
 */
function openAbout(id) {
  if (!byId[id]) return;
  dismissCard();
  sfx.pick();
  found.has(id) ? showEntry(id) : showHint(id);
}

// Constructing beats studying roughly 2:1 across four meta-analyses, and
// requiring an effortful guess before the reveal cut illusion-of-understanding
// at d = 0.69. So the chain does not simply unroll — you commit first, once,
// the first time you trace a given thing.
const guessed = new Set();
let entryMode = 'quick';
function askFirst(id, then) {
  const x = expanded(id);
  const truth = x.leaves;
  const opts = [...new Set([
    Math.max(2, Math.round(truth * 0.35)),
    truth,
    Math.round(truth * 2.1) + 1,
  ])].sort((a, b) => a - b);
  document.getElementById('sheetBody').innerHTML = `
    <div class="guess">
      <div class="big">${glyph(id, 34)}</div>
      <h3>Before you look</h3>
      <p>How many raw things — stone, water, sun, seed — do you think went into
         one ${byId[id].name.toLowerCase()}?</p>
      <div class="opts">${opts.map(o => `<button data-guess="${o}">${o}</button>`).join('')}</div>
      <button class="skip" data-guess="skip">Just show me</button>
    </div>`;
  openSheet('A guess first');
  document.getElementById('sheetBody').querySelectorAll('[data-guess]').forEach(b => b.onclick = () => {
    const g = b.dataset.guess;
    guessed.add(id);
    if (g !== 'skip') {
      const n = Number(g);
      lastGuess = { n, truth, right: n === truth };
      (n === truth ? sfx.discover : sfx.pick)();
    } else lastGuess = null;
    then();
  });
}
let lastGuess = null;

// The chain, as a run of citation cards. Peer-reviewed finding: node-link
// diagrams fail the consumer persona — Obsidian's graph view is the popular
// proof, and Factorio hit this exact problem and built cards instead. So cards
// are the default and the tree is kept for whoever wants it.
// The thing no other provenance view has: every card carries its source.
function orderedSteps(id) {
  const need = new Set();
  (function walk(x) {
    const r = bestRecipe.get(x);
    if (!r || need.has(r)) return;
    need.add(r);
    r.in.forEach(walk);
  })(id);
  const have = new Set(STARTERS);
  const out = [];
  const left = [...need];
  while (left.length) {
    const k = left.findIndex(r => r.in.every(i => have.has(i)));
    if (k === -1) break;
    const [r] = left.splice(k, 1);
    have.add(r.out); out.push(r);
  }
  return out;
}
// The chain itself — bare gestures, one line each — is the default; the
// prose is opt-in per step, not shown for every step at once. ("by default
// it should just show stone wait soil + seed -> grass... no text. only if
// we click story it should expand out" — found live, a real 4-step chain
// with all four paragraphs open at once.)
function stepCard(r, i) {
  const v = r.verb ? verbs.find(x => x.id === r.verb) : null;
  const bit = (id) => `<span class="g" data-entry="${id}">${glyph(id, 19)} ${nameOf(byId[id])}</span>`;
  return `<div class="step">
    <div class="stepno">${i + 1}</div>
    <div class="stepbody">
      <div class="stepgest" data-stepwhy>${bit(r.in[0])}${v ? `<em>${glyph('verb_' + v.id, 17)} ${v.name}</em>` : `<em>+</em>${bit(r.in[1])}`}
        <span class="arw">→</span>${bit(r.out)}<span class="tw why">▸</span></div>
      <div class="stepwhy fold">
        <p>${r.why}</p>
        ${r.src ? `<a class="src" href="${r.src}" target="_blank" rel="noopener">Check this${r.verified ? ' ✓' : ''}</a>` : ''}
      </div>
    </div></div>`;
}

// A guess is worth asking for the FIRST time a chain is opened — but "Where
// it came from" also reaches something sitting right there on the bench,
// already wired to its own real ancestors by the link lines on screen. Being
// quizzed on a count you could just read off the board is not active recall,
// it's friction. ("by default, if a item is on our canvas, just show me
// where it came from, stop asking me" — found live.)
const onCanvas = (id) => !!world.querySelector(`.chip.board[data-id="${id}"]`);
// The story tab body — the tab bar itself now comes from showEntry,
// shared with quick view, so this only ever renders what sits below it.
/**
 * Everything hazardous on this thing's route, gathered in one place.
 *
 * Asked for as: scan a food item, then show the carcinogens, poisons and other
 * bad stuff up the ancestry chain rather than making someone open every card.
 *
 * It follows the SAME route the provenance view shows — the canonical recipe
 * for each step — and not every possible route. That is a deliberate limit,
 * and the copy says so. Walking every route instead was measured: from `bacon`
 * it reaches 616 ancestors and 59 cautions, from `bread` 605 and 57, from
 * `sausage` 609 and 58. The graph is dense enough that all-routes reaches most
 * of the corpus from anywhere, so every food would carry an identical wall of
 * warnings. A list that says the same thing about everything says nothing.
 */
function upstreamHazards(id) {
  const seen = new Map();                     // caution key -> {c, from:Set}
  for (const a of distinctOf(id)) {
    for (const c of cautionsFor(a)) {
      let rec = seen.get(c.kind);
      if (!rec) seen.set(c.kind, rec = { c, from: new Set() });
      rec.from.add(a);
    }
  }
  // Loudest first, matching the badge priority on the cards themselves.
  const rank = c => c.kind === 'radioactivity' ? 0 : c.carcinogen ? 1 : c.biohazard ? 2
    : ({ acute: 3, contact: 4, cumulative: 5, conditional: 6 })[c.severity] ?? 7;
  return [...seen.values()].sort((x, y) => rank(x.c) - rank(y.c));
}

function upstreamHazardHTML(id) {
  const hz = upstreamHazards(id);
  if (!hz.length) return '';
  const mark = c => c.kind === 'radioactivity' ? '<i class="hzm radioactive">☢</i>'
    : c.carcinogen ? '<i class="hzm carcinogen">__UI_CARCINOGEN__</i>'
    : c.biohazard ? '<i class="hzm biohazard">☣</i>'
    : `<i class="hzm sev-${c.severity || 'cumulative'}">!</i>`;
  const n = hz.length;
  return `<details class="upstream">
      <summary>${n} thing${n === 1 ? '' : 's'} worth knowing on the way here</summary>
      <p class="upnote">Following the route shown above, not every possible route.</p>
      ${hz.map(({ c, from }) => `<div class="uprow">${mark(c)}<div>
        <b>${c.label}</b>
        <span class="upfrom">${[...from].map(f => byId[f] ? byId[f].name : f).join(' · ')}</span>
        <p>${c.note}</p></div></div>`).join('')}
    </details>`;
}

function provenanceHTML(id) {
  const x = expanded(id), d = distinctOf(id).size, t = leafTally(id), e = byId[id];
  return `<div class="phead"><div class="big">${glyph(e.id, 34)}</div><h3>${e.name}</h3>
       <div class="pnums"><b>${x.leaves}</b> raw inputs · <b>${d}</b> distinct ingredients · <b>${x.steps}</b> crafts</div>
       ${lastGuess ? `<div class="verdict ${lastGuess.right ? 'hit' : 'miss'}">${
         lastGuess.right ? 'You called it exactly.'
         : `You guessed ${lastGuess.n}. It takes ${lastGuess.truth}.`}</div>` : ''}
       <div class="pfrom">Bottoms out in ${[...t].sort((a,b)=>b[1]-a[1])
         .map(([k,n]) => `${glyph(k, 17)} ${byId[k].name} ×${n}`).join(' · ')}</div></div>
     __TABS__
     <div class="steps">${orderedSteps(id).map(stepCard).join('')}</div>
     ${upstreamHazardHTML(id)}
     ${bedrockHTML(t)}`;
}

// ---------- codex ----------
// Rebuilding the whole sheet on every keystroke destroys the input and resets
// the caret to position 0, which makes typed text come out reversed. Build the
// chrome once; only the results list is re-rendered.
// Off by default: the codex is a record of what YOU have found, and opening it
// on six hundred grey silhouettes would make it a checklist someone else wrote.
// On when you ask, because "what else is in here" is a fair question and the
// honest answer is the whole map, greyed, with every one of them tappable for
// its own route.
let codexAll = false;
function codexResults(q) {
  const ql = (q || '').toLowerCase();
  const hits = elements.filter(e => found.has(e.id) && matchesSearch(e, ql));
  // Searching should also reach things you have not made yet — otherwise there
  // is nowhere to ask "how do I make fire?", which is the whole stuck moment.
  const unmade = q ? elements.filter(e => !found.has(e.id) && matchesSearch(e, ql)) : [];
  const unmadeBlock = unmade.length
    ? `<h2 class="locked">Not yet made · ${unmade.length}</h2><div class="shelf">` +
      unmade.slice(0, 24).map(e =>
        `<span class="chip locked" data-hint="${e.id}">${chipHTML(e)}<i class="q">?</i></span>`).join('') +
      `</div>`
    : '';
  if (!hits.length && !unmade.length) return '<p class="none">Nothing found.</p>';
  // With "show all" on, each family lists what you hold first and then what you
  // do not, in the same row — so the gap is visible where it actually is,
  // rather than as one undifferentiated pile at the bottom.
  const restOf = (f) => codexAll && !q
    ? elements.filter(e => !found.has(e.id) && familyOf(e).id === f.id)
    : [];
  return FAMILIES.map(f => [f, hits.filter(e => familyOf(e).id === f.id), restOf(f)])
    .filter(([, g, rest]) => g.length || rest.length)
    .sort((a, b) => (a[0].id === 'myth') - (b[0].id === 'myth'))
    .map(([f, g, rest]) =>
      `<h2 class="fam-${f.id}"><i></i>${f.name} · ${g.length}` +
      (rest.length ? `<em>${g.length + rest.length}</em>` : '') + `</h2><div class="shelf">` +
      g.map(e => `<span class="chip fam-${f.id}" data-fam="${f.id}" data-entry="${e.id}">${chipHTML(e)}</span>`).join('') +
      rest.map(e => `<span class="chip locked" data-hint="${e.id}">${chipHTML(e)}<i class="q">?</i></span>`).join('') +
      `</div>`).join('') + unmadeBlock;
}
function showCodex(q = '') {
  document.getElementById('sheetBody').innerHTML =
    `<input id="q" class="search" placeholder="Search your discoveries…" value="${q}" autocomplete="off">` +
    `<div class="cardrow" style="margin:10px 0 2px">` +
    `<button class="ghost" id="ptBtn">Periodic table</button>` +
    `<button class="ghost icon" id="aaBtn" title="Amino acids"><span class="gl" style="--g:16px">__UI_AMINO__</span></button>` +
    `<button class="ghost icon" id="ladderBtn" title="The ladder"><span class="gl" style="--g:16px">__UI_LADDER__</span></button>` +
    `<button class="ghost icon${codexAll ? ' on' : ''}" id="allBtn" title="${codexAll ? 'Only what I have' : 'Show all ' + elements.length}"><span class="gl" style="--g:16px">__UI_EYE__</span></button></div>` +
    `<div id="codexList">${codexResults(q)}</div>`;
  openSheet(`Codex · ${found.size} of ${elements.length}`);
  document.getElementById('ptBtn').onclick = () => {
    document.getElementById('sheetBody').innerHTML = periodicHTML();
    openSheet('The periodic table');
  };

/* ── the ladder ───────────────────────────────────────────────────────────
 * Every item you have found, laid out by order of magnitude, from the sun to
 * a carbon atom. It is the Powers of Ten idea made into a screen, and it is
 * built entirely from data we already ship: no new art, no new claims, just
 * the sizes sorted.
 *
 * It is also the clearest answer to what this game is for. A crafting game
 * shows you a list of things you own. This shows you that a loaf of bread and
 * a ribosome are nineteen orders of magnitude apart, and that you walked the
 * whole way.
 */
const RUNG_LABEL = {
  '-10': 'atoms and bonds',
  '-9':  'small molecules',
  '-8':  'proteins and polymers',
  '-6':  'single cells',
  '-5':  'cells you could see with a lens',
  '-4':  'grains and powders',
  '-3':  'seeds and crumbs',
  '-2':  'things that fit in a hand',
  '-1':  'things you cook with',
  '0':   'things taller than a child',
  '2':   'fields',
  '3':   'rivers',
  '6':   'seas',
  '9':   'the sun',
};

function showLadder() {
  const have = elements.filter(e => found.has(e.id) && SCALE[e.id]);
  const rungs = new Map();
  for (const e of have) {
    const k = SCALE[e.id].e;
    if (!rungs.has(k)) rungs.set(k, []);
    rungs.get(k).push(e);
  }
  const keys = [...rungs.keys()].sort((a, b) => b - a);       // biggest first

  // The gap between rungs is real information: a run of empty decades means
  // there is a whole scale of the world you have not touched yet.
  const top = keys[0], bottom = keys[keys.length - 1];
  const rows = [];
  for (let k = top; k >= bottom; k--) {
    const list = rungs.get(k);
    if (!list) {
      // Collapse a run of empty decades into one line. The gap still shows —
      // it is the most interesting thing on the page — but nineteen rungs of
      // "nothing here yet" would bury the things you do have.
      let run = k;
      while (run - 1 >= bottom && !rungs.has(run - 1)) run--;
      const n = k - run + 1;
      rows.push(`<div class="rung empty"><span class="mag">${magOf(k)}</span><i>` +
        (n === 1 ? 'nothing at this size yet'
                 : `${n} sizes down to ${magOf(run)} with nothing in them yet`) +
        `</i></div>`);
      k = run;
      continue;
    }
    rows.push(
      `<div class="rung"><span class="mag">${magOf(k)}</span>` +
      `<span class="rungname">${RUNG_LABEL[k] || ''} · ${list.length}</span>` +
      `<div class="shelf">${list.map(e =>
        `<span class="chip lad" data-entry="${e.id}">${chipHTML(e)}</span>`).join('')}</div></div>`);
  }

  const span = top - bottom;
  document.getElementById('sheetBody').innerHTML =
    `<p class="ladderlede">You hold things ${span} orders of magnitude apart —
      from ${nameOf(byId[have.find(e => SCALE[e.id].e === top).id])}
      down to ${nameOf(byId[have.find(e => SCALE[e.id].e === bottom).id])}.
      Every step between them is a recipe you can check.</p>` +
    `<div class="ladder">${rows.join('')}</div>`;
  openSheet('The ladder');
}

/**
 * Collapse every duplicate on the bench down to one card each.
 *
 * Turning the setting on and seeing nothing change would be worse than not
 * having it, so it runs over what is already there: the first card of each
 * kind is kept, every link pointing at a duplicate is rewired to the keeper,
 * and the duplicates go. Links that would then run from a card to itself are
 * dropped — those are the ones that only existed because two copies of Water
 * were two different things.
 */
function consolidateBench() {
  // A ghost chip (a scan hub, or an unresolved ingredient's placeholder)
  // has no dataset.id, so every one would read as the same "id" (undefined)
  // and get deduplicated down to one — different hubs, or different unmade
  // ingredients, losing all but one of themselves. None of them are ever
  // the same thing twice; leave them out of this entirely.
  const keep = new Map();
  const dead = [];
  for (const c of world.querySelectorAll('.chip.board:not(.ghost)')) {
    const id = c.dataset.id;
    if (keep.has(id)) dead.push(c); else keep.set(id, c);
  }
  if (!dead.length) return 0;
  const swap = (c) => (c && !c.classList.contains('ghost') && keep.get(c.dataset.id)) || c;
  for (let i = links.length - 1; i >= 0; i--) {
    const l = links[i];
    l.a = swap(l.a); l.b = swap(l.b); l.out = swap(l.out);
    if (l.out === l.a || l.out === l.b) { links.splice(i, 1); continue; }
    // The same pair may now appear twice; one line is enough.
    if (links.some((o, j) => j < i && o.out === l.out && o.a === l.a && o.b === l.b)) links.splice(i, 1);
  }
  for (const c of dead) c.remove();
  refreshFolds();
  drawLinks();
  return dead.length;
}

// ---------- reading a label ----------
/**
 * Turn the ingredients line off a packet into cards on the bench.
 *
 * The interesting discovery was that the drawing was never the hard part —
 * every element already chains back to stone, water, sun and seed with a
 * hand-drawn card at every step. What stops a label resolving is that a label
 * speaks a different language: it says Skim Milk where the game says milk,
 * Live Cultures where the game says bacteria, and Mineral Salt (Calcium
 * Citrate) where the game says calcium. So this is mostly a translation, and
 * the translation lives in data, not here.
 *
 * Three outcomes per phrase, and the third is the one worth having:
 *   found      — an element, and the chain that makes it
 *   vague      — a phrase the law lets a label use WITHOUT saying what it means
 *   unknown    — the game does not have it yet, said plainly
 */
/**
 * Does this element answer to that word?
 *
 * Searching the codex for "beef" found nothing, because the game calls it Meat
 * and search only ever looked at names. But data/labels.json already knows that
 * beef, pork, lamb and mutton all mean meat — it was written to read packets,
 * and it turns out to be the same question a player is asking when they type a
 * word the game does not use. So search asks it too.
 */
// An id -> [alias phrases] index, built once on first use.
//
// This function is called once per element per family, so on a 6,000-element
// corpus with ten families that is 60,000 calls per keystroke. It used to run
// Object.entries(LABELS.aliases) inside every one of them — 891 aliases, so
// ~52 million iterations and 60,000 throwaway arrays per letter typed. Typing
// in the Find box took 3.6 seconds a character, and a query matching NOTHING
// was the slowest of all, because it never returned early on the name and so
// always ran the whole alias scan. ("the find is incredibly slow. each letter
// takes a second or two to come up as i type" — measured at 3,661 ms with the
// scan, 49 ms without it.)
let ALIAS_BY_ID = null;
function aliasesFor(id) {
  if (!ALIAS_BY_ID) {
    ALIAS_BY_ID = new Map();
    for (const [phrase, target] of Object.entries(LABELS.aliases)) {
      let list = ALIAS_BY_ID.get(target);
      if (!list) ALIAS_BY_ID.set(target, list = []);
      list.push(phrase);
    }
  }
  return ALIAS_BY_ID.get(id);
}

function matchesSearch(e, q) {
  if (!q) return true;
  const n = nameOf(e).toLowerCase();
  if (n.includes(q)) return true;
  const alt = aliasesFor(e.id);
  if (alt) for (const phrase of alt) if (phrase.includes(q)) return true;
  return false;
}

function splitLabel(text) {
  // Real packets use round AND square brackets, and nest them: "chilli and lime
  // seasoning (7%) [sugar, maltodextrin, vegetable powder (garlic, onion), ...]".
  // Treating only round brackets as brackets glued half a list together — "chilli
  // and lime seasoning [sugar" came out as one ingredient. Square brackets are
  // normalised to round ones first, and then the split is depth-aware.
  const body = text
    .replace(/^[\s\S]*?ingredients\s*:/i, '')
    .replace(/^[\s\S]*?all natural ingredients/i, '')
    .replace(/[\[\{]/g, '(').replace(/[\]\}]/g, ')')
    .replace(/\(\s*\d+(\.\d+)?\s*%\s*\)/g, '');
  // Split on top-level commas — and top-level line breaks, which a
  // photographed label needs too: an "Active Ingredients" supplement panel
  // lists one ingredient per line with no comma anywhere ("Potassium (from
  // Potassium Chloride) 141.06 mg\nMagnesium (from...)..."), and without
  // this, OCR text like that reads as one unsplit blob and only the single
  // strongest match in the whole thing is found — everything else is
  // silently lost, not shown as unknown, just gone. A comma-separated list
  // that happens to wrap across a photographed line splits harmlessly the
  // same way; the only real cost is a name broken mid-phrase by the wrap,
  // which surfaces honestly as two unknowns rather than a wrong guess.
  const parts = [];
  let buf = '', depth = 0;
  for (const ch of body) {
    if (ch === '(') depth++;
    else if (ch === ')') depth = Math.max(0, depth - 1);
    if ((ch === ',' || ch === '\n') && depth === 0) { parts.push(buf); buf = ''; continue; }
    buf += ch;
  }
  parts.push(buf);

  const out = [];
  const push = (t) => {
    t = t.trim().replace(/[.;]$/, '').trim();
    if (t) out.push(t);
  };
  for (const part of parts) {
    const t = part.trim().replace(/[.;]$/, '');
    if (!t) continue;
    const m = t.match(/^(.*?)\s*\(([\s\S]*)\)$/);
    if (m) {
      // The outer word is usually a class ("Vegetable Gums", "food acids") and
      // the brackets hold the things it is actually made of. Keep both: the class
      // may be a phrase the law lets stand vague, and the contents are the answer.
      push(m[1]);
      for (const inner of splitLabel('ingredients:' + m[2])) push(inner);
    } else push(t);
  }
  return out;
}
const labelKey = (t) => t.toLowerCase().replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
function readIngredient(text) {
  const k = labelKey(text);
  // An E number is just a name, and packets often print the number alone —
  // "food acids (330, 262)". Try the number as a name before anything else.
  const eNum = k.match(/^e?\s?(\d{3,4}[a-z]?)$/);
  if (eNum) {
    const byE = LABELS.aliases['e' + eNum[1]];
    if (byE && byId[byE]) return { text, kind: 'found', id: byE };
    const nearE = LABELS.near?.['e' + eNum[1]];
    if (nearE && byId[nearE]) return { text, kind: 'near', id: nearE };
    return { text, kind: 'unknown', note: 'an E number this world does not know yet' };
  }
  // A phrase the law lets stand for anything is only vague if nothing INSIDE it
  // resolved — "acidity regulator (citric acid)" names its acid, so the class
  // word must not swallow it. The contents are pushed as their own entries by
  // splitLabel, so a bare class word here is genuinely all the label gave.
  if (LABELS.vague[k]) return { text, kind: 'vague', note: LABELS.vague[k] };
  // Longest alias first, so "locust bean gum" beats "gum".
  const alias = LABELS.aliases[k];
  if (alias && byId[alias]) return { text, kind: 'found', id: alias };
  // Contains it, but is not it. Calcium citrate is not calcium.
  const near = LABELS.near?.[k];
  if (near && byId[near]) return { text, kind: 'near', id: near };
  if (byId[k.replace(/ /g, '_')]) return { text, kind: 'found', id: k.replace(/ /g, '_') };
  const byName = elements.find(e => nameOf(e).toLowerCase() === k);
  if (byName) return { text, kind: 'found', id: byName.id };
  // A packet says what was DONE to a thing as well as what it is: "Lemon Juice",
  // "Ginger Powder", "Paprika Extract", "Glucose Syrup", "Tomato Puree". The game
  // had lemon and carrot all along and matched neither, because the preparation
  // word was part of the phrase. Strip the preparation and ask again — one rule
  // instead of an alias for every fruit times every way of processing it.
  const PREP = /\b(juice|powder|extract|syrup|puree|purée|concentrate|paste|flakes?|granules?|solids?|dried|ground|fresh|raw|whole|pure|natural|organic)\b/g;
  // A packet also pluralises — "Peanuts (30%)", "Raisins", "Live Cultures".
  // Singularising is crude on purpose: only the endings that are safe here, and
  // only tried AFTER the exact forms have failed, so it can never steal a match
  // from a word that genuinely ends in s.
  // "Tomatoes"/"potatoes" pluralise with -oes, and the bare-trailing-s rule
  // below turned that into "tomatoe"/"potatoe" — a real word away from a
  // match, which read as a genuine gap even though both were already
  // elements with existing aliases. Named explicitly rather than a general
  // -oes rule, which would just as happily mangle "shoes" into "sho".
  const OES = /\b(tomato|potato|mango)es\b/g;

    .replace(OES, '$1')
    .replace(/\b([a-z]+)ies\b/g, '$1y')
    .replace(/\b([a-z]+(?:ch|sh|ss|x|z))es\b/g, '$1')
    .replace(/\b([a-z]{3,})s\b/g, '$1');

  if (bare && bare !== k) {
    if (LABELS.aliases[bare] && byId[LABELS.aliases[bare]]) return { text, kind: 'found', id: LABELS.aliases[bare] };
    if (byId[bare.replace(/ /g, '_')]) return { text, kind: 'found', id: bare.replace(/ /g, '_') };
    const bareName = elements.find(e => nameOf(e).toLowerCase() === bare);
    if (bareName) return { text, kind: 'found', id: bareName.id };
    if (LABELS.near?.[bare] && byId[LABELS.near[bare]]) return { text, kind: 'near', id: LABELS.near[bare] };
  }
  // A contained alias: "organic skim milk powder" contains "skim milk". This
  // has to check real element names too, not just the curated alias list —
  // "milk" itself was never added as an alias because the EXACT match above
  // already catches bare "milk", so "cow's milk" (not an exact match, and not
  // a substring of any curated alias like "skim milk") fell all the way
  // through to unknown despite plainly containing the word "milk". Near
  // phrases compete in the same pass, on the same longest-wins rule, so
  // "calcium citrate" inside a longer phrase still reads as built-from
  // calcium rather than being swallowed by a shorter bare-name "found".
  // "Roasted peanuts" fell through here too, and for a different reason
  // than milk did: "roasted" isn't a PREP word, so the exact-match block
  // above never gets a clean "peanut" to test — but it DID already compute
  // `bare` = "roasted peanut" (singularizing runs over the whole phrase,
  // not just an isolated word). Testing only against `k` meant the plural
  // "s" was still attached, so `\bpeanut\b` never found a word boundary to
  // land on. `bare` is right there, already paid for; use it too.
  let best = null;
  const consider = (phrase, kind, id) => {
    if (!phrase || !byId[id]) return;
    const re = new RegExp(`\\b${phrase.replace(/ /g, '\\s+')}\\b`);
    const hit = re.test(k) || re.test(bare);
    if (hit && (!best || phrase.length > best[0].length || (phrase.length === best[0].length && kind === 'near'))) best = [phrase, kind, id];

  for (const e of elements) consider(nameOf(e).toLowerCase(), 'found', e.id);
  if (best) return { text, kind: best[1], id: best[2] };
  for (const [v, note] of Object.entries(LABELS.vague))
    if (new RegExp(`\\b${v.replace(/ /g, '\\s+')}\\b`).test(k)) return { text, kind: 'vague', note };
  return { text, kind: 'unknown' };
}

 * instead of "INGREDIENTS: Active Blend (Creatine..." off a photo the
 * splitLabel fix above couldn't help, because the text itself was never
 * read correctly in the first place. Grayscale, a min/max contrast
 * stretch, and flipping to black-on-white whenever the photo is mostly

 * text recognition happens.

async function preprocessForOCR(source) {

  // same accuracy either way (Tesseract's own accuracy plateaus well below
  // this size; the extra pixels were pure runtime cost).

    const g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    gray[p] = g;
    sum += g;

  // A curved bottle or tin does not carry one contrast level end to end —
  // the near edge catches more light than the far edge, so a single global
  // lo/hi stretch either blows out the bright side or leaves the dim side
  // too flat to read. Splitting the image into a coarse grid, measuring
  // lo/hi within each tile, and blending between neighbouring tiles
  // (bilinearly, so there are no hard seams at tile edges) gives every
  // patch of the label its own real contrast instead of one borrowed from
  // the whole photo. Found live: a curved supplement bottle's first two
  // ingredient lines — the most curved, most unevenly lit part of the
  // label — read as "sete? + TEER --- & -- ; Alpha aT ANE" while the
  // flatter lines below them, lit more evenly, came through close to
  // correct under the very same global stretch.
  const TILE = 64;
  const tilesX = Math.max(1, Math.ceil(w / TILE)), tilesY = Math.max(1, Math.ceil(h / TILE));
  const tLo = new Float32Array(tilesX * tilesY).fill(255);
  const tHi = new Float32Array(tilesX * tilesY).fill(0);
  for (let y = 0; y < h; y++) {
    const ty = Math.min(tilesY - 1, (y / TILE) | 0);

      const tx = Math.min(tilesX - 1, (x / TILE) | 0);

      const fx = x / TILE - 0.5, tx0 = Math.floor(fx), fx1 = fx - tx0;
      const lo =

        at(tLo, tx0, ty0 + 1) * (1 - fx1) * fy1 + at(tLo, tx0 + 1, ty0 + 1) * fx1 * fy1;

        at(tHi, tx0, ty0) * (1 - fx1) * (1 - fy1) + at(tHi, tx0 + 1, ty0) * fx1 * (1 - fy1) +

        <div><b>${esc(s.product.product_name || 'Unnamed product')}</b>

        ${s.text ? '' : '<i>No ingredients text on record</i>'}</div>
      </div>`).join('') +
      (withText.length ? `<div class="cardrow" style="margin-top:9px">
         <button class="ghost" id="bcUse">Read ingredients from ${withText.length === 1 ? 'this product' : withText.length + ' products'}</button></div>`
       : '');
    const use = document.getElementById('bcUse');
    // OFF's own ingredients_text field never carries the "Ingredients:"
    // label itself — prefixing it here is what makes it read like a real
    // label line. Text read off a photo by OCR already has that word on it
    // if the packet did, so prefixing again would just double it.
    if (use) use.onclick = () => onIngredients(withText.map(s => (s.code ? 'Ingredients: ' : '') + s.text).join(', '), withText);
  }

  const addScan = async (code) => {
    if (scanned.some(s => s.code === code) || pending.has(code)) return;
    pending.add(code);
    status.innerHTML = '<p class="hint2">Asking Open Food Facts…</p>';
    let product;
    try { product = await fetchOFFProduct(code); }
    catch { status.innerHTML = '<p class="none">Could not reach Open Food Facts — check the connection and try again.</p>'; pending.delete(code); return; }
    pending.delete(code);
    if (!product) {
      status.innerHTML = `<p class="none">Barcode ${code} is not in Open Food Facts. Anyone can add it
        there — or paste the ingredients in by hand instead.</p>`;
      return;
    }
    // Open Food Facts is edited by anyone, and a language-specific field can
    // hold garbage while the base field is fine — found live: a real product
    // whose ingredients_text_en was the literal string "CURL_ING_OVERRIDE_…",
    // evidently a test script's leftovers, while ingredients_text held the
    // genuine (French) list. Real ingredient text has letters and a comma or
    // a space in it; a field that doesn't is not trusted, and the base field
    // is tried instead rather than showing the garbage as if it were the
    // product. Letters, not lowercase specifically — a real bug, found live:
    // a packet's ingredients are routinely printed in ALL CAPS ("POPCORN
    // (80%), SUNFLOWER OIL-HI OLEIC, SEA SALT…"), and the lowercase-only
    // check was discarding that genuine text as if it were the same kind of
    // garbage as CURL_ING_OVERRIDE.
    const looksReal = (t) => !!t && /[a-zA-Z]/.test(t) && /[\s,]/.test(t);
    const text = looksReal(product.ingredients_text_en) ? product.ingredients_text_en
               : looksReal(product.ingredients_text) ? product.ingredients_text : '';
    status.innerHTML = '';
    scanned.push({ code, product, text });
    // Every successful find gets a toast, the first included — the result
    // itself lands in #bcOut, below the live camera view, easy to miss while
    // actually holding the phone up to a barcode; without this, a scan that
    // worked and one that silently didn't looked identical.
    toast(scanned.length === 1 ? `Found ${product.product_name || 'that product'}`
                                : `Added ${product.product_name || 'that product'} — ${scanned.length} scanned so far`);
    render();
  };
  // A photo with no readable barcode still has a real ingredients line
  // printed on it somewhere — read that instead of just reporting a miss.
  // No barcode means no Open Food Facts lookup, so this scan has no code,
  // no brand, no photo of its own; it is still a real find, just one with a
  // narrower story than a barcode scan can tell.
  const addOcrScan = (text) => {
    const product = { product_name: 'Read from a photo' };
    scanned.push({ code: null, product, text });
    toast(scanned.length === 1 ? 'Read ingredients from a photo'
                                : `Read another photo — ${scanned.length} scanned so far`);
    render();
  };
  document.getElementById('bcGo').onclick = () => {
    const code = (document.getElementById('bcIn').value || '').replace(/\D/g, '');
    if (!code) { status.innerHTML = '<p class="none">Type the digits under the barcode.</p>'; return; }
    document.getElementById('bcIn').value = '';
    addScan(code);
  };
  document.getElementById('bcIn').addEventListener('keydown', ev => { if (ev.key === 'Enter') document.getElementById('bcGo').click(); });

  // Camera and photo both work everywhere now: native BarcodeDetector where
  // it exists, the vendored zxing-wasm fallback everywhere it doesn't
  // (Safari, on iOS or macOS — every browser there, Chrome included, since
  // Apple requires them all to run its engine). decodeBarcodes picks whichever
  // is available; this row no longer needs to know or care which one.
  document.getElementById('bcCameraRow').hidden = skipRow;
  // capture="environment" only means anything on a touch device — on a
  // desktop browser it is silently ignored and the input falls back to the
  // exact same file-choose dialog "Choose photos" already opens, so the
  // second button offered no real second option, just a misleading label
  // ("it pops up with the 'select files to upload' overlay" — found live).
  const HAS_CAMERA_INPUT = matchMedia('(pointer: coarse)').matches;
  document.getElementById('bcSnap').hidden = !HAS_CAMERA_INPUT || autoAction === 'photo';
  // The row itself stays for 'snap'/'photo' (see skipRow above) so there's
  // still something to retry with — but the OTHER two methods, the ones
  // not picked, are real clutter now that the sheet is meant to be focused
  // on the one that was.
  document.getElementById('bcCamera').hidden = autoAction === 'snap' || autoAction === 'photo';
  document.getElementById('bcPhoto').hidden = autoAction === 'snap';
  const decodePicked = async (files) => {
    if (!files.length) return;
    let misses = 0;
    for (const file of files) {
      status.innerHTML = `<p class="hint2">Reading photo ${files.indexOf(file) + 1} of ${files.length}…</p>`;
      const codes = await decodeBarcodes(file);
      if (codes.length) { await addScan(codes[0]); continue; }
      status.innerHTML = `<p class="hint2">No barcode in photo ${files.indexOf(file) + 1} of ${files.length} — reading the text instead…</p>`;
      let text = '';
      try { text = await ocrImage(file); } catch {}
      if (text.trim()) addOcrScan(text); else misses++;
    }
    status.innerHTML = misses
      ? `<p class="none">${misses} of ${files.length} photo${files.length === 1 ? '' : 's'} had no readable barcode or text.</p>` : '';
  };
  document.getElementById('bcPhoto').onclick = () => document.getElementById('bcFile').click();
  document.getElementById('bcFile').onchange = (ev) => {
    const files = [...ev.target.files];
    ev.target.value = '';                         // lets the same photo be picked again
    decodePicked(files);
  };
  // A dedicated capture="environment" input jumps straight into the camera
  // app on a real device — no chooser sheet in between. That sheet (Photo
  // Library / Files / Choose Files / any cloud provider) is the OS's own
  // UI once a plain file input is tapped; a page can skip past it entirely
  // this way, but can't split "Photos" from "Files" from "Drive" into
  // separate direct buttons of their own — that combined list is Apple's
  // decision, not something a web page controls.
  document.getElementById('bcSnap').onclick = () => document.getElementById('bcSnapFile').click();
  document.getElementById('bcSnapFile').onchange = (ev) => {
    const files = [...ev.target.files];
    ev.target.value = '';
    decodePicked(files);
  };
  document.getElementById('bcCamera').onclick = async () => {
    const video = document.getElementById('bcVideo');
    const controls = document.getElementById('bcCameraControls');
    // "Scan with the camera still does nothing" — reported live, more than
    // once, with the barcode-lookup half confirmed correct each time. What
    // was never confirmed: whether the live decode loop is even attempting
    // a read, or silently finding nothing the whole time something sits in
    // frame. This is that missing half — a live, honest readout of what the
    // loop is actually doing, not a guess about why the next report might
    // still say "nothing happens".
    const dbg = document.getElementById('bcDebug');
    let framesChecked = 0, decodeAttempts = 0, decodeErrors = 0, decodeHits = 0;
    const paintDebug = () => {
      dbg.hidden = false;
      dbg.textContent = `${framesChecked} frame${framesChecked === 1 ? '' : 's'} seen · ` +
        `${decodeAttempts} decode attempt${decodeAttempts === 1 ? '' : 's'}` +
        (decodeErrors ? ` (${decodeErrors} errored)` : '') +
        ` · ${decodeHits} found`;
    };
    let stream, raf;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    } catch {
      // Told to type the barcode instead, on a sheet that hid the very field
      // to type it into — autoAction:'camera' skips the manual-entry row on
      // the assumption the camera will actually open. When the OS or browser
      // blocks it (a denied or since-revoked permission), that assumption
      // was wrong, and the toast's own advice became impossible to follow —
      // Close was the only thing left on the sheet. ("barcode doesnt even
      // let me enter a barcode anymore" — found live.) A failed camera falls
      // back to the full picker, not just a dead end with a suggestion.
      toast('Could not open the camera — type the barcode instead');
      document.getElementById('bcIn').closest('.cardrow').hidden = false;
      document.getElementById('bcCameraRow').hidden = false;
      document.getElementById('bcIn').focus();
      return;
    }
    if (!('BarcodeDetector' in window)) { status.innerHTML = '<p class="hint2">Loading the barcode reader…</p>'; await loadZXing().catch(() => {}); status.innerHTML = ''; }
    // A capture canvas, reused every frame rather than recreated — zxing has
    // no native-video overload the way BarcodeDetector does, so a fallback
    // frame has to be drawn out to pixels before it can be decoded at all.
    const cap = document.createElement('canvas');
    const capCtx = cap.getContext('2d', { willReadFrequently: true });
    video.srcObject = stream;
    video.classList.add('on');
    controls.hidden = false;
    paintDebug();
    await video.play().catch(() => {});
    const stop = () => {
      cancelAnimationFrame(raf); stream.getTracks().forEach(t => t.stop());
      video.classList.remove('on'); controls.hidden = true; dbg.hidden = true;
      if (activeCameraStop === stop) activeCameraStop = null;
    };
    activeCameraStop = stop;
    document.getElementById('bcStopCam').onclick = stop;
    // Stays open across finds rather than closing after the first, so a
    // whole run of products can be scanned in one pass of the camera —
    // addScan itself skips a code already collected, so lingering on the
    // same barcode for several frames in a row is harmless. The loop only
    // starts a new decode once the last one finished — a WASM decode can
    // take longer than a frame, and queuing more of them up behind it would
    // only make the video feel laggier without scanning any faster.
    let busy = false;
    const tick = async () => {
      if (!video.isConnected) { stop(); return; }        // the sheet closed mid-scan
      if (!busy && video.videoWidth) {
        busy = true;
        framesChecked++;
        try {
          decodeAttempts++;
          let codes;
          if ('BarcodeDetector' in window) {
            codes = await decodeBarcodes(video);
          } else {
            cap.width = video.videoWidth; cap.height = video.videoHeight;
            capCtx.drawImage(video, 0, 0);
            codes = await decodeBarcodes(capCtx.getImageData(0, 0, cap.width, cap.height));
          }
          if (codes.length) { decodeHits++; addScan(codes[0]); }
        } catch { decodeErrors++; }
        paintDebug();
        busy = false;
      }
      raf = requestAnimationFrame(tick);
    };
    tick();
  };
  // The floating canvas toolbar is a direct shortcut into whichever control
  // this same sheet already has — one auto-click, nothing duplicated.
  if (autoAction === 'camera') document.getElementById('bcCamera').click();
  else if (autoAction === 'snap') document.getElementById('bcSnap').click();
  else if (autoAction === 'photo') document.getElementById('bcPhoto').click();
  else if (autoAction === 'type') document.getElementById('bcIn').focus();
}

function labelResultHTML(parsed, forHub) {
  if (!parsed.length) return '<p class="none">Nothing to read yet.</p>';
  const found = parsed.filter(p => p.kind === 'found');
  const near = parsed.filter(p => p.kind === 'near');
  const vague = parsed.filter(p => p.kind === 'vague');
  const unknown = parsed.filter(p => p.kind === 'unknown');
  const depth = (id) => orderedSteps(id).length;
  const row = (p) => {
    const e = byId[p.id];
    const n = depth(p.id);
    const al = ALLERGEN_BY_ELEMENT[p.id];
    return `<div class="ent in"><span class="g" data-entry-any="${p.id}">${glyph(p.id, 19)} ${nameOf(e)}</span>` +
      `<span class="arw">←</span><span class="g">${n ? `${n} step${n === 1 ? '' : 's'} from the starters` : 'a starter'}</span>` +
      (al ? al.map(a => `<i class="allergen-tag" title="${a.name} — a regulated allergen">${a.name}</i>`).join('') : '') +
      `</div>`;
  };
  const allergensHere = [...new Map(found.flatMap(p => ALLERGEN_BY_ELEMENT[p.id] || [])
    .map(a => [a.key, a])).values()];
  return `<h2>Found · ${found.length} of ${parsed.length}</h2>` +
    (unknown.length ? `<p class="missNote">Not found: ${unknown.map(p => p.text).join(', ')}</p>` : '') +
    (allergensHere.length ? `<div class="allergen-banner">` +
      `Contains ${allergensHere.map(a => a.name).join(', ')} — regulated allergen${allergensHere.length === 1 ? '' : 's'}.` +
      `</div>` : '') +
    (found.length ? found.map(row).join('') : '<p class="none">None of these yet.</p>') +
    (near.length ? `<h2>Built from · ${near.length}</h2>` + near.map(p =>
      `<div class="ent in"><span class="g">${p.text}</span><span class="arw">→</span>` +
      `<span class="g" data-entry-any="${p.id}">${glyph(p.id, 19)} ${nameOf(byId[p.id])}</span></div>`).join('') +
      `<p class="hint2">These are not that element — calcium citrate contains calcium, it is not
        calcium — so the game shows what it is built from rather than claiming they are the same.</p>` : '') +
    // A scanned product still gets a hub — with a blank box for everything
    // this world doesn't have yet — even when nothing at all resolved, so
    // the button has to show up for that case too; pasted text with zero
    // found/near has nothing placeable and stays button-less.
    (found.length || near.length || (forHub && parsed.length) ? `<div class="cardrow" style="margin:10px 0">
        <button class="ghost" id="labelPut">${forHub ? 'Add to canvas' : `Put ${found.length + near.length} on the bench`}</button></div>` : '') +
    (vague.length ? `<h2>Says nothing · ${vague.length}</h2>` + vague.map(p =>
      `<div class="ent"><span class="g">${p.text}</span></div><p class="hint2">${p.note}</p>`).join('') : '') +
    (unknown.length ? `<h2>Not in this world yet · ${unknown.length}</h2><div class="shelf">` +
      unknown.map(p => `<span class="chip locked missing" style="--cw:auto;width:auto">${p.text}</span>`).join('') +
      `</div><p class="hint2">Each of these is a real thing with a real story — they are simply
        not built yet. Nothing here is invented to fill a gap.</p>` : '');
}

// ---------- shelf + buttons ----------
// Tapping a shelf chip drops it on the bench; dragging one carries it to a spot
// you choose. Both work, because on a phone a tap is quicker and on a desktop a
// drag is what the hand expects.
let shelfDrag = null;
let lastShelfTap = { id: null, t: 0 };

// Free Play hands you everything at once, which means a thing you place there
// was never actually built — it has no ancestors, so "Where it came from"
// would have nothing to show. This builds the real chain that makes it, using
// the same route the hint panel would point you to, and folds every step
// except the one you asked for — exactly like a card you built by hand.
function materialize(r, chips) {
  const el = spawn(r.out, null, null, chips);
  links.push({ a: chips[0], b: chips[1] ?? null, out: el, fresh: true });
  el.classList.add('folded');
  return el;
}
function buildChain(id, x, y) {
  // Captured before a single ancestor is spawned, and restored below — see
  // the note by ensureVisible(el) further down for why.
  const view0 = { x: view.x, y: view.y };
  const steps = orderedSteps(id);
  const chipFor = new Map();
  // Every chip THIS call actually creates, as opposed to one it reuses from
  // an existing board via prefs.consolidate — see the translate step below
  // for why the distinction matters.
  const fresh = new Set();
  // "A fresh copy each time you need one" has to mean that for the very
  // thing you asked to place, not just for the ancestors quietly built
  // alongside it — reusing an existing board chip here ignored
  // prefs.consolidate entirely. ("toggling on and off, no difference,
  // still cant add 2 suns" — found live.)
  if (prefs.consolidate) {
    for (const c of world.querySelectorAll('.chip.board:not(.hidden)')) {
      if (!chipFor.has(c.dataset.id)) chipFor.set(c.dataset.id, c);
    }
  }
  const ensure = (iid) => {
    if (chipFor.has(iid)) return chipFor.get(iid);
    const el = spawn(iid);
    chipFor.set(iid, el);
    fresh.add(el);
    return el;
  };
  for (const r of steps) {
    if (chipFor.has(r.out)) continue;
    const parents = r.in.map(ensure);
    const out = materialize(r, parents);
    chipFor.set(r.out, out);
    fresh.add(out);
  }
  const el = chipFor.get(id) || ensure(id);
  if (x != null) {
    // Every ancestor above was spawned via bare spawn(iid) — no x, no y, no
    // anchor at all — so it landed wherever freeSpot's context-free default
    // happened to be, with nothing relating it to the chain it's actually
    // part of. Only `el` itself (the one thing this call was asked to
    // place) ever got a real position, which is exactly why a deep chain
    // read as "the result landed here, and one real ancestor is stranded
    // hundreds of pixels away with a single long line back to it."
    // ("lizard was NOT on board before" — Snake's own freshly-built Lizard
    // ancestor, confirmed live.) runTidy() gives the WHOLE fresh chain a
    // real layout relative to itself first — then, since tidy() has no
    // notion of "anchor this at a point," the entire chain is slid as one
    // rigid piece so `el` ends up exactly at the drop point, preserving
    // whatever sensible relative arrangement tidy() just gave everything
    // else in it.
    //
    // But tidy()/circleTidy() lay out EVERY chip on the board, not just this
    // call's own fresh set — so calling it whenever anything else already
    // sits on the board silently rearranges chips nobody touched, just from
    // placing one new item. ("you restructure my board, and try tidy it up?
    // why? all i want is the object on my board, if i want to tidy it up i
    // will click the button" — found live.) Only worth it when the fresh
    // chain genuinely IS the whole board right now — nothing else to
    // disturb — otherwise skip straight to sliding the chain by its own
    // already-assigned spawn() positions, leaving every pre-existing chip
    // exactly where the player put it.
    const somethingElseOnBoard = world.querySelectorAll('.chip.board').length > fresh.size;
    if (!somethingElseOnBoard) runTidy();
    view.x = view0.x; view.y = view0.y; applyView();
    const [cw, ch] = cardSize();
    const dx = (x - cw / 2) - (parseFloat(el.style.left) || 0);
    const dy = (y - ch / 2) - (parseFloat(el.style.top) || 0);
    for (const c of fresh) {
      c.style.left = (parseFloat(c.style.left) + dx) + 'px';
      c.style.top  = (parseFloat(c.style.top) + dy) + 'px';
    }
    el.style.left = (x - cw / 2) + 'px';
    el.style.top  = (y - ch / 2) + 'px';
    drawLinks();
    ensureVisible(el);
  }
  refreshFolds();
  save();
  return el;
}
// The one entry point placement should go through: builds the real chain in
// Free Play (where nothing has real ancestors yet), just places it otherwise.
function placeItem(id, x, y) {
  pushUndo(`putting ${nameOf(byId[id])} on the bench`);
  return prefs.freePlay ? buildChain(id, x, y) : spawn(id, x, y);
}
// Tapping a locked tool explains itself rather than doing nothing.
document.getElementById('tray').addEventListener('click', ev => {
  const v = ev.target.closest('.verb.locked');
  if (!v) return;
  const key = byId[v.dataset.needs];
  sfx.nope();

// A verb tile can go the other way too: pick it up and carry it onto a card
// on the bench, exactly as if you had dragged the card onto the tray.
let verbDrag = null;
document.getElementById('tray').addEventListener('pointerdown', ev => {
  const v = ev.target.closest('.verb:not(.locked)');
  if (!v) return;
  verbDrag = { id: v.dataset.verb, x: ev.clientX, y: ev.clientY, moved: false, ghost: null };
});
addEventListener('pointermove', ev => {
  if (!verbDrag) return;
  if (!verbDrag.moved && Math.hypot(ev.clientX - verbDrag.x, ev.clientY - verbDrag.y) < 7) return;
  if (!verbDrag.moved) {
    verbDrag.moved = true;
    const v = verbs.find(x => x.id === verbDrag.id);
    const g = document.createElement('div');
    g.className = 'verb drag';
    g.style.position = 'fixed'; g.style.pointerEvents = 'none'; g.style.zIndex = 400;
    g.innerHTML = `<span class="e">${glyph('verb_' + v.id, 27)}</span>${v.name}`;
    document.body.appendChild(g);
    verbDrag.ghost = g;
  }
  verbDrag.ghost.style.left = (ev.clientX - 42) + 'px';
  verbDrag.ghost.style.top  = (ev.clientY - 20) + 'px';
  // Carrying a tool ONTO a card is the same gesture as carrying a card onto a
  // tool, so it gets the same dial. Rest Heat on limestone and the number
  // climbs; let go at 900 and you have quicklime. This direction had the whole
  // mechanism sitting there unused, which is why holding a verb over a thing
  // did nothing but wait for you to drop it.
  const over = hit(ev.clientX, ev.clientY);
  const chip = over && over.classList.contains('board') && !over.classList.contains('cooking') ? over : null;
  const key = chip ? chip.dataset.id + '|' + verbDrag.id : null;
  if (key && bands.has(key)) {
    const verbEl = document.querySelector(`.verb[data-verb="${verbDrag.id}"]`);
    if (verbEl) startHeat(chip, verbEl, key);
  } else stopHeat();
  document.querySelectorAll('.target').forEach(n => n.classList.remove('target'));
  if (chip) chip.classList.add('target');
});
addEventListener('pointerup', ev => {
  if (!verbDrag) return;
  const { id, moved, ghost } = verbDrag; verbDrag = null;
  ghost?.remove();
  document.querySelectorAll('.target').forEach(n => n.classList.remove('target'));
  if (!moved) { stopHeat(); return; }                  // a plain tap on an open verb does nothing
  // If the dial was climbing, letting go IS the choice — it has already picked
  // a temperature and must not also fall through to a plain drop.
  if (heating) { releaseHeat(); return; }
  const t = hit(ev.clientX, ev.clientY);
  const verbEl = document.querySelector(`.verb[data-verb="${id}"]`);
  if (t && t.classList.contains('board') && verbEl) applyProcess(t, verbEl);
});

                hold: setTimeout(() => { if (shelfDrag && !shelfDrag.moved) { shelfDrag = null; openAbout(c.dataset.spawn); } }, 520) };

addEventListener('pointermove', ev => {
  if (!shelfDrag) return;
  if (!shelfDrag.moved && Math.hypot(ev.clientX - shelfDrag.x, ev.clientY - shelfDrag.y) < 7) return;
  if (!shelfDrag.moved) {

// Lay the opening bench out on a grid sized to the board.
let benchTouched = false;
/**
 * The opening bench: the things you start with, laid out as a grid.
 *
 * Spacing is derived from the card, not from a fraction of the board. Spacing
 * by fraction meant that on a narrow board the four starting cards were placed
 * 74px apart vertically — which is less than a card is tall, so they
 * overlapped.
 */
function layOutBench() {
  const r = boardBox();
  const [cw, ch] = cardSize();
  const GAP = 26;
  const bench = [...world.querySelectorAll('.chip.board')];
  if (!bench.length) return;

  const fit = Math.max(1, Math.floor((r.width - 24) / (cw + GAP)));
  const cols = Math.min(bench.length, fit);
  const rows = Math.ceil(bench.length / cols);
  const gridW = cols * cw + (cols - 1) * GAP;
  const gridH = rows * ch + (rows - 1) * GAP;
  const x0 = Math.max(12, (r.width - gridW) / 2);
  const y0 = Math.max(12, (r.height - gridH) / 2);

  bench.forEach((el, i) => {
    el.style.left = (x0 + (i % cols) * (cw + GAP)) + 'px';
    el.style.top  = (y0 + Math.floor(i / cols) * (ch + GAP)) + 'px';
  });
}

// The board's size is not trustworthy on first paint — in an embedded frame it
// can be measured before the viewport settles, which strands every chip in a
// clamped heap. Watch it instead of measuring once, and keep re-laying the
// opening bench until the player actually moves something. After that, only
// clamp strays back into view so a rotation cannot lose them.
new ResizeObserver(() => {
  // A restored bench already has positions the player chose. Only the opening
  // four get laid out, and only until something is moved.

  if (!benchTouched && !restoredBench) { layOutBench(); drawIntro(); return; }

/**
 * Layout self-check.
 *
 * Cards overlapping is not a bug you can see reliably — at a glance a crowded
 * bench looks like a crowded bench. Every placement bug in this file was found
 * by counting, so the count is a function you can call:
 *
 *     selfTest()        // in the console, or from a test harness
 *
 * It spawns a bench, counts overlapping pairs, and puts everything back.
 */
function selfTest(n = 80) {
  const before = new Set([...world.querySelectorAll('.chip.board')].map(c => c.dataset.id));
  const held = new Set(found);                       // a test must not change a save
  elements.slice(0, n).forEach(e => { found.add(e.id); spawn(e.id); });
  const cards = [...world.querySelectorAll('.chip.board')];
  const [cw, ch] = cardSize();
  const at = cards.map(c => [parseFloat(c.style.left), parseFloat(c.style.top)]);
  let overlaps = 0, offGrid = 0;
  for (let i = 0; i < at.length; i++) {
    if (!isFinite(at[i][0]) || !isFinite(at[i][1])) offGrid++;
    for (let j = i + 1; j < at.length; j++) {
      if (Math.abs(at[i][0] - at[j][0]) < cw && Math.abs(at[i][1] - at[j][1]) < ch) overlaps++;
    }
  }
  cards.forEach(c => { if (!before.has(c.dataset.id)) c.remove(); });
  found.clear(); held.forEach(id => found.add(id));
  renderShelf();
  drawLinks();
  const result = { cards: cards.length, overlaps, offGrid, cardSize: [cw, ch], pass: !overlaps && !offGrid };
  console.log(result.pass ? '✓ layout ok' : '✗ layout broken', result);
  return result;
}
window.selfTest = selfTest;

/**
 * Smoke test.
 *
 * Renders every panel for every element, in every theme, and reports anything
 * that throws. It exists because most of what this file does is build HTML
 * strings from data, and a template that references a field one element happens
 * not to have will look completely fine until someone opens that one element.
 *
 *     smokeTest()
 *
 * It leaves your progress alone: everything it does is rendering.
 */
function smokeTest() {
  const errors = [];
  const run = (label, fn) => { try { fn(); } catch (e) { errors.push(`${label}: ${e.message}`); } };
  const held = new Set(found);
  elements.forEach(e => found.add(e.id));            // render even the unreached

  run('codex', () => showCodex());
  run('ladder', () => showLadder());
  run('settings', () => showSettings());

    run(`hint:${e.id}`, () => showHint(e.id));
    run(`story:${e.id}`, () => showEntry(e.id, 'cards'));
