<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Loam — dirt to dinner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='26' fill='%23221C14'/%3E%3Cg stroke='%235C4B38' stroke-width='3' fill='none' stroke-linecap='round'%3E%3Cpath d='M28 34 Q44 54 56 66'/%3E%3Cpath d='M50 26 Q54 48 58 64'/%3E%3Cpath d='M70 26 Q66 48 62 64'/%3E%3Cpath d='M92 34 Q76 54 64 66'/%3E%3C/g%3E%3Ccircle cx='28' cy='34' r='8' fill='%239C8A74'/%3E%3Ccircle cx='50' cy='26' r='8' fill='%234E8CB8'/%3E%3Ccircle cx='70' cy='26' r='8' fill='%23E0A526'/%3E%3Ccircle cx='92' cy='34' r='8' fill='%236B8E4E'/%3E%3Crect x='42' y='66' width='36' height='30' rx='9' fill='%23E2703A'/%3E%3C/svg%3E">
<style>
  :root{
    --cream:#F6EDDD; --ink:#2B2118; --ink-soft:#6B5945;
    --orange:#E2703A; --mustard:#E0A526; --avocado:#6B8E4E; --brick:#A63D2F; --teal:#3E7C7B;
    --card:#FFF9EE; --line:#E0CFB4;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    font:15px/1.45 ui-rounded,"SF Pro Rounded",Avenir,system-ui,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 18% 12%, #FBE4C4 0%, transparent 46%),
      radial-gradient(circle at 84% 78%, #E8DCC0 0%, transparent 52%),
      var(--cream);
    display:flex;flex-direction:column;user-select:none;
  }
  header{
    display:flex;align-items:center;gap:14px;padding:10px 16px;
    border-bottom:2px solid var(--line);background:rgba(255,249,238,.72);backdrop-filter:blur(8px);flex:none;
  }
  h1{font:700 17px/1 ui-rounded,Avenir,system-ui;margin:0;letter-spacing:-.2px}
  h1 span{color:var(--orange)}
  .mark{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;flex:none}
  .mark svg{width:26px;height:26px;border-radius:7px;flex:none;display:block}
  .goal{
    font-size:12.5px;color:var(--ink-soft);background:#fff;border:1.5px solid var(--line);
    border-radius:99px;padding:5px 12px;
  }
  .goal b{color:var(--brick)}
  .spacer{flex:1}
  .count{font:700 13px ui-rounded,Avenir;color:var(--avocado)}
  button{
    font:600 13px ui-rounded,Avenir,system-ui;color:var(--ink);cursor:pointer;
    background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:6px 13px;
  }
  button:active{transform:translateY(1px)}
  main{flex:1;display:flex;min-height:0}
  #board{flex:1;position:relative;overflow:hidden;touch-action:none}
  /* the canvas: an unbounded world you pan and zoom, not a fixed bench */
  #world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  #links{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
  #links line{stroke:var(--line);stroke-width:2.5;stroke-linecap:round}
  #links line.made{stroke:var(--avocado);stroke-width:3;opacity:.55}
  #zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:5px;z-index:6}
  #zoom button{
    width:32px;height:32px;padding:0;font:700 15px ui-rounded,Avenir;border-radius:10px;
    background:rgba(255,249,238,.92);
  }
  #board{cursor:grab}
  #board.panning{cursor:grabbing}
  #intro{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;
    width:min(330px,86%);text-align:center;padding:22px 20px 18px;
    background:var(--card);border:2.5px solid var(--ink);border-radius:20px;
    box-shadow:0 10px 0 rgba(43,33,24,.15);
  }
  #intro b{display:block;font:800 19px ui-rounded,Avenir;margin-bottom:9px}
  #intro p{font-size:13.5px;line-height:1.55;color:var(--ink-soft);margin:0 0 9px}
  #intro p.sub{color:var(--ink);font-weight:600}
  #intro button{background:var(--orange);color:#fff;border-color:var(--brick);padding:8px 24px;margin-top:4px}
  #intro.gone{display:none}
  aside{
    width:212px;flex:none;border-left:2px solid var(--line);background:rgba(255,249,238,.72);
    overflow-y:auto;padding:10px;
  }
  aside h2{
    font:700 10.5px/1 ui-rounded,Avenir;letter-spacing:.9px;text-transform:uppercase;
    color:var(--ink-soft);margin:12px 4px 7px;
  }
  aside h2:first-child{margin-top:2px}
  .shelf{display:flex;flex-wrap:wrap;gap:5px}
  .chip{
    display:inline-flex;align-items:center;gap:5px;background:var(--card);
    border:1.5px solid var(--line);border-radius:99px;padding:5px 10px 5px 7px;
    font:600 12.5px ui-rounded,Avenir,system-ui;white-space:nowrap;cursor:grab;
    box-shadow:0 1px 0 rgba(43,33,24,.07);
  }
  .chip .e{font-size:15px;line-height:1}
  .chip.folk{border-color:#D9C3E8;background:#FBF4FF}
  .chip.spent{opacity:.42}
  /* a chip mid-process: a ring fills as it rests, and it cannot be dragged */
  .chip.board.cooking{
    cursor:default;
    background:
      conic-gradient(var(--teal) var(--p,0%), transparent 0) border-box,
      var(--card) padding-box;
    border-color:transparent;padding:9px 15px 9px 11px;
  }
  .chip.board.cooking::after{
    content:attr(data-verb-label);position:absolute;top:-8px;right:-6px;font-size:13px;
    background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:1px 4px;
  }
  .chip.board.cooking .n{display:none}
  #waiting{color:var(--teal);font-weight:700}
  .chip.live{border-color:var(--avocado);box-shadow:0 0 0 2px rgba(107,142,78,.13)}
  .chip .n{
    font-style:normal;font-size:9.5px;font-weight:800;color:#fff;background:var(--avocado);
    border-radius:99px;min-width:14px;height:14px;line-height:14px;text-align:center;
    margin-left:2px;padding:0 3px;
  }
  .chip.board{
    position:absolute;padding:9px 15px 9px 11px;font-size:14.5px;border-width:2px;
    box-shadow:0 3px 0 rgba(43,33,24,.1);z-index:2;
  }
  .chip.board .e{font-size:20px}
  .chip.drag{cursor:grabbing;z-index:99;transform:scale(1.09) rotate(-2deg);box-shadow:0 10px 22px rgba(43,33,24,.22)}
  .chip.target{border-color:var(--orange);background:#FFF0E6;transform:scale(1.07)}
  @keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.16)}100%{transform:scale(1);opacity:1}}
  .chip.pop{animation:pop .32s cubic-bezier(.3,1.5,.5,1)}
  @keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .chip.nope{animation:nope .26s}
  #tray{
    flex:none;display:flex;gap:9px;justify-content:center;padding:11px;
    border-top:2px solid var(--line);background:rgba(255,249,238,.72);backdrop-filter:blur(8px);
  }
  .verb{
    display:flex;flex-direction:column;align-items:center;gap:2px;width:70px;padding:8px 4px;
    background:var(--card);border:2px dashed var(--line);border-radius:16px;
    font:700 11px ui-rounded,Avenir;color:var(--ink-soft);
  }
  .verb .e{font-size:21px;line-height:1.1}
  .verb.locked{opacity:.3}
  .verb.target{border-color:var(--teal);border-style:solid;background:#E8F4F3;color:var(--teal);transform:scale(1.07)}
  /* discovery card — anchored, non-blocking, self-retiring */
  #card{
    position:fixed;left:16px;bottom:88px;width:330px;max-width:calc(100vw - 32px);z-index:150;
    opacity:0;transform:translateY(10px) scale(.97);pointer-events:none;
    transition:opacity .22s,transform .22s;
  }
  #card.on{opacity:1;transform:none;pointer-events:auto}
  .inner{
    position:relative;background:var(--card);border:2px solid var(--ink);border-radius:16px;
    padding:13px 15px 12px;box-shadow:0 8px 0 rgba(43,33,24,.14);overflow:hidden;
    border-left:6px solid var(--fam,var(--orange));
  }
  .inner .x{
    position:absolute;top:7px;right:8px;border:none;background:none;padding:2px 5px;
    font-size:16px;line-height:1;color:#B9A88C;cursor:pointer;
  }
  .inner .x:hover{color:var(--ink)}
  .chead{display:flex;align-items:center;gap:10px;margin-bottom:8px;padding-right:16px}
  .chead .big{font-size:30px;line-height:1;flex:none}
  .chead b{display:block;font:800 16px/1.15 ui-rounded,Avenir;margin-bottom:3px}
  .badge{
    display:inline-block;font:700 9px ui-rounded,Avenir;letter-spacing:.9px;text-transform:uppercase;
    padding:3px 8px;border-radius:99px;font-style:normal;
  }
  .badge.workshop{background:#E6F0DC;color:#41652A}
  .badge.folklore{background:#F1E4FA;color:#6B3E8C}
  .why{font-size:13.5px;line-height:1.5;color:var(--ink);margin:0}
  .fact{display:none}
  .cfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
  .inner button.ghost{
    background:#fff;color:var(--ink-soft);border:1.5px solid var(--line);border-radius:99px;
    padding:5px 12px;font:600 12px ui-rounded,Avenir;cursor:pointer;
  }
  .inner button.ghost:hover{border-color:var(--orange);color:var(--ink)}
  @keyframes drain{from{width:100%}to{width:0}}
  .timer{
    position:absolute;left:0;bottom:0;height:3px;background:var(--fam,var(--orange));opacity:.5;
    animation:drain 7s linear forwards;
  }
  #card:hover .timer{animation-play-state:paused}
  .cardrow{display:flex;gap:8px;justify-content:center;align-items:center}

  #toast{
    position:fixed;left:50%;bottom:104px;transform:translateX(-50%);z-index:150;
    background:var(--ink);color:var(--cream);font:600 13px ui-rounded,Avenir;
    padding:9px 17px;border-radius:99px;opacity:0;transition:opacity .25s;pointer-events:none;
  }
  #toast.on{opacity:.95}
  .cardrow{display:flex;gap:8px;justify-content:center;align-items:center}
  .inner button.ghost{background:#fff;color:var(--ink-soft);border-color:var(--line);font-size:13px;padding:9px 15px}

  /* sheet: codex + provenance */
  #sheet{
    position:fixed;inset:0;display:none;z-index:180;background:rgba(43,33,24,.42);
    backdrop-filter:blur(3px);padding:22px;
  }
  #sheet.on{display:grid;place-items:center}
  .sheetbox{
    width:min(560px,100%);max-height:86vh;display:flex;flex-direction:column;
    background:var(--card);border:2.5px solid var(--ink);border-radius:20px;overflow:hidden;
    box-shadow:0 14px 0 rgba(43,33,24,.16);animation:pop .3s cubic-bezier(.3,1.5,.5,1);
  }
  .sheethead{
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none;
    padding:13px 15px;border-bottom:2px solid var(--line);background:rgba(246,237,221,.7);
  }
  .sheethead b{font:800 14px ui-rounded,Avenir}
  #sheetBody{overflow-y:auto;padding:15px}
  #sheetBody h2{
    font:700 10.5px/1 ui-rounded,Avenir;letter-spacing:.9px;text-transform:uppercase;
    color:var(--ink-soft);margin:14px 2px 8px;
  }
  .search{
    width:100%;font:600 14px ui-rounded,Avenir;color:var(--ink);
    padding:10px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;
  }
  .search:focus{outline:2px solid var(--orange);outline-offset:-1px}
  .none{color:var(--ink-soft);font-size:13px;text-align:center;padding:18px}
  .phead{text-align:center;padding:4px 0 14px;border-bottom:2px dashed var(--line);margin-bottom:12px}
  .phead .big{font-size:48px;line-height:1}
  .phead h3{font:800 21px ui-rounded,Avenir;margin:4px 0 8px}
  .pnums{font-size:13px;color:var(--ink-soft)}
  .pnums b{color:var(--brick);font-size:15px}
  .pfrom{font-size:12px;color:var(--ink-soft);margin-top:7px;font-style:italic}
  /* provenance tree — real connectors, drawn with borders on the list */
  ul.tree,ul.tree ul{list-style:none;margin:0;padding:0;font-size:13px}
  ul.tree ul{margin-left:11px;padding-left:13px;position:relative}
  ul.tree ul::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--line);
  }
  ul.tree li{position:relative}
  ul.tree ul > li::before{
    content:'';position:absolute;left:-13px;top:15px;width:11px;height:2px;background:var(--line);
  }
  /* mask the trunk below the final child so the elbow ends cleanly */
  ul.tree ul > li:last-child::after{
    content:'';position:absolute;left:-14px;top:17px;bottom:0;width:3px;background:var(--card);
  }
  .prow{
    display:flex;align-items:center;gap:6px;padding:4px 8px;margin:1px 0;
    border-radius:9px;background:rgba(255,255,255,.5);
  }
  .prow.root{background:#FFF0E6;font-weight:800;box-shadow:inset 0 0 0 2px var(--orange)}
  .prow.has{cursor:pointer}
  .prow.has:hover{background:#fff}
  .prow .tw{
    font-size:9px;color:var(--ink-soft);width:11px;flex:none;text-align:center;line-height:1;
  }
  .prow .tw.dot{color:#C9B99C}
  .prow .more{
    font:800 9.5px ui-rounded,Avenir;color:#fff;background:#C0A98A;
    border-radius:99px;padding:2px 7px;flex:none;
  }
  ul.tree ul.fold{display:none}
  .prow .pe{font-size:15px}
  .prow .pn{flex:1;min-width:0}
  .prow .pv{
    font-size:10px;font-weight:700;color:var(--teal);background:#E8F4F3;
    padding:2px 7px;border-radius:99px;flex:none;
  }

  /* ---- matter taxonomy ----------------------------------------------
     Shape carries meaning, so the three kinds of thing are never confusable:
       pill     = a thing in the world   (game element)
       hexagon  = a molecule             (compound)
       tile     = an atom                (periodic-table cell)
       halo     = energy, not matter     (particle)
     Colour then carries the sub-category within each kind. ------------- */
  :root{
    --alkali:#E2703A; --alkaline:#E0A526; --transition:#A63D2F; --post:#8A7B6B;
    --metalloid:#6B8E4E; --nonmetal:#3E7C7B; --halogen:#5B7FA6; --noble:#8C6BA6;
    --lanthanide:#B5657F; --actinide:#7A5C8E;
    --fam-earth:#8A7B6B; --fam-water:#4E8CB8; --fam-fire:#E2703A; --fam-plant:#6B8E4E;
    --fam-animal:#A6603D; --fam-microbe:#8C6BA6; --fam-food:#E0A526; --fam-myth:#7C5CA6;
  }
  .atom{
    display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
    width:42px;height:42px;border-radius:9px;color:#fff;flex:none;
    box-shadow:inset 0 -2px 0 rgba(0,0,0,.16);
  }
  .atom .sym{font:800 15px/1 ui-rounded,Avenir;letter-spacing:-.3px}
  .atom .z{font:700 8px/1 ui-rounded,Avenir;opacity:.8;margin-top:1px}
  .atom.alkali{background:var(--alkali)} .atom.alkaline{background:var(--alkaline)}
  .atom.transition{background:var(--transition)} .atom.post{background:var(--post)}
  .atom.metalloid{background:var(--metalloid)} .atom.nonmetal{background:var(--nonmetal)}
  .atom.halogen{background:var(--halogen)} .atom.noble{background:var(--noble)}
  .atom.lanthanide{background:var(--lanthanide)} .atom.actinide{background:var(--actinide)}

  .hex{
    display:inline-flex;align-items:center;justify-content:center;flex:none;
    min-width:74px;padding:9px 13px;background:#EFE6F5;color:#5B3E7A;
    font:700 11.5px ui-rounded,Avenir;text-align:center;line-height:1.15;
    clip-path:polygon(14% 0,86% 0,100% 50%,86% 100%,14% 100%,0 50%);
  }
  .particle{
    display:inline-flex;align-items:center;gap:5px;flex:none;padding:6px 14px;
    border-radius:99px;font:700 11.5px ui-rounded,Avenir;color:#8A6A12;
    background:radial-gradient(circle,#FFF0C4 0%,#FDE39B 70%,rgba(253,227,155,0) 100%);
  }

  /* game-element chips tinted by family */
  .chip[data-fam]{border-color:color-mix(in srgb,var(--fam) 46%,var(--line))}
  .chip[data-fam] .e{filter:saturate(1.05)}
  .chip.board[data-fam]{
    border-color:var(--fam);
    box-shadow:0 3px 0 color-mix(in srgb,var(--fam) 26%,rgba(43,33,24,.1));
  }
  .fam-earth{--fam:var(--fam-earth)}   .fam-water{--fam:var(--fam-water)}
  .fam-fire{--fam:var(--fam-fire)}     .fam-plant{--fam:var(--fam-plant)}
  .fam-animal{--fam:var(--fam-animal)} .fam-microbe{--fam:var(--fam-microbe)}
  .fam-food{--fam:var(--fam-food)}     .fam-myth{--fam:var(--fam-myth)}

  /* molecules */
  .molbox{display:flex;justify-content:center;padding:6px 0 10px}
  svg.mol .bond{stroke:#5A4A38;stroke-width:3.4;stroke-linecap:round}
  svg.mol .ball{stroke:#3B2E20;stroke-width:1.6}
  svg.mol .lbl{text-anchor:middle;dominant-baseline:central;font-weight:800;
    font-family:ui-rounded,Avenir,system-ui;pointer-events:none}
  .formula{
    text-align:center;font:800 17px ui-rounded,Avenir;color:var(--ink);margin-bottom:10px;
  }
  .formula sub{font-size:.66em;vertical-align:-.25em}
  .aagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:6px}
  .aa{
    display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;min-width:0;
    background:#fff;border:1.5px solid var(--line);border-radius:11px;overflow:hidden;
  }
  .aa:hover{border-color:var(--metalloid)}
  .aa b{
    font:800 10px ui-rounded,Avenir;color:#fff;background:var(--nonmetal);
    border-radius:5px;min-width:18px;height:18px;line-height:18px;text-align:center;flex:none;
  }
  .aatx{display:flex;flex-direction:column;min-width:0;line-height:1.25}
  .aatx em{
    font:600 11.5px ui-rounded,Avenir;font-style:normal;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .aatx i{
    font-style:normal;font:600 9.5px ui-rounded,Avenir;color:var(--ink-soft);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  /* periodic table */
  .ptab{display:grid;grid-template-columns:repeat(18,1fr);gap:2px;margin:8px 0}
  .ptab .atom{width:100%;height:auto;aspect-ratio:1;border-radius:4px;min-width:0}
  .ptab .atom .sym{font-size:9px}
  .ptab .atom .z{display:none}
  .ptab .atom.off{opacity:.24}
  .ptab .gap{grid-column:span var(--n)}
  .legend{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 4px}
  .legend span{
    font:700 9.5px ui-rounded,Avenir;color:#fff;padding:3px 8px;border-radius:99px;
  }

  /* bedrock: the substrate, deliberately quieter than the game above it */
  .bedhead{
    text-align:center;font:700 10px ui-rounded,Avenir;letter-spacing:1.4px;text-transform:uppercase;
    color:#A8977E;margin:20px 0 12px;position:relative;
  }
  .bedhead::before,.bedhead::after{
    content:'';position:absolute;top:50%;width:26%;height:2px;background:var(--line);
  }
  .bedhead::before{left:2%} .bedhead::after{right:2%}
  .bedgroup{margin-bottom:12px;opacity:.78}
  .bedof{font:700 12px ui-rounded,Avenir;color:var(--ink-soft);margin-bottom:4px}
  ul.tree.bed .brow{
    display:flex;align-items:center;gap:6px;padding:2px 7px;margin:1px 0;
    font-size:12px;color:var(--ink-soft);background:none;
  }
  aside h2 i{
    display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:6px;
    background:var(--fam,var(--line));vertical-align:middle;
  }
  ul.tree.bed .brow{gap:8px}
  ul.tree.bed .brow .cat{
    font-style:normal;font:700 8.5px ui-rounded,Avenir;text-transform:uppercase;
    letter-spacing:.6px;color:#B0A08A;margin-left:auto;
  }
  ul.tree.bed .brow b{
    font-size:9.5px;font-weight:800;color:#fff;background:#A8977E;border-radius:5px;
    min-width:19px;height:15px;line-height:15px;text-align:center;
  }
  .bedsum{
    text-align:center;font:800 14px ui-rounded,Avenir;color:var(--brick);
    padding:13px 10px;border:2px dashed var(--line);border-radius:14px;margin-top:6px;
  }
  .bedsum .syms{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:9px}
  .bedsum .syms i{
    font-style:normal;font:800 11px ui-rounded,Avenir;color:var(--ink);
    background:#fff;border:1.5px solid var(--line);border-radius:6px;padding:3px 7px;
  }

  @media(max-width:720px){
    header{gap:7px;padding:9px 10px;flex-wrap:nowrap;overflow:hidden}
    h1{font-size:15px;flex:none;white-space:nowrap}
    .goal{display:none}
    #live{display:none}
    header button,.count{padding:6px 10px;font-size:12px;white-space:nowrap;flex:none}
    aside{

  }
  @media(min-width:721px){ #shelfToggle{display:none} }
</style>

    <svg viewBox="0 0 120 120" aria-hidden="true">

      <g stroke="#5C4B38" stroke-width="3" fill="none" stroke-linecap="round">
        <path d="M28 34 Q44 54 56 66"/><path d="M50 26 Q54 48 58 64"/>
        <path d="M70 26 Q66 48 62 64"/><path d="M92 34 Q76 54 64 66"/>
      </g>
      <circle cx="28" cy="34" r="8" fill="#9C8A74"/><circle cx="50" cy="26" r="8" fill="#4E8CB8"/>
      <circle cx="70" cy="26" r="8" fill="#E0A526"/><circle cx="92" cy="34" r="8" fill="#6B8E4E"/>

<div id="tray"></div>

    <div id="sheetBody"></div>
  </div>
</div>
<div id="card" class="card"><div class="inner" id="inner"></div></div>
<div id="toast"></div>

<script>
const DATA = __GAME_DATA__;
const {elements, recipes, verbs} = DATA;
const byId = Object.fromEntries(elements.map(e => [e.id, e]));
const merges = new Map(), procs = new Map();
for (const r of recipes) {
  if (r.verb) procs.set(r.in[0] + '|' + r.verb, r);
  else merges.set([...r.in].sort().join('+'), r);
}
const STARTERS = elements.filter(e => e.starter).map(e => e.id);
const GOAL = 'dinner';
const KEY = 'loam.v1';

let found = new Set(), seen = new Set();
try {
  const s = JSON.parse(localStorage.getItem(KEY));
  if (s) { found = new Set(s.found); seen = new Set(s.seen); }
} catch {}
if (!found.size) STARTERS.forEach(s => found.add(s));
// Storage is unavailable in private browsing and on opaque origins. Never let
// a failed save abort a discovery.
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({found:[...found], seen:[...seen]})); } catch {} };

const unlockedVerbs = () => new Set(verbs.filter(v => !v.unlockedBy || found.has(v.unlockedBy)).map(v => v.id));

// How many undiscovered recipes can this element still take part in, using only
// what you already hold? Simulated at 25.7 attempts per discovery versus 91.2
// blind — it narrows the field without ever naming a partner.
// How many held elements still have an undiscovered recipe in them?
function liveCount() {
  const ul = unlockedVerbs();
  let n = 0;
  for (const e of elements) if (found.has(e.id) && secretsFor(e.id, ul) > 0) n++;
  return n;
}
function secretsFor(id, ul) {
  let n = 0;
  for (const r of DATA.recipes) {
    if (found.has(r.out)) continue;
    if (r.verb && !ul.has(r.verb)) continue;
    if (!r.in.includes(id)) continue;
    if (!r.in.every(i => found.has(i))) continue;
    n++;
  }
  return n;
}

const board = document.getElementById('board');
const toastEl = document.getElementById('toast');
let toastT;
function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), 2200);
}

// ---------- taxonomy ----------
// An element can carry several tags, so families are resolved in priority
// order: the most specific identity wins (a microbe is a microbe before it is
// an ingredient).
const FAMILIES = [
  { id: 'myth',    name: 'Folklore',        tags: ['myth'] },
  { id: 'microbe', name: 'The Very Small',  tags: ['microbe', 'ferment'] },
  { id: 'animal',  name: 'Animals & Dairy', tags: ['animal', 'dairy'] },
  { id: 'plant',   name: 'Growing Things',  tags: ['plant', 'crop'] },
  { id: 'earth',   name: 'Earth & Stone',   tags: ['earth', 'build'] },
  { id: 'water',   name: 'Water & Ice',     tags: ['water'] },
  { id: 'fire',    name: 'Fire & Tools',    tags: ['fire', 'tool'] },
  { id: 'food',    name: 'Kitchen',         tags: ['food', 'dish', 'sweet', 'drink', 'preserve'] },
];
function familyOf(e) {
  if (e.shelf === 'folklore') return FAMILIES[0];
  for (const f of FAMILIES) if (e.tags.some(t => f.tags.includes(t))) return f;
  return FAMILIES[7];
}

// ---------- rendering ----------
function chipHTML(e) {
  return `<span class="e">${e.emoji}</span>${e.name}`;
}
const famAttrs = (e) => {
  const f = familyOf(e);
  return `data-fam="${f.id}" class-fam="fam-${f.id}"`;
};
function renderShelf() {
  const ul = unlockedVerbs();
  const groups = FAMILIES.map(f => [f, elements.filter(e => found.has(e.id) && familyOf(e).id === f.id)])
    .filter(([, g]) => g.length)
    .sort((a, b) => (a[0].id === 'myth') - (b[0].id === 'myth'));   // folklore last
  const secrets = new Map(elements.filter(e => found.has(e.id)).map(e => [e.id, secretsFor(e.id, ul)]));
  const liveCount = [...secrets.values()].filter(n => n > 0).length;
  document.getElementById('aside').innerHTML = groups.map(([f, g]) =>
    `<h2 class="fam-${f.id}"><i></i>${f.name} · ${g.length}</h2><div class="shelf">` +
    g.map(e => {
      const n = secrets.get(e.id) ?? 0;
      return `<span class="chip fam-${f.id}${n ? ' live' : ' spent'}" data-fam="${f.id}" data-spawn="${e.id}">` +
             `${chipHTML(e)}${n ? `<i class="n">${n}</i>` : ''}</span>`;
    }).join('') +
    `</div>`).join('');
  document.getElementById('live').textContent = liveCount ? `${liveCount} still have something to give` : '';

  document.getElementById('tray').innerHTML = verbs.map(v =>
    `<div class="verb${ul.has(v.id) ? '' : ' locked'}" data-verb="${v.id}">
       <span class="e">${v.emoji}</span>${ul.has(v.id) ? v.name : 'Locked'}</div>`).join('');

  document.getElementById('count').textContent = `${found.size} / ${elements.length}`;
  const g = byId[GOAL];
  document.getElementById('goal').innerHTML = found.has(GOAL)
    ? `Made <b>${g.emoji} ${g.name}</b> — now try 🎉 Feast`
    : `Goal: <b>${g.emoji} ${g.name}</b>`;
}

// ---- the world: chips live in world coordinates; the view pans and zooms ----
const world = document.getElementById('world');
const linkSvg = document.getElementById('links');
const view = { x: 0, y: 0, k: 1 };
const links = [];                                     // {a,b,out} DOM refs

function applyView() {
  world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`;
}
function toWorld(sx, sy) {
  const b = board.getBoundingClientRect();
  return [(sx - b.left - view.x) / view.k, (sy - b.top - view.y) / view.k];
}
const chipCentre = (el) => [
  (parseFloat(el.style.left) || 0) + el.offsetWidth / 2,
  (parseFloat(el.style.top) || 0) + el.offsetHeight / 2,
];

// Connections persist, so the canvas becomes a diagram of what you built
// rather than a scratchpad that forgets.
function drawLinks() {
  const parts = [];
  for (const l of links) {
    if (!l.out.isConnected) continue;
    const [ox, oy] = chipCentre(l.out);
    for (const src of [l.a, l.b]) {
      if (!src || !src.isConnected) continue;
      const [sx, sy] = chipCentre(src);
      parts.push(`<line class="made" x1="${sx}" y1="${sy}" x2="${ox}" y2="${oy}"/>`);
    }
  }
  linkSvg.innerHTML = parts.join('');
}

function zoomBy(f, cx, cy) {
  const b = board.getBoundingClientRect();
  const px = cx == null ? b.width / 2 : cx - b.left;
  const py = cy == null ? b.height / 2 : cy - b.top;
  const k2 = Math.max(0.25, Math.min(2.4, view.k * f));
  view.x = px - (px - view.x) * (k2 / view.k);
  view.y = py - (py - view.y) * (k2 / view.k);
  view.k = k2;
  applyView();
}
function fitAll() {
  const chips = [...world.querySelectorAll('.chip.board')];
  if (!chips.length) return;
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  for (const c of chips) {
    const l = parseFloat(c.style.left) || 0, t = parseFloat(c.style.top) || 0;
    x1 = Math.min(x1, l); y1 = Math.min(y1, t);
    x2 = Math.max(x2, l + c.offsetWidth); y2 = Math.max(y2, t + c.offsetHeight);
  }
  const b = board.getBoundingClientRect(), pad = 60;
  view.k = Math.max(0.25, Math.min(1.4, Math.min((b.width - pad) / (x2 - x1 || 1),
                                                 (b.height - pad) / (y2 - y1 || 1))));
  view.x = b.width / 2 - ((x1 + x2) / 2) * view.k;
  view.y = b.height / 2 - ((y1 + y2) / 2) * view.k;
  applyView();
}
document.getElementById('zoom').addEventListener('click', ev => {
  const z = ev.target.dataset.z;
  if (z === 'in') zoomBy(1.25);
  else if (z === 'out') zoomBy(0.8);
  else if (z === 'fit') fitAll();
});
board.addEventListener('wheel', ev => {
  ev.preventDefault();
  zoomBy(ev.deltaY < 0 ? 1.12 : 0.89, ev.clientX, ev.clientY);
}, { passive: false });

// Chips that land on top of each other cannot be dragged apart, so placement
// looks for space rather than trusting a random point.
function freeSpot(w, h, near) {
  const held = [...world.querySelectorAll('.chip.board')]
    .map(c => [parseFloat(c.style.left) || 0, parseFloat(c.style.top) || 0]);
  const b = board.getBoundingClientRect();
  const [cx, cy] = near ?? toWorld(b.left + b.width / 2, b.top + b.height / 2);
  let best = null, bestGap = -1;
  for (let i = 0; i < 80; i++) {
    const spread = 90 + i * 9;
    const x = cx + (Math.random() - .5) * spread * 2;
    const y = cy + (Math.random() - .5) * spread * 1.5;
    let gap = Infinity;
    for (const [l, t] of held) gap = Math.min(gap, Math.hypot(l - x, t - y));
    if (gap > w + 18) return [x, y];
    if (gap > bestGap) { bestGap = gap; best = [x, y]; }
  }
  return best;
}

function spawn(id, x, y, near) {
  const e = byId[id];
  const el = document.createElement('div');
  const fam = familyOf(e);
  el.className = `chip board pop fam-${fam.id}`;
  el.dataset.fam = fam.id;
  el.dataset.id = id;
  el.innerHTML = chipHTML(e);
  world.appendChild(el);
  const cw = el.offsetWidth, ch = el.offsetHeight;
  let anchor = null;
  if (near && near.length) {                          // sit the result near its parents
    const pts = near.filter(n => n && n.isConnected).map(chipCentre);
    if (pts.length) anchor = [pts.reduce((a, p) => a + p[0], 0) / pts.length,
                              pts.reduce((a, p) => a + p[1], 0) / pts.length + 92];
  }
  const [left, top] = x == null ? freeSpot(cw, ch, anchor) : [x - cw / 2, y - ch / 2];
  el.style.left = left + 'px';
  el.style.top = top + 'px';
  setTimeout(() => el.classList.remove('pop'), 340);
  drawLinks();
  return el;
}

// Discoveries must never block the board. The card slides in beside the bench,
// reads in a glance, and retires on its own — the codex is the permanent record,
// so nothing is lost by letting it go.
let cardT;
function showCard(r, e) {
  const isFolk = e.shelf === 'folklore';
  const card = document.getElementById('card');
  card.className = `card on fam-${familyOf(e).id}`;
  document.getElementById('inner').innerHTML = `
    <button class="x" data-dismiss title="Dismiss">×</button>
    <div class="chead"><span class="big">${e.emoji}</span>
      <span><b>${e.name}</b>
      <i class="badge ${e.shelf}">${isFolk ? 'a story we tell' : 'how it works'}</i></span></div>
    <p class="why">${r.why}</p>
    <div class="cfoot">
      ${r.src ? `<a class="src" href="${r.src}" target="_blank" rel="noopener">Check this${r.verified ? ' ✓' : ''}</a>` : '<span></span>'}
      <button class="ghost" data-trace="${e.id}">Trace it</button>
    </div>
    <span class="timer"></span>`;
  clearTimeout(cardT);
  cardT = setTimeout(() => card.classList.remove('on'), 7000);
}
function dismissCard() { clearTimeout(cardT); document.getElementById('card').classList.remove('on'); }

// ---------- the one interaction that matters ----------
let drag = null;
let pan = null;
board.addEventListener('pointerdown', ev => {
  if (ev.target.closest('#zoom, #intro')) return;
  const chip = ev.target.closest('.chip.board:not(.cooking)');
  if (!chip) {                                       // empty space: pan the world
    pan = { sx: ev.clientX, sy: ev.clientY, vx: view.x, vy: view.y };
    board.classList.add('panning');
    return;
  }
  const [wx, wy] = toWorld(ev.clientX, ev.clientY);
  benchTouched = true;
  drag = { chip, ox: wx - (parseFloat(chip.style.left) || 0),
                 oy: wy - (parseFloat(chip.style.top) || 0), moved: false };
  chip.classList.add('drag');
  chip.setPointerCapture(ev.pointerId);
});
board.addEventListener('pointermove', ev => {
  if (pan) {
    view.x = pan.vx + (ev.clientX - pan.sx);
    view.y = pan.vy + (ev.clientY - pan.sy);
    applyView();
    return;
  }
  if (!drag) return;
  drag.moved = true;
  const [wx, wy] = toWorld(ev.clientX, ev.clientY);
  drag.chip.style.left = (wx - drag.ox) + 'px';
  drag.chip.style.top  = (wy - drag.oy) + 'px';
  drawLinks();
  const t = hit(ev.clientX, ev.clientY, drag.chip);
  document.querySelectorAll('.target').forEach(n => n.classList.remove('target'));
  if (t) t.classList.add('target');
});
board.addEventListener('pointerup', ev => {
  if (pan) { pan = null; board.classList.remove('panning'); return; }
  if (!drag) return;
  const { chip, moved } = drag; drag = null;
  chip.classList.remove('drag');
  document.querySelectorAll('.target').forEach(n => n.classList.remove('target'));
  if (!moved) { chip.remove(); drawLinks(); return; }   // tap to put away
  const t = hit(ev.clientX, ev.clientY, chip);
  if (!t) return;
  if (t.dataset.verb) applyProcess(chip, t);
  else applyMerge(chip, t);
});

// `exclude` must be passed explicitly: by pointerup the drag state is already
// cleared, and without it a chip hit-tests against itself (stone + stone).
// Hit testing by OVERLAP of the dragged chip, not by pointer position. Merges
// are commutative in the data — dropping A on B and B on A resolve the same
// recipe — so any asymmetry a player feels is this test being too strict.
// Picking the greatest overlap also makes crowded benches predictable.
function hit(x, y, exclude) {
  const d = exclude ? exclude.getBoundingClientRect() : { left: x, right: x, top: y, bottom: y };
  let best = null, bestArea = 0;
  for (const n of [...world.querySelectorAll('.chip.board'), ...document.querySelectorAll('.verb:not(.locked)')]) {
    if (n === exclude) continue;
    const r = n.getBoundingClientRect();
    const ox = Math.min(d.right, r.right) - Math.max(d.left, r.left);
    const oy = Math.min(d.bottom, r.bottom) - Math.max(d.top, r.top);
    if (ox > 0 && oy > 0) {
      const area = ox * oy;
      if (area > bestArea) { bestArea = area; best = n; }
    } else if (!best && x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
      best = n; bestArea = 0.1;                      // pointer fallback
    }
  }
  return best;
}

function resolve(r, chips, x, y) {
  if (!r) { chips.forEach(c => { c.classList.add('nope'); setTimeout(() => c.classList.remove('nope'), 280); }); return; }
  // Inputs stay put and the result is linked to them, so the canvas accumulates
  // into a diagram of what you built instead of forgetting each step.
  // The dragged parent is sitting on top of the other one. Ease them apart so
  // the diagram stays readable once the link is drawn.
  if (chips.length === 2) {
    const [p1, p2] = chips.map(chipCentre);
    const dx = p1[0] - p2[0], dy = p1[1] - p2[1];
    const d = Math.hypot(dx, dy) || 1;
    const want = (chips[0].offsetWidth + chips[1].offsetWidth) / 2 + 22;
    if (d < want) {
      const push = (want - d) / 2, ux = (dx / d) * push, uy = (dy / d) * push;
      chips[0].style.left = (parseFloat(chips[0].style.left) || 0) + ux + 'px';
      chips[0].style.top  = (parseFloat(chips[0].style.top) || 0) + uy + 'px';
      chips[1].style.left = (parseFloat(chips[1].style.left) || 0) - ux + 'px';
      chips[1].style.top  = (parseFloat(chips[1].style.top) || 0) - uy + 'px';
    }
  }
  const el = spawn(r.out, null, null, chips);
  links.push({ a: chips[0], b: chips[1] ?? null, out: el });
  drawLinks();
  const isNew = !found.has(r.out);
  if (isNew) {
    const wasLive = liveCount();
    found.add(r.out);
    save(); renderShelf();
    // Players of other games in this genre report the same pair failing and then
    // later working, and read it as the game cheating. Unlocks genuinely do
    // change what is possible — so say so out loud rather than letting them
    // rediscover it by accident.
    const unlocked = verbs.filter(v => v.unlockedBy === r.out);
    if (unlocked.length) {
      // A tool unlock is the bigger news; don't let the follow-up overwrite it.
      for (const v of unlocked) {
        const n = DATA.recipes.filter(x => x.verb === v.id && found.has(x.in[0]) && !found.has(x.out)).length;
        toast(`${v.emoji} ${v.name} unlocked — ${n} thing${n === 1 ? '' : 's'} you hold can be ${v.name.toLowerCase()}ed`);
      }
    } else {
      const gained = liveCount() - wasLive;
      if (gained > 1) toast(`${gained} things on your shelf just became useful again`);
    }
  }
  if (!seen.has(r.out)) { seen.add(r.out); save(); showCard(r, byId[r.out]); }
  else el.classList.add('pop');
}

function applyMerge(a, b) {
  resolve(merges.get([a.dataset.id, b.dataset.id].sort().join('+')), [a, b]);
}
// Some processes are not instant in life and should not be here either.
// Waiting and fermenting take real time; you keep playing while they run.
const TAKES_TIME = { wait: 14000, ferment: 20000 };
const cooking = new Set();

function applyProcess(chip, verbEl) {
  const verb = verbEl.dataset.verb;
  const r = procs.get(chip.dataset.id + '|' + verb);
  if (!r) { verbEl.classList.add('nope'); setTimeout(() => verbEl.classList.remove('nope'), 280); return; }
  const ms = TAKES_TIME[verb];
  if (!ms) return resolve(r, [chip]);
  startCooking(chip, r, verb, ms);
}

// Warmth genuinely speeds fermentation and drying, so standing a jar next to the
// fire is a real method — not a purchased skip. Acceleration has to be earned by
// how you arrange the bench.
function heatNearby(chip) {
  const [cx, cy] = chipCentre(chip);
  for (const c of world.querySelectorAll('.chip.board')) {
    if (c === chip) continue;
    if (c.dataset.id !== 'fire' && c.dataset.id !== 'sun') continue;
    const [hx, hy] = chipCentre(c);
    if (Math.hypot(hx - cx, hy - cy) < 190) return c.dataset.id;
  }
  return null;
}

function startCooking(chip, r, verb, ms) {
  const v = verbs.find(x => x.id === verb);
  const job = { chip, r, verb, started: performance.now(), ms, done: 0 };
  cooking.add(job);
  chip.classList.add('cooking');
  chip.dataset.verbLabel = v.emoji;
  updateWaiting();
  toast(`${v.emoji} ${chip.textContent.trim()} is ${verb === 'wait' ? 'resting' : 'fermenting'} — keep playing`);
}

function tickCooking(now) {
  for (const job of [...cooking]) {
    if (!job.chip.isConnected) { cooking.delete(job); continue; }
    const warm = heatNearby(job.chip);
    const rate = warm ? 2.2 : 1;                       // warmth roughly doubles it
    job.done += (now - (job.last ?? now)) * rate;
    job.last = now;
    const p = Math.min(1, job.done / job.ms);
    job.chip.style.setProperty('--p', (p * 100).toFixed(1) + '%');
    if (warm && !job.toldWarm) {
      job.toldWarm = true;
      toast(`Warmth from the ${warm} is speeding it up`);
    }
    if (p >= 1) {
      cooking.delete(job);
      job.chip.classList.remove('cooking');
      resolve(job.r, [job.chip]);
      updateWaiting();
    }
  }
  requestAnimationFrame(tickCooking);
}
requestAnimationFrame(tickCooking);

function updateWaiting() {
  const el = document.getElementById('waiting');
  el.textContent = cooking.size ? `${cooking.size} resting` : '';
  el.style.display = cooking.size ? '' : 'none';
}

// ---------- provenance: what is this actually made of? ----------
const startersSet = new Set(STARTERS);
const bestRecipe = new Map();
(function () {
  const unlockOf = Object.fromEntries(verbs.map(v => [v.id, v.unlockedBy]));
  const cost = new Map([...startersSet].map(s => [s, new Set()]));
  for (let pass = 0; pass < 60; pass++) {
    let changed = false;
    DATA.recipes.forEach((r, i) => {
      const parts = [...r.in];
      if (r.verb && unlockOf[r.verb]) parts.push(unlockOf[r.verb]);
      if (!parts.every(x => cost.has(x))) return;
      const set = new Set([i]);
      for (const x of parts) for (const c of cost.get(x)) set.add(c);
      const cur = cost.get(r.out);
      if (!cur || set.size < cur.size) { cost.set(r.out, set); bestRecipe.set(r.out, r); changed = true; }
    });
    if (!changed) break;
  }
})();

const memo = new Map();
function expanded(id) {
  if (startersSet.has(id)) return { steps: 0, leaves: 1 };
  if (memo.has(id)) return memo.get(id);
  memo.set(id, { steps: 0, leaves: 1 });
  const r = bestRecipe.get(id);
  if (!r) return { steps: 0, leaves: 1 };
  let steps = 1, leaves = 0;
  for (const i of r.in) { const s = expanded(i); steps += s.steps; leaves += s.leaves; }
  const out = { steps, leaves }; memo.set(id, out); return out;
}
function distinctOf(id) {
  const seen = new Set(), stack = [id];
  while (stack.length) {
    const x = stack.pop();
    if (seen.has(x)) continue;
    seen.add(x);
    const r = bestRecipe.get(x);
    if (r) stack.push(...r.in);
  }
  return seen;
}
function leafTally(id) {
  const t = new Map();
  (function walk(x) {
    if (startersSet.has(x)) { t.set(x, (t.get(x) ?? 0) + 1); return; }
    const r = bestRecipe.get(x);
    if (r) r.in.forEach(walk);
  })(id);
  return t;
}
// A deep tree (blue cheese runs to ~100 crafts) is unreadable on a phone, so
// anything past AUTO_DEPTH starts folded and opens on tap.
const AUTO_DEPTH = 4;
function subtreeSize(id) { return expanded(id).steps + 1; }
function treeHTML(id, depth) {
  const r = bestRecipe.get(id), e = byId[id];
  const v = r && r.verb ? verbs.find(x => x.id === r.verb) : null;
  const hidden = r && depth >= AUTO_DEPTH;
  const n = r ? subtreeSize(id) - 1 : 0;
  const row = `<div class="prow${depth === 0 ? ' root' : ''}${r ? ' has' : ''}"${r ? ' data-fold' : ''}>` +
              `${r ? `<span class="tw">${hidden ? '▸' : '▾'}</span>` : '<span class="tw dot">·</span>'}` +
              `<span class="pe">${e.emoji}</span><span class="pn">${e.name}</span>` +
              (hidden && n ? `<span class="more">+${n}</span>` : '') +
              (v ? `<span class="pv">${v.emoji} ${v.name}</span>` : '') + `</div>`;
  const kids = r ? `<ul${hidden ? ' class="fold"' : ''}>${r.in.map(i => treeHTML(i, depth + 1)).join('')}</ul>` : '';
  return `<li>${row}${kids}</li>`;
}

// ---- bedrock: what the starters are actually made of ----
const BED = DATA.bedrock;
const atomById = Object.fromEntries(BED.atoms.map(a => [a.id, a]));
const compById = Object.fromEntries(BED.compounds.map(c => [c.id, c]));
function atomsUnder(id, seen = new Set(), out = new Set()) {
  if (atomById[id]) { out.add(id); return out; }
  if (seen.has(id)) return out;
  seen.add(id);
  for (const x of (compById[id]?.of ?? [])) atomsUnder(x, seen, out);
  return out;
}
// ---- ball-and-stick renderer ----
// Structure is authored data, not derived: a formula cannot tell you a shape.
function moleculeSVG(id, size = 190) {
  const st = BED.structures?.[id];
  if (!st) return '';
  const R = { H: 0.30, C: 0.44, N: 0.42, O: 0.40, S: 0.52 };
  const xs = st.atoms.map(a => a[1]), ys = st.atoms.map(a => a[2]);
  const pad = 0.7;
  const minX = Math.min(...xs) - pad, maxX = Math.max(...xs) + pad;
  const minY = Math.min(...ys) - pad, maxY = Math.max(...ys) + pad;
  const w = maxX - minX, h = maxY - minY;
  const k = size / Math.max(w, h);
  const X = x => (x - minX) * k, Y = y => (maxY - y) * k;

  let out = `<svg class="mol" viewBox="0 0 ${w * k} ${h * k}" width="${w * k}" height="${h * k}">`;
  for (const [i, j, order] of st.bonds) {
    const [, x1, y1] = st.atoms[i], [, x2, y2] = st.atoms[j];
    if (order === 2) {
      const dx = Y(y2) - Y(y1), dy = X(x1) - X(x2);
      const L = Math.hypot(dx, dy) || 1, ox = (dx / L) * 3.2, oy = (dy / L) * 3.2;
      out += `<line x1="${X(x1)+ox}" y1="${Y(y1)+oy}" x2="${X(x2)+ox}" y2="${Y(y2)+oy}" class="bond"/>`;
      out += `<line x1="${X(x1)-ox}" y1="${Y(y1)-oy}" x2="${X(x2)-ox}" y2="${Y(y2)-oy}" class="bond"/>`;
    } else {
      out += `<line x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}" class="bond"/>`;
    }
  }
  for (const [el, x, y] of st.atoms) {
    const r = (R[el] ?? 0.4) * k;
    const fill = BED.cpk[el];
    const dark = el === 'C' || el === 'N';
    out += `<circle cx="${X(x)}" cy="${Y(y)}" r="${r}" fill="${fill}" class="ball"/>`;
    out += `<text x="${X(x)}" y="${Y(y)}" class="lbl" fill="${dark ? '#fff' : '#1a1a1a'}" ` +
           `style="font-size:${r * 1.15}px">${el}</text>`;
  }
  return out + '</svg>';
}

function atomTile(a, small) {
  return `<span class="atom ${a.category}" title="${a.name}">` +
         `<span class="sym">${a.symbol}</span><span class="z">${a.number}</span></span>`;
}
function bedTreeHTML(id) {
  const a = atomById[id];
  if (a) return `<li><div class="brow">${atomTile(a)}<span>${a.name}</span>` +
                `<i class="cat">${a.category}</i></div></li>`;
  const c = compById[id];
  if (!c) return '';
  const node = c.kind === 'particle'
    ? `<span class="particle">✦ ${c.name}</span>`
    : `<span class="hex">${c.name}</span>`;
  return `<li><div class="brow">${node}</div>` +
         (c.of.length ? `<ul>${c.of.map(bedTreeHTML).join('')}</ul>` : '') + `</li>`;
}

// ---- periodic table ----
const PT_GAPS = { 2: 10, 5: 10, 13: 10, 31: 10, 57: 0, 72: 0 };  // where a row jumps
function periodicHTML() {
  const inPlay = new Set(BED.atoms.filter(a => a.inPlay).map(a => a.id));
  const cats = [...new Set(BED.atoms.map(a => a.category))];
  let h = `<p class="none" style="text-align:left;padding:0 0 6px">` +
          `Shape says what a thing is; colour says which kind. ` +
          `The ${inPlay.size} lit tiles are the ones this world is actually built from.</p>`;
  h += `<div class="legend">` + cats.map(c =>
        `<span style="background:var(--${c})">${c}</span>`).join('') + `</div>`;
  h += '<div class="ptab">';
  for (const a of BED.atoms) {
    if (PT_GAPS[a.number] !== undefined && PT_GAPS[a.number] > 0)
      h += `<div class="gap" style="--n:${PT_GAPS[a.number]}"></div>`;
    if (a.number === 57 || a.number === 89) h += `<div class="gap" style="--n:18"></div>`;
    h += `<span class="atom ${a.category}${inPlay.has(a.id) ? '' : ' off'}" ` +
         `title="${a.number} ${a.name}"><span class="sym">${a.symbol}</span>` +
         `<span class="z">${a.number}</span></span>`;
  }
  h += '</div>';
  h += `<h2>In play · ${inPlay.size}</h2><div class="shelf">` +
       BED.atoms.filter(a => a.inPlay).map(a =>
         `<span class="chip" data-atom="${a.id}">${atomTile(a)}&nbsp;${a.name}</span>`).join('') +
       `</div>`;
  h += `<h2>Compounds · ${BED.compounds.length}</h2><div class="shelf" style="gap:7px">` +
       BED.compounds.map(c => c.kind === 'particle'
         ? `<span class="particle" data-atom="${c.id}">✦ ${c.name}</span>`
         : `<span class="hex" data-atom="${c.id}">${c.name}</span>`).join('') + `</div>`;
  return h;
}
const aminoById = Object.fromEntries((BED.aminos ?? []).map(a => [a.id, a]));
const fmt = (f) => String(f).replace(/(\d+)/g, '<sub>$1</sub>');
function showAtom(id) {
  const a = atomById[id], c = compById[id] ?? aminoById[id];
  const node = a ? atomTile(a) : c.kind === 'particle'
    ? `<span class="particle">✦ ${c.name}</span>` : `<span class="hex">${c.name}</span>`;
  document.getElementById('sheetBody').innerHTML =
    `<div class="phead">${a ? `<div style="margin-bottom:8px">${node}</div>` : `<div style="margin-bottom:8px">${node}</div>`}
       <h3>${(a ?? c).name}</h3>
       <div class="pnums">${a ? `element ${a.number} · ${a.category}` : 'compound'}</div></div>
     ${BED.structures?.[id] ? `<div class="molbox">${moleculeSVG(id)}</div>` : ''}
     ${(a ?? c)?.formula ? `<div class="formula">${fmt((a ?? c).formula)}</div>` : ''}
     <p class="why">${(a ?? c).fact ?? 'Not yet written up — this one is reference only for now.'}</p>
     ${c && c.variants ? `<h2>All twenty</h2><div class="aagrid">${c.variants.map(v => {
        const aa = BED.aminos.find(x => x.id === v);
        return `<span class="aa" data-atom="${aa.id}"><b>${aa.code1}</b>` +
               `<span class="aatx"><em>${aa.name}</em><i>${fmt(aa.formula)}</i></span></span>`;
        }).join('')}</div>` : ''}
     ${c && c.of.length ? `<h2>Made of</h2><ul class="tree bed">${c.of.map(bedTreeHTML).join('')}</ul>` : ''}
     <a class="src" href="${(a ?? c).src}" target="_blank" rel="noopener">Check this</a>`;
  openSheet((a ?? c).name);
}
function bedrockHTML(tally) {
  const leaves = [...tally.keys()].filter(id => BED.composition[id]);
  if (!leaves.length) return '';
  const atoms = new Set();
  for (const id of leaves) for (const p of BED.composition[id]) for (const a of atomsUnder(p)) atoms.add(a);
  const syms = [...atoms].map(a => atomById[a].symbol);
  return `<div class="bedhead">and below that</div>` +
    leaves.map(id =>
      `<div class="bedgroup"><div class="bedof">${byId[id].emoji} ${byId[id].name} is made of</div>` +
      `<ul class="tree bed">${BED.composition[id].map(bedTreeHTML).join('')}</ul></div>`).join('') +
    `<div class="bedsum">${atoms.size} chemical elements${syms.includes('He') ? ' and starlight' : ''}` +
    `<div class="syms">${syms.map(x => `<i>${x}</i>`).join('')}</div></div>`;
}
function showProvenance(id) {
  const x = expanded(id), d = distinctOf(id).size, t = leafTally(id), e = byId[id];
  document.getElementById('sheetBody').innerHTML =
    `<div class="phead"><div class="big">${e.emoji}</div><h3>${e.name}</h3>
       <div class="pnums"><b>${x.leaves}</b> raw inputs · <b>${d}</b> distinct ingredients · <b>${x.steps}</b> crafts</div>
       <div class="pfrom">Bottoms out in ${[...t].sort((a,b)=>b[1]-a[1])
         .map(([k,n]) => `${byId[k].emoji} ${byId[k].name} ×${n}`).join(' · ')}</div></div>
     <ul class="tree">${treeHTML(id, 0)}</ul>
     ${bedrockHTML(t)}`;
  openSheet('Where it came from');
}

// ---------- codex ----------
// Rebuilding the whole sheet on every keystroke destroys the input and resets
// the caret to position 0, which makes typed text come out reversed. Build the
// chrome once; only the results list is re-rendered.
function codexResults(q) {
  const hits = elements.filter(e => found.has(e.id) &&
    (!q || e.name.toLowerCase().includes(q.toLowerCase())));
  if (!hits.length) return '<p class="none">Nothing found.</p>';
  return FAMILIES.map(f => [f, hits.filter(e => familyOf(e).id === f.id)])
    .filter(([, g]) => g.length)
    .sort((a, b) => (a[0].id === 'myth') - (b[0].id === 'myth'))
    .map(([f, g]) =>
      `<h2 class="fam-${f.id}"><i></i>${f.name} · ${g.length}</h2><div class="shelf">` +
      g.map(e => `<span class="chip fam-${f.id}" data-fam="${f.id}" data-trace="${e.id}">${chipHTML(e)}</span>`).join('') +
      `</div>`).join('');
}
function showCodex(q = '') {
  document.getElementById('sheetBody').innerHTML =
    `<input id="q" class="search" placeholder="Search your discoveries…" value="${q}" autocomplete="off">` +
    `<div class="cardrow" style="margin:10px 0 2px">` +
    `<button class="ghost" id="ptBtn">Periodic table</button>` +
    `<button class="ghost" id="aaBtn">Amino acids</button></div>` +
    `<div id="codexList">${codexResults(q)}</div>`;
  openSheet(`Codex · ${found.size} of ${elements.length}`);
  document.getElementById('ptBtn').onclick = () => {
    document.getElementById('sheetBody').innerHTML = periodicHTML();
    openSheet('The periodic table');
  };
  document.getElementById('aaBtn').onclick = () => showAtom('amino_acid');
  const box = document.getElementById('q');
  box.oninput = () => { document.getElementById('codexList').innerHTML = codexResults(box.value); };
  if (q) box.focus();
}

function openSheet(title) {
  document.getElementById('sheetTitle').textContent = title;
  document.getElementById('sheet').classList.add('on');
}
document.getElementById('sheet').addEventListener('click', ev => {
  const fold = ev.target.closest('[data-fold]');
  if (fold) {
    const ul = fold.parentElement.querySelector(':scope > ul');
    if (ul) {
      const now = ul.classList.toggle('fold');
      fold.querySelector('.tw').textContent = now ? '▸' : '▾';
      const more = fold.querySelector('.more');
      if (more) more.style.display = now ? '' : 'none';
    }
    return;
  }
  if (ev.target.id === 'sheet' || ev.target.id === 'sheetClose')
    ev.currentTarget.classList.remove('on');
  const t = ev.target.closest('[data-trace]');
  if (t) showProvenance(t.dataset.trace);
  const at = ev.target.closest('[data-atom]');
  if (at) showAtom(at.dataset.atom);
});
document.getElementById('count').addEventListener('click', () => showCodex());

// ---------- shelf + buttons ----------
document.getElementById('aside').addEventListener('click', ev => {
  const c = ev.target.closest('[data-spawn]'); if (c) { benchTouched = true; spawn(c.dataset.spawn); }
});
document.getElementById('nudge').addEventListener('click', () => {
  const ul = unlockedVerbs();
  const options = recipes.filter(r =>
    !found.has(r.out) && r.in.every(i => found.has(i)) && (!r.verb || ul.has(r.verb)));
  if (!options.length) return toast('Nothing new is reachable — make something first');
  const r = options[Math.floor(Math.random() * options.length)];
  // Reveal one ingredient only. Finding the partner is the game.
  toast(`Try something with ${byId[r.in[0]].emoji} ${byId[r.in[0]].name}`);
});
document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('Wipe all discoveries?')) return;
  try { localStorage.removeItem(KEY); } catch {}
  location.reload();
});
document.getElementById('card').addEventListener('click', ev => {
  if (ev.target.closest('[data-dismiss]')) return dismissCard();
  const t = ev.target.closest('[data-trace]');
  if (t) { dismissCard(); showProvenance(t.dataset.trace); }
});
// Hovering holds the card open; leaving restarts its clock.
document.getElementById('card').addEventListener('pointerenter', () => clearTimeout(cardT));
document.getElementById('card').addEventListener('pointerleave', () => {
  cardT = setTimeout(() => document.getElementById('card').classList.remove('on'), 2500);
});
document.getElementById('shelfToggle').addEventListener('click', () =>
  document.getElementById('aside').classList.toggle('open'));

// Lay the opening bench out on a grid sized to the board.
let benchTouched = false;
function layOutBench() {
  const r = board.getBoundingClientRect();
  if (!r.width || !r.height) return;
  const bench = [...world.querySelectorAll('.chip.board')];
  const cols = r.width < 460 ? 2 : bench.length;     // two columns on a phone
  const rows = Math.ceil(bench.length / cols);
  bench.forEach((el, i) => {
    const cx = (i % cols + .5) / cols;
    const cy = (Math.floor(i / cols) + .5) / rows;
    el.style.left = Math.max(6, Math.min(r.width  * (.12 + cx * .76) - el.offsetWidth  / 2, r.width  - el.offsetWidth  - 6)) + 'px';
    el.style.top  = Math.max(6, Math.min(r.height * (.26 + cy * .46) - el.offsetHeight / 2, r.height - el.offsetHeight - 6)) + 'px';
  });
}

// The board's size is not trustworthy on first paint — in an embedded frame it
// can be measured before the viewport settles, which strands every chip in a
// clamped heap. Watch it instead of measuring once, and keep re-laying the
// opening bench until the player actually moves something. After that, only
// clamp strays back into view so a rotation cannot lose them.
new ResizeObserver(() => {
  if (!benchTouched) { layOutBench(); return; }
  const b = board.getBoundingClientRect();
  drawLinks();
}).observe(board);

document.getElementById('introGo').addEventListener('click', () =>
  document.getElementById('intro').classList.add('gone'));
if (found.size > 4) document.getElementById('intro').classList.add('gone');

renderShelf();
requestAnimationFrame(() => {
  [...found].filter(id => byId[id].starter).forEach(id => spawn(id, 0, 0));
  layOutBench();
  applyView();
});
</script>
