  .atom .z{font:700 6px/1 var(--face-name);opacity:.75;margin-top:1px}
  .atom.alkali{background:var(--alkali)} .atom.alkaline{background:var(--alkaline)}
  .atom.transition{background:var(--transition)} .atom.post{background:var(--post)}
  .atom.metalloid{background:var(--metalloid)} .atom.nonmetal{background:var(--nonmetal)}
  .atom.halogen{background:var(--halogen)} .atom.noble{background:var(--noble)}
  .atom.lanthanide{background:var(--lanthanide)} .atom.actinide{background:var(--actinide)}

  .hex{
    display:inline-flex;align-items:center;justify-content:center;flex:none;
    min-width:74px;padding:9px 13px;background:#EFE6F5;color:#5B3E7A;
    font:700 11.5px var(--face-name);text-align:center;line-height:1.15;
    clip-path:polygon(14% 0,86% 0,100% 50%,86% 100%,14% 100%,0 50%);
  }
  .particle{
    display:inline-flex;align-items:center;gap:5px;flex:none;padding:6px 14px;
    border-radius:99px;font:700 11.5px var(--face-name);color:#8A6A12;
    background:radial-gradient(circle,#FFF0C4 0%,#FDE39B 70%,rgba(253,227,155,0) 100%);
  }

  /* game-element chips tinted by family */
  .chip[data-fam]{border-color:color-mix(in srgb,var(--fam) 46%,var(--line))}
  .chip[data-fam] .e{filter:saturate(1.05)}
  .chip.board[data-fam]{
    border-color:var(--fam);
    box-shadow:0 3px 0 color-mix(in srgb,var(--fam) 26%,rgba(var(--shade),.1));
  }
  .fam-earth{--fam:var(--fam-earth)}   .fam-water{--fam:var(--fam-water)}
  .fam-fire{--fam:var(--fam-fire)}     .fam-plant{--fam:var(--fam-plant)}
  .fam-animal{--fam:var(--fam-animal)} .fam-microbe{--fam:var(--fam-microbe)}
  .fam-food{--fam:var(--fam-food)}     .fam-myth{--fam:var(--fam-myth)}
  .fam-metal{--fam:var(--fam-metal)}   .fam-wild{--fam:var(--fam-wild)}

  /* settings */
  .setrow{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
  .setrow button{
    display:flex;align-items:flex-start;gap:10px;text-align:left;width:100%;
    padding:9px 12px;border-radius:11px;background:var(--surface);border:1.5px solid var(--line);cursor:pointer;
  }
  .stx{display:flex;flex-direction:column;gap:2px;min-width:0}
  .setrow button b{font:700 13.5px var(--face-name);color:var(--ink)}
  .setrow button i{font-style:normal;font-size:11.5px;color:var(--ink-soft)}
  .setrow button.on{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 12%,var(--card))}
  .setrow button.on b{color:var(--brick)}
  /* The mark is a reading aid, not decoration: it repeats the option's rank
     (A/B/C) or its state, so the column can be skimmed without reading. */
  .smark{
    flex:none;width:22px;height:22px;border-radius:6px;display:flex;
    align-items:center;justify-content:center;margin-top:1px;
    font:700 11px/1 var(--face-data);color:var(--ink-soft);
    background:rgba(var(--shade),.16);border:1px solid var(--line);
  }
  .setrow button.on .smark{color:var(--on-accent);background:var(--orange);border-color:var(--orange)}
  .setrow button.danger .smark{color:var(--brick);background:color-mix(in srgb,var(--brick) 16%,transparent);border-color:color-mix(in srgb,var(--brick) 40%,transparent)}
  /* A two-way choice, said once. The label never changes when you flip it —
     only the note under it and the switch itself — so the row does not move
     and you are never reading a button that describes the state you are not in. */
  .switches{display:flex;flex-direction:column;gap:7px;margin-bottom:6px}
  .switch{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;cursor:pointer;
    padding:10px 12px;border-radius:11px;background:var(--surface);border:1.5px solid var(--line);
  }
  .switch b{font:700 13.5px var(--face-name);color:var(--ink)}
  .switch i{font-style:normal;font-size:11.5px;color:var(--ink-soft)}
  .switch .stx{flex:1;min-width:0}
  .switch .knob{
    flex:none;position:relative;width:40px;height:23px;border-radius:99px;
    background:rgba(var(--shade),.26);border:1px solid var(--line);
    transition:background .16s,border-color .16s;
  }
  .switch .knob::after{
    content:'';position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;
    background:var(--ink-soft);transition:transform .16s,background .16s;
  }
  .switch.on{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 10%,var(--card))}
  .switch.on b{color:var(--brick)}
  .switch.on .knob{background:var(--orange);border-color:var(--orange)}
  .switch.on .knob::after{transform:translateX(17px);background:var(--on-accent)}
  @media (prefers-reduced-motion:reduce){
    .switch .knob,.switch .knob::after{transition:none}
  }
  .gmark{
    display:inline-flex;align-items:center;justify-content:center;
    width:19px;height:19px;margin-right:7px;border-radius:5px;vertical-align:-4px;
    background:color-mix(in srgb,var(--orange) 20%,transparent);color:var(--orange);
    font:700 11px/1 var(--face-data);
  }

  /* Tiles: the option that can be shown rather than described. */
  .settiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:7px;margin-bottom:8px}
  .settiles button{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    padding:8px 6px 7px;border-radius:11px;cursor:pointer;
    background:var(--surface);border:1.5px solid var(--line);
  }
  .settiles button b{font:700 11.5px/1.15 var(--face-name);color:var(--ink);text-align:center}
  .settiles button.on{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 12%,var(--card))}
  .settiles button.on b{color:var(--brick)}
  .gsw,.tsw,.dsw{
    display:block;width:100%;height:40px;border-radius:7px;
    border:1px solid var(--line);overflow:hidden;
  }
  /* The swatch is painted by the same rule that paints the real ground —
     see body.g-* above — so the two can never drift apart. */
  /* body paints its ground fixed to the viewport; a 40px swatch has to paint
     its own box instead, or it shows whatever slice of the page sits behind it.
     Only the attachment is overridden — each ground's own background-size is
     what makes graph ruled and profile layered. */
  .gsw{background-attachment:scroll !important;position:relative;overflow:hidden}
  /* A swatch of flat colour tells you almost nothing. Standing a real drawing
     on each ground shows the thing that actually matters — whether a specimen
     reads against it — and gives the row something to look at. */
  .gleaf{
    position:absolute;left:50%;top:50%;--g:20px;line-height:0;
    transform:translate(-50%,-50%);
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.4));
    transition:transform .3s cubic-bezier(.2,.9,.3,1.4);
  }
  .settiles button:hover .gleaf{transform:translate(-50%,-50%) scale(1.22) rotate(-7deg)}
  .settiles button.on .gleaf{transform:translate(-50%,-50%) scale(1.1)}
  .settiles button{transition:transform .16s,border-color .16s,background .16s}
  .settiles button:hover{transform:translateY(-2px)}
  .settiles button:hover .tsw svg{transform:scale(1.14) rotate(6deg);transition:transform .3s}
  .settiles button:hover .dsw b{transform:scale(1.1);transition:transform .3s}
  /* Fluid drifts over 44 seconds on the real ground, which in a 40px preview
     is indistinguishable from a still image. Show the same motion, faster. */
  .gsw.g-fluid{animation-duration:7s !important}
  @keyframes swTwinkle{0%,100%{opacity:.55} 50%{opacity:1}}
  .gsw.g-deep{animation:swTwinkle 3.4s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){
    .gleaf,.settiles button,.settiles button:hover .tsw svg{transition:none}
    .gsw.g-fluid{animation:none !important}
    .gsw.g-deep{animation:none}
  }
  .tsw{display:flex;align-items:center;justify-content:center;background:var(--card)}
  .tsw svg{width:28px;height:28px}
  /* Miniatures of the three card footprints. */
  .dsw{display:flex;align-items:center;justify-content:center;background:var(--card)}
  .dsw b{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
  .dbox{width:23px;height:30px;border:1px solid var(--ink-soft);border-radius:2px;padding:3px 2px;background:rgba(var(--shade),.12)}
  .dbox .dart{display:block;width:100%;height:13px;background:var(--ink-soft);opacity:.55;border-radius:1px}
  .dbox .dnm{display:block;width:100%;height:4px;margin-top:3px;background:var(--ink-soft);opacity:.35}
  .dfree{width:23px}
  .dfree .dart{display:block;width:19px;height:15px;margin:0 auto;background:var(--ink-soft);opacity:.55;border-radius:2px}
  .dfree .dpad{display:block;width:23px;height:7px;margin-top:2px;border:1px solid var(--ink-soft);border-radius:2px;opacity:.6}
  .dpill{flex-direction:row !important;gap:3px !important;width:38px;height:13px;padding:0 4px;
         border:1px solid var(--ink-soft);border-radius:99px;opacity:.75}
  .dpill .ddot{width:7px;height:7px;border-radius:50%;background:var(--ink-soft);flex:none}
  .dpill .dline{flex:1;height:3px;border-radius:2px;background:var(--ink-soft);opacity:.55}

  /* depth: hide the technical layer for younger readers */
  :root[data-depth="kid"] .formula,
  :root[data-depth="kid"] .molbox,
  :root[data-depth="kid"] ul.tree.bed .cat,
  :root[data-depth="kid"] .atom .z,
  :root[data-depth="kid"] .pnums,
  :root[data-depth="kid"] .stepbody .src{display:none}
  :root[data-depth="kid"] .why{font-size:14px;line-height:1.55}
  :root[data-depth="kid"] .stepbody p{font-size:13.5px}
  :root[data-depth="scientist"] .pfrom{display:block}

  /* tone: straight keeps everything, just stops shouting */
  :root[data-tone="straight"] .ring,
  :root[data-tone="straight"] .burst,
  :root[data-tone="straight"] .drop{display:none}
  :root[data-tone="straight"] .chip.folk{background:var(--card);border-color:var(--line)}
  #settings{font-size:14px;line-height:1}
  /* the chain as citation cards */
  .modes{display:flex;gap:5px;margin:0 0 10px}
  .modes button{
    font:600 11.5px var(--face-name);padding:5px 11px;border-radius:99px;cursor:pointer;
    background:var(--surface);border:1.5px solid var(--line);color:var(--ink-soft);
  }
  .modes button.on{background:var(--ink);border-color:var(--ink);color:var(--cream)}
  .steps{display:flex;flex-direction:column;gap:7px}
  .step{display:flex;gap:9px;align-items:flex-start}
  .stepno{
    font:800 10px/1 var(--face-name);color:var(--ink-soft);background:var(--card);
    border:1.5px solid var(--line);border-radius:99px;
    min-width:20px;height:20px;line-height:17px;text-align:center;flex:none;margin-top:7px;
  }
  .stepbody{
    flex:1;min-width:0;background:var(--surface);border:1.5px solid var(--line);
    border-radius:11px;padding:8px 10px;
  }
  .stepgest{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:5px;cursor:pointer}
  .stepgest .g{
    display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:99px;
    background:var(--card);border:1px solid var(--line);font:600 11.5px var(--face-name);cursor:pointer;
  }
  .stepgest em{font-style:normal;color:var(--ink-soft);font:700 10.5px var(--face-name)}
  .stepgest .tw.why{margin-left:auto;color:var(--ink-soft);font-size:11px}
  .stepwhy.fold{display:none}
  .stepbody p{margin:0 0 5px;font-size:12.5px;line-height:1.5;color:var(--ink-soft)}
  .stepbody .src{margin:0;font-size:10.5px}
  /* guess before the reveal */
  .guess{text-align:center;padding:14px 6px 8px}
  .guess .big{font-size:44px;line-height:1;margin-bottom:8px}
  .guess h3{font:800 18px var(--face-name);margin:0 0 8px}
  .guess p{font-size:13.5px;color:var(--ink-soft);margin:0 auto 16px;max-width:34ch;line-height:1.5}
  .opts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
  .opts button{
    font:800 17px var(--face-name);min-width:66px;padding:11px 16px;border-radius:13px;
    background:var(--surface);border:2px solid var(--line);cursor:pointer;
  }
  .opts button:hover{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 12%,var(--card))}
  .guess .skip{
    background:none;border:none;color:var(--ink-soft);font:600 12px var(--face-name);
    text-decoration:underline;cursor:pointer;padding:4px;
  }
  .verdict{
    width:100%;margin-top:6px;font:700 12px var(--face-name);padding:5px 9px;border-radius:8px;
  }
  .verdict.hit{color:#41652A;background:#E6F0DC}
  .verdict.miss{color:#8A6A12;background:#FDF0CE}
  /* index entry */
  .ent{
    display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:6px 8px;margin-bottom:4px;
    background:var(--surface);border:1.5px solid var(--line);border-radius:10px;font-size:12.5px;
  }
  .ent .g{
    display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:99px;
    background:var(--card);border:1px solid var(--line);cursor:pointer;font-weight:600;
  }
  .ent .g:hover{border-color:var(--orange)}
  .ent em{font-style:normal;color:var(--ink-soft);font-size:11px;font-weight:700}
  .ent .arw{color:#C6B69C;margin:0 1px}
  .ent .out{background:#FFF3E9;border-color:#F0D6C0}
  /* A bare "+" instead of "+ Chart" / "+ Chart all" / "Put on the bench" —
     the label was costing real estate on every single row of every
     derivation list for no information a tooltip doesn't already carry.
     One shape everywhere, not scoped to just the .ent rows it started in —
     scoping it there was itself the bug that let "Put on the bench" (which
     lives in .cardrow, not .ent) fall through to an unstyled default and
     visibly disagree with every other "+". ("Why two different versions of
     the plus sign... Make sure consistent" — found live.) */
  .addroute{
    flex:none;display:inline-flex;align-items:center;justify-content:center;
    width:24px;height:24px;padding:0;border-radius:99px;border:1.5px solid var(--line);
    background:var(--card);color:var(--ink-soft);font:700 15px/1 var(--face-name);cursor:pointer;
  }
  .ent .addroute{margin-left:auto}
  .addroute.fav.on{border-color:var(--orange);color:var(--orange)}
  .addroute:hover{border-color:var(--orange);color:var(--brick)}
  /* "+ Chart all" (the whole tree below a node) reads as a stronger action
     than "+ Chart" (one path) — a filled accent says so without more text.
     ("keep the ones that add all a darker shade" — found live.) Deliberately
     --orange/--on-accent, not --ink/--ink-soft: those are TEXT tokens that
     invert between themes (light ink on dark backgrounds in dark mode), so
     using them as a fill read as lighter, not darker, in dark mode — caught
     by measuring the actual rendered colour, not by eye. */
  .addroute.all{background:var(--orange);border-color:var(--orange);color:var(--on-accent)}
  .addroute.all:hover{background:var(--brick);border-color:var(--brick);color:var(--on-accent)}
  .hint2{font-size:11.5px;color:var(--ink-soft);font-style:italic;margin:4px 2px 0}
  /* Named regulated allergens on a resolved ingredient, and a summary banner
     above the list. Amber, not red — this states a legal fact about the label,
     it is not a warning to act on. */
  .allergen-banner{
    margin:8px 0;padding:8px 11px;border-radius:9px;font-size:12px;line-height:1.4;
    background:color-mix(in srgb,var(--mustard) 16%,var(--card));
    border:1px solid color-mix(in srgb,var(--mustard) 45%,var(--line));
  }
  .allergen-tag{
    font-style:normal;font:700 9px/1 var(--face-data);letter-spacing:.03em;text-transform:uppercase;
    margin-left:6px;padding:2px 6px;border-radius:99px;
    background:color-mix(in srgb,var(--mustard) 22%,var(--card));color:var(--ink);
  }
  /* Open Food Facts' own three ratings — real, regulated colour scales
     (Nutri-Score/Eco-Score A-E, NOVA 1-4), not this game's palette, so
     they're written as literal hex rather than derived like everything
     else visual here. */
  .ratingRow{display:flex;gap:6px;margin:0 0 10px}
  .ratingBadge{flex:1;text-align:center;border-radius:10px;padding:7px 4px 6px;min-width:0}
  .ratingBadge .rbVal{display:block;font:800 19px var(--face-name);line-height:1.1}
  .ratingBadge .rbLbl{display:block;font:700 8.5px var(--face-data);letter-spacing:.03em;text-transform:uppercase;opacity:.85;margin-top:1px}
  /* One score's own level breakdown (the "i" sheet) — a small round grade
     badge, same heat-map colour the top-level badge already uses, beside
     its own short description. Reusing .ent/.g here made a bare letter the
     ONLY content of an inline pill sized for an icon+name pair — oversized
     and stacked instead of sitting beside its text. ("can you heat map
     colour the levels... and fit better in pills" — found live.) */
  .levelRow{display:flex;align-items:center;gap:9px;margin-bottom:6px}
  .levelBadge{
    flex:none;width:24px;height:24px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font:800 12px var(--face-name);box-shadow:var(--raise);
  }
  .levelDesc{flex:1;font-size:12px;line-height:1.35;color:var(--ink)}
  .offTags{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 9px}
  .offTag{
    font:700 10px var(--face-data);padding:3px 8px;border-radius:99px;
    background:var(--surface);border:1px solid var(--line);color:var(--ink-soft);
  }
  .offTag.warn{
    background:color-mix(in srgb,var(--mustard) 20%,var(--card));
    border-color:color-mix(in srgb,var(--mustard) 45%,var(--line));color:var(--ink);
  }
  .nutriTable{width:100%;border-collapse:collapse;margin:0 0 9px;font-size:12.5px}
  .nutriTable td{padding:3px 0;border-bottom:1px solid var(--line)}
  .nutriTable td:last-child{text-align:right;font-family:var(--face-data);color:var(--ink-soft)}
  .nutriTable tr:last-child td{border-bottom:none}
  .offSection{font:700 10.5px var(--face-data);letter-spacing:.03em;text-transform:uppercase;color:var(--ink-soft);margin:11px 0 5px}
  .hintbox{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:10px}
  .hintbox p{margin:0 0 7px;font-size:13.5px;line-height:1.5;color:var(--ink-soft)}
  .hintbox p:last-child{margin-bottom:0}
  .hintbox b{color:var(--ink)}
  .path{display:flex;flex-direction:column;gap:4px}
  .pstep{
    display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;
    background:var(--surface);border:1.5px solid var(--line);border-radius:10px;
  }
  .pstep:hover{border-color:var(--orange)}
  .pstep.last{background:color-mix(in srgb,var(--orange) 12%,var(--card));border-color:var(--orange)}
  .pstep .pn2{
    font:800 9.5px var(--face-name);color:var(--ink-soft);background:var(--card);
    border:1.5px solid var(--line);border-radius:99px;
    min-width:19px;height:19px;line-height:16px;text-align:center;flex:none;
  }
  .pstep .g{font:600 13px var(--face-name);flex:1;min-width:0}
  .pstep i{font-style:normal;font-size:10.5px;color:var(--ink-soft);flex:none}
  .jump{
    cursor:pointer;border-bottom:1.5px dotted var(--orange);color:var(--ink);
  }
  .hintbox .answer{
    font:700 15px var(--face-name);color:var(--ink);text-align:center;
    background:color-mix(in srgb,var(--orange) 10%,var(--card));border-radius:9px;padding:9px 6px;
  }
  aside h2.locked,#sheetBody h2.locked{color:var(--ink-soft);opacity:.6}
  .chip.locked{opacity:.5;border-style:dashed;cursor:pointer}
  /* A label-reader miss, flagged in the same brick red as the fire family —
     not a made-up "danger" colour, an existing palette accent reused so it
     still reads as this game's own voice. Full opacity, unlike the ordinary
     .locked fade: an unresolved ingredient from a real scan should stand
     out, not blend into "things you simply haven't unlocked yet". */
  .chip.locked.missing{opacity:1;border-color:var(--brick);color:var(--brick)}
  .missNote{
    margin:2px 0 9px;padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;
    color:var(--brick);background:color-mix(in srgb,var(--brick) 12%,var(--card));
  }
  /* Greyed, not just faded: an unmade thing should read as a silhouette of
     itself, so a shelf of them scans as absence rather than as low contrast. */
  .chip.locked .art{filter:grayscale(1)}
  .sheet .cardrow button.ghost.on{border-color:var(--orange);color:var(--brick)}
  /* Icon-only cardrow buttons: square, not text-width — this is what lets
     the codex's row of five fit on one line instead of wrapping to two. */
  .cardrow button.ghost.icon{padding:8px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;flex:none}
  .chip.locked .q{
    font-style:normal;font:800 9.5px var(--face-name);color:var(--on-accent);background:var(--c-craft-bs);
    border-radius:99px;min-width:14px;height:14px;line-height:14px;text-align:center;margin-left:3px;
  }
  /* molecules */
  .molbox{display:flex;justify-content:center;padding:6px 0 10px}
  svg.mol .bond{stroke:#5A4A38;stroke-width:3.4;stroke-linecap:round}
  svg.mol .ball{stroke:#3B2E20;stroke-width:1.6}
  svg.mol .lbl{text-anchor:middle;dominant-baseline:central;font-weight:800;
    font-family:var(--face-name);pointer-events:none}
  .formula{
    text-align:center;font:800 17px var(--face-name);color:var(--ink);margin-bottom:10px;
  }
  .formula sub{font-size:.66em;vertical-align:-.25em}
  .aagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:6px}
  .aa{
    display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;min-width:0;
    background:var(--surface);border:1.5px solid var(--line);border-radius:11px;overflow:hidden;
  }
  .aa:hover{border-color:var(--metalloid)}
  .aa b{
    font:800 10px var(--face-name);color:var(--on-accent);background:var(--nonmetal);
    border-radius:5px;min-width:18px;height:18px;line-height:18px;text-align:center;flex:none;
  }
  .aatx{display:flex;flex-direction:column;min-width:0;line-height:1.25}
  .aatx em{
    font:600 11.5px var(--face-name);font-style:normal;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .aatx i{
    font-style:normal;font:600 9.5px var(--face-name);color:var(--ink-soft);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  /* periodic table */
  /* ── the docked periodic table ────────────────────────────────────────
     Sits inside #board, so it covers the bench and never the shelf, and its
     height is one custom property that the grab handle writes. Back to a
     fixed bottom overlay, not a shelf-pane tab — "the right pane should be
     OUR elements, not the periodic table; the periodic table stays at the
     bottom for the scientist view" (David, correcting the earlier version).
     The aside pane keeps its own separate "Shelf"/"Elements" tabs below,
     but "Elements" there is a plain list of this game's own elements, not
     this chart. */
  #ptDock{
    position:absolute;left:0;right:0;bottom:0;z-index:30;
    height:var(--pth,370px);display:none;flex-direction:column;
    background:color-mix(in srgb,var(--surface) 94%,transparent);
    backdrop-filter:blur(10px);
    border-top:2px solid var(--line);box-shadow:0 -12px 30px -14px rgba(var(--shade),.8);
  }
  body.pt-on #ptDock{display:flex}
  /* The tab: a permanent fixture of the board's bottom edge, not a button
     among other buttons — always there to grab, whether the drawer under
     it is open or shut, and it rides up to sit on the dock's own edge
     once that drawer opens instead of vanishing into it. */
  #ptTab{
    position:absolute;left:50%;bottom:0;transform:translateX(-50%);z-index:31;
    display:flex;align-items:center;gap:6px;padding:6px 14px 5px;cursor:pointer;
    background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(10px);
    border:2px solid var(--line);border-bottom:none;border-radius:10px 10px 0 0;
    font:700 11px var(--face-name);color:var(--ink-soft);transition:bottom .18s,color .15s,border-color .15s;
  }
  #ptTab:hover,#ptTab.on{color:var(--orange);border-color:var(--orange)}
  #ptTab .gl{--g:14px}
  body.pt-on #ptTab{bottom:var(--pth,370px)}
  @media(max-width:720px){ #ptTab{display:none} }
  #ptGrab{
    flex:none;height:16px;display:flex;align-items:center;justify-content:center;
    cursor:ns-resize;touch-action:none;
  }
  #ptGrab i{display:block;width:44px;height:4px;border-radius:99px;background:var(--line)}
  #ptGrab:hover i{background:var(--orange)}
  /* The aside pane's own tabs — Shelf (what you've found), Elements (a
     plain list of every element in the game, NOT the periodic chart),
     Proteins (the twenty amino acids) and Animals (browse by taxonomy).
     Icon-only, since a text label doesn't fit four across. */
  #asideTabs{display:flex;gap:4px;margin:0 0 9px}
  #asideTabs .atab{
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:7px 6px;border-radius:8px;color:var(--ink-soft);background:none;cursor:pointer;
  }
  #asideTabs .atab:hover{color:var(--ink)}
  #asideTabs .atab.on{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
  .apane{display:none}
  .apane.on{display:block}
  #ptHead{
    flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    padding:0 12px 7px;font:400 11px/1.3 var(--face-name);color:var(--ink-soft);
  }
  #ptHead b{font:700 12px var(--face-name);color:var(--ink)}
  #ptBody{flex:1;min-height:0;overflow:auto;padding:0 12px 12px}
  /* Eighteen columns of 1fr across a 1700px board makes every tile 90px wide
     with 9px type inside it — the squares grow and the writing does not. Cap
     the table's width instead and centre it, so a tile stays tile-sized and
     the symbol can be read at arm's length. */
  /* One cell size, set by ptFit() from whichever runs out first — the width of
     the board or the height of the dock — so the whole table is on screen at
     once instead of being something you scroll. */
  #ptBody .ptab{
    margin:0 auto;gap:2px;justify-content:center;
    grid-template-columns:calc(var(--ptcell,54px) * .5) repeat(18,var(--ptcell,54px));
    grid-template-rows:calc(var(--ptcell,54px) * .42) repeat(7,var(--ptcell,54px))
                       calc(var(--ptcell,54px) * .42) repeat(2,var(--ptcell,54px))
                       calc(var(--ptcell,54px) * .42);
  }
  /* Group along the top, period down the side — the two axes the chart is for. */
  #ptBody .gnum,#ptBody .pnum{
    display:flex;align-items:center;justify-content:center;font-style:normal;
    font:700 calc(var(--ptcell,54px) * .21)/1 var(--face-data);color:var(--ink-soft);
  }
  #ptBody .atom{
    width:var(--ptcell,54px);height:var(--ptcell,54px);position:relative;
    padding:calc(var(--ptcell,54px) * .07) 1px calc(var(--ptcell,54px) * .05);
    border-radius:4px;gap:0;justify-content:flex-start;align-items:center;
  }
  #ptBody .atom .z{
    display:block;align-self:flex-start;margin:0 0 0 calc(var(--ptcell,54px) * .09);
    font:700 calc(var(--ptcell,54px) * .17)/1 var(--face-data);opacity:.85;
  }
  /* The one thing you read from across the room. */
  #ptBody .atom .sym{
    font:800 calc(var(--ptcell,54px) * .40)/1 var(--face-name);letter-spacing:-.5px;
    margin-top:calc(var(--ptcell,54px) * .02);
  }
  #ptBody .atom .nm{
    display:block;margin-top:auto;max-width:100%;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;padding:0 2px;
    font:600 calc(var(--ptcell,54px) * .135)/1 var(--face-name);opacity:.9;
  }
  /* The drawing, where the element has one — a tile you can recognise before
     you have read it. Only the 76 you can actually hold have art. */
  /* The drawing, demoted to a watermark in the top-right corner so it says
     what the thing is to hold without competing with the symbol. */
  #ptBody .atom .gl{
    position:absolute;top:calc(var(--ptcell,54px) * .06);right:calc(var(--ptcell,54px) * .06);
    --g:calc(var(--ptcell,54px) * .26);line-height:0;opacity:.5;
  }
  /* Below about 44px the name cannot be read and the watermark is noise. */
  #ptBody.tight .atom .gl,#ptBody.tight .atom .nm{display:none}
  #ptBody.tight .atom{justify-content:center}
  #ptBody.tight .atom .sym{font-size:calc(var(--ptcell,54px) * .46);margin-top:0}
  /* Three states, and they mean different things: dim is not in this world at
     all, plain is in it but you have not made it, lit is on your shelf. */
  #ptBody .atom{cursor:pointer;opacity:.9}
  #ptBody .atom.off{opacity:.2}
  #ptBody .atom.have{outline:2px solid var(--discovery);outline-offset:1px}
  /* Discovered is a fact about your shelf; this is a fact about the bench
     right now — worth telling apart, so it gets its own live cue instead
     of just a stronger version of .have's outline. */
  @keyframes ptPulse{
    0%,100%{box-shadow:0 0 0 2px var(--orange)}
    50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--orange) 35%,transparent)}
  }
  #ptBody .atom.bench{animation:ptPulse 1.6s ease-in-out infinite}
  #ptBody .atom:hover{transform:scale(1.14);z-index:2;position:relative}
  /* Sits in the real empty cells of the chart (the Be/Mg-B/Al gap), not
     above it — so reading the legend and reading the table are the same
     motion instead of a look-up-then-back-down. */
  .ptLegend{
    display:flex;flex-wrap:wrap;align-content:center;justify-content:center;
    gap:4px;padding:4px;
  }
  .ptLegend span{
    font:700 calc(var(--ptcell,54px) * .16) var(--face-name);color:var(--on-accent);
    padding:3px 7px;border-radius:99px;white-space:nowrap;
  }
  #ptBody.tight .ptLegend span{padding:2px 5px}
  #ptClose{margin-left:auto;flex:none}
  @media(max-width:720px){ body.pt-on #ptDock{display:none} }

  .elfact{display:flex;gap:11px;align-items:flex-start;margin:2px 0 4px}
  .elfact > div{min-width:0}
  .elfact p{margin:3px 0 5px}
  .elcat{font:700 9.5px/1 var(--face-data);letter-spacing:.9px;text-transform:uppercase;color:var(--ink-soft)}
  .ptab{display:grid;grid-template-columns:repeat(18,1fr);grid-auto-rows:1fr;gap:2px;margin:8px 0}
  .ptab .atom{width:100%;height:auto;aspect-ratio:1;border-radius:4px;min-width:0}
  .ptab .atom .sym{font-size:9px}
  .ptab .atom .z{display:none}
  .ptab .atom.off{opacity:.24}
  .ptab .gap{grid-column:span var(--n)}
  .legend{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 4px}
  .legend span{
    font:700 9.5px var(--face-name);color:var(--on-accent);padding:3px 8px;border-radius:99px;
  }

  /* bedrock: same pill and row language as "Made From" above it now, not a
     quieter, differently-shaped tree of its own. ("can we make the section
     and pills look consistent?" — found live.) */
  .bedhead{
    text-align:center;font:700 9px var(--face-name);letter-spacing:1.2px;text-transform:uppercase;
    color:#A8977E;margin:14px 0 8px;position:relative;
  }
  .bedhead::before,.bedhead::after{
    content:'';position:absolute;top:50%;width:26%;height:2px;background:var(--line);
  }
  .bedhead::before{left:2%} .bedhead::after{right:2%}
  .bedgroup{margin-bottom:8px}
  .bedof{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    font:700 12px var(--face-name);color:var(--ink-soft);margin-bottom:4px;
  }
  .bedof .addroute{flex:none;width:20px;height:20px;font-size:13px}
  /* Thinner than a "Made From" row on purpose — this list is often eight or
     more items long (a body's whole organ set), and giving each one the
     full card-row treatment reads as a lot more scrolling than the same
     content needs. ("maybe a bit thinner for each item?" — found live.) */
  ul.tree.bed .brow{
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:4px 7px;margin:0 0 3px;
    background:var(--surface);border:1.5px solid var(--line);border-radius:9px;
    font-size:12px;color:var(--ink);cursor:pointer;
  }
  ul.tree.bed .brow .tw{
    font-size:9px;color:var(--ink-soft);width:11px;flex:none;text-align:center;line-height:1;
  }
  ul.tree.bed .brow .g{
    display:inline-flex;align-items:center;gap:4px;padding:1.5px 6px;border-radius:99px;
    background:var(--card);border:1px solid var(--line);cursor:pointer;font-weight:600;
  }
  ul.tree.bed .brow .g:hover{border-color:var(--orange)}
  ul.tree.bed .brow .addroute{margin-left:auto;width:20px;height:20px;font-size:13px}
  .shelfbar{display:flex;gap:5px;align-items:center;margin:0 2px 8px}
  .search.sm{padding:7px 10px;font-size:12.5px;border-radius:9px}
  .shelfbar button{
    width:26px;height:26px;padding:0;border-radius:8px;font-size:14px;line-height:1;flex:none;
  }
  aside h2{
    display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none;
    padding:3px 4px;border-radius:7px;white-space:nowrap;overflow:hidden;
  }
  aside h2.ready{
    color:var(--avocado);cursor:default;letter-spacing:1px;
    border-bottom:1.5px solid color-mix(in srgb,var(--avocado) 35%,transparent);
    padding-bottom:5px;margin-bottom:8px;
  }
  aside h2.ready i{background:var(--avocado)}
  aside h2.ready em{color:var(--avocado)}
  aside h2:hover{background:rgba(255,255,255,.55)}
  aside h2 em{font-style:normal;color:#BCAC93;font-weight:700}
  aside h2 .lv{
    font:800 9px var(--face-name);color:var(--on-accent);background:var(--avocado);
    border-radius:99px;padding:2px 6px;margin-left:auto;
  }
  aside h2 .cv{font-size:8px;color:#BCAC93;margin-left:auto}
  aside h2 .lv + .cv{margin-left:4px}
  aside h2 i{
    display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:6px;
    background:var(--fam,var(--line));vertical-align:middle;
  }
  .bed-eq{margin-bottom:6px}

  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
  @media(max-width:720px){
    /* overflow-x:auto, not hidden: a control that doesn't fit should be
       reachable by a scroll, never simply gone with no way back to it —
       reported live from a real phone where the settings gear ran off the
       edge and there was nothing to do about it but reload. */
    header{gap:6px;padding:9px 10px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden}
    h1{font-size:15px;flex:none;white-space:nowrap}
    /* Reset moves into Settings. It is destructive, and it was being clipped
       off the end of the header at 375px. */
    #reset{display:none}
    #undo{padding:6px 9px}
    .mark svg{width:22px;height:22px}
    .goal{display:none}
    #live{display:none}
    /* "18 of 826" says everything "18 of 826 found" did, in less width —
       and the header is exactly where width is short on a phone. */
    .count .fw{display:none}
    header button,.count{padding:6px 10px;font-size:12px;white-space:nowrap;flex:none}
    aside{
      position:fixed;top:50px;bottom:62px;right:0;width:min(250px,78vw);z-index:120;
      transform:translateX(100%);transition:transform .22s;background:var(--card);
      border-left:2px solid var(--ink);box-shadow:-8px 0 24px rgba(var(--shade),.14);
    }
    aside.open{transform:none}
    #tray{gap:4px;padding:7px 4px}
    /* Icon and label both grow to use more of the button, even though the
       button itself is still squeezed to fit six across a phone width. */
    /* Sized from the number of verbs there actually are, not from the six
       there were when this rule was written. --verbs is set at render time,
       so adding a tool cannot silently push the tray off the screen. */
    .verb{width:calc((100vw - 40px)/var(--verbs,6));min-width:0;font-size:10.5px;padding:6px 1px;gap:2px}
    /* Past about eight there is no width left for a word under the icon. */
    #tray{flex-wrap:wrap;row-gap:4px}
    /* A 94px card is a quarter of the width of a 375px phone. Smaller here, and
       cardSize() measures a real one, so placement follows without being told. */
    .chip.board{--cw:80px}
    .chip.board .art{width:50px;height:50px}
    .chip.board .n{font-size:9px}
    .chip.board .ac{font-size:7px;letter-spacing:.04em}
    #card{left:8px;right:8px;bottom:74px;width:auto}
    /* The discovery card spans the width on a phone, so the zoom stack has to
       get out of its way rather than sit on top of it. */
    body:has(#card.on) #zoom{bottom:auto;top:58px}
    #sheet{padding:10px}
    .sheetbox{max-height:92vh}
  }
  /* ── the ladder ───────────────────────────────────────────────────── */
  .ladderlede{font-size:13.5px;color:var(--ink-soft);margin:2px 2px 14px;line-height:1.55}
  .ladder{display:flex;flex-direction:column;gap:0;border-left:1px solid var(--line);
          margin-left:6px;padding-left:0}
  .rung{position:relative;padding:10px 0 12px 74px;border-top:1px solid var(--line)}
  .rung:first-child{border-top:0}
  .rung .mag{
    position:absolute;left:8px;top:11px;font:400 10.5px/1 var(--face-data);
    color:var(--ink);letter-spacing:.04em;font-variant-numeric:tabular-nums;
  }
  .rung .rungname{
    display:block;font:400 10px/1 var(--face-data);letter-spacing:.09em;
    text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px;
  }
  /* An empty decade is information, not a gap to be tidied away. */
  .rung.empty{padding:7px 0 7px 74px;opacity:.42}
  .rung.empty i{font-style:normal;font:400 10px/1 var(--face-data);
                letter-spacing:.06em;color:var(--ink-soft)}
  .rung.empty .mag{top:8px}
  /* Denser than the shelf: the ladder is for seeing the whole span at once. */
  .ladder .chip.lad{--cw:62px;padding:5px 3px 4px}
  .ladder .chip.lad .art{width:30px;height:30px}
  .ladder .chip.lad .n{font-size:7.6px;letter-spacing:.03em;min-height:2.2em}
  .ladder .chip.lad .rl{width:16px;margin:3px auto 2px}
  .ladder .chip.lad .ac{display:none}
  .ladder .shelf{gap:4px}
  /* On a phone the label is wider than the gap between two cards, so let it
     wrap and centre rather than run off the edge. */
  @media(max-width:520px){
    #introSay{white-space:normal;text-align:center;width:min(260px,calc(100vw - 28px));
              left:50%!important}
  }
  @media(max-width:400px){ h1{display:none} }
  #shelfToggle{width:34px;padding:6px 0;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center}
  /* On a phone the shelf slides in over the board; on a desktop it is a column
     that can be given back to the bench. Same button, and it now does
     something in both places — it used to be painted over its own hide rule
     on desktop and sat there inert. */
  body.shelf-shut aside{display:none}
  header button:disabled{opacity:.38;cursor:default}
  header button.on{border-color:var(--orange);color:var(--orange)}
  #shelfToggle.off{color:var(--ink-soft);opacity:.65}

  /* Every control says what it does. The browser's own tooltip takes about a
     second to appear, renders in the OS font, and cannot be read at all on a
     touch screen — so the title attribute is borrowed and drawn here instead,
     in the game's own type, fast enough to be useful while scanning a row of
     icon buttons. */
  #tip{
    position:fixed;z-index:900;pointer-events:none;opacity:0;
    transform:translateY(3px);transition:opacity .12s,transform .12s;
    max-width:230px;padding:5px 9px;border-radius:4px;
    background:var(--card);border:1px solid var(--line);
    box-shadow:0 8px 20px -8px rgba(var(--shade),.8);
    font:400 11.5px/1.35 var(--face-name);color:var(--ink);
  }
  #tip.on{opacity:1;transform:none}
  /* A destructive control should not look like the others. */
  .danger{border-color:var(--brick)!important;color:var(--brick)!important}
  /* Same standing as #tip — anchored to the button that opened it, never
     the screen — but it takes clicks instead of just showing text. */
  #resetMenu{
    position:fixed;z-index:900;display:flex;flex-direction:column;gap:2px;
    padding:5px;border-radius:10px;background:var(--card);border:1.5px solid var(--line);
    box-shadow:0 12px 28px -10px rgba(var(--shade),.85);
  }
  #resetMenu[hidden]{display:none}
  #resetMenu button{
    padding:8px 16px;border-radius:7px;font:600 12.5px var(--face-name);color:var(--ink);
    text-align:left;white-space:nowrap;border:none;background:none;
  }
  #resetMenu button:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
</style>

<header>

    <svg viewBox="0 0 120 120" aria-hidden="true">
      <rect width="120" height="120" rx="26" fill="#221C14"/>

        <path d="M28 34 Q44 54 56 66"/><path d="M50 26 Q54 48 58 64"/>
        <path d="M70 26 Q66 48 62 64"/><path d="M92 34 Q76 54 64 66"/>

      <circle cx="70" cy="26" r="8" fill="#E0A526"/><circle cx="92" cy="34" r="8" fill="#6B8E4E"/>

    </svg>

  </a>
  <button class="count" id="count" title="Open your codex"></button>

<!-- Anchored to the Reset button, not a screen-covering sheet: it opens
     beside Reset, does one of two things, and clears itself the moment
     you pick one or look away. Lives OUTSIDE <header> deliberately —
     header's own backdrop-filter creates a stacking context that traps
     any descendant, position:fixed or not, no matter what z-index that
     descendant sets, so a copy of this menu nested inside header rendered
     behind the shelf regardless of its own z-index:900 (found live: "reset
     button not usable, hidin behind menu's"). -->
<div id="resetMenu" role="menu" hidden>
  <button id="resetBase" role="menuitem" title="Back to Stone, Water, Sun, and Seed on the bench">Base Element Canvas</button>
  <button id="resetClear" role="menuitem" title="A genuinely empty bench — nothing placed for you" class="danger">Clear Canvas</button>
</div>

<main>
  <div id="board">
    <div id="world">
      <svg id="links"></svg>
    </div>
    <div id="scanTools">
      <button data-scan="camera" title="Scan with the camera"><span class="gl" style="--g:15px">__UI_SCAN__</span></button>

<script>
const DATA = __GAME_DATA__;
const {elements, recipes, verbs} = DATA;

/* Every drawing in the game, keyed by item id. Shapes only — no colour: see
   prototype/art-render.js for how a role becomes a paint. */
const ART = __ART_DATA__;
/* Characteristic size of each item, to the nearest power of ten. */
const SCALE = __SCALE_DATA__;

/* Where "true in general" and "safe in a kitchen" come apart. See
   data/cautions.json — the wording is attached to the hazard, not to the item,
   so it reads the same everywhere on a chain. */
const CAUTIONS = __CAUTION_DATA__;
/* Food-label vocabulary → element ids. See data/labels.json. */
const LABELS = __LABEL_DATA__;
/* Regulated allergens, and which of this world's elements each protein turns
   up in. See data/allergens.json. */
const ALLERGENS = __ALLERGEN_DATA__;
const ALLERGEN_BY_ELEMENT = {};
for (const [key, a] of Object.entries(ALLERGENS.allergens || {}))
  for (const id of a.ids || []) (ALLERGEN_BY_ELEMENT[id] = ALLERGEN_BY_ELEMENT[id] || []).push({ key, ...a });
/* Every recipe's real physical-reaction category, read straight off its own
   why text by tools/reactions.mjs — see data/reactions.json. Keyed the same
   way validate.mjs's own ambiguity check keys a gesture: sorted inputs for a
   merge, input|verb for a process, +@temp for a banded one. */
const REACTIONS = __REACTION_DATA__;
const reactionSig = (r) => {
  const base = r.verb ? `${r.in[0]}|${r.verb}` : [...r.in].sort().join('+');
  return r.at !== undefined ? `${base}@${r.at}` : base;
};
const reactionOf = (r) => REACTIONS[reactionSig(r)] ?? null;
// The same category -> palette-token mapping the payoff ring's own CSS
// (.ring-freeze etc.) uses, so a live-drag preview and the merge's actual
// payoff always agree.
const REACTION_COLOR_VAR = {
  freeze: 'c-water-lo', melt: 'c-fire-lo', boil: 'c-fire-hi', burn: 'c-fire-bs',
  ferment: 'c-ferment-bs', corrode: 'c-mineral-lo', crystallize: 'c-mineral-hi', dissolve: 'c-water-bs',
};
const CAUTION_BY_ID = {};
for (const [kind, h] of Object.entries(CAUTIONS))
  for (const id of h.ids) (CAUTION_BY_ID[id] = CAUTION_BY_ID[id] || []).push({ kind, ...h });
function cautionsFor(id) { return CAUTION_BY_ID[id] || []; }
function cautionHTML(id) {
  const cs = cautionsFor(id);
  if (!cs.length) return '';
  return cs.map(c => `<div class="caution sev-${c.severity || 'cumulative'}">` +
    `<b>${c.label}</b><p>${c.note}</p></div>`).join('');
}
/**
 * The loudest thing said about an element, or nothing.
 *
 * A card that will hurt you should say so on its face, not only once you open
 * it — a lion and a lead pipe were previously indistinguishable from a leaf.
 * Acute beats chronic beats biological, because if a thing can hurt you fast
 * that is the part worth showing first.
 */
const SEV_RANK = { acute: 4, contact: 3, conditional: 2, cumulative: 1 };
function severityOf(id) {
  let best = null;
  for (const c of cautionsFor(id)) {
    const s = c.severity || 'cumulative';
    if (!best || (SEV_RANK[s] ?? 0) > (SEV_RANK[best] ?? 0)) best = s;
  }
  return best;
}
__ART_RENDER__
const byId = Object.fromEntries(elements.map(e => [e.id, e]));

// Display names are per-locale; ids and recipes never are. Swapping "Chips" for
// "French Fries" must not be able to change what a sourced recipe means.
const LOCALE = (navigator.language || 'en-GB');
const nameOf = (e) => (e.aliases && (e.aliases[LOCALE] ||
  e.aliases[Object.keys(e.aliases).find(k => k.split('-')[0] === LOCALE.split('-')[0])])) || e.name;
const merges = new Map(), procs = new Map();
// Temperature-banded processes. A recipe carrying `at` happens at or above
// that many °C, so one tool can have several outcomes on the same thing and
// the number you take it to is the choice. Anything without `at` behaves
// exactly as before, which is why 600-odd existing recipes needed no edit.
const bands = new Map();                            // "id|verb" -> [{at, r}] hot-last
for (const r of recipes) {
  if (!r.verb) { merges.set([...r.in].sort().join('+'), r); continue; }
  const key = r.in[0] + '|' + r.verb;
  if (r.at === undefined) { procs.set(key, r); continue; }
  if (!bands.has(key)) bands.set(key, []);
  bands.get(key).push({ at: r.at, r });
}
for (const list of bands.values()) list.sort((a, b) => a.at - b.at);
/** What this tool does to this thing at this temperature — or null. */
function bandAt(key, temp) {
  const list = bands.get(key);
  if (!list) return null;
  let hit = null;
  for (const b of list) if (temp >= b.at) hit = b;
  return hit;
}
const STARTERS = elements.filter(e => e.starter).map(e => e.id);
const GOAL = 'dinner';
/**
 * A ladder of goals, and a score.
 *
 * There was one goal — Dinner — at the far end of a 27-deep chain, and nothing
 * marked the distance travelled. So: a run of goals ordered by how far each
 * actually is from the starters, which the graph already knows because
 * `bestRecipe` is a fixed point over the whole recipe set. Nothing here is
 * hand-picked difficulty; it is measured.
 *
 * A point is a step of depth. Making a twenty-step protein is worth more than
 * making a two-step sprout because it genuinely took more to reach, and depth
 * cannot be farmed: remaking a thing you already have scores nothing, because
 * the score is computed from the SET of what you have found, never accumulated
 * as you go. That is the difference between a record of what you learned and a
 * currency, and this game should only ever have the first.
 *
 * Free play scores nothing, for the same reason.
 */
const GOALS = ['sprout', 'soil', 'bread', 'cheese', 'iron', 'glass', 'steel',
               'dinner', 'protein', 'lichen', 'quicklime', 'feast'];
const goalCost = (id) => (expanded(id)?.steps ?? 0);
const goalsMade = () => GOALS.filter(id => byId[id] && found.has(id)).length;
function nextGoal() {
  const open = GOALS.filter(id => byId[id] && !found.has(id));
  if (!open.length) return null;
  // Nearest first, so the ladder always offers a rung within reach.
  open.sort((a, b) => goalCost(a) - goalCost(b));
  return byId[open[0]];
}
/** Depth of everything you hold. Recomputed, never accumulated. */
function scoreNow() {
  if (prefs.freePlay) return 0;
  let n = 0;
  for (const id of found) if (!startersSet.has(id)) n += Math.max(1, goalCost(id));
  return n;
}
const KEY = 'loam.v1';

let found = new Set(), seen = new Set(), savedBench = null, favourites = new Set();
try {
  const s = JSON.parse(localStorage.getItem(KEY));
  if (s) {
    found = new Set(s.found); seen = new Set(s.seen); savedBench = s.bench || null;
    favourites = new Set(s.favourites || []);
  }
} catch {}
if (!found.size) STARTERS.forEach(s => found.add(s));
// Storage is unavailable in private browsing and on opaque origins. Never let
// a failed save abort a discovery.
/**
 * What gets written down.
 *
 * Progress was the only thing saved, so a refresh emptied the bench and any
 * ferment you had started simply vanished. Both are now part of the save:
 *
 *  - the bench, as ids and world positions, plus which cards are folded
 *  - the links between them, as indices into that list
 *  - anything cooking, as a WALL-CLOCK finish time
 *
 * The wall clock is the point. A ferment takes real time whether or not anyone
 * is watching it, so the game should agree: close the tab on a sourdough
 * starter and it will have come alive by the time you come back.
 */
function benchState() {
  // A scan hub or an unresolved-ingredient placeholder isn't a real element
  // and has no id — ghost carries whatever spawnHub()/spawnPlaceholder()
  // needs to rebuild the same chip on restore, in place of a real id.
  const cards = [...world.querySelectorAll('.chip.board')];
  const index = new Map(cards.map((c, i) => [c, i]));
  const jobBy = new Map([...cooking].map(j => [j.chip, j]));
  return {
    cards: cards.map(c => {
      const j = jobBy.get(c);
      const ghost = c.classList.contains('hub') ? { type: 'hub', scan: c._scan }
                  : c.classList.contains('placeholder') ? { type: 'placeholder', text: c.dataset.text }
                  : null;
      return {
        id: ghost ? null : c.dataset.id,
        ghost,
        x: Math.round(parseFloat(c.style.left) || 0),
        y: Math.round(parseFloat(c.style.top) || 0),
        f: c.classList.contains('folded') ? 1 : 0,
        // remaining wall-clock milliseconds, and what it is turning into
        job: j ? { v: j.verb, out: j.r.out, ends: Date.now() + Math.max(0, j.ms - j.done) } : null,
      };
    }),
    links: links.filter(l => index.has(l.out)).map(l => [
      index.has(l.a) ? index.get(l.a) : -1,
      l.b && index.has(l.b) ? index.get(l.b) : -1,
      index.get(l.out),
    ]),
    view: { x: Math.round(view.x), y: Math.round(view.y), k: +view.k.toFixed(3) },
  };
}

const save = () => {
  try {
    localStorage.setItem(KEY, JSON.stringify({
      found: [...found], seen: [...seen], bench: benchState(), favourites: [...favourites],
    }));
  } catch {}
};

// ---------- taking your game with you ----------
/**
 * Everything you have is in this browser's localStorage, which means it is
 * tied to one machine, a cleared cache loses it, and there is no way to carry
 * a game from a laptop to a phone. Accounts would fix that and would also mean
 * this project acquires a server, a privacy policy and an email address it now
 * holds. Export and import fixes the actual complaint, costs nothing, needs
 * nobody's data, and is the same serialise/restore pair any account system
 * would need underneath — so it is worth having whichever way that goes.
 *
 * The file is deliberately readable. It is your own progress; you should be
 * able to open it and see what it says about you.
 */
const SAVE_VERSION = 1;
function exportSave() {
  return JSON.stringify({
    loam: SAVE_VERSION,
    exported: new Date().toISOString().slice(0, 10),
    counts: { found: found.size, of: elements.length },
    found: [...found].sort(),
    seen: [...seen].sort(),
    prefs,
    bench: benchState(),
  }, null, 1);
}
/** Returns a plain-language result rather than throwing: this is user input. */
function importSave(text) {
  let d;
  try { d = JSON.parse(text); } catch { return { ok: false, why: 'That is not a Loam save — it is not readable as JSON.' }; }
  if (!d || typeof d !== 'object') return { ok: false, why: 'That is not a Loam save.' };
  if (!Array.isArray(d.found)) return { ok: false, why: 'That file has no list of discoveries in it.' };
  if (d.loam && d.loam > SAVE_VERSION) {
    return { ok: false, why: `That save was written by a newer version of Loam (${d.loam}). This one only understands ${SAVE_VERSION}.` };
  }
  // Ignore ids this world no longer has rather than refusing the whole file —
  // a save from an older build should still bring back everything it can.
  const known = d.found.filter(id => byId[id]);
  const dropped = d.found.length - known.length;
  if (!known.length) return { ok: false, why: 'Nothing in that file matches anything in this world.' };

  found.clear(); known.forEach(id => found.add(id));
  STARTERS.forEach(id => found.add(id));                 // never import yourself into a dead end
  seen.clear(); (d.seen || []).filter(id => byId[id]).forEach(id => seen.add(id));
  if (d.prefs && typeof d.prefs === 'object') {
    Object.assign(prefs, d.prefs);
    prefs.freePlay = false;                              // free play is a mode, not progress
    savePrefs(); applyPrefs();
  }
  links.length = 0;
  world.querySelectorAll('.chip.board').forEach(c => c.remove());
  if (d.bench) { undoSuspended = true; try { restoreBench(d.bench); } finally { undoSuspended = false; } }
  if (!world.querySelector('.chip.board')) STARTERS.forEach(id => spawn(id));
  renderShelf(); drawLinks(); save();
  return { ok: true, n: known.length, dropped };
}

function showTransfer() {
  const text = exportSave();
  const kb = (text.length / 1024).toFixed(1);
  document.getElementById('sheetBody').innerHTML = `
    <p class="hint2" style="margin-top:0">Everything you have found lives in this browser and nowhere
       else. Copy it out to carry it to another machine, or paste one back in.</p>
    <h2>Take it with you</h2>
    <div class="cardrow">
      <button class="ghost" id="saveCopy">Copy my game (${kb} kB)</button>
      <button class="ghost" id="saveShow">Show it</button>
    </div>
    <pre id="saveText" class="savebox" hidden>${text.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))}</pre>
    <h2>Bring one back</h2>
    <textarea id="saveIn" class="search" rows="4" style="resize:vertical;font-size:12px"
      placeholder="Paste a saved game here…"></textarea>
    <div class="cardrow" style="margin-top:8px">
      <button class="ghost danger" id="saveLoad">Replace my game with this</button>
    </div>
    <p class="hint2">Bringing one back replaces what is in this browser. Copy yours out first if you
       want to keep it. Free play is never carried across — it is a mode, not progress.</p>`;
  openSheet('Your game');
  document.getElementById('saveShow').onclick = () => {
    const el = document.getElementById('saveText');
    el.hidden = !el.hidden;
  };
  document.getElementById('saveCopy').onclick = async () => {

      await navigator.clipboard.writeText(text);

    } catch {

  };
  document.getElementById('saveLoad').onclick = () => {

    closeSheet();

      ? `${r.n} discoveries brought back — ${r.dropped} were from an older world and could not be`
      : `${r.n} discoveries brought back`);

}

// ---------- tooltips ----------
// Read straight off `title`, so a control is documented by being written
// correctly rather than by being registered anywhere.
const tipEl = Object.assign(document.createElement('div'), { id: 'tip' });
document.body.appendChild(tipEl);
let tipT = 0, tipFor = null;
function hideTip() { clearTimeout(tipT); tipEl.classList.remove('on'); tipFor = null; }
function showTip(el) {
  const text = el.dataset.tip;
  if (!text) return;
  tipFor = el;
  tipEl.textContent = text;
  tipEl.classList.add('on');
  // Measure after the text is in, then keep the whole box on screen.
  const r = el.getBoundingClientRect(), t = tipEl.getBoundingClientRect();
  let x = r.left + r.width / 2 - t.width / 2;
  let y = r.bottom + 7;
  if (y + t.height > innerHeight - 6) y = r.top - t.height - 7;
  tipEl.style.left = Math.max(6, Math.min(x, innerWidth - t.width - 6)) + 'px';
  tipEl.style.top = Math.max(6, y) + 'px';
}
// Moving the text off `title` is what stops the OS tooltip firing on top of
// ours; retip() puts the current text back in play after a label changes.
function retip(el) {
  if (el.title) { el.dataset.tip = el.title; el.removeAttribute('title'); }
  if (tipFor === el) showTip(el);
}
document.addEventListener('pointerover', ev => {
  const el = ev.target.closest?.('[title],[data-tip]');
  if (!el) { if (tipFor) hideTip(); return; }
  if (el === tipFor) return;
  clearTimeout(tipT);
  if (el.title) { el.dataset.tip = el.title; el.removeAttribute('title'); }
  tipT = setTimeout(() => showTip(el), 240);
});
document.addEventListener('pointerdown', hideTip, true);
addEventListener('scroll', hideTip, true);
addEventListener('blur', hideTip);

// ---------- undo ----------
// The bench already round-trips through benchState()/restoreBench() for the
// save file, so undo is that same pair pointed at memory instead of disk: a
// snapshot taken just before anything that changes the bench, and replayed if
// you ask for it back. Nothing here touches `found` — a discovery is a fact
// you learned, and taking a card off the bench was never meant to unlearn it.
const UNDO_MAX = 20;
const undoStack = [];
let undoSuspended = false;
function pushUndo(label) {
  if (undoSuspended) return;
  undoStack.push({ label, bench: benchState() });
  if (undoStack.length > UNDO_MAX) undoStack.shift();
  refreshUndo();
}
function refreshUndo() {
  const b = document.getElementById('undo');
  if (!b) return;
  const top = undoStack[undoStack.length - 1];
  b.disabled = !top;
  b.title = top ? `Undo ${top.label}` : 'Nothing to undo yet';
  retip(b);
}
function undoLast() {
  const s = undoStack.pop();
  if (!s) { toast('Nothing to undo'); return; }
  undoSuspended = true;
  try {
    stopCooking();
    cooking.clear();
    links.length = 0;
    world.querySelectorAll('.chip.board').forEach(c => c.remove());
    lastChipTap = { el: null, t: 0 };
    restoreBench(s.bench);
    drawLinks();
    refreshFolds();
  } finally { undoSuspended = false; }
  refreshUndo();
  save();
  sfx.pick();
  toast(`Undid ${s.label}`);
}

// Moving a card should be remembered, but not written to disk sixty times a
// second while it is in your hand.
let saveTimer = 0;
const saveSoon = () => {
  if (saveTimer) return;
  saveTimer = setTimeout(() => { saveTimer = 0; save(); }, 700);
};
// wipeProgress() writes its own final answer to KEY right before reloading —
// letting either of these fire in between would silently overwrite that
// answer with whatever benchState() sees at that instant, which is exactly
// the race that used to resurrect a wiped board.
let wiping = false;
addEventListener('pagehide', () => { clearTimeout(saveTimer); if (!wiping) save(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && !wiping) save(); });

// Free play means every tool, by definition — not merely as a side effect of
// free play having also put fire, flint and yeast in your found set. Those
// happen to be the unlock keys today; saying it outright means a future verb
// gated on something free play does not grant cannot quietly stay locked.
const unlockedVerbs = () => new Set(
  verbs.filter(v => prefs.freePlay || !v.unlockedBy || found.has(v.unlockedBy)).map(v => v.id));

// How many undiscovered recipes can this element still take part in, using only
// what you already hold? Simulated at 25.7 attempts per discovery versus 91.2
// blind — it narrows the field without ever naming a partner.
// How many held elements still have an undiscovered recipe in them?
function liveCount() {
  let n = 0;
  for (const v of secretsMap(unlockedVerbs()).values()) if (v > 0) n++;
  return n;
}
// The same question as secretsFor, asked once for everything instead of once
// per element. Asking it per element re-walks all the recipes each time: a
// shelf of 400 costs 400 × 8,024 checks, and renderShelf asks on every
// keystroke in the Find box, which is where the second-per-letter came from.
// Walking the recipes once and letting each live recipe credit its own inputs
// gives identical counts for two orders of magnitude less work.
//
// r.in is deduplicated because secretsFor counts a recipe once however many
// times an element appears in it — water + water must credit water once.
function secretsMap(ul) {
  const m = new Map();
  for (const r of DATA.recipes) {
    if (found.has(r.out)) continue;
    if (r.verb && !ul.has(r.verb)) continue;
    if (!r.in.every(i => found.has(i))) continue;
    for (const i of (r.in.length > 1 ? new Set(r.in) : r.in)) m.set(i, (m.get(i) || 0) + 1);
  }
  return m;
}
function secretsFor(id, ul) {
  let n = 0;
  for (const r of DATA.recipes) {
    if (found.has(r.out)) continue;
    if (r.verb && !ul.has(r.verb)) continue;
    if (!r.in.includes(id)) continue;
    if (!r.in.every(i => found.has(i))) continue;
    n++;
  }
  return n;
}

/**
 * How many cards ON THE BENCH will make something new with this one.

      `<span class="gsteps">${goalCost(g.id)} step${goalCost(g.id) === 1 ? '' : 's'}</span><i class="ask">?</i>`
    : `<span class="glab">All ${GOALS.length} goals made</span>`;

    ? ''

// ---- the world: chips live in world coordinates; the view pans and zooms ----
const world = document.getElementById('world');
const linkSvg = document.getElementById('links');
const view = { x: 0, y: 0, k: 1 };
const links = [];                                     // {a,b,out} DOM refs

function applyView() {
  world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`;
}
// The board can report zero size in embedded or not-yet-laid-out contexts, and
// every position derived from it then collapses into the corner. Fall back to
// the viewport, then to a sane default, so layout is never nonsense.
function boardBox() {
  const b = board.getBoundingClientRect();
  // The fallbacks subtract the sidebar and the tool tray from the viewport.
  // If the viewport itself reads as zero — a tab that has not been sized yet —
  // that subtraction produces a NEGATIVE width, which is truthy, so it was
  // used, and every position derived from it collapsed to the origin. Clamp.
  const w = Math.max(320, b.width  || (window.innerWidth  - 240) || 900);
  let h = Math.max(320, b.height || (window.innerHeight - 120) || 600);
  // The docked table sits on the bottom of the board and is opaque, so the
  // strip behind it is not somewhere a card can usefully be. Everything that
  // places, tidies or pins a card measures through here, so taking the dock
  // off the height here is all it takes for none of them to use that strip.
  const dock = document.getElementById('ptDock');
  if (dock && document.body.classList.contains('pt-on'))
    h = Math.max(200, h - dock.getBoundingClientRect().height);

}
function toWorld(sx, sy) {

}

// and keep it — chip size never changes after it is built.
let sizeCache = new WeakMap();
function chipSize(el) {
  let s = sizeCache.get(el);
  if (!s) { s = [el.offsetWidth, el.offsetHeight]; if (s[0]) sizeCache.set(el, s); }
  return s;
}
const chipCentre = (el) => {

};

// Nothing you have made is ever destroyed by a tap. Tapping folds the branch
// below a chip out of sight and puts a count on it; tapping again brings it
// back. To clear the bench, use Tidy — and even that only removes chips, never
// discoveries, which live in the codex permanently.

  return links.filter(l => l.a === chip || l.b === chip).map(l => l.out);
}
function descendantsOf(chip, acc = new Set()) {
  for (const k of childrenOf(chip)) {

    acc.add(k);
    descendantsOf(k, acc);

}
// A new result arrives with its ingredients already folded into it, so the

// chip — never the discovery, which stays in the codex.

// A chip is only hidden if every result it feeds is closed. Shared ingredients

function refreshFolds() {
  const hide = new Set();
  for (const c of world.querySelectorAll('.chip.board')) {
    if (!c.classList.contains('folded')) continue;
    for (const a of ancestorsOf(c)) hide.add(a);
  }
  for (const c of world.querySelectorAll('.chip.board')) {
    const anyOpenChild = links.some(l =>

  for (const c of world.querySelectorAll('.chip.board')) {
    const n = c.classList.contains('folded') ? ancestorsOf(c).size : 0;

/**
 * Never reveal two cards on the same spot.

 * position with another folded card — and nothing notices until the player
 * unfolds the branch and finds one card sitting exactly on top of another.
 * Whatever put them there, the fix belongs here: when a card becomes visible,
 * it gets a clear spot if it does not have one.

function unstack() {
  const [cw, ch] = cardSize();
  const seenAt = [];
  for (const c of world.querySelectorAll('.chip.board:not(.hidden)')) {
    let x = parseFloat(c.style.left) || 0, y = parseFloat(c.style.top) || 0;
    // A genuine rectangle overlap, not just "suspiciously close": the half-card
    // threshold this used to use only ever caught two cards sitting at the
    // exact same spot, which was the one bug it was written for. It missed the
    // much more common case a density change creates — cards spaced correctly
    // for a small footprint (Pill) that now genuinely overlap under a bigger
    // one (Card), by anywhere up to a full card-width.
    const clash = seenAt.some(p => Math.abs(p[0] - x) < cw && Math.abs(p[1] - y) < ch);
    if (clash) {
      const spot = freeSpot(cw, ch, [x + cw / 2, y + ch / 2]);

    if (chip.classList.contains('folded')) toggleBranch(chip);   // undo the fold the first tap did
    pushUndo(`removing ${nameOf(byId[chip.dataset.id])}`);
    // The first tap of THIS double-click may have materialized ancestor
    // chips via expandUp (a chip with nothing above it on the board yet
    // gets its real ancestry built in, not just a fold toggled) — undo
    // those along with the chip itself, or a completed double-tap nets a
    // pile of new chips instead of the removal it asked for. ("double
    // click was intended to be a 'remove' but it first single clicks then
    // removes so i land up with more from the ancestry rather than a
    // removal" — found live.)
    for (const el of spawned) if (el && el.isConnected) removeChip(el, true);
    removeChip(chip);

// covers the board, so a real second tap can never land back on the chip
// underneath it — double-tap-to-remove is a dead gesture there no matter
// how it's wired, and showScannedProduct gets its own "Remove from canvas"

    const spawned = lastChipTap.spawned;
    lastChipTap = { el: null, t: 0, spawned: [] };
    pushUndo(`removing ${ghost.dataset.text}`);
    // Same fix as chipTap's own double-tap: undo whatever expandCompo just
    // materialized on the first tap before removing the ghost itself.
    for (const el of spawned) if (el && el.isConnected) removeChip(el, true);
    removeChip(ghost);
    return;

  const spawned = ghost.classList.contains('compo') ? expandCompo(ghost) : null;

function removeChip(chip, instant) {
  // Orphaned links would draw to nothing, so drop them with it.
  for (let i = links.length - 1; i >= 0; i--) {
    const l = links[i];
    if (l.a === chip || l.b === chip || l.out === chip) links.splice(i, 1);
  }
  // Taking one card off the bench should look like taking a card off a bench.
  // Clearing forty at once should not: forty simultaneous animations read as a
  // glitch, and the caller usually wants the board settled before it measures.
  if (instant) { chip.remove(); return; }
  setTimeout(refreshFolds, 170);
  chip.classList.add('leaving');
  sfx.pick();
  setTimeout(() => { chip.remove(); drawLinks(); }, 160);

function toggleBranch(chip) {

  // by — real for tidy()'s depth math and the fold-hide cascade, but not a
  // crafting ancestor. Counting it here meant tapping Glucose off a scanned

  // entry (the hub), so the tap just toggled a fold state that hid nothing
  // useful — Glucose's real ancestors (from the pathway already in the
  // recipe graph) were never offered. ("why cant i add the parents/
  // ancestors to our product ingredients? e.g. glucost, etc?" — found

    // they show me their parents" — found live, asked five times.)

      // several scanned products into one dense web of crossing lines no

      // turning one card off still doesn't work" — found live, tracing
      // back to this.)

  // "one card per thing" is actually on.

    for (const c of world.querySelectorAll('.chip.board:not(.hidden)')) {
      if (!chipFor.has(c.dataset.id)) chipFor.set(c.dataset.id, c);

    const el = spawn(iid, null, null, [chip], true);

    freshlyAdded.push(el);

    chipFor.set(r.out, el);

  refreshFolds();
  drawLinks();
  runTidy();
  sfx.pick();

// Connections persist, so the canvas becomes a diagram of what you built
// rather than a scratchpad that forgets.
let linkFrame = 0, linkFallback = 0;
/**
 * Redraw only the lines attached to one card.
 *

 * asks for a redraw on every pointer move — which is a dropped frame every
 * frame. Moving one card can only move the lines that touch it, so during a
 * drag we reposition those and leave the rest alone.
 */
function drawLinksFor(chip) {
  const uid = chip && chip.dataset.uid;
  if (!uid) { drawLinks(); return; }
  const paths = linkSvg.querySelectorAll(`path[data-from="${uid}"],path[data-to="${uid}"]`);
  if (!paths.length) return;
  const centres = new Map();
  const centreOf = el => {
    if (!centres.has(el)) centres.set(el, chipCentre(el));
    return centres.get(el);
  };
  const byUid = new Map();
  for (const c of world.querySelectorAll('.chip.board')) byUid.set(c.dataset.uid, c);
  for (const p of paths) {
    const a = byUid.get(p.dataset.from), b = byUid.get(p.dataset.to);
    if (!a || !b) continue;
    const [sx, sy] = centreOf(a), [ox, oy] = centreOf(b);
    const my = (sy + oy) / 2;
    p.setAttribute('d', `M ${sx} ${sy} C ${sx} ${my}, ${ox} ${my}, ${ox} ${oy}`);

  if (linkFrame) return;                              // at most one redraw a frame
  linkFrame = requestAnimationFrame(() => {
    linkFrame = 0; clearTimeout(linkFallback); linkFallback = 0; drawLinksNow();
  });
  // Frame callbacks do not fire in a hidden or throttled tab, and a board whose
  // lines never redraw looks broken. Guarantee the redraw either way.
  if (!linkFallback) linkFallback = setTimeout(() => {
    if (linkFrame) { cancelAnimationFrame(linkFrame); linkFrame = 0; }
    linkFallback = 0; drawLinksNow();

  // toggle: first counting links.length (every craft the save had ever made,
  // so a long game went dark long before the bench looked busy — "dots along
  // the line toggle no longer working"), then counting only visible links,
  // which still fell off a cliff the moment the 41st one appeared — "dots on
  // line dont show", reported on an 82-card board.

  // animated motes, not the number of links, so spend a fixed BUDGET of motes
  // on the links as they are drawn and let the rest be plain lines. The cost
  // is bounded exactly as before, the busiest board still gets its trunk lit,
  // and the toggle can never again do nothing at all while claiming to be on.
  // 80, not 40: the old cap allowed 40 *links*, and a link with two parents

  // changes the ones that used to go blank.

    const [ox, oy] = chipCentre(l.out);

      // the reverse of a crafted link's real parent→child order. That choice

      // a→out order made the dots read as the sauce flowing OUT into its
      // ingredients, when the ingredients are what made the sauce. ("arent

        // the sun, blue from water. Offset starts so they never march in step.

  // parent of water in the chart... same as water, h and o? why cant i

    if (c.dataset.id) boardById.set(c.dataset.id, c);

    const atoms = new Set();
    for (const p of comps) for (const a of atomsUnder(p)) atoms.add(a);
    for (const a of atoms) {

      const src = boardById.get(gid);
      if (!src) continue;
      // Water made by a real crafting merge (hydrogen+oxygen) already draws
      // this exact line above — Water also matching BED.composition drew a
      // second, near-identical one straight on top of it, doubling both the
      // line and its mote for that pair. ("Dots along lines now not
      // working?" — likely explained by this: doubled counting toward
      // drawLinksNow()'s 40-visible-link cap could silently cross it sooner
      // than one real link per pair would.)
      if (drawnPairs.has(src.dataset.uid + '|' + out.dataset.uid)) continue;
      const [sx, sy] = chipCentre(src);
      const my = (sy + oy) / 2;
      const d = `M ${sx} ${sy} C ${sx} ${my}, ${ox} ${my}, ${ox} ${oy}`;
      const id = `lp${++pathSeq}`;
      parts.push(`<path id="${id}" class="made compose" d="${d}"` +
                 ` data-from="${src.dataset.uid}" data-to="${out.dataset.uid}"/>`);
      if (moteBudget > 0) {
        moteBudget--;
        const hex = FAM_HEX[src.dataset.fam] || '#8A7B6B';
        const dur = (2.1 + (pathSeq % 5) * 0.22).toFixed(2);
        parts.push(
          `<circle r="3.4" fill="${hex}" class="mote">` +
          `<animateMotion dur="${dur}s" repeatCount="indefinite" begin="-${(pathSeq % 7) * 0.31}s">` +
          `<mpath href="#${id}"/></animateMotion></circle>`);
      }
    }
  }
  linkSvg.innerHTML = parts.join('');
}

function zoomBy(f, cx, cy) {
  const b = boardBox();
  const px = cx == null ? b.width / 2 : cx - b.left;
  const py = cy == null ? b.height / 2 : cy - b.top;
  const k2 = Math.max(0.06, Math.min(2.4, view.k * f));
  view.x = px - (px - view.x) * (k2 / view.k);
  view.y = py - (py - view.y) * (k2 / view.k);
  view.k = k2;
  applyView();
}
