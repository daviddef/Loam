  for (const c of chips) {
    const l = parseFloat(c.style.left) || 0, t = parseFloat(c.style.top) || 0;
    x1 = Math.min(x1, l); y1 = Math.min(y1, t);
    x2 = Math.max(x2, l + cw); y2 = Math.max(y2, t + ch);
  }
  const b = boardBox(), pad = 60;
  view.k = Math.max(min, Math.min(max, Math.min((b.width - pad) / (x2 - x1 || 1),
                                                (b.height - pad) / (y2 - y1 || 1))));
  view.x = b.width / 2 - ((x1 + x2) / 2) * view.k;
  view.y = b.height / 2 - ((y1 + y2) / 2) * view.k;
  applyView();
}
// Which layout the player last asked for explicitly — Tidy or Circle Tidy —
// so that adding a new chip (expanding a chip's ancestors, placing a
// composition part, scanning a product) re-applies THAT one instead of
// always silently falling back to plain tidy(). Before this, ringing a hub
// and then revealing one more thing behind it threw the ring away with no
// way to get it back short of clicking Circle Tidy again by hand. ("why is
// this not tidying in a ring when i add them?" — found live: circleTidy()
// itself rings correctly, the ring just never survived the next chip.)
let tidyMode = 'tidy';
function runTidy() { (tidyMode === 'circle' ? circleTidy : tidy)(); }
// Tidy: lay the whole bench out as the diagram it already is — sources at the
// top, each result on the row below its parents. Nothing is removed; this is
// arrangement, not cleanup.
function tidy() {
  // EVERY card, including the ones folded out of sight. A hidden card is
  // display:none, so placing it costs nothing now — and it means that when you
  // later unfold it, it is already in the right row instead of stranded
  // wherever it happened to be standing when the fold swallowed it. Laying out
  // only what was visible is what left Sun and Sprout out on their own with
  // half a metre of line running back to the bench.
  const chips = [...world.querySelectorAll('.chip.board')];
  if (!chips.length) return;
  const parents = new Map(chips.map(c => [c, []]));
  for (const l of links) {
    if (!parents.has(l.out)) continue;
    for (const p of [l.a, l.b]) if (p && parents.has(p)) parents.get(l.out).push(p);
  }
  const depth = new Map();
  const depthOf = (c, seen = new Set()) => {
    if (depth.has(c)) return depth.get(c);
    if (seen.has(c)) return 0;
    seen.add(c);
    const ps = parents.get(c) ?? [];
    const d = ps.length ? Math.max(...ps.map(p => depthOf(p, seen))) + 1 : 0;
    depth.set(c, d);
    return d;
  };
  chips.forEach(c => depthOf(c));
  const rows = new Map();
  for (const c of chips) {
    const d = depth.get(c);
    if (!rows.has(d)) rows.set(d, []);
    rows.get(d).push(c);
  }
  // Generation rows alone are not a hierarchy — they were, and the result was
  // a card in row 0 wired to a card at the far end of row 2, with the line
  // crossing everything in between. What makes it read is the two things
  // below: keep the chains apart, and put each card near what it came from.
  const kids = new Map(chips.map(c => [c, []]));
  for (const [c, ps] of parents) for (const p of ps) kids.get(p)?.push(c);

  // 0b. A short, deep chain sharing one card with an otherwise-unrelated
  //    structure — "one card per thing" reusing an existing chip, or a
  //    scanned ingredient's own real ancestry reaching back into a chain
  //    already on the bench — is a real edge, correctly drawn, but forcing
  //    both sides through the SAME depth-row grid drags a shallow fan and a
  //    deep chain into one shared coordinate space they were never shaped
  //    for: a bridge between a wide-shallow structure and a narrow-deep one
  //    ends up geometrically far apart even with zero row-crossings, purely
  //    because their natural widths differ so much. ("arent the animations
  //    going the wrong way... its these ingredients that make the product"
  //    led to expanding Glucose's real ancestry, whose own chain happened to
  //    reach a card already anchoring a separate fusion chain — "circle
  //    gives me this a messy hierarchy" and a second, worse example, both
  //    found live.) Detected once, cheaply, over the whole bench (game-scale
  //    graphs are dozens of edges, not thousands): for every edge, check
  //    whether removing it disconnects the graph (a bridge — every edge in a
  //    tree qualifies, so bridge-ness alone says nothing) AND whether the
  //    smaller resulting side is both small in absolute count and spans
  //    several real generations — a thin tail, not a small bush. Only that
  //    combination is excluded from this component's own union-find walk
  //    below, so the tail gets packed as its own compact chain next to
  //    wherever it attaches, the same way two genuinely separate chains
  //    already are — everything downstream (barycentre, transpose,
  //    centring, packing) already treats "component" as its unit and needs
  //    no other change.
  const allAdj = new Map(chips.map(c => [c, new Set()]));
  for (const [c, ps] of parents) for (const p of ps) if (allAdj.has(p)) { allAdj.get(c).add(p); allAdj.get(p).add(c); }
  const edgeKey = (a, b) => { const ua = a.dataset.uid, ub = b.dataset.uid; return ua < ub ? ua + '|' + ub : ub + '|' + ua; };
  const seenEdge = new Set();
  const candidates = [];
  for (const [c, ns] of allAdj) {
    for (const n of ns) {
      const k = edgeKey(c, n);
      if (seenEdge.has(k)) continue;
      seenEdge.add(k);
      const reach = new Set([c]);
      const stack = [c];
      while (stack.length) {
        const x = stack.pop();
        for (const y of allAdj.get(x)) {
          if ((x === c && y === n) || (x === n && y === c)) continue;   // the edge under test
          if (!reach.has(y)) { reach.add(y); stack.push(y); }
        }
      }
      if (reach.has(n)) continue;                        // not a bridge — a real cycle holds it together
      const small = reach.size <= chips.length - reach.size ? reach : new Set(chips.filter(x => !reach.has(x)));
      if (small.size < 2 || small.size > 8) continue;     // not a small satellite
      // Which end of THIS edge sits on the satellite side vs the main side —
      // kept so the satellite's pack can be seated next to the main side's
      // pack below, rather than wherever discovery order happens to put it.
      const satelliteAnchor = small.has(c) ? c : n;
      const mainAnchor = small.has(c) ? n : c;
      // How many real hops the small side extends, walked from the cut edge
      // OUTWARD and staying inside the small side — not each chip's absolute
      // depth in the whole graph. Absolute depth mixes in whatever unrelated
      // ancestry the MAIN side happens to have: Straw+Spark→Fire's Spark
      // sits at depth 0 while Fire sits at depth 4 purely because Straw's
      // OWN real ancestry (Soil, Grass, ...) runs four generations deep —
      // by absolute depth that reads as a four-generation tail, even though
      // Fire is genuinely one hop off Straw and Spark is a shallow, ordinary
      // second ingredient, not a tail at all. ("why one long line?" — a
      // single Straw feeding five Spark+Straw→Fire results, each Fire cut
      // into its own satellite and stacked one per row, found live.) Local,
      // satellite-relative depth is immune to that: it only grows when the
      // small side genuinely chains several hops deep on its own.
      const localDepth = new Map([[satelliteAnchor, 0]]);
      const queue = [satelliteAnchor];
      while (queue.length) {
        const x = queue.shift();
        for (const y of allAdj.get(x)) {
          if (small.has(y) && !localDepth.has(y)) { localDepth.set(y, localDepth.get(x) + 1); queue.push(y); }
        }
      }
      const localDepths = [...small].map(x => localDepth.get(x) ?? 0);
      if (Math.max(...localDepths) - Math.min(...localDepths) < 3) continue;   // not a real multi-generation tail
      candidates.push({ k, c, n, size: small.size, satelliteAnchor, mainAnchor });
    }
  }
  // A card can sit on TWO qualifying bridges at once — Cellulose, reached
  // both from its own real ancestor (Grass) and from Glucose on the other
  // side — and cutting both isolates it as a disconnected singleton
  // belonging to neither side, which is worse than the merged grid this
  // was meant to fix. Cut the biggest satellites first, and skip any cut
  // that would leave either end of the edge with no connection left at all.
  candidates.sort((a, b) => b.size - a.size);
  const cutCount = new Map(chips.map(c => [c, 0]));
  const excludedEdge = new Set();
  const attachPoint = new Map();   // satelliteAnchor chip -> mainAnchor chip, for the packing step below
  for (const { k, c, n, satelliteAnchor, mainAnchor } of candidates) {
    if (cutCount.get(c) + 1 >= allAdj.get(c).size) continue;
    if (cutCount.get(n) + 1 >= allAdj.get(n).size) continue;
    excludedEdge.add(k);
    cutCount.set(c, cutCount.get(c) + 1);
    cutCount.set(n, cutCount.get(n) + 1);
    attachPoint.set(satelliteAnchor, mainAnchor);
  }

  // 1. Separate chains stay separate. A bench is usually several unrelated
  //    little trees, and interleaving them is most of what looked like a mess.
  const comp = new Map();
  let nc = 0;
  for (const c of chips) {
    if (comp.has(c)) continue;
    const id = nc++, stack = [c];
    comp.set(c, id);
    while (stack.length) {
      const x = stack.pop();
      for (const n of [...(parents.get(x) ?? []), ...(kids.get(x) ?? [])]) {
        if (!n || comp.has(n) || excludedEdge.has(edgeKey(x, n))) continue;
        comp.set(n, id); stack.push(n);
      }
    }
  }
  // Satellite component id -> the actual chip pair it should sit beside —
  // resolved once here so both the packing order and the direct reposition
  // below it can use plain lookups instead of re-deriving this.
  const attachToComp = new Map();
  for (const [satelliteAnchor, mainAnchor] of attachPoint) {
    if (comp.get(satelliteAnchor) !== undefined && comp.get(mainAnchor) !== undefined)
      attachToComp.set(comp.get(satelliteAnchor), { mainComp: comp.get(mainAnchor), satelliteAnchor, mainAnchor });
  }

  const GAP = 18, ROW_H = 78;
  const [cw] = cardSize();
  const step = cw + GAP;
  const pos = new Map();                      // chip -> x, in "slots"
  const visDepthOf = new Map();                // chip -> row, with all-hidden generations collapsed out
  const packs = [];                           // one entry per separate chain

  for (let g = 0; g < nc; g++) {
    const mine = chips.filter(c => comp.get(c) === g);
    // A chip's recorded parents/kids can now include a neighbour excluded
    // into a different component above — its `pos` lives in that other
    // component's own coordinate space, not this one, so every lookup
    // within this component's own layout passes has to stay inside `mine`.
    const mineSet = new Set(mine);
    const parentsIn = c => (parents.get(c) ?? []).filter(p => mineSet.has(p));
    const kidsIn = c => (kids.get(c) ?? []).filter(k => mineSet.has(k));
    // Bucket by VISIBLE row, not raw depth. A folded ancestor's own chain
    // can run many raw generations deep behind it — Fetus, next to Human's
    // eight composition organs (all raw depth 0), has 30-odd raw depths of
    // its own hidden ancestry between it and depth 0. Grouping by raw depth
    // put the organs in row 0 and Fetus dozens of rows away, and every pass
    // below (barycentre, transpose, centring) only ever looks ONE row up or
    // down — none of them had a chance to pull two things back together
    // that were only ever dozens of INVISIBLE rows apart, not dozens of
    // real ones. Collapsing runs of all-hidden raw depths into whichever
    // row they'd share once revealed is the same rule the visDepthOf pass
    // below already applies to the final pixel height — just moved here so
    // it also governs which row two things are grouped and centred in, not
    // only how far apart the rows end up drawn. ("i click on human it adds
    // fetus on the bottom left? why not on above?" — found live.)
    const rawDepths = [...new Set(mine.map(c => depth.get(c)))].sort((a, z) => a - z);
    const rowOf = new Map();
    let seenRow = 0;
    for (const d of rawDepths) {
      const atThisDepth = mine.filter(c => depth.get(c) === d);
      for (const c of atThisDepth) rowOf.set(c, seenRow);
      if (atThisDepth.some(c => !c.classList.contains('hidden'))) seenRow++;
    }
    const byRow = new Map();
    for (const c of mine) {
      const d = rowOf.get(c);
      if (!byRow.has(d)) byRow.set(d, []);
      byRow.get(d).push(c);
    }
    const order = [...byRow.keys()].sort((a, z) => a - z);
    order.forEach(d => byRow.get(d).forEach((c, i) => pos.set(c, i)));

    // 2. Barycentre passes: a card slides towards the average position of the
    //    cards it is joined to, alternately looking up and down, and is then
    //    re-ranked within its own row. This is the standard way to pull the
    //    crossings out of a layered graph, and four passes is plenty at bench
    //    size. Re-ranking (rather than moving freely) is what keeps rows from
    //    collapsing two cards onto the same spot.
    const meanOf = (ns) => ns.length ? ns.reduce((a, n) => a + pos.get(n), 0) / ns.length : null;
    for (let pass = 0; pass < 4; pass++) {
      const down = pass % 2 === 0;
      for (const d of (down ? order : [...order].reverse())) {
        const row = byRow.get(d);
        const key = new Map(row.map(c => {
          const m = meanOf(down ? parentsIn(c) : kidsIn(c));
          return [c, m === null ? pos.get(c) : m];
        }));
        row.sort((a, z) => key.get(a) - key.get(z) || pos.get(a) - pos.get(z));
        row.forEach((c, i) => pos.set(c, i));
      }
    }

    // 2b. Transpose: the standard second half of a barycentre layout — the
    //    mean picks a rough order, but two cards tied (or close) on their own
    //    barycentre just keep whatever order they arrived in even when
    //    swapping them would remove a real crossing, because a mean is a
    //    single number and throws that information away. This checks every
    //    adjacent pair directly against the rows actually threading through
    //    them (both parents above and results below share one continuous
    //    slot scale — pos multiplies by the same `step` everywhere, so
    //    comparing across rows is valid) and swaps whenever that strictly
    //    lowers the crossing count. Repeats until a full sweep changes
    //    nothing, capped so a pathological bench can't spin forever.
    const crossDelta = (u, v) => {
      const refsU = [...parentsIn(u), ...kidsIn(u)];
      const refsV = [...parentsIn(v), ...kidsIn(v)];
      let same = 0, swapped = 0;
      for (const p of refsU) for (const q of refsV) {
        if (p === v || q === u) continue;             // an edge between u and v itself never crosses
        const pp = pos.get(p), pq = pos.get(q);
        if (pp === undefined || pq === undefined) continue;
        if (pp > pq) same++;
        else if (pp < pq) swapped++;
      }
      return swapped - same;                          // negative means swapping helps
    };
    for (let pass = 0; pass < 6; pass++) {
      let changed = false;
      for (const d of (pass % 2 === 0 ? order : [...order].reverse())) {
        const row = byRow.get(d);
        for (let i = 0; i < row.length - 1; i++) {
          const u = row[i], v = row[i + 1];
          if (crossDelta(u, v) < 0) {
            row[i] = v; row[i + 1] = u;
            pos.set(v, i); pos.set(u, i + 1);
            changed = true;
          }
        }
      }
      if (!changed) break;
    }

    // 3. Centre each card over its children, then over its parents, without
    //    letting neighbours swap or touch — so a single result sits under the
    //    middle of the two things that made it instead of flush left.
    for (let pass = 0; pass < 6; pass++) {
      for (const d of (pass % 2 === 0 ? [...order].reverse() : order)) {
        const row = byRow.get(d);
        for (let i = 0; i < row.length; i++) {
          const c = row[i];
          const want = meanOf(pass % 2 === 0 ? kidsIn(c) : parentsIn(c));
          if (want === null) continue;
          const lo = i ? pos.get(row[i - 1]) + 1 : -Infinity;
          const hi = i < row.length - 1 ? pos.get(row[i + 1]) - 1 : Infinity;
          // `want` is a MEAN of one or more neighbour positions — fractional
          // the moment a card has two children/parents whose positions
          // differ by an odd number (Grass, with Soil at one slot and Seed
          // three along, means to 1.5). Every other place in this function
          // stores positions as plain integer slots; this was the one spot
          // that stored the raw fraction, and it propagates upward through
          // whatever centres on THIS card next (Soil's own centring reads
          // Grass's half-slot, Stone's reads Soil's) — a chip a full half
          // card-width off the grid, close enough to its row neighbour to
          // visually overlap it rather than merely sit off-centre. Rounding
          // keeps every card on the same integer grid this whole layout is
          // built on. ("image 2 how your tidy up does it... notice
          // anything?" — found live: Stone landing exactly half a slot from
          // Oxygen, close enough that OXYGEN and STONE's labels overlapped.)
          pos.set(c, Math.round(Math.max(lo, Math.min(want, hi))));
        }
        // The sweep above only ever compares each card against its row
        // neighbours' values AT THE MOMENT it runs — the right-hand bound
        // in particular can still be a stale, pre-pass value that itself
        // moves later in this same loop. Six passes usually iron that out,
        // but a card whose own `want` came back null (nothing to centre
        // on this pass) never gets re-clamped even after a neighbour slides
        // into its slot — two real cards on the exact same spot, not just
        // close. One last monotonic sweep, left to right, catches that:
        // never actually changes a correctly-spaced row.
        for (let i = 1; i < row.length; i++) {
          const need = pos.get(row[i - 1]) + 1;
          if (pos.get(row[i]) < need) pos.set(row[i], need);
        }
      }
    }

    const min = Math.min(...mine.map(c => pos.get(c)));
    const max = Math.max(...mine.map(c => pos.get(c)));
    for (const c of mine) pos.set(c, pos.get(c) - min);        // each chain starts at nought

    // A folded chip's hidden ancestors still occupy real depth — a chain
    // twenty steps deep, entirely collapsed behind one folded card, reserved
    // twenty empty row-heights above it, which is what a visible card stranded
    // far below everything else with a huge gap above it actually was. Every
    // one of those rows is either fully visible or fully hidden (a row mixes
    // only when some sibling in it is still shown), so collapsing runs of
    // all-hidden rows down to zero height costs nothing anyone can see.
    let vSeen = 0;
    for (const d of order) {
      const rowVisible = byRow.get(d).some(c => !c.classList.contains('hidden'));
      for (const c of byRow.get(d)) visDepthOf.set(c, vSeen);
      if (rowVisible) vSeen++;
    }

    packs.push({ chips: mine, w: (max - min) + 1, h: Math.max(...mine.map(c => visDepthOf.get(c))) + 1 });
  }

  // A satellite pack split off above is compact on its own now, but left in
  // plain discovery order it can still land nowhere near the pack it was
  // actually cut from — still one clean shape joined to another by a long
  // line, just two clean shapes instead of one tangled one. Seating it
  // directly after its own attachment's pack, wherever that ends up, is
  // what makes the two read as "this hangs off that" rather than two
  // unrelated things that happen to share an edge. Depth-first so a
  // satellite-of-a-satellite still nests under its own real parent, not the
  // far end of the chain.
  const packOrder = [];
  const packPlaced = new Set();
  const placePack = (g) => {
    if (packPlaced.has(g)) return;
    packPlaced.add(g);
    packOrder.push(g);
    for (const [satG, info] of attachToComp) if (info.mainComp === g) placePack(satG);
  };
  for (let g = 0; g < nc; g++) if (!attachToComp.has(g)) placePack(g);
  for (let g = 0; g < nc; g++) placePack(g);   // safety net: nothing is left stranded
  const orderedPacks = packOrder.map(g => packs[g]);

  // 4. Pack the chains into the shape of the BOARD, instead of one long row.
  //
  //    Laying every chain out side by side made the bench wider and wider while
  //    it stayed four or five rows tall, so Fit had nothing to do but zoom out
  //    until the width fitted — 92% of the width used and 34% of the height,
  //    with the cards small and a lot of empty tray underneath. Chains wrap onto
  //    a new band once the current one is wider than the board's proportions
  //    justify, which is the same thing a page of text does with words.
  const b = boardBox();
  const aspect = Math.max(0.6, b.width / Math.max(1, b.height));
  const total = orderedPacks.reduce((a, p) => a + p.w + 2, 0);
  const rowsDeep = Math.max(...orderedPacks.map(p => p.h), 1);
  // Target width in slots: the width that makes the finished block about as
  // wide-to-tall as the board is. Never narrower than the widest single chain.
  const target = Math.max(
    Math.max(...orderedPacks.map(p => p.w)),
    Math.sqrt(total * rowsDeep * (step / ROW_H) * aspect));
  let bandX = 0, bandY = 0, bandH = 0;
  for (const p of orderedPacks) {
    if (bandX && bandX + p.w > target) { bandX = 0; bandY += bandH + 1; bandH = 0; }
    for (const c of p.chips) pos.set(c, pos.get(c) + bandX);
    p.y = bandY;
    bandX += p.w + 2;                          // a clear lane between chains
    bandH = Math.max(bandH, p.h);
  }

  const bandOf = new Map();
  for (const p of orderedPacks) for (const c of p.chips) bandOf.set(c, p.y);

  // Seating a satellite's PACK next to its attachment's pack (above) still
  // leaves exactly where each specific chip sits inside its own pack to
  // that pack's own barycentre passes, which know nothing about the other
  // side — the two attachment chips themselves can still end up nowhere
  // near each other even when their packs are adjacent, if one happens to
  // fall at the near edge of its pack and the other at the far edge of its
  // own. Sliding the whole satellite pack, as one rigid piece, so its own
  // attachment chip sits directly beside (not on top of) the real anchor
  // it was cut from is what actually shortens that one necessary line —
  // everything else about the satellite's own internal shape, already
  // correct, is untouched.
  // The rigid slide above had no idea what the main pack already occupies,
  // so a satellite could land squarely on top of an existing card — the
  // exact overlap David caught live on an entirely ordinary short chain.
  // Track every cell already spoken for and, if the natural one-row offset
  // would collide, push the satellite one further row away (same side,
  // same column) until it clears — bounded, since a satellite is at most
  // 8 cards and this only has to escape whatever's directly in the way.
  const cellKey = (col, row) => col + '|' + row;
  const occupied = new Set(chips.map(c => cellKey(pos.get(c), bandOf.get(c) + visDepthOf.get(c))));
  for (const [satG, { satelliteAnchor, mainAnchor }] of attachToComp) {
    const satPack = packs[satG];
    // Above if the satellite is really mainAnchor's own parent (Cellulose
    // above Grass would read backwards), below otherwise — the same
    // convention every other row here already follows. The whole pack
    // shifts by one rigid delta so its own already-correct internal shape
    // (relative row spacing, column order) carries over unchanged; only
    // where that shape sits moves.
    const satIsParent = (parents.get(mainAnchor) ?? []).includes(satelliteAnchor);
    const dir = satIsParent ? -1 : 1;
    const dCol = pos.get(mainAnchor) - pos.get(satelliteAnchor);
    let dBand, tries = 0;
    do {
      const wantRow = bandOf.get(mainAnchor) + visDepthOf.get(mainAnchor) + dir * (1 + tries);
      dBand = wantRow - (bandOf.get(satelliteAnchor) + visDepthOf.get(satelliteAnchor));
      tries++;
    } while (tries < 24 && satPack.chips.some(c =>
      occupied.has(cellKey(pos.get(c) + dCol, bandOf.get(c) + visDepthOf.get(c) + dBand))));
    if (!dCol && !dBand) continue;
    for (const c of satPack.chips) {
      pos.set(c, pos.get(c) + dCol);
      bandOf.set(c, bandOf.get(c) + dBand);
    }
    for (const c of satPack.chips) occupied.add(cellKey(pos.get(c), bandOf.get(c) + visDepthOf.get(c)));
  }

  const [ox, oy] = toWorld(b.left + 40, b.top + 40);
  for (const c of chips) {
    c.style.left = (ox + pos.get(c) * step) + 'px';
    c.style.top  = (oy + (bandOf.get(c) + visDepthOf.get(c)) * ROW_H) + 'px';
  }
  drawLinks();
  fitAll({ min: 0.34, max: 1.0 });
  sfx.pick();
}

/**
 * An alternate reading of tidy()'s own layout: any parent with two or more
 * single-parent results — a scan hub naming ten ingredients, or a recipe
 * like salt that makes several things at once — gets those spread evenly
 * in a ring around it instead of stacked in the same row. Runs tidy()
 * first for a sane starting position for everything (including chains this
 * has nothing to say about), then only moves the chips that qualify.
 *
 * Only single-parent results orbit. A child of two real parents (an
 * ordinary two-input merge) has no one centre to orbit, so those are left
 * exactly where tidy() put them.
 */
function circleTidy() {
  tidy();
  const chips = new Set(world.querySelectorAll('.chip.board:not(.hidden)'));
  // A ring's centre is whichever end of a single-parent link plays the
  // "hub" role — and that's a different end depending on how the link was
  // built. A scanned product's named ingredients use {a: hub, out:
  // ingredient, hub: true} (found live: circleTidy calling only `l.a` the
  // centre matched that shape and nothing else). But "made of" composition
  // and any single-input crafted step (egg|wait→chicken) both use the
  // opposite direction, {a: part, out: result} — the SAME direction the
  // fold/ancestor system needs so a chip's real ancestors hide behind it —
  // so composition never qualified as a hub at all, even though a body
  // made of six organs is exactly the fan shape a ring exists to draw.
  // ("i expected that 'is made of' e.g. humans would be tidy'd up as a
  // ring... why doesnt it work like that?" — found live.)
  const bySingleParent = new Map();
  for (const l of links) {
    if (l.b || !l.a || !l.out || !chips.has(l.a) || !chips.has(l.out)) continue;
    const center = l.hub ? l.a : l.out;
    const spoke  = l.hub ? l.out : l.a;

    if (children.length < 2) continue;

    const spacing = Math.max(cw, ch) + 14;
    const r = Math.max(cw * 1.1, (n * spacing) / (2 * Math.PI));
    const [pcx, pcy] = chipCentre(parent);
    children.forEach((c, i) => {
      const a = (i / n) * Math.PI * 2 - Math.PI / 2;
      c.style.left = (pcx + r * Math.cos(a) - cw / 2) + 'px';
      c.style.top  = (pcy + r * Math.sin(a) - ch / 2) + 'px';
    });
    rings.push({ parent, children, r });
  }
  // Each ring is sized only by how many spokes it has — tidy()'s own
  // packing above placed the hub itself as if it were one ordinary card,
  // with no idea a big fan was coming. Two hubs a normal card-width apart
  // is fine right up until one of them turns out to need a 200px ring, at
  // which point the two fans draw straight through each other. A few
  // relaxation passes push any pair of ring CENTRES (a hub and its whole
  // fan, moved together as one rigid piece) apart along the line between
  // them until no two rings overlap, the same idea simple circle-packing
  // separation already uses — capped so a pathological bench can't spin
  // forever. Known gap: a card that is itself the hub of a further nested
  // ring gets moved as a plain child here, not with its own fan attached —
  // rare (a hub whose spoke is itself another hub), left for later.
  const moveRingBy = (ring, dx, dy) => {
    const move = (el) => {
      el.style.left = (parseFloat(el.style.left) + dx) + 'px';
      el.style.top  = (parseFloat(el.style.top) + dy) + 'px';
    };
    move(ring.parent);
    for (const c of ring.children) move(c);
  };
  for (let pass = 0; pass < 8; pass++) {
    let moved = false;
    for (let i = 0; i < rings.length; i++) {
      for (let j = i + 1; j < rings.length; j++) {
        const a = rings[i], b = rings[j];
        const [ax, ay] = chipCentre(a.parent), [bx, by] = chipCentre(b.parent);
        const dx = bx - ax, dy = by - ay;
        const dist = Math.hypot(dx, dy) || 1;
        const need = a.r + b.r + Math.max(cw, ch) * 0.4;
        if (dist >= need) continue;
        moved = true;
        const push = (need - dist) / 2, ux = dx / dist, uy = dy / dist;
        moveRingBy(a, -ux * push, -uy * push);
        moveRingBy(b, ux * push, uy * push);
      }
    }
    if (!moved) break;
  }
  drawLinks();
  fitAll({ min: 0.2, max: 1.2 });
  sfx.pick();
  // Most of a bench built by ordinary crafting is two-parent merges, and
  // none of those ever qualify for a ring — only a single parent with 2+
  // single-parent results does (a scan hub naming many ingredients, or a
  // hub element like Sun). Measured live on a real 70-chip, 42-link bench
  // built from genuine recipe chains: zero chips qualified, so this ran
  // tidy() and changed nothing further — which reads exactly like a
  // broken button, not a mode with nothing to say about this particular
  // bench. ("the 2 types of tidy ups result in the same layouts" — found
  // live.) Same toast pattern the motes button already uses for its own
  // version of this problem.
  if (!rings.length) toast('No hubs to ring here — every result on your bench has two real parents');
}

board.addEventListener('wheel', ev => {

// Chips that land on top of each other cannot be dragged apart, so placement

 * This used to measure the distance between two top-left corners and accept
 * anything further apart than the card's *width*. That worked while a chip was
 * a wide flat pill. A specimen card is taller than it is wide, so the test
 * passed for cards that visibly overlapped, and every new card landed in the
 * same horizontal band. Test the actual rectangles instead.
 */
/**
 * How big a card is.
 *
 * Do not measure the card you are about to place. A card read back before its
 * stylesheet has applied reports its min-content width — 22px, not 94 — and 22
 * is a plausible-looking number, so it sails past any "is this zero" guard and
 * lays the entire bench out in a single 36px-pitch row. This file has now been
 * bitten three times by trusting a measurement taken too early (boardBox
 * returning 0x0, offsetWidth returning 0, and offsetWidth returning 22).
 *
 * A specimen card is a fixed size by design, so measure one that has actually
 * been on screen, once, and keep the answer.
 *
 * The size is no longer ONE fixed size, though — Card, Half card and Pill are
 * three different footprints (94x124, 66x~53, 104x~40), so a single "is this
 * at least 60x80" floor only ever matched Card and silently fed every other
 * density the fallback forever. The drawing inside the chip is the thing that
 * stays a reliable "has the stylesheet actually applied" signal across all
 * three, since .art is comfortably >=20px in every mode and near-zero before
 * the stylesheet loads — so check that instead of the outer box.
 */

let restoredBench = false;

function cardSize() {
  if (cardSizeCache) return cardSizeCache;
  for (const c of world.querySelectorAll('.chip.board')) {
    // getComputedStyle reads the CSS box model BEFORE `transform` is applied.
    // getBoundingClientRect reads the painted box AFTER it — which sounds like
    // a detail, but a card spawns with a scale-up pop animation, and this
    // function is often called in the same synchronous tick as a burst of
    // spawns, before any of their `.pop` classes have been timed out. Reading
    // the painted box during that animation measured cards at 40% of their
    // real size and cached that, which is a second, sneakier version of the
    // exact "measured too early" bug this function already exists to avoid.
    const w = parseFloat(getComputedStyle(c).width);
    const h = parseFloat(getComputedStyle(c).height);
    if (w >= 40 && h >= 25) return (cardSizeCache = [w, h]);
  }

}

function freeSpot(w, h, near) {
  const PAD = 14;
  [w, h] = cardSize();
  // Every card is the same size, so do not ask each one — see cardSize().
  // Only cards you can SEE take up space. A folded-away card is display:none —
  // it occupies no room on the tray, so it must not make this search think the
  // board is full. Counting them was survivable while hidden cards kept stale
  // positions scattered anywhere; once Tidy began placing every card on the
  // grid, the hidden ones filled it, and unstack()'s call to this function
  // spiralled right out past the edge looking for a gap. That is what threw a
  // single card half a screen away with a long line trailing back to it.
  const held = [...world.querySelectorAll('.chip.board:not(.hidden)')].map(c => ({
    x: parseFloat(c.style.left) || 0, y: parseFloat(c.style.top) || 0, w, h,
  }));
  const clear = (x, y) => held.every(r =>
    x + w + PAD <= r.x || r.x + r.w + PAD <= x ||
    y + h + PAD <= r.y || r.y + r.h + PAD <= y);

  const b = boardBox();
  // Anchor to the bench itself, not to the viewport. Anchoring to the viewport
  // meant that panning between placements — which ensureVisible does — moved
  // the origin each time, and the bench marched off across the world instead
  // of growing as one cluster.
  let origin = near;
  if (!origin) {
    if (held.length) {
      origin = [held.reduce((a, r) => a + r.x + r.w / 2, 0) / held.length,
                held.reduce((a, r) => a + r.y + r.h / 2, 0) / held.length];
    } else {
      origin = toWorld(b.left + b.width / 2, b.top + b.height / 2);
    }
  }
  const [cx, cy] = origin;

  // Spiral outwards from where it should be, in steps the size of a card, so
  // the bench fills like a shelf rather than a heap.
  const stepX = w + PAD, stepY = h + PAD;
  for (let ring = 0; ring < 40; ring++) {
    const spots = [];
    for (let dx = -ring; dx <= ring; dx++) {
      for (let dy = -ring; dy <= ring; dy++) {
        if (Math.max(Math.abs(dx), Math.abs(dy)) !== ring) continue;   // ring edge only
        spots.push([cx + dx * stepX - w / 2, cy + dy * stepY - h / 2]);
      }
    }
    // Nearest-first inside the ring keeps results close to their parents.
    spots.sort((a, p) => Math.hypot(a[0] - cx, a[1] - cy) - Math.hypot(p[0] - cx, p[1] - cy));
    for (const [x, y] of spots) if (clear(x, y)) return [x, y];
  }
  // The grid itself can exhaust near a packed bench — its phase shifts with
  // the centroid on every call, so cells that look free from this call's grid
  // can still land on a chip placed by an earlier, differently-phased one.
  // This used to search a genuinely wide area (±15 card-widths, several
  // thousand pixels) for a clear spot — which did find one, but often one
  // nowhere near the visible board, so the card would "randomly pop into
  // the canvas... off screen top bottom all over the place" the instant
  // ensureVisible yanked the view over to it (found live, from the
  // periodic table specifically: placeItem() calls spawn() with no x/y,
  // which is exactly this path). Search the VISIBLE board first instead —
  // any spot found here needs no jarring pan at all — and only fall back
  // to the wide blind search if even that is somehow full.
  const [vx0, vy0] = toWorld(b.left + 8, b.top + 8);
  const [vx1, vy1] = toWorld(b.left + b.width - 8, b.top + b.height - 8);
  for (let tries = 0; tries < 60; tries++) {
    const x = vx0 + Math.random() * Math.max(1, vx1 - vx0 - w);
    const y = vy0 + Math.random() * Math.max(1, vy1 - vy0 - h);
    if (clear(x, y)) return [x, y];
  }
  for (let tries = 0; tries < 60; tries++) {
    const x = cx - w / 2 + (Math.random() - .5) * stepX * 30;
    const y = cy - h / 2 + (Math.random() - .5) * stepY * 30;
    if (clear(x, y)) return [x, y];
  }
  // Truly nowhere left. Put it down in the middle of the visible board
  // rather than a random point somewhere off in the world — still
  // crowded, but at least exactly where the player is already looking.
  return [(vx0 + vx1) / 2 - w / 2 + (Math.random() - .5) * 40,
          (vy0 + vy1) / 2 - h / 2 + (Math.random() - .5) * 40];
}

const MAX_CHIPS = 140;
function spawn(id, x, y, near, above, forceNew) {
  // One card per thing, if you asked for that. A bench built by hand ends up
  // with four Waters and three Suns, because every recipe that needs one takes
  // a fresh copy. Consolidated, the copies collapse and the lines converge on

  // a list of the times you happened to need something.

  // would otherwise make every tick after the first just re-pulse the one
  // existing chip, which is not sprinkling anything.
  if (prefs.consolidate && !forceNew) {
    const already = [...world.querySelectorAll('.chip.board')].find(c => c.dataset.id === id);
    if (already) {
      already.classList.remove('folded');
      already.classList.add('pop');
      setTimeout(() => already.classList.remove('pop'), 330);

      // second one — correct, but if that card is off-screen the player sees
      // nothing happen at all and reads it as the drop being refused. ("i
      // want to add cell onto a canvas that has cancer on it? but app wont
      // let me?" — found live: cell was already on the bench, just scrolled
      // out of view.) Pan to it so the response is visible where they are.
      ensureVisible(already);
      return already;
    }
  }
  // Whatever else happens, the bench must not be able to grow without limit.
  if (world.querySelectorAll('.chip.board').length >= MAX_CHIPS) {
    toast('The bench is full — tidy it, or double-tap a few things to clear space');
    return world.querySelector('.chip.board');
  }

  const el = document.createElement('div');
  const fam = familyOf(e);
  el.className = `chip board pop fam-${fam.id}`;
  el.dataset.fam = fam.id;
  el.dataset.id = id;
  el.dataset.uid = 'c' + (++chipSeq);                 // stable per card, not per element
  el.innerHTML = chipHTML(e);
  world.appendChild(el);
  const [cw, ch] = cardSize();
  let anchor = null;
  if (near && near.length) {
    const pts = near.filter(n => n && n.isConnected).map(chipCentre);
    // A crafted result sits BELOW the parents that made it — the direction
    // tidy() itself lays the whole bench out in. But expandUp() reuses this
    // same anchor to spawn the opposite relationship, an ANCESTOR above the
    // chip that revealed it, and this offset used to always go down
    // regardless — a real ancestor tap put parents underneath their own
    // child. ("why when i click on an object it expands its made from path
    // on the graph, but the elements appear underneath the object, rather
    // than above" — found live.) `above` flips it.
    if (pts.length) anchor = [pts.reduce((a, p) => a + p[0], 0) / pts.length,
                              pts.reduce((a, p) => a + p[1], 0) / pts.length + (above ? -ch - 22 : ch + 22)];
  }

  const bb = boardBox();
  const [minX, minY] = toWorld(bb.left + 8, bb.top + 8);
  const [maxX, maxY] = toWorld(bb.left + bb.width - 8, bb.top + bb.height - 8);

  // A card the player put down stays where they put it, inside the view. A card
  // the game placed is not clamped at all: freeSpot has already found it a
  // clear spot near where it belongs, and the bench is a canvas you pan rather
  // than a screen you fill.
  //
  // Clamping the automatic case was actively harmful. Once the first screenful
  // was used up, every new card was pinned to the same edge, ensureVisible
  // panned to reveal it, which moved the edge, which pinned the next card six
  // pixels along — ninety-four cards in a single row, each overlapping its
  // neighbour, and the fit button showing an empty board.
  if (x == null) {
    el.style.left = left + 'px';
    el.style.top  = top + 'px';
  } else {
    el.style.left = Math.max(minX, Math.min(left, maxX - cw)) + 'px';
    el.style.top  = Math.max(minY, Math.min(top,  maxY - ch)) + 'px';
  }
  setTimeout(() => el.classList.remove('pop'), 340);
  if (x == null) ensureVisible(el);
  drawLinks();
  return el;
}

function resolve(r, chips, x, y) {

  links.push({ a: chips[0], b: chips[1] ?? null, out: el, fresh: true });
  el.classList.add('folded');                         // arrives closed
  refreshFolds();
  const isNew = !found.has(r.out);
  if (isNew) {

    // back to the ordinary colour once it is no longer news.
    el.classList.add('minted');
    setTimeout(() => el.classList.remove('minted'), 4000);
    const wasLive = liveCount();
    found.add(r.out);
    save(); renderShelf();
    // Players of other games in this genre report the same pair failing and then
    // later working, and read it as the game cheating. Unlocks genuinely do
    // change what is possible — so say so out loud rather than letting them
    // rediscover it by accident.
    if (MILESTONES[found.size]) toast(MILESTONES[found.size]);
    const unlocked = verbs.filter(v => v.unlockedBy === r.out);
    if (unlocked.length) {
      // A tool unlock is the bigger news; don't let the follow-up overwrite it.
      for (const v of unlocked) {
        const n = DATA.recipes.filter(x => x.verb === v.id && found.has(x.in[0]) && !found.has(x.out)).length;

        toast(`${v.name} unlocked — ${n} thing${n === 1 ? '' : 's'} you hold can be ${v.name.toLowerCase()}ed`);

// Rays radiating off the new card, once, the first time it exists. Lives in

// in your hand, anything nearby it could actually merge with gets a warning

// active drag (not anything sitting near anything, forever) on purpose: a
// whole board silently reacting on its own would eat the chain Free Play just

// reverse: the full transitive closure of what stops being reachable if one

// Theory of Constraints bottleneck, not a metaphor for one — take away the
// DNA and see how much of the bench actually depends on it.

  for (let wave = 0; wave < 500; wave++) {

      if (r.verb && !unlocked.has(r.verb)) continue;
      if (r.in.includes(excludeId) || !r.in.every(i => known.has(i))) continue;
      known.add(r.out);

const BED = DATA.bedrock;

// Structure is authored data, not derived: a formula cannot tell you a shape.
function moleculeSVG(id, size = 190) {

  const xs = st.atoms.map(a => a[1]), ys = st.atoms.map(a => a[2]);
  const pad = 0.7;
  const minX = Math.min(...xs) - pad, maxX = Math.max(...xs) + pad;
  const minY = Math.min(...ys) - pad, maxY = Math.max(...ys) + pad;
  const w = maxX - minX, h = maxY - minY;
  const k = size / Math.max(w, h);
  const X = x => (x - minX) * k, Y = y => (maxY - y) * k;

  let out = `<svg class="mol" viewBox="0 0 ${w * k} ${h * k}" width="${w * k}" height="${h * k}">`;
  for (const [i, j, order] of st.bonds) {
    const [, x1, y1] = st.atoms[i], [, x2, y2] = st.atoms[j];
    if (order === 2) {
      const dx = Y(y2) - Y(y1), dy = X(x1) - X(x2);
      const L = Math.hypot(dx, dy) || 1, ox = (dx / L) * 3.2, oy = (dy / L) * 3.2;
      out += `<line x1="${X(x1)+ox}" y1="${Y(y1)+oy}" x2="${X(x2)+ox}" y2="${Y(y2)+oy}" class="bond"/>`;
      out += `<line x1="${X(x1)-ox}" y1="${Y(y1)-oy}" x2="${X(x2)-ox}" y2="${Y(y2)-oy}" class="bond"/>`;
    } else {
      out += `<line x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}" class="bond"/>`;
    }
  }
  for (const [el, x, y] of st.atoms) {
    const r = (R[el] ?? 0.4) * k;
    const fill = BED.cpk[el];
    const dark = el === 'C' || el === 'N';
    out += `<circle cx="${X(x)}" cy="${Y(y)}" r="${r}" fill="${fill}" class="ball"/>`;
    out += `<text x="${X(x)}" y="${Y(y)}" class="lbl" fill="${dark ? '#fff' : '#1a1a1a'}" ` +
           `style="font-size:${r * 1.15}px">${el}</text>`;
  }
  return out + '</svg>';
}

// their symbol, number, group and a line of their own — so say so on the card.
const EL_ALIAS = { aluminum: 'el_aluminium' };
const atomFor = (id) => atomById[EL_ALIAS[id] ?? ('el_' + id)];
const CAT_NAME = {
  alkali: 'Alkali metal', alkaline: 'Alkaline earth metal', transition: 'Transition metal',
  metal: 'Post-transition metal', metalloid: 'Metalloid', nonmetal: 'Nonmetal',
  halogen: 'Halogen', noble: 'Noble gas', lanthanide: 'Lanthanide', actinide: 'Actinide',
};
function factsHTML(id) {
  const a = atomFor(id);

    <div class="elfact">
      <span class="atom ${a.category}"><span class="sym">${a.symbol}</span><span class="z">${a.number}</span></span>
      <div>

// ---- the periodic table, docked along the bottom ----
// The sheet version (periodicHTML) is a page you go to. This one stays open
// beside the bench, which is the only way it can answer "have I got that
// one yet" while you are actually playing — so the tiles read your shelf,
// not just the data file. Deliberately separate from the aside pane's own
// "Elements" tab (see renderAsideElements below) — this is the scientist's
// chart, that is a plain list of the game's own elements.
const PT_MIN = 130, PT_MAX_FRAC = 0.72;
// bedrock.json's own `inPlay` flag means "the starters are made of this", which
// is a different and much smaller set than "you can hold this as a card" — 15
// against 75. Lighting the dock by that flag left three quarters of the
// playable elements looking like they were not in the game. Ask the element
// list instead, which is the thing that actually decides.
const PLAYABLE_ATOM = new Map();
for (const e of elements) { const a = atomFor(e.id); if (a) PLAYABLE_ATOM.set(a.id, e.id); }
function ptRender() {
  const body = document.getElementById('ptBody');
  if (!body) return;
  const held = [...PLAYABLE_ATOM.values()].filter(id => found.has(id)).length;
  const cats = [...new Set(BED.atoms.map(a => a.category))];
  document.getElementById('ptHead').innerHTML =
    `<b>The periodic table</b>` +
    `<span>${held} of the ${PLAYABLE_ATOM.size} you can hold are on your shelf</span>` +
    `<button class="ghost" id="ptClose" title="Close the table">Close</button>`;
  // Laid out the way a wall chart is: group numbers along the top, period
  // numbers down the side, and inside each tile the atomic number small at the
  // top, the symbol large, and the name under it. Everything is shifted one row
  // and one column to make room for the headers.
  // Group numbers along the bottom, not the top — "can the elemental table
  // numbering at the top: 1-18 move to the bottom of the table rather than
  // the top?", found live. Row 12 is a new trailing gutter, the same
  // height as the one row 1 used to be, past the lanthanide/actinide rows.
  let h = '<div class="ptab">';
  for (let g = 1; g <= 18; g++) h += `<i class="gnum" style="grid-area:12/${g + 1}">${g}</i>`;
  for (let pd = 1; pd <= 7; pd++) h += `<i class="pnum" style="grid-area:${pd + 1}/1">${pd}</i>`;
  // The wide gap between Be/Mg (group 2) and B/Al (group 13), periods 2-3 —
  // real empty cells nobody's tile ever occupies — is exactly where a legend
  // fits without covering a single element ("can we format better and move
  // to the gap inbetween be/mg and b/Al?" — found live).
  h += `<div class="ptLegend" style="grid-area:3/4/5/14">` +
       cats.map(c => `<span style="background:var(--${c})">${c}</span>`).join('') + `</div>`;
  // "If we have an item from the table on the canvas, can it pulse in the
  // table?" — found live. Discovered (.have) and on-the-bench-right-now
  // (.bench) are different facts about the same tile.
  const onBoard = new Set([...world.querySelectorAll('.chip.board')].map(c => c.dataset.id).filter(Boolean));
  for (const a of BED.atoms) {
    const [row, col] = ptCell(a.number);
    const el = PLAYABLE_ATOM.get(a.id);
    const mine = el && found.has(el);
    const bench = el && onBoard.has(el);
    // Sulfur is yellow flakes, bromine an ampoule of brown liquid, tungsten a
    // filament coil — the drawings say what each one is to HOLD, which a
    // two-letter symbol never does. Kept, but as a watermark in the corner, so
    // the chart still reads as a chart.
    const art = el && ART[el] ? `<span class="gl">${artSVG(el)}</span>` : '';
    h += `<span class="atom ${a.category}${el ? '' : ' off'}${mine ? ' have' : ''}${bench ? ' bench' : ''}" ` +
         `style="grid-area:${row + 1}/${col + 1}" ` +
         `data-atom="${a.id}"${el ? ` data-el="${el}"` : ''} ` +
         `title="${a.number} · ${a.name}${bench ? ' — on the bench' : mine ? ' — on your shelf' : el ? ' — in this world, not yet made' : ' — reference only'}">` +
         `${art}<span class="z">${a.number}</span>` +
         `<span class="sym">${a.symbol}</span>` +
         `<span class="nm">${a.name}</span></span>`;
  }
  document.getElementById('ptBody').innerHTML = h + '</div>';
  document.getElementById('ptClose').onclick = () => ptSet(false);
  ptFit();
}
// Eighteen columns, sized to the width available and nothing else.
//
// Sizing to the dock's height instead — so that all ten rows always fit — is
// the obvious idea and it is wrong: it drove the cell to 28px, which is too
// small for a drawing and leaves an 8px symbol, which is the complaint this
// was meant to fix. A tile is worth reading or it is not worth drawing. Keep
// it readable, and let a short dock scroll; the handle is right there.
const PT_COLS = 18, PT_ROWS = 11, PT_GAPPX = 3;   // 7 periods, a blank, the two f-block rows, a blank for the bottom group numbers
function ptFit() {
  const body = document.getElementById('ptBody');
  const tab = body?.querySelector('.ptab');
  if (!tab) return;
  const byW = (body.clientWidth - (PT_COLS + 0.5) * PT_GAPPX) / (PT_COLS + 0.5);   // the period column too
  const cell = Math.max(34, Math.min(74, Math.floor(byW)));
  tab.style.setProperty('--ptcell', cell + 'px');
  body.classList.toggle('tight', cell < 44);
}
function ptSet(on) {
  document.body.classList.toggle('pt-on', on);
  document.getElementById('ptDock').setAttribute('aria-hidden', String(!on));
  const b = document.getElementById('ptTab');
  b.classList.toggle('on', on);
  b.title = on ? 'Hide the periodic table' : 'Show the periodic table along the bottom';
  retip(b);
  prefs.ptOpen = on ? 1 : 0; savePrefs();
  if (on) ptRender();
  drawLinks();
}
function ptHeight(px) {
  // The RAW board, not boardBox() — boardBox subtracts the dock, so clamping
  // against it made the ceiling fall every time the dock grew, and dragging up
  // shrank the panel instead of enlarging it.
  const max = Math.round((board.getBoundingClientRect().height || 600) * PT_MAX_FRAC);
  const h = Math.max(PT_MIN, Math.min(px, max));
  document.body.style.setProperty('--pth', h + 'px');
  prefs.ptH = h; savePrefs();
  ptFit();                                   // taller dock, bigger tiles
}

// ---- the aside pane's "Elements" tab: a plain list of the game's own
// elements, found or not — deliberately NOT the periodic chart above. ----
let asideElQuery = '';
let asideElTimer = 0;
function renderAsideElements(q = asideElQuery) {
  asideElQuery = q;
  const ql = q.toLowerCase();
  // One pass, not one per family. The old form was FAMILIES.map over
  // elements.filter, so every element was tested against every family — ten
  // times the work, and ten times the matchesSearch calls.
  const bucket = new Map();
  for (const e of elements) {
    if (!matchesSearch(e, ql)) continue;
    const f = familyOf(e);
    let g = bucket.get(f.id);
    if (!g) bucket.set(f.id, g = []);
    g.push(e);
  }
  const groups = FAMILIES.filter(f => bucket.has(f.id))
    .map(f => [f, bucket.get(f.id)])
    .sort((a, b) => (a[0].id === 'myth') - (b[0].id === 'myth'));
  // Building a chip is not free — each one inlines its drawing — so a query
  // matching thousands of elements costs seconds no matter how fast the filter
  // is. Draw a bounded number and say plainly how many were left out, rather
  // than freezing the pane. Typing one more letter almost always clears it.
  const CAP = 700;
  const total = groups.reduce((n, [, g]) => n + g.length, 0);
  let budget = CAP;
  const body = groups.length
    ? (total > CAP
        ? `<p class="none">Showing ${CAP} of ${total} — keep typing to narrow.</p>` : '') +
      groups.map(([f, g]) => {
        if (budget <= 0) return '';
        const shown = g.slice(0, budget);
        budget -= shown.length;
        const have = shown.filter(e => found.has(e.id)).length;
        return `<h2 class="fam-${f.id}"><i></i>${f.name}<em>${g.length}</em>` +
          (have ? `<b class="lv">${have}</b>` : '') + `</h2><div class="shelf">` +
          shown.map(e => found.has(e.id)
            ? `<span class="chip fam-${f.id}" data-fam="${f.id}" data-spawn="${e.id}">${chipHTML(e)}</span>`
            : `<span class="chip locked" data-hint="${e.id}">${chipHTML(e)}<i class="q">?</i></span>`
          ).join('') + `</div>`;
      }).join('')
    : '<p class="none">Nothing matches.</p>';
  document.getElementById('asideElements').innerHTML =
    `<div class="shelfbar">
       <input id="asideElQ" class="search sm" placeholder="Find…" value="${q}" autocomplete="off">
       ${q ? '<button id="asideElX" title="Clear">×</button>' : ''}
     </div>` + body;
  // The old handler re-rendered the whole panel — input included — then had to
  // re-find the box, re-focus it and restore the caret, on every keystroke.
  // Re-binding here is still needed because the innerHTML above replaces the
  // input, but the search itself is now cheap enough that the churn is not
  // what the player feels. Keeping the caret restore, since the input really
  // is a new element each time.
  const box = document.getElementById('asideElQ');
  box.oninput = () => {
    // Debounced: typing "asbestos" used to render eight times, and the first
    // render — one letter, thousands of matches — was the expensive one. Now a
    // burst of keystrokes renders once, when the typing stops.
    const v = box.value;
    clearTimeout(asideElTimer);
    asideElTimer = setTimeout(() => {
      renderAsideElements(v);
      const b2 = document.getElementById('asideElQ');
      if (b2) { b2.focus(); b2.setSelectionRange(v.length, v.length); }
    }, 140);
  };
  const x = document.getElementById('asideElX');
  if (x) x.onclick = () => renderAsideElements('');
}
// Which tab of the aside pane is showing. Wholly separate from ptSet()/the
// bottom dock above. Four now, not two — Shelf and Elements unchanged,
// Proteins and Animals added ("could the side panel 'shelf' and 'elements'

// "can you allow me to 'favourite' elements, adding a favourite group/tab" —

const aminoById = Object.fromEntries((BED.aminos ?? []).map(a => [a.id, a]));
// PLAYABLE_ATOM (above) only ever looked inside atomById — true chemical
// elements — so an amino acid could never get the same "+ Put on the bench"
// button a real element does, even on the 19 of 20 amino acids that ARE
// also real, already-craftable Loam elements (glycine, alanine, ...). Bedrock
// amino ids are systematically `bed_<the matching game id>`, one exception
// (aspartic_acid's own Wikipedia-titled bedrock id is bed_aspartate) aliased
// the same way EL_ALIAS handles aluminum/aluminium.
// ("why cant i drag e.g. these proteins/amino acids in?" — found live.)
const AMINO_ALIAS = { aspartic_acid: 'bed_aspartate' };
const PLAYABLE_AMINO = new Map();
for (const e of elements) {
  const bid = AMINO_ALIAS[e.id] ?? ('bed_' + e.id);
  if (aminoById[bid]) PLAYABLE_AMINO.set(bid, e.id);
}
// The reverse of PLAYABLE_ATOM/PLAYABLE_AMINO: given a Loam game id, which
// bedrock node (if any) is its real molecular structure filed under? Lets
// quickViewHTML draw the same ball-and-stick diagram showAtom's own sheet
// already does, instead of that diagram only ever being reachable through
// the periodic table / Proteins tab detour. ("i see in your browser glycine
// has a proper drawn out scientific image, but i dont see that? ... can we
// include in our quick view?" — found live.)
function bedrockIdFor(gameId) {
  const atomKey = EL_ALIAS[gameId] ?? ('el_' + gameId);
  if (atomById[atomKey]) return atomKey;
  const aminoKey = AMINO_ALIAS[gameId] ?? ('bed_' + gameId);
  if (aminoById[aminoKey]) return aminoKey;
  return null;
}

// ---- timeline: real, sourced years already sitting in elements' own fact
// text, surfaced rather than researched fresh. See DESIGN-timeline-view.md —
// v1 on purpose: one line in the sheet that's already there, not a new view.
const TIMELINE = elements.filter(e => e.discovered)
  .map(e => ({ id: e.id, year: e.discovered.year }))
  .sort((a, b) => a.year - b.year);
function nearestInTimeHTML(id) {
  const mine = byId[id]?.discovered;
  if (!mine || TIMELINE.length < 2) return '';
  const others = TIMELINE.filter(t => t.id !== id && found.has(t.id))
    .sort((a, b) => Math.abs(a.year - mine.year) - Math.abs(b.year - mine.year))
    .slice(0, 2).sort((a, b) => a.year - b.year);
  if (!others.length) return '';
  return `<p class="hint2">Around the same time: ` + others.map(o =>
    `<span class="g" data-entry="${o.id}">${glyph(o.id, 17)} ${byId[o.id].name} (${o.year})</span>`
  ).join(', ') + `</p>`;
}
const fmt = (f) => String(f).replace(/(\d+)/g, '<sub>$1</sub>');

// A recipe row reads "what you had + what you had → what you got" everywhere
// else in this sheet; the composition story was the one place that started
// from the far end instead ("Sun is made of: Hydrogen Fusion, which is..."),
// which is backwards from how every other equation on this card reads. This
// puts the real leaf atoms first, in the same "A + B → C" grammar as the
// Makes list right below it — "Hydrogen + Helium → Sun" — with the fusion
// step and the rest of the story still underneath for whoever wants it.
function bedEquationHTML(id, atomIds) {
  const atomSpan = a => `<span class="g" data-atom="${a}">${atomTile(atomById[a])}${atomById[a].name}</span>`;
  return `<div class="ent bed-eq">${[...atomIds].map(atomSpan).join('<em>+</em>')}` +
    `<span class="arw">→</span><span class="g out" data-entry="${id}">${glyph(id, 19)} ${byId[id].name}</span>` +
    (BED.composition[id] ? `<button class="addroute" data-put-compo="${id}" title="Add this path to the chart">+</button>` : '') +
    `</div>`;
}
// The equation row (bedEquationHTML, above every leaf's own tree) already
// lists that leaf's own atoms as the same clickable pills — a trailing
// "N chemical elements" tally of the identical set just below it repeated
// the same letters twice for no reason. ("why do we have carbon hydrogen
// etc showing in a made from section, and again in a 6 chemical elements
// section? remove the 6 chemical elements section, no point duplicating"
// — found live.)
function bedrockHTML(tally, head = 'and below that') {
  const leaves = [...tally.keys()].filter(id => BED.composition[id]);
  if (!leaves.length) return '';
  return `<div class="bedhead">${head}</div>` +
    leaves.map(id => {
      const own = new Set();
      for (const p of BED.composition[id]) for (const a of atomsUnder(p)) own.add(a);
      return `<div class="bedgroup">${bedEquationHTML(id, own)}` +
        `<div class="bedof"><span>${glyph(id, 20)} ${byId[id].name} is made of</span>` +
        `<button class="addroute all" data-put-compo="${id}" title="Add every part below to the chart">+</button></div>` +
        `<ul class="tree bed">${BED.composition[id].map(k => bedTreeHTML(k, id)).join('')}</ul></div>`;
    }).join('');
}
