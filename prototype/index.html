<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Loam — dirt to dinner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Cutive+Mono&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='26' fill='%23221C14'/%3E%3Cg stroke='%235C4B38' stroke-width='3' fill='none' stroke-linecap='round'%3E%3Cpath d='M28 34 Q44 54 56 66'/%3E%3Cpath d='M50 26 Q54 48 58 64'/%3E%3Cpath d='M70 26 Q66 48 62 64'/%3E%3Cpath d='M92 34 Q76 54 64 66'/%3E%3C/g%3E%3Ccircle cx='28' cy='34' r='8' fill='%239C8A74'/%3E%3Ccircle cx='50' cy='26' r='8' fill='%234E8CB8'/%3E%3Ccircle cx='70' cy='26' r='8' fill='%23E0A526'/%3E%3Ccircle cx='92' cy='34' r='8' fill='%236B8E4E'/%3E%3Crect x='42' y='66' width='36' height='30' rx='9' fill='%23E2703A'/%3E%3C/svg%3E">
<style>
  :root{
    /* Two faces. Neither is on anyone's list of tells, and both were drawn
       for exactly this job: a text serif built for screens, and a real
       typewriter face for labels and numbers. */
    --face-name:"Source Serif 4",Charter,Georgia,"Times New Roman",serif;
    --face-data:"Cutive Mono",ui-monospace,"SF Mono",Menlo,monospace;
  /* Derived from the Munsell renotation data — see tools/palette.mjs.
     Do not hand-edit: run `node tools/palette.mjs` instead. */
  --c-mineral-bs:#6F5F4C;   /* 10YR 4/2 */
  --c-mineral-hi:#A3937E;   /* 10YR 6/2 */
  --c-mineral-lo:#3D2F21;   /* 10YR 2/2 */
  --c-craft-bs:#A3937E;   /* 10YR 6/2 */
  --c-craft-hi:#D8C8B1;   /* 10YR 8/2 */
  --c-craft-lo:#6F5F4C;   /* 10YR 4/2 */
  --c-grain-bs:#C5AD7D;   /* 2.5Y 7/4 */
  --c-grain-hi:#FBE4AD;   /* 2.5Y 9/4 */
  --c-grain-lo:#8F784C;   /* 2.5Y 5/4 */
  --c-dish-bs:#9A7359;   /* 5YR 5/4 */
  --c-dish-hi:#D0A78C;   /* 5YR 7/4 */
  --c-dish-lo:#65402B;   /* 5YR 3/4 */
  --c-ferment-bs:#A49562;   /* 5Y 6/4 */
  --c-ferment-hi:#D9CA93;   /* 5Y 8/4 */
  --c-ferment-lo:#706031;   /* 5Y 4/4 */
  --c-plant-bs:#6A8259;   /* 7.5GY 5/4 */
  --c-plant-hi:#9DB888;   /* 7.5GY 7/4 */
  --c-plant-lo:#384F2D;   /* 7.5GY 3/4 */
  --c-living-bs:#867590;   /* 5P 5/4 */
  --c-living-hi:#B9AAC4;   /* 5P 7/4 */
  --c-living-lo:#564060;   /* 5P 3/4 */
  --c-water-bs:#567FA3;   /* 2.5PB 5/6 */
  --c-water-hi:#8BB4D7;   /* 2.5PB 7/6 */
  --c-water-lo:#194C72;   /* 2.5PB 3/6 */
  --c-fire-bs:#B96255;   /* 7.5R 5/8 */
  --c-fire-hi:#F29787;   /* 7.5R 7/8 */
  --c-fire-lo:#812B27;   /* 7.5R 3/8 */
  --c-molecule-bs:#4981A1;   /* 10B 5/6 */
  --c-molecule-hi:#7EB7D6;   /* 10B 7/6 */
  --c-molecule-lo:#264C64;   /* 10B 3/4 */
  --s-ground:#291A0A;   /* 10YR 1/2 */
  --s-panel:#3D2F21;   /* 10YR 2/2 */
  --s-rule:#554636;   /* 10YR 3/2 */
  --s-ink:#D8C8B1;   /* 10YR 8/2 */
  --s-inkQuiet:#A3937E;   /* 10YR 6/2 */
  --s-paper:#F4E3CA;   /* 10YR 9/2 */
  --s-paperInk:#3D2F21;   /* 10YR 2/2 */
  --s-accent:#C2895F;   /* 5YR 6/6 */
  --s-discovery:#DD7D17;   /* 5YR 6/12 */

    /* The named roles the drawings reach for, whatever their category. */
    --ik:var(--s-ink); --gh:var(--s-rule);
    --ground:var(--s-ground); --discovery:var(--s-discovery);

    /* Interface roles. Every rule in this stylesheet goes through these, so a
       theme is a redefinition of eleven values and nothing else. */
    --cream:var(--s-ground);
    --ink:var(--s-ink);
    --ink-soft:var(--s-inkQuiet);
    --card:var(--s-panel);
    --line:var(--s-rule);
    /* Two warm colours, and the difference between them carries meaning.
       --orange is the interface accent: hover, focus, the current thing.
       --discovery is the only high-chroma colour in the game and appears at
       exactly one moment — when something new exists. If it is used for a
       button, it stops meaning anything. */
    --orange:var(--s-accent);
    --mustard:var(--c-grain-bs);
    --avocado:var(--c-plant-bs);
    --brick:var(--c-fire-bs);
    --teal:var(--c-molecule-bs);
    --raise:0 6px 18px -8px rgba(0,0,0,.75);
    --surface:var(--s-panel);          /* raised chrome: header, sidebar, buttons */
    --on-accent:var(--s-ground);       /* text that sits on a filled accent */
    --shade:0,0,0;                     /* the r,g,b every shadow is mixed from */
  }

  .art[data-cat="mineral"]{--bs:var(--c-mineral-bs);--hi:var(--c-mineral-hi);--lo:var(--c-mineral-lo)}
  .chip:has(.art[data-cat="mineral"]){--fam:var(--c-mineral-bs);--fam-rule:var(--c-mineral-hi)}
  body.t-manual .chip:has(.art[data-cat="mineral"]){--fam-rule:var(--c-mineral-bs)}
  .art[data-cat="craft"]{--bs:var(--c-craft-bs);--hi:var(--c-craft-hi);--lo:var(--c-craft-lo)}
  .chip:has(.art[data-cat="craft"]){--fam:var(--c-craft-bs);--fam-rule:var(--c-craft-hi)}
  body.t-manual .chip:has(.art[data-cat="craft"]){--fam-rule:var(--c-craft-bs)}
  .art[data-cat="grain"]{--bs:var(--c-grain-bs);--hi:var(--c-grain-hi);--lo:var(--c-grain-lo)}
  .chip:has(.art[data-cat="grain"]){--fam:var(--c-grain-bs);--fam-rule:var(--c-grain-hi)}
  body.t-manual .chip:has(.art[data-cat="grain"]){--fam-rule:var(--c-grain-bs)}
  .art[data-cat="dish"]{--bs:var(--c-dish-bs);--hi:var(--c-dish-hi);--lo:var(--c-dish-lo)}
  .chip:has(.art[data-cat="dish"]){--fam:var(--c-dish-bs);--fam-rule:var(--c-dish-hi)}
  body.t-manual .chip:has(.art[data-cat="dish"]){--fam-rule:var(--c-dish-bs)}
  .art[data-cat="ferment"]{--bs:var(--c-ferment-bs);--hi:var(--c-ferment-hi);--lo:var(--c-ferment-lo)}
  .chip:has(.art[data-cat="ferment"]){--fam:var(--c-ferment-bs);--fam-rule:var(--c-ferment-hi)}
  body.t-manual .chip:has(.art[data-cat="ferment"]){--fam-rule:var(--c-ferment-bs)}
  .art[data-cat="plant"]{--bs:var(--c-plant-bs);--hi:var(--c-plant-hi);--lo:var(--c-plant-lo)}
  .chip:has(.art[data-cat="plant"]){--fam:var(--c-plant-bs);--fam-rule:var(--c-plant-hi)}
  body.t-manual .chip:has(.art[data-cat="plant"]){--fam-rule:var(--c-plant-bs)}
  .art[data-cat="living"]{--bs:var(--c-living-bs);--hi:var(--c-living-hi);--lo:var(--c-living-lo)}
  .chip:has(.art[data-cat="living"]){--fam:var(--c-living-bs);--fam-rule:var(--c-living-hi)}
  body.t-manual .chip:has(.art[data-cat="living"]){--fam-rule:var(--c-living-bs)}
  .art[data-cat="water"]{--bs:var(--c-water-bs);--hi:var(--c-water-hi);--lo:var(--c-water-lo)}
  .chip:has(.art[data-cat="water"]){--fam:var(--c-water-bs);--fam-rule:var(--c-water-hi)}
  body.t-manual .chip:has(.art[data-cat="water"]){--fam-rule:var(--c-water-bs)}
  .art[data-cat="fire"]{--bs:var(--c-fire-bs);--hi:var(--c-fire-hi);--lo:var(--c-fire-lo)}
  .chip:has(.art[data-cat="fire"]){--fam:var(--c-fire-bs);--fam-rule:var(--c-fire-hi)}
  body.t-manual .chip:has(.art[data-cat="fire"]){--fam-rule:var(--c-fire-bs)}
  .art[data-cat="molecule"]{--bs:var(--c-molecule-bs);--hi:var(--c-molecule-hi);--lo:var(--c-molecule-lo)}
  .chip:has(.art[data-cat="molecule"]){--fam:var(--c-molecule-bs);--fam-rule:var(--c-molecule-hi)}
  body.t-manual .chip:has(.art[data-cat="molecule"]){--fam-rule:var(--c-molecule-bs)}

  /* ── themes ───────────────────────────────────────────────────────────
     The geometry is drawn once. A theme decides what a role looks like.  */

  /* Field manual — ink on paper. The same 226 drawings, unfilled. */
  body.t-manual{
    --cream:var(--s-paper);
    --discovery:#B4600A;
    --ink:var(--s-paperInk);
    --ink-soft:#7A6A52;
    --card:#EFE0C4;
    --line:#CDBB99;
    --ik:var(--s-paperInk);
    --gh:#A8967A;
    --ground:var(--s-paper);
    --raise:0 2px 0 rgba(var(--shade),.14);
    --surface:#FBF2DE;
    --on-accent:#FFF8EA;
    --shade:43,33,24;
  }
  body.t-manual .art [data-f]{fill:none;stroke:var(--s-paperInk);stroke-width:1.5;
                              stroke-linejoin:round;stroke-linecap:round}
  body.t-manual .art [data-s]{stroke:var(--s-paperInk)}

  /* ── grounds ──────────────────────────────────────────────────────────
     Background only. Any ground works under either theme.               */
  body{background-attachment:fixed}

  body.g-tray{background:
      radial-gradient(ellipse at 50% -10%, #33220F 0%, transparent 62%),
      var(--s-ground);}

  body.g-paper{background:
      radial-gradient(ellipse at 50% 0%, #FFF6E6 0%, transparent 60%),
      var(--s-paper);}

  body.g-graph{background:
      linear-gradient(var(--line) 1px, transparent 1px) 0 0/26px 26px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/26px 26px,
      var(--cream);}

  /* Deep — the molecular tier's ground. Cold, and very slightly starred. */
  body.g-deep{background:
      radial-gradient(1.4px 1.4px at 18% 22%, rgba(210,228,240,.55) 50%, transparent 51%) 0 0/180px 140px,
      radial-gradient(1.2px 1.2px at 68% 64%, rgba(190,214,232,.42) 50%, transparent 51%) 0 0/210px 170px,
      radial-gradient(1.8px 1.8px at 42% 82%, rgba(230,240,250,.32) 50%, transparent 51%) 0 0/260px 220px,
      radial-gradient(ellipse at 30% 8%, #16243A 0%, transparent 58%),
      radial-gradient(ellipse at 78% 88%, #101C2E 0%, transparent 60%),
      #080D16;}
  body.g-deep{--cream:#080D16;}

  /* Fluid — slow-moving liquid. Motion is the point, so it yields to
     prefers-reduced-motion rather than being decoration that cannot stop. */
  @keyframes drift{
    0%  {background-position:0% 40%, 100% 60%, 50% 50%}
    50% {background-position:60% 55%, 30% 35%, 50% 50%}
    100%{background-position:0% 40%, 100% 60%, 50% 50%}
  }
  body.g-fluid{
    background:
      radial-gradient(ellipse 70% 50% at 20% 40%, color-mix(in srgb, var(--c-water-bs) 42%, transparent) 0%, transparent 70%),
      radial-gradient(ellipse 60% 45% at 80% 60%, color-mix(in srgb, var(--c-molecule-lo) 46%, transparent) 0%, transparent 70%),
      var(--s-ground);
    background-size:180% 180%, 200% 200%, 100% 100%;
    animation:drift 44s ease-in-out infinite;
  }
  @media (prefers-reduced-motion:reduce){ body.g-fluid{animation:none} }

  /* Profile — the ground *is* a soil profile, O over A over B over C. */
  body.g-profile{background:linear-gradient(
      to bottom,
      var(--c-mineral-hi) 0%,  var(--c-mineral-hi) 9%,
      var(--c-mineral-bs) 9%,  var(--c-mineral-bs) 30%,
      var(--c-mineral-lo) 30%, var(--c-mineral-lo) 62%,
      var(--s-ground) 62%,     var(--s-ground) 100%);}
  body.g-profile{--cream:var(--c-mineral-lo);}

  /* Void — nothing at all. For screenshots, and for anyone who wants quiet. */
  body.g-void{background:var(--cream);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    font:400 15px/1.5 var(--face-name);
    color:var(--ink);
    /* The default ground, restated here so there is no flash before prefs load. */
    background:radial-gradient(ellipse at 50% -10%, #33220F 0%, transparent 62%), var(--s-ground);
    display:flex;flex-direction:column;user-select:none;
  }
  header{
    display:flex;align-items:center;gap:14px;padding:10px 16px;
    border-bottom:2px solid var(--line);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(8px);flex:none;
  }
  h1{font:700 17px/1 var(--face-name);margin:0;letter-spacing:-.2px}
  h1 span{color:var(--orange)}
  .mark{display:flex;align-items:center;gap:9px;text-decoration:none;color:inherit;flex:none}
  .mark svg{width:26px;height:26px;border-radius:7px;flex:none;display:block}
  .goal{
    font-size:12.5px;color:var(--ink-soft);background:var(--surface);border:1px solid var(--line);
    border-radius:4px;padding:5px 12px;
  }
  .goal b{color:var(--brick)}
  .goal{cursor:pointer}
  .goal:hover{border-color:var(--orange)}
  .goal .ask{
    font-style:normal;font:800 9px var(--face-name);color:var(--on-accent);background:var(--orange);
    border-radius:99px;min-width:14px;height:14px;line-height:14px;text-align:center;
    display:inline-block;margin-left:5px;
  }
  .spacer{flex:1}
  .count{font:700 13px var(--face-name);color:var(--avocado)}
  .count.free{color:var(--on-accent);background:var(--teal);border-color:var(--teal)}
  /* The score: not a stray fraction lost among header buttons, but a number
     with a name, the way a scoreboard reads. */
  #count{
    display:flex;align-items:baseline;gap:5px;font:800 15px var(--face-name);
    padding:6px 12px;background:color-mix(in srgb,var(--avocado) 12%,var(--surface));
    border-color:color-mix(in srgb,var(--avocado) 40%,var(--line));
  }
  #count .sc{font-size:17px}
  #count .lbl{font:600 10px var(--face-name);letter-spacing:.4px;color:var(--ink-soft);text-transform:uppercase}
  #count.free .lbl{color:var(--on-accent)}
  button{
    font:600 13px var(--face-name);color:var(--ink);cursor:pointer;
    background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:6px 13px;
  }
  button:active{transform:translateY(1px)}
  main{flex:1;display:flex;min-height:0}
  #board{flex:1;position:relative;overflow:hidden;touch-action:none}
  /* the canvas: an unbounded world you pan and zoom, not a fixed bench */
  #world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  #links{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
  #links path{fill:none;stroke:var(--line);stroke-width:2.5;stroke-linecap:round}
  #links path.made{stroke:var(--avocado);stroke-width:2.5;opacity:.42}
  #links .mote{opacity:.9;filter:drop-shadow(0 0 3px currentColor)}
  @keyframes draw{from{stroke-dashoffset:var(--len,400)}to{stroke-dashoffset:0}}
  #links path.fresh{
    stroke-dasharray:var(--len,400);animation:draw .45s cubic-bezier(.3,.8,.4,1) forwards;
    stroke:var(--discovery);stroke-width:3;opacity:.85;
  }
  #zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:5px;z-index:6}
  #zoom button{
    width:32px;height:32px;padding:0;font:700 15px var(--face-name);border-radius:10px;
    background:color-mix(in srgb,var(--surface) 94%,transparent);
  }
  #board{cursor:grab;touch-action:none;overscroll-behavior:contain}
  #board.panning{cursor:grabbing}
  /* The opening cue. Pointer-events none throughout: it can never be in the way,
     which is the entire reason it is not a dialog. */
  #intro{position:absolute;inset:0;z-index:5;pointer-events:none;
         transition:opacity .5s ease;}
  #intro.gone{opacity:0}
  #introArc{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  #introArc path{
    fill:none;stroke:var(--orange);stroke-width:2;stroke-linecap:round;
    stroke-dasharray:5 7;opacity:.85;
    animation:crawl 1.1s linear infinite;
  }
  @keyframes crawl{to{stroke-dashoffset:-24}}
  @media (prefers-reduced-motion:reduce){ #introArc path{animation:none} }
  #introSay{
    position:absolute;transform:translateX(-50%);
    margin:0;padding:7px 14px;white-space:nowrap;
    max-width:calc(100vw - 28px);
    font:400 13px/1.35 var(--face-name);color:var(--ink);
    background:color-mix(in srgb,var(--card) 92%,transparent);
    border:1px solid var(--line);border-radius:3px;
    box-shadow:var(--raise);
  }
  #introSay b{font-weight:600}
  #introSay i{font-style:normal;display:block;margin-top:2px;
              font:400 10px/1.3 var(--face-data);letter-spacing:.06em;
              text-transform:uppercase;color:var(--ink-soft)}
  aside{
    width:238px;flex:none;border-left:2px solid var(--line);background:color-mix(in srgb,var(--surface) 88%,transparent);
    overflow-y:auto;padding:10px;
  }
  aside h2{
    font:700 10.5px/1 var(--face-name);letter-spacing:.9px;text-transform:uppercase;
    color:var(--ink-soft);margin:12px 4px 7px;
  }
  aside h2:first-child{margin-top:2px}
  .shelf{display:flex;flex-wrap:wrap;gap:5px}
  /* ── the specimen card ────────────────────────────────────────────────
     Not a pill. A fixed portrait footprint, so a rock and a cake occupy the
     same frame and are told apart by what is *in* it — which is the whole
     argument for leaving emoji behind. Everything under the drawing is
     rendered from data we already hold. */
  .chip{
    display:inline-flex;flex-direction:column;align-items:center;gap:0;
    width:var(--cw,84px);padding:8px 5px 6px;background:var(--card);
    border:1px solid var(--line);border-radius:3px;
    font:500 11px/1.25 var(--face-name);white-space:normal;text-align:center;cursor:grab;
    box-shadow:var(--raise);position:relative;
  }
  .chip .art{width:50px;height:50px;display:block;flex:none}
  .chip .n{
    display:flex;align-items:center;justify-content:center;
    min-height:2.4em;margin-top:4px;letter-spacing:.055em;text-transform:uppercase;
    font:600 9.5px/1.2 var(--face-name);color:var(--ink);
    overflow-wrap:break-word;hyphens:auto;
  }
  /* A long single word (SOURDOUGH STARTER, SPAGHETTI) cannot be broken without
     looking like a mistake, so it gets smaller instead of getting chopped. */
  .chip .n.long{font-size:8.4px;letter-spacing:.02em}
  .chip .n.vlong{font-size:7.4px;letter-spacing:0}
  /* The category rule. Colour is never the only signal — the accession line
     below carries the same information as text. */
  /* The category rule. On the dark tray a mid-value chip disappears into the
     card, so the rule takes the lighter chip from the same hue page; on paper
     it takes the base. Either way it is a Munsell colour, and either way the
     accession line below says the same thing in words. */
  .chip .rl{display:block;width:24px;height:2px;margin:5px auto 3px;border-radius:2px;
            background:var(--fam-rule,var(--fam))}
  .chip .ac{
    display:block;font:400 7.5px/1.2 var(--face-data);letter-spacing:.07em;
    color:var(--ink-soft);font-variant-numeric:tabular-nums;
  }
  .chip.board{--cw:94px}
  .chip.board .art{width:60px;height:60px}
  .chip.board .n{font-size:10px}
  .chip.board .ac{font-size:8px}
  /* Shelf chips are scanned, not read: drawing and name only. */
  aside .chip{--cw:88px;padding:8px 4px 7px}
  aside .chip .art{width:46px;height:46px}
  aside .chip .n{font-size:10.5px;letter-spacing:.04em}
  aside .chip .rl,aside .chip .ac{display:none}
  /* Density applies to the shelf too — "how much room each thing takes" was
     never meant to stop at the canvas edge. Pill here is sized to its own
     content rather than a fixed --cw, so a dozen short names can share a row
     the way tags do, instead of every pill paying for the widest name. */
  body.d-pill aside .chip{
    width:auto;flex-direction:row;align-items:center;justify-content:flex-start;
    padding:4px 9px 4px 5px;border-radius:99px;gap:6px;
  }
  body.d-pill aside .chip .art{width:18px;height:18px;flex:none}
  body.d-pill aside .chip .n{
    display:flex;align-items:center;min-height:0;margin:0;text-align:left;
    text-transform:none;letter-spacing:0;font-size:10px;white-space:nowrap;
  }
  body.d-pill aside .chip .n.long,body.d-pill aside .chip .n.vlong{font-size:9px}
  body.d-half aside .chip{
    width:auto;flex-direction:row;align-items:center;justify-content:flex-start;
    padding:3px 8px 3px 4px;border-radius:8px;gap:5px;background:transparent;border:none;box-shadow:none;
  }
  body.d-half aside .chip .art{width:26px;height:26px;flex:none}
  body.d-half aside .chip .n{
    display:flex;align-items:center;min-height:0;margin:0;text-align:left;
    text-transform:none;letter-spacing:0;font-size:9.5px;white-space:nowrap;
    padding:2px 6px;background:var(--card);border:1px solid var(--line);border-radius:3px;
  }

  /* ── density: half card ─────────────────────────────────────────────────
     The user's own sketch: the drawing floats free on the tray with no frame
     around it, and only the name sits in a box. :not(.cooking):not(.target)
     guards every rule that touches background/border/padding, because both of
     those states repaint the chip completely on their own and must keep doing
     so regardless of density — a card mid-ferment still needs its ring. */
  body.d-half .chip.board:not(.cooking):not(.target){
    --cw:66px;background:transparent;border:none;box-shadow:none;padding:0;gap:3px;
  }
  body.d-half .chip.board .art{
    width:44px;height:44px;
    filter:drop-shadow(0 3px 7px rgba(var(--shade),.6));
  }
  body.d-half .chip.board .n{
    min-height:0;margin-top:0;padding:3px 7px;background:var(--card);
    border:1px solid var(--line);border-radius:3px;font-size:8.2px;
  }
  body.d-half .chip.board .n.long{font-size:7.3px}
  body.d-half .chip.board .n.vlong{font-size:6.6px}
  body.d-half .chip.board .rl,
  body.d-half .chip.board .ac{display:none}

  /* ── density: pill ────────────────────────────────────────────────────
     The genre's own shape, at last let back in — but the icon is still a
     drawing, never an emoji, and the footprint is a fixed size like every
     other density so the bench-packing math above never has to know which
     mode it is looking at. */
  body.d-pill .chip.board:not(.cooking):not(.target){
    --cw:88px;flex-direction:row;align-items:center;justify-content:flex-start;
    gap:6px;padding:4px 9px 4px 5px;border-radius:99px;
  }
  body.d-pill .chip.board .art{width:21px;height:21px;flex:none}
  body.d-pill .chip.board .n{
    /* Block put the text at the TOP of the reserved two-line box, so a short
       one-line name like "Stone" sat high above the icon's own vertical
       centre instead of level with it. Flex centres whatever text is actually
       there — one line or two — within that same reserved height. Reserving
       only ~one line (not two) is what actually makes this read as a pill
       instead of a card with rounded corners — most names fit on one line
       anyway, and a 2-line name just grows the pill a little rather than
       every pill paying for the tallest possible name. */
    display:flex;align-items:center;justify-content:flex-start;
    min-height:1.25em;margin:0;text-align:left;text-transform:none;
    letter-spacing:0;font-size:9.5px;line-height:1.15;
  }
  body.d-pill .chip.board .n.long{font-size:8.6px}
  body.d-pill .chip.board .n.vlong{font-size:7.8px}
  body.d-pill .chip.board .rl,
  body.d-pill .chip.board .ac{display:none}

  /* An inline drawing, sized in place of the emoji it replaced. */
  .gl{display:inline-block;width:var(--g,20px);height:var(--g,20px);vertical-align:-.22em}
  .gl .art{width:100%;height:100%;display:block}
  /* Folklore is marked by an absence, not a colour: no accession, no source. */
  .chip.folk .ac{opacity:.5}
  .chip.folk{border-style:dashed}
  .chip.spent{opacity:.42}
  /* A chip mid-process: a ring fills as it rests, and it cannot be dragged.
     The border-box/padding-box trick only separates a "ring" from the card's
     interior when the border is actually thick enough to draw one — at the
     base card's 1px border, border-box and padding-box are practically the
     same rectangle, so the conic-gradient (painted on top, per CSS background
     layering) covered the ENTIRE face as a pie-wedge instead of a thin rim.
     box-sizing:border-box means widening the border here costs nothing: the
     outer footprint — and cardSize()'s measurement of it — is unaffected. */
  .chip.board.cooking{
    cursor:default;
    border-width:4px;
    background:
      conic-gradient(var(--teal) var(--p,0%), transparent 0) border-box,
      var(--card) padding-box;
    border-color:transparent;padding:6px 12px 6px 8px;
  }
  .chip.board.cooking::after{
    content:attr(data-verb);position:absolute;top:-7px;right:-6px;
    font:400 8px/1 var(--face-data);letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink);background:var(--card);border:1px solid var(--line);
    border-radius:2px;padding:2px 5px;
  }
  .chip.board.cooking .n{display:none}
  .chip.board.hidden{display:none}
  .chip.board.folded{border-style:dashed}
  .chip.board.folded::after{
    content:attr(data-fold);position:absolute;top:-8px;right:-7px;
    font:800 9.5px var(--face-name);color:var(--on-accent);background:var(--fam,var(--ink-soft));
    border-radius:99px;padding:2px 6px;box-shadow:0 1px 3px rgba(var(--shade),.3);
  }
  .chip.board.folded{border-style:solid}
  .chip.board.folded:not([data-fold=""])::after{content:attr(data-fold)}
  @keyframes ripple{
    from{transform:translate(-50%,-50%) scale(.25);opacity:.75}
    to{transform:translate(-50%,-50%) scale(2.6);opacity:0}
  }
  .ring{
    position:absolute;width:96px;height:96px;border-radius:99px;pointer-events:none;
    border:2.5px solid var(--discovery);animation:ripple .6s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes expel{
    0%{transform:translate(-50%,-50%) scale(.4);opacity:0}
    22%{transform:translate(-50%,-50%) scale(1.15);opacity:1}
    100%{transform:translate(calc(-50% + 46px),calc(-50% - 62px)) scale(.7);opacity:0}
  }
  .drop{
    position:absolute;width:30px;height:30px;pointer-events:none;z-index:5;
    animation:expel 1.05s cubic-bezier(.25,.6,.4,1) forwards;
  }
  .drop .art{width:100%;height:100%;display:block;
             filter:drop-shadow(0 2px 6px rgba(var(--shade),.55))}
  @keyframes pulse{0%,100%{transform:scale(1)}45%{transform:scale(1.07)}}
  .chip.board.pulse{animation:pulse .38s ease}
  #waiting{color:var(--teal);font-weight:700}
  .chip.live{border-color:var(--avocado);box-shadow:0 0 0 2px rgba(107,142,78,.13)}
  /* With a card in your hand: how many cards on the bench it will make
     something new with. A number, never a partner. */
  .chip.board.haslive::before{
    content:attr(data-live);position:absolute;left:-7px;top:-7px;
    font:400 8px/15px var(--face-data);letter-spacing:.04em;
    min-width:15px;height:15px;padding:0 4px;text-align:center;
    color:var(--on-accent);background:var(--discovery);border-radius:99px;
    font-variant-numeric:tabular-nums;
    box-shadow:0 2px 6px rgba(var(--shade),.5);
  }

  /* How many undiscovered recipes this thing still leads to. */
  .chip .cnt{
    position:absolute;top:-6px;right:-6px;
    font-style:normal;font:400 8px/14px var(--face-data);color:var(--on-accent);
    background:var(--avocado);border-radius:99px;min-width:14px;height:14px;
    text-align:center;padding:0 4px;font-variant-numeric:tabular-nums;
  }
  .chip.board{
    position:absolute;z-index:2;transition:box-shadow .16s, transform .16s;
    box-shadow:0 2px 0 rgba(var(--shade),.09), 0 6px 14px -6px rgba(var(--shade),.28);
  }
  .chip.board:hover{transform:translateY(-1px);box-shadow:0 3px 0 rgba(var(--shade),.11), 0 10px 18px -8px rgba(var(--shade),.34)}
  .chip.drag{cursor:grabbing;z-index:99;transform:scale(1.09) rotate(-2deg);box-shadow:0 10px 22px rgba(var(--shade),.22)}
  .chip.target{
    border-color:var(--orange);background:color-mix(in srgb,var(--orange) 16%,var(--card));transform:scale(1.07);
    box-shadow:0 0 0 4px color-mix(in srgb,var(--orange) 18%,transparent), 0 8px 18px -6px rgba(var(--shade),.3);
  }
  @keyframes pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.16)}100%{transform:scale(1);opacity:1}}
  .chip.pop{animation:pop .32s cubic-bezier(.3,1.5,.5,1)}
  /* Catalogued. The accession number lands like a stamp — slightly askew,
     slightly too big, settling. It is the one moment the high-chroma colour
     is allowed out. */
  @keyframes stamp{
    0%{transform:scale(2.1) rotate(-7deg);opacity:0}
    45%{opacity:1}
    70%{transform:scale(.94) rotate(1.5deg)}
    100%{transform:scale(1) rotate(0);opacity:1}
  }
  .chip.board.minted .ac{
    animation:stamp .5s .22s cubic-bezier(.3,1.4,.5,1) backwards;
    color:var(--discovery);
  }
  .chip.board.minted .rl{background:var(--discovery)}
  @media (prefers-reduced-motion:reduce){ .chip.board.minted .ac{animation:none} }
  @keyframes nope{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .chip.nope{animation:nope .26s}
  /* A slower, gentler tremor than .nope's rejection shake — this one means
     "something is about to happen", not "that didn't work".
     translate/rotate as separate properties, not a transform shorthand, so the
     lean below and this tremor compose instead of overwriting each other. */
  @keyframes warn{0%,100%{rotate:0deg}25%{rotate:-2.4deg}75%{rotate:2.4deg}}
  .chip.board.warn{
    animation:warn .42s ease-in-out infinite;
    box-shadow:0 0 0 2.5px color-mix(in srgb,var(--discovery) 60%,transparent);
  }
  @media (prefers-reduced-motion:reduce){ .chip.board.warn{animation:none} }

  /* ── the dial ─────────────────────────────────────────────────────────
     A thing held on a tool gets hot, and hot things glow the colour they
     really glow at that temperature — dull red about 500°C, orange near
     1,000, white past 2,500. The reading sits above the card so the number,
     not a vague bar, is what you are steering by. */
  .chip.board.heating{
    box-shadow:0 0 0 2px var(--glow,transparent),
               0 0 calc(14px * var(--glow-a,0)) calc(5px * var(--glow-a,0)) var(--glow,transparent);
    border-color:color-mix(in srgb,var(--glow,var(--line)) 70%,var(--line));
  }
  .chip.board.heating .art{
    filter:drop-shadow(0 0 calc(9px * var(--glow-a,0)) var(--glow,transparent));
  }
  .chip.board.heating::before{
    content:attr(data-temp);position:absolute;left:50%;top:-22px;transform:translateX(-50%);
    font:700 10.5px/1 var(--face-data);white-space:nowrap;letter-spacing:.03em;
    padding:4px 7px;border-radius:6px;background:var(--ink);color:var(--cream);
    font-variant-numeric:tabular-nums;z-index:6;
  }
  .chip.board.heating.willreact::before{background:var(--discovery);color:var(--on-accent)}
  @keyframes quake{
    0%,100%{transform:translate(0,0)} 20%{transform:translate(-3px,2px)}
    45%{transform:translate(3px,-2px)} 70%{transform:translate(-2px,-1px)}
  }
  #board.quake{animation:quake .3s ease-in-out}
  @media (prefers-reduced-motion:reduce){ #board.quake{animation:none} }
  /* The flash when it actually happens, sized and coloured by how hot. */
  .ring.hot{
    border-color:var(--hot,var(--discovery));border-width:3px;
    animation:ripple .62s cubic-bezier(.2,.7,.3,1) forwards;
    scale:var(--big,1);
  }
  /* The tool fills as the dial climbs. */
  .verb.charging{
    background:linear-gradient(to top, color-mix(in srgb,var(--brick) 40%,transparent) var(--charge,0%),
               transparent var(--charge,0%));
    border-color:var(--brick);
  }

  /* Attraction and resistance. The lean itself carries the information; the
     ring is a second channel so it still reads with reduced motion on. */
  .chip.board.pulled,.chip.board.resists{
    translate:var(--px,0) var(--py,0);
    transition:translate .12s ease-out, box-shadow .12s ease-out;
  }
  .chip.board.pulled{
    box-shadow:0 0 0 2px color-mix(in srgb,var(--avocado) 55%,transparent),
               0 4px 14px -4px color-mix(in srgb,var(--avocado) 45%,transparent);
  }
  .chip.board.resists{
    box-shadow:0 0 0 2px color-mix(in srgb,var(--brick) 40%,transparent);
    opacity:.72;
  }
  @media (prefers-reduced-motion:reduce){
    .chip.board.pulled,.chip.board.resists{translate:none}
  }
  #tray{
    flex:none;display:flex;gap:9px;justify-content:center;padding:11px;
    border-top:2px solid var(--line);background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(8px);
  }
  .verb{
    display:flex;flex-direction:column;align-items:center;gap:4px;width:84px;padding:10px 6px;
    background:var(--card);border:2px dashed var(--line);border-radius:18px;
    font:700 13px var(--face-name);color:var(--ink-soft);
  }
  /* .e{font-size} is legacy — verbs draw an SVG glyph now, sized by the --g
     custom property glyph() sets inline, not by font-size. Widening the whole
     button and bumping that --g value (below) is what actually grows it. */
  .verb .e{font-size:21px;line-height:1.1}
  .verb.locked{opacity:.42;cursor:help}
  .verb.locked .e{filter:grayscale(1)}
  .verb .lk{position:absolute;top:2px;right:5px;font-size:9px;font-style:normal;opacity:.9}
  .verb{position:relative}
  .prow.loop{opacity:.55}
  @keyframes leave{to{transform:scale(.55);opacity:0}}
  .chip.board.leaving{animation:leave .16s ease forwards;pointer-events:none}
  .verb.target{border-color:var(--teal);border-style:solid;background:#E8F4F3;color:var(--teal);transform:scale(1.07)}
  /* discovery card — one discreet line; a click opens it and keeps it */
  #card{
    position:fixed;left:14px;bottom:82px;width:min(300px,calc(100vw - 28px));z-index:150;
    opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .2s;
  }
  #card.on{opacity:1;transform:none;pointer-events:auto}
  .inner{
    position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:13px;
    box-shadow:0 5px 16px rgba(var(--shade),.13);overflow:hidden;cursor:pointer;
    border-left:4px solid var(--fam,var(--orange));
  }
  .line{display:flex;align-items:center;gap:8px;padding:9px 11px}
  .line .big{font-size:19px;line-height:1;flex:none}
  .line b{font:700 14px var(--face-name);flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .line .chev{font-size:9px;color:#B9A88C;flex:none;transition:transform .2s}
  #card:not(.mini) .line .chev{transform:rotate(180deg)}
  .dot{width:7px;height:7px;border-radius:99px;flex:none}
  .dot.workshop{background:var(--avocado)} .dot.folklore{background:#9B6BC4}
  .more{
    max-height:0;overflow:hidden;transition:max-height .24s ease;
    padding:0 11px;
  }
  #card:not(.mini) .more{max-height:260px;padding-bottom:10px}
  .why{font-size:12.5px;line-height:1.5;color:var(--ink-soft);margin:0 0 8px}
  .fact{display:none}
  .cfoot{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .inner button.ghost{
    background:var(--surface);color:var(--ink-soft);border:1.5px solid var(--line);border-radius:99px;
    padding:4px 10px;font:600 11px var(--face-name);cursor:pointer;
  }
  @keyframes drain{from{width:100%}to{width:0}}
  .timer{position:absolute;left:0;bottom:0;height:2px;background:var(--discovery);
    opacity:.45;animation:drain 6s linear forwards}
  #card:not(.mini) .timer{display:none}
  .cardrow{display:flex;gap:8px;justify-content:center;align-items:center}

  #toast{
    position:fixed;left:50%;bottom:104px;transform:translateX(-50%);z-index:150;
    background:var(--ink);color:var(--cream);font:600 13px var(--face-name);
    padding:9px 17px;border-radius:99px;opacity:0;transition:opacity .25s;pointer-events:none;
  }
  #toast.on{opacity:.95}
  .cardrow{display:flex;gap:8px;justify-content:center;align-items:center}
  .inner button.ghost{background:var(--surface);color:var(--ink-soft);border-color:var(--line);font-size:13px;padding:9px 15px}

  /* sheet: codex + provenance */
  #sheet{
    position:fixed;inset:0;display:none;z-index:180;background:rgba(var(--shade),.42);
    backdrop-filter:blur(3px);padding:22px;
  }
  #sheet.on{display:grid;place-items:center}
  .sheetbox{
    width:min(480px,100%);max-height:82vh;display:flex;flex-direction:column;
    background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
    box-shadow:0 22px 50px -18px rgba(var(--shade),.7);animation:pop .3s cubic-bezier(.3,1.5,.5,1);
  }
  .sheethead{
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none;
    padding:13px 15px;border-bottom:2px solid var(--line);background:color-mix(in srgb,var(--surface) 82%,transparent);
  }
  .sheethead b{font:800 14px var(--face-name)}
  #sheetBody{overflow-y:auto;padding:12px 13px}
  #sheetBody h2{
    font:700 10.5px/1 var(--face-name);letter-spacing:.9px;text-transform:uppercase;
    color:var(--ink-soft);margin:14px 2px 8px;
  }
  /* Settings groups three or four related rows under one named block, so the
     panel reads as a handful of decisions instead of one long scroll. */
  .setgroup{padding:14px 0 4px;border-top:1.5px solid var(--line)}
  .setgroup:first-child{padding-top:2px;border-top:none}
  .setgroup h3{
    font:800 13px var(--face-name);color:var(--ink);margin:0 2px 2px;
  }
  .setgroup h2{margin-top:10px}
  .search{
    width:100%;font:600 14px var(--face-name);color:var(--ink);
    padding:10px 13px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);
  }
  .search:focus{outline:2px solid var(--orange);outline-offset:-1px}
  .none{color:var(--ink-soft);font-size:13px;text-align:center;padding:18px}
  .phead{
    display:flex;align-items:center;gap:10px;text-align:left;flex-wrap:wrap;
    padding:0 0 9px;border-bottom:1px solid var(--line);margin-bottom:9px;
  }
  .phead .big{font-size:26px;line-height:1;flex:none}
  .phead h3{font:800 16px var(--face-name);margin:0;flex:1;min-width:0}
  .pnums{font-size:11.5px;color:var(--ink-soft);width:100%}
  .pnums b{color:var(--brick);font-size:12.5px}
  .pfrom{font-size:11px;color:var(--ink-soft);width:100%;margin-top:2px;font-style:italic}
  /* provenance tree — real connectors, drawn with borders on the list */
  ul.tree,ul.tree ul{list-style:none;margin:0;padding:0;font-size:13px}
  ul.tree ul{margin-left:8px;padding-left:10px;position:relative}
  ul.tree ul::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--line);
  }
  ul.tree li{position:relative}
  ul.tree ul > li::before{
    content:'';position:absolute;left:-10px;top:11px;width:8px;height:1.5px;background:var(--line);
  }
  /* mask the trunk below the final child so the elbow ends cleanly */
  ul.tree ul > li:last-child::after{
    content:'';position:absolute;left:-11px;top:12px;bottom:0;width:2.5px;background:var(--card);
  }
  .prow{
    display:flex;align-items:center;gap:5px;padding:2px 6px;margin:0;
    border-radius:6px;background:none;font-size:12.5px;
  }
  .prow:hover{background:rgba(255,255,255,.6)}
  .prow.root{background:color-mix(in srgb,var(--orange) 14%,var(--card));font-weight:800;box-shadow:inset 0 0 0 2px var(--orange)}
  .prow.has{cursor:pointer}
  .prow.has:hover{background:var(--surface)}
  .prow .tw{
    font-size:9px;color:var(--ink-soft);width:11px;flex:none;text-align:center;line-height:1;
  }
  .prow .tw.dot{color:#C9B99C}
  .prow .more{
    font:800 9.5px var(--face-name);color:var(--on-accent);background:var(--c-craft-bs);
    border-radius:99px;padding:2px 7px;flex:none;
  }
  ul.tree ul.fold{display:none}
  .prow .pe{font-size:13px}
  .prow .pn{flex:1;min-width:0}
  .prow .pv{
    font-size:10px;font-weight:700;color:var(--teal);background:#E8F4F3;
    padding:2px 7px;border-radius:99px;flex:none;
  }

  /* ---- matter taxonomy ----------------------------------------------
     Shape carries meaning, so the three kinds of thing are never confusable:
       pill     = a thing in the world   (game element)
       hexagon  = a molecule             (compound)
       tile     = an atom                (periodic-table cell)
       halo     = energy, not matter     (particle)
     Colour then carries the sub-category within each kind. ------------- */
  :root{
    /* Periodic-table groups. Same discipline as everything else: these are
       Munsell chips, not a third hand-picked palette. */
    --alkali:var(--c-fire-bs);       --alkaline:var(--c-grain-bs);
    --transition:var(--c-dish-bs);   --post:var(--c-craft-bs);
    --metalloid:var(--c-plant-bs);   --nonmetal:var(--c-molecule-bs);
    --halogen:var(--c-water-bs);     --noble:var(--c-living-bs);
    --lanthanide:#B5657F; --actinide:#7A5C8E;
    /* The eight shelf families are a grouping, not a second palette. Their
       colours come from the same Munsell chips the drawings use, so the shelf
       heading and the card in it can never disagree about what a thing is. */
    --fam-earth:var(--c-mineral-bs);   --fam-water:var(--c-water-bs);
    --fam-fire:var(--c-fire-bs);       --fam-plant:var(--c-plant-bs);
    --fam-animal:var(--c-living-bs);   --fam-microbe:var(--c-molecule-bs);
    --fam-food:var(--c-grain-bs);      --fam-myth:var(--c-craft-bs);
    /* Metals share the mineral hue page (they come out of rock) and wild
       animals share living (they are animals) — but each needs its own
       token, or the shelf heading for that family renders with --fam unset. */
    --fam-metal:var(--c-mineral-hi);   --fam-wild:var(--c-living-lo);
  }
  .atom{
    display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
    width:26px;height:26px;border-radius:6px;color:var(--on-accent);flex:none;
    box-shadow:inset 0 -2px 0 rgba(0,0,0,.16);
  }
  .atom .sym{font:800 10px/1 var(--face-name);letter-spacing:-.2px}
  .atom .z{font:700 6px/1 var(--face-name);opacity:.75;margin-top:1px}
  .atom.alkali{background:var(--alkali)} .atom.alkaline{background:var(--alkaline)}
  .atom.transition{background:var(--transition)} .atom.post{background:var(--post)}
  .atom.metalloid{background:var(--metalloid)} .atom.nonmetal{background:var(--nonmetal)}
  .atom.halogen{background:var(--halogen)} .atom.noble{background:var(--noble)}
  .atom.lanthanide{background:var(--lanthanide)} .atom.actinide{background:var(--actinide)}

  .hex{
    display:inline-flex;align-items:center;justify-content:center;flex:none;
    min-width:74px;padding:9px 13px;background:#EFE6F5;color:#5B3E7A;
    font:700 11.5px var(--face-name);text-align:center;line-height:1.15;
    clip-path:polygon(14% 0,86% 0,100% 50%,86% 100%,14% 100%,0 50%);
  }
  .particle{
    display:inline-flex;align-items:center;gap:5px;flex:none;padding:6px 14px;
    border-radius:99px;font:700 11.5px var(--face-name);color:#8A6A12;
    background:radial-gradient(circle,#FFF0C4 0%,#FDE39B 70%,rgba(253,227,155,0) 100%);
  }

  /* game-element chips tinted by family */
  .chip[data-fam]{border-color:color-mix(in srgb,var(--fam) 46%,var(--line))}
  .chip[data-fam] .e{filter:saturate(1.05)}
  .chip.board[data-fam]{
    border-color:var(--fam);
    box-shadow:0 3px 0 color-mix(in srgb,var(--fam) 26%,rgba(var(--shade),.1));
  }
  .fam-earth{--fam:var(--fam-earth)}   .fam-water{--fam:var(--fam-water)}
  .fam-fire{--fam:var(--fam-fire)}     .fam-plant{--fam:var(--fam-plant)}
  .fam-animal{--fam:var(--fam-animal)} .fam-microbe{--fam:var(--fam-microbe)}
  .fam-food{--fam:var(--fam-food)}     .fam-myth{--fam:var(--fam-myth)}
  .fam-metal{--fam:var(--fam-metal)}   .fam-wild{--fam:var(--fam-wild)}

  /* settings */
  .setrow{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
  .setrow button{
    display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;
    padding:9px 12px;border-radius:11px;background:var(--surface);border:1.5px solid var(--line);cursor:pointer;
  }
  .setrow button b{font:700 13.5px var(--face-name);color:var(--ink)}
  .setrow button i{font-style:normal;font-size:11.5px;color:var(--ink-soft)}
  .setrow button.on{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 12%,var(--card))}
  .setrow button.on b{color:var(--brick)}

  /* depth: hide the technical layer for younger readers */
  :root[data-depth="kid"] .formula,
  :root[data-depth="kid"] .molbox,
  :root[data-depth="kid"] ul.tree.bed .cat,
  :root[data-depth="kid"] .atom .z,
  :root[data-depth="kid"] .pnums,
  :root[data-depth="kid"] .stepbody .src{display:none}
  :root[data-depth="kid"] .why{font-size:14px;line-height:1.55}
  :root[data-depth="kid"] .stepbody p{font-size:13.5px}
  :root[data-depth="scientist"] .pfrom{display:block}

  /* tone: straight keeps everything, just stops shouting */
  :root[data-tone="straight"] .ring,
  :root[data-tone="straight"] .drop{display:none}
  :root[data-tone="straight"] .chip.folk{background:var(--card);border-color:var(--line)}
  #settings{font-size:14px;line-height:1}
  /* the chain as citation cards */
  .modes{display:flex;gap:5px;margin:0 0 10px}
  .modes button{
    font:600 11.5px var(--face-name);padding:5px 11px;border-radius:99px;cursor:pointer;
    background:var(--surface);border:1.5px solid var(--line);color:var(--ink-soft);
  }
  .modes button.on{background:var(--ink);border-color:var(--ink);color:var(--cream)}
  .steps{display:flex;flex-direction:column;gap:7px}
  .step{display:flex;gap:9px;align-items:flex-start}
  .stepno{
    font:800 10px/1 var(--face-name);color:var(--ink-soft);background:var(--card);
    border:1.5px solid var(--line);border-radius:99px;
    min-width:20px;height:20px;line-height:17px;text-align:center;flex:none;margin-top:7px;
  }
  .stepbody{
    flex:1;min-width:0;background:var(--surface);border:1.5px solid var(--line);
    border-radius:11px;padding:8px 10px;
  }
  .stepgest{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin-bottom:5px}
  .stepgest .g{
    display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:99px;
    background:var(--card);border:1px solid var(--line);font:600 11.5px var(--face-name);cursor:pointer;
  }
  .stepgest em{font-style:normal;color:var(--ink-soft);font:700 10.5px var(--face-name)}
  .stepbody p{margin:0 0 5px;font-size:12.5px;line-height:1.5;color:var(--ink-soft)}
  .stepbody .src{margin:0;font-size:10.5px}
  /* guess before the reveal */
  .guess{text-align:center;padding:14px 6px 8px}
  .guess .big{font-size:44px;line-height:1;margin-bottom:8px}
  .guess h3{font:800 18px var(--face-name);margin:0 0 8px}
  .guess p{font-size:13.5px;color:var(--ink-soft);margin:0 auto 16px;max-width:34ch;line-height:1.5}
  .opts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
  .opts button{
    font:800 17px var(--face-name);min-width:66px;padding:11px 16px;border-radius:13px;
    background:var(--surface);border:2px solid var(--line);cursor:pointer;
  }
  .opts button:hover{border-color:var(--orange);background:color-mix(in srgb,var(--orange) 12%,var(--card))}
  .guess .skip{
    background:none;border:none;color:var(--ink-soft);font:600 12px var(--face-name);
    text-decoration:underline;cursor:pointer;padding:4px;
  }
  .verdict{
    width:100%;margin-top:6px;font:700 12px var(--face-name);padding:5px 9px;border-radius:8px;
  }
  .verdict.hit{color:#41652A;background:#E6F0DC}
  .verdict.miss{color:#8A6A12;background:#FDF0CE}
  /* index entry */
  .ent{
    display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:6px 8px;margin-bottom:4px;
    background:var(--surface);border:1.5px solid var(--line);border-radius:10px;font-size:12.5px;
  }
  .ent .g{
    display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:99px;
    background:var(--card);border:1px solid var(--line);cursor:pointer;font-weight:600;
  }
  .ent .g:hover{border-color:var(--orange)}
  .ent em{font-style:normal;color:var(--ink-soft);font-size:11px;font-weight:700}
  .ent .arw{color:#C6B69C;margin:0 1px}
  .ent .out{background:#FFF3E9;border-color:#F0D6C0}
  .hint2{font-size:11.5px;color:var(--ink-soft);font-style:italic;margin:4px 2px 0}
  .hintbox{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:10px}
  .hintbox p{margin:0 0 7px;font-size:13.5px;line-height:1.5;color:var(--ink-soft)}
  .hintbox p:last-child{margin-bottom:0}
  .hintbox b{color:var(--ink)}
  .path{display:flex;flex-direction:column;gap:4px}
  .pstep{
    display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;
    background:var(--surface);border:1.5px solid var(--line);border-radius:10px;
  }
  .pstep:hover{border-color:var(--orange)}
  .pstep.last{background:color-mix(in srgb,var(--orange) 12%,var(--card));border-color:var(--orange)}
  .pstep .pn2{
    font:800 9.5px var(--face-name);color:var(--ink-soft);background:var(--card);
    border:1.5px solid var(--line);border-radius:99px;
    min-width:19px;height:19px;line-height:16px;text-align:center;flex:none;
  }
  .pstep .g{font:600 13px var(--face-name);flex:1;min-width:0}
  .pstep i{font-style:normal;font-size:10.5px;color:var(--ink-soft);flex:none}
  .jump{
    cursor:pointer;border-bottom:1.5px dotted var(--orange);color:var(--ink);
  }
  .hintbox .answer{
    font:700 15px var(--face-name);color:var(--ink);text-align:center;
    background:color-mix(in srgb,var(--orange) 10%,var(--card));border-radius:9px;padding:9px 6px;
  }
  aside h2.locked,#sheetBody h2.locked{color:var(--ink-soft);opacity:.6}
  .chip.locked{opacity:.5;border-style:dashed;cursor:pointer}
  .chip.locked .q{
    font-style:normal;font:800 9.5px var(--face-name);color:var(--on-accent);background:var(--c-craft-bs);
    border-radius:99px;min-width:14px;height:14px;line-height:14px;text-align:center;margin-left:3px;
  }
  /* molecules */
  .molbox{display:flex;justify-content:center;padding:6px 0 10px}
  svg.mol .bond{stroke:#5A4A38;stroke-width:3.4;stroke-linecap:round}
  svg.mol .ball{stroke:#3B2E20;stroke-width:1.6}
  svg.mol .lbl{text-anchor:middle;dominant-baseline:central;font-weight:800;
    font-family:var(--face-name);pointer-events:none}
  .formula{
    text-align:center;font:800 17px var(--face-name);color:var(--ink);margin-bottom:10px;
  }
  .formula sub{font-size:.66em;vertical-align:-.25em}
  .aagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:6px}
  .aa{
    display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;min-width:0;
    background:var(--surface);border:1.5px solid var(--line);border-radius:11px;overflow:hidden;
  }
  .aa:hover{border-color:var(--metalloid)}
  .aa b{
    font:800 10px var(--face-name);color:var(--on-accent);background:var(--nonmetal);
    border-radius:5px;min-width:18px;height:18px;line-height:18px;text-align:center;flex:none;
  }
  .aatx{display:flex;flex-direction:column;min-width:0;line-height:1.25}
  .aatx em{
    font:600 11.5px var(--face-name);font-style:normal;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .aatx i{
    font-style:normal;font:600 9.5px var(--face-name);color:var(--ink-soft);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  /* periodic table */
  .ptab{display:grid;grid-template-columns:repeat(18,1fr);gap:2px;margin:8px 0}
  .ptab .atom{width:100%;height:auto;aspect-ratio:1;border-radius:4px;min-width:0}
  .ptab .atom .sym{font-size:9px}
  .ptab .atom .z{display:none}
  .ptab .atom.off{opacity:.24}
  .ptab .gap{grid-column:span var(--n)}
  .legend{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 4px}
  .legend span{
    font:700 9.5px var(--face-name);color:var(--on-accent);padding:3px 8px;border-radius:99px;
  }

  /* bedrock: the substrate, deliberately quieter than the game above it */
  .bedhead{
    text-align:center;font:700 9px var(--face-name);letter-spacing:1.2px;text-transform:uppercase;
    color:#A8977E;margin:14px 0 8px;position:relative;
  }
  .bedhead::before,.bedhead::after{
    content:'';position:absolute;top:50%;width:26%;height:2px;background:var(--line);
  }
  .bedhead::before{left:2%} .bedhead::after{right:2%}
  .bedgroup{margin-bottom:8px;opacity:.72}
  .bedof{font:700 12px var(--face-name);color:var(--ink-soft);margin-bottom:4px}
  ul.tree.bed .brow{
    display:flex;align-items:center;gap:5px;padding:1px 5px;margin:0;
    font-size:11.5px;color:var(--ink-soft);background:none;
  }
  .shelfbar{display:flex;gap:5px;align-items:center;margin:0 2px 8px}
  .search.sm{padding:7px 10px;font-size:12.5px;border-radius:9px}
  .shelfbar button{
    width:26px;height:26px;padding:0;border-radius:8px;font-size:14px;line-height:1;flex:none;
  }
  aside h2{
    display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none;
    padding:3px 4px;border-radius:7px;white-space:nowrap;overflow:hidden;
  }
  aside h2.ready{
    color:var(--avocado);cursor:default;letter-spacing:1px;
    border-bottom:1.5px solid color-mix(in srgb,var(--avocado) 35%,transparent);
    padding-bottom:5px;margin-bottom:8px;
  }
  aside h2.ready i{background:var(--avocado)}
  aside h2.ready em{color:var(--avocado)}
  aside h2:hover{background:rgba(255,255,255,.55)}
  aside h2 em{font-style:normal;color:#BCAC93;font-weight:700}
  aside h2 .lv{
    font:800 9px var(--face-name);color:var(--on-accent);background:var(--avocado);
    border-radius:99px;padding:2px 6px;margin-left:auto;
  }
  aside h2 .cv{font-size:8px;color:#BCAC93;margin-left:auto}
  aside h2 .lv + .cv{margin-left:4px}
  aside h2 i{
    display:inline-block;width:8px;height:8px;border-radius:99px;margin-right:6px;
    background:var(--fam,var(--line));vertical-align:middle;
  }
  ul.tree.bed .brow{gap:8px}
  ul.tree.bed .brow .cat{
    font-style:normal;font:700 8.5px var(--face-name);text-transform:uppercase;
    letter-spacing:.6px;color:var(--ink-soft);margin-left:auto;
  }
  ul.tree.bed .brow b{
    font-size:9.5px;font-weight:800;color:var(--on-accent);background:#A8977E;border-radius:5px;
    min-width:19px;height:15px;line-height:15px;text-align:center;
  }
  .bedsum{
    text-align:center;font:800 12.5px var(--face-name);color:var(--brick);
    padding:9px;border:1.5px dashed var(--line);border-radius:11px;margin-top:5px;
  }
  .bedsum .syms{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:9px}
  .bedsum .syms i{
    font-style:normal;font:800 11px var(--face-name);color:var(--ink);
    background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:3px 7px;
  }

  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
  @media(max-width:720px){
    header{gap:6px;padding:9px 10px;flex-wrap:nowrap;overflow:hidden}
    h1{font-size:15px;flex:none;white-space:nowrap}
    /* Reset moves into Settings. It is destructive, and it was being clipped
       off the end of the header at 375px. */
    #reset{display:none}
    .mark svg{width:22px;height:22px}
    .goal{display:none}
    #live{display:none}
    header button,.count{padding:6px 10px;font-size:12px;white-space:nowrap;flex:none}
    aside{
      position:fixed;top:50px;bottom:62px;right:0;width:min(250px,78vw);z-index:120;
      transform:translateX(100%);transition:transform .22s;background:var(--card);
      border-left:2px solid var(--ink);box-shadow:-8px 0 24px rgba(var(--shade),.14);
    }
    aside.open{transform:none}
    #tray{gap:4px;padding:7px 4px}
    /* Icon and label both grow to use more of the button, even though the
       button itself is still squeezed to fit six across a phone width. */
    .verb{width:calc((100vw - 40px)/6);min-width:0;font-size:10.5px;padding:6px 1px;gap:2px}
    /* A 94px card is a quarter of the width of a 375px phone. Smaller here, and
       cardSize() measures a real one, so placement follows without being told. */
    .chip.board{--cw:80px}
    .chip.board .art{width:50px;height:50px}
    .chip.board .n{font-size:9px}
    .chip.board .ac{font-size:7px;letter-spacing:.04em}
    #card{left:8px;right:8px;bottom:74px;width:auto}
    /* The discovery card spans the width on a phone, so the zoom stack has to
       get out of its way rather than sit on top of it. */
    body:has(#card.on) #zoom{bottom:auto;top:58px}
    #sheet{padding:10px}
    .sheetbox{max-height:92vh}
  }
  /* ── the ladder ───────────────────────────────────────────────────── */
  .ladderlede{font-size:13.5px;color:var(--ink-soft);margin:2px 2px 14px;line-height:1.55}
  .ladder{display:flex;flex-direction:column;gap:0;border-left:1px solid var(--line);
          margin-left:6px;padding-left:0}
  .rung{position:relative;padding:10px 0 12px 74px;border-top:1px solid var(--line)}
  .rung:first-child{border-top:0}
  .rung .mag{
    position:absolute;left:8px;top:11px;font:400 10.5px/1 var(--face-data);
    color:var(--ink);letter-spacing:.04em;font-variant-numeric:tabular-nums;
  }
  .rung .rungname{
    display:block;font:400 10px/1 var(--face-data);letter-spacing:.09em;
    text-transform:uppercase;color:var(--ink-soft);margin:0 0 8px;
  }
  /* An empty decade is information, not a gap to be tidied away. */
  .rung.empty{padding:7px 0 7px 74px;opacity:.42}
  .rung.empty i{font-style:normal;font:400 10px/1 var(--face-data);
                letter-spacing:.06em;color:var(--ink-soft)}
  .rung.empty .mag{top:8px}
  /* Denser than the shelf: the ladder is for seeing the whole span at once. */
  .ladder .chip.lad{--cw:62px;padding:5px 3px 4px}
  .ladder .chip.lad .art{width:30px;height:30px}
  .ladder .chip.lad .n{font-size:7.6px;letter-spacing:.03em;min-height:2.2em}
  .ladder .chip.lad .rl{width:16px;margin:3px auto 2px}
  .ladder .chip.lad .ac{display:none}
  .ladder .shelf{gap:4px}
  /* On a phone the label is wider than the gap between two cards, so let it
     wrap and centre rather than run off the edge. */
  @media(max-width:520px){
    #introSay{white-space:normal;text-align:center;width:min(260px,calc(100vw - 28px));
              left:50%!important}
  }
  @media(max-width:400px){ h1{display:none} }
  @media(min-width:721px){ #shelfToggle{display:none} }
  #shelfToggle{width:34px;padding:6px 0;font-size:16px;line-height:1;display:flex;align-items:center;justify-content:center}
  /* A destructive control should not look like the others. */
  .danger{border-color:var(--brick)!important;color:var(--brick)!important}
</style>

<header>
  <a class="mark" href="#" title="Loam">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <rect width="120" height="120" rx="26" fill="#221C14"/>
      <g stroke="#5C4B38" stroke-width="3" fill="none" stroke-linecap="round">
        <path d="M28 34 Q44 54 56 66"/><path d="M50 26 Q54 48 58 64"/>
        <path d="M70 26 Q66 48 62 64"/><path d="M92 34 Q76 54 64 66"/>
      </g>
      <circle cx="28" cy="34" r="8" fill="#9C8A74"/><circle cx="50" cy="26" r="8" fill="#4E8CB8"/>
      <circle cx="70" cy="26" r="8" fill="#E0A526"/><circle cx="92" cy="34" r="8" fill="#6B8E4E"/>
      <rect x="42" y="66" width="36" height="30" rx="9" fill="#E2703A"/>
    </svg>
    <h1>Loam</h1>
  </a>
  <button class="count" id="count" title="Open your codex"></button>
  <div class="goal" id="goal"></div>
  <div class="spacer"></div>
  <div class="count" id="waiting" style="display:none"></div>
  <div class="count" id="live" style="color:var(--ink-soft);font-weight:600"></div>
  <button id="nudge">Nudge</button>
  <button id="shelfToggle" title="Shelf">▤</button>
  <button id="settings" title="Settings"><span class="gl" style="--g:15px"><svg class="art" viewBox="0 0 60 60" data-cat="craft" aria-hidden="true"><path d="M43 30 L51 30" fill="none" stroke="var(--ik)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M39.19 39.19 L44.85 44.85" fill="none" stroke="var(--ik)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 43 L30 51" fill="none" stroke="var(--ik)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.81 39.19 L15.15 44.85" fill="none" stroke="var(--ik)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 30 L9 30" fill="none" stroke="var(--ik)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M20.81 20.81 L15.15 15.15" fill="none" stroke="var(--ik)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M30 17 L30 9" fill="none" stroke="var(--ik)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M39.19 20.81 L44.85 15.15" fill="none" stroke="var(--ik)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="30" cy="30" r="15" fill="var(--ik)"/><circle cx="30" cy="30" r="6.5" fill="var(--ground)"/></svg></span></button>
  <button id="reset">Reset</button>
</header>

<main>
  <div id="board">
    <div id="world">
      <svg id="links"></svg>
    </div>
    <div id="zoom">
      <button data-z="in" title="Zoom in">+</button><button data-z="out" title="Zoom out">−</button>
      <button data-z="fit" title="Fit everything">⤢</button><button data-z="tidy" title="Tidy the bench"><span class="gl" style="--g:15px"><svg class="art" viewBox="0 0 60 60" data-cat="craft" aria-hidden="true"><path d="M12 20 L48 20" fill="none" stroke="var(--ik)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 30 L48 30" fill="none" stroke="var(--ik)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 40 L40 40" fill="none" stroke="var(--ik)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>
    </div>
    <!-- Not a modal. A curator's pencil note on the tray: it points at two real
         cards, it never covers anything, and it rubs itself out the moment you
         make something. -->
    <div id="intro" aria-live="polite">
      <svg id="introArc" aria-hidden="true"><path/></svg>
      <p id="introSay"></p>
    </div>
  </div>

ts at 3,422°C — the highest melting point of any metal, which is why light bulbs used it.","terminal":true},{"id":"molybdenum","name":"Molybdenum","emoji":"⚗️","shelf":"workshop","tags":["metal"],"fact":"Its name is just the Greek word for lead, because for centuries nobody could tell the two ores apart.","terminal":true},{"id":"vanadium","name":"Vanadium","emoji":"⚗️","shelf":"workshop","tags":["metal"],"fact":"Named for a Norse goddess because its compounds are so colourful. Nine tenths of it is scraped out of slag.","terminal":true},{"id":"cadmium","name":"Cadmium","emoji":"⚗️","shelf":"workshop","tags":["metal"],"fact":"Boils at 767°C, cooler than zinc does — which is exactly how it gets separated from the zinc it hides in.","terminal":true},{"id":"palladium","name":"Palladium","emoji":"⚗️","shelf":"workshop","tags":["metal"],"fact":"Over half of it is sitting in catalytic converters, turning car exhaust into something less poisonous.","terminal":true},{"id":"rhodium","name":"Rhodium","emoji":"⚗️","shelf":"workshop","tags":["metal"],"fact":"Named after a rose, for the colour of one of its salts. Under one part per billion of the crust.","terminal":true},{"id":"iridium","name":"Iridium","emoji":"⚗️","shelf":"workshop","tags":["metal"],"fact":"A thin iridium layer in the clay worldwide is the fingerprint of the asteroid that ended the dinosaurs.","terminal":true},{"id":"osmium","name":"Osmium","emoji":"⚗️","shelf":"workshop","tags":["metal"],"fact":"The densest element that occurs in nature — 22.59 g/cm³, about twice the density of lead.","terminal":true},{"id":"ruthenium","name":"Ruthenium","emoji":"⚗️","shelf":"workshop","tags":["metal"],"fact":"About 100 parts per trillion of the crust, and roughly 30 tonnes a year. Named, in Latin, for Russia.","terminal":true},{"id":"rhenium","name":"Rhenium","emoji":"⚗️","shelf":"workshop","tags":["metal"],"fact":"One part per billion of the crust, and no ore of its own — it is always somebody else's by-product.","terminal":true},{"id":"hafnium","name":"Hafnium","emoji":"⚗️","shelf":"workshop","tags":["metal"],"fact":"Chemically almost indistinguishable from zirconium, so it hid inside it until 1923 — then it got Copenhagen.","terminal":true},{"id":"zirconium","name":"Zirconium","emoji":"⚗️","shelf":"workshop","tags":["metal"],"fact":"Neutrons pass straight through it, which is why nuclear fuel is wrapped in zirconium and not in steel."},{"id":"tantalum","name":"Tantalum","emoji":"⚗️","shelf":"workshop","tags":["metal"],"fact":"Named for the man in the myth who stood in water he could never drink, tantalised for eternity."},{"id":"niobium","name":"Niobium","emoji":"⚗️","shelf":"workshop","tags":["metal"],"fact":"Named after Niobe, daughter of Tantalus, because for decades nobody could tell it from tantalum.","terminal":true},{"id":"scandium","name":"Scandium","emoji":"⚗️","shelf":"workshop","tags":["metal"],"fact":"Mendeleev left a gap in the table and described what belonged there. Ten years later, someone found it.","terminal":true},{"id":"yttrium","name":"Yttrium","emoji":"⚗️","shelf":"workshop","tags":["metal"],"fact":"One small Swedish quarry, Ytterby, ended up with four elements named after it. This is the first of them.","terminal":true},{"id":"pollucite","name":"Pollucite","emoji":"⚗️","shelf":"workshop","tags":["earth"],"fact":"A zeolite up to a quarter caesium by weight — most of the world's supply sits under one Canadian lake."},{"id":"monazite","name":"Monazite","emoji":"⚗️","shelf":"workshop","tags":["earth"],"fact":"Reddish phosphate sand, heavy enough to survive weathering and pile up on beaches. Full of rare earths."},{"id":"rare_earth","name":"Rare earth","emoji":"⚗️","shelf":"workshop","tags":["earth"],"fact":"The lanthanides as they actually come: a mixture, and famously hard to separate into its members."},{"id":"baryte","name":"Baryte","emoji":"⚗️","shelf":"workshop","tags":["earth"],"fact":"Barium sulfate, better known as heavy spar. Most of what's mined goes down oil wells as drilling mud."},{"id":"lithium","name":"Lithium","emoji":"⚗️","shelf":"workshop","tags":["metal"],"fact":"The least dense metal there is, and one of only three that float on water — while reacting with it."},{"id":"caesium","name":"Caesium","emoji":"⚗️","shelf":"workshop","tags":["metal"],"fact":"The second is defined as 9,192,631,770 cycles of one caesium transition. This metal is the clock."},{"id":"rubidium","name":"Rubidium","emoji":"⚗️","shelf":"workshop","tags":["metal"],"fact":"Named for the deep red lines in its spectrum. Parting it from caesium takes about 30 recrystallisations.","terminal":true},{"id":"beryllium","name":"Beryllium","emoji":"⚗️","shelf":"workshop","tags":["metal"],"fact":"Nearly transparent to X-rays, which is why the window on an X-ray tube is very often made of it.","terminal":true},{"id":"strontium","name":"Strontium","emoji":"⚗️","shelf":"workshop","tags":["metal"],"fact":"Named after a Scottish village, and it is what makes the red in fireworks.","terminal":true},{"id":"barium","name":"Barium","emoji":"⚗️","shelf":"workshop","tags":["metal"],"fact":"You drink it so your gut shows up on an X-ray — safe only because that one barium salt won't dissolve."},{"id":"radium","name":"Radium","emoji":"⚗️","shelf":"workshop","tags":["metal"],"fact":"Painted onto watch dials to make them glow, by women told to lick their brushes to a point. It killed them.","terminal":true},{"id":"thorium","name":"Thorium","emoji":"⚗️","shelf":"workshop","tags":["metal"],"fact":"Three times as common as uranium, and for a century most of what was mined went into gas lamp mantles.","terminal":true},{"id":"plutonium","name":"Plutonium","emoji":"⚗️","shelf":"workshop","tags":["metal"],"fact":"Not mined — made. Uranium-238 in a reactor swallows a neutron and, two beta decays later, is plutonium.","terminal":true},{"id":"polonium","name":"Polonium","emoji":"⚗️","shelf":"workshop","tags":["metal"],"fact":"Marie Curie found it first and named it for Poland. By mass it is 250,000 times more toxic than cyanide.","terminal":true},{"id":"cerium","name":"Cerium","emoji":"⚗️","shelf":"workshop","tags":["metal"],"fact":"As common in the crust as copper, and the one rare earth that will oxidise its own way out of the mix.","terminal":true},{"id":"lanthanum","name":"Lanthanum","emoji":"⚗️","shelf":"workshop","tags":["metal"],"fact":"Its name means 'to lie hidden' — it was found hiding inside what everyone took for pure cerium."},{"id":"neodymium","name":"Neodymium","emoji":"⚗️","shelf":"workshop","tags":["metal"],"fact":"Nd2Fe14B — the strongest permanent magnets known. The name just means 'new twin'.","terminal":true},{"id":"samarium","name":"Samarium","emoji":"⚗️","shelf":"workshop","tags":["metal"],"fact":"The first element ever named after a person — and you get it by boiling it off a bath of lanthanum.","terminal":true},{"id":"europium","name":"Europium","emoji":"⚗️","shelf":"workshop","tags":["metal"],"fact":"The red on old colour TV screens, and the glow in euro banknotes under UV. Also the softest lanthanide.","terminal":true},{"id":"gadolinium","name":"Gadolinium","emoji":"⚗️","shelf":"workshop","tags":["metal"],"fact":"Sticks to a magnet only below 20°C, and swallows neutrons better than any other stable nuclide.","terminal":true},{"id":"promethium","name":"Promethium","emoji":"⚗️","shelf":"workshop","tags":["metal"],"fact":"No stable isotope at all. About 560 grams exist in the entire crust, made by uranium quietly fissioning.","terminal":true},{"id":"noble_mix","name":"Krypton–Xenon Mix","emoji":"💨","shelf":"workshop","tags":["earth"],"fact":"What an air plant actually gives you: the two rarest stable gases, still mixed together."},{"id":"xenon","name":"Xenon","emoji":"💡","shelf":"workshop","tags":["earth"],"terminal":true,"fact":"In 1962 it formed a compound, and \"the noble gases do not react\" quietly stopped being true."},{"id":"bismuth","name":"Bismuth","emoji":"🌈","shelf":"workshop","tags":["metal"],"fact":"Decays with a half-life a billion times the age of the universe, so everyone just calls it stable."}],"recipes":[{"in":["stone"],"verb":"wait","out":"soil","why":"Rain, frost and lichen break stone into grains over centuries. Mix in dead plants and you have soil — roughly 45% mineral, 5% once-living.","src":"https://en.wikipedia.org/wiki/Soil_formation","verified":true},{"in":["stone"],"verb":"crush","out":"sand","why":"Sand is only rock ground small: grains between 0.06 and 2 mm. Most of it is quartz, because quartz outlasts everything else.","src":"https://en.wikipedia.org/wiki/Sand","verified":true},{"in":["stone","stone"],"out":"spark","why":"Strike two stones and you shear off fragments hot enough to glow. Cutting tools are far older, but this is how every fire began for a million years.","src":"https://en.wikipedia.org/wiki/Fire_making","verified":true},{"in":["stone","spark"],"out":"flint","why":"Flint breaks in smooth conchoidal curves, so almost every fracture leaves a working edge. Obsidian breaks the same way and finer still — fine enough that surgeons occasionally still use it.","src":"https://en.wikipedia.org/wiki/Flint","verified":true},{"in":["soil","water"],"out":"mud","why":"Water fills the gaps between soil grains and lets them slide. Mud is soil that has lost its grip.","src":"https://en.wikipedia.org/wiki/Mud"},{"in":["mud"],"verb":"wait","out":"clay","why":"The finest particles settle out last: clay, flat sheets of aluminium silicate under 0.002 mm across. Wet, the sheets slip over each other — that is why clay is plastic.","src":"https://en.wikipedia.org/wiki/Clay","verified":true},{"in":["mud","straw"],"out":"adobe","why":"Straw stops drying mud from cracking as it shrinks. The same trick holds plaster and cob walls together.","src":"https://en.wikipedia.org/wiki/Adobe"},{"in":["adobe","sun"],"out":"brick","why":"Sun-dried mud brick built Jericho, Babylon and much of the American Southwest. No fuel required — only weeks of dry weather.","src":"https://en.wikipedia.org/wiki/Mudbrick","verified":true},{"in":["clay"],"verb":"heat","out":"pot","why":"Around 600 °C the water chemically bound inside the clay is driven out, and higher still the particles fuse. Either way it is irreversible: a fired pot will never be mud again.","src":"https://en.wikipedia.org/wiki/Pottery","verified":true,"at":600},{"in":["sand","ash"],"out":"glass","why":"Silica melts at about 1700 °C, which no early furnace could reach. Wood-ash potash drops that to roughly 1000 °C, and glass becomes possible.","src":"https://en.wikipedia.org/wiki/Forest_glass","verified":true},{"in":["sea","sun"],"out":"salt","why":"Flood a shallow pan, let the sun take the water, sweep up what stays. Seawater is 3.5% salt by weight.","src":"https://en.wikipedia.org/wiki/Salt_evaporation_pond","verified":true},{"in":["water","salt"],"out":"brine","why":"Salt water pulls water out of any cell it touches. That is the whole principle of preserving in brine — the microbes dry out before the food does.","src":"https://en.wikipedia.org/wiki/Brining"},{"in":["water"],"verb":"chill","out":"ice","why":"Water is one of very few substances that expands as it freezes. Ice floats, so lakes freeze from the top and life survives underneath.","src":"https://en.wikipedia.org/wiki/Properties_of_water"},{"in":["water"],"verb":"heat","out":"steam","why":"Turning 1 litre of water to steam takes five times more energy than heating it from freezing to boiling. That hidden energy is why steam scalds.","src":"https://en.wikipedia.org/wiki/Enthalpy_of_vaporization","verified":true,"at":100},{"in":["spark","straw"],"out":"fire","why":"A spark only needs something dry and thin enough to catch. Control of fire predates our own species — Homo erectus was carrying it into caves well over a million years ago.","src":"https://en.wikipedia.org/wiki/Control_of_fire_by_early_humans","verified":true},{"in":["wood"],"verb":"heat","out":"charcoal","why":"Heat wood without air and the water and tar bake off, leaving almost pure carbon. Charcoal burns far hotter than the wood it came from.","src":"https://en.wikipedia.org/wiki/Charcoal"},{"in":["wood","fire"],"out":"ash","why":"Ash is what will not burn: the minerals the tree drew out of the soil, mostly potassium and calcium salts.","src":"https://en.wikipedia.org/wiki/Wood_ash"},{"in":["ash","water"],"out":"lye","why":"Water leached through wood ash dissolves potassium carbonate. The solution is caustic enough to dissolve fat — and skin.","src":"https://en.wikipedia.org/wiki/Lye"},{"in":["lye","olive_oil"],"out":"soap","why":"Castile soap is olive oil and lye, nothing else. The lye splits the fat into glycerol and soap, and is entirely used up doing it.","src":"https://en.wikipedia.org/wiki/Castile_soap"},{"in":["seedling"],"verb":"wait","out":"tree","why":"A tree is a plant that solved a problem: build a trunk of dead wood and you can hold your leaves above everyone else's.","src":"https://en.wikipedia.org/wiki/Tree"},{"in":["tree"],"verb":"cut","out":"wood","why":"Wood is cellulose fibres set in lignin — nature's fibreglass. Along the grain it rivals steel for strength per kilogram.","src":"https://en.wikipedia.org/wiki/Wood"},{"in":["plant","sun"],"out":"straw","why":"Dried stalks: the part of a crop with no food value left, and the best tinder, thatch and bedding humans ever had for free.","src":"https://en.wikipedia.org/wiki/Straw"},{"in":["seed","water"],"out":"sprout","why":"Water swells the seed until its coat splits. The embryo lives on stored starch until its first leaf reaches light.","src":"https://en.wikipedia.org/wiki/Germination","supported":true},{"in":["sprout","soil"],"out":"seedling","why":"Roots go down before leaves go up. A seedling spends its first days building the plumbing.","src":"https://en.wikipedia.org/wiki/Seedling","supported":true},{"in":["seedling","sun"],"out":"plant","why":"Photosynthesis: light, water and carbon dioxide become sugar. Nearly every calorie you will ever eat was assembled by this reaction.","src":"https://en.wikipedia.org/wiki/Photosynthesis","supported":true},{"in":["plant"],"verb":"wait","out":"flower","why":"A flower is an advertisement. Colour, scent and sugar are all payment offered to an animal for carrying pollen.","src":"https://en.wikipedia.org/wiki/Flower"},{"in":["seed","soil"],"out":"grass","why":"Grasses grow from the base, not the tip. That is why grazing and mowing do not kill them — and why grassland covers something like 40% of the land on Earth.","src":"https://en.wikipedia.org/wiki/Grassland","verified":true},{"in":["plant","soil"],"out":"root","why":"Roots do not simply drink. Most trade sugar with fungi underground for phosphorus they could never reach alone.","src":"https://en.wikipedia.org/wiki/Mycorrhiza","supported":true},{"in":["plant","water"],"out":"leaf","why":"A leaf is a solar panel that must breathe without drying out. Its pores open for carbon dioxide and lose water every time they do.","src":"https://en.wikipedia.org/wiki/Stoma","supported":true},{"in":["plant","tree"],"out":"vine","why":"A vine skips the expense of a trunk by climbing someone else's. Cheap engineering, borrowed height.","src":"https://en.wikipedia.org/wiki/Vine"},{"in":["leaf","leaf"],"out":"cabbage","why":"Cabbage, kale, broccoli, sprouts, kohlrabi and cauliflower are all one species — Brassica oleracea — bred in six different directions.","src":"https://en.wikipedia.org/wiki/Brassica_oleracea"},{"in":["leaf","sun"],"out":"herb","why":"Aromatic oils are a plant's chemical defence, and strong sun makes it build more. That is why Mediterranean herbs taste louder than shade-grown ones.","src":"https://en.wikipedia.org/wiki/Essential_oil"},{"in":["leaf"],"verb":"heat","out":"tea","why":"Green, oolong and black tea are the same leaf from the same plant. The only difference is how long it is allowed to oxidise before heat stops it.","src":"https://en.wikipedia.org/wiki/Tea_processing","verified":true},{"in":["root"],"verb":"wait","out":"bulb","why":"A bulb is a bud wrapped in fat leaf bases — a whole plant packed with next season's food, sitting underground.","src":"https://en.wikipedia.org/wiki/Bulb"},{"in":["root","soil"],"out":"potato","why":"A potato is not a root. It is a swollen underground stem, storing starch for next year's shoots — which is why it has eyes.","src":"https://en.wikipedia.org/wiki/Tuber"},{"in":["bulb","soil"],"out":"onion","why":"Cutting an onion ruptures cells that keep an enzyme and a sulphur compound apart. They meet, react, and drift up as the gas that stings your eyes.","src":"https://en.wikipedia.org/wiki/Onion"},{"in":["bulb","sun"],"out":"garlic","why":"Whole garlic barely smells. Crushing it mixes alliin with an enzyme to make allicin — a defence the plant only builds once it has been damaged.","src":"https://en.wikipedia.org/wiki/Allicin","supported":true},{"in":["flower","flower"],"out":"meadow","why":"A flowering meadow is not scenery, it is infrastructure. Its density of blooms is what makes a pollinator colony viable.","src":"https://en.wikipedia.org/wiki/Meadow"},{"in":["meadow"],"verb":"wait","out":"bee","why":"Bees find meadows on their own. A honeybee colony forages up to 5 km out and reports good ground to the hive by dancing.","src":"https://en.wikipedia.org/wiki/Western_honey_bee","verified":true},{"in":["flower"],"verb":"wait","out":"nectar","why":"Nectar is roughly 25% sugar in water — deliberately made, deliberately given away, and never free.","src":"https://en.wikipedia.org/wiki/Nectar","verified":true},{"in":["flower","bee"],"out":"fruit","why":"The bee moves pollen between flowers; the fertilised ovary swells into fruit. Around a third of everything humans eat depends on this transaction.","src":"https://en.wikipedia.org/wiki/Pollination"},{"in":["nectar","bee"],"out":"honey","why":"A bee reduces nectar from 70% water to under 18% and adds enzymes that split sucrose. At that concentration nothing can grow in it, so honey never spoil
