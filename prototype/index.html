name":"Nihonium","srcTitle":"Nihonium","src":"https://en.wikipedia.org/wiki/Nihonium","kind":"atom","category":"post"},{"id":"el_flerovium","symbol":"Fl","number":114,"name":"Flerovium","srcTitle":"Flerovium","src":"https://en.wikipedia.org/wiki/Flerovium","kind":"atom","category":"post"},{"id":"el_moscovium","symbol":"Mc","number":115,"name":"Moscovium","srcTitle":"Moscovium","src":"https://en.wikipedia.org/wiki/Moscovium","kind":"atom","category":"post"},{"id":"el_livermorium","symbol":"Lv","number":116,"name":"Livermorium","srcTitle":"Livermorium","src":"https://en.wikipedia.org/wiki/Livermorium","kind":"atom","category":"post"},{"id":"el_tennessine","symbol":"Ts","number":117,"name":"Tennessine","srcTitle":"Tennessine","src":"https://en.wikipedia.org/wiki/Tennessine","kind":"atom","category":"halogen"},{"id":"el_oganesson","symbol":"Og","number":118,"name":"Oganesson","srcTitle":"Oganesson","src":"https://en.wikipedia.org/wiki/Oganesson","kind":"atom","category":"noble"}],"compounds":[{"id":"bed_water_molecule","name":"Water","srcTitle":"Properties of water","of":["el_hydrogen","el_oxygen"],"fact":"Two hydrogens at an angle, which is why water is sticky, why ice floats, and why life works.","src":"https://en.wikipedia.org/wiki/Properties_of_water","kind":"compound","formula":"H2O","tier":"molecule"},{"id":"bed_silica","name":"Silica","srcTitle":"Silicon dioxide","of":["el_silicon","el_oxygen"],"fact":"Quartz. It survives weathering better than almost anything, which is why sand is mostly this.","src":"https://en.wikipedia.org/wiki/Silicon_dioxide","kind":"compound","formula":"SiO2","tier":"molecule"},{"id":"bed_feldspar","name":"Feldspar","srcTitle":"Feldspar","of":["el_potassium","el_aluminium","el_silicon","el_oxygen"],"fact":"Around half of granite, and the mineral that weathers down into clay.","src":"https://en.wikipedia.org/wiki/Feldspar","kind":"compound","formula":"KAlSi3O8","tier":"molecule"},{"id":"bed_mica","name":"Mica","srcTitle":"Mica","of":["el_potassium","el_aluminium","el_silicon","el_oxygen","el_hydrogen"],"fact":"Splits into sheets thin enough to see through. The dark flecks in granite.","src":"https://en.wikipedia.org/wiki/Mica","kind":"compound","formula":"KAl3Si3O10(OH)2","tier":"molecule"},{"id":"bed_calcium_carbonate","name":"Calcium Carbonate","srcTitle":"Calcium carbonate","of":["el_calcium","el_carbon","el_oxygen"],"fact":"Chalk, limestone, eggshell and seashell. Life's favourite building material.","src":"https://en.wikipedia.org/wiki/Calcium_carbonate","kind":"compound","formula":"CaCO3","tier":"molecule"},{"id":"bed_halite","name":"Rock Salt","srcTitle":"Halite","of":["el_sodium","el_chlorine"],"fact":"A cube of alternating ions. The only mineral humans eat by the spoonful.","src":"https://en.wikipedia.org/wiki/Halite","kind":"compound","formula":"NaCl","tier":"molecule"},{"id":"bed_glucose","name":"Glucose","srcTitle":"Glucose","of":["el_carbon","el_hydrogen","el_oxygen"],"fact":"What photosynthesis actually makes. Every other food molecule is built from it or burnt into it.","src":"https://en.wikipedia.org/wiki/Glucose","kind":"compound","formula":"C6H12O6","tier":"monomer"},{"id":"bed_starch","name":"Starch","srcTitle":"Starch","of":["bed_glucose"],"fact":"Thousands of glucose units chained up for storage. A seed's packed lunch.","src":"https://en.wikipedia.org/wiki/Starch","kind":"compound","formula":"(C6H10O5)n","tier":"polymer","via":"glycosidic"},{"id":"bed_cellulose","name":"Cellulose","srcTitle":"Cellulose","of":["bed_glucose"],"fact":"The same glucose, bonded the other way round — and that one flip is why we can eat bread but not wood.","src":"https://en.wikipedia.org/wiki/Cellulose","kind":"compound","formula":"(C6H10O5)n","tier":"polymer","via":"glycosidic"},{"id":"bed_amino_acid","name":"Amino Acid","srcTitle":"Amino acid","of":["el_carbon","el_hydrogen","el_oxygen","el_nitrogen","el_sulfur"],"fact":"Twenty of them, in every living thing on Earth, all the same handedness. No exception has ever been found.","src":"https://en.wikipedia.org/wiki/Amino_acid","kind":"compound","tier":"monomer","variants":["bed_glycine","bed_alanine","bed_serine","bed_cysteine","bed_threonine","bed_valine","bed_leucine","bed_isoleucine","bed_proline","bed_phenylalanine","bed_tyrosine","bed_tryptophan","bed_aspartate","bed_glutamate","bed_asparagine","bed_glutamine","bed_lysine","bed_arginine","bed_histidine","bed_methionine"]},{"id":"bed_protein","name":"Protein","srcTitle":"Protein","of":["bed_tertiary_fold"],"fact":"A chain folded into one specific shape. The shape is the function — and it is decided entirely by the order of the links.","src":"https://en.wikipedia.org/wiki/Protein","kind":"compound","note":"Built from the twenty amino acids. Each bond formed releases one water molecule, which is why a residue in a chain is lighter than the free acid it came from.","tier":"structure","via":"folding"},{"id":"bed_fatty_acid","name":"Fatty Acid","srcTitle":"Fatty acid","of":["el_carbon","el_hydrogen","el_oxygen"],"fact":"A long carbon tail that will not mix with water. That refusal is what makes a cell membrane possible.","src":"https://en.wikipedia.org/wiki/Fatty_acid","kind":"compound","tier":"monomer"},{"id":"bed_lipid","name":"Fat","srcTitle":"Lipid","of":["bed_fatty_acid","bed_glycerol"],"fact":"Twice the energy per gram of sugar, which is why seeds and animals both store it.","src":"https://en.wikipedia.org/wiki/Lipid","kind":"compound","tier":"polymer","via":"ester"},{"id":"bed_nucleotide","name":"Nucleotide","srcTitle":"Nucleotide","of":["el_carbon","el_hydrogen","el_oxygen","el_nitrogen","el_phosphorus"],"fact":"Sugar, phosphate and a base. Four of them spell out everything alive.","src":"https://en.wikipedia.org/wiki/Nucleotide","kind":"compound","tier":"monomer"},{"id":"bed_dna","name":"DNA","srcTitle":"DNA","of":["bed_nucleotide"],"fact":"The instructions for building the thing you are holding, written in four letters.","src":"https://en.wikipedia.org/wiki/DNA","kind":"compound","tier":"polymer","via":"phosphodiester"},{"id":"bed_chlorophyll","name":"Chlorophyll","srcTitle":"Chlorophyll","of":["el_carbon","el_hydrogen","el_oxygen","el_nitrogen","el_magnesium"],"fact":"Catches the photon and hands its energy to chemistry. One magnesium atom sits at the centre.","src":"https://en.wikipedia.org/wiki/Chlorophyll","kind":"compound","formula":"C55H72MgN4O5","tier":"molecule"},{"id":"bed_photon","name":"Sunlight","srcTitle":"Photon","of":[],"fact":"Eight minutes and nineteen seconds old when it reaches the leaf. Not matter at all — the only thing here that is pure energy.","src":"https://en.wikipedia.org/wiki/Photon","kind":"particle","tier":"particle"},{"id":"bed_fusion","name":"Hydrogen Fusion","srcTitle":"Proton–proton chain","of":["el_hydrogen","el_helium","bed_photon"],"fact":"Four hydrogen nuclei become one helium, and the missing mass leaves as light. That light is the entire energy budget of this game.","src":"https://en.wikipedia.org/wiki/Proton%E2%80%93proton_chain","kind":"compound","tier":"particle"},{"id":"bed_glycerol","kind":"compound","tier":"molecule","name":"Glycerol","formula":"C3H8O3","of":["el_carbon","el_hydrogen","el_oxygen"],"srcTitle":"Glycerol","fact":"A three-carbon spine with three hooks. Hang a fatty acid on each and you have a fat.","src":"https://en.wikipedia.org/wiki/Glycerol"},{"id":"bed_polypeptide","kind":"compound","tier":"polymer","name":"Polypeptide Chain","of":["bed_amino_acid"],"via":"peptide","srcTitle":"Peptide","fact":"Amino acids in a line, in a specific order. The order is written in DNA and read by a ribosome.","src":"https://en.wikipedia.org/wiki/Peptide"},{"id":"bed_secondary_structure","kind":"compound","tier":"structure","name":"Helix & Sheet","of":["bed_polypeptide"],"via":"hydrogen","srcTitle":"Protein secondary structure","fact":"The chain coils into helices and pleats into sheets, held only by hydrogen bonds along the backbone.","src":"https://en.wikipedia.org/wiki/Protein_secondary_structure"},{"id":"bed_tertiary_fold","kind":"compound","tier":"structure","name":"Fold","of":["bed_secondary_structure"],"via":"folding","srcTitle":"Protein tertiary structure","fact":"Helices and sheets pack into one compact shape, usually within a second of being made.","src":"https://en.wikipedia.org/wiki/Protein_tertiary_structure"},{"id":"bed_enzyme","kind":"compound","tier":"assembly","name":"Enzyme","of":["bed_protein"],"srcTitle":"Enzyme","fact":"A protein with a pocket shaped to hold one particular molecule. Nearly every step in this game is one of these doing its job.","src":"https://en.wikipedia.org/wiki/Enzyme"},{"id":"bed_membrane","kind":"compound","tier":"assembly","name":"Membrane","of":["bed_lipid","bed_protein"],"srcTitle":"Cell membrane","fact":"Two layers of fat, tails inward, because the tails will not tolerate water. Life needs an inside, and this is how it gets one.","src":"https://en.wikipedia.org/wiki/Cell_membrane"},{"id":"bed_cell","kind":"compound","tier":"cell","name":"Cell","of":["bed_membrane","bed_dna","bed_protein","bed_water_molecule"],"srcTitle":"Cell (biology)","fact":"The smallest thing that is unambiguously alive. Everything you have eaten was made of these.","src":"https://en.wikipedia.org/wiki/Cell_(biology)"},{"id":"bed_muscle_tissue","kind":"compound","tier":"tissue","name":"Muscle","of":["bed_cell","bed_protein"],"srcTitle":"Muscle tissue","fact":"Cells packed with protein filaments that ratchet past each other. Meat is this, rested.","src":"https://en.wikipedia.org/wiki/Muscle"}],"composition":{"stone":["bed_silica","bed_feldspar","bed_mica"],"water":["bed_water_molecule"],"seed":["bed_starch","bed_protein","bed_lipid","bed_dna"],"sun":["bed_fusion"],"egg":["bed_protein","bed_lipid","bed_calcium_carbonate","bed_water_molecule"],"milk":["bed_water_molecule","bed_lipid","bed_protein","bed_glucose"],"meat":["bed_muscle_tissue"],"flour":["bed_starch","bed_protein"],"honey":["bed_glucose","bed_water_molecule"]," const {elements, recipes, verbs} = DATA;
const byId = Object.fromEntries(elements.map(e => [e.id, e]));

// Display names are per-locale; ids and recipes never are. Swapping "Chips" for
// "French Fries" must not be able to change what a sourced recipe means.
const LOCALE = (navigator.language || 'en-GB');
const nameOf = (e) => (e.aliases && (e.aliases[LOCALE] ||
  e.aliases[Object.keys(e.aliases).find(k => k.split('-')[0] === LOCALE.split('-')[0])])) || e.name;
const merges = new Map(), procs = new Map();
for (const r of recipes) {
  if (r.verb) procs.set(r.in[0] + '|' + r.verb, r);
  else merges.set([...r.in].sort().join('+'), r);
}
const STARTERS = elements.filter(e => e.starter).map(e => e.id);
const GOAL = 'dinner';
const KEY = 'loam.v1';

let found = new Set(), seen = new Set();
try {
  const s = JSON.parse(localStorage.getItem(KEY));
  if (s) { found = new Set(s.found); seen = new Set(s.seen); }
} catch {}
if (!found.size) STARTERS.forEach(s => found.add(s));
// Storage is unavailable in private browsing and on opaque origins. Never let
// a failed save abort a discovery.
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({found:[...found], seen:[...seen]})); } catch {} };

const unlockedVerbs = () => new Set(verbs.filter(v => !v.unlockedBy || found.has(v.unlockedBy)).map(v => v.id));

// How many undiscovered recipes can this element still take part in, using only
// what you already hold? Simulated at 25.7 attempts per discovery versus 91.2
// blind — it narrows the field without ever naming a partner.
// How many held elements still have an undiscovered recipe in them?
function liveCount() {
  const ul = unlockedVerbs();
  let n = 0;
  for (const e of elements) if (found.has(e.id) && secretsFor(e.id, ul) > 0) n++;
  return n;
}
function secretsFor(id, ul) {
  let n = 0;
  for (const r of DATA.recipes) {
    if (found.has(r.out)) continue;
    if (r.verb && !ul.has(r.verb)) continue;
    if (!r.in.includes(id)) continue;
    if (!r.in.every(i => found.has(i))) continue;
    n++;
  }
  return n;
}

let shelfQuery = '';
let readyAll = false;
const shelfShut = new Set();
let shelfAutoFolded = false;

// ---- sound: a tiny synth, so there are no files to load and nothing to block
// the first interaction. Warm and short; this genre lives on the feel of the
// drop, and silence is the commonest way to get that wrong. ----
let ac = null;
const audioOn = () => { try { ac ||= new (window.AudioContext || window.webkitAudioContext)(); } catch {} return ac; };
function note(freq, when, dur, gain = 0.07, type = 'sine') {
  const c = audioOn(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = freq;
  const t = c.currentTime + when;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(gain, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(c.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
const buzz = (ms) => { try { navigator.vibrate?.(ms); } catch {} };
const sfx = {
  discover() { note(523.25, 0, .18); note(783.99, .06, .26); buzz(14); },
  folklore() { note(587.33, 0, .16, .06, 'triangle'); note(880, .07, .3, .05, 'triangle'); buzz([8, 40, 8]); },
  unlock()   { note(392, 0, .14); note(523.25, .07, .16); note(659.25, .14, .34); buzz([12, 30, 18]); },
  nope()     { note(150, 0, .1, .045, 'sine'); buzz(9); },
  pick()     { note(660, 0, .045, .022); },
  done()     { note(440, 0, .1, .05); note(660, .05, .22, .045); buzz(10); },
};
const board = document.getElementById('board');
const toastEl = document.getElementById('toast');
let toastT;
function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), 2200);
}

// ---------- taxonomy ----------
// An element can carry several tags, so families are resolved in priority
// order: the most specific identity wins (a microbe is a microbe before it is
// an ingredient).
const FAMILIES = [
  { id: 'myth',    name: 'Folklore',        tags: ['myth'] },
  { id: 'microbe', name: 'The Very Small',  tags: ['microbe', 'ferment'] },
  { id: 'animal',  name: 'Animals & Dairy', tags: ['animal', 'dairy'] },
  { id: 'plant',   name: 'Growing Things',  tags: ['plant', 'crop'] },
  { id: 'earth',   name: 'Earth & Stone',   tags: ['earth', 'build'] },
  { id: 'water',   name: 'Water & Ice',     tags: ['water'] },
  { id: 'fire',    name: 'Fire & Tools',    tags: ['fire', 'tool'] },
  { id: 'food',    name: 'Kitchen',         tags: ['food', 'dish', 'sweet', 'drink', 'preserve'] },
];
function familyOf(e) {
  if (e.shelf === 'folklore') return FAMILIES[0];
  for (const f of FAMILIES) if (e.tags.some(t => f.tags.includes(t))) return f;
  return FAMILIES[7];
}

// ---------- rendering ----------
function chipHTML(e) {
  return `<span class="e">${e.emoji}</span>${nameOf(e)}`;
}
const famAttrs = (e) => {
  const f = familyOf(e);
  return `data-fam="${f.id}" class-fam="fam-${f.id}"`;
};
function renderShelf() {
  const ul = unlockedVerbs();
  const groups = FAMILIES.map(f => [f, elements.filter(e => found.has(e.id) && familyOf(e).id === f.id)])
    .filter(([, g]) => g.length)
    .sort((a, b) => (a[0].id === 'myth') - (b[0].id === 'myth'));   // folklore last
  const secrets = new Map(elements.filter(e => found.has(e.id)).map(e => [e.id, secretsFor(e.id, ul)]));
  const liveCount = [...secrets.values()].filter(n => n > 0).length;
  const q = (shelfQuery || '').toLowerCase();
  if (!shelfAutoFolded && found.size > 40) {          // tidy itself once crowded
    FAMILIES.forEach(f => shelfShut.add(f.id));
    shelfAutoFolded = true;
  }
  const aside = document.getElementById('aside');
  aside.innerHTML =
    `<div class="shelfbar">
       <input id="shelfq" class="search sm" placeholder="Find…" value="${shelfQuery}" autocomplete="off">
       ${q ? '<button id="shelfx" title="Clear">×</button>' : ''}
     </div>` +
    // With two hundred things on the shelf and a handful of live ones, the
    // single most useful thing the panel can do is put those few at the top.
    (() => {
      if (q) return '';
      const live = elements.filter(e => found.has(e.id) && (secrets.get(e.id) ?? 0) > 0)
        .sort((a, b) => (secrets.get(b.id) ?? 0) - (secrets.get(a.id) ?? 0));
      if (!live.length) return '';
      const cap = readyAll ? live.length : 12;
      const show = live.slice(0, cap);
      return `<h2 class="ready"><i></i>Ready<em>${live.length}</em>` +
        (live.length > 12 ? `<span class="cv" data-readyall>${readyAll ? 'less' : 'all'}</span>` : '') +
        `</h2><div class="shelf">` +
        show.map(e => {
          const f = familyOf(e);
          return `<span class="chip fam-${f.id} live" data-fam="${f.id}" data-spawn="${e.id}">` +
                 `${chipHTML(e)}<i class="n">${secrets.get(e.id)}</i></span>`;
        }).join('') + `</div>`;
    })() +
    groups.map(([f, g]) => {
      const hits = q ? g.filter(e => e.name.toLowerCase().includes(q)) : g;
      if (!hits.length) return '';
      const shut = !q && shelfShut.has(f.id);
      const live = hits.filter(e => (secrets.get(e.id) ?? 0) > 0).length;
      return `<h2 class="fam-${f.id}${shut ? ' shut' : ''}" data-fold="${f.id}">` +
        `<i></i>${f.name}<em>${hits.length}</em>` +
        (live ? `<b class="lv">${live}</b>` : '') + `<span class="cv">${shut ? '▸' : '▾'}</span></h2>` +
        (shut ? '' : `<div class="shelf">` + hits.map(e => {
          const n = secrets.get(e.id) ?? 0;
          return `<span class="chip fam-${f.id}${n ? ' live' : ' spent'}" data-fam="${f.id}" data-spawn="${e.id}">` +
                 `${chipHTML(e)}${n ? `<i class="n">${n}</i>` : ''}</span>`;
        }).join('') + `</div>`);
    }).join('') || '<p class="none">Nothing matches.</p>';

  const box = document.getElementById('shelfq');
  box.oninput = () => { shelfQuery = box.value; renderShelf();
    const b2 = document.getElementById('shelfq'); b2.focus();
    b2.setSelectionRange(b2.value.length, b2.value.length); };
  const x = document.getElementById('shelfx');
  if (x) x.onclick = () => { shelfQuery = ''; renderShelf(); };
  const ra = aside.querySelector('[data-readyall]');
  if (ra) ra.onclick = ev => { ev.stopPropagation(); readyAll = !readyAll; renderShelf(); };
  aside.querySelectorAll('[data-fold]').forEach(h => h.onclick = ev => {
    if (ev.target.closest('input')) return;
    const id = h.dataset.fold;
    shelfShut.has(id) ? shelfShut.delete(id) : shelfShut.add(id);
    renderShelf();
  });
  document.getElementById('live').textContent = liveCount ? `${liveCount} still have something to give` : '';

  document.getElementById('tray').innerHTML = verbs.map(v =>
    `<div class="verb${ul.has(v.id) ? '' : ' locked'}" data-verb="${v.id}">
       <span class="e">${v.emoji}</span>${ul.has(v.id) ? v.name : 'Locked'}</div>`).join('');

  document.getElementById('count').textContent = `${found.size} / ${elements.length}`;
  const g = byId[GOAL];
  document.getElementById('goal').innerHTML = found.has(GOAL)
    ? `Made <b>${g.emoji} ${g.name}</b> — now try 🎉 Feast`
    : `Goal: <b>${g.emoji} ${g.name}</b>`;
}

// ---- the world: chips live in world coordinates; the view pans and zooms ----
const world = document.getElementById('world');
const linkSvg = document.getElementById('links');
const view = { x: 0, y: 0, k: 1 };
const links = [];                                     // {a,b,out} DOM refs

function applyView() {
  world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`;
}
// The board can report zero size in embedded or not-yet-laid-out contexts, and
// every position derived from it then collapses into the corner. Fall back to
// the viewport, then to a sane default, so layout is never nonsense.
function boardBox() {
  const b = board.getBoundingClientRect();
  const w = b.width  || (window.innerWidth  - 240) || 900;
  const h = b.height || (window.innerHeight - 120) || 600;
  return { left: b.left, top: b.top, width: w, height: h };
}
function toWorld(sx, sy) {
  const b = boardBox();
  return [(sx - b.left - view.x) / view.k, (sy - b.top - view.y) / view.k];
}
const chipCentre = (el) => [
  (parseFloat(el.style.left) || 0) + el.offsetWidth / 2,
  (parseFloat(el.style.top) || 0) + el.offsetHeight / 2,
];

// Nothing you have made is ever destroyed by a tap. Tapping folds the branch
// below a chip out of sight and puts a count on it; tapping again brings it
// back. To clear the bench, use Tidy — and even that only removes chips, never
// discoveries, which live in the codex permanently.
function childrenOf(chip) {
  return links.filter(l => l.a === chip || l.b === chip).map(l => l.out);
}
function descendantsOf(chip, acc = new Set()) {
  for (const k of childrenOf(chip)) {
    if (acc.has(k)) continue;
    acc.add(k);
    descendantsOf(k, acc);
  }
  return acc;
}
function toggleBranch(chip) {
  const kids = descendantsOf(chip);
  if (!kids.size) {                                   // nothing below: just acknowledge
    chip.classList.add('pulse');
    setTimeout(() => chip.classList.remove('pulse'), 380);
    return;
  }
  const folding = !chip.classList.contains('folded');
  chip.classList.toggle('folded', folding);
  for (const k of kids) k.classList.toggle('hidden', folding);
  chip.dataset.fold = folding ? `+${kids.size}` : '';
  drawLinks();
}

// Connections persist, so the canvas becomes a diagram of what you built
// rather than a scratchpad that forgets.
function drawLinks() {
  const parts = [];
  for (const l of links) {
    if (!l.out.isConnected || l.out.classList.contains('hidden')) continue;
    const [ox, oy] = chipCentre(l.out);
    for (const src of [l.a, l.b]) {
      if (!src || !src.isConnected || src.classList.contains('hidden')) continue;
      const [sx, sy] = chipCentre(src);
      // A curve, not a spoke: it reads as flow rather than wiring, and two
      // parents converging on one child stop looking like a Y of straight lines.
      const my = (sy + oy) / 2;
      const d = `M ${sx} ${sy} C ${sx} ${my}, ${ox} ${my}, ${ox} ${oy}`;
      parts.push(`<path class="made${l.fresh ? ' fresh' : ''}" d="${d}"/>`);
    }
    l.fresh = false;
  }
  linkSvg.innerHTML = parts.join('');
}

function zoomBy(f, cx, cy) {
  const b = boardBox();
  const px = cx == null ? b.width / 2 : cx - b.left;
  const py = cy == null ? b.height / 2 : cy - b.top;
  const k2 = Math.max(0.25, Math.min(2.4, view.k * f));
  view.x = px - (px - view.x) * (k2 / view.k);
  view.y = py - (py - view.y) * (k2 / view.k);
  view.k = k2;
  applyView();
}
function fitAll() {
  const chips = [...world.querySelectorAll('.chip.board')];
  if (!chips.length) return;
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  for (const c of chips) {
    const l = parseFloat(c.style.left) || 0, t = parseFloat(c.style.top) || 0;
    x1 = Math.min(x1, l); y1 = Math.min(y1, t);
    x2 = Math.max(x2, l + c.offsetWidth); y2 = Math.max(y2, t + c.offsetHeight);
  }
  const b = boardBox(), pad = 60;
  view.k = Math.max(0.25, Math.min(1.4, Math.min((b.width - pad) / (x2 - x1 || 1),
                                                 (b.height - pad) / (y2 - y1 || 1))));
  view.x = b.width / 2 - ((x1 + x2) / 2) * view.k;
  view.y = b.height / 2 - ((y1 + y2) / 2) * view.k;
  applyView();
}
// Tidy: lay the whole bench out as the diagram it already is — sources at the
// top, each result on the row below its parents. Nothing is removed; this is
// arrangement, not cleanup.
function tidy() {
  const chips = [...world.querySelectorAll('.chip.board:not(.hidden)')];
  if (!chips.length) return;
  const parents = new Map(chips.map(c => [c, []]));
  for (const l of links) {
    if (!parents.has(l.out)) continue;
    for (const p of [l.a, l.b]) if (p && parents.has(p)) parents.get(l.out).push(p);
  }
  const depth = new Map();
  const depthOf = (c, seen = new Set()) => {
    if (depth.has(c)) return depth.get(c);
    if (seen.has(c)) return 0;
    seen.add(c);
    const ps = parents.get(c) ?? [];
    const d = ps.length ? Math.max(...ps.map(p => depthOf(p, seen))) + 1 : 0;
    depth.set(c, d);
    return d;
  };
  chips.forEach(c => depthOf(c));
  const rows = new Map();
  for (const c of chips) {
    const d = depth.get(c);
    if (!rows.has(d)) rows.set(d, []);
    rows.get(d).push(c);
  }
  const b = boardBox();
  const [ox, oy] = toWorld(b.left + 40, b.top + 40);
  const rowH = 78;
  let y = oy;
  for (const d of [...rows.keys()].sort((a, z) => a - z)) {
    const row = rows.get(d);
    let x = ox;
    for (const c of row) {
      c.style.left = x + 'px';
      c.style.top = y + 'px';
      x += c.offsetWidth + 16;
    }
    y += rowH;
  }
  drawLinks();
  fitAll();
  sfx.pick();
}

document.getElementById('zoom').addEventListener('click', ev => {
  const z = ev.target.dataset.z;
  if (z === 'in') zoomBy(1.25);
  else if (z === 'out') zoomBy(0.8);
  else if (z === 'fit') fitAll();
  else if (z === 'tidy') tidy();
});
board.addEventListener('wheel', ev => {
  ev.preventDefault();
  zoomBy(ev.deltaY < 0 ? 1.12 : 0.89, ev.clientX, ev.clientY);
}, { passive: false });

// Pinch. Pointer events give us every finger, so we track them ourselves rather
// than relying on gesture events, which only Safari implements.
const touches = new Map();
let pinch = null;
board.addEventListener('pointerdown', ev => {
  if (ev.pointerType !== 'touch') return;
  touches.set(ev.pointerId, ev);
  if (touches.size === 2) {
    const [a, b] = [...touches.values()];
    pinch = { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY) };
    pan = null; drag = null;                          // a second finger cancels a drag
    document.querySelectorAll('.chip.drag').forEach(c => c.classList.remove('drag'));
  }
}, true);
board.addEventListener('pointermove', ev => {
  if (ev.pointerType !== 'touch' || !touches.has(ev.pointerId)) return;
  touches.set(ev.pointerId, ev);
  if (touches.size !== 2 || !pinch) return;
  ev.preventDefault();
  const [a, b] = [...touches.values()];
  const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
  if (pinch.d > 0) zoomBy(d / pinch.d, (a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2);
  pinch.d = d;
}, true);
for (const e of ['pointerup', 'pointercancel']) board.addEventListener(e, ev => {
  touches.delete(ev.pointerId);
  if (touches.size < 2) pinch = null;
}, true);

// Double-tap zooms in, and again to fit — the standard map gesture.
let lastTap = 0;
board.addEventListener('pointerup', ev => {
  if (ev.target.closest('.chip.board, .verb, #zoom, #intro')) return;
  const now = Date.now();
  if (now - lastTap < 320) { view.k > 1.05 ? fitAll() : zoomBy(1.8, ev.clientX, ev.clientY); lastTap = 0; }
  else lastTap = now;
});

// Chips that land on top of each other cannot be dragged apart, so placement
// looks for space rather than trusting a random point.
function freeSpot(w, h, near) {
  const held = [...world.querySelectorAll('.chip.board')]
    .map(c => [parseFloat(c.style.left) || 0, parseFloat(c.style.top) || 0]);
  const b = boardBox();
  const [cx, cy] = near ?? toWorld(b.left + b.width / 2, b.top + b.height / 2);
  let best = null, bestGap = -1;
  for (let i = 0; i < 80; i++) {
    const spread = 90 + i * 9;
    const x = cx + (Math.random() - .5) * spread * 2;
    const y = cy + (Math.random() - .5) * spread * 1.5;
    let gap = Infinity;
    for (const [l, t] of held) gap = Math.min(gap, Math.hypot(l - x, t - y));
    if (gap > w + 18) return [x, y];
    if (gap > bestGap) { bestGap = gap; best = [x, y]; }
  }
  return best;
}

function spawn(id, x, y, near) {
  const e = byId[id];
  const el = document.createElement('div');
  const fam = familyOf(e);
  el.className = `chip board pop fam-${fam.id}`;
  el.dataset.fam = fam.id;
  el.dataset.id = id;
  el.innerHTML = chipHTML(e);
  world.appendChild(el);
  const cw = el.offsetWidth, ch = el.offsetHeight;
  let anchor = null;
  if (near && near.length) {                          // sit the result near its parents
    const pts = near.filter(n => n && n.isConnected).map(chipCentre);
    if (pts.length) anchor = [pts.reduce((a, p) => a + p[0], 0) / pts.length,
                              pts.reduce((a, p) => a + p[1], 0) / pts.length + 92];
  }
  const [left, top] = x == null ? freeSpot(cw, ch, anchor) : [x - cw / 2, y - ch / 2];
  const bb = boardBox();
  const [minX, minY] = toWorld(bb.left + 8, bb.top + 8);
  const [maxX, maxY] = toWorld(bb.left + bb.width - 8, bb.top + bb.height - 8);
  el.style.left = Math.max(minX, Math.min(left, maxX - cw)) + 'px';
  el.style.top  = Math.max(minY, Math.min(top,  maxY - ch)) + 'px';
  setTimeout(() => el.classList.remove('pop'), 340);
  drawLinks();
  return el;
}

// Discoveries must never block the board. The card slides in beside the bench,
// reads in a glance, and retires on its own — the codex is the permanent record,
// so nothing is lost by letting it go.
let cardT, cardPinned = false;
function showCard(r, e) {
  const isFolk = e.shelf === 'folklore';
  const card = document.getElementById('card');
  cardPinned = false;
  card.className = `card on mini fam-${familyOf(e).id}`;
  card.dataset.for = e.id;
  document.getElementById('inner').innerHTML = `
    <div class="line">
      <span class="big">${e.emoji}</span>
      <b>${e.name}</b>
      <i class="dot ${e.shelf}" title="${isFolk ? 'a story we tell' : 'how it works'}"></i>
      <span class="chev">▾</span>
    </div>
    <div class="more">
      <p class="why">${r.why}</p>
      <div class="cfoot">
        ${r.src ? `<a class="src" href="${r.src}" target="_blank" rel="noopener">Check this${r.verified ? ' ✓' : ''}</a>` : '<span></span>'}
        <button class="ghost" data-trace="${e.id}">Trace it</button>
      </div>
    </div>
    <span class="timer"></span>`;
  clearTimeout(cardT);
  cardT = setTimeout(() => { if (!cardPinned) card.classList.remove('on'); }, 6000);
}
function dismissCard() { clearTimeout(cardT); cardPinned = false; document.getElementById('card').classList.remove('on'); }

// ---------- the one interaction that matters ----------
let drag = null;
let pan = null;
board.addEventListener('pointerdown', ev => {
  if (ev.target.closest('#zoom, #intro')) return;
  if (touches.size > 1) return;                       // pinching, not dragging
  const chip = ev.target.closest('.chip.board:not(.cooking)');
  if (!chip) {                                       // empty space: pan the world
    pan = { sx: ev.clientX, sy: ev.clientY, vx: view.x, vy: view.y };
    board.classList.add('panning');
    return;
  }
  const [wx, wy] = toWorld(ev.clientX, ev.clientY);
  benchTouched = true;
  drag = { chip, ox: wx - (parseFloat(chip.style.left) || 0),
                 oy: wy - (parseFloat(chip.style.top) || 0), moved: false };
  chip.classList.add('drag');
  chip.setPointerCapture(ev.pointerId);
});
board.addEventListener('pointermove', ev => {
  if (pan) {
    view.x = pan.vx + (ev.clientX - pan.sx);
    view.y = pan.vy + (ev.clientY - pan.sy);
    applyView();
    return;
  }
  if (!drag) return;
  drag.moved = true;
  const [wx, wy] = toWorld(ev.clientX, ev.clientY);
  drag.chip.style.left = (wx - drag.ox) + 'px';
  drag.chip.style.top  = (wy - drag.oy) + 'px';
  drawLinks();
  const t = hit(ev.clientX, ev.clientY, drag.chip);
  document.querySelectorAll('.target').forEach(n => n.classList.remove('target'));
  if (t) t.classList.add('target');
});
board.addEventListener('pointerup', ev => {
  if (pan) { pan = null; board.classList.remove('panning'); return; }
  if (!drag) return;
  const { chip, moved } = drag; drag = null;
  chip.classList.remove('drag');
  document.querySelectorAll('.target').forEach(n => n.classList.remove('target'));
  if (!moved) { toggleBranch(chip); return; }          // tap folds the branch below
  const t = hit(ev.clientX, ev.clientY, chip);
  if (!t) return;
  if (t.dataset.verb) applyProcess(chip, t);
  else applyMerge(chip, t);
});

// `exclude` must be passed explicitly: by pointerup the drag state is already
// cleared, and without it a chip hit-tests against itself (stone + stone).
// Hit testing by OVERLAP of the dragged chip, not by pointer position. Merges
// are commutative in the data — dropping A on B and B on A resolve the same
// recipe — so any asymmetry a player feels is this test being too strict.
// Picking the greatest overlap also makes crowded benches predictable.
function hit(x, y, exclude) {
  const d = exclude ? exclude.getBoundingClientRect() : { left: x, right: x, top: y, bottom: y };
  let best = null, bestArea = 0;
  for (const n of [...world.querySelectorAll('.chip.board:not(.hidden)'), ...document.querySelectorAll('.verb:not(.locked)')]) {
    if (n === exclude) continue;
    const r = n.getBoundingClientRect();
    const ox = Math.min(d.right, r.right) - Math.max(d.left, r.left);
    const oy = Math.min(d.bottom, r.bottom) - Math.max(d.top, r.top);
    if (ox > 0 && oy > 0) {
      const area = ox * oy;
      if (area > bestArea) { bestArea = area; best = n; }
    } else if (!best && x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
      best = n; bestArea = 0.1;                      // pointer fallback
    }
  }
  return best;
}

function resolve(r, chips, x, y) {
  if (!r) { sfx.nope(); chips.forEach(c => { c.classList.add('nope'); setTimeout(() => c.classList.remove('nope'), 280); }); return; }
  // Inputs stay put and the result is linked to them, so the canvas accumulates
  // into a diagram of what you built instead of forgetting each step.
  // The dragged parent is sitting on top of the other one. Ease them apart so
  // the diagram stays readable once the link is drawn.
  if (chips.length === 2) {
    const [p1, p2] = chips.map(chipCentre);
    const dx = p1[0] - p2[0], dy = p1[1] - p2[1];
    const d = Math.hypot(dx, dy) || 1;
    const want = (chips[0].offsetWidth + chips[1].offsetWidth) / 2 + 22;
    if (d < want) {
      const push = (want - d) / 2, ux = (dx / d) * push, uy = (dy / d) * push;
      chips[0].style.left = (parseFloat(chips[0].style.left) || 0) + ux + 'px';
      chips[0].style.top  = (parseFloat(chips[0].style.top) || 0) + uy + 'px';
      chips[1].style.left = (parseFloat(chips[1].style.left) || 0) - ux + 'px';
      chips[1].style.top  = (parseFloat(chips[1].style.top) || 0) - uy + 'px';
    }
  }
  // The moment two things become one should be visible. A single ring at the
  // join, then the new chip pops in — no confetti, nothing to sit through.
  const at = chips.filter(c => c && c.isConnected).map(chipCentre);
  if (at.length) {
    const cx = at.reduce((a, p) => a + p[0], 0) / at.length;
    const cy = at.reduce((a, p) => a + p[1], 0) / at.length;
    const ring = document.createElement('div');
    ring.className = 'ring';
    ring.style.left = cx + 'px'; ring.style.top = cy + 'px';
    world.appendChild(ring);
    setTimeout(() => ring.remove(), 620);
  }
  const el = spawn(r.out, null, null, chips);
  links.push({ a: chips[0], b: chips[1] ?? null, out: el, fresh: true });
  drawLinks();
  const isNew = !found.has(r.out);
  if (isNew) {
    const wasLive = liveCount();
    found.add(r.out);
    save(); renderShelf();
    // Players of other games in this genre report the same pair failing and then
    // later working, and read it as the game cheating. Unlocks genuinely do
    // change what is possible — so say so out loud rather than letting them
    // rediscover it by accident.
    const unlocked = verbs.filter(v => v.unlockedBy === r.out);
    if (unlocked.length) {
      // A tool unlock is the bigger news; don't let the follow-up overwrite it.
      for (const v of unlocked) {
        const n = DATA.recipes.filter(x => x.verb === v.id && found.has(x.in[0]) && !found.has(x.out)).length;
        sfx.unlock();
        toast(`${v.emoji} ${v.name} unlocked — ${n} thing${n === 1 ? '' : 's'} you hold can be ${v.name.toLowerCase()}ed`);
      }
    } else {
      const gained = liveCount() - wasLive;
      if (gained > 1) toast(`${gained} things on your shelf just became useful again`);
    }
  }
  if (!seen.has(r.out)) {
    seen.add(r.out); save();
    (byId[r.out].shelf === 'folklore' ? sfx.folklore : sfx.discover)();
    showCard(r, byId[r.out]);
  } else { sfx.pick(); el.classList.add('pop'); }
}

function applyMerge(a, b) {
  resolve(merges.get([a.dataset.id, b.dataset.id].sort().join('+')), [a, b]);
}
// Some processes are not instant in life and should not be here either.
// Waiting and fermenting take real time; you keep playing while they run.
const TAKES_TIME = { wait: 14000, ferment: 20000 };
const cooking = new Set();

function applyProcess(chip, verbEl) {
  const verb = verbEl.dataset.verb;
  const r = procs.get(chip.dataset.id + '|' + verb);
  if (!r) { verbEl.classList.add('nope'); setTimeout(() => verbEl.classList.remove('nope'), 280); return; }
  const ms = TAKES_TIME[verb];
  if (!ms) return resolve(r, [chip]);
  startCooking(chip, r, verb, ms);
}

// Warmth genuinely speeds fermentation and drying, so standing a jar next to the
// fire is a real method — not a purchased skip. Acceleration has to be earned by
// how you arrange the bench.
function heatNearby(chip) {
  const [cx, cy] = chipCentre(chip);
  for (const c of world.querySelectorAll('.chip.board')) {
    if (c === chip) continue;
    if (c.dataset.id !== 'fire' && c.dataset.id !== 'sun') continue;
    const [hx, hy] = chipCentre(c);
    if (Math.hypot(hx - cx, hy - cy) < 190) return c.dataset.id;
  }
  return null;
}

function startCooking(chip, r, verb, ms) {
  const v = verbs.find(x => x.id === verb);
  const job = { chip, r, verb, started: performance.now(), ms, done: 0 };
  cooking.add(job);
  chip.classList.add('cooking');
  chip.dataset.verbLabel = v.emoji;
  updateWaiting();
  toast(`${v.emoji} ${chip.textContent.trim()} is ${verb === 'wait' ? 'resting' : 'fermenting'} — keep playing`);
}

function tickCooking(now) {
  for (const job of [...cooking]) {
    if (!job.chip.isConnected) { cooking.delete(job); continue; }
    const warm = heatNearby(job.chip);
    const rate = warm ? 2.2 : 1;                       // warmth roughly doubles it
    job.done += (now - (job.last ?? now)) * rate;
    job.last = now;
    const p = Math.min(1, job.done / job.ms);
    job.chip.style.setProperty('--p', (p * 100).toFixed(1) + '%');
    if (warm && !job.toldWarm) {
      job.toldWarm = true;
      toast(`Warmth from the ${warm} is speeding it up`);
    }
    if (p >= 1) {
      cooking.delete(job);
      job.chip.classList.remove('cooking');
      sfx.done();
      resolve(job.r, [job.chip]);
      updateWaiting();
    }
  }
  requestAnimationFrame(tickCooking);
}
requestAnimationFrame(tickCooking);

function updateWaiting() {
  const el = document.getElementById('waiting');
  el.textContent = cooking.size ? `${cooking.size} resting` : '';
  el.style.display = cooking.size ? '' : 'none';
}

// ---------- provenance: what is this actually made of? ----------
const startersSet = new Set(STARTERS);
const bestRecipe = new Map();
(function () {
  const unlockOf = Object.fromEntries(verbs.map(v => [v.id, v.unlockedBy]));
  const cost = new Map([...startersSet].map(s => [s, new Set()]));
  for (let pass = 0; pass < 60; pass++) {
    let changed = false;
    DATA.recipes.forEach((r, i) => {
      const parts = [...r.in];
      if (r.verb && unlockOf[r.verb]) parts.push(unlockOf[r.verb]);
      if (!parts.every(x => cost.has(x))) return;
      const set = new Set([i]);
      for (const x of parts) for (const c of cost.get(x)) set.add(c);
      const cur = cost.get(r.out);
      if (!cur || set.size < cur.size) { cost.set(r.out, set); bestRecipe.set(r.out, r); changed = true; }
    });
    if (!changed) break;
  }
})();

const memo = new Map();
function expanded(id) {
  if (startersSet.has(id)) return { steps: 0, leaves: 1 };
  if (memo.has(id)) return memo.get(id);
  memo.set(id, { steps: 0, leaves: 1 });
  const r = bestRecipe.get(id);
  if (!r) return { steps: 0, leaves: 1 };
  let steps = 1, leaves = 0;
  for (const i of r.in) { const s = expanded(i); steps += s.steps; leaves += s.leaves; }
  const out = { steps, leaves }; memo.set(id, out); return out;
}
function distinctOf(id) {
  const seen = new Set(), stack = [id];
  while (stack.length) {
    const x = stack.pop();
    if (seen.has(x)) continue;
    seen.add(x);
    const r = bestRecipe.get(x);
    if (r) stack.push(...r.in);
  }
  return seen;
}
function leafTally(id) {
  const t = new Map();
  (function walk(x) {
    if (startersSet.has(x)) { t.set(x, (t.get(x) ?? 0) + 1); return; }
    const r = bestRecipe.get(x);
    if (r) r.in.forEach(walk);
  })(id);
  return t;
}
// A deep tree (blue cheese runs to ~100 crafts) is unreadable on a phone, so
// anything past AUTO_DEPTH starts folded and opens on tap.
const AUTO_DEPTH = 4;
function subtreeSize(id) { return expanded(id).steps + 1; }
function treeHTML(id, depth) {
  const r = bestRecipe.get(id), e = byId[id];
  const v = r && r.verb ? verbs.find(x => x.id === r.verb) : null;
  const hidden = r && depth >= AUTO_DEPTH;
  const n = r ? subtreeSize(id) - 1 : 0;
  const row = `<div class="prow${depth === 0 ? ' root' : ''}${r ? ' has' : ''}"${r ? ' data-fold' : ''}>` +
              `${r ? `<span class="tw">${hidden ? '▸' : '▾'}</span>` : '<span class="tw dot">·</span>'}` +
              `<span class="pe">${e.emoji}</span><span class="pn">${e.name}</span>` +
              (hidden && n ? `<span class="more">+${n}</span>` : '') +
              (v ? `<span class="pv">${v.emoji} ${v.name}</span>` : '') + `</div>`;
  const kids = r ? `<ul${hidden ? ' class="fold"' : ''}>${r.in.map(i => treeHTML(i, depth + 1)).join('')}</ul>` : '';
  return `<li>${row}${kids}</li>`;
}

// ---- bedrock: what the starters are actually made of ----
const BED = DATA.bedrock;
const atomById = Object.fromEntries(BED.atoms.map(a => [a.id, a]));
const compById = Object.fromEntries(BED.compounds.map(c => [c.id, c]));
function atomsUnder(id, seen = new Set(), out = new Set()) {
  if (atomById[id]) { out.add(id); return out; }
  if (seen.has(id)) return out;
  seen.add(id);
  for (const x of (compById[id]?.of ?? [])) atomsUnder(x, seen, out);
  return out;
}
// ---- ball-and-stick renderer ----
// Structure is authored data, not derived: a formula cannot tell you a shape.
function moleculeSVG(id, size = 190) {
  const st = BED.structures?.[id];
  if (!st) return '';
  const R = { H: 0.30, C: 0.44, N: 0.42, O: 0.40, S: 0.52 };
  const xs = st.atoms.map(a => a[1]), ys = st.atoms.map(a => a[2]);
  const pad = 0.7;
  const minX = Math.min(...xs) - pad, maxX = Math.max(...xs) + pad;
  const minY = Math.min(...ys) - pad, maxY = Math.max(...ys) + pad;
  const w = maxX - minX, h = maxY - minY;
  const k = size / Math.max(w, h);
  const X = x => (x - minX) * k, Y = y => (maxY - y) * k;

  let out = `<svg class="mol" viewBox="0 0 ${w * k} ${h * k}" width="${w * k}" height="${h * k}">`;
  for (const [i, j, order] of st.bonds) {
    const [, x1, y1] = st.atoms[i], [, x2, y2] = st.atoms[j];
    if (order === 2) {
      const dx = Y(y2) - Y(y1), dy = X(x1) - X(x2);
      const L = Math.hypot(dx, dy) || 1, ox = (dx / L) * 3.2, oy = (dy / L) * 3.2;
      out += `<line x1="${X(x1)+ox}" y1="${Y(y1)+oy}" x2="${X(x2)+ox}" y2="${Y(y2)+oy}" class="bond"/>`;
      out += `<line x1="${X(x1)-ox}" y1="${Y(y1)-oy}" x2="${X(x2)-ox}" y2="${Y(y2)-oy}" class="bond"/>`;
    } else {
      out += `<line x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}" class="bond"/>`;
    }
  }
  for (const [el, x, y] of st.atoms) {
    const r = (R[el] ?? 0.4) * k;
    const fill = BED.cpk[el];
    const dark = el === 'C' || el === 'N';
    out += `<circle cx="${X(x)}" cy="${Y(y)}" r="${r}" fill="${fill}" class="ball"/>`;
    out += `<text x="${X(x)}" y="${Y(y)}" class="lbl" fill="${dark ? '#fff' : '#1a1a1a'}" ` +
           `style="font-size:${r * 1.15}px">${el}</text>`;
  }
  return out + '</svg>';
}

function atomTile(a, small) {
  return `<span class="atom ${a.category}" title="${a.name}">` +
         `<span class="sym">${a.symbol}</span><span class="z">${a.number}</span></span>`;
}
function bedTreeHTML(id) {
  const a = atomById[id];
  if (a) return `<li><div class="brow">${atomTile(a)}<span>${a.name}</span>` +
                `<i class="cat">${a.category}</i></div></li>`;
  const c = compById[id];
  if (!c) return '';
  const node = c.kind === 'particle'
    ? `<span class="particle">✦ ${c.name}</span>`
    : `<span class="hex">${c.name}</span>`;
  return `<li><div class="brow">${node}</div>` +
         (c.of.length ? `<ul>${c.of.map(bedTreeHTML).join('')}</ul>` : '') + `</li>`;
}

// ---- periodic table ----
const PT_GAPS = { 2: 10, 5: 10, 13: 10, 31: 10, 57: 0, 72: 0 };  // where a row jumps
function periodicHTML() {
  const inPlay = new Set(BED.atoms.filter(a => a.inPlay).map(a => a.id));
  const cats = [...new Set(BED.atoms.map(a => a.category))];
  let h = `<p class="none" style="text-align:left;padding:0 0 6px">` +
          `Shape says what a thing is; colour says which kind. ` +
          `The ${inPlay.size} lit tiles are the ones this world is actually built from.</p>`;
  h += `<div class="legend">` + cats.map(c =>
        `<span style="background:var(--${c})">${c}</span>`).join('') + `</div>`;
  h += '<div class="ptab">';
  for (const a of BED.atoms) {
    if (PT_GAPS[a.number] !== undefined && PT_GAPS[a.number] > 0)
      h += `<div class="gap" style="--n:${PT_GAPS[a.number]}"></div>`;
    if (a.number === 57 || a.number === 89) h += `<div class="gap" style="--n:18"></div>`;
    h += `<span class="atom ${a.category}${inPlay.has(a.id) ? '' : ' off'}" ` +
         `title="${a.number} ${a.name}"><span class="sym">${a.symbol}</span>` +
         `<span class="z">${a.number}</span></span>`;
  }
  h += '</div>';
  h += `<h2>In play · ${inPlay.size}</h2><div class="shelf">` +
       BED.atoms.filter(a => a.inPlay).map(a =>
         `<span class="chip" data-atom="${a.id}">${atomTile(a)}&nbsp;${a.name}</span>`).join('') +
       `</div>`;
  h += `<h2>Compounds · ${BED.compounds.length}</h2><div class="shelf" style="gap:7px">` +
       BED.compounds.map(c => c.kind === 'particle'
         ? `<span class="particle" data-atom="${c.id}">✦ ${c.name}</span>`
         : `<span class="hex" data-atom="${c.id}">${c.name}</span>`).join('') + `</div>`;
  return h;
}
const aminoById = Object.fromEntries((BED.aminos ?? []).map(a => [a.id, a]));
const fmt = (f) => String(f).replace(/(\d+)/g, '<sub>$1</sub>');
function showAtom(id) {
  const a = atomById[id], c = compById[id] ?? aminoById[id];
  const node = a ? atomTile(a) : c.kind === 'particle'
    ? `<span class="particle">✦ ${c.name}</span>` : `<span class="hex">${c.name}</span>`;
  document.getElementById('sheetBody').innerHTML =
    `<div class="phead">${a ? `<div style="margin-bottom:8px">${node}</div>` : `<div style="margin-bottom:8px">${node}</div>`}
       <h3>${(a ?? c).name}</h3>
       <div class="pnums">${a ? `element ${a.number} · ${a.category}` : 'compound'}</div></div>
     ${BED.structures?.[id] ? `<div class="molbox">${moleculeSVG(id)}</div>` : ''}
     ${(a ?? c)?.formula ? `<div class="formula">${fmt((a ?? c).formula)}</div>` : ''}
     <p class="why">${(a ?? c).fact ?? 'Not yet written up — this one is reference only for now.'}</p>
     ${c && c.variants ? `<h2>All twenty</h2><div class="aagrid">${c.variants.map(v => {
        const aa = BED.aminos.find(x => x.id === v);
        return `<span class="aa" data-atom="${aa.id}"><b>${aa.code1}</b>` +
               `<span class="aatx"><em>${aa.name}</em><i>${fmt(aa.formula)}</i></span></span>`;
        }).join('')}</div>` : ''}
     ${c && c.of.length ? `<h2>Made of</h2><ul class="tree bed">${c.of.map(bedTreeHTML).join('')}</ul>` : ''}
     <a class="src" href="${(a ?? c).src}" target="_blank" rel="noopener">Check this</a>`;
  openSheet((a ?? c).name);
}
function bedrockHTML(tally) {
  const leaves = [...tally.keys()].filter(id => BED.composition[id]);
  if (!leaves.length) return '';
  const atoms = new Set();
  for (const id of leaves) for (const p of BED.composition[id]) for (const a of atomsUnder(p)) atoms.add(a);
  const syms = [...atoms].map(a => atomById[a].symbol);
  return `<div class="bedhead">and below that</div>` +
    leaves.map(id =>
      `<div class="bedgroup"><div class="bedof">${byId[id].emoji} ${byId[id].name} is made of</div>` +
      `<ul class="tree bed">${BED.composition[id].map(bedTreeHTML).join('')}</ul></div>`).join('') +
    `<div class="bedsum">${atoms.size} chemical elements${syms.includes('He') ? ' and starlight' : ''}` +
    `<div class="syms">${syms.map(x => `<i>${x}</i>`).join('')}</div></div>`;
}
// ---- the index entry: what makes this, and what this makes ----
// Little Alchemy's own hints site draws about as much traffic as the game.
// Stuck is the highest-intent moment a player has, so serve it here — but
// only with what they have already found, plus an honest count of the rest.
// A recipe book, not an answer key.
function gestureHTML(r) {
  const v = r.verb ? verbs.find(x => x.id === r.verb) : null;
  const part = (id) => `<span class="g" data-entry="${id}">${byId[id].emoji} ${byId[id].name}</span>`;
  return v ? `${part(r.in[0])}<em>${v.emoji} ${v.name}</em>`
           : `${part(r.in[0])}<em>+</em>${part(r.in[1])}`;
}
function showEntry(id) {
  const e = byId[id], f = familyOf(e);
  const routesIn  = DATA.recipes.filter(r => r.out === id);
  const knownIn   = routesIn.filter(r => r.in.every(i => found.has(i)));
  const usedIn    = DATA.recipes.filter(r => r.in.includes(id));
  const knownOut  = usedIn.filter(r => found.has(r.out));
  const hiddenIn  = routesIn.length - knownIn.length;
  const hiddenOut = usedIn.length - knownOut.length;
  const rows = (list, cls) => list.map(r =>
    `<div class="ent ${cls}">${gestureHTML(r)}<span class="arw">→</span>` +
    `<span class="g out" data-entry="${r.out}">${byId[r.out].emoji} ${byId[r.out].name}</span></div>`).join('');

  document.getElementById('sheetBody').innerHTML = `
    <div class="phead fam-${f.id}">
      <span class="big">${e.emoji}</span><h3>${e.name}</h3>
      <div class="pnums">${f.name}${e.terminal ? ' · nothing is made from this' : ''}</div>
      <div class="pfrom">${e.fact}</div>
    </div>
    <div class="cardrow" style="margin:0 0 10px">
      <button class="ghost" data-trace="${id}">Where it came from</button>
      ${found.has(id) ? `<button class="ghost" data-put="${id}">Put on the bench</button>` : ''}
    </div>
    <h2>Made from${knownIn.length ? ` · ${knownIn.length}` : ''}</h2>
    ${knownIn.length ? rows(knownIn, 'in') : '<p class="none">You have not found a way to make this yet.</p>'}
    ${hiddenIn > 0 ? `<p class="hint2">${hiddenIn} other way${hiddenIn === 1 ? '' : 's'} to make it ${hiddenIn === 1 ? 'exists' : 'exist'}.</p>` : ''}
    <h2>Makes${knownOut.length ? ` · ${knownOut.length}` : ''}</h2>
    ${knownOut.length ? rows(knownOut, 'out') : '<p class="none">Nothing yet.</p>'}
    ${hiddenOut > 0 ? `<p class="hint2">${hiddenOut} more thing${hiddenOut === 1 ? '' : 's'} can be made with it.</p>` : ''}`;
  openSheet(e.name);
}

// Constructing beats studying roughly 2:1 across four meta-analyses, and
// requiring an effortful guess before the reveal cut illusion-of-understanding
// at d = 0.69. So the chain does not simply unroll — you commit first, once,
// the first time you trace a given thing.
const guessed = new Set();
function askFirst(id, then) {
  const x = expanded(id);
  const truth = x.leaves;
  const opts = [...new Set([
    Math.max(2, Math.round(truth * 0.35)),
    truth,
    Math.round(truth * 2.1) + 1,
  ])].sort((a, b) => a - b);
  document.getElementById('sheetBody').innerHTML = `
    <div class="guess">
      <div class="big">${byId[id].emoji}</div>
      <h3>Before you look</h3>
      <p>How many raw things — stone, water, sun, seed — do you think went into
         one ${byId[id].name.toLowerCase()}?</p>
      <div class="opts">${opts.map(o => `<button data-guess="${o}">${o}</button>`).join('')}</div>
      <button class="skip" data-guess="skip">Just show me</button>
    </div>`;
  openSheet('A guess first');
  document.getElementById('sheetBody').querySelectorAll('[data-guess]').forEach(b => b.onclick = () => {
    const g = b.dataset.guess;
    guessed.add(id);
    if (g !== 'skip') {
      const n = Number(g);
      lastGuess = { n, truth, right: n === truth };
      (n === truth ? sfx.discover : sfx.pick)();
    } else lastGuess = null;
    then();
  });
}
let lastGuess = null;

function showProvenance(id) {
  if (!guessed.has(id) && expanded(id).leaves > 3) return askFirst(id, () => showProvenance(id));
  const x = expanded(id), d = distinctOf(id).size, t = leafTally(id), e = byId[id];
  document.getElementById('sheetBody').innerHTML =
    `<div class="phead"><div class="big">${e.emoji}</div><h3>${e.name}</h3>
       <div class="pnums"><b>${x.leaves}</b> raw inputs · <b>${d}</b> distinct ingredients · <b>${x.steps}</b> crafts</div>
       ${lastGuess ? `<div class="verdict ${lastGuess.right ? 'hit' : 'miss'}">${
         lastGuess.right ? 'You called it exactly.'
         : `You guessed ${lastGuess.n}. It takes ${lastGuess.truth}.`}</div>` : ''}
       <div class="pfrom">Bottoms out in ${[...t].sort((a,b)=>b[1]-a[1])
         .map(([k,n]) => `${byId[k].emoji} ${byId[k].name} ×${n}`).join(' · ')}</div></div>
     <ul class="tree">${treeHTML(id, 0)}</ul>
     ${bedrockHTML(t)}`;
  openSheet('Where it came from');
  lastGuess = null;
}

// ---------- codex ----------
// Rebuilding the whole sheet on every keystroke destroys the input and resets
// the caret to position 0, which makes typed text come out reversed. Build the
// chrome once; only the results list is re-rendered.
function codexResults(q) {
  const hits = elements.filter(e => found.has(e.id) &&
    (!q || e.name.toLowerCase().includes(q.toLowerCase())));
  if (!hits.length) return '<p class="none">Nothing found.</p>';
  return FAMILIES.map(f => [f, hits.filter(e => familyOf(e).id === f.id)])
    .filter(([, g]) => g.length)
    .sort((a, b) => (a[0].id === 'myth') - (b[0].id === 'myth'))
    .map(([f, g]) =>
      `<h2 class="fam-${f.id}"><i></i>${f.name} · ${g.length}</h2><div class="shelf">` +
      g.map(e => `<span class="chip fam-${f.id}" data-fam="${f.id}" data-entry="${e.id}">${chipHTML(e)}</span>`).join('') +
      `</div>`).join('');
}
function showCodex(q = '') {
  document.getElementById('sheetBody').innerHTML =
    `<input id="q" class="search" placeholder="Search your discoveries…" value="${q}" autocomplete="off">` +
    `<div class="cardrow" style="margin:10px 0 2px">` +
    `<button class="ghost" id="ptBtn">Periodic table</button>` +
    `<button class="ghost" id="aaBtn">Amino acids</button></div>` +
    `<div id="codexList">${codexResults(q)}</div>`;
  openSheet(`Codex · ${found.size} of ${elements.length}`);
  document.getElementById('ptBtn').onclick = () => {
    document.getElementById('sheetBody').innerHTML = periodicHTML();
    openSheet('The periodic table');
  };
  document.getElementById('aaBtn').onclick = () => showAtom('amino_acid');
  const box = document.getElementById('q');
  box.oninput = () => { document.getElementById('codexList').innerHTML = codexResults(box.value); };
  if (q) box.focus();
}

function openSheet(title) {
  document.getElementById('sheetTitle').textContent = title;
  document.getElementById('sheet').classList.add('on');
}
document.getElementById('sheet').addEventListener('click', ev => {
  const fold = ev.target.closest('[data-fold]');
  if (fold) {
    const ul = fold.parentElement.querySelector(':scope > ul');
    if (ul) {
      const now = ul.classList.toggle('fold');
      fold.querySelector('.tw').textContent = now ? '▸' : '▾';
      const more = fold.querySelector('.more');
      if (more) more.style.display = now ? '' : 'none';
    }
    return;
  }
  if (ev.target.id === 'sheet' || ev.target.id === 'sheetClose')
    ev.currentTarget.classList.remove('on');
  const en = ev.target.closest('[data-entry]');
  if (en && found.has(en.dataset.entry)) return showEntry(en.dataset.entry);
  const put = ev.target.closest('[data-put]');
  if (put) { document.getElementById('sheet').classList.remove('on'); benchTouched = true; return spawn(put.dataset.put); }
  const t = ev.target.closest('[data-trace]');
  if (t) showProvenance(t.dataset.trace);
  const at = ev.target.closest('[data-atom]');
  if (at) showAtom(at.dataset.atom);
});
document.getElementById('count').addEventListener('click', () => showCodex());

// ---------- shelf + buttons ----------
// Tapping a shelf chip drops it on the bench; dragging one carries it to a spot
// you choose. Both work, because on a phone a tap is quicker and on a desktop a
// drag is what the hand expects.
let shelfDrag = null;
document.getElementById('aside').addEventListener('pointerdown', ev => {
  const c = ev.target.closest('[data-spawn]');
  if (!c) return;
  shelfDrag = { id: c.dataset.spawn, x: ev.clientX, y: ev.clientY, moved: false, ghost: null };
});
addEventListener('pointermove', ev => {
  if (!shelfDrag) return;
  if (!shelfDrag.moved && Math.hypot(ev.clientX - shelfDrag.x, ev.clientY - shelfDrag.y) < 7) return;
  if (!shelfDrag.moved) {
    shelfDrag.moved = true;
    const e = byId[shelfDrag.id];
    const g = document.createElement('div');
    g.className = `chip board drag fam-${familyOf(e).id}`;
    g.style.position = 'fixed'; g.style.pointerEvents = 'none'; g.style.zIndex = 400;
    g.innerHTML = chipHTML(e);
    document.body.appendChild(g);
    shelfDrag.ghost = g;
  }
  shelfDrag.ghost.style.left = (ev.clientX - 40) + 'px';
  shelfDrag.ghost.style.top  = (ev.clientY - 18) + 'px';
});
addEventListener('pointerup', ev => {
  if (!shelfDrag) return;
  const { id, moved, ghost } = shelfDrag; shelfDrag = null;
  ghost?.remove();
  benchTouched = true;
  // Ask what is actually under the pointer rather than trusting a measured
  // rectangle — the board reports zero size in some embedded contexts, and a
  // drop that silently does nothing is the worst possible failure here.
  const under = document.elementFromPoint(ev.clientX, ev.clientY);
  const offBoard = under && under.closest && under.closest('#aside, #tray, header');
  if (moved && !offBoard) {
    const [wx, wy] = toWorld(ev.clientX, ev.clientY);
    const el = spawn(id, wx, wy);
    sfx.pick();
    // dropped onto something? then merge, exactly as if dragged on the bench
    const t = hit(ev.clientX, ev.clientY, el);
    if (t) { t.dataset.verb ? applyProcess(el, t) : applyMerge(el, t); }
  } else if (!moved) {
    spawn(id); sfx.pick();
  }
});
document.getElementById('nudge').addEventListener('click', () => {
  const ul = unlockedVerbs();
  const options = recipes.filter(r =>
    !found.has(r.out) && r.in.every(i => found.has(i)) && (!r.verb || ul.has(r.verb)));
  if (!options.length) return toast('Nothing new is reachable — make something first');
  const r = options[Math.floor(Math.random() * options.length)];
  // Reveal one ingredient only. Finding the partner is the game.
  toast(`Try something with ${byId[r.in[0]].emoji} ${byId[r.in[0]].name}`);
});
document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('Wipe all discoveries?')) return;
  try { localStorage.removeItem(KEY); } catch {}
  location.reload();
});
document.getElementById('card').addEventListener('click', ev => {
  const t = ev.target.closest('[data-trace]');
  if (t) { dismissCard(); return showProvenance(t.dataset.trace); }
  if (ev.target.closest('a')) return;
  // A click opens it out and keeps it there — no timer, no dismiss button.
  const card = ev.currentTarget;
  if (card.classList.contains('mini')) {
    card.classList.remove('mini');
    cardPinned = true;
    clearTimeout(cardT);
  } else {
    dismissCard();
  }
});
document.getElementById('shelfToggle').addEventListener('click', () =>
  document.getElementById('aside').classList.toggle('open'));

// Lay the opening bench out on a grid sized to the board.
let benchTouched = false;
function layOutBench() {
  const r = boardBox();
  const bench = [...world.querySelectorAll('.chip.board')];
  const cols = r.width < 460 ? 2 : bench.length;     // two columns on a phone
  const rows = Math.ceil(bench.length / cols);
  bench.forEach((el, i) => {
    const cx = (i % cols + .5) / cols;
    const cy = (Math.floor(i / cols) + .5) / rows;
    el.style.left = Math.max(6, Math.min(r.width  * (.12 + cx * .76) - el.offsetWidth  / 2, r.width  - el.offsetWidth  - 6)) + 'px';
    el.style.top  = Math.max(6, Math.min(r.height * (.26 + cy * .46) - el.offsetHeight / 2, r.height - el.offsetHeight - 6)) + 'px';
  });
}

// The board's size is not trustworthy on first paint — in an embedded frame it
// can be measured before the viewport settles, which strands every chip in a
// clamped heap. Watch it instead of measuring once, and keep re-laying the
// opening bench until the player actually moves something. After that, only
// clamp strays back into view so a rotation cannot lose them.
new ResizeObserver(() => {
  if (!benchTouched) { layOutBench(); return; }
  const b = board.getBoundingClientRect();
  drawLinks();
}).observe(board);

document.getElementById('introGo').addEventListener('click', () =>
  document.getElementById('intro').classList.add('gone'));
if (found.size > 4) document.getElementById('intro').classList.add('gone');

renderShelf();
// Spawn synchronously. requestAnimationFrame does not fire in a hidden or
// throttled tab, and relying on it meant the board could come up empty.
// The ResizeObserver above lays them out as soon as the board has a size.
[...found].filter(id => byId[id].starter).forEach(id => spawn(id, 0, 0));
layOutBench();
applyView();
</script>
