ing the meatballs in tomato cooks them gently through and pushes their fat and salt back into the sauce.","src":"https://en.wikipedia.org/wiki/Tomato_sauce"},{"in":["pasta","meatball_sauce"],"out":"spaghetti_meatballs","verified":true,"why":"An Italian-American invention. Meat was scarce at home and suddenly cheap in New York, so the portion grew to match.","src":"https://en.wikipedia.org/wiki/Spaghetti_and_meatballs"},{"in":["yoghurt","garlic"],"out":"garlic_yoghurt","supported":true,"why":"Yoghurt's acid and fat blunt raw garlic's edge without cooking it, which is why it can be used raw here and nowhere else.","src":"https://en.wikipedia.org/wiki/Tzatziki"},{"in":["garlic_yoghurt","cucumber"],"out":"tzatziki","verified":true,"why":"Straining the yoghurt first drains the whey and concentrates what is left. That is the whole difference between yoghurt and Greek yoghurt.","src":"https://en.wikipedia.org/wiki/Strained_yogurt"},{"in":["salad","olive"],"out":"olive_salad","supported":true,"why":"Tomato, cucumber and olive ripen within weeks of each other on the same dry ground. The dish is a calendar.","src":"https://en.wikipedia.org/wiki/Greek_salad"},{"in":["olive_salad","cheese"],"out":"greek_salad","verified":true,"why":"No lettuce anywhere in a real horiatiki. It is built from whatever is ripe at the same time in the same soil.","src":"https://en.wikipedia.org/wiki/Greek_salad"},{"in":["flour","beer"],"out":"batter","supported":true,"why":"Beer batter works twice over: the carbon dioxide puffs it, and the alcohol boils off faster than water, so the crust dries and crisps sooner.","src":"https://en.wikipedia.org/wiki/Batter_(cooking)"},{"in":["fish","batter"],"out":"battered_fish","supported":true,"why":"The coat is a sacrificial layer. It takes the violence of the oil so the fish inside never touches it.","src":"https://en.wikipedia.org/wiki/Fried_fish"},{"in":["battered_fish"],"verb":"heat","out":"fried_fish","supported":true,"why":"The batter sets into a shell within seconds and the fish steams inside it. Fried food is mostly steamed food in disguise.","src":"https://en.wikipedia.org/wiki/Fried_fish"},{"in":["chips","fried_fish"],"out":"fish_and_chips","verified":true,"why":"Fried fish came to Britain with Sephardic Jewish refugees; the chip came from France or Belgium. The national dish is entirely imported.","src":"https://en.wikipedia.org/wiki/Fish_and_chips"},{"in":["flour","butter"],"out":"rubbed_flour","supported":true,"why":"Butter is rubbed into flour until it looks like crumbs, coating the grains in fat so water cannot reach them and build gluten.","src":"https://en.wikipedia.org/wiki/Shortcrust_pastry"},{"in":["rubbed_flour","water"],"out":"pastry","supported":true,"why":"Only just enough water to bind. In the oven the water in the butter flashes to steam and shoves the layers apart.","src":"https://en.wikipedia.org/wiki/Shortcrust_pastry"},{"in":["mince","salt"],"out":"cured_mince","supported":true,"why":"Salt dissolves myosin out of the muscle fibres, and that sticky protein is what makes a sausage bind instead of crumble.","src":"https://en.wikipedia.org/wiki/Sausage"},{"in":["cured_mince","herb"],"out":"sausage","supported":true,"why":"Sausage began as a way to use every scrap and make it keep. Salt, fat and a casing turn offcuts into something that travels.","src":"https://en.wikipedia.org/wiki/Sausage"},{"in":["boiled_egg","mayonnaise"],"out":"egg_mayo","supported":true,"why":"Yolk bound in an emulsion made of yolk. The mayonnaise carries salt and acid into a filling that is otherwise very plain.","src":"https://en.wikipedia.org/wiki/Egg_salad"},{"in":["egg_mayo","bread"],"out":"egg_sandwich","supported":true,"why":"Named for a man who would not leave the card table long enough to eat properly. The story is probably true.","src":"https://en.wikipedia.org/wiki/Sandwich"},{"in":["chilli","garlic"],"out":"kimchi_paste","supported":true,"why":"Chilli and garlic ground together. Neither preserves the cabbage — the salt and the bacteria do that — but they decide what it tastes like.","src":"https://en.wikipedia.org/wiki/Kimchi"},{"in":["cabbage","brine"],"out":"salted_cabbage","supported":true,"why":"Brining draws water out of the leaves until they go limp, which lets the paste reach every surface and gives lactobacilli a head start.","src":"https://en.wikipedia.org/wiki/Kimchi"},{"in":["salted_cabbage","kimchi_paste"],"out":"kimchi","supported":true,"why":"The same lactic fermentation as sauerkraut, run cold and slow. Buried through winter, it keeps for months.","src":"https://en.wikipedia.org/wiki/Kimchi"},{"in":["sprout","sun"],"out":"seedling","verified":true,"why":"Light flips a switch: within hours the pale sprout converts its stored protochlorophyllide into chlorophyll, greens, opens its seed leaves and starts feeding itself.","src":"https://en.wikipedia.org/wiki/Etiolation"},{"in":["clay","sand"],"out":"tempered_clay","verified":true,"why":"Sand is temper: a non-plastic grit stirred into clay so it shrinks less and does not crack as it dries and fires. Potters have used sand, shell, ash and crushed pottery for the same job.","src":"https://en.wikipedia.org/wiki/Temper_(pottery)"},{"in":["tempered_clay"],"verb":"heat","out":"stoneware","verified":true,"why":"Without temper a thick wall shrinks unevenly and splits in the kiln. With it you can fire bigger, harder vessels — hard enough to hold water with no glaze at all.","src":"https://en.wikipedia.org/wiki/Stoneware"},{"in":["sea","stone"],"out":"limestone","supported":true,"why":"Limestone is compacted seabed: the shells and skeletons of sea creatures, piled up and pressed for millions of years.","src":"https://en.wikipedia.org/wiki/Limestone"},{"in":["limestone","clay"],"out":"cement_meal","verified":true,"why":"The two ingredients of Portland cement — limestone for its calcium, clay for the alumino-silicates. Sand and clay alone will never set.","src":"https://en.wikipedia.org/wiki/Portland_cement"},{"in":["cement_meal"],"verb":"heat","out":"cement","verified":true,"why":"Above 600 °C the limestone gives up its carbon dioxide; near 1,450 °C the mix fuses into clinker. Making cement is about a tenth of all human CO₂ emissions.","src":"https://en.wikipedia.org/wiki/Portland_cement"},{"in":["cement","sand"],"out":"mortar","verified":true,"why":"Cement paste is the glue; the sand is filler that stops it cracking as it shrinks. Sand binds nothing — it is the thing being bound.","src":"https://en.wikipedia.org/wiki/Mortar_(masonry)"},{"in":["mortar","stone"],"out":"concrete","verified":true,"why":"Concrete is aggregate glued by cement paste. The rock carries the load; the cement only holds it in place — which is why sand plus clay is not concrete.","src":"https://en.wikipedia.org/wiki/Concrete"},{"in":["water","stone"],"out":"river","verified":true,"why":"Running water cuts rock and carries the dissolved minerals away with it. River water is already slightly salty — roughly a three-hundredth of seawater, too faint to taste.","src":"https://en.wikipedia.org/wiki/River"},{"in":["river"],"verb":"wait","out":"sea","verified":true,"why":"Rivers deliver dissolved minerals to one place for four billion years, and only the water ever leaves again. The sea is salty because evaporation takes the water and leaves the salt behind.","src":"https://en.wikipedia.org/wiki/Seawater"},{"in":["leaf"],"verb":"wait","out":"soil","verified":true,"why":"The other way soil is made: fallen leaves rotted down by fungi and worms into humus. Weathered rock supplies the minerals, dead plants supply everything else.","src":"https://en.wikipedia.org/wiki/Humus"},{"in":["grain","water"],"out":"sprout","supported":true,"why":"A grain is a seed we usually eat before it can start. Wet it instead and it does what it was always going to do.","src":"https://en.wikipedia.org/wiki/Germination"},{"in":["seedling","water"],"out":"plant","supported":true,"why":"Water is not just drunk — it holds the plant up. A wilting seedling is one whose cells have lost their internal pressure.","src":"https://en.wikipedia.org/wiki/Photosynthesis"},{"in":["soil"],"verb":"wait","out":"grass","verified":true,"why":"Leave bare soil alone and grass arrives without being asked. Wind-blown seed and fast germination make grasses the first thing to claim open ground.","src":"https://en.wikipedia.org/wiki/Ecological_succession"},{"in":["grain","soil"],"out":"wheat","supported":true,"why":"Sowing, rather than gathering. Keeping back part of the harvest to plant is the single decision agriculture is built on.","src":"https://en.wikipedia.org/wiki/Wheat"},{"in":["harvest"],"verb":"crush","out":"grain","supported":true,"why":"Threshing by flail: beat the sheaves until the grain falls out. Cutting works too, but crushing is what most of the world actually did.","src":"https://en.wikipedia.org/wiki/Threshing"},{"in":["field"],"verb":"wait","out":"pasture","verified":true,"why":"A field left fallow goes back to grass within a season, and the grazing animals that follow return nitrogen to it. That cycle fed Europe for a thousand years.","src":"https://en.wikipedia.org/wiki/Crop_rotation"},{"in":["herb"],"verb":"wait","out":"flower","supported":true,"why":"Herbs flower if you let them, and most cooks would rather they did not — the leaves turn bitter once the plant switches to making seed.","src":"https://en.wikipedia.org/wiki/Flower"},{"in":["fruit","soil"],"out":"tree","supported":true,"why":"A fallen fruit is a seed with its own compost heap wrapped around it. This is what fruit was for, long before anyone picked one.","src":"https://en.wikipedia.org/wiki/Tree"},{"in":["flower","grass"],"out":"meadow","supported":true,"why":"Grass alone is a lawn. Grass with flowers in it is a meadow, and the difference is most of the insect life.","src":"https://en.wikipedia.org/wiki/Meadow"},{"in":["nectar"],"verb":"wait","out":"bee","supported":true,"why":"You do not need to fetch pollinators. Put out enough sugar and they find it — bees locate new forage within hours.","src":"https://en.wikipedia.org/wiki/Western_honey_bee"},{"in":["pasture","meadow"],"out":"aurochs","supported":true,"why":"Open grassland with no large grazer on it does not stay empty for long. Wild cattle followed the grass across Eurasia without any help from us.","src":"https://en.wikipedia.org/wiki/Aurochs"},{"in":["aurochs","pasture"],"out":"cow","supported":true,"why":"Domestication was less capture than management: keep the calmest animals on the best grass and let the rest go.","src":"https://en.wikipedia.org/wiki/Cattle"},{"in":["ice"],"verb":"wait","out":"river","verified":true,"why":"Half the world's great rivers begin as ice. Glacial meltwater also carries rock flour — ground stone so fine it turns the water milky blue.","src":"https://en.wikipedia.org/wiki/Meltwater"},{"in":["river","river"],"out":"sea","supported":true,"why":"Rivers only ever join. Every one of them ends in the same place, and none of the salt they carry ever leaves.","src":"https://en.wikipedia.org/wiki/Seawater"},{"in":["tree"],"verb":"wait","out":"fruit","supported":true,"why":"Most fruit trees need no help at all — wind and resident insects do the pollinating, and the tree fruits on its own schedule.","src":"https://en.wikipedia.org/wiki/Pollination"},{"in":["grain","stone"],"out":"flour","supported":true,"why":"Two stones and a circular motion. The saddle quern is thirty thousand years old and still grinds flour in parts of the world today.","src":"https://www.smithsonianmag.com/smart-news/flour-was-part-human-diet-32000-years-ago-180956675/"},{"in":["sea"],"verb":"heat","out":"salt","verified":true,"why":"Where there is no reliable sun, you boil it off instead. Northern Europe made its salt this way for centuries, burning enormous quantities of wood.","src":"https://en.wikipedia.org/wiki/Salt_evaporation_pond"},{"in":["grape"],"verb":"wait","out":"yeast","supported":true,"why":"The white bloom on a grape is not dust. It is a yeast colony, sitting on the sugar, waiting for the skin to break.","src":"https://en.wikipedia.org/wiki/Saccharomyces_cerevisiae"},{"in":["pasture","stone"],"out":"goat","supported":true,"why":"Goats browse rather than graze, and take scrub and steep rock that would starve a cow. That is why they reached mountains and islands first.","src":"https://en.wikipedia.org/wiki/Goat"},{"in":["goat","grass"],"out":"milk","supported":true,"why":"Goat's milk has smaller fat globules that never really separate, which is why it does not give cream but does make excellent cheese.","src":"https://en.wikipedia.org/wiki/Dairy_cattle"},{"in":["goat"],"verb":"cut","out":"meat","supported":true,"why":"Goat is the most widely eaten red meat on Earth, and almost absent from Western kitchens.","src":"https://en.wikipedia.org/wiki/Bone"},{"in":["plant","wood"],"out":"vine","supported":true,"why":"A vine will climb anything rigid. Dead wood does the job as well as a living trunk and does not compete for light.","src":"https://en.wikipedia.org/wiki/Vine"},{"in":["flour","milk"],"out":"dough","supported":true,"why":"Enriched dough. The fat in milk coats the flour and shortens the gluten strands, giving a softer crumb than water ever will.","src":"https://en.wikipedia.org/wiki/Gluten"},{"in":["field"],"verb":"cut","out":"straw","supported":true,"why":"What is left standing after the grain is taken. For most of history the straw was worth nearly as much as the crop.","src":"https://en.wikipedia.org/wiki/Straw"},{"in":["seedling","soil"],"out":"root","supported":true,"why":"Roots go looking. They grow towards moisture and away from light, testing the soil as they go.","src":"https://en.wikipedia.org/wiki/Mycorrhiza"},{"in":["egg"],"verb":"wait","out":"chicken","verified":true,"why":"Twenty-one days at 37.5 °C, turned several times a day. The egg came first — birds' ancestors were laying them for two hundred million years before anything was a chicken.","src":"https://en.wikipedia.org/wiki/Chicken"},{"in":["chicken","seed"],"out":"egg","supported":true,"why":"A well-fed hen lays almost daily whether or not there is a rooster. The egg is not waiting to be fertilised; it is simply what she does.","src":"https://en.wikipedia.org/wiki/Eggshell"},{"in":["flint","stone"],"out":"spark","supported":true,"why":"Flint alone will not spark. Strike it against iron pyrite or steel and it shaves off metal fine enough to burn in air.","src":"https://en.wikipedia.org/wiki/Fire_making"},{"in":["vine","sun"],"out":"grape","supported":true,"why":"Sugar in a grape is accumulated sunlight, and how much of it there is decides everything the wine will become.","src":"https://en.wikipedia.org/wiki/Brix"},{"in":["milk"],"verb":"chill","out":"cream","supported":true,"why":"Cold makes the fat globules clump and rise faster. Every dairy before the centrifuge simply put the milk somewhere cool and waited.","src":"https://en.wikipedia.org/wiki/Cream"},{"in":["tree","flint"],"out":"wood","supported":true,"why":"A flint axe fells a tree slowly but genuinely. Experiments have taken down a mature pine in about half an hour.","src":"https://en.wikipedia.org/wiki/Wood"},{"in":["grape"],"verb":"ferment","out":"wine","supported":true,"why":"Whole-berry fermentation: the fruit is not pressed first, and the yeast on the skins gets to the sugar inside on its own.","src":"https://en.wikipedia.org/wiki/Fermentation_in_winemaking"},{"in":["clay","water"],"out":"mud","supported":true,"why":"Clay holds water rather than letting it drain, which is why clay soil turns to mud and stays that way.","src":"https://en.wikipedia.org/wiki/Mud"},{"in":["tree","stone"],"out":"olive","supported":true,"why":"Olives fruit best on thin, stony ground. Rich soil gives you a large tree and disappointing oil.","src":"https://en.wikipedia.org/wiki/Olive"},{"in":["risen_dough","fire"],"out":"bread","supported":true,"why":"Before ovens there was a hot stone and a covering pot. The bread does not care where the heat comes from.","src":"https://en.wikipedia.org/wiki/Bread"},{"in":["wood","wood"],"out":"fire","verified":true,"why":"Friction, not percussion: spin a hardwood spindle against a softer board and the dust you grind off ignites at around 400 °C.","src":"https://en.wikipedia.org/wiki/Fire_making"},{"in":["river","stone"],"out":"sand","why":"A river is a rock mill. Tumbling stones grind each other down, and what survives the journey is quartz sand.","supported":true,"src":"https://en.wikipedia.org/wiki/Sand"},{"in":["river","soil"],"out":"clay","why":"The finest particles a river carries settle last, where the water finally goes still. That deposit is clay.","supported":true,"src":"https://en.wikipedia.org/wiki/Clay"},{"in":["clay","straw"],"out":"adobe","why":"Straw stops the block cracking as it shrinks. Clay works as well as mud and holds its shape better.","supported":true,"src":"https://en.wikipedia.org/wiki/Adobe"},{"in":["adobe"],"verb":"heat","out":"brick","why":"Fire the block instead of drying it and the change is permanent. A fired brick survives rain; a mud one dissolves in it.","supported":true,"src":"https://en.wikipedia.org/wiki/Mudbrick"},{"in":["tempered_clay","fire"],"out":"pot","why":"An open fire reaches perhaps 700 °C — enough for earthenware if the clay is tempered, which is how pottery began.","supported":true,"src":"https://en.wikipedia.org/wiki/Pottery"},{"in":["sand"],"verb":"heat","out":"glass","why":"Without a flux you need about 1700 °C. Lightning strikes sand and makes glass this way — fulgurites, fused in an instant.","supported":true,"src":"https://en.wikipedia.org/wiki/Forest_glass"},{"in":["sea","salt"],"out":"brine","why":"Seawater strengthened with more salt. Strong brine floats an egg, which is how it was tested before anyone had a hydrometer.","supported":true,"src":"https://en.wikipedia.org/wiki/Brining"},{"in":["river"],"verb":"chill","out":"ice","why":"Rivers freeze from the surface down, and the ice insulates what is beneath. That is why fish survive winter.","supported":true,"src":"https://en.wikipedia.org/wiki/Properties_of_water"},{"in":["water","fire"],"out":"steam","why":"Water hitting fire flashes to vapour and expands about 1,700 times. That expansion is what every steam engine ever built was harvesting.","supported":true,"src":"https://en.wikipedia.org/wiki/Enthalpy_of_vaporization"},{"in":["limestone"],"verb":"wait","out":"flint","why":"Flint forms as nodules inside chalk and limestone — silica from sponges and plankton, redissolved and set hard in the seabed.","supported":true,"src":"https://en.wikipedia.org/wiki/Flint"},{"in":["straw"],"verb":"heat","out":"charcoal","why":"Any plant matter charred without air leaves carbon behind. Straw and husks make biochar, which farmers dig back into soil.","supported":true,"src":"https://en.wikipedia.org/wiki/Charcoal"},{"in":["straw","fire"],"out":"ash","why":"Straw ash is unusually rich in potassium and silica — good for the soil, and good as a flux for glass.","supported":true,"src":"https://en.wikipedia.org/wiki/Wood_ash"},{"in":["lye","butter"],"out":"soap","why":"Any fat will do. Animal fat with lye gives a harder, faster-lathering soap than olive oil does.","supported":true,"src":"https://en.wikipedia.org/wiki/Castile_soap"},{"in":["tree","water"],"out":"leaf","why":"A large tree moves hundreds of litres a day, pulled up by evaporation from its own leaves. The leaf is both the pump and the leak.","supported":true,"src":"https://en.wikipedia.org/wiki/Stoma"},{"in":["root"],"verb":"chill","out":"bulb","why":"Many bulbs need a cold spell before they will flower — vernalisation. Without a winter, they simply sit.","supported":true,"src":"https://en.wikipedia.org/wiki/Bulb"},{"in":["flower","leaf"],"out":"herb","why":"Most culinary herbs are picked just before flowering, when the aromatic oils in the leaves are at their strongest.","supported":true,"src":"https://en.wikipedia.org/wiki/Essential_oil"},{"in":["leaf","fire"],"out":"tea","why":"Heat is what stops oxidation. Green tea is fired almost immediately; black tea is left to oxidise fully first.","supported":true,"src":"https://en.wikipedia.org/wiki/Tea_processing"},{"in":["tea","steam"],"out":"brewed_tea","why":"Steam and hot water pull out the same compounds. What changes is how fast — and bitterness is mostly a matter of speed.","supported":true,"src":"https://en.wikipedia.org/wiki/Tea"},{"in":["flower","sun"],"out":"nectar","why":"Nectar production tracks sunlight: flowers secrete most on warm bright days, which is exactly when pollinators are flying.","supported":true,"src":"https://en.wikipedia.org/wiki/Nectar"},{"in":["bee"],"verb":"wait","out":"honey","why":"A colony makes far more than it needs. A strong hive can store 25 kg in a season and eat only a fraction of it.","supported":true,"src":"https://en.wikipedia.org/wiki/Honey"},{"in":["beeswax","fire"],"out":"candle","why":"Beeswax burns cleaner and slower than tallow, and does not stink. It was expensive enough that churches used it and households did not.","supported":true,"src":"https://en.wikipedia.org/wiki/Candle_wick"},{"in":["vine","soil"],"out":"cucumber","why":"Cucumbers sprawl as readily as they climb. Left on the ground they grow curved; trellised, they grow straight.","supported":true,"src":"https://en.wikipedia.org/wiki/Cucumber"},{"in":["vine","bee"],"out":"tomato","why":"A tomato flower will not release pollen to wind alone — it needs vibration. Bumblebees buzz at exactly the right frequency to shake it loose.","supported":true,"src":"https://en.wikipedia.org/wiki/Tomato"},{"in":["tree","flower"],"out":"apple","why":"Almost every apple tree needs a different variety flowering nearby. They are largely self-incompatible — an orchard of one clone sets little fruit.","supported":true,"src":"https://en.wikipedia.org/wiki/Apple"},{"in":["grass","mud"],"out":"rice","why":"Puddled mud seals the paddy floor so the water sits rather than draining. That standing water is the whole system.","supported":true,"src":"https://en.wikipedia.org/wiki/Paddy_field"},{"in":["root","straw"],"out":"potato","why":"Earth up the stems with straw and the buried part makes more tubers. The potato grows in the dark, not in the soil's nutrients.","supported":true,"src":"https://en.wikipedia.org/wiki/Tuber"},{"in":["bulb","water"],"out":"onion","why":"Onions swell on long days and steady water. Let them dry out and they bolt to seed instead of bulbing.","supported":true,"src":"https://en.wikipedia.org/wiki/Onion"},{"in":["bulb"],"verb":"chill","out":"garlic","why":"Garlic is planted in autumn because it needs weeks of cold before it will split into cloves. Spring-planted garlic makes one round bulb.","supported":true,"src":"https://en.wikipedia.org/wiki/Allicin"},{"in":["leaf","soil"],"out":"cabbage","why":"Brassicas are hungry feeders. A cabbage is a year of soil nitrogen folded into a ball of leaves.","supported":true,"src":"https://en.wikipedia.org/wiki/Brassica_oleracea"},{"in":["soil","wheat"],"out":"field","why":"A field is a decision as much as a place: this ground, this crop, this year, and nothing else allowed to grow.","supported":true,"src":"https://en.wikipedia.org/wiki/Monoculture"},{"in":["field","flint"],"out":"harvest","why":"Before the iron sickle there was the flint one — serrated blades set into a curved handle with pitch. It works.","supported":true,"src":"https://en.wikipedia.org/wiki/Sickle"},{"in":["sprout"],"verb":"heat","out":"malt","why":"Kilning stops germination at the moment the starch has turned to sugar but before the seedling eats it. Timing is the whole craft.","supported":true,"src":"https://en.wikipedia.org/wiki/Malting"},{"in":["dough","egg"],"out":"pasta_dough","why":"Enrich a plain dough with egg and the protein sets on cooking, so it can be rolled thin enough to see through.","supported":true,"src":"https://en.wikipedia.org/wiki/Pasta"},{"in":["rubbed_flour","milk"],"out":"pastry","why":"Milk instead of water gives a softer, browner pastry — the milk sugars caramelise where water would only steam.","supported":true,"src":"https://en.wikipedia.org/wiki/Shortcrust_pastry"},{"in":["cake_mix","milk"],"out":"cake_batter","why":"Milk loosens the batter so it pours. Too stiff and the trapped air cannot expand; too loose and it escapes.","supported":true,"src":"https://en.wikipedia.org/wiki/Cake"},{"in":["salted_dough","sourdough_starter"],"out":"risen_dough","why":"A starter is slower than baker's yeast but does the same job. The bacteria alongside it add acid the yeast cannot.","supported":true,"src":"https://en.wikipedia.org/wiki/Leavening_agent"},{"in":["flour","grape"],"out":"sourdough_starter","why":"Bakers have long started a culture with fruit — the wild yeast on grape skins is the same organism, just arriving faster.","supported":true,"src":"https://en.wikipedia.org/wiki/Sourdough"},{"in":["dough","fire"],"out":"flatbread","why":"A hot stone at the fire's edge is all it takes. This is bread as it was made for ten thousand years before ovens.","supported":true,"src":"https://en.wikipedia.org/wiki/History_of_bread"},{"in":["risen_dough","sourdough_starter"],"out":"sourdough","supported":true,"why":"Give a yeasted dough a spoonful of starter and you get some of the acid without the long wait. Most commercial \"sourdough\" is exactly this compromise.","src":"https://en.wikipedia.org/wiki/Sourdough"},{"in":["dough"],"verb":"cut","out":"noodle","why":"No egg required. Hand-pulled and knife-cut noodles are made from plain flour and water across most of Asia.","supported":true,"src":"https://en.wikipedia.org/wiki/Lajia"},{"in":["noodle","water"],"out":"pasta","why":"Salted boiling water, and enough of it — the starch released has to go somewhere, or the noodles glue together.","supported":true,"src":"https://en.wikipedia.org/wiki/Starch_gelatinization"},{"in":["cake_batter","fire"],"out":"cake","why":"Before the enclosed oven, cakes were baked under an inverted pot heaped with embers. Even heat is the only real requirement.","supported":true,"src":"https://en.wikipedia.org/wiki/Cake"},{"in":["malt","steam"],"out":"wort","why":"Mashing wants a held temperature, not a boil — around 65 °C, where the malt's enzymes work fastest without cooking themselves.","supported":true,"src":"https://en.wikipedia.org/wiki/Mashing"},{"in":["wort"],"verb":"ferment","out":"beer","why":"Wild fermentation needs no added yeast at all. Lambic brewers still leave the wort open overnight and let the air inoculate it.","supported":true,"src":"https://en.wikipedia.org/wiki/History_of_beer"},{"in":["grape","stone"],"out":"grape_juice","why":"Stone presses and treading both work by the same principle: enough pressure to split the skins, not enough to crush the bitter pips.","supported":true,"src":"https://en.wikipedia.org/wiki/Winemaking"},{"in":["cider"],"verb":"ferment","out":"vinegar","why":"Cider vinegar is the same second fermentation as wine vinegar — Acetobacter oxidising alcohol into acetic acid.","supported":true,"src":"https://en.wikipedia.org/wiki/Acetic_acid_bacteria"},{"in":["apple","stone"],"out":"apple_juice","why":"A scratter breaks the fruit, a press squeezes it. Whole apples will not give up juice to pressure alone.","supported":true,"src":"https://en.wikipedia.org/wiki/Food_browning"},{"in":["apple_juice","yeast"],"out":"cider","why":"Adding a chosen yeast makes the result predictable. Left wild, the same juice can go anywhere — which is the point, for some cidermakers.","supported":true,"src":"https://en.wikipedia.org/wiki/Cider"},{"in":["olive","stone"],"out":"olive_oil","why":"Traditional mills crush olives, stones and all, under a granite wheel. The stone fragments are filtered out afterwards.","supported":true,"src":"https://en.wikipedia.org/wiki/Olive_oil_extraction"},{"in":["sugarcane","stone"],"out":"cane_juice","why":"Roller mills crush the cane between stones or iron. The fibrous residue, bagasse, is burnt to fire the boiling pans.","supported":true,"src":"https://en.wikipedia.org/wiki/Sugarcane"},{"in":["cane_juice","fire"],"out":"sugar","why":"Boiled in open pans over cane-trash fires until it crystallises. The process is unchanged in principle since medieval Persia.","supported":true,"src":"https://en.wikipedia.org/wiki/Molasses"},{"in":["sugar","fire"],"out":"caramel","why":"Direct flame is harder to control than an oven. Caramel goes from perfect to burnt in about fifteen seconds.","supported":true,"src":"https://en.wikipedia.org/wiki/Caramelization"},{"in":["mead_must"],"verb":"ferment","out":"mead","why":"Honey carries its own wild yeast, dormant and waiting for dilution. Mead will start on its own if you let it.","supported":true,"src":"https://en.wikipedia.org/wiki/Jiahu"},{"in":["cabbage"],"verb":"ferment","out":"sauerkraut","why":"No starter culture is added, ever. The lactobacilli are already on the leaves — the salt simply clears the field for them.","supported":true,"src":"https://en.wikipedia.org/wiki/Sauerkraut"},{"in":["salted_cabbage","chilli"],"out":"kimchi","why":"Chilli arrived in Korea only in the 16th century. Kimchi is far older than its colour.","supported":true,"src":"https://en.wikipedia.org/wiki/Kimchi"},{"in":["cucumber","vinegar"],"out":"pickle","why":"A vinegar pickle is preserved on arrival rather than fermented. Faster, sharper, and it never develops the depth of a brined one.","supported":true,"src":"https://en.wikipedia.org/wiki/Pickling"},{"in":["tomato"],"verb":"crush","out":"passata","why":"Raw passata keeps the fresh acidity that cooking drives off. Both are correct; they are different sauces.","supported":true,"src":"https://en.wikipedia.org/wiki/Lycopene"},{"in":["fish","brine"],"out":"salt_fish","why":"Wet-salting in brine draws water out more evenly than dry salt, and does not burn the surface of the fillet.","supported":true,"src":"https://en.wikipedia.org/wiki/Dried_and_salted_cod"},{"in":["meat","flint"],"out":"mince","why":"Chopped rather than ground. Two blades and a board give a coarser mince that holds its texture better than anything extruded.","supported":true,"src":"https://en.wikipedia.org/wiki/Ground_meat"},{"in":["meat","fire"],"out":"roast","why":"Direct flame browns faster than an oven and cooks less evenly — which is why spit-roasting turns.","supported":true,"src":"https://en.wikipedia.org/wiki/Maillard_reaction"},{"in":["meat","brine"],"out":"cured_meat","why":"Brining cures right through a thick cut where dry salt would only ever reach the surface.","supported":true,"src":"https://en.wikipedia.org/wiki/Curing_(food_preservation)"},{"in":["cured_meat","charcoal"],"out":"bacon","why":"Cold smoke — under 30 °C — flavours and preserves without cooking. Hot smoking does both at once and gives a different product.","supported":true,"src":"https://en.wikipedia.org/wiki/Smoking_(cooking)"},{"in":["cured_mince","chilli"],"out":"sausage","why":"Chilli, paprika and pepper were preservatives before they were flavours. Chorizo and 'nduja are salt-and-spice preservation first.","supported":true,"src":"https://en.wikipedia.org/wiki/Sausage"},{"in":["meatball_mix","flour"],"out":"meatball","why":"Flour binds where egg is scarce, and gives a firmer ball that holds up to long simmering.","supported":true,"src":"https://en.wikipedia.org/wiki/Meatball"},{"in":["fish","water"],"out":"broth","why":"Fish stock is done in twenty minutes. Any longer and the delicate proteins break down and turn it bitter.","supported":true,"src":"https://en.wikipedia.org/wiki/Gelatin"},{"in":["broth","ice"],"out":"aspic","why":"Rapid chilling sets gelatin clearer than slow cooling, which is why clarified aspic is iced rather than left.","supported":true,"src":"https://en.wikipedia.org/wiki/Aspic"},{"in":["broth","herb"],"out":"soup","why":"A bundle of herbs added late and pulled out before serving. Cooked too long, the aromatics boil off entirely.","supported":true,"src":"https://en.wikipedia.org/wiki/Soup"},{"in":["milk"],"verb":"crush","out":"butter","why":"Whole milk can be churned directly, without separating cream first. It takes far longer and gives less — but it works.","supported":true,"src":"https://en.wikipedia.org/wiki/Churning_(butter)"},{"in":["butter","fire"],"out":"ghee","why":"Watch for the milk solids browning and the bubbling to go quiet: that silence is the water gone.","supported":true,"src":"https://en.wikipedia.org/wiki/Ghee"},{"in":["cream"],"verb":"ferment","out":"yoghurt","why":"Cultured cream is the same organisms on a richer substrate — crème fraîche and soured cream by another name.","supported":true,"src":"https://en.wikipedia.org/wiki/Yogurt"},{"in":["milk","wine"],"out":"curd","why":"Any acid will do it. Wine, lemon and vinegar all drop the pH far enough for casein to clump out of the liquid.","supported":true,"src":"https://en.wikipedia.org/wiki/Curd"},{"in":["curd","brine"],"out":"cheese","why":"Brined cheeses — feta, halloumi, telemea — cure in salt water rather than dry salt, and keep for months in it.","supported":true,"src":"https://en.wikipedia.org/wiki/Cheese"},{"in":["cheese"],"verb":"chill","out":"aged_cheese","why":"Cheese caves hold about 10 °C and high humidity. Cold slows the enzymes to a pace that builds flavour instead of rot.","supported":true,"src":"https://en.wikipedia.org/wiki/Cheese_ripening"},{"in":["aged_cheese","mould"],"out":"blue_cheese","why":"Older curd gives the mould more broken-down fat and protein to work on, and a sharper result.","supported":true,"src":"https://en.wikipedia.org/wiki/Blue_cheese"},{"in":["mould","broth"],"out":"penicillin","why":"Fleming's mould made almost nothing useful. Growing it in deep broth tanks is what turned a curiosity into a drug — Peoria, 1941, in corn steep liquor.","supported":true,"src":"https://en.wikipedia.org/wiki/History_of_penicillin"},{"in":["sweet_cream"],"verb":"chill","out":"ice_cream","why":"Freeze without stirring and you get a solid block of ice crystals. The churn is not optional.","supported":true,"src":"https://en.wikipedia.org/wiki/Ice_cream"},{"in":["egg","water"],"out":"boiled_egg","why":"Older eggs peel more easily: the membrane loosens as the air cell inside grows over weeks.","supported":true,"src":"https://en.wikipedia.org/wiki/Boiled_egg"},{"in":["rice","water"],"out":"cooked_rice","why":"Absorption rather than boiling. The rice takes up exactly its own volume and a half, and nothing is poured away.","supported":true,"src":"https://en.wikipedia.org/wiki/Starch_gelatinization"},{"in":["cooked_rice","sugar"],"out":"sushi_rice","why":"Vinegar, sugar and salt together — the sugar rounds off the acid and gives the grains their gloss.","supported":true,"src":"https://en.wikipedia.org/wiki/Sushi"},{"in":["potato","fire"],"out":"baked_potato","why":"Buried in embers, skin on. The skin chars and seals, and the inside steams in its own moisture.","supported":true,"src":"https://en.wikipedia.org/wiki/Baked_potato"},{"in":["potato","ghee"],"out":"chips","why":"Clarified fat has no water and no milk solids, so it can run far hotter before it smokes.","supported":true,"src":"https://en.wikipedia.org/wiki/French_fries"},{"in":["leaf","tomato"],"out":"salad","why":"Leaves bruise where they are torn and seal where they are cut — which is why salad leaves are torn by hand, not chopped.","supported":true,"src":"https://en.wikipedia.org/wiki/Salad"},{"in":["olive_salad","curd"],"out":"greek_salad","why":"Fresh white cheese rather than aged: barrel-matured feta is the traditional choice, salty enough to season the whole bowl.","supported":true,"src":"https://en.wikipedia.org/wiki/Greek_salad"},{"in":["flatbread","cheese"],"out":"cheese_toastie","why":"Thin bread melts the cheese before the crust burns. Thick bread gets the opposite problem.","supported":true,"src":"https://en.wikipedia.org/wiki/Cheese"},{"in":["flatbread","passata"],"out":"pizza_base","why":"Pizza is flatbread with something on it. The tomato only arrived after the Americas did.","supported":true,"src":"https://en.wikipedia.org/wiki/Neapolitan_pizza"},{"in":["pizza_base","curd"],"out":"pizza","why":"Fresh mozzarella is a curd cheese, stretched in hot whey. It melts because it never fully dried out.","supported":true,"src":"https://en.wikipedia.org/wiki/History_of_pizza"},{"in":["fish","fire"],"out":"grilled_fish","why":"Skin-side to the flame. The skin contracts and shields the flesh, which would dry out in seconds if exposed.","supported":true,"src":"https://en.wikipedia.org/wiki/Fish_as_food"},{"in":["ash","sea"],"out":"lye","why":"Burn seaweed or saltmarsh plants and the ash gives soda rather than potash. Spain's barilla trade existed entirely to supply it.","supported":true,"src":"https://en.wikipedia.org/wiki/Lye"},{"in":["honey"],"verb":"crush","out":"beeswax","why":"Crushing the comb separates the two products at once: honey drains out, wax floats up when the residue is warmed in water.","supported":true,"src":"https://en.wikipedia.org/wiki/Beeswax"},{"in":["grass","river"],"out":"sugarcane","why":"Cane is thirsty — roughly 1,500 litres of water for every kilo of sugar. It grows where rivers are, or where irrigation pretends there is one.","supported":true,"src":"https://en.wikipedia.org/wiki/Sugarcane"},{"in":["honey","river"],"out":"mead_must","why":"Meadmakers argue about water endlessly. Soft water lets the honey speak; hard water adds minerals the yeast rather likes.","supported":true,"src":"https://en.wikipedia.org/wiki/Water_activity"},{"in":["herb","ghee"],"out":"herb_oil","why":"Clarified butter carries aromatics as well as oil does and takes far more heat before it burns — which is why tempering spices uses it.","supported":true,"src":"https://en.wikipedia.org/wiki/Essential_oil"},{"in":["straw"],"verb":"wait","out":"mould","why":"Damp hay moulds within days, and warms as it does. Barn fires start this way — microbial heat, not a spark.","supported":true,"src":"https://en.wikipedia.org/wiki/Penicillium"},{"in":["dinner","wine"],"out":"feast","why":"A feast is a decision to make eating take longer than it needs to. Every culture found the same excuse.","supported":true,"src":"https://en.wikipedia.org/wiki/Communal_meal"},{"in":["wood"],"verb":"wait","out":"soil","why":"A fallen trunk becomes soil over decades, and feeds the next tree while it does. Foresters call them nurse logs.","supported":true,"src":"https://en.wikipedia.org/wiki/Soil_formation"},{"in":["charcoal","spark"],"out":"fire","why":"Charcoal is harder to light than wood and far hotter once lit. It needs a bed of tinder first, then it will hold heat for hours.","supported":true,"src":"https://en.wikipedia.org/wiki/Control_of_fire_by_early_humans"},{"in":["malt"],"verb":"crush","out":"flour","why":"Malt flour is sweet and used in bread for exactly that: the sugars feed the yeast and darken the crust.","supported":true,"src":"https://www.smithsonianmag.com/smart-news/flour-was-part-human-diet-32000-years-ago-180956675/"},{"in":["brine"],"verb":"heat","out":"salt","why":"Boiling brine rather than seawater saves enormous fuel — the concentration work has already been done by the sun.","supported":true,"src":"https://en.wikipedia.org/wiki/Salt_evaporation_pond"},{"in":["glass"],"verb":"crush","out":"sand","why":"Crushed glass — cullet — melts at a lower temperature than raw sand, so every glassworks recycles its own.","supported":true,"src":"https://en.wikipedia.org/wiki/Sand"},{"in":["charcoal","fire"],"out":"ash","why":"Charcoal leaves very little ash, because the volatile fraction has already gone. What remains is almost pure mineral.","supported":true,"src":"https://en.wikipedia.org/wiki/Wood_ash"},{"in":["grass"],"verb":"wait","out":"straw","why":"Cut grass left to dry is hay — winter feed, and the reason livestock could be kept through a season with nothing growing.","supported":true,"src":"https://en.wikipedia.org/wiki/Straw"},{"in":["chicken"],"verb":"cut","out":"meat","why":"White meat is muscle built for short bursts; the leg is darker because it works all day. Colour is a record of use.","supported":true,"src":"https://en.wikipedia.org/wiki/Meat"},{"in":["chicken","water"],"out":"broth","why":"The feet make the best stock — almost pure collagen, and nothing else on the bird sets a broth so firmly.","supported":true,"src":"https://en.wikipedia.org/wiki/Gelatin"},{"in":["chicken","grain"],"out":"egg","why":"Shell quality tracks the hen's calcium. Layers are fed ground oyster shell for exactly this reason.","supported":true,"src":"https://en.wikipedia.org/wiki/Eggshell"},{"in":["apple"],"verb":"wait","out":"yeast","why":"Windfalls ferment where they lie. The smell of a neglected orchard in autumn is wild yeast at work.","supported":true,"src":"https://en.wikipedia.org/wiki/Saccharomyces_cerevisiae"},{"in":["tree","sickle"],"out":"wood","why":"A billhook and a sickle share an ancestor. Curved blades cut green wood far better than straight ones.","supported":true,"src":"https://en.wikipedia.org/wiki/Wood"},{"in":["stone","wood"],"out":"sickle","why":"Before flint was set in a handle, a sharpened stone lashed to a bent stick did the same job — badly, but well enough to start farming.","supported":true,"src":"https://en.wikipedia.org/wiki/Sickle"},{"in":["harvest","wood"],"out":"granary","why":"Raised on staddle stones so rats cannot climb in. The mushroom-shaped bases are the whole invention.","supported":true,"src":"https://en.wikipedia.org/wiki/History_of_writing"},{"in":["salt_fish","charcoal"],"out":"smoked_fish","why":"Salt first, then smoke. The salt draws out water and the smoke seals the surface — two preservatives doing different jobs.","supported":true,"src":"https://en.wikipedia.org/wiki/Smoked_fish"},{"in":["glass","brick"],"out":"greenhouse","why":"A brick back wall stores the day's heat and releases it overnight. Victorian glasshouses were built south-facing for exactly this.","supported":true,"src":"https://en.wikipedia.org/wiki/Greenhouse"},{"in":["greenhouse","sprout"],"out":"early_crop","why":"Sowing under glass moves the season forward by weeks, which for a market gardener is the difference between a good price and a glut.","supported":true,"src":"https://en.wikipedia.org/wiki/Greenhouse"},{"in":["soap","river"],"out":"clean_hands","why":"Running water matters as much as the soap. Washing in a still bowl simply redistributes what came off.","supported":true,"src":"https://pmc.ncbi.nlm.nih.gov/articles/PMC4563982/"},{"in":["garlic","ghee"],"out":"garlic_butter","why":"Garlic in clarified butter can be taken much hotter without the milk solids burning and turning it acrid.","supported":true,"src":"https://en.wikipedia.org/wiki/Garlic_butter"},{"in":["garlic_butter","flatbread"],"out":"garlic_bread","why":"Thin bread takes the butter right through rather than leaving a soaked top and a dry base.","supported":true,"src":"https://en.wikipedia.org/wiki/Garlic_bread"},{"in":["flatbread","meat"],"out":"wrap","why":"Meat straight off the grill into bread, no plate involved. The oldest fast food there is.","supported":true,"src":"https://en.wikipedia.org/wiki/Wrap_(food)"},{"in":["caramel","milk"],"out":"caramel_sauce","why":"Milk gives a thinner, lighter sauce than cream — and scorches faster, because there is less fat protecting the sugars.","supported":true,"src":"https://en.wikipedia.org/wiki/Caramel"},{"in":["ice_cream","honey"],"out":"sundae","why":"Honey does not freeze solid, so it stays pourable straight from the fridge. Its water is already spoken for.","supported":true,"src":"https://en.wikipedia.org/wiki/Sundae"},{"in":["sauerkraut","bacon"],"out":"choucroute","why":"Smoked pork and soured cabbage: fat and acid balancing each other, and both preserved by the same autumn.","supported":true,"src":"https://en.wikipedia.org/wiki/Choucroute_garnie"},{"in":["bacon","boiled_egg"],"out":"breakfast","why":"The cooked breakfast is a Victorian invention of the leisured classes, later sold to everyone else as tradition.","supported":true,"src":"https://en.wikipedia.org/wiki/Edward_Bernays"},{"in":["aged_cheese","grape"],"out":"cheeseboard","why":"The old rule — buy on apples, sell on cheese — is about acid: fruit acid makes almost any cheese taste better than it is.","supported":true,"src":"https://en.wikipedia.org/wiki/Cheese"},{"in":["garlic_yoghurt","herb"],"out":"tzatziki","why":"Dill or mint, depending which coast you are on. Both are there to lift the dairy rather than flavour it.","supported":true,"src":"https://en.wikipedia.org/wiki/Strained_yogurt"},{"in":["mayonnaise","baked_potato"],"out":"potato_salad","why":"Floury baked potato absorbs dressing where waxy boiled potato only wears it. Different dish entirely.","supported":true,"src":"https://en.wikipedia.org/wiki/Potato_salad"},{"in":["egg_mayo","flatbread"],"out":"egg_sandwich","why":"The filling is the structure here — flatbread brings nothing but a way to hold it.","supported":true,"src":"https://en.wikipedia.org/wiki/Sandwich"},{"in":["butter","cooked_rice"],"out":"pilaf","why":"Butter browns the grains slightly before the stock goes in, which is where a pilaf gets its nutty edge.","supported":true,"src":"https://en.wikipedia.org/wiki/Pilaf"},{"in":["dough","brine"],"out":"salted_dough","why":"Dissolving the salt first distributes it evenly. Dry salt against raw yeast kills it on contact.","supported":true,"src":"https://en.wikipedia.org/wiki/Bread"},{"in":["butter","honey"],"out":"creamed_butter","why":"Honey creams less air in than sugar — no crystals to tear bubbles — so a honey cake is denser and stays moist far longer.","supported":true,"src":"https://en.wikipedia.org/wiki/Creaming_(cooking)"},{"in":["creamed_butter","milk"],"out":"cake_mix","why":"Add the liquid slowly or the emulsion splits and the trapped air escapes. Curdled batter bakes heavy.","supported":true,"src":"https://en.wikipedia.org/wiki/Cake"},{"in":["cream","honey"],"out":"sweet_cream","why":"Honey's fructose lowers the freezing point further than sugar does, giving a softer set.","supported":true,"src":"https://en.wikipedia.org/wiki/Ice_cream"},{"in":["flatbread"],"verb":"crush","out":"breadcrumb","why":"Dry flatbread shatters into fine even crumb. Soft bread tears into fluff and has to be dried first.","supported":true,"src":"https://en.wikipedia.org/wiki/Breadcrumbs"},{"in":["cured_mince","breadcrumb"],"out":"meatball_mix","why":"Salting the mince first pulls out the sticky protein, so the crumb binds into a mix that holds without egg.","supported":true,"src":"https://en.wikipedia.org/wiki/Meatball"},{"in":["meatball","tomato"],"out":"meatball_sauce","why":"Fresh tomato breaks down into sauce around the meatballs and takes their fat with it as it goes.","supported":true,"src":"https://en.wikipedia.org/wiki/Tomato_sauce"},{"in":["salad","olive_oil"],"out":"olive_salad","why":"Oil goes on before anything acidic. It coats the leaves and keeps the vinegar from drawing out their water.","supported":true,"src":"https://en.wikipedia.org/wiki/Greek_salad"},{"in":["flour","cider"],"out":"batter","why":"Cider batter works like beer batter and tastes of apple. Any carbonated liquid will lighten it.","supported":true,"src":"https://en.wikipedia.org/wiki/Batter_(cooking)"},{"in":["battered_fish","olive_oil"],"out":"fried_fish","why":"The oil must be hot enough that the batter seals in seconds. Below about 170 °C it drinks the fat instead.","supported":true,"src":"https://en.wikipedia.org/wiki/Fried_fish"},{"in":["flour","ghee"],"out":"rubbed_flour","why":"Ghee is pure fat, so it coats the flour more completely than butter — a shorter, more crumbly pastry.","supported":true,"src":"https://en.wikipedia.org/wiki/Shortcrust_pastry"},{"in":["mince","brine"],"out":"cured_mince","why":"Brining mince is how the salt reaches every part of it. Dry salt on the surface would never distribute.","supported":true,"src":"https://en.wikipedia.org/wiki/Sausage"},{"in":["chilli","onion"],"out":"kimchi_paste","why":"Onion and pear are ground in for their sugars, which feed the fermentation as much as they sweeten it.","supported":true,"src":"https://en.wikipedia.org/wiki/Kimchi"},{"in":["clay","ash"],"out":"tempered_clay","why":"Wood ash and crushed shell were used as temper long before sand. Ash also fluxes the surface into a rough natural glaze.","supported":true,"src":"https://en.wikipedia.org/wiki/Temper_(pottery)"},{"in":["tempered_clay","charcoal"],"out":"stoneware","supported":true,"why":"Charcoal burns far hotter than wood. A charcoal-fired kiln reaches the ~1,200 °C that vitrifies stoneware, which an open wood fire never will.","src":"https://en.wikipedia.org/wiki/Stoneware"},{"in":["sea","sand"],"out":"limestone","why":"Shell sand is limestone in the making: crushed shell and coral, waiting to be buried and pressed.","supported":true,"src":"https://en.wikipedia.org/wiki/Limestone"},{"in":["limestone","mud"],"out":"cement_meal","why":"Any alumino-silicate will do for the second ingredient — clay, shale or river mud all supply it.","supported":true,"src":"https://en.wikipedia.org/wiki/Portland_cement"},{"in":["cement_meal","fire"],"out":"cement","why":"The first Portland cement was burnt in bottle kilns fired with coal. Continuous rotary kilns came sixty years later.","supported":true,"src":"https://en.wikipedia.org/wiki/Portland_cement"},{"in":["cement","water"],"out":"mortar","why":"Cement sets by hydration, not drying — it will harden perfectly well underwater, which is how bridge piers are built.","supported":true,"src":"https://en.wikipedia.org/wiki/Mortar_(masonry)"},{"in":["cement","stone"],"out":"concrete","why":"The aggregate is most of the volume and most of the strength. The cement is only the glue between stones.","supported":true,"src":"https://en.wikipedia.org/wiki/Concrete"},{"in":["meadow","stone"],"out":"goat","why":"Goats climb. They reach browse on cliffs and walls no other livestock can, which is why islands and mountains kept them.","supported":true,"src":"https://en.wikipedia.org/wiki/Goat"},{"in":["stone","charcoal"],"out":"philosopher_stone","why":"Alchemists heated everything with charcoal and watched for a change of colour. They found phosphorus, antimony and a great deal of chemistry.","supported":true,"src":"https://en.wikipedia.org/wiki/Philosopher's_stone"},{"in":["stone","broth"],"out":"stone_soup","why":"By the time the broth is going, nobody remembers the stone was the point.","supported":true,"src":"https://en.wikipedia.org/wiki/Stone_Soup"},{"in":["dough","sugar"],"out":"gingerbread_man","why":"Honey came first; sugar made gingerbread cheap enough for fairs, and fairings were sold at every one.","supported":true,"src":"https://en.wikipedia.org/wiki/The_Gingerbread_Man"},{"in":["straw","harvest"],"out":"corn_dolly","why":"Made from the last sheaf standing, and kept indoors until the spring sowing.","supported":true,"src":"https://en.wikipedia.org/wiki/Corn_dolly"},{"in":["straw","wood"],"out":"scarecrow","why":"Two sticks and a bundle of straw. The oldest recorded ones stood in Egyptian wheat fields on the Nile.","supported":true,"src":"https://en.wikipedia.org/wiki/Scarecrow"},{"in":["harvest","pot"],"out":"cornucopia","why":"A horn heaped with the harvest, and never emptying. Every abundance myth has one.","supported":true,"src":"https://en.wikipedia.org/wiki/Cornucopia"},{"in":["honey","mead"],"out":"ambrosia","why":"Whatever ambrosia was, the descriptions keep coming back to honey.","supported":true,"src":"https://en.wikipedia.org/wiki/Ambrosia"},{"in":["flour","sun"],"out":"manna","why":"Some think it was tamarisk secretion, some a lichen. It kept for exactly one day, which is the part nobody can explain.","supported":true,"src":"https://en.wikipedia.org/wiki/Manna"},{"in":["egg","sun"],"out":"golden_egg","why":"The goose was killed to find where the gold came from. There was no gold, only a goose.","supported":true,"src":"https://en.wikipedia.org/wiki/The_Goose_that_Laid_the_Golden_Eggs"},{"in":["plant","fruit"],"out":"chilli","supported":true,"why":"Chillies are berries on a small shrub — botanically closer to a tomato than to any spice.","src":"https://en.wikipedia.org/wiki/Capsaicin"},{"in":["sea","river"],"out":"fish","supported":true,"why":"Estuaries are the most productive fish nurseries on Earth: fresh water brings nutrients, salt water brings safety.","src":"https://en.wikipedia.org/wiki/Fish"},{"in":["egg","herb_oil"],"out":"mayonnaise","supported":true,"why":"Any neutral-ish oil emulsifies. Strongly flavoured oil makes a sauce that fights whatever it dresses.","src":"https://en.wikipedia.org/wiki/Lecithin"},{"in":["rubbed_flour","apple"],"out":"apple_pie","supported":true,"why":"Rubbed pastry straight onto the fruit — no blind baking, and the base takes up the juice as it cooks.","src":"https://en.wikipedia.org/wiki/Pectin"},{"in":["wood","water"],"out":"barrel","supported":true,"why":"Long soaking bends oak nearly as well as steam, and coopers used it wherever fuel was dearer than time.","src":"https://en.wikipedia.org/wiki/Barrel"},{"in":["noodle","meatball_sauce"],"out":"spaghetti_meatballs","supported":true,"why":"Fresh noodles finish in the sauce itself, taking up flavour instead of water.","src":"https://en.wikipedia.org/wiki/Spaghetti_and_meatballs"},{"in":["fried_fish","baked_potato"],"out":"fish_and_chips","supported":true,"why":"The baked-potato version predates chips in much of Britain — the fryer came from France later.","src":"https://en.wikipedia.org/wiki/Fish_and_chips"},{"in":["salt_fish","batter"],"out":"battered_fish","supported":true,"why":"Salt cod soaked back to life, then battered. This is the dish as Sephardic cooks actually brought it.","src":"https://en.wikipedia.org/wiki/Fried_fish"},{"in":["cabbage","sea"],"out":"salted_cabbage","supported":true,"why":"Seawater is close to the 2-3% brine a lactic ferment wants. Coastal kitchens simply used it.","src":"https://en.wikipedia.org/wiki/Kimchi"},{"in":["beer"],"verb":"wait","out":"malt_vinegar","supported":true,"why":"Leave beer open and it sours on its own. Acetobacter is airborne and arrives uninvited.","src":"https://en.wikipedia.org/wiki/Vinegar"},{"in":["charcoal"],"verb":"crush","out":"carbon","why":"Charcoal is wood with everything but the carbon baked out — around 90% of what remains. Grind it and you have very nearly the element.","verified":true,"src":"https://en.wikipedia.org/wiki/Charcoal"},{"in":["leaf","water"],"out":"oxygen","why":"Nearly all the oxygen in the atmosphere came out of split water, not out of carbon dioxide. Photosystem II tears four electrons off two water molecules and lets the oxygen go as waste.","verified":true,"src":"https://en.wikipedia.org/wiki/Photosystem_II"},{"in":["steam","charcoal"],"out":"hydrogen","why":"Steam over red-hot carbon: H₂O + C → H₂ + CO. It absorbs heat as it runs, so the fuel has to be reheated constantly to keep it going.","verified":true,"src":"https://en.wikipedia.org/wiki/Water_gas"},{"in":["seed","root"],"out":"legume","why":"Peas, beans, clover and lentils. Their roots grow nodules and invite bacteria in — a deliberate infection the plant controls.","supported":true,"src":"https://en.wikipedia.org/wiki/Legume"},{"in":["legume","soil"],"out":"nitrogen","why":"Air is four fifths nitrogen and almost nothing can touch it: the triple bond is that strong. Rhizobia in the root nodules carry nitrogenase, and spend 16 ATP to break a single molecule.","verified":true,"src":"https://en.wikipedia.org/wiki/Nitrogen_fixation"},{"in":["meat"],"verb":"cut","out":"bone","why":"Collagen gives bone its spring and calcium phosphate gives it stiffness. Take either away and it fails — one snaps, the other bends.","supported":true,"src":"https://en.wikipedia.org/wiki/Bone"},{"in":["bone"],"verb":"heat","out":"phosphorus","why":"Bone ash is mostly calcium phosphate. Phosphorus was first isolated by boiling down urine, and later far more sensibly from bone.","supported":true,"src":"https://en.wikipedia.org/wiki/Phosphorus"},{"in":["stone","steam"],"out":"sulfur","why":"Volcanic vents breathe out sulfurous gas that cools into bright yellow crusts. Miners cut it straight off the rock in slabs.","supported":true,"src":"https://en.wikipedia.org/wiki/Sulfur"},{"in":["hydrogen","oxygen"],"out":"water","why":"Two volumes of hydrogen to one of oxygen, and the energy released is enough to lift a rocket. The product is water and nothing else.","supported":true,"src":"https://en.wikipedia.org/wiki/Water_(data_page)"},{"in":["carbon","oxygen"],"out":"carbon_dioxide","why":"What every fire and every breath produces, and what every leaf is looking for.","supported":true,"src":"https://en.wikipedia.org/wiki/Carbon_dioxide"},{"in":["leaf","carbon_dioxide"],"out":"glucose","why":"Six carbon dioxide, six water and enough light: one glucose. Nearly every calorie you will ever eat was assembled by this reaction.","verified":true,"src":"https://en.wikipedia.org/wiki/Photosynthesis"},{"in":["glucose","glucose"],"out":"starch","why":"Glucose chained head to tail for storage. Bond it the other way round instead and you get cellulose — the same sugar, and we cannot digest it.","supported":true,"src":"https://en.wikipedia.org/wiki/Starch"},{"in":["glucose","nitrogen"],"out":"amino_acid","why":"Carbon skeletons from sugar, nitrogen from the soil. Plants build all twenty; you can only build eleven, which is why the other nine are called essential.","supported":true,"src":"https://en.wikipedia.org/wiki/Amino_acid"},{"in":["amino_acid","sulfur"],"out":"cysteine","why":"Only two of the twenty carry sulfur, and cysteine is the one that matters structurally — its sulfur can reach out and grab another.","supported":true,"src":"https://en.wikipedia.org/wiki/Cysteine"},{"in":["amino_acid","amino_acid"],"out":"dipeptide","why":"A condensation: the carboxyl of one meets the amino group of the other and a whole water molecule leaves. Left alone in water the bond would take 350 to 600 years to undo.","verified":true,"src":"https://en.wikipedia.org/wiki/Peptide_bond"},{"in":["dipeptide","amino_acid"],"out":"polypeptide","why":"Keep adding and the order becomes information. A ribosome reads it off RNA at roughly twenty amino acids a second.","supported":true,"src":"https://en.wikipedia.org/wiki/Peptide"},{"in":["polypeptide"],"verb":"wait","out":"protein","why":"The chain collapses into one specific shape, usually within a second, and the shape is decided entirely by the order of the links. Get it wrong and you have a prion.","supported":true,"src":"https://en.wikipedia.org/wiki/Protein_folding"},{"in":["cysteine","cysteine"],"out":"disulfide","why":"Two sulfurs bond and staple distant parts of a chain together. Perming hair is breaking these and setting them again in a new position.","supported":true,"src":"https://en.wikipedia.org/wiki/Disulfide"},{"in":["protein","disulfide"],"out":"keratin","why":"Hair, nail, horn, hoof, feather and the outer layer of your skin are the same protein family, cross-linked to different densities.","supported":true,"src":"https://en.wikipedia.org/wiki/Keratin"},{"in":["protein"],"verb":"heat","out":"denatured_protein","why":"Heat shakes a folded protein apart and it tangles with its neighbours instead. That is cooking — an egg white going from clear to solid is this and nothing else.","supported":true,"src":"https://en.wikipedia.org/wiki/Denaturation_(biochemistry)"},{"in":["glucose","phosphorus"],"out":"atp","why":"A sugar, a base and three phosphates. Snapping the last phosphate off releases the energy for almost everything you do, and you recycle your own body weight of it daily.","supported":true,"src":"https://en.wikipedia.org/wiki/Adenosine_triphosphate"},{"in":["atp","nitrogen"],"out":"nucleotide","why":"Sugar, phosphate and a nitrogen-rich base. ATP is itself one of these — the cell uses the same part for energy and for information.","supported":true,"src":"https://en.wikipedia.org/wiki/Nucleotide"},{"in":["nucleotide","nucleotide"],"out":"dna","why":"Phosphate bridges the sugars into a backbone and the bases pair across the middle. Two metres of it is folded into every cell you have.","supported":true,"src":"https://en.wikipedia.org/wiki/DNA"},{"in":["protein","olive_oil"],"out":"membrane","why":"Fat tails will not tolerate water, so they turn inward and form a double sheet on their own. Proteins sit in it as doors and pumps.","supported":true,"src":"https://en.wikipedia.org/wiki/Cell_membrane"},{"in":["membrane","dna"],"out":"cell","why":"An inside, a set of instructions, and machinery to read them. Everything you have ever eaten was made of these.","supported":true,"src":"https://en.wikipedia.org/wiki/Cell_(biology)"},{"in":["cell","cell"],"out":"tissue","why":"Cells that stick to each other and specialise. Sticking together at all was the hard part — it took life about three billion years.","supported":true,"src":"https://en.wikipedia.org/wiki/Tissue_(biology)"},{"in":["tissue","protein"],"out":"muscle","why":"Two proteins, actin and myosin, ratcheting past one another. Every movement you have ever made is that, repeated.","supported":true,"src":"https://en.wikipedia.org/wiki/Muscle"},{"in":["muscle"],"verb":"cut","out":"meat","why":"Meat is muscle, rested. Everything above this line — the cell, the protein, the amino acid, the carbon — was already in it.","supported":true,"src":"https://en.wikipedia.org/wiki/Meat"},{"in":["protein","bone"],"out":"collagen","why":"Three chains wound into a rope, and about a third of all the protein in you. It is what holds a body together rather than what makes it move.","supported":true,"src":"https://en.wikipedia.org/wiki/Collagen"},{"in":["collagen"],"verb":"heat","out":"gelatin","why":"Long slow heat unwinds the triple helix into loose strands that grab water as they cool. This is why a good stock sets in the fridge.","supported":true,"src":"https://en.wikipedia.org/wiki/Gelatin"},{"in":["gelatin","broth"],"out":"aspic","why":"Extra gelatin makes the set reliable rather than hopeful — useful when the bones were lean.","supported":true,"src":"https://en.wikipedia.org/wiki/Aspic"},{"in":["protein","atp"],"out":"enzyme","why":"A pocket shaped to hold one molecule and strain it toward breaking. Nearly every step in this whole game is an enzyme doing its job.","supported":true,"src":"https://en.wikipedia.org/wiki/Enzyme"},{"in":["enzyme","grain"],"out":"malt","why":"Malting is just letting the grain make its own enzymes. Add them directly and you skip the germination entirely — which is what industrial brewing does.","supported":true,"src":"https://en.wikipedia.org/wiki/Malting"},{"in":["protein","vinegar"],"out":"curd","why":"Acid unfolds casein as surely as heat does, and the unfolded chains tangle and drop out of the liquid.","supported":true,"src":"https://en.wikipedia.org/wiki/Curdling"},{"in":["nucleotide","phosphorus"],"out":"dna","supported":true,"why":"Phosphate is the bridge: it links the sugar of one nucleotide to the sugar of the next, and that backbone is what makes DNA a chain rather than a pile.","src":"https://en.wikipedia.org/wiki/Phosphodiester_bond"},{"in":["dna"],"verb":"cut","out":"nucleotide","supported":true,"why":"Enzymes cut DNA back into its links. Restriction enzymes do it at specific sequences, which is the whole basis of genetic engineering.","src":"https://en.wikipedia.org/wiki/Restriction_enzyme"},{"in":["protein","butter"],"out":"membrane","supported":true,"why":"Any lipid will form a bilayer. The tails are what refuse water, and it happens on its own the moment they are wet.","src":"https://en.wikipedia.org/wiki/Lipid_bilayer"},{"in":["tissue"],"verb":"cut","out":"cell","supported":true,"why":"Dissociating tissue back into single cells is routine lab work — enzymes digest the matrix holding them together.","src":"https://en.wikipedia.org/wiki/Cell_culture"},{"in":["cell","protein"],"out":"tissue","supported":true,"why":"Cells alone are a suspension. What makes tissue is the protein scaffold between them holding everyone in place.","src":"https://en.wikipedia.org/wiki/Extracellular_matrix"},{"in":["tissue","atp"],"out":"muscle","supported":true,"why":"Muscle without ATP cannot let go. Rigor mortis is exactly that — the filaments locked because the energy to release them has run out.","src":"https://en.wikipedia.org/wiki/Rigor_mortis"},{"in":["tissue","bone"],"out":"collagen","supported":true,"why":"Skin, tendon, cartilage and bone are all collagen with different things packed around it.","src":"https://en.wikipedia.org/wiki/Collagen"},{"in":["collagen","water"],"out":"gelatin","supported":true,"why":"Hot water hydrolyses the triple helix apart. Cold water will not do it, which is why stock has to simmer.","src":"https://en.wikipedia.org/wiki/Gelatin"},{"in":["yeast","protein"],"out":"enzyme","supported":true,"why":"Yeast is a chemical factory that leaks. Brewers and bakers have exploited its enzymes for millennia without knowing they existed.","src":"https://en.wikipedia.org/wiki/Enzyme"},{"in":["starch","protein"],"out":"dough","supported":true,"why":"Dough is starch held in a protein net. Take the protein away and you have a paste that will not rise.","src":"https://en.wikipedia.org/wiki/Dough"},{"in":["bone"],"verb":"crush","out":"carbon","supported":true,"why":"Bone char is carbon with the calcium left in. Sugar refineries used it for centuries to whiten syrup.","src":"https://en.wikipedia.org/wiki/Bone_char"},{"in":["meadow","sun"],"out":"oxygen","supported":true,"why":"A hectare of growing plants releases several tonnes of oxygen a year, all of it split out of water.","src":"https://en.wikipedia.org/wiki/Photosynthesis"},{"in":["steam","carbon"],"out":"hydrogen","supported":true,"why":"The same water gas reaction, run on pure carbon rather than charcoal. Most industrial hydrogen still comes from steam and a fossil carbon source.","src":"https://en.wikipedia.org/wiki/Steam_reforming"},{"in":["legume"],"verb":"wait","out":"nitrogen","supported":true,"why":"When the legume dies the fixed nitrogen is released into the soil. Red clover can leave 50 to 200 pounds an acre behind.","src":"https://en.wikipedia.org/wiki/Nitrogen_fixation"},{"in":["egg"],"verb":"ferment","out":"sulfur","supported":true,"why":"The smell of a rotten egg is hydrogen sulfide — bacteria stripping the sulfur out of the egg's own cysteine.","src":"https://en.wikipedia.org/wiki/Hydrogen_sulfide"},{"in":["ash","bone"],"out":"phosphorus","supported":true,"why":"Bone ash is calcium phosphate. Ground and treated with acid it became the first artificial fertiliser.","src":"https://en.wikipedia.org/wiki/Bone_ash"},{"in":["plant","root"],"out":"legume","supported":true,"why":"Legumes are just plants that struck a bargain: sugar down to the bacteria, fixed nitrogen back up.","src":"https://en.wikipedia.org/wiki/Legume"},{"in":["fish"],"verb":"cut","out":"bone","supported":true,"why":"Fish bones are thin and give up their collagen in twenty minutes. Any longer and the stock turns bitter.","src":"https://en.wikipedia.org/wiki/Stock_(food)"},{"in":["yeast","glucose"],"out":"carbon_dioxide","supported":true,"why":"Yeast eats sugar and breathes out carbon dioxide. Every risen loaf and every bubble in beer is this gas trying to escape.","src":"https://en.wikipedia.org/wiki/Fermentation"},{"in":["starch","enzyme"],"out":"glucose","supported":true,"why":"Amylase cuts starch back into sugar. It is in your saliva — chew bread long enough and it turns sweet in your mouth.","src":"https://en.wikipedia.org/wiki/Amylase"},{"in":["potato"],"verb":"crush","out":"starch","supported":true,"why":"Grate a potato into water and the starch settles out as a white sludge. Wash and dry it and you have pure starch.","src":"https://en.wikipedia.org/wiki/Starch"},{"in":["protein","water"],"out":"amino_acid","supported":true,"why":"Digestion is hydrolysis: enzymes put a water molecule back into every peptide bond and take the chain apart link by link.","src":"https://en.wikipedia.org/wiki/Hydrolysis"},{"in":["keratin"],"verb":"crush","out":"cysteine","supported":true,"why":"Industrial cysteine is still extracted from hair and feathers, because keratin is unusually rich in it.","src":"https://en.wikipedia.org/wiki/Cysteine"},{"in":["polypeptide"],"verb":"cut","out":"dipeptide","supported":true,"why":"Proteases cut chains at specific points. Your stomach is doing this to everything you have eaten today.","src":"https://en.wikipedia.org/wiki/Protease"},{"in":["dipeptide","dipeptide"],"out":"polypeptide","supported":true,"why":"Chains join to chains. Length is what turns a peptide into a protein, and the line between them is a matter of convention.","src":"https://en.wikipedia.org/wiki/Peptide"},{"in":["polypeptide","disulfide"],"out":"protein","supported":true,"why":"Cross-links lock a fold in place. Proteins that have to survive outside a cell — like keratin and insulin — are full of them.","src":"https://en.wikipedia.org/wiki/Protein"},{"in":["cysteine","oxygen"],"out":"disulfide","supported":true,"why":"Two cysteines oxidise and bond, losing two hydrogens. It happens on contact with air, which is why cut hair smells the way it does when burnt.","src":"https://en.wikipedia.org/wiki/Disulfide"},{"in":["protein","sulfur"],"out":"keratin","supported":true,"why":"The more sulfur cross-links, the harder the keratin. Hair is soft, hoof is hard, and the difference is density of disulfide bonds.","src":"https://en.wikipedia.org/wiki/Keratin"},{"in":["protein","salt"],"out":"denatured_protein","supported":true,"why":"Salt unfolds protein as surely as heat does. Curing, brining and salting fish are all denaturation without a fire.","src":"https://en.wikipedia.org/wiki/Denaturation_(biochemistry)"},{"in":["glucose","oxygen"],"out":"atp","supported":true,"why":"Respiration: burn one glucose with oxygen and you get about 30 ATP. Fermentation without oxygen gets two, which is why you breathe.","src":"https://en.wikipedia.org/wiki/Cellular_respiration"},{"in":["yoghurt","kimchi_paste"],"out":"garlic_yoghurt","supported":true,"why":"Any raw allium works. The yoghurt's acid and fat blunt the harshness without cooking it away.","src":"https://en.wikipedia.org/wiki/Tzatziki"},{"in":["boiled_egg","herb_oil"],"out":"egg_mayo","supported":true,"why":"Herb oil emulsifies as readily as plain oil and brings its own seasoning with it.","src":"https://en.wikipedia.org/wiki/Egg_salad"}],"verbs":[{"id":"wait","name":"Wait","emoji":"⏳","unlockedBy":null,"blurb":"Growth, weathering, ageing, decay. Some changes only need time."},{"id":"crush","name":"Crush","emoji":"🪨","unlockedBy":null,"blurb":"Grinding, pressing, milling, churning. Force applied without heat."},{"id":"chill","name":"Chill","emoji":"❄️","unlockedBy":null,"blurb":"Cold is not a technology, it is a night. Available from the start."},{"id":"heat","name":"Heat","emoji":"🔥","unlockedBy":"fire","blurb":"The first tool that makes new molecules rather than smaller pieces."},{"id":"cut","name":"Cut","emoji":"🔪","unlockedBy":"flint","blurb":"Separating one thing into parts. Needs an edge."},{"id":"ferment","name":"Ferment","emoji":"🫧","unlockedBy":"yeast","blurb":"Letting microbes do the work. Controlled, delicious rot."}],"bedrock":{"$comment":"The substrate below the game. NEVER craftable, never on the shelf — it only appears at the bottom of a provenance tree, so the chain ends in real chemistry instead of stopping at a rock. Composition, not provenance: the craft tree says where a thing came from, this says what it is made of.","atoms":[{"id":"el_hydrogen","symbol":"H","number":1,"name":"Hydrogen","srcTitle":"Hydrogen","fact":"The first element, made in the first minutes of the universe. Everything else came later.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Hydrogen","kind":"atom","category":"nonmetal"},{"id":"el_helium","symbol":"He","number":2,"name":"Helium","srcTitle":"Helium","fact":"The ash of the Sun. Four hydrogen nuclei, fused, with a little mass left over as light.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Helium","kind":"atom","category":"noble"},{"id":"el_lithium","symbol":"Li","number":3,"name":"Lithium","srcTitle":"Lithium","src":"https://en.wikipedia.org/wiki/Lithium","kind":"atom","category":"alkali"},{"id":"el_beryllium","symbol":"Be","number":4,"name":"Beryllium","srcTitle":"Beryllium","src":"https://en.wikipedia.org/wiki/Beryllium","kind":"atom","category":"alkaline"},{"id":"el_boron","symbol":"B","number":5,"name":"Boron","srcTitle":"Boron","src":"https://en.wikipedia.org/wiki/Boron","kind":"atom","category":"metalloid"},{"id":"el_carbon","symbol":"C","number":6,"name":"Carbon","srcTitle":"Carbon","fact":"Four bonds, in every direction, endlessly. Every molecule life is built from hangs off carbon.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Carbon","kind":"atom","category":"nonmetal"},{"id":"el_nitrogen","symbol":"N","number":7,"name":"Nitrogen","srcTitle":"Nitrogen","fact":"Four fifths of the air, and almost impossible for life to reach until something fixes it.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Nitrogen","kind":"atom","category":"nonmetal"},{"id":"el_oxygen","symbol":"O","number":8,"name":"Oxygen","srcTitle":"Oxygen","fact":"Most of your body's mass. Forged inside stars and scattered when they died.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Oxygen","kind":"atom","category":"nonmetal"},{"id":"el_fluorine","symbol":"F","number":9,"name":"Fluorine","srcTitle":"Fluorine","src":"https://en.wikipedia.org/wiki/Fluorine","kind":"atom","category":"halogen"},{"id":"el_neon","symbol":"Ne","number":10,"name":"Neon","srcTitle":"Neon","src":"https://en.wikipedia.org/wiki/Neon","kind":"atom","category":"noble"},{"id":"el_sodium","symbol":"Na","number":11,"name":"Sodium","srcTitle":"Sodium","fact":"Half of salt, and the reason a nerve can fire.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Sodium","kind":"atom","category":"alkali"},{"id":"el_magnesium","symbol":"Mg","number":12,"name":"Magnesium","srcTitle":"Magnesium","fact":"One atom sits at the centre of every chlorophyll molecule. Green is magnesium.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Magnesium","kind":"atom","category":"alkaline"},{"id":"el_aluminium","symbol":"Al","number":13,"name":"Aluminium","srcTitle":"Aluminium","fact":"The commonest metal in the crust, and locked so tightly into rock it was a precious metal until 1886.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Aluminium","kind":"atom","category":"post"},{"id":"el_silicon","symbol":"Si","number":14,"name":"Silicon","srcTitle":"Silicon","fact":"After oxygen, the commonest element in the crust. Every rock, every grain of sand.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Silicon","kind":"atom","category":"metalloid"},{"id":"el_phosphorus","symbol":"P","number":15,"name":"Phosphorus","srcTitle":"Phosphorus","fact":"Carries the energy and holds the DNA backbone together. The scarcest of the six.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Phosphorus","kind":"atom","category":"nonmetal"},{"id":"el_sulfur","symbol":"S","number":16,"name":"Sulfur","srcTitle":"Sulfur","fact":"Two amino acids carry it. It is also why onion and garlic fight back.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Sulfur","kind":"atom","category":"nonmetal"},{"id":"el_chlorine","symbol":"Cl","number":17,"name":"Chlorine","srcTitle":"Chlorine","fact":"The other half of salt. Lethal as a gas, essential as an ion.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Chlorine","kind":"atom","category":"halogen"},{"id":"el_argon","symbol":"Ar","number":18,"name":"Argon","srcTitle":"Argon","src":"https://en.wikipedia.org/wiki/Argon","kind":"atom","category":"noble"},{"id":"el_potassium","symbol":"K","number":19,"name":"Potassium","srcTitle":"Potassium","fact":"Leached out of ash as potash. Plants cannot grow without it.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Potassium","kind":"atom","category":"alkali"},{"id":"el_calcium","symbol":"Ca","number":20,"name":"Calcium","srcTitle":"Calcium","fact":"Shell, bone, chalk and limestone are all the same idea.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Calcium","kind":"atom","category":"alkaline"},{"id":"el_scandium","symbol":"Sc","number":21,"name":"Scandium","srcTitle":"Scandium","src":"https://en.wikipedia.org/wiki/Scandium","kind":"atom","category":"transition"},{"id":"el_titanium","symbol":"Ti","number":22,"name":"Titanium","srcTitle":"Titanium","src":"https://en.wikipedia.org/wiki/Titanium","kind":"atom","category":"transition"},{"id":"el_vanadium","symbol":"V","number":23,"name":"Vanadium","srcTitle":"Vanadium","src":"https://en.wikipedia.org/wiki/Vanadium","kind":"atom","category":"transition"},{"id":"el_chromium","symbol":"Cr","number":24,"name":"Chromium","srcTitle":"Chromium","src":"https://en.wikipedia.org/wiki/Chromium","kind":"atom","category":"transition"},{"id":"el_manganese","symbol":"Mn","number":25,"name":"Manganese","srcTitle":"Manganese","src":"https://en.wikipedia.org/wiki/Manganese","kind":"atom","category":"transition"},{"id":"el_iron","symbol":"Fe","number":26,"name":"Iron","srcTitle":"Iron","fact":"The last thing a dying star can make without exploding.","inPlay":true,"src":"https://en.wikipedia.org/wiki/Iron","kind":"atom","category":"transition"},{"id":"el_cobalt","symbol":"Co","number":27,"name":"Cobalt","srcTitle":"Cobalt","src":"https://en.wikipedia.org/wiki/Cobalt","kind":"atom","category":"transition"},{"id":"el_nickel","symbol":"Ni","number":28,"name":"Nickel","srcTitle":"Nickel","src":"https://en.wikipedia.org/wiki/Nickel","kind":"atom","category":"transition"},{"id":"el_copper","symbol":"Cu","number":29,"name":"Copper","srcTitle":"Copper","src":"https://en.wikipedia.org/wiki/Copper","kind":"atom","category":"transition"},{"id":"el_zinc","symbol":"Zn","number":30,"name":"Zinc","srcTitle":"Zinc","src":"https://en.wikipedia.org/wiki/Zinc","kind":"atom","category":"transition"},{"id":"el_gallium","symbol":"Ga","number":31,"name":"Gallium","srcTitle":"Gallium","src":"https://en.wikipedia.org/wiki/Gallium","kind":"atom","category":"post"},{"id":"el_germanium","symbol":"Ge","number":32,"name":"Germanium","srcTitle":"Germanium","src":"https://en.wikipedia.org/wiki/Germanium","kind":"atom","category":"metalloid"},{"id":"el_arsenic","symbol":"As","number":33,"name":"Arsenic","srcTitle":"Arsenic","src":"https://en.wikipedia.org/wiki/Arsenic","kind":"atom","category":"metalloid"},{"id":"el_selenium","symbol":"Se","number":34,"name":"Selenium","srcTitle":"Selenium","src":"https://en.wikipedia.org/wiki/Selenium","kind":"atom","category":"nonmetal"},{"id":"el_bromine","symbol":"Br","number":35,"name":"Bromine","srcTitle":"Bromine","src":"https://en.wikipedia.org/wiki/Bromine","kind":"atom","category":"halogen"},{"id":"el_krypton","symbol":"Kr","number":36,"name":"Krypton","srcTitle":"Krypton","src":"https://en.wikipedia.org/wiki/Krypton","kind":"atom","category":"noble"},{"id":"el_rubidium","symbol":"Rb","number":37,"name":"Rubidium","srcTitle":"Rubidium","src":"https://en.wikipedia.org/wiki/Rubidium","kind":"atom","category":"alkali"},{"id":"el_strontium","symbol":"Sr","number":38,"name":"Strontium","srcTitle":"Strontium","src":"https://en.wikipedia.org/wiki/Strontium","kind":"atom","category":"alkaline"},{"id":"el_yttrium","symbol":"Y","number":39,"name":"Yttrium","srcTitle":"Yttrium","src":"https://en.wikipedia.org/wiki/Yttrium","kind":"atom","category":"transition"},{"id":"el_zirconium","symbol":"Zr","number":40,"name":"Zirconium","srcTitle":"Zirconium","src":"https://en.wikipedia.org/wiki/Zirconium","kind":"atom","category":"transition"},{"id":"el_niobium","symbol":"Nb","number":41,"name":"Niobium","srcTitle":"Niobium","src":"https://en.wikipedia.org/wiki/Niobium","kind":"atom","category":"transition"},{"id":"el_molybdenum","symbol":"Mo","number":42,"name":"Molybdenum","srcTitle":"Molybdenum","src":"https://en.wikipedia.org/wiki/Molybdenum","kind":"atom","category":"transition"},{"id":"el_technetium","symbol"
